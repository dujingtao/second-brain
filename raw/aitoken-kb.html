<title>AI Token 业务知识库 · SpaceTiD</title>
<style>
:root{
  --plane:#060f12; --surface:#0b1417; --surface2:#121f24;
  --line:#1c2d33; --line2:#273c44;
  --tx:#ffffff; --tx2:#b9c6ca; --tx3:#7d9199;
  --brand:#189daf; --brand-lt:#2bc4da; --green:#6aa636;
  --warn:#e0a33e; --crit:#e05252;
  --grad:linear-gradient(115deg,#060f12 0%,#0d3742 42%,#12707d 70%,#4a9c3a 100%);
  --r:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--tx2);
  font-family:Inter,Helvetica,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.85;-webkit-font-smoothing:antialiased}
#wrap{display:flex;min-height:100vh}

/* ---------- 侧栏 ---------- */
#side{width:288px;flex:0 0 288px;background:var(--surface);border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;overflow-y:auto;padding-bottom:36px}
#brand{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
#mark{display:block;width:max-content;margin:0 0 14px -5px;padding:3px 5px;
  text-decoration:none;transition:.15s;border-radius:var(--r)}
#mark img{width:152px;display:block;transition:.15s}
#mark[href]{cursor:pointer}
#mark[href]:hover{background:var(--surface2)}
#mark[href]:hover img{opacity:.8}
#brand h1{margin:0;font-size:13.5px;color:var(--tx);font-weight:600;letter-spacing:.3px}
#brand p{margin:3px 0 0;font-size:11.5px;color:var(--tx3);letter-spacing:.2px}
#search{margin:15px 16px 6px}
#search input{width:100%;padding:9px 12px;background:var(--surface2);border:1px solid var(--line2);
  border-radius:var(--r);color:var(--tx);font-size:13px;outline:none;font-family:inherit}
#search input:focus{border-color:var(--brand)}
#hits{font-size:11px;color:var(--tx3);padding:5px 20px 0;min-height:16px}
nav{padding:6px 10px}
.nitem{display:block;padding:9px 12px;border-radius:var(--r);cursor:pointer;font-size:13.5px;
  color:var(--tx2);border-left:2px solid transparent;transition:.12s}
.nitem:hover{background:var(--surface2);color:var(--tx)}
.nitem.on{background:var(--surface2);color:var(--tx);border-left-color:var(--brand)}
.nitem .c{display:inline-block;width:26px;color:var(--tx3);font-variant-numeric:tabular-nums}
.nitem.on .c{color:var(--brand-lt)}
.nitem.hide{display:none}
.subs{padding:2px 0 8px 40px;display:none}
.nitem.on + .subs{display:block}
.subs a{display:block;font-size:12px;color:var(--tx3);padding:3px 0;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subs a:hover{color:var(--brand-lt)}

/* ---------- 主区 ---------- */
#main{flex:1;min-width:0;max-width:1000px}
#hero{background:var(--grad);padding:44px 56px 38px;position:relative}
#hero .kicker{font-size:11.5px;letter-spacing:3px;color:rgba(255,255,255,.72);
  text-transform:uppercase;margin-bottom:10px}
#hero h2{margin:0;font-size:34px;font-weight:700;color:#fff;letter-spacing:.5px;line-height:1.28}
#hero p{margin:12px 0 0;font-size:13.5px;color:rgba(255,255,255,.78);max-width:640px}
#hero .cls{position:absolute;top:22px;right:26px;font-size:11px;letter-spacing:1.5px;
  color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.28);
  border-radius:var(--r);padding:3px 11px}
#body{padding:34px 56px 40px}
#doc h1{display:none}
#doc h2{font-size:19px;margin:44px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--tx)}
#doc h2:first-child{margin-top:0}
#doc h3{font-size:15.5px;margin:30px 0 10px;color:var(--brand-lt);font-weight:600}
#doc h4{font-size:14.5px;margin:22px 0 8px;color:var(--tx2);font-weight:600}
#doc p{margin:13px 0}
#doc strong{color:#fff;font-weight:600}
#doc blockquote{margin:18px 0;padding:13px 18px;background:var(--surface);
  border-left:2px solid var(--brand);border-radius:0 var(--r) var(--r) 0;color:var(--tx2);font-size:13.5px}
#doc blockquote p{margin:6px 0}
#doc table{border-collapse:collapse;width:100%;margin:20px 0;font-size:13.5px}
#doc th{background:var(--surface2);text-align:left;padding:10px 13px;
  border:1px solid var(--line2);color:var(--tx);font-weight:600;font-size:12.5px}
#doc td{padding:10px 13px;border:1px solid var(--line);
  font-variant-numeric:tabular-nums}
#doc tr:nth-child(even) td{background:rgba(255,255,255,.016)}
#doc code{background:var(--surface2);padding:2px 6px;border-radius:4px;font-size:12.5px;color:#7fd8e4}
#doc pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;overflow-x:auto;margin:18px 0}
#doc pre code{background:none;padding:0;color:#8fd6e0;font-size:12.5px;line-height:1.75}
#doc hr{border:none;border-top:1px solid var(--line);margin:34px 0}
#doc a{color:var(--brand-lt);text-decoration:none;border-bottom:1px solid rgba(43,196,218,.3)}
#doc a:hover{border-bottom-color:var(--brand-lt)}
#doc ul,#doc ol{padding-left:24px}
#doc li{margin:6px 0}
mark{background:rgba(224,163,62,.3);color:#f5d597;border-radius:3px;padding:0 2px}

#pager{display:flex;gap:10px;margin-top:46px}
#pager button{flex:1;background:var(--surface);border:1px solid var(--line2);color:var(--tx2);
  padding:14px 18px;border-radius:var(--r);cursor:pointer;text-align:left;font-size:13px;font-family:inherit}
#pager button:hover:not(:disabled){border-color:var(--brand);color:var(--tx)}
#pager button:disabled{opacity:.3;cursor:default}
#pager button span{display:block;font-size:11px;color:var(--tx3);margin-bottom:3px}

footer{margin-top:52px;padding:22px 0 0;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--tx3);line-height:1.9}
footer b{color:var(--tx2);font-weight:600}
footer .row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

#menubtn{display:none}
@media(max-width:900px){
  #side{position:fixed;left:-288px;z-index:50;transition:.2s;box-shadow:0 0 40px rgba(0,0,0,.7)}
  #side.open{left:0}
  #hero{padding:64px 20px 30px} #hero h2{font-size:25px} #body{padding:26px 20px 40px}
  #menubtn{display:block;position:fixed;top:14px;left:14px;z-index:60;background:rgba(0,0,0,.45);
    border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:var(--r);
    padding:7px 13px;cursor:pointer;font-size:16px}
}
</style>
</head>
<body>
<button id="menubtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
<div id="wrap">
  <aside id="side">

const DOCS = [{"id": "00-知识库总纲", "code": "00", "title": "AI Token 代理与销售业务 · 企业知识库总纲", "short": "AI Token 代理与销售业务 · 企业知识库总纲", "subs": ["一、这份知识库是什么", "二、模块地图", "三、贯穿全局的六条基本认知", "四、使用规范", "五、版本记录"], "html": "<h1>AI Token 代理与销售业务 · 企业知识库总纲</h1>\n<blockquote>\n<p><strong>版本 v2.8</strong> ｜ 更新日期：2026-08-12 ｜ 首版：2026-07-27 ｜ 共 28 个模块\n适用阶段：0→1 起步期\n定位：国内大模型渠道代理 + 多模型聚合网关 + 算力额度批发分销\n版本记录见文末第五节</p>\n</blockquote>\n<hr />\n<h2>一、这份知识库是什么</h2>\n<p>这份知识库不是一份产品说明书，而是这家公司<strong>全部业务认知的底座</strong>。它要同时服务四种使用者：</p>\n<p>第一种是刚入职的销售，他需要在三天内搞清楚我们卖的到底是什么、为什么客户要从我们这里买而不是直接找官方、以及当客户说\"你们不就是个中间商吗\"的时候该怎么回答。第二种是决策层，他需要知道这门生意的钱从哪里赚、风险在哪里、什么时候该踩油门什么时候该刹车。第三种是投资人，他需要在十五分钟内理解这个市场的规模、我们的切入点和护城河。第四种，也是最容易被忽略的一种，是<strong>业务智能体</strong>——我们后续要搭建的 AI Agent 需要吃掉这整份知识库，才能代替人回答客户问题、生成方案、做报价测算。</p>\n<p>所以这份知识库的写法有一个刻意的约束：<strong>每一个论断都要带上它成立的理由和它失效的边界</strong>。只给结论的知识库训练不出会思考的智能体，也培养不出会打硬仗的销售。</p>\n<hr />\n<h2>二、模块地图</h2>\n<table>\n<thead>\n<tr>\n<th>编号</th>\n<th>模块</th>\n<th>核心回答的问题</th>\n<th>主要使用者</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>01</td>\n<td>行业认知与 Token 经济</td>\n<td>这个市场有多大、往哪走、钱在哪</td>\n<td>投资人、决策层、全员</td>\n</tr>\n<tr>\n<td>02</td>\n<td>商业模式与价值主张</td>\n<td>我们凭什么存在、凭什么赚钱</td>\n<td>全员、投资人</td>\n</tr>\n<tr>\n<td>03</td>\n<td>供给体系与产品架构</td>\n<td>我们卖的东西具体是什么、怎么交付</td>\n<td>销售、技术、客户成功</td>\n</tr>\n<tr>\n<td>04</td>\n<td>定价体系与单位经济模型</td>\n<td>一笔单子赚多少、怎么报价不亏</td>\n<td>销售、决策层、财务</td>\n</tr>\n<tr>\n<td>05</td>\n<td>客户分层与场景库</td>\n<td>卖给谁、他们疼在哪</td>\n<td>销售、市场</td>\n</tr>\n<tr>\n<td>06</td>\n<td>销售方法论与话术库</td>\n<td>怎么谈、怎么破异议</td>\n<td>销售</td>\n</tr>\n<tr>\n<td>07</td>\n<td>渠道与代理商体系</td>\n<td>怎么发展下游、怎么分钱</td>\n<td>渠道经理、决策层</td>\n</tr>\n<tr>\n<td>08</td>\n<td>合规与风险控制</td>\n<td>什么不能碰、怎么不出事</td>\n<td>全员、决策层、法务</td>\n</tr>\n<tr>\n<td>09</td>\n<td>运营 SOP 与客户成功</td>\n<td>每天具体怎么干</td>\n<td>全员</td>\n</tr>\n<tr>\n<td>10</td>\n<td>核心论点库与 FAQ</td>\n<td>一句话怎么说服人</td>\n<td>智能体、销售、全员</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>编号 11（品牌视觉规范）已于 v2.8 移除。<strong>后续模块不重新编号</strong>——知识库内有数十处「见模块 XX」的交叉引用，重排会全部失效。编号出现空位是刻意的。</p>\n</blockquote>\n<h3>客户端技术知识库（模块 12–17）</h3>\n<p>客户拿到我们的 Key 之后，会把它填进某个具体的工具里。<strong>这个工具决定了他怎么烧 token、我们要花多少支持成本、以及销售能不能跟他对上话。</strong> 这一组模块把这些工具逐个建档，每个项目都同时回答\"它是什么\"和\"它对我们意味着什么\"。</p>\n<table>\n<thead>\n<tr>\n<th>编号</th>\n<th>模块</th>\n<th>覆盖项目</th>\n<th>主要使用者</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>12</td>\n<td>客户端技术知识库总纲</td>\n<td>技术地图、三种协议、配置速查表、用量预判</td>\n<td>全员、技术支持</td>\n</tr>\n<tr>\n<td>13</td>\n<td>自托管 Agent 与通用助手</td>\n<td>Hermes Agent、OpenClaw、OpenManus、Manus</td>\n<td>销售、技术支持</td>\n</tr>\n<tr>\n<td>14</td>\n<td>API 网关与中转系统</td>\n<td>New API、One API、LiteLLM</td>\n<td>销售、决策层、技术</td>\n</tr>\n<tr>\n<td>15</td>\n<td>桌面客户端</td>\n<td>Cherry Studio、ChatBox、LobeChat、Open WebUI</td>\n<td>市场、技术支持</td>\n</tr>\n<tr>\n<td>16</td>\n<td>编程 Agent</td>\n<td>Claude Code、Cursor、Cline、Roo Code</td>\n<td>销售、技术支持</td>\n</tr>\n<tr>\n<td>17</td>\n<td>应用编排平台</td>\n<td>Dify、Coze、FastGPT、n8n、RAGFlow</td>\n<td>销售、解决方案</td>\n</tr>\n</tbody>\n</table>\n<h3>战略推演（模块 18）</h3>\n<table>\n<thead>\n<tr>\n<th>编号</th>\n<th>模块</th>\n<th>核心回答的问题</th>\n<th>主要使用者</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>18</td>\n<td>战略推演与终局判断</td>\n<td>三年后这行长什么样、我们该往哪站、什么会证明我们错了</td>\n<td>决策层、投资人</td>\n</tr>\n<tr>\n<td>19</td>\n<td>外部观点收录与研判</td>\n<td>外面看到的观点哪些可信、改变了我们什么</td>\n<td>决策层、销售、智能体</td>\n</tr>\n<tr>\n<td>20</td>\n<td>梁文锋 520 投资讲话精华</td>\n<td>上游定价的内在逻辑是什么、我们的空间在哪</td>\n<td>决策层、销售</td>\n</tr>\n<tr>\n<td>21</td>\n<td>客户需求测算与选型方法论</td>\n<td>客户要烧多少、用什么模型、自建还是买 API</td>\n<td><strong>销售必修</strong>、售前、智能体</td>\n</tr>\n<tr>\n<td>22</td>\n<td>国产算力卡现状与对策</td>\n<td>国产卡能不能用、贵不贵、我们的机会在哪</td>\n<td>决策层、销售、售前</td>\n</tr>\n<tr>\n<td>23</td>\n<td>天数智芯档案</td>\n<td>GPGPU 路线代表，已上市、财务可核验</td>\n<td>决策层、销售、售前</td>\n</tr>\n<tr>\n<td>24</td>\n<td>中昊芯英档案</td>\n<td>TPU 路线代表，技术叙事强但资本路径存疑</td>\n<td>决策层、销售、售前</td>\n</tr>\n<tr>\n<td>25</td>\n<td>Token 工厂可行性与起步路径</td>\n<td>我们要不要自己做算力供给、什么时候做、怎么分阶段做</td>\n<td><strong>决策层必读</strong>、投资人</td>\n</tr>\n<tr>\n<td>26</td>\n<td>客户数据使用边界与数据资产化</td>\n<td>客户数据能用到什么程度、怎么提升准确性与速度、上游转售条款风险</td>\n<td><strong>决策层与技术负责人必读</strong>、销售、法务</td>\n</tr>\n<tr>\n<td>27</td>\n<td>量子计算现状与对本业务的影响</td>\n<td>量子发展到哪一步、什么时候出实验室、会不会颠覆 AI、我们要不要布局</td>\n<td>决策层、投资人应答</td>\n</tr>\n<tr>\n<td>28</td>\n<td>大模型自我改进的真实进展</td>\n<td>模型自我升级到哪一步、谁做得最好、会不会改变我们的竞争环境</td>\n<td>决策层、投资人应答、销售</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>🚨 <strong>模块 26 第九节记录了一项影响业务合法性的发现</strong>：阿里、腾讯、智谱的服务协议均明确禁止未经书面许可的转售，智谱直接点名「聚合转发」、腾讯直接点名「API Token」。\n<strong>官方渠道/经销书面授权不是可选项，是第一、三条业务线合法存在的前提。</strong> 签约与商务谈判前必须先读该节。</p>\n<p>⚠️ 模块 20 的材料真实性未经当事人确认，且含违反会议约定流出的非公开数据。\n<strong>一律标记「待证实」，其中的算力、成本、融资等数字严禁出现在任何对外材料中。</strong> 详见该模块开头。</p>\n<p>⚠️ 模块 24（中昊芯英）中，网络流传的财务数据与市值预期存在严重失实与内部矛盾。\n<strong>该模块第九节列出了完整的证伪过程，引用任何数据前必须先读该节。</strong></p>\n</blockquote>\n<hr />\n<h2>三、贯穿全局的六条基本认知</h2>\n<p>这六条是整个业务的\"第一性原理\"，其他所有内容都是它们的展开。任何一条被市场证伪，业务策略就要重做。</p>\n<p><strong>第一条：不管单价怎么走，Token 总支出一直在涨。</strong></p>\n<blockquote>\n<p>⚠️ <strong>2026-07 修正（第一次）</strong>：本条原表述为\"单价在跌\"。2026 年的实际情况是行业已从价格战转入价值战，部分厂商在涨价——智谱的公开数据是 API 定价提升 83%、同期 token 消耗增长 400%。<strong>原表述的前提已被证伪，但结论反而更强了。</strong> 详见模块 18 第三节。</p>\n<p>⚠️ <strong>2026-07 再修正（第二次，触发来源：模块 25）</strong>：上一次修正把方向说过头了。\"2026 进入涨价周期\"这个表述<strong>过于绝对</strong>。同期的反向证据同样扎实：自 2023 年起 API 累计降价十余次、部分模型累计降幅超 90%；<strong>DeepSeek V4-Pro 降价 75% 至 6 元/百万 Token，小米、腾讯随后跟进，降幅达 97.5%–99%</strong>。\n<strong>准确的表述是「市场分化」，不是单向涨价</strong>——一部分厂商（智谱等）涨价走<strong>价值战</strong>，靠能力溢价；另一部分（DeepSeek 系及跟进者）继续降价走<strong>规模战</strong>，靠成本领先与体量。\n<strong>对我们的实际含义</strong>：不能用\"涨价周期\"给囤货加杠杆，也不能用\"必然降价\"给自建算成本账。<strong>上游价格方向已不可单向预测，任何依赖价格方向的策略都必须做双向压力测试。</strong></p>\n</blockquote>\n<p>这是这门生意能成立的根本前提。2023–2025 年通用模型单价降幅可达 99%，2026 年则走向分化、部分厂商反向涨价——<strong>但无论单价往哪走、如何分化，企业侧的总支出始终在涨</strong>，因为工作负载从\"简单问答\"迁移到了\"Agent 循环调用 + 长上下文推理 + 代码生成\"，单任务的 token 消耗可以是简单问答的十倍到百倍。Uber 向 5000 名工程师开放 AI 编程工具后四个月烧光全年预算，米哈游一位工程师做多 Agent 协作测试 13 小时产生 200 万元账单——这类案例说明的不是\"AI 太贵\"，而是<strong>用量的爆发速度远超单价的下跌速度</strong>。做量的生意，永远比做价的生意安全。</p>\n<p>还有一条反直觉但必须记住的事实：<strong>低价模型往往更贵。</strong> 能力弱的模型需要更多轮次、更长的思考链、更多重试才能完成同一个任务，总消耗反而高于直接用贵模型一次做对。<strong>客户真正付的是\"单位任务成本\"，不是\"单价\"</strong>——这是我们做选型咨询时最有说服力的一个论点。</p>\n<p><strong>第二条：我们赚的不是差价，是\"复杂度税\"。</strong>\n如果客户能轻松直连官方、拿到最优价、自己做好多模型路由和成本管控，那我们确实没有存在价值。但现实是：一家 AI 创业公司要同时接 DeepSeek、通义、豆包、Kimi 和一两个海外模型，意味着五套协议、五套账单、五个充值账户、五套限流规则、五份合规材料。我们把这五套变成一套，节省下来的工程时间、财务时间和合规时间，才是客户愿意付的钱。<strong>差价是收入的形式，复杂度是收入的实质。</strong></p>\n<p><strong>第三条：0→1 阶段不要打价格战，要打确定性战。</strong>\n我们没有规模，拿不到最低的上游折扣，价格战必输。但初创客户最怕的不是贵一点，是<strong>限流、掉线、账单看不懂、要发票开不出来</strong>。稳定性、可观测性、合规票据这三件事的价值，在客户被官方限流一次之后会瞬间放大十倍。</p>\n<p><strong>第四条：客户结构决定公司命运，不能只做一类客户。</strong>\n只做 AI 创业公司，现金流好但客户死亡率高、议价能力弱；只做大企业，单笔大但周期长、账期长、要资质；只做长尾开发者，量小但笔数多、口碑扩散快；只做下游代理，杠杆大但一旦渠道失控就是灾难。健康的结构是<strong>四条腿走路，且任何一类客户占比不超过 40%</strong>。</p>\n<p><strong>第五条：合规不是成本，是准入门槛，也是竞争壁垒。</strong>\n2026 年起，通过 API 调用第三方大模型面向公众提供服务的应用，必须在显著位置公示所用模型的名称、国家网信办备案号和属地登记编号，并留存 API 服务协议、模型备案文件、6 个月以上的接口调用日志。大量野生\"中转站\"做不到这一点。我们把合规做扎实，等于自动淘汰掉一批竞争对手，并拿到大企业客户的入场券。</p>\n<p><strong>第六条：这门生意的终局不是卖 token，是卖\"AI 成本管理能力\"。</strong>\n纯转售的毛利会被持续压缩，这是确定的趋势。真正能沉淀下来的资产是：客户的调用数据、成本优化模型、模型选型经验、场景化的 prompt 与路由策略。今天卖 token 是为了拿到这些数据，明天靠这些数据卖 FinOps 和优化服务。<strong>转售是入口，管理是终局。</strong></p>\n<p>补充一条必须与第六条一起记住的推论（详见模块 18）：<strong>\"切换成本极低\"这个让我们得以进场的前提，同样意味着我们自己随时可以被绕过。</strong> 我们没有模型能力、没有品牌、没有沉没成本，是整条链上最容易被替换的一环。因此<strong>不做技术锁定，就必须做能力锁定</strong>——让客户走得动但不想走。这件事有没有做成，决定了三年后我们还在不在。</p>\n<hr />\n<h2>四、使用规范</h2>\n<p>知识库按模块独立成文，可单独分发。修改需遵循三条规则：一是<strong>事实类内容必须标注来源和采集日期</strong>，价格类数据变动频繁，超过 30 天未复核的价格表默认视为过期；二是<strong>论点类内容必须同时给出反方视角</strong>，只有正面论证的话术在真实谈判中会被一击即溃；三是<strong>案例类内容必须脱敏</strong>，客户名称、具体金额在对外版本中一律做匿名化处理。</p>\n<p>对外分发时注意版本区分：给客户和投资人的版本需要删除模块 04（单位经济模型）中的上游成本与真实毛利数据，以及模块 07（渠道体系）中的分润底线。这两块是公司的商业机密。<strong>模块 20 含未经证实且属泄露性质的第三方非公开数据，任何对外版本一律整体删除。</strong></p>\n<hr />\n<h2>五、版本记录</h2>\n<p>版本号规则：<strong>主版本号</strong>在新增整个板块或发生结构性调整时递增；<strong>次版本号</strong>在新增单个模块或对既有判断做出修正时递增。<strong>任何对既有判断的修正都必须在此留痕</strong>，写清楚改了什么、为什么改——否则几个月后没人知道当初为什么是那个结论。</p>\n<table>\n<thead>\n<tr>\n<th>版本</th>\n<th>日期</th>\n<th>变更内容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>v1.0</td>\n<td>2026-07-27</td>\n<td>首版，业务知识库 11 个模块（00–10），覆盖行业认知、商业模式、供给架构、定价模型、客户分层、销售话术、渠道体系、合规风控、运营 SOP、论点库</td>\n</tr>\n<tr>\n<td>v1.1</td>\n<td>2026-07-27</td>\n<td>新增模块 11 品牌视觉规范，提取自官网并完成图表配色的色盲安全校验</td>\n</tr>\n<tr>\n<td>v2.0</td>\n<td>2026-07-27</td>\n<td><strong>新增客户端技术知识库板块（模块 12–17）</strong>，为 20 个客户端项目逐个建档；<strong>新增战略板块（模块 18–20）</strong></td>\n</tr>\n<tr>\n<td>v2.1</td>\n<td>2026-07-27</td>\n<td>新增模块 21 客户需求测算与选型方法论，含 Agent 消耗的等差数列估算公式、单位任务成本选型标尺、自建 vs API 的利用率盈亏平衡模型</td>\n</tr>\n<tr>\n<td>v2.2</td>\n<td>2026-07-27</td>\n<td>新增模块 22 国产算力卡现状与对策。<strong>修正模块 20 的一条推论</strong>：国产芯片跑通导致推理成本下移的判断在 2026 年内不成立，硬件实际在涨价；识别出「信创合规通道」这一未覆盖的业务机会</td>\n</tr>\n<tr>\n<td>v2.3</td>\n<td>2026-07-27</td>\n<td>新增模块 23 天数智芯档案、模块 24 中昊芯英档案。两家构成 GPGPU 与 TPU 路线的对照样本。<strong>证伪了网络流传的中昊芯英财务数据与市值预期</strong>（实际 C 轮估值 40 亿，而非流传的 500–3000 亿）</td>\n</tr>\n<tr>\n<td>v2.4</td>\n<td>2026-07-28</td>\n<td>新增模块 25 Token 工厂可行性与起步路径。<strong>推翻了\"我们迟早要自建供给\"这一隐含预期</strong>——从硅基流动公开财务倒推出公有云 token 业务毛利率 −119%、本地部署 +82.6%，给出\"不做公有云、可从本地部署分四阶段切入\"的结论与三条红线。<strong>同时修正了 v2.0 期间对价格方向的判断</strong>：「2026 进入涨价周期」过于绝对，改为「市场分化」</td>\n</tr>\n<tr>\n<td>v2.5</td>\n<td>2026-07-28</td>\n<td>新增模块 26 客户数据使用边界与数据资产化。给出 L0–L4 分级方案（可做到 L2，L3 暂缓，L4 红线）。<strong>推翻了\"持有客户数据能对抗脱媒\"的直觉</strong>——模型权重不是有效粘性资产（打平点高于物理吞吐 6 倍，且成员推理 AUC 0.938 使客户可举证、我方无法自证），评测集与路由策略才是。<strong>并撞上一项影响业务合法性的发现：三家上游明确禁止未经书面许可的转售</strong></td>\n</tr>\n<tr>\n<td>v2.6</td>\n<td>2026-07-28</td>\n<td>新增模块 27 量子计算现状与对本业务的影响。<strong>结论是\"合规问题不是算力问题\"</strong>：量子算力因不可切分、不可多租户，在架构上永远进不了我们的供给组合；QML 在经典数据上一次未赢过且有结构性定理阻挡；<strong>量子短期内是 GPU 的需求方而非替代者</strong>。唯一行动项是后量子密码（PQC），按 2027–2033 的监管日历执行</td>\n</tr>\n<tr>\n<td>v2.7</td>\n<td>2026-08-12</td>\n<td>新增模块 28 大模型自我改进的真实进展。<strong>核心结论：真实发生的是「验证器覆盖范围内的定向加速」，不是通用递归自我改进</strong>——Epoch 数据显示 2024 年 4 月后能力进展加速 1.85 倍，但加速集中在代码与数学（可自动验证），验证困难的领域无加速；递归自我改进唯一可核验的数据点是 AlphaEvolve 让 Gemini 训练时间 <strong>-1%</strong>。<strong>独立印证了模块 26 的 L0–L2 分级</strong>（GEPA 比 GRPO 省 35 倍 rollout），并给模块 21 新增倒 U 型 thinking budget 规则</td>\n</tr>\n<tr>\n<td>v2.8</td>\n<td>2026-08-12</td>\n<td><strong>移除模块 11 品牌视觉规范</strong>——判定为与业务认知无关的内容。视觉规范本身仍生效（样式定义在 build_portal.py 中，与本知识库解耦），删除不影响任何页面外观。同时修正模块 27 中一处错误的交叉引用（原写「见模块 11 与部署架构」，模块 11 与部署架构无关）。<strong>编号不重排</strong>，11 号留空</td>\n</tr>\n</tbody>\n</table>\n<h3>各版本的关键修正留痕</h3>\n<p><strong>v2.0 期间发生的判断修正（按触发来源）：</strong></p>\n<table>\n<thead>\n<tr>\n<th>被修正的内容</th>\n<th>原判断</th>\n<th>修正为</th>\n<th>触发来源</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>模块 00 基本认知第一条</td>\n<td>Token 单价在跌</td>\n<td>不管单价怎么走，总支出一直在涨（2026 已进入涨价周期，原前提被证伪）</td>\n<td>行业公开数据</td>\n</tr>\n<tr>\n<td>模块 01 · 3.1</td>\n<td>降价但支出上升</td>\n<td>价格方向已反转，补充「低价模型往往更贵」</td>\n<td>行业公开数据</td>\n</tr>\n<tr>\n<td>模块 01 · 五</td>\n<td>清洗期靠价差压缩杀人</td>\n<td>主要机制是厂商向应用层上行导致的脱媒</td>\n<td>模块 18 推演</td>\n</tr>\n<tr>\n<td>模块 02 · 2.4</td>\n<td>解决方案线含「场景化 Agent 开发」</td>\n<td>改为「让客户自建的系统跑得更省更稳」</td>\n<td>模块 19 收录 001</td>\n</tr>\n<tr>\n<td>模块 18 · 3.2</td>\n<td>切换成本在验证而非配置</td>\n<td>补充 Harness 工程作为实证支撑</td>\n<td>模块 19 收录 001</td>\n</tr>\n<tr>\n<td>模块 18 · 五</td>\n<td>威胁排序两条</td>\n<td>新增第三条「自建推理替代 API 采购」</td>\n<td>模块 19 收录 001</td>\n</tr>\n</tbody>\n</table>\n<p><strong>v2.2 的修正留痕：</strong></p>\n<table>\n<thead>\n<tr>\n<th>被修正的内容</th>\n<th>原判断</th>\n<th>修正为</th>\n<th>触发来源</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>模块 20 · 4.1 推论</td>\n<td>国产芯片跑通会让推理成本下移、价格底下移</td>\n<td><strong>2026 年内方向相反</strong>——良率仅 30–40%、晶圆产能有硬上限，国产 8 卡服务器从 150 万涨到 200 万。降价要等良率过 60% 之后</td>\n<td>模块 22 行业调研</td>\n</tr>\n<tr>\n<td>模块 21 · 3.2 参考值</td>\n<td>无国产硬件锚</td>\n<td>新增：国产 8 卡服务器 200 万元/台（2026 标价），盈亏平衡点因此上移</td>\n<td>模块 22</td>\n</tr>\n<tr>\n<td>模块 20 · 4.1 生态判断</td>\n<td>国产卡生态没问题，只是产能</td>\n<td><strong>与调研冲突</strong>，算子覆盖缺口、驱动碎片化、人才溢价 20–40%、推理吞吐仅 70–85% 均为具体可验证的生态问题。该乐观判断不得引用</td>\n<td>模块 22 第五节</td>\n</tr>\n</tbody>\n</table>\n<p><strong>v2.4 的修正留痕：</strong></p>\n<table>\n<thead>\n<tr>\n<th>被修正的内容</th>\n<th>原判断</th>\n<th>修正为</th>\n<th>触发来源</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>模块 00 基本认知第一条</td>\n<td>2026 进入涨价周期</td>\n<td><strong>市场分化</strong>：一部分厂商涨价走价值战（智谱 +83%），一部分继续降价走规模战（DeepSeek V4-Pro −75% 至 6 元/百万 Token，小米、腾讯跟进 97.5%–99%）。<strong>价格方向已不可单向预测</strong></td>\n<td>模块 25</td>\n</tr>\n<tr>\n<td>模块 18 · 3.1</td>\n<td>标题与正文断言\"2026 反而在涨\"</td>\n<td>改为\"市场在分化\"，新增「反向证据」小节，并给出统一纪律：<strong>任何依赖价格方向的策略都必须做涨 50%/跌 50% 双向压力测试</strong></td>\n<td>模块 25</td>\n</tr>\n<tr>\n<td>模块 18 · 五（价格战威胁排序）</td>\n<td>价格战不是主要威胁</td>\n<td><strong>降级为有条件成立</strong>：不是全行业威胁，但对单价敏感的长尾客户结构仍是直接威胁</td>\n<td>模块 25</td>\n</tr>\n<tr>\n<td>模块 18 · 囤货批发推论</td>\n<td>涨价周期里囤货短期有机会</td>\n<td><strong>该推论不再成立</strong>。方向不可预测意味着同时暴露在\"拿不到量\"和\"买贵了\"两侧风险</td>\n<td>模块 25</td>\n</tr>\n<tr>\n<td>模块 02 · 业务线</td>\n<td>无第五条线，隐含\"迟早要自建供给\"</td>\n<td>新增 2.6 候选第五条线：<strong>公有云 Token 工厂为红线不做</strong>（头部玩家毛利率 −119%），本地部署可分四阶段切入（+82.6%），阶段 0–1 仍归属解决方案线</td>\n<td>模块 25</td>\n</tr>\n</tbody>\n</table>\n<p><strong>v2.5 的修正留痕：</strong></p>\n<table>\n<thead>\n<tr>\n<th>被修正的内容</th>\n<th>原判断</th>\n<th>修正为</th>\n<th>触发来源</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>转售的合法性前提</strong>（隐含假设，未成文）</td>\n<td>只要与客户签好合同，转售上游 API 在法律上是干净的</td>\n<td><strong>被证伪</strong>。阿里 4.6、腾讯 2.6(6)（点名「API Token」）、智谱七条 3 款与团队协议六条 2 款（点名「<strong>聚合转发</strong>」）均禁止未经书面许可的转售。<strong>官方渠道/经销书面授权是业务合法性的前提，不是信任背书</strong></td>\n<td>模块 26 §9</td>\n</tr>\n<tr>\n<td>模块 18 · 五（对抗脱媒的资产）</td>\n<td>持有客户数据能增加粘性、对抗脱媒</td>\n<td><strong>对了一半</strong>。模型权重不是有效粘性资产——经济性不成立且客户可举证追责（成员推理 AUC 0.938）。<strong>有效的是评测集、路由策略、成本基线、可观测性数据</strong>——它们在委托处理关系内，无法律敞口，且是共建而非占有，粘性更强因为不引发对抗</td>\n<td>模块 26 §10.3</td>\n</tr>\n<tr>\n<td>模块 02 · 2.4</td>\n<td>定位为\"给脚手架和度量\"，但无技术路径</td>\n<td>补充 L0–L2 可做、L3–L4 不可做的分级方案</td>\n<td>模块 26 §7</td>\n</tr>\n<tr>\n<td>「脱敏/匿名化」的合规定位</td>\n<td>做了脱敏就可以自由使用</td>\n<td><strong>匿名化在对话自由文本上实操达不到 PIPL 第 73 条\"不能复原\"的标准</strong>。脱敏是降险的安全措施，<strong>不是免除同意义务的法律出口</strong>，对外如此主张属高风险陈述</td>\n<td>模块 26 §3.1</td>\n</tr>\n<tr>\n<td>生成式AI暂行办法第 11 条的理解</td>\n<td>该条禁止将用户输入用于训练</td>\n<td><strong>误读</strong>。该条禁的是\"<strong>非法</strong>留存/<strong>非法</strong>提供\"，\"非法\"二字指回 PIPL。其真实作用是让 PIPL 的违法后果同时构成 AIGC 规章项下的违法（可责令暂停服务）</td>\n<td>模块 26 §2.4</td>\n</tr>\n</tbody>\n</table>\n<p><strong>v2.7 的修正留痕：</strong></p>\n<table>\n<thead>\n<tr>\n<th>被修正的内容</th>\n<th>原判断</th>\n<th>修正为</th>\n<th>触发来源</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>模块 21 · 推理预算</td>\n<td>无相关规则，隐含\"加大 thinking budget 更准\"</td>\n<td><strong>倒 U 型曲线</strong>：AIME 类峰值 12K token、GPQA 峰值 10K token，之后边际收益转负；最优长度跨难度相差 7.5 倍。<strong>超过之后是花更多钱买更差的结果</strong></td>\n<td>模块 28 §4.3</td>\n</tr>\n<tr>\n<td>模块 18 · 脱媒时间表</td>\n<td>（隐含）AI 自我改进会加速上游集中、提前脱媒</td>\n<td><strong>不提前</strong>。递归自我改进唯一实证是训练时间 -1%，进程远慢于叙事。推动上游集中的是资本密集度，不是自我改进</td>\n<td>模块 28 §10.5</td>\n</tr>\n<tr>\n<td>销售话术</td>\n<td>无相关纪律</td>\n<td><strong>禁止引用「AI 写了 X% 代码」类数字</strong>——口径全面崩坏，Anthropic 自承夸大，且 METR 随机对照试验测出开发者实际慢 19%（自评快 20%）</td>\n<td>模块 28 §10.6</td>\n</tr>\n<tr>\n<td>模块 00 基本认知第一条</td>\n<td>已修正为「市场分化」</td>\n<td><strong>从新方向得到强化</strong>：能力加速集中在代码与数学，正是 Agent 负载主战场，客户 token 消耗只会继续涨</td>\n<td>模块 28 §10.1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>待并入的修正（来自模块 28，尚未执行）：</strong> 模块 21 需并入倒 U 型 thinking budget 规则与选型话术；模块 18 第五节需并入脱媒时间表不提前的判断；模块 06/07（销售话术与渠道）需并入「禁止引用 AI 写码比例」纪律。</p>\n<p><strong>待并入的修正（来自模块 26，尚未执行）：</strong> 模块 08 需并入五项合规新要求（1000 万人门槛、两年一次合规审计、委托处理记录 ≥3 年、PIA 前置义务、网安法日志留存不得用于给保留对话内容背书）；模块 18 第五节需按上表修正脱媒对抗资产的表述；<strong>模块 02 第一、三条业务线需并入转售条款风险（最高优先级）</strong>。</p>\n<p><strong>待并入的修正（来自模块 20，尚未执行）：</strong> 厂商直销威胁对 DeepSeek 降级、自建推理风险在 DeepSeek 系被削弱、囤货贬值新增成本曲线下移来源、销售新增「折扣换不来量」纪律、上游收敛后 40% 分散上限需重新评估。（原列表中的\"涨价周期判断需加限定\"已在 v2.4 执行完毕。）</p>", "plain": " AI Token 代理与销售业务 · 企业知识库总纲\n\n 版本 v2.8 ｜ 更新日期：20260812 ｜ 首版：20260727 ｜ 共 28 个模块\n 适用阶段：0→1 起步期\n 定位：国内大模型渠道代理 + 多模型聚合网关 + 算力额度批发分销\n 版本记录见文末第五节\n\n\n\n 一、这份知识库是什么\n\n这份知识库不是一份产品说明书，而是这家公司全部业务认知的底座。它要同时服务四种使用者：\n\n第一种是刚入职的销售，他需要在三天内搞清楚我们卖的到底是什么、为什么客户要从我们这里买而不是直接找官方、以及当客户说\"你们不就是个中间商吗\"的时候该怎么回答。第二种是决策层，他需要知道这门生意的钱从哪里赚、风险在哪里、什么时候该踩油门什么时候该刹车。第三种是投资人，他需要在十五分钟内理解这个市场的规模、我们的切入点和护城河。第四种，也是最容易被忽略的一种，是业务智能体——我们后续要搭建的 AI Agent 需要吃掉这整份知识库，才能代替人回答客户问题、生成方案、做报价测算。\n\n所以这份知识库的写法有一个刻意的约束：每一个论断都要带上它成立的理由和它失效的边界。只给结论的知识库训练不出会思考的智能体，也培养不出会打硬仗的销售。\n\n\n\n 二、模块地图\n\n 编号  模块  核心回答的问题  主要使用者 \n\n 01  行业认知与 Token 经济  这个市场有多大、往哪走、钱在哪  投资人、决策层、全员 \n 02  商业模式与价值主张  我们凭什么存在、凭什么赚钱  全员、投资人 \n 03  供给体系与产品架构  我们卖的东西具体是什么、怎么交付  销售、技术、客户成功 \n 04  定价体系与单位经济模型  一笔单子赚多少、怎么报价不亏  销售、决策层、财务 \n 05  客户分层与场景库  卖给谁、他们疼在哪  销售、市场 \n 06  销售方法论与话术库  怎么谈、怎么破异议  销售 \n 07  渠道与代理商体系  怎么发展下游、怎么分钱  渠道经理、决策层 \n 08  合规与风险控制  什么不能碰、怎么不出事  全员、决策层、法务 \n 09  运营 SOP 与客户成功  每天具体怎么干  全员 \n 10  核心论点库与 FAQ  一句话怎么说服人  智能体、销售、全员 \n\n 编号 11（品牌视觉规范）已于 v2.8 移除。后续模块不重新编号——知识库内有数十处「见模块 XX」的交叉引用，重排会全部失效。编号出现空位是刻意的。\n\n 客户端技术知识库（模块 12–17）\n\n客户拿到我们的 Key 之后，会把它填进某个具体的工具里。这个工具决定了他怎么烧 token、我们要花多少支持成本、以及销售能不能跟他对上话。 这一组模块把这些工具逐个建档，每个项目都同时回答\"它是什么\"和\"它对我们意味着什么\"。\n\n 编号  模块  覆盖项目  主要使用者 \n\n 12  客户端技术知识库总纲  技术地图、三种协议、配置速查表、用量预判  全员、技术支持 \n 13  自托管 Agent 与通用助手  Hermes Agent、OpenClaw、OpenManus、Manus  销售、技术支持 \n 14  API 网关与中转系统  New API、One API、LiteLLM  销售、决策层、技术 \n 15  桌面客户端  Cherry Studio、ChatBox、LobeChat、Open WebUI  市场、技术支持 \n 16  编程 Agent  Claude Code、Cursor、Cline、Roo Code  销售、技术支持 \n 17  应用编排平台  Dify、Coze、FastGPT、n8n、RAGFlow  销售、解决方案 \n\n 战略推演（模块 18）\n\n 编号  模块  核心回答的问题  主要使用者 \n\n 18  战略推演与终局判断  三年后这行长什么样、我们该往哪站、什么会证明我们错了  决策层、投资人 \n 19  外部观点收录与研判  外面看到的观点哪些可信、改变了我们什么  决策层、销售、智能体 \n 20  梁文锋 520 投资讲话精华  上游定价的内在逻辑是什么、我们的空间在哪  决策层、销售 \n 21  客户需求测算与选型方法论  客户要烧多少、用什么模型、自建还是买 API  销售必修、售前、智能体 \n 22  国产算力卡现状与对策  国产卡能不能用、贵不贵、我们的机会在哪  决策层、销售、售前 \n 23  天数智芯档案  GPGPU 路线代表，已上市、财务可核验  决策层、销售、售前 \n 24  中昊芯英档案  TPU 路线代表，技术叙事强但资本路径存疑  决策层、销售、售前 \n 25  Token 工厂可行性与起步路径  我们要不要自己做算力供给、什么时候做、怎么分阶段做  决策层必读、投资人 \n 26  客户数据使用边界与数据资产化  客户数据能用到什么程度、怎么提升准确性与速度、上游转售条款风险  决策层与技术负责人必读、销售、法务 \n 27  量子计算现状与对本业务的影响  量子发展到哪一步、什么时候出实验室、会不会颠覆 AI、我们要不要布局  决策层、投资人应答 \n 28  大模型自我改进的真实进展  模型自我升级到哪一步、谁做得最好、会不会改变我们的竞争环境  决策层、投资人应答、销售 \n\n 🚨 模块 26 第九节记录了一项影响业务合法性的发现：阿里、腾讯、智谱的服务协议均明确禁止未经书面许可的转售，智谱直接点名「聚合转发」、腾讯直接点名「API Token」。\n 官方渠道/经销书面授权不是可选项，是第一、三条业务线合法存在的前提。 签约与商务谈判前必须先读该节。\n\n ⚠️ 模块 20 的材料真实性未经当事人确认，且含违反会议约定流出的非公开数据。\n 一律标记「待证实」，其中的算力、成本、融资等数字严禁出现在任何对外材料中。 详见该模块开头。\n\n ⚠️ 模块 24（中昊芯英）中，网络流传的财务数据与市值预期存在严重失实与内部矛盾。\n 该模块第九节列出了完整的证伪过程，引用任何数据前必须先读该节。\n\n\n\n 三、贯穿全局的六条基本认知\n\n这六条是整个业务的\"第一性原理\"，其他所有内容都是它们的展开。任何一条被市场证伪，业务策略就要重做。\n\n第一条：不管单价怎么走，Token 总支出一直在涨。\n\n ⚠️ 202607 修正（第一次）：本条原表述为\"单价在跌\"。2026 年的实际情况是行业已从价格战转入价值战，部分厂商在涨价——智谱的公开数据是 API 定价提升 83%、同期 token 消耗增长 400%。原表述的前提已被证伪，但结论反而更强了。 详见模块 18 第三节。\n\n ⚠️ 202607 再修正（第二次，触发来源：模块 25）：上一次修正把方向说过头了。\"2026 进入涨价周期\"这个表述过于绝对。同期的反向证据同样扎实：自 2023 年起 API 累计降价十余次、部分模型累计降幅超 90%；DeepSeek V4Pro 降价 75% 至 6 元/百万 Token，小米、腾讯随后跟进，降幅达 97.5%–99%。\n 准确的表述是「市场分化」，不是单向涨价——一部分厂商（智谱等）涨价走价值战，靠能力溢价；另一部分（DeepSeek 系及跟进者）继续降价走规模战，靠成本领先与体量。\n 对我们的实际含义：不能用\"涨价周期\"给囤货加杠杆，也不能用\"必然降价\"给自建算成本账。上游价格方向已不可单向预测，任何依赖价格方向的策略都必须做双向压力测试。\n\n这是这门生意能成立的根本前提。2023–2025 年通用模型单价降幅可达 99%，2026 年则走向分化、部分厂商反向涨价——但无论单价往哪走、如何分化，企业侧的总支出始终在涨，因为工作负载从\"简单问答\"迁移到了\"Agent 循环调用 + 长上下文推理 + 代码生成\"，单任务的 token 消耗可以是简单问答的十倍到百倍。Uber 向 5000 名工程师开放 AI 编程工具后四个月烧光全年预算，米哈游一位工程师做多 Agent 协作测试 13 小时产生 200 万元账单——这类案例说明的不是\"AI 太贵\"，而是用量的爆发速度远超单价的下跌速度。做量的生意，永远比做价的生意安全。\n\n还有一条反直觉但必须记住的事实：低价模型往往更贵。 能力弱的模型需要更多轮次、更长的思考链、更多重试才能完成同一个任务，总消耗反而高于直接用贵模型一次做对。客户真正付的是\"单位任务成本\"，不是\"单价\"——这是我们做选型咨询时最有说服力的一个论点。\n\n第二条：我们赚的不是差价，是\"复杂度税\"。\n如果客户能轻松直连官方、拿到最优价、自己做好多模型路由和成本管控，那我们确实没有存在价值。但现实是：一家 AI 创业公司要同时接 DeepSeek、通义、豆包、Kimi 和一两个海外模型，意味着五套协议、五套账单、五个充值账户、五套限流规则、五份合规材料。我们把这五套变成一套，节省下来的工程时间、财务时间和合规时间，才是客户愿意付的钱。差价是收入的形式，复杂度是收入的实质。\n\n第三条：0→1 阶段不要打价格战，要打确定性战。\n我们没有规模，拿不到最低的上游折扣，价格战必输。但初创客户最怕的不是贵一点，是限流、掉线、账单看不懂、要发票开不出来。稳定性、可观测性、合规票据这三件事的价值，在客户被官方限流一次之后会瞬间放大十倍。\n\n第四条：客户结构决定公司命运，不能只做一类客户。\n只做 AI 创业公司，现金流好但客户死亡率高、议价能力弱；只做大企业，单笔大但周期长、账期长、要资质；只做长尾开发者，量小但笔数多、口碑扩散快；只做下游代理，杠杆大但一旦渠道失控就是灾难。健康的结构是四条腿走路，且任何一类客户占比不超过 40%。\n\n第五条：合规不是成本，是准入门槛，也是竞争壁垒。\n2026 年起，通过 API 调用第三方大模型面向公众提供服务的应用，必须在显著位置公示所用模型的名称、国家网信办备案号和属地登记编号，并留存 API 服务协议、模型备案文件、6 个月以上的接口调用日志。大量野生\"中转站\"做不到这一点。我们把合规做扎实，等于自动淘汰掉一批竞争对手，并拿到大企业客户的入场券。\n\n第六条：这门生意的终局不是卖 token，是卖\"AI 成本管理能力\"。\n纯转售的毛利会被持续压缩，这是确定的趋势。真正能沉淀下来的资产是：客户的调用数据、成本优化模型、模型选型经验、场景化的 prompt 与路由策略。今天卖 token 是为了拿到这些数据，明天靠这些数据卖 FinOps 和优化服务。转售是入口，管理是终局。\n\n补充一条必须与第六条一起记住的推论（详见模块 18）：\"切换成本极低\"这个让我们得以进场的前提，同样意味着我们自己随时可以被绕过。 我们没有模型能力、没有品牌、没有沉没成本，是整条链上最容易被替换的一环。因此不做技术锁定，就必须做能力锁定——让客户走得动但不想走。这件事有没有做成，决定了三年后我们还在不在。\n\n\n\n 四、使用规范\n\n知识库按模块独立成文，可单独分发。修改需遵循三条规则：一是事实类内容必须标注来源和采集日期，价格类数据变动频繁，超过 30 天未复核的价格表默认视为过期；二是论点类内容必须同时给出反方视角，只有正面论证的话术在真实谈判中会被一击即溃；三是案例类内容必须脱敏，客户名称、具体金额在对外版本中一律做匿名化处理。\n\n对外分发时注意版本区分：给客户和投资人的版本需要删除模块 04（单位经济模型）中的上游成本与真实毛利数据，以及模块 07（渠道体系）中的分润底线。这两块是公司的商业机密。模块 20 含未经证实且属泄露性质的第三方非公开数据，任何对外版本一律整体删除。\n\n\n\n 五、版本记录\n\n版本号规则：主版本号在新增整个板块或发生结构性调整时递增；次版本号在新增单个模块或对既有判断做出修正时递增。任何对既有判断的修正都必须在此留痕，写清楚改了什么、为什么改——否则几个月后没人知道当初为什么是那个结论。\n\n 版本  日期  变更内容 \n\n v1.0  20260727  首版，业务知识库 11 个模块（00–10），覆盖行业认知、商业模式、供给架构、定价模型、客户分层、销售话术、渠道体系、合规风控、运营 SOP、论点库 \n v1.1  20260727  新增模块 11 品牌视觉规范，提取自官网并完成图表配色的色盲安全校验 \n v2.0  20260727  新增客户端技术知识库板块（模块 12–17），为 20 个客户端项目逐个建档；新增战略板块（模块 18–20） \n v2.1  20260727  新增模块 21 客户需求测算与选型方法论，含 Agent 消耗的等差数列估算公式、单位任务成本选型标尺、自建 vs API 的利用率盈亏平衡模型 \n v2.2  20260727  新增模块 22 国产算力卡现状与对策。修正模块 20 的一条推论：国产芯片跑通导致推理成本下移的判断在 2026 年内不成立，硬件实际在涨价；识别出「信创合规通道」这一未覆盖的业务机会 \n v2.3  20260727  新增模块 23 天数智芯档案、模块 24 中昊芯英档案。两家构成 GPGPU 与 TPU 路线的对照样本。证伪了网络流传的中昊芯英财务数据与市值预期（实际 C 轮估值 40 亿，而非流传的 500–3000 亿） \n v2.4  20260728  新增模块 25 Token 工厂可行性与起步路径。推翻了\"我们迟早要自建供给\"这一隐含预期——从硅基流动公开财务倒推出公有云 token 业务毛利率 −119%、本地部署 +82.6%，给出\"不做公有云、可从本地部署分四阶段切入\"的结论与三条红线。同时修正了 v2.0 期间对价格方向的判断：「2026 进入涨价周期」过于绝对，改为「市场分化」 \n v2.5  20260728  新增模块 26 客户数据使用边界与数据资产化。给出 L0–L4 分级方案（可做到 L2，L3 暂缓，L4 红线）。推翻了\"持有客户数据能对抗脱媒\"的直觉——模型权重不是有效粘性资产（打平点高于物理吞吐 6 倍，且成员推理 AUC 0.938 使客户可举证、我方无法自证），评测集与路由策略才是。并撞上一项影响业务合法性的发现：三家上游明确禁止未经书面许可的转售 \n v2.6  20260728  新增模块 27 量子计算现状与对本业务的影响。结论是\"合规问题不是算力问题\"：量子算力因不可切分、不可多租户，在架构上永远进不了我们的供给组合；QML 在经典数据上一次未赢过且有结构性定理阻挡；量子短期内是 GPU 的需求方而非替代者。唯一行动项是后量子密码（PQC），按 2027–2033 的监管日历执行 \n v2.7  20260812  新增模块 28 大模型自我改进的真实进展。核心结论：真实发生的是「验证器覆盖范围内的定向加速」，不是通用递归自我改进——Epoch 数据显示 2024 年 4 月后能力进展加速 1.85 倍，但加速集中在代码与数学（可自动验证），验证困难的领域无加速；递归自我改进唯一可核验的数据点是 AlphaEvolve 让 Gemini 训练时间 1%。独立印证了模块 26 的 L0–L2 分级（GEPA 比 GRPO 省 35 倍 rollout），并给模块 21 新增倒 U 型 thinking budget 规则 \n v2.8  20260812  移除模块 11 品牌视觉规范——判定为与业务认知无关的内容。视觉规范本身仍生效（样式定义在 build_portal.py 中，与本知识库解耦），删除不影响任何页面外观。同时修正模块 27 中一处错误的交叉引用（原写「见模块 11 与部署架构」，模块 11 与部署架构无关）。编号不重排，11 号留空 \n\n 各版本的关键修正留痕\n\nv2.0 期间发生的判断修正（按触发来源）：\n\n 被修正的内容  原判断  修正为  触发来源 \n\n 模块 00 基本认知第一条  Token 单价在跌  不管单价怎么走，总支出一直在涨（2026 已进入涨价周期，原前提被证伪）  行业公开数据 \n 模块 01 · 3.1  降价但支出上升  价格方向已反转，补充「低价模型往往更贵」  行业公开数据 \n 模块 01 · 五  清洗期靠价差压缩杀人  主要机制是厂商向应用层上行导致的脱媒  模块 18 推演 \n 模块 02 · 2.4  解决方案线含「场景化 Agent 开发」  改为「让客户自建的系统跑得更省更稳」  模块 19 收录 001 \n 模块 18 · 3.2  切换成本在验证而非配置  补充 Harness 工程作为实证支撑  模块 19 收录 001 \n 模块 18 · 五  威胁排序两条  新增第三条「自建推理替代 API 采购」  模块 19 收录 001 \n\nv2.2 的修正留痕：\n\n 被修正的内容  原判断  修正为  触发来源 \n\n 模块 20 · 4.1 推论  国产芯片跑通会让推理成本下移、价格底下移  2026 年内方向相反——良率仅 30–40%、晶圆产能有硬上限，国产 8 卡服务器从 150 万涨到 200 万。降价要等良率过 60% 之后  模块 22 行业调研 \n 模块 21 · 3.2 参考值  无国产硬件锚  新增：国产 8 卡服务器 200 万元/台（2026 标价），盈亏平衡点因此上移  模块 22 \n 模块 20 · 4.1 生态判断  国产卡生态没问题，只是产能  与调研冲突，算子覆盖缺口、驱动碎片化、人才溢价 20–40%、推理吞吐仅 70–85% 均为具体可验证的生态问题。该乐观判断不得引用  模块 22 第五节 \n\nv2.4 的修正留痕：\n\n 被修正的内容  原判断  修正为  触发来源 \n\n 模块 00 基本认知第一条  2026 进入涨价周期  市场分化：一部分厂商涨价走价值战（智谱 +83%），一部分继续降价走规模战（DeepSeek V4Pro −75% 至 6 元/百万 Token，小米、腾讯跟进 97.5%–99%）。价格方向已不可单向预测  模块 25 \n 模块 18 · 3.1  标题与正文断言\"2026 反而在涨\"  改为\"市场在分化\"，新增「反向证据」小节，并给出统一纪律：任何依赖价格方向的策略都必须做涨 50%/跌 50% 双向压力测试  模块 25 \n 模块 18 · 五（价格战威胁排序）  价格战不是主要威胁  降级为有条件成立：不是全行业威胁，但对单价敏感的长尾客户结构仍是直接威胁  模块 25 \n 模块 18 · 囤货批发推论  涨价周期里囤货短期有机会  该推论不再成立。方向不可预测意味着同时暴露在\"拿不到量\"和\"买贵了\"两侧风险  模块 25 \n 模块 02 · 业务线  无第五条线，隐含\"迟早要自建供给\"  新增 2.6 候选第五条线：公有云 Token 工厂为红线不做（头部玩家毛利率 −119%），本地部署可分四阶段切入（+82.6%），阶段 0–1 仍归属解决方案线  模块 25 \n\nv2.5 的修正留痕：\n\n 被修正的内容  原判断  修正为  触发来源 \n\n 转售的合法性前提（隐含假设，未成文）  只要与客户签好合同，转售上游 API 在法律上是干净的  被证伪。阿里 4.6、腾讯 2.6(6)（点名「API Token」）、智谱七条 3 款与团队协议六条 2 款（点名「聚合转发」）均禁止未经书面许可的转售。官方渠道/经销书面授权是业务合法性的前提，不是信任背书  模块 26 §9 \n 模块 18 · 五（对抗脱媒的资产）  持有客户数据能增加粘性、对抗脱媒  对了一半。模型权重不是有效粘性资产——经济性不成立且客户可举证追责（成员推理 AUC 0.938）。有效的是评测集、路由策略、成本基线、可观测性数据——它们在委托处理关系内，无法律敞口，且是共建而非占有，粘性更强因为不引发对抗  模块 26 §10.3 \n 模块 02 · 2.4  定位为\" 的空间</strong>。</p>\n<p>需要向销售反复强调的一个细节：<strong>缓存命中价格</strong>。多数厂商对重复的前缀输入提供大幅折扣（常见为原价的 10% 到 25%）。一个把系统提示词写得很长、每次调用都重复传输的客户，如果不用缓存，成本可能是用缓存的三到四倍。这是我们最容易做出的\"立刻见效\"的价值证明。</p>\n<hr />\n<h2>二、市场供给格局（2026 年 7 月）</h2>\n<h3>2.1 国内主流模型定价参考</h3>\n<p>以下为公开渠道采集的官方定价参考，单位为人民币元/百万 token。<strong>采集日期 2026-07-27，价格变动频繁，报价前必须复核官网。</strong></p>\n<table>\n<thead>\n<tr>\n<th>模型</th>\n<th>输入</th>\n<th>输出</th>\n<th>上下文</th>\n<th>定位</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>DeepSeek V4</td>\n<td>0.5</td>\n<td>2</td>\n<td>128K</td>\n<td>极致性价比，通用与推理均强</td>\n</tr>\n<tr>\n<td>通义千问 Turbo</td>\n<td>0.8</td>\n<td>2</td>\n<td>128K</td>\n<td>低价通用，阿里生态</td>\n</tr>\n<tr>\n<td>通义千问 Max</td>\n<td>5</td>\n<td>15</td>\n<td>128K</td>\n<td>旗舰，多模态全面</td>\n</tr>\n<tr>\n<td>文心一言 Speed</td>\n<td>0.3</td>\n<td>0.6</td>\n<td>8K</td>\n<td>超低价短文本</td>\n</tr>\n<tr>\n<td>文心一言 4.0</td>\n<td>3</td>\n<td>9</td>\n<td>128K</td>\n<td>搜索增强突出</td>\n</tr>\n<tr>\n<td>智谱 GLM-Flash</td>\n<td>免费</td>\n<td>免费</td>\n<td>128K</td>\n<td>每日 100 万 token 免费额度</td>\n</tr>\n<tr>\n<td>智谱 GLM-Plus</td>\n<td>5</td>\n<td>15</td>\n<td>128K</td>\n<td>Agent 能力专业</td>\n</tr>\n</tbody>\n</table>\n<p>从这张表可以读出三个结构性信息。第一，<strong>价格带已经形成清晰的三层结构</strong>：0.3–0.8 元的走量层、2–5 元的主力层、5–15 元的旗舰层。第二，<strong>免费额度已成为标配获客手段</strong>，这意味着最底层的通用问答场景基本没有转售利润，我们的利润必须来自中高层。第三，<strong>同价位模型的能力差异正在拉大</strong>，DeepSeek V4 以 0.5/2 的价格提供接近旗舰的能力，这对整个价格体系是持续的向下压力。</p>\n<h3>2.2 聚合平台市场格局</h3>\n<p>当前市场的参与者可分为三类。第一类是<strong>云厂商自营 MaaS 平台</strong>，如阿里云百炼、腾讯云、火山方舟，优势是资质齐全、SLA 有保障、可开发票，劣势是模型以自家生态为主、跨厂商聚合能力弱、对小客户服务颗粒度粗。第二类是<strong>独立聚合服务商</strong>，如硅基流动、OpenRouter 及各类 API 中转站，优势是模型全、切换快、价格灵活，劣势是稳定性与合规性参差不齐。第三类是<strong>开源自建网关</strong>，如 New API 一类的开源项目，被大量小型中转站作为底座使用，优势是零授权成本，劣势是缺乏企业级保活机制与合规能力。</p>\n<p>行业普遍采用的是<strong>差价加成制</strong>而非分成制——平台以官方价的一定折扣拿货，再按接近或略低于官方价对外销售，赚取中间价差。市场上常见的对客报价在官方价的 8 到 9 折区间，这意味着<strong>行业毛利率的公开水位大致在 10% 到 25%</strong>，纯转售模式的利润空间是明确有限的。</p>\n<h3>2.3 现存平台的四类通病</h3>\n<p>这四条是我们的产品设计方向，也是销售的攻击点。</p>\n<p><strong>稳定性缺失</strong>：大量基于开源网关搭建的中转站没有企业级保活机制，上游一旦波动就直接掉线，且无 SLA 承诺、无故障补偿。</p>\n<p><strong>协议转换损耗</strong>：不能原生支持 OpenAI、Anthropic、Gemini 三套协议的平台，需要通过中间件转译，引入额外延迟并可能在转换中丢失字段，导致 function calling、结构化输出等高级特性行为异常。</p>\n<p><strong>缓存不可见</strong>：多数平台的账单无法区分缓存命中调用与普通调用，客户看不到缓存节省了多少，也就无从优化。这是账单颗粒度问题，直接影响客户的成本管控能力。</p>\n<p><strong>企业管控缺失</strong>：子账号、部门用量审计、预算告警、正式增值税发票——这四样是企业客户的硬需求，而绝大多数中转站一样都提供不了。</p>\n<hr />\n<h2>三、需求侧：Token 消耗的结构性增长</h2>\n<h3>3.1 \"降价但支出上升\"的悖论</h3>\n<blockquote>\n<p>⚠️ <strong>2026-07 更新</strong>：价格方向已经反转。行业从价格战转入价值战，出现系统性涨价（智谱 API 定价 +83%，同期消耗 +400%）。驱动因素是需求侧 Agent 消耗指数级增长、成本侧存储芯片进入卖方市场与能源成本高企、以及\"不能靠补贴降价\"的行业共识。<strong>下文的\"降价\"描述适用于 2023–2025 年；结论——总支出持续膨胀——在涨价周期中只会更成立。</strong> 完整推演见模块 18 第三节。</p>\n<p>同时记住一条反直觉事实：<strong>低价模型往往更贵。</strong> 能力弱的模型要更多轮次、更长思考链、更多重试才能完成同一任务，总消耗反而高于直接用贵模型一次做对。客户真正付的是<strong>单位任务成本</strong>，不是单价。</p>\n</blockquote>\n<p>这是本模块最重要的认知。无论单价崩塌还是回升，企业 AI 支出都在膨胀。原因在于<strong>工作负载形态的迁移</strong>：</p>\n<p>早期的 AI 应用是\"一问一答\"，一次交互消耗几百到几千 token。现在的主流形态是 Agent：模型需要多轮思考、调用工具、读取长上下文、自我校验，一次任务可能触发几十次模型调用，消耗数十万甚至上百万 token。<strong>同一个业务需求，token 消耗量放大了十倍到百倍。</strong></p>\n<p>有两个极具说服力的公开案例。Uber 为 5000 名工程师开放 AI 编程工具，四个月烧光全年预算。米哈游一位工程师做多 Agent 协作测试，13 小时产生 200 万元账单。这两个案例在销售场景中的作用不是吓唬客户，而是引出一个问题：<strong>\"你们现在有没有办法在账单出来之前，就知道某个功能上线会烧掉多少钱？\"</strong>——这个问题几乎没有客户能回答\"有\"。</p>\n<h3>3.2 需求端的量级参照</h3>\n<p>公开数据显示，金山办公 AI 月活突破 8013 万（同比增长 307%），日均调用量超 2000 亿次。这类头部应用的量级说明 token 需求的绝对规模已经非常可观，且增长曲线仍然陡峭。对我们而言，这类超大客户不是目标客户（他们会直接和厂商签战略协议），但他们的存在证明了<strong>中间层的长尾市场同样在被这股浪潮抬升</strong>。</p>\n<h3>3.3 成本结构的分层化</h3>\n<p>厂商定价策略已经明确分层：轻量通用模型维持低价甚至免费用于获客，高价值能力（编程、Agent、多模态）按旗舰档位计费。智谱 GLM-5.1 对标编程与 Agent 场景，定价约为轻量版 GLM-4.7 的三倍。</p>\n<p>这个分层对我们是<strong>利好</strong>。因为低价层没有利润，我们本来也不该在那里竞争；而高价层的客户对价格不敏感、对能力和稳定性敏感，正是我们能提供增值服务的地方。销售策略上要明确：<strong>用低价层做引流和试用，用高价层做利润。</strong></p>\n<hr />\n<h2>四、上游侧：算力约束与价格底线</h2>\n<p>模型价格的下限受制于算力成本。HBM 与高端 GPU 的供给缺口在 2026 年收窄至约 27%，供给紧张仍然存在但已在缓解。这意味着两件事：一是<strong>上游厂商的降价空间仍然存在但会放缓</strong>，无限降价的预期不成立；二是<strong>在算力仍然稀缺的窗口期内，能稳定拿到额度本身就是一种资源</strong>——这正是\"算力/额度批发分销\"这条业务线的立足点。</p>\n<p>对决策层的判断建议：不要押注\"价格会一直降、我们靠差价永远有钱赚\"。要押注\"用量会一直涨、复杂度会一直升\"。前者是别人的让利，后者是市场的规律。</p>\n<hr />\n<h2>五、市场演进的三个阶段判断</h2>\n<p><strong>当前阶段（2026）：混战期。</strong> 参与者众多、标准不一、合规趋严刚刚开始咬合。这是新进入者的窗口期——因为规模优势尚未固化，靠服务质量和合规能力可以切入。</p>\n<p><strong>下一阶段（12–24 个月）：清洗期。</strong> 合规要求落地执行会淘汰掉大量野生中转站；同时头部聚合平台的规模效应开始显现，纯价差模式的毛利被压缩到个位数。<strong>在这个阶段仍然只会卖 token 的公司会死掉。</strong></p>\n<p><strong>终局阶段：分化期。</strong> 市场分化为两端——一端是超大规模的基础设施型聚合商（拼成本和稳定性），另一端是垂直场景的解决方案商（拼行业理解和交付能力）。中间地带消失。</p>\n<p><strong>这个判断直接决定我们的战略：我们必须在清洗期到来之前，完成从\"卖 token\"到\"卖 AI 成本管理与场景交付\"的能力积累。</strong> 转售业务的作用是养活公司、获取客户和数据，而不是终点。</p>\n<p><strong>2026-07 补充</strong>：清洗期的主要杀伤机制需要修正。原判断认为是\"价差被压缩到个位数\"，但在涨价周期下，更现实的机制是<strong>厂商向应用层上行导致的脱媒</strong>——上游越是自建开发者生态与应用入口，越有动力直接服务应用开发者，中间渠道的空间被从上方压缩，而不是从价格方向压垮。<strong>这不改变结论，但改变了我们该防守的方向。</strong> 见模块 18 第五节。</p>\n<hr />\n<h2>数据来源与复核</h2>\n<p>本模块的价格数据与市场格局判断来自以下公开来源，采集于 2026-07-27。价格类数据请每 30 天复核一次。</p>\n<ul>\n<li><a href=\"https://www.uuaihub.com/blog/domestic-llm-api-pricing-2026\">国产大模型 API 价格战 2026：DeepSeek、通义千问、文心一言、智谱 GLM 性价比横评 - UU AI Hub</a></li>\n<li><a href=\"https://segmentfault.com/a/1190000047954871\">2026 年大模型 API 聚合平台选型指南：八大服务商的并发、协议与成本能力拆解 - SegmentFault</a></li>\n<li><a href=\"https://www.huxiu.com/article/4868577.html\">大模型降价但企业 AI 支出反升：Token 经济进入价格撕裂期 - 虎嗅</a></li>\n</ul>", "plain": " 模块 01 · 行业认知与 Token 经济\n\n 本模块解决的问题：这个市场有多大、结构是什么、往哪走、钱在哪个环节。\n 使用者：投资人沟通、决策层判断、新员工建立行业常识。\n\n\n\n 一、什么是 Token，为什么按 Token 收费\n\nToken 是大模型处理文本的最小计费单位。中文场景下大致一个汉字对应 0.6 到 1 个 token，英文场景下一个单词大致对应 1.3 个 token。模型厂商按输入 token 和输出 token 分别计价，输出价格通常是输入价格的 2 到 4 倍，因为输出需要自回归逐个生成，算力消耗远高于输入的并行编码。\n\n理解计费单位是理解这门生意的起点。按 token 计费意味着收入天然与客户的使用深度绑定——客户用得越多，我们收入越高，不存在传统软件\"卖出去就到头了\"的天花板。这也意味着客户的成本是浮动的、不可预测的，而不可预测的成本正是我们提供管理价值的空间。\n\n需要向销售反复强调的一个细节：缓存命中价格。多数厂商对重复的前缀输入提供大幅折扣（常见为原价的 10% 到 25%）。一个把系统提示词写得很长、每次调用都重复传输的客户，如果不用缓存，成本可能是用缓存的三到四倍。这是我们最容易做出的\"立刻见效\"的价值证明。\n\n\n\n 二、市场供给格局（2026 年 7 月）\n\n 2.1 国内主流模型定价参考\n\n以下为公开渠道采集的官方定价参考，单位为人民币元/百万 token。采集日期 20260727，价格变动频繁，报价前必须复核官网。\n\n 模型  输入  输出  上下文  定位 \n\n DeepSeek V4  0.5  2  128K  极致性价比，通用与推理均强 \n 通义千问 Turbo  0.8  2  128K  低价通用，阿里生态 \n 通义千问 Max  5  15  128K  旗舰，多模态全面 \n 文心一言 Speed  0.3  0.6  8K  超低价短文本 \n 文心一言 4.0  3  9  128K  搜索增强突出 \n 智谱 GLMFlash  免费  免费  128K  每日 100 万 token 免费额度 \n 智谱 GLMPlus  5  15  128K  Agent 能力专业 \n\n从这张表可以读出三个结构性信息。第一，价格带已经形成清晰的三层结构：0.3–0.8 元的走量层、2–5 元的主力层、5–15 元的旗舰层。第二，免费额度已成为标配获客手段，这意味着最底层的通用问答场景基本没有转售利润，我们的利润必须来自中高层。第三，同价位模型的能力差异正在拉大，DeepSeek V4 以 0.5/2 的价格提供接近旗舰的能力，这对整个价格体系是持续的向下压力。\n\n 2.2 聚合平台市场格局\n\n当前市场的参与者可分为三类。第一类是云厂商自营 MaaS 平台，如阿里云百炼、腾讯云、火山方舟，优势是资质齐全、SLA 有保障、可开发票，劣势是模型以自家生态为主、跨厂商聚合能力弱、对小客户服务颗粒度粗。第二类是独立聚合服务商，如硅基流动、OpenRouter 及各类 API 中转站，优势是模型全、切换快、价格灵活，劣势是稳定性与合规性参差不齐。第三类是开源自建网关，如 New API 一类的开源项目，被大量小型中转站作为底座使用，优势是零授权成本，劣势是缺乏企业级保活机制与合规能力。\n\n行业普遍采用的是差价加成制而非分成制——平台以官方价的一定折扣拿货，再按接近或略低于官方价对外销售，赚取中间价差。市场上常见的对客报价在官方价的 8 到 9 折区间，这意味着行业毛利率的公开水位大致在 10% 到 25%，纯转售模式的利润空间是明确有限的。\n\n 2.3 现存平台的四类通病\n\n这四条是我们的产品设计方向，也是销售的攻击点。\n\n稳定性缺失：大量基于开源网关搭建的中转站没有企业级保活机制，上游一旦波动就直接掉线，且无 SLA 承诺、无故障补偿。\n\n协议转换损耗：不能原生支持 OpenAI、Anthropic、Gemini 三套协议的平台，需要通过中间件转译，引入额外延迟并可能在转换中丢失字段，导致 function calling、结构化输出等高级特性行为异常。\n\n缓存不可见：多数平台的账单无法区分缓存命中调用与普通调用，客户看不到缓存节省了多少，也就无从优化。这是账单颗粒度问题，直接影响客户的成本管控能力。\n\n企业管控缺失：子账号、部门用量审计、预算告警、正式增值税发票——这四样是企业客户的硬需求，而绝大多数中转站一样都提供不了。\n\n\n\n 三、需求侧：Token 消耗的结构性增长\n\n 3.1 \"降价但支出上升\"的悖论\n\n ⚠️ 202607 更新：价格方向已经反转。行业从价格战转入价值战，出现系统性涨价（智谱 API 定价 +83%，同期消耗 +400%）。驱动因素是需求侧 Agent 消耗指数级增长、成本侧存储芯片进入卖方市场与能源成本高企、以及\"不能靠补贴降价\"的行业共识。下文的\"降价\"描述适用于 2023–2025 年；结论——总支出持续膨胀——在涨价周期中只会更成立。 完整推演见模块 18 第三节。\n\n 同时记住一条反直觉事实：低价模型往往更贵。 能力弱的模型要更多轮次、更长思考链、更多重试才能完成同一任务，总消耗反而高于直接用贵模型一次做对。客户真正付的是单位任务成本，不是单价。\n\n这是本模块最重要的认知。无论单价崩塌还是回升，企业 AI 支出都在膨胀。原因在于工作负载形态的迁移：\n\n早期的 AI 应用是\"一问一答\"，一次交互消耗几百到几千 token。现在的主流形态是 Agent：模型需要多轮思考、调用工具、读取长上下文、自我校验，一次任务可能触发几十次模型调用，消耗数十万甚至上百万 token。同一个业务需求，token 消耗量放大了十倍到百倍。\n\n有两个极具说服力的公开案例。Uber 为 5000 名工程师开放 AI 编程工具，四个月烧光全年预算。米哈游一位工程师做多 Agent 协作测试，13 小时产生 200 万元账单。这两个案例在销售场景中的作用不是吓唬客户，而是引出一个问题：\"你们现在有没有办法在账单出来之前，就知道某个功能上线会烧掉多少钱？\"——这个问题几乎没有客户能回答\"有\"。\n\n 3.2 需求端的量级参照\n\n公开数据显示，金山办公 AI 月活突破 8013 万（同比增长 307%），日均调用量超 2000 亿次。这类头部应用的量级说明 token 需求的绝对规模已经非常可观，且增长曲线仍然陡峭。对我们而言，这类超大客户不是目标客户（他们会直接和厂商签战略协议），但他们的存在证明了中间层的长尾市场同样在被这股浪潮抬升。\n\n 3.3 成本结构的分层化\n\n厂商定价策略已经明确分层：轻量通用模型维持低价甚至免费用于获客，高价值能力（编程、Agent、多模态）按旗舰档位计费。智谱 GLM5.1 对标编程与 Agent 场景，定价约为轻量版 GLM4.7 的三倍。\n\n这个分层对我们是利好。因为低价层没有利润，我们本来也不该在那里竞争；而高价层的客户对价格不敏感、对能力和稳定性敏感，正是我们能提供增值服务的地方。销售策略上要明确：用低价层做引流和试用，用高价层做利润。\n\n\n\n 四、上游侧：算力约束与价格底线\n\n模型价格的下限受制于算力成本。HBM 与高端 GPU 的供给缺口在 2026 年收窄至约 27%，供给紧张仍然存在但已在缓解。这意味着两件事：一是上游厂商的降价空间仍然存在但会放缓，无限降价的预期不成立；二是在算力仍然稀缺的窗口期内，能稳定拿到额度本身就是一种资源——这正是\"算力/额度批发分销\"这条业务线的立足点。\n\n对决策层的判断建议：不要押注\"价格会一直降、我们靠差价永远有钱赚\"。要押注\"用量会一直涨、复杂度会一直升\"。前者是别人的让利，后者是市场的规律。\n\n\n\n 五、市场演进的三个阶段判断\n\n当前阶段（2026）：混战期。 参与者众多、标准不一、合规趋严刚刚开始咬合。这是新进入者的窗口期——因为规模优势尚未固化，靠服务质量和合规能力可以切入。\n\n下一阶段（12–24 个月）：清洗期。 合规要求落地执行会淘汰掉大量野生中转站；同时头部聚合平台的规模效应开始显现，纯价差模式的毛利被压缩到个位数。在这个阶段仍然只会卖 token 的公司会死掉。\n\n终局阶段：分化期。 市场分化为两端——一端是超大规模的基础设施型聚合商（拼成本和稳定性），另一端是垂直场景的解决方案商（拼行业理解和交付能力）。中间地带消失。\n\n这个判断直接决定我们的战略：我们必须在清洗期到来之前，完成从\"卖 token\"到\"卖 AI 成本管理与场景交付\"的能力积累。 转售业务的作用是养活公司、获取客户和数据，而不是终点。\n\n202607 补充：清洗期的主要杀伤机制需要修正。原判断认为是\"价差被压缩到个位数\"，但在涨价周期下，更现实的机制是厂商向应用层上行导致的脱媒——上游越是自建开发者生态与应用入口，越有动力直接服务应用开发者，中间渠道的空间被从上方压缩，而不是从价格方向压垮。这不改变结论，但改变了我们该防守的方向。 见模块 18 第五节。\n\n\n\n 数据来源与复核\n\n本模块的价格数据与市场格局判断来自以下公开来源，采集于 20260727。价格类数据请每 30 天复核一次。\n\n [国产大模型 API 价格战 2026：DeepSeek、通义千问、文心一言、智谱 GLM 性价比横评  UU AI Hub](https://www.uuaihub.com/blog/domesticllmapipricing2026)\n [2026 年大模型 API 聚合平台选型指南：八大服务商的并发、协议与成本能力拆解  SegmentFault](https://segmentfault.com/a/1190000047954871)\n [大模型降价但企业 AI 支出反升：Token 经济进入价格撕裂期  虎嗅](https://www.huxiu.com/article/4868577.html)\n"}, {"id": "02-商业模式与价值主张", "code": "02", "title": "模块 02 · 商业模式与价值主张", "short": "商业模式与价值主张", "subs": ["一、先回答最尖锐的那个问题", "二、四条业务线及其相互关系", "三、价值主张：对四类客户各说一句话", "四、护城河：现在有什么，将来要建什么", "五、这门生意可能失败的四种方式"], "html": "<h1>模块 02 · 商业模式与价值主张</h1>\n<blockquote>\n<p>本模块解决的问题：我们凭什么存在、凭什么赚钱、别人为什么替代不了我们。\n使用者：全员必修，投资人沟通的核心素材。</p>\n</blockquote>\n<hr />\n<h2>一、先回答最尖锐的那个问题</h2>\n<p>任何一个懂行的客户、投资人、竞争对手，都会在第一时间抛出同一个质疑：</p>\n<blockquote>\n<p>\"模型厂商官网就能直接注册、直接调用、直接充值，为什么要经过你？你不就是个加价的中间商吗？\"</p>\n</blockquote>\n<p><strong>如果我们回答不好这个问题，这门生意就不成立。</strong> 所以它必须放在整份知识库的最前面，而且答案必须是结构性的，不能靠话术糊弄。</p>\n<p>真实的答案是：<strong>我们不是在\"模型和客户之间\"加了一层，我们是在\"客户和五到十个模型厂商之间\"减了九层。</strong></p>\n<p>一家正在做 AI 产品的公司，如果要用好当下的模型生态，它实际面对的是这样一张网：DeepSeek 便宜且推理强，通义多模态好，豆包在某些中文场景强，智谱的 Agent 能力专业，某些场景还必须用海外模型。它不可能只用一家。而一旦用多家，它就要同时承担：</p>\n<p>五套不同的 API 协议和 SDK；五个独立的充值账户和余额监控；五套不同的限流规则和错误码；五份分散的账单，无法汇总核算真实成本；五次商务谈判、五份合同、五张发票流程；五份合规备案材料的收集与公示。</p>\n<p>这些成本不出现在任何一张价目表上，但它们<strong>真实地消耗着客户最贵的资源——工程师时间和财务时间</strong>。我们收取的差价，本质上是客户为消除这些成本而付的钱。这就是\"复杂度税\"。</p>\n<p>补充一个反向的判断标准，销售必须诚实掌握：<strong>如果一个客户只用一个模型、用量极小、不需要发票、不在乎稳定性——那他确实不该是我们的客户。</strong> 硬啃这类客户既没利润也没口碑。识别出\"我们不该服务谁\"，和知道\"我们该服务谁\"同样重要。</p>\n<hr />\n<h2>二、四条业务线及其相互关系</h2>\n<p>我们同时经营四条业务线，它们不是并列的四个产品，而是<strong>一个有递进关系的结构</strong>。</p>\n<h3>2.1 渠道代理（国内大模型官方代理）</h3>\n<p><strong>做什么</strong>：与国内主流模型厂商建立正式的渠道代理或经销关系，以代理价拿货，为客户提供官方通道的采购、开票、技术支持与售后。</p>\n<p><strong>赚什么</strong>：厂商给予的代理折扣与返点，以及基于采购量的阶梯返利。</p>\n<p><strong>战略作用</strong>：这是<strong>信任资产</strong>。有官方代理身份意味着我们不是野生中转站，客户的合规审查、法务审查能过。对中大型企业客户，\"是否为官方授权渠道\"往往是准入的第一道筛子。</p>\n<p><strong>风险</strong>：厂商政策变动、代理权被稀释、厂商直销团队与我们抢客户。应对方式是不依赖单一厂商，并把价值沉淀在服务层而非通道层。</p>\n<h3>2.2 多模型聚合网关（自有产品）</h3>\n<p><strong>做什么</strong>：一套统一 API，一个账户，接入所有主流模型；原生兼容 OpenAI、Anthropic、Gemini 三套协议；提供细粒度账单、缓存可见性、智能路由、故障自动切换。</p>\n<p><strong>赚什么</strong>：上游拿货价与对客销售价之间的价差，加上高阶功能（路由优化、成本分析、私有部署对接）的服务费。</p>\n<p><strong>战略作用</strong>：这是<strong>产品资产和数据资产</strong>。客户的每一次调用都在告诉我们：市场在用什么模型、什么场景消耗最大、哪里有优化空间。这些数据是我们从\"中间商\"进化为\"AI 成本管理服务商\"的唯一路径。</p>\n<p><strong>风险</strong>：技术投入大、稳定性责任全在自己、上游断供风险。应对方式是多上游冗余 + 明确的 SLA 与补偿机制。</p>\n<h3>2.3 算力/额度批发分销</h3>\n<p><strong>做什么</strong>：以大额预付换取上游更深折扣，将额度批发给下游代理商、小型服务商、有稳定用量的中型客户。</p>\n<p><strong>赚什么</strong>：批零价差。规模是唯一的杠杆。</p>\n<p><strong>战略作用</strong>：这是<strong>现金流引擎和议价筹码</strong>。批发业务带来的采购量直接决定我们在上游能拿到什么价格，进而决定另外三条线的竞争力。</p>\n<p><strong>风险</strong>：这是四条线里<strong>风险最高的一条</strong>。预付资金被锁定、下游账期与坏账、囤额度遇到降价直接亏损。必须设置严格的资金上限和降价对冲机制（详见模块 04 与模块 08）。</p>\n<h3>2.4 场景化解决方案（延伸业务）</h3>\n<p><strong>做什么</strong>：基于前三条线积累的客户理解与调用数据，为客户提供模型选型咨询、成本优化服务、路由策略设计、trace 与评测基础设施、私有化部署对接。</p>\n<blockquote>\n<p><strong>2026-07 重新定位（见模块 19 收录 001）</strong>：这条线原本包含\"场景化 Agent 开发\"。但随着\"企业核心智能不能外包\"成为行业主张，客户不会再买\"你替我建一个 Agent\"。<strong>这条线要从\"替客户建\"改成\"让客户自己建的东西跑得更省、更稳、更看得清\"</strong>——我们提供脚手架和度量，客户保留领域知识与业务逻辑。这个转向反而更有利：毛利结构和可复制性都优于定制开发，也避开了项目制交付的人力陷阱。</p>\n<p><strong>2026-07 技术路径补充（见模块 26）</strong>：这条线的具体技术实现已有明确分级方案。可做的是 <strong>L0–L2</strong>：上游缓存对齐（读价 0.1 倍，不需读客户数据内容）、模型路由（成本降 35%–45%）、单租户内的评测集与示例库沉淀。<strong>不可做的是 L3–L4</strong>：用客户数据微调、跨客户数据混用——前者经济性不成立（打平点高于物理吞吐上限 6 倍），后者是红线。<strong>\"给脚手架和度量、不碰客户领域知识\"这个定位，在合规与技术两条独立路径上都得到了验证。</strong></p>\n</blockquote>\n<p><strong>赚什么</strong>：项目制服务费与持续的优化订阅费。<strong>这是毛利率最高的一条线（可达 50%–70%）。</strong></p>\n<p><strong>战略作用</strong>：这是<strong>终局业务</strong>。前三条线在清洗期会被压缩毛利，这一条线是我们活下去并向上走的方向。</p>\n<h3>2.5 四条线的递进逻辑</h3>\n<p>用一句话概括它们的关系：<strong>代理身份换信任，聚合网关换数据，批发分销换规模，解决方案换利润。</strong></p>\n<p>早期（0–12 个月）以代理和聚合为主，快速建立客户基础和信任；中期（12–24 个月）用批发放大规模、压低上游成本；长期以解决方案承接利润。任何时候如果只剩下第三条线还在跑，说明公司战略已经失败——因为纯批发是最容易被规模更大的对手碾死的形态。</p>\n<h3>2.6 候选的第五条线：Token 工厂（自建推理供给）</h3>\n<blockquote>\n<p><strong>2026-07 新增指针（详见模块 25）。</strong> 这条线目前<strong>不成立</strong>，列在这里是为了防止它被反复重新提起。</p>\n</blockquote>\n<p><strong>它是什么</strong>：不再只做转售，而是自己持有推理算力、自己出 token，从\"渠道\"变成\"供给\"。</p>\n<p><strong>为什么现在不做</strong>：模块 25 拆了硅基流动 2025 年的公开财务——收入 5533 万（同比 +653%），亏损 3.45 亿，整体毛利率 <strong>−24.0%</strong>，其中<strong>公有云业务毛利率 −119.0%</strong>，月均现金消耗约 1480 万。<strong>在公有云 token 这个战场上，一家有 1028 万注册用户、13000+ 企业客户、日均 5785 亿 token 的头部玩家，每卖一块钱倒贴两块多。</strong> 我们没有任何理由认为自己能做得更好。</p>\n<p><strong>但同一组数据里有一个正向发现</strong>：把公有云剥离后倒推，<strong>本地部署/私有化交付的毛利率约 +82.6%</strong>。同一家公司，两条业务线，一条 −119%，一条 +82.6%。</p>\n<p><strong>所以结论是有条件的，不是一刀切</strong>：</p>\n<ul>\n<li><strong>不做公有云 Token 工厂</strong>——现阶段，以及可预见的未来。这是一条明确的红线。</li>\n<li><strong>若要碰\"供给\"，只能从本地部署/私有化交付切入</strong>，且必须按模块 25 第七节的四阶段推进：先转售（零固定成本）→ 签到 1–2 个私有化订单后<strong>租用</strong>试水 → 签约负载能撑住 60% 利用率且试水阶段毛利为正才小规模<strong>采购</strong> → 连续两季盈利且利用率 70%+ 才扩张。<strong>每一阶段的前进条件都是\"已签约的负载\"，不是\"预期的客户数\"。</strong></li>\n</ul>\n<p><strong>这条线与 2.4 解决方案线的关系</strong>：它其实是 2.4 的自然延伸——本地部署交付本来就属于\"让客户自己建的东西跑得更省更稳\"。所以在阶段 0–1，它不需要作为独立业务线存在，只是解决方案线的一种交付形态。<strong>只有进入阶段 2（开始持有资产）之后，它才在会计和风险上真正变成第五条线。</strong></p>\n<hr />\n<h2>三、价值主张：对四类客户各说一句话</h2>\n<p>价值主张不能只有一个版本。同一套能力，对不同客户要翻译成不同的语言。</p>\n<p><strong>对 AI 应用创业公司</strong>：</p>\n<blockquote>\n<p>\"你的工程师应该花时间做产品，不是花时间维护五套模型接口和五个充值账户。我们让你一行代码切换所有模型，一张账单看清所有成本，一次充值不用再管余额告警。\"</p>\n</blockquote>\n<p>痛点锚点是<strong>工程效率和现金流</strong>。这类客户人少、钱紧、迭代快，最怕的是工程师被基础设施拖住，以及某个模型突然限流导致线上事故。</p>\n<p><strong>对中大型企业客户</strong>：</p>\n<blockquote>\n<p>\"我们是官方授权渠道，合同、发票、备案材料、等保配合一次性给全；子账号和部门预算管控让你的 IT 部门知道每一分 AI 支出花在哪个业务上；SLA 和故障补偿写进合同。\"</p>\n</blockquote>\n<p>痛点锚点是<strong>合规、可审计、可问责</strong>。这类客户不缺钱，缺的是\"出了事有人负责\"和\"内部能交代得过去\"。价格在他们的决策权重里往往排第三第四位。</p>\n<p><strong>对中小企业与开发者</strong>：</p>\n<blockquote>\n<p>\"不用注册五个平台，不用最低充值门槛，按量付费，用多少扣多少，账单一目了然，随时可以开票。\"</p>\n</blockquote>\n<p>痛点锚点是<strong>门槛和便利</strong>。这类客户量小但笔数多，是口碑扩散的主要来源，服务上要极度自助化，不能靠人力堆。</p>\n<p><strong>对下游代理商与渠道</strong>：</p>\n<blockquote>\n<p>\"我们提供白标网关、独立结算后台、分级分润和完整的销售物料，你只管卖，交付和技术我们兜底。\"</p>\n</blockquote>\n<p>痛点锚点是<strong>低门槛创业和稳定分润</strong>。这类伙伴关心的是\"我需要投入多少\"和\"我能赚多少、什么时候能拿到钱\"。</p>\n<hr />\n<h2>四、护城河：现在有什么，将来要建什么</h2>\n<p>诚实地说，<strong>0→1 阶段我们几乎没有护城河</strong>。这一点必须对内对外都讲清楚，尤其是面对投资人时，虚构护城河是最容易被戳穿的。</p>\n<p>我们现在有的只是三样东西：起步期的服务密度（能给客户官方给不了的响应速度）、合规意愿（愿意做别人嫌麻烦的事）、以及模型选型的专业判断。这三样都可以被复制。</p>\n<p>真正需要在 12–24 个月内建起来的护城河有四层：</p>\n<p><strong>第一层是转换成本。</strong> 当客户的路由策略、缓存配置、成本分析报表、多部门账号体系都建在我们平台上时，迁移成本会变得很高。这一层靠产品深度实现，是最现实、最快能建起来的一层。</p>\n<p><strong>第二层是数据壁垒。</strong> 积累足够多的真实调用数据后，我们能回答\"这个场景用哪个模型最划算\"这类没人能回答的问题。这一层靠时间和规模实现。</p>\n<p><strong>第三层是合规资质。</strong> 完整的资质组合（详见模块 08）本身构成准入门槛，把大量竞争者挡在企业客户之外。这一层靠钱和时间实现，可以现在就启动。</p>\n<p><strong>第四层是渠道网络。</strong> 一张覆盖细分行业和区域的代理商网络，一旦形成粘性就很难被撬动。这一层最慢，但一旦建成最稳固。</p>\n<p>给决策层的判断建议：<strong>不要等护城河建好再扩张，也不要只扩张不建护城河。</strong> 前 12 个月的正确姿势是用服务密度换客户，同时把合规资质和产品深度这两件\"确定要做\"的事同步推进。</p>\n<hr />\n<h2>五、这门生意可能失败的四种方式</h2>\n<p>任何商业模式的文档只讲成功路径都是不诚实的。以下四种失败方式必须被决策层持续监控。</p>\n<p><strong>第一种：被上游抛弃。</strong> 模型厂商决定直接服务所有客户、取消渠道体系，或大幅收紧代理折扣。这是最致命的风险，我们对此几乎没有控制力。唯一的缓解是不依赖单一上游，并让客户粘在我们的产品能力上而非通道上。</p>\n<p><strong>第二种：被价格战杀死。</strong> 规模更大的对手把价差压到零，用亏损换市场。应对方式是坚决不跟进纯价格战，把竞争转移到服务和管理能力的维度。</p>\n<p><strong>第三种：被合规清退。</strong> 监管收紧、资质不全、或某个客户用我们的通道做了违规内容生成，导致连带责任。应对方式是模块 08 的全套风控体系，且必须在业务扩张之前就位。</p>\n<p><strong>第四种：被资金链拖垮。</strong> 这是批发业务的固有风险——大额预付上游、下游给账期、中间遇到上游降价或下游坏账，现金流断裂。应对方式是严格的预付上限、账期管理和降价条款谈判。</p>\n<p>对投资人讲这四条不是自曝其短，而是证明我们<strong>清醒</strong>。一个说不出自己怎么会死的创业者，投资人不会信他知道怎么活。</p>", "plain": " 模块 02 · 商业模式与价值主张\n\n 本模块解决的问题：我们凭什么存在、凭什么赚钱、别人为什么替代不了我们。\n 使用者：全员必修，投资人沟通的核心素材。\n\n\n\n 一、先回答最尖锐的那个问题\n\n任何一个懂行的客户、投资人、竞争对手，都会在第一时间抛出同一个质疑：\n\n \"模型厂商官网就能直接注册、直接调用、直接充值，为什么要经过你？你不就是个加价的中间商吗？\"\n\n如果我们回答不好这个问题，这门生意就不成立。 所以它必须放在整份知识库的最前面，而且答案必须是结构性的，不能靠话术糊弄。\n\n真实的答案是：我们不是在\"模型和客户之间\"加了一层，我们是在\"客户和五到十个模型厂商之间\"减了九层。\n\n一家正在做 AI 产品的公司，如果要用好当下的模型生态，它实际面对的是这样一张网：DeepSeek 便宜且推理强，通义多模态好，豆包在某些中文场景强，智谱的 Agent 能力专业，某些场景还必须用海外模型。它不可能只用一家。而一旦用多家，它就要同时承担：\n\n五套不同的 API 协议和 SDK；五个独立的充值账户和余额监控；五套不同的限流规则和错误码；五份分散的账单，无法汇总核算真实成本；五次商务谈判、五份合同、五张发票流程；五份合规备案材料的收集与公示。\n\n这些成本不出现在任何一张价目表上，但它们真实地消耗着客户最贵的资源——工程师时间和财务时间。我们收取的差价，本质上是客户为消除这些成本而付的钱。这就是\"复杂度税\"。\n\n补充一个反向的判断标准，销售必须诚实掌握：如果一个客户只用一个模型、用量极小、不需要发票、不在乎稳定性——那他确实不该是我们的客户。 硬啃这类客户既没利润也没口碑。识别出\"我们不该服务谁\"，和知道\"我们该服务谁\"同样重要。\n\n\n\n 二、四条业务线及其相互关系\n\n我们同时经营四条业务线，它们不是并列的四个产品，而是一个有递进关系的结构。\n\n 2.1 渠道代理（国内大模型官方代理）\n\n做什么：与国内主流模型厂商建立正式的渠道代理或经销关系，以代理价拿货，为客户提供官方通道的采购、开票、技术支持与售后。\n\n赚什么：厂商给予的代理折扣与返点，以及基于采购量的阶梯返利。\n\n战略作用：这是信任资产。有官方代理身份意味着我们不是野生中转站，客户的合规审查、法务审查能过。对中大型企业客户，\"是否为官方授权渠道\"往往是准入的第一道筛子。\n\n风险：厂商政策变动、代理权被稀释、厂商直销团队与我们抢客户。应对方式是不依赖单一厂商，并把价值沉淀在服务层而非通道层。\n\n 2.2 多模型聚合网关（自有产品）\n\n做什么：一套统一 API，一个账户，接入所有主流模型；原生兼容 OpenAI、Anthropic、Gemini 三套协议；提供细粒度账单、缓存可见性、智能路由、故障自动切换。\n\n赚什么：上游拿货价与对客销售价之间的价差，加上高阶功能（路由优化、成本分析、私有部署对接）的服务费。\n\n战略作用：这是产品资产和数据资产。客户的每一次调用都在告诉我们：市场在用什么模型、什么场景消耗最大、哪里有优化空间。这些数据是我们从\"中间商\"进化为\"AI 成本管理服务商\"的唯一路径。\n\n风险：技术投入大、稳定性责任全在自己、上游断供风险。应对方式是多上游冗余 + 明确的 SLA 与补偿机制。\n\n 2.3 算力/额度批发分销\n\n做什么：以大额预付换取上游更深折扣，将额度批发给下游代理商、小型服务商、有稳定用量的中型客户。\n\n赚什么：批零价差。规模是唯一的杠杆。\n\n战略作用：这是现金流引擎和议价筹码。批发业务带来的采购量直接决定我们在上游能拿到什么价格，进而决定另外三条线的竞争力。\n\n风险：这是四条线里风险最高的一条。预付资金被锁定、下游账期与坏账、囤额度遇到降价直接亏损。必须设置严格的资金上限和降价对冲机制（详见模块 04 与模块 08）。\n\n 2.4 场景化解决方案（延伸业务）\n\n做什么：基于前三条线积累的客户理解与调用数据，为客户提供模型选型咨询、成本优化服务、路由策略设计、trace 与评测基础设施、私有化部署对接。\n\n 202607 重新定位（见模块 19 收录 001）：这条线原本包含\"场景化 Agent 开发\"。但随着\"企业核心智能不能外包\"成为行业主张，客户不会再买\"你替我建一个 Agent\"。这条线要从\"替客户建\"改成\"让客户自己建的东西跑得更省、更稳、更看得清\"——我们提供脚手架和度量，客户保留领域知识与业务逻辑。这个转向反而更有利：毛利结构和可复制性都优于定制开发，也避开了项目制交付的人力陷阱。\n\n 202607 技术路径补充（见模块 26）：这条线的具体技术实现已有明确分级方案。可做的是 L0–L2：上游缓存对齐（读价 0.1 倍，不需读客户数据内容）、模型路由（成本降 35%–45%）、单租户内的评测集与示例库沉淀。不可做的是 L3–L4：用客户数据微调、跨客户数据混用——前者经济性不成立（打平点高于物理吞吐上限 6 倍），后者是红线。\"给脚手架和度量、不碰客户领域知识\"这个定位，在合规与技术两条独立路径上都得到了验证。\n\n赚什么：项目制服务费与持续的优化订阅费。这是毛利率最高的一条线（可达 50%–70%）。\n\n战略作用：这是终局业务。前三条线在清洗期会被压缩毛利，这一条线是我们活下去并向上走的方向。\n\n 2.5 四条线的递进逻辑\n\n用一句话概括它们的关系：代理身份换信任，聚合网关换数据，批发分销换规模，解决方案换利润。\n\n早期（0–12 个月）以代理和聚合为主，快速建立客户基础和信任；中期（12–24 个月）用批发放大规模、压低上游成本；长期以解决方案承接利润。任何时候如果只剩下第三条线还在跑，说明公司战略已经失败——因为纯批发是最容易被规模更大的对手碾死的形态。\n\n 2.6 候选的第五条线：Token 工厂（自建推理供给）\n\n 202607 新增指针（详见模块 25）。 这条线目前不成立，列在这里是为了防止它被反复重新提起。\n\n它是什么：不再只做转售，而是自己持有推理算力、自己出 token，从\"渠道\"变成\"供给\"。\n\n为什么现在不做：模块 25 拆了硅基流动 2025 年的公开财务——收入 5533 万（同比 +653%），亏损 3.45 亿，整体毛利率 −24.0%，其中公有云业务毛利率 −119.0%，月均现金消耗约 1480 万。在公有云 token 这个战场上，一家有 1028 万注册用户、13000+ 企业客户、日均 5785 亿 token 的头部玩家，每卖一块钱倒贴两块多。 我们没有任何理由认为自己能做得更好。\n\n但同一组数据里有一个正向发现：把公有云剥离后倒推，本地部署/私有化交付的毛利率约 +82.6%。同一家公司，两条业务线，一条 −119%，一条 +82.6%。\n\n所以结论是有条件的，不是一刀切：\n\n 不做公有云 Token 工厂——现阶段，以及可预见的未来。这是一条明确的红线。\n 若要碰\"供给\"，只能从本地部署/私有化交付切入，且必须按模块 25 第七节的四阶段推进：先转售（零固定成本）→ 签到 1–2 个私有化订单后租用试水 → 签约负载能撑住 60% 利用率且试水阶段毛利为正才小规模采购 → 连续两季盈利且利用率 70%+ 才扩张。每一阶段的前进条件都是\"已签约的负载\"，不是\"预期的客户数\"。\n\n这条线与 2.4 解决方案线的关系：它其实是 2.4 的自然延伸——本地部署交付本来就属于\"让客户自己建的东西跑得更省更稳\"。所以在阶段 0–1，它不需要作为独立业务线存在，只是解决方案线的一种交付形态。只有进入阶段 2（开始持有资产）之后，它才在会计和风险上真正变成第五条线。\n\n\n\n 三、价值主张：对四类客户各说一句话\n\n价值主张不能只有一个版本。同一套能力，对不同客户要翻译成不同的语言。\n\n对 AI 应用创业公司：\n \"你的工程师应该花时间做产品，不是花时间维护五套模型接口和五个充值账户。我们让你一行代码切换所有模型，一张账单看清所有成本，一次充值不用再管余额告警。\"\n\n痛点锚点是工程效率和现金流。这类客户人少、钱紧、迭代快，最怕的是工程师被基础设施拖住，以及某个模型突然限流导致线上事故。\n\n对中大型企业客户：\n \"我们是官方授权渠道，合同、发票、备案材料、等保配合一次性给全；子账号和部门预算管控让你的 IT 部门知道每一分 AI 支出花在哪个业务上；SLA 和故障补偿写进合同。\"\n\n痛点锚点是合规、可审计、可问责。这类客户不缺钱，缺的是\"出了事有人负责\"和\"内部能交代得过去\"。价格在他们的决策权重里往往排第三第四位。\n\n对中小企业与开发者：\n \"不用注册五个平台，不用最低充值门槛，按量付费，用多少扣多少，账单一目了然，随时可以开票。\"\n\n痛点锚点是门槛和便利。这类客户量小但笔数多，是口碑扩散的主要来源，服务上要极度自助化，不能靠人力堆。\n\n对下游代理商与渠道：\n \"我们提供白标网关、独立结算后台、分级分润和完整的销售物料，你只管卖，交付和技术我们兜底。\"\n\n痛点锚点是低门槛创业和稳定分润。这类伙伴关心的是\"我需要投入多少\"和\"我能赚多少、什么时候能拿到钱\"。\n\n\n\n 四、护城河：现在有什么，将来要建什么\n\n诚实地说，0→1 阶段我们几乎没有护城河。这一点必须对内对外都讲清楚，尤其是面对投资人时，虚构护城河是最容易被戳穿的。\n\n我们现在有的只是三样东西：起步期的服务密度（能给客户官方给不了的响应速度）、合规意愿（愿意做别人嫌麻烦的事）、以及模型选型的专业判断。这三样都可以被复制。\n\n真正需要在 12–24 个月内建起来的护城河有四层：\n\n第一层是转换成本。 当客户的路由策略、缓存配置、成本分析报表、多部门账号体系都建在我们平台上时，迁移成本会变得很高。这一层靠产品深度实现，是最现实、最快能建起来的一层。\n\n第二层是数据壁垒。 积累足够多的真实调用数据后，我们能回答\"这个场景用哪个模型最划算\"这类没人能回答的问题。这一层靠时间和规模实现。\n\n第三层是合规资质。 完整的资质组合（详见模块 08）本身构成准入门槛，把大量竞争者挡在企业客户之外。这一层靠钱和时间实现，可以现在就启动。\n\n第四层是渠道网络。 一张覆盖细分行业和区域的代理商网络，一旦形成粘性就很难被撬动。这一层最慢，但一旦建成最稳固。\n\n给决策层的判断建议：不要等护城河建好再扩张，也不要只扩张不建护城河。 前 12 个月的正确姿势是用服务密度换客户，同时把合规资质和产品深度这两件\"确定要做\"的事同步推进。\n\n\n\n 五、这门生意可能失败的四种方式\n\n任何商业模式的文档只讲成功路径都是不诚实的。以下四种失败方式必须被决策层持续监控。\n\n第一种：被上游抛弃。 模型厂商决定直接服务所有客户、取消渠道体系，或大幅收紧代理折扣。这是最致命的风险，我们对此几乎没有控制力。唯一的缓解是不依赖单一上游，并让客户粘在我们的产品能力上而非通道上。\n\n第二种：被价格战杀死。 规模更大的对手把价差压到零，用亏损换市场。应对方式是坚决不跟进纯价格战，把竞争转移到服务和管理能力的维度。\n\n第三种：被合规清退。 监管收紧、资质不全、或某个客户用我们的通道做了违规内容生成，导致连带责任。应对方式是模块 08 的全套风控体系，且必须在业务扩张之前就位。\n\n第四种：被资金链拖垮。 这是批发业务的固有风险——大额预付上游、下游给账期、中间遇到上游降价或下游坏账，现金流断裂。应对方式是严格的预付上限、账期管理和降价条款谈判。\n\n对投资人讲这四条不是自曝其短，而是证明我们清醒。一个说不出自己怎么会死的创业者，投资人不会信他知道怎么活。\n"}, {"id": "03-供给体系与产品架构", "code": "03", "title": "模块 03 · 供给体系与产品架构", "short": "供给体系与产品架构", "subs": ["一、供给侧：上游资源体系", "二、产品架构：统一 AI 网关", "三、交付形态", "四、技术实现路径建议（0→1 阶段）"], "html": "<h1>模块 03 · 供给体系与产品架构</h1>\n<blockquote>\n<p>本模块解决的问题：我们卖的东西具体是什么、技术上怎么实现、怎么交付。\n使用者：销售需要讲清楚产品，技术需要知道建什么，客户成功需要知道怎么交付。</p>\n</blockquote>\n<hr />\n<h2>一、供给侧：上游资源体系</h2>\n<h3>1.1 上游的四种接入形态</h3>\n<p>我们与上游的关系不是单一的，按合作深度从浅到深分为四种，销售在对客介绍时<strong>必须准确说明某个模型属于哪一种</strong>，说错了就是虚假宣传。</p>\n<p><strong>官方代理/经销关系</strong>：签署正式渠道协议，有授权文件，能开具官方认可的采购凭证，享受阶梯返点。这是最理想的形态，可对客宣称\"官方授权渠道\"。</p>\n<p><strong>企业级 API 采购</strong>：以企业身份大额采购官方 API 额度，没有渠道身份但有专属商务对接和折扣。可对客宣称\"官方直连通道\"，<strong>不可宣称\"官方授权代理\"</strong>。</p>\n<p><strong>云平台转售</strong>：通过阿里云百炼、火山方舟、腾讯云等 MaaS 平台采购，享受云厂商的渠道政策。稳定性和资质随云厂商，但模型受限于该平台生态。</p>\n<p><strong>第三方聚合中转</strong>：通过其他聚合平台采购。<strong>这是最后的补充选项，仅用于长尾模型或临时冗余</strong>，绝不作为主力通道，因为稳定性和合规性不受我们控制。对客户必须如实标注该模型的通道性质。</p>\n<h3>1.2 上游选择的五个评估维度</h3>\n<p>评估一个上游是否值得接入，按以下顺序打分：</p>\n<p><strong>稳定性</strong>优先于价格。一个便宜 15% 但每月掉线两次的通道，带来的客户流失损失远超省下的成本。要求上游提供明确的 SLA，无 SLA 承诺的通道不能作为主力。</p>\n<p><strong>价格与折扣结构</strong>看的不只是当前折扣，更要看阶梯规则——采购量翻倍时折扣能提升多少，决定了我们的规模效应能不能兑现。</p>\n<p><strong>结算条件</strong>直接影响现金流。预付还是后付、是否有账期、有无最低消费、额度是否有有效期、剩余额度能否退——这几条谈判条件的价值经常超过 3%–5% 的价差。</p>\n<p><strong>合规完备度</strong>指上游能否提供模型备案号、算法备案截图、正式合同与增值税专票。缺任何一项都会在服务企业客户时变成障碍。</p>\n<p><strong>技术配套</strong>包括协议标准程度、限流规则透明度、错误码规范、是否支持缓存及缓存计费是否可见。</p>\n<h3>1.3 供给风险的四条铁律</h3>\n<p><strong>铁律一：任何单一上游的采购占比不得超过 40%。</strong> 超过这个比例，一次政策变动就能重创业务。</p>\n<p><strong>铁律二：每个主力模型至少有两条通道。</strong> 主通道故障时能在分钟级切换到备用通道，哪怕备用通道更贵。</p>\n<p><strong>铁律三：预付资金不得超过可用现金的规定比例。</strong> 具体比例由决策层设定（建议起步期不超过 30%），且必须与下游回款周期匹配。</p>\n<p><strong>铁律四：与上游谈判必须争取\"降价保护条款\"。</strong> 即在我们预付额度的有效期内，若官方降价，已购额度按新价折算或补偿差额。没有这一条，一次上游降价就能把批发业务的利润全部抹平。</p>\n<hr />\n<h2>二、产品架构：统一 AI 网关</h2>\n<h3>2.1 核心设计原则</h3>\n<p>产品的全部设计围绕一句话：<strong>让客户觉得自己只对接了一个模型，同时享受所有模型的能力。</strong></p>\n<p>具体展开为四条原则。第一是<strong>零迁移成本</strong>——客户只需要改一行 base_url，SDK、代码、协议全部不变。第二是<strong>协议原生兼容</strong>——同时原生支持 OpenAI、Anthropic、Gemini 三套协议，不做中间件转译，避免延迟和字段丢失。第三是<strong>成本完全可见</strong>——账单精确到每次调用的输入 token、输出 token、缓存命中 token 及各自单价。第四是<strong>故障对客户透明</strong>——上游波动由网关内部消化，客户感知不到。</p>\n<h3>2.2 功能模块清单</h3>\n<p><strong>接入层</strong>提供统一 API 端点、三协议原生兼容、流式与非流式响应、function calling 与结构化输出的完整透传、多模态输入支持。</p>\n<p><strong>路由层</strong>是产品的核心差异化所在。它包含四类路由策略：<strong>故障转移路由</strong>（主通道异常时自动切备），<strong>成本优化路由</strong>（同等能力要求下自动选择当前最便宜的模型），<strong>负载均衡路由</strong>（多个上游账户间分摊请求以规避单账户限流），<strong>场景指定路由</strong>（客户可为不同业务线绑定不同模型，无需改代码）。</p>\n<p><strong>计量层</strong>负责逐次调用的 token 精确计量、缓存命中识别与单独计价、实时余额扣减、异常调用检测。这一层的准确性是整个商业模式的信用基础，<strong>计量出错等于财务出错</strong>。</p>\n<p><strong>管控层</strong>面向企业客户，提供子账号体系、部门与项目维度的用量归集、预算上限与超额熔断、用量告警（按日/周/月及阈值触发）、完整的调用审计日志（留存不少于 6 个月，这是合规硬要求）。</p>\n<p><strong>分析层</strong>是我们从工具走向服务的关键，提供成本构成分析（按模型/业务/时段）、缓存优化建议（识别未使用缓存的高频重复前缀）、模型替换建议（识别可用更低价模型完成的调用）、异常消耗归因。</p>\n<p><strong>结算层</strong>处理充值与扣费、账单生成与导出、发票申请与开具、代理商分润计算。</p>\n<h3>2.3 SLA 与服务承诺设计</h3>\n<p>服务承诺是我们区别于野生中转站的最直接标志，但<strong>承诺什么就必须做到什么</strong>，做不到的承诺会变成法律风险。</p>\n<p>起步期建议的承诺梯度：面向长尾客户提供尽力而为的服务，不作硬性 SLA 承诺；面向付费达到一定规模的客户承诺 99.9% 可用性；面向签约企业客户承诺 99.9%–99.95% 可用性并写入合同，配套故障时长对应的服务费减免条款。</p>\n<p><strong>在自身架构的冗余能力达标之前，不要签署高于自身实际能力的 SLA。</strong> 起步期最常见的自杀方式就是为了拿下一个大客户签了 99.99%，然后被赔穿。</p>\n<hr />\n<h2>三、交付形态</h2>\n<h3>3.1 面向不同客户的交付方式</h3>\n<p><strong>自助注册</strong>（面向开发者与中小企业）：官网注册、在线充值、控制台自助获取 API Key、文档自助接入。全流程无人工介入，这是长尾客户唯一经济的服务方式。</p>\n<p><strong>商务签约</strong>（面向中大型企业）：需求调研、方案设计、POC 测试、合同签署、专属账号开通、技术对接支持、定期用量回顾。周期通常 4–12 周。</p>\n<p><strong>白标输出</strong>（面向下游代理商）：提供可自定义品牌的控制台、独立域名、独立结算体系，代理商以自己的品牌服务终端客户，我们在后端提供通道与技术支撑。</p>\n<p><strong>私有化对接</strong>（面向有数据合规要求的大客户）：网关组件部署在客户侧或客户指定的云环境，仅出站调用经过我们的通道，客户数据不落我们的库。这是攻克金融、医疗、政务类客户的必要能力。</p>\n<h3>3.2 标准接入流程</h3>\n<p>一个典型的客户从签约到跑通生产，标准流程是七步：需求确认与场景梳理 → 模型选型建议与试算 → 测试账号开通与 POC → 压测与稳定性验证 → 正式合同与充值 → 生产环境切换与灰度 → 首月用量复盘与优化建议。</p>\n<p><strong>第七步是最容易被忽略也最有价值的一步。</strong> 首月复盘时给出的成本优化建议（通常能帮客户省下 15%–40%），是决定客户是否长期留下来的关键动作，也是把关系从\"供应商\"升级为\"顾问\"的唯一机会。</p>\n<hr />\n<h2>四、技术实现路径建议（0→1 阶段）</h2>\n<p>起步期不要自研全部组件。合理的路径是：<strong>第一阶段基于成熟开源网关快速搭建 MVP</strong>，把精力放在计量准确性和账单颗粒度上——这两点是客户最先感知的差异，也是开源方案做得最差的地方。<strong>第二阶段自研路由层和分析层</strong>，这是差异化和数据资产的来源。<strong>第三阶段补齐企业管控层和私有化部署能力</strong>，用于攻克大客户。</p>\n<p>有三件事从第一天就必须做对，后期返工代价极高：<strong>计量数据的准确与不可篡改</strong>（这是财务和信任的基础）、<strong>调用日志的完整留存</strong>（这是合规硬要求，6 个月起）、<strong>账户与额度的资金安全</strong>（预付款项的数据一旦出错就是直接的资金损失和信任崩塌）。</p>", "plain": " 模块 03 · 供给体系与产品架构\n\n 本模块解决的问题：我们卖的东西具体是什么、技术上怎么实现、怎么交付。\n 使用者：销售需要讲清楚产品，技术需要知道建什么，客户成功需要知道怎么交付。\n\n\n\n 一、供给侧：上游资源体系\n\n 1.1 上游的四种接入形态\n\n我们与上游的关系不是单一的，按合作深度从浅到深分为四种，销售在对客介绍时必须准确说明某个模型属于哪一种，说错了就是虚假宣传。\n\n官方代理/经销关系：签署正式渠道协议，有授权文件，能开具官方认可的采购凭证，享受阶梯返点。这是最理想的形态，可对客宣称\"官方授权渠道\"。\n\n企业级 API 采购：以企业身份大额采购官方 API 额度，没有渠道身份但有专属商务对接和折扣。可对客宣称\"官方直连通道\"，不可宣称\"官方授权代理\"。\n\n云平台转售：通过阿里云百炼、火山方舟、腾讯云等 MaaS 平台采购，享受云厂商的渠道政策。稳定性和资质随云厂商，但模型受限于该平台生态。\n\n第三方聚合中转：通过其他聚合平台采购。这是最后的补充选项，仅用于长尾模型或临时冗余，绝不作为主力通道，因为稳定性和合规性不受我们控制。对客户必须如实标注该模型的通道性质。\n\n 1.2 上游选择的五个评估维度\n\n评估一个上游是否值得接入，按以下顺序打分：\n\n稳定性优先于价格。一个便宜 15% 但每月掉线两次的通道，带来的客户流失损失远超省下的成本。要求上游提供明确的 SLA，无 SLA 承诺的通道不能作为主力。\n\n价格与折扣结构看的不只是当前折扣，更要看阶梯规则——采购量翻倍时折扣能提升多少，决定了我们的规模效应能不能兑现。\n\n结算条件直接影响现金流。预付还是后付、是否有账期、有无最低消费、额度是否有有效期、剩余额度能否退——这几条谈判条件的价值经常超过 3%–5% 的价差。\n\n合规完备度指上游能否提供模型备案号、算法备案截图、正式合同与增值税专票。缺任何一项都会在服务企业客户时变成障碍。\n\n技术配套包括协议标准程度、限流规则透明度、错误码规范、是否支持缓存及缓存计费是否可见。\n\n 1.3 供给风险的四条铁律\n\n铁律一：任何单一上游的采购占比不得超过 40%。 超过这个比例，一次政策变动就能重创业务。\n\n铁律二：每个主力模型至少有两条通道。 主通道故障时能在分钟级切换到备用通道，哪怕备用通道更贵。\n\n铁律三：预付资金不得超过可用现金的规定比例。 具体比例由决策层设定（建议起步期不超过 30%），且必须与下游回款周期匹配。\n\n铁律四：与上游谈判必须争取\"降价保护条款\"。 即在我们预付额度的有效期内，若官方降价，已购额度按新价折算或补偿差额。没有这一条，一次上游降价就能把批发业务的利润全部抹平。\n\n\n\n 二、产品架构：统一 AI 网关\n\n 2.1 核心设计原则\n\n产品的全部设计围绕一句话：让客户觉得自己只对接了一个模型，同时享受所有模型的能力。\n\n具体展开为四条原则。第一是零迁移成本——客户只需要改一行 base_url，SDK、代码、协议全部不变。第二是协议原生兼容——同时原生支持 OpenAI、Anthropic、Gemini 三套协议，不做中间件转译，避免延迟和字段丢失。第三是成本完全可见——账单精确到每次调用的输入 token、输出 token、缓存命中 token 及各自单价。第四是故障对客户透明——上游波动由网关内部消化，客户感知不到。\n\n 2.2 功能模块清单\n\n接入层提供统一 API 端点、三协议原生兼容、流式与非流式响应、function calling 与结构化输出的完整透传、多模态输入支持。\n\n路由层是产品的核心差异化所在。它包含四类路由策略：故障转移路由（主通道异常时自动切备），成本优化路由（同等能力要求下自动选择当前最便宜的模型），负载均衡路由（多个上游账户间分摊请求以规避单账户限流），场景指定路由（客户可为不同业务线绑定不同模型，无需改代码）。\n\n计量层负责逐次调用的 token 精确计量、缓存命中识别与单独计价、实时余额扣减、异常调用检测。这一层的准确性是整个商业模式的信用基础，计量出错等于财务出错。\n\n管控层面向企业客户，提供子账号体系、部门与项目维度的用量归集、预算上限与超额熔断、用量告警（按日/周/月及阈值触发）、完整的调用审计日志（留存不少于 6 个月，这是合规硬要求）。\n\n分析层是我们从工具走向服务的关键，提供成本构成分析（按模型/业务/时段）、缓存优化建议（识别未使用缓存的高频重复前缀）、模型替换建议（识别可用更低价模型完成的调用）、异常消耗归因。\n\n结算层处理充值与扣费、账单生成与导出、发票申请与开具、代理商分润计算。\n\n 2.3 SLA 与服务承诺设计\n\n服务承诺是我们区别于野生中转站的最直接标志，但承诺什么就必须做到什么，做不到的承诺会变成法律风险。\n\n起步期建议的承诺梯度：面向长尾客户提供尽力而为的服务，不作硬性 SLA 承诺；面向付费达到一定规模的客户承诺 99.9% 可用性；面向签约企业客户承诺 99.9%–99.95% 可用性并写入合同，配套故障时长对应的服务费减免条款。\n\n在自身架构的冗余能力达标之前，不要签署高于自身实际能力的 SLA。 起步期最常见的自杀方式就是为了拿下一个大客户签了 99.99%，然后被赔穿。\n\n\n\n 三、交付形态\n\n 3.1 面向不同客户的交付方式\n\n自助注册（面向开发者与中小企业）：官网注册、在线充值、控制台自助获取 API Key、文档自助接入。全流程无人工介入，这是长尾客户唯一经济的服务方式。\n\n商务签约（面向中大型企业）：需求调研、方案设计、POC 测试、合同签署、专属账号开通、技术对接支持、定期用量回顾。周期通常 4–12 周。\n\n白标输出（面向下游代理商）：提供可自定义品牌的控制台、独立域名、独立结算体系，代理商以自己的品牌服务终端客户，我们在后端提供通道与技术支撑。\n\n私有化对接（面向有数据合规要求的大客户）：网关组件部署在客户侧或客户指定的云环境，仅出站调用经过我们的通道，客户数据不落我们的库。这是攻克金融、医疗、政务类客户的必要能力。\n\n 3.2 标准接入流程\n\n一个典型的客户从签约到跑通生产，标准流程是七步：需求确认与场景梳理 → 模型选型建议与试算 → 测试账号开通与 POC → 压测与稳定性验证 → 正式合同与充值 → 生产环境切换与灰度 → 首月用量复盘与优化建议。\n\n第七步是最容易被忽略也最有价值的一步。 首月复盘时给出的成本优化建议（通常能帮客户省下 15%–40%），是决定客户是否长期留下来的关键动作，也是把关系从\"供应商\"升级为\"顾问\"的唯一机会。\n\n\n\n 四、技术实现路径建议（0→1 阶段）\n\n起步期不要自研全部组件。合理的路径是：第一阶段基于成熟开源网关快速搭建 MVP，把精力放在计量准确性和账单颗粒度上——这两点是客户最先感知的差异，也是开源方案做得最差的地方。第二阶段自研路由层和分析层，这是差异化和数据资产的来源。第三阶段补齐企业管控层和私有化部署能力，用于攻克大客户。\n\n有三件事从第一天就必须做对，后期返工代价极高：计量数据的准确与不可篡改（这是财务和信任的基础）、调用日志的完整留存（这是合规硬要求，6 个月起）、账户与额度的资金安全（预付款项的数据一旦出错就是直接的资金损失和信任崩塌）。\n"}, {"id": "04-定价体系与单位经济模型", "code": "04", "title": "模块 04 · 定价体系与单位经济模型", "short": "定价体系与单位经济模型", "subs": ["一、成本结构拆解", "二、毛利测算的标准公式", "三、定价策略", "四、批发/囤货业务的专项风控", "五、单位经济模型示例（用于内部测算与投资人沟通）", "六、财务监控指标"], "html": "<h1>模块 04 · 定价体系与单位经济模型</h1>\n<blockquote>\n<p>⚠️ <strong>内部机密文件。</strong> 对外分发版本必须删除本模块的成本与毛利数据。\n本模块解决的问题：一笔单子到底赚多少、怎么报价不亏、什么时候该拒绝订单。\n使用者：销售（报价前必读）、决策层、财务。</p>\n</blockquote>\n<hr />\n<h2>一、成本结构拆解</h2>\n<p>一笔 token 收入背后的成本由五部分构成，销售在心里必须有这张成本表，否则\"感觉还有得赚\"的单子实际上是亏的。</p>\n<p><strong>直接采购成本</strong>是上游的实际拿货价，占比最大。以行业公开的加成水位推算，若对客按官方价的 88 折销售、我们按官方价的 78 折拿货，则采购成本占收入的约 89%，毛利率约 11%。<strong>这就是纯转售业务的真实水位——十个点出头，没有想象空间。</strong></p>\n<p><strong>技术与带宽成本</strong>包括网关服务器、流量、日志存储（6 个月留存是硬要求，存储成本不小）、监控告警系统。按收入的 2%–4% 估算。</p>\n<p><strong>服务成本</strong>是最容易被低估的一项。技术对接、故障响应、账单答疑、优化建议——这些人力投入在小客户身上摊薄后可能超过毛利本身。<strong>一个月消费 2000 元、每周找技术支持三次的客户，是纯亏损客户。</strong></p>\n<p><strong>资金成本</strong>是批发业务特有的。预付上游的资金被锁定，加上下游账期，中间的资金占用有实际的机会成本和融资成本。按占用资金的年化成本计算。</p>\n<p><strong>风险成本</strong>包括坏账准备、SLA 赔付准备、上游降价导致的存货贬值准备。起步期建议按收入的 2%–3% 计提。</p>\n<p>把五项加总，<strong>纯转售业务的净利率在起步期大概率是负的或接近零</strong>。这不是失败，这是这门生意的常态——<strong>转售业务的作用是获客和获取数据，利润必须来自增值服务和规模化后的上游折扣提升。</strong> 这个认知如果不在全员脑子里，销售就会为了冲量签下一堆亏损订单。</p>\n<hr />\n<h2>二、毛利测算的标准公式</h2>\n<h3>2.1 单笔订单毛利</h3>\n<pre><code>收入        = Σ(输入token × 对客输入单价 + 输出token × 对客输出单价\n              + 缓存token × 对客缓存单价)\n\n采购成本    = Σ(输入token × 采购输入单价 + 输出token × 采购输出单价\n              + 缓存token × 采购缓存单价)\n\n毛利        = 收入 − 采购成本\n毛利率      = 毛利 ÷ 收入\n</code></pre>\n<p><strong>必须按输入、输出、缓存三类分别计算，不能用总 token 数乘平均价。</strong> 因为输出价通常是输入价的 3–4 倍，而不同客户的输入输出比差异巨大：一个做长文档摘要的客户输入输出比可能是 50:1，一个做内容生成的客户可能是 1:5。用平均价估算，误差可以达到两三倍。</p>\n<h3>2.2 客户级贡献毛利</h3>\n<pre><code>贡献毛利 = 订单毛利 − 分摊技术成本 − 直接服务成本 − 风险计提\n</code></pre>\n<p>服务成本按实际投入的人时估算。建议给每个客户打一个<strong>服务强度标签</strong>（低/中/高），低强度按收入 1% 计，中强度 5%，高强度 15%。这个标签由客户成功人员每月更新。</p>\n<h3>2.3 客户健康度判断线</h3>\n<table>\n<thead>\n<tr>\n<th>贡献毛利率</th>\n<th>判定</th>\n<th>处置动作</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>&gt; 20%</td>\n<td>优质</td>\n<td>重点维护，争取扩量与增值服务</td>\n</tr>\n<tr>\n<td>10%–20%</td>\n<td>健康</td>\n<td>正常服务，寻找优化空间</td>\n</tr>\n<tr>\n<td>3%–10%</td>\n<td>薄利</td>\n<td>降低服务强度，引导自助化</td>\n</tr>\n<tr>\n<td>0%–3%</td>\n<td>临界</td>\n<td>提价或缩减服务，限期改善</td>\n</tr>\n<tr>\n<td>&lt; 0%</td>\n<td>失血</td>\n<td>三个月内改善或主动退出</td>\n</tr>\n</tbody>\n</table>\n<p><strong>\"主动退出客户\"必须成为一个被允许、甚至被鼓励的动作。</strong> 起步期公司最常见的错误是把所有客户都当宝贝，结果被少数几个高服务强度的低毛利客户耗死。</p>\n<hr />\n<h2>三、定价策略</h2>\n<h3>3.1 定价的三层结构</h3>\n<p><strong>引流层</strong>对标官方价的 85%–90%，用于通用低价模型和新客户首单。这一层毛利极薄甚至为零，作用是获客和建立价格认知。<strong>明确告诉销售：这一层不考核毛利，只考核转化。</strong></p>\n<p><strong>主力层</strong>对标官方价的 90%–95%，用于主流中档模型。这是毛利的主要来源，也是绝大多数订单应该落在的区间。</p>\n<p><strong>价值层</strong>不与官方价直接对标，而是打包定价——网关服务 + SLA 保障 + 管控功能 + 优化服务，按\"平台服务费 + token 用量费\"的组合收取。<strong>这一层的毛利率可以做到 30%–60%，是我们真正要往那里引导的方向。</strong></p>\n<h3>3.2 量价阶梯设计原则</h3>\n<p>阶梯折扣必须与我们从上游拿到的阶梯折扣<strong>结构对齐</strong>。如果上游是在月采购 50 万时给我们提升 3 个点，那我们对客的阶梯拐点应该设在能推动我们跨过 50 万的位置，而不是随手设一个整数。</p>\n<p>阶梯设计的三条纪律：<strong>折扣只随实际用量兑现，不预支</strong>（承诺量不等于实际量，预支折扣是常见的亏损来源）；<strong>阶梯以季度而非月度考核</strong>，避免客户用量波动导致折扣频繁变动；<strong>最高阶梯的折扣必须给公司留下不低于 8% 的毛利底线</strong>，触及底线的报价必须上报审批。</p>\n<h3>3.3 报价审批权限建议</h3>\n<table>\n<thead>\n<tr>\n<th>毛利率区间</th>\n<th>审批层级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>≥ 15%</td>\n<td>销售自主决定</td>\n</tr>\n<tr>\n<td>10%–15%</td>\n<td>销售主管审批</td>\n</tr>\n<tr>\n<td>8%–10%</td>\n<td>业务负责人审批</td>\n</tr>\n<tr>\n<td>&lt; 8%</td>\n<td>决策层审批，需说明战略理由</td>\n</tr>\n</tbody>\n</table>\n<p><strong>低于 8% 的订单不是不能签，而是必须有明确的战略理由</strong>——比如标杆客户、行业突破口、能带来渠道网络。理由要写进审批记录，季度复盘时验证是否兑现。</p>\n<hr />\n<h2>四、批发/囤货业务的专项风控</h2>\n<p>这是四条业务线里唯一可能造成<strong>灾难性损失</strong>的一条，规则必须比其他业务严格得多。</p>\n<p><strong>降价风险是首要风险。</strong> 上游模型价格在持续下行通道中，今天以 78 折囤的额度，如果三个月后官方直接降价 30%，这批额度的市场价值直接跌破成本。<strong>因此：所有大额预付必须在合同中争取降价保护条款</strong>（官方降价时按新价折算或补差），拿不到这一条的预付必须大幅压缩规模，并把额度的周转周期控制在 60 天以内。</p>\n<p><strong>流动性风险是第二风险。</strong> 预付款是沉淀资金，下游账期是应收账款，两头挤压最容易断裂。建议设置三条硬线：预付资金不超过可用现金的规定上限（起步期建议 30%）；单个下游客户的应收账款不超过总应收的 25%；账期超过约定天数自动停止供货。</p>\n<p><strong>囤货规模的计算方法</strong>：预付额度应基于<strong>过去 90 天的实际日均消耗</strong>推算，覆盖期不超过 60 天。公式为：</p>\n<pre><code>建议预付额度 = 近90天日均消耗 × 60天 × (1 + 增长系数)\n增长系数在 0.2–0.5 之间，视增长确定性而定\n</code></pre>\n<p><strong>绝不基于\"预期签约量\"囤货。</strong> 预期会落空，额度不会自己变回现金。</p>\n<hr />\n<h2>五、单位经济模型示例（用于内部测算与投资人沟通）</h2>\n<p>以下为<strong>结构示例，非真实业绩数据</strong>，实际数值需在业务启动后用真实数据替换。使用时必须标注\"模型假设\"字样。</p>\n<p>以一个典型的 AI 创业公司客户为例：月消费 5 万元，模型组合以中档为主，输入输出比约 3:1，服务强度中等。</p>\n<p>按主力层定价（官方价 92 折）、采购按官方价 80 折计算，则收入 5 万，采购成本约 4.35 万，订单毛利约 6500 元，毛利率 13%。扣除技术成本 1500 元（3%）、服务成本 2500 元（5%）、风险计提 1000 元（2%），贡献毛利约 1500 元，贡献毛利率 3%。</p>\n<p><strong>这个数字看起来很难看，而这正是要点。</strong> 它说明三件事：第一，纯转售单靠价差养不活公司；第二，服务成本的控制比价差的争取更重要；第三，<strong>必须向增值服务要利润</strong>——如果这个客户同时购买了成本优化服务（比如按节省额的 20% 分成，帮他每月省 1 万则收 2000 元），贡献毛利立刻从 1500 元变成 3500 元，毛利率翻倍还多。</p>\n<p><strong>给决策层的核心结论：这门生意的利润杠杆不在采购端，在服务端。</strong> 把 80% 的精力放在跟上游磨 2 个点的折扣上，不如把精力放在让 30% 的客户购买增值服务上。</p>\n<hr />\n<h2>六、财务监控指标</h2>\n<p>以下指标建议按月跟踪，是判断业务健康度的仪表盘。</p>\n<p><strong>规模类</strong>：月度 token 消耗量、月度收入、月度采购额、活跃客户数。</p>\n<p><strong>效率类</strong>：综合毛利率、贡献毛利率、单客户平均收入（ARPU）、销售人均产出。</p>\n<p><strong>质量类</strong>：客户留存率、净收入留存率（NRR，衡量老客户是否在扩量，健康值应大于 110%）、增值服务渗透率（购买增值服务的客户占比，目标 30%）。</p>\n<p><strong>风险类</strong>：应收账款周转天数、预付款占比、单一上游采购集中度、单一客户收入集中度、坏账率。</p>\n<p><strong>NRR 是所有指标中最重要的一个。</strong> 它同时反映客户满意度、扩量能力和定价合理性。NRR 持续低于 100% 意味着老客户在流失或缩量，此时再多的新客户也只是在填漏斗的洞。</p>", "plain": " 模块 04 · 定价体系与单位经济模型\n\n ⚠️ 内部机密文件。 对外分发版本必须删除本模块的成本与毛利数据。\n 本模块解决的问题：一笔单子到底赚多少、怎么报价不亏、什么时候该拒绝订单。\n 使用者：销售（报价前必读）、决策层、财务。\n\n\n\n 一、成本结构拆解\n\n一笔 token 收入背后的成本由五部分构成，销售在心里必须有这张成本表，否则\"感觉还有得赚\"的单子实际上是亏的。\n\n直接采购成本是上游的实际拿货价，占比最大。以行业公开的加成水位推算，若对客按官方价的 88 折销售、我们按官方价的 78 折拿货，则采购成本占收入的约 89%，毛利率约 11%。这就是纯转售业务的真实水位——十个点出头，没有想象空间。\n\n技术与带宽成本包括网关服务器、流量、日志存储（6 个月留存是硬要求，存储成本不小）、监控告警系统。按收入的 2%–4% 估算。\n\n服务成本是最容易被低估的一项。技术对接、故障响应、账单答疑、优化建议——这些人力投入在小客户身上摊薄后可能超过毛利本身。一个月消费 2000 元、每周找技术支持三次的客户，是纯亏损客户。\n\n资金成本是批发业务特有的。预付上游的资金被锁定，加上下游账期，中间的资金占用有实际的机会成本和融资成本。按占用资金的年化成本计算。\n\n风险成本包括坏账准备、SLA 赔付准备、上游降价导致的存货贬值准备。起步期建议按收入的 2%–3% 计提。\n\n把五项加总，纯转售业务的净利率在起步期大概率是负的或接近零。这不是失败，这是这门生意的常态——转售业务的作用是获客和获取数据，利润必须来自增值服务和规模化后的上游折扣提升。 这个认知如果不在全员脑子里，销售就会为了冲量签下一堆亏损订单。\n\n\n\n 二、毛利测算的标准公式\n\n 2.1 单笔订单毛利\n\n\n收入        = Σ(输入token × 对客输入单价 + 输出token × 对客输出单价\n              + 缓存token × 对客缓存单价)\n\n采购成本    = Σ(输入token × 采购输入单价 + 输出token × 采购输出单价\n              + 缓存token × 采购缓存单价)\n\n毛利        = 收入 − 采购成本\n毛利率      = 毛利 ÷ 收入\n\n\n必须按输入、输出、缓存三类分别计算，不能用总 token 数乘平均价。 因为输出价通常是输入价的 3–4 倍，而不同客户的输入输出比差异巨大：一个做长文档摘要的客户输入输出比可能是 50:1，一个做内容生成的客户可能是 1:5。用平均价估算，误差可以达到两三倍。\n\n 2.2 客户级贡献毛利\n\n\n贡献毛利 = 订单毛利 − 分摊技术成本 − 直接服务成本 − 风险计提\n\n\n服务成本按实际投入的人时估算。建议给每个客户打一个服务强度标签（低/中/高），低强度按收入 1% 计，中强度 5%，高强度 15%。这个标签由客户成功人员每月更新。\n\n 2.3 客户健康度判断线\n\n 贡献毛利率  判定  处置动作 \n\n  20%  优质  重点维护，争取扩量与增值服务 \n 10%–20%  健康  正常服务，寻找优化空间 \n 3%–10%  薄利  降低服务强度，引导自助化 \n 0%–3%  临界  提价或缩减服务，限期改善 \n < 0%  失血  三个月内改善或主动退出 \n\n\"主动退出客户\"必须成为一个被允许、甚至被鼓励的动作。 起步期公司最常见的错误是把所有客户都当宝贝，结果被少数几个高服务强度的低毛利客户耗死。\n\n\n\n 三、定价策略\n\n 3.1 定价的三层结构\n\n引流层对标官方价的 85%–90%，用于通用低价模型和新客户首单。这一层毛利极薄甚至为零，作用是获客和建立价格认知。明确告诉销售：这一层不考核毛利，只考核转化。\n\n主力层对标官方价的 90%–95%，用于主流中档模型。这是毛利的主要来源，也是绝大多数订单应该落在的区间。\n\n价值层不与官方价直接对标，而是打包定价——网关服务 + SLA 保障 + 管控功能 + 优化服务，按\"平台服务费 + token 用量费\"的组合收取。这一层的毛利率可以做到 30%–60%，是我们真正要往那里引导的方向。\n\n 3.2 量价阶梯设计原则\n\n阶梯折扣必须与我们从上游拿到的阶梯折扣结构对齐。如果上游是在月采购 50 万时给我们提升 3 个点，那我们对客的阶梯拐点应该设在能推动我们跨过 50 万的位置，而不是随手设一个整数。\n\n阶梯设计的三条纪律：折扣只随实际用量兑现，不预支（承诺量不等于实际量，预支折扣是常见的亏损来源）；阶梯以季度而非月度考核，避免客户用量波动导致折扣频繁变动；最高阶梯的折扣必须给公司留下不低于 8% 的毛利底线，触及底线的报价必须上报审批。\n\n 3.3 报价审批权限建议\n\n 毛利率区间  审批层级 \n\n ≥ 15%  销售自主决定 \n 10%–15%  销售主管审批 \n 8%–10%  业务负责人审批 \n < 8%  决策层审批，需说明战略理由 \n\n低于 8% 的订单不是不能签，而是必须有明确的战略理由——比如标杆客户、行业突破口、能带来渠道网络。理由要写进审批记录，季度复盘时验证是否兑现。\n\n\n\n 四、批发/囤货业务的专项风控\n\n这是四条业务线里唯一可能造成灾难性损失的一条，规则必须比其他业务严格得多。\n\n降价风险是首要风险。 上游模型价格在持续下行通道中，今天以 78 折囤的额度，如果三个月后官方直接降价 30%，这批额度的市场价值直接跌破成本。因此：所有大额预付必须在合同中争取降价保护条款（官方降价时按新价折算或补差），拿不到这一条的预付必须大幅压缩规模，并把额度的周转周期控制在 60 天以内。\n\n流动性风险是第二风险。 预付款是沉淀资金，下游账期是应收账款，两头挤压最容易断裂。建议设置三条硬线：预付资金不超过可用现金的规定上限（起步期建议 30%）；单个下游客户的应收账款不超过总应收的 25%；账期超过约定天数自动停止供货。\n\n囤货规模的计算方法：预付额度应基于过去 90 天的实际日均消耗推算，覆盖期不超过 60 天。公式为：\n\n\n建议预付额度 = 近90天日均消耗 × 60天 × (1 + 增长系数)\n增长系数在 0.2–0.5 之间，视增长确定性而定\n\n\n绝不基于\"预期签约量\"囤货。 预期会落空，额度不会自己变回现金。\n\n\n\n 五、单位经济模型示例（用于内部测算与投资人沟通）\n\n以下为结构示例，非真实业绩数据，实际数值需在业务启动后用真实数据替换。使用时必须标注\"模型假设\"字样。\n\n以一个典型的 AI 创业公司客户为例：月消费 5 万元，模型组合以中档为主，输入输出比约 3:1，服务强度中等。\n\n按主力层定价（官方价 92 折）、采购按官方价 80 折计算，则收入 5 万，采购成本约 4.35 万，订单毛利约 6500 元，毛利率 13%。扣除技术成本 1500 元（3%）、服务成本 2500 元（5%）、风险计提 1000 元（2%），贡献毛利约 1500 元，贡献毛利率 3%。\n\n这个数字看起来很难看，而这正是要点。 它说明三件事：第一，纯转售单靠价差养不活公司；第二，服务成本的控制比价差的争取更重要；第三，必须向增值服务要利润——如果这个客户同时购买了成本优化服务（比如按节省额的 20% 分成，帮他每月省 1 万则收 2000 元），贡献毛利立刻从 1500 元变成 3500 元，毛利率翻倍还多。\n\n给决策层的核心结论：这门生意的利润杠杆不在采购端，在服务端。 把 80% 的精力放在跟上游磨 2 个点的折扣上，不如把精力放在让 30% 的客户购买增值服务上。\n\n\n\n 六、财务监控指标\n\n以下指标建议按月跟踪，是判断业务健康度的仪表盘。\n\n规模类：月度 token 消耗量、月度收入、月度采购额、活跃客户数。\n\n效率类：综合毛利率、贡献毛利率、单客户平均收入（ARPU）、销售人均产出。\n\n质量类：客户留存率、净收入留存率（NRR，衡量老客户是否在扩量，健康值应大于 110%）、增值服务渗透率（购买增值服务的客户占比，目标 30%）。\n\n风险类：应收账款周转天数、预付款占比、单一上游采购集中度、单一客户收入集中度、坏账率。\n\nNRR 是所有指标中最重要的一个。 它同时反映客户满意度、扩量能力和定价合理性。NRR 持续低于 100% 意味着老客户在流失或缩量，此时再多的新客户也只是在填漏斗的洞。\n"}, {"id": "05-客户分层与场景库", "code": "05", "title": "模块 05 · 客户分层与场景库", "short": "客户分层与场景库", "subs": ["一、四类客户的完整画像", "二、客户结构的健康标准", "三、高价值场景库", "四、场景化的开场问题库"], "html": "<h1>模块 05 · 客户分层与场景库</h1>\n<blockquote>\n<p>本模块解决的问题：卖给谁、他们真正疼在哪、谁说了算、多久能成。\n使用者：销售、市场、客户成功。</p>\n</blockquote>\n<hr />\n<h2>一、四类客户的完整画像</h2>\n<h3>1.1 AI 应用创业公司</h3>\n<p><strong>识别特征</strong>：团队 5–50 人，产品已上线或在内测，融资阶段在天使到 A 轮之间，技术负责人往往就是创始人之一。月 AI 支出从几千到几十万不等，增长极快也可能瞬间归零。</p>\n<p><strong>真实痛点排序</strong>（按他们自己的优先级，不是按我们希望的优先级）：</p>\n<p>第一位是<strong>限流和稳定性</strong>。他们的产品直接跑在模型上，上游一限流就是线上事故、用户投诉、口碑受损。很多创始人是在被官方限流一次之后才开始找我们的。</p>\n<p>第二位是<strong>成本失控的恐惧</strong>。他们知道 Agent 类功能会烧钱，但不知道会烧多少，也没有工具去预判。一个功能上线前，没人能告诉 CEO \"这会让我们每月多花多少钱\"。</p>\n<p>第三位是<strong>多模型切换的工程负担</strong>。他们必须持续测试新模型（因为竞争对手在测），但每接一个新模型都是几天的工程量。</p>\n<p>第四位才是<strong>价格</strong>。他们对价格敏感，但没有敏感到愿意为省 5% 而承担稳定性风险。</p>\n<p><strong>决策链</strong>：极短。CTO 或技术负责人一个人就能拍板，创始人参与大额决策。<strong>这意味着销售周期可以非常短——最快 1–2 周——但也意味着决策可以被同样快速地推翻。</strong></p>\n<p><strong>销售打法</strong>：直接给测试额度，让他跑起来。这类客户不听 PPT，只看跑通的结果和账单。第一次交流的目标应该是\"拿到测试账号的使用\"，而不是\"讲完我们的价值主张\"。</p>\n<p><strong>风险</strong>：客户死亡率高。要控制单客户的授信额度，不给或少给账期。</p>\n<hr />\n<h3>1.2 中大型企业客户</h3>\n<p><strong>识别特征</strong>：员工数百人以上，有独立的 IT 或数字化部门，AI 属于新立项目或数字化转型的一部分。预算走年度流程，采购有正式流程。</p>\n<p><strong>真实痛点排序</strong>：</p>\n<p>第一位是<strong>合规与可审计</strong>。谁批的、花了多少、用在哪、数据去哪了、出事谁负责——这些问题必须有答案，而且要能应付内审和外审。2026 年起对第三方模型调用的公示与留存要求（详见模块 08）让这件事变得更硬。</p>\n<p>第二位是<strong>内部成本归属</strong>。AI 支出必须能拆到部门、拆到项目，否则财务无法核算，明年的预算就批不下来。这是我们的子账号和部门归集功能的直接卖点。</p>\n<p>第三位是<strong>供应商资质与稳定性</strong>。他们需要合同、发票、SLA、故障责任条款，需要供应商能通过他们的供应商准入审查。</p>\n<p>第四位是<strong>能力覆盖</strong>。需要多模型、多模态，可能还需要私有化部署或数据不出域。</p>\n<p>价格在他们这里通常排第五位甚至更后。<strong>销售在这类客户面前主动降价是严重的错误动作</strong>——它会让对方怀疑我们的专业性和交付能力。</p>\n<p><strong>决策链</strong>：长且复杂。典型路径是业务部门提需求 → IT 部门做技术评估 → 采购部门比价与合规审查 → 法务审合同 → 财务定付款条件 → 分管领导签批。<strong>销售必须识别出四个角色</strong>：使用者（业务部门）、技术把关人（IT）、经济决策者（分管领导）、流程守门人（采购与法务）。漏掉任何一个都会在最后一刻卡住。</p>\n<p><strong>销售周期</strong>：4–12 周为常态，复杂项目可能半年。</p>\n<p><strong>销售打法</strong>：从一个具体部门的具体场景切入做 POC，用小项目建立信任，再横向扩展到其他部门。<strong>不要一上来就谈全公司级的框架协议</strong>，那会触发最复杂的审批流程，且成功率极低。</p>\n<hr />\n<h3>1.3 中小企业与开发者</h3>\n<p><strong>识别特征</strong>：几人到几十人的公司，或个人开发者。用量小（月消费几百到几千元），需求零散，几乎不需要定制。</p>\n<p><strong>真实痛点排序</strong>：第一是<strong>注册与充值门槛</strong>（很多官方渠道有企业认证要求或最低充值门槛）；第二是<strong>不知道该用哪个模型</strong>（选择困难，缺乏判断依据）；第三是<strong>开票麻烦</strong>；第四是价格。</p>\n<p><strong>决策链</strong>：一个人。<strong>销售周期以小时计。</strong></p>\n<p><strong>销售打法</strong>：<strong>完全不要用人力销售。</strong> 这类客户的获客必须靠内容、SEO、开发者社区、口碑扩散和极致顺畅的自助注册流程。一个销售花两小时谈下一个月消费 800 元的客户，这笔账永远算不回来。</p>\n<p><strong>战略价值</strong>：这类客户是<strong>口碑的扩散源和产品的压力测试场</strong>。开发者会在社区讨论、写文章、推荐给同行。同时他们会最快发现产品的所有毛病。要用极低成本服务他们，但不能忽视他们。</p>\n<hr />\n<h3>1.4 下游代理商与渠道伙伴</h3>\n<p><strong>识别特征</strong>：本地 IT 服务商、软件开发商、系统集成商、行业 SaaS 公司、以及各类\"想做 AI 生意但没有技术能力\"的创业者。他们有客户关系但没有产品，我们有产品但没有他们的客户关系。</p>\n<p><strong>真实痛点排序</strong>：第一是<strong>能不能低门槛开始</strong>（不想投入研发、不想压资金）；第二是<strong>分润够不够、结算稳不稳</strong>；第三是<strong>能不能用自己的品牌</strong>（不想让终端客户知道上游是谁）；第四是<strong>技术和售后谁兜底</strong>。</p>\n<p><strong>决策链</strong>：老板一个人，但会反复衡量投入产出。</p>\n<p><strong>销售打法</strong>：讲清楚三件事——他要投入什么（尽量少）、他能赚多少（要算给他看）、我们兜底什么（技术、交付、售后）。<strong>给渠道伙伴的第一份材料应该是一张收益测算表，不是一份产品介绍。</strong></p>\n<p><strong>风险</strong>：渠道失控是这条线的主要风险——低价窜货、虚假宣传、服务质量拖累品牌、以及最危险的<strong>代理商用我们的通道服务了违规客户</strong>。管理办法见模块 07 和模块 08。</p>\n<hr />\n<h2>二、客户结构的健康标准</h2>\n<p>前文提到过，四类客户任何一类的收入占比不应超过 40%。补充两条：</p>\n<p><strong>单一客户收入占比不应超过 15%。</strong> 超过这个数，这个客户就有了定价权，且他的流失会直接冲击公司生存。</p>\n<p><strong>账期客户的应收总额不应超过月收入的 1.5 倍。</strong> 超过意味着我们在给客户垫资，现金流风险陡增。</p>\n<hr />\n<h2>三、高价值场景库</h2>\n<p>场景是销售的弹药。以下场景按\"token 消耗量大 + 客户付费意愿强 + 我们能提供额外价值\"三个标准筛选，是销售应该主动去找的场景。</p>\n<p><strong>智能客服与工单处理</strong>：消耗稳定、可预测、量大。客户的核心诉求是降低人工成本，ROI 容易算清楚。我们的价值点在于成本可预测和多模型降级（高峰用便宜模型兜底）。</p>\n<p><strong>代码生成与研发助手</strong>：这是当下 token 消耗最猛的场景，也是最容易失控的场景（Uber 案例）。客户的核心诉求是提升研发效率，但最怕预算失控。<strong>我们的预算管控和部门归集功能在这个场景是刚需，不是加分项。</strong></p>\n<p><strong>文档处理与知识库问答</strong>：长上下文输入为主，输入输出比可达 50:1，缓存优化空间极大。<strong>这是最容易做出\"帮你省了 40%\"效果的场景</strong>，适合作为首单和信任建立的切入点。</p>\n<p><strong>内容生成与营销素材</strong>：输出为主，单价高。客户对质量敏感，对模型选型有真实需求，适合销售我们的模型选型咨询能力。</p>\n<p><strong>多 Agent 工作流与自动化</strong>：消耗量最大、增长最快、最不可预测。米哈游 13 小时 200 万的案例就出自这里。<strong>这个场景的客户几乎必然需要我们的熔断和告警能力</strong>，否则一次失控的循环调用就是重大事故。</p>\n<p><strong>数据分析与报表生成</strong>：批量任务为主，对延迟不敏感，是批量调用折扣和低价模型的最佳应用场景，我们能通过路由策略显著降低其成本。</p>\n<hr />\n<h2>四、场景化的开场问题库</h2>\n<p>好的销售不是讲产品，是问出客户自己都没意识到的问题。以下问题按场景整理，每个问题的设计目的都是<strong>让客户发现一个他答不上来的空白</strong>。</p>\n<p>面对任何客户，通用的三个开场问题是：\"你们现在同时在用几个模型？\"\"上个月的 AI 支出，能拆到具体哪个功能吗？\"\"如果主力模型明天限流两小时，你们的应急方案是什么？\"</p>\n<p>面对研发场景，问：\"给工程师开放 AI 编程工具之后，你们怎么控制预算？有没有人能在功能上线前告诉你它一个月会烧多少钱？\"</p>\n<p>面对企业 IT，问：\"财务问你 AI 这笔钱花在哪个部门了，你现在多久能给出答案？\"\"如果内审要查过去六个月的调用记录，你们留了吗？\"</p>\n<p>面对创业公司 CTO，问：\"你们的系统提示词有多长？每次调用都重传吗？\"（这个问题几乎总能引出缓存优化的机会）</p>\n<p>面对渠道伙伴，问：\"你现在的客户里，有多少人问过你 AI 相关的需求，但你只能告诉他们做不了？\"</p>\n<p><strong>这些问题的共同点是：不推销任何东西，只暴露空白。</strong> 空白一旦被客户自己看见，销售就从\"推\"变成了\"拉\"。</p>", "plain": " 模块 05 · 客户分层与场景库\n\n 本模块解决的问题：卖给谁、他们真正疼在哪、谁说了算、多久能成。\n 使用者：销售、市场、客户成功。\n\n\n\n 一、四类客户的完整画像\n\n 1.1 AI 应用创业公司\n\n识别特征：团队 5–50 人，产品已上线或在内测，融资阶段在天使到 A 轮之间，技术负责人往往就是创始人之一。月 AI 支出从几千到几十万不等，增长极快也可能瞬间归零。\n\n真实痛点排序（按他们自己的优先级，不是按我们希望的优先级）：\n\n第一位是限流和稳定性。他们的产品直接跑在模型上，上游一限流就是线上事故、用户投诉、口碑受损。很多创始人是在被官方限流一次之后才开始找我们的。\n\n第二位是成本失控的恐惧。他们知道 Agent 类功能会烧钱，但不知道会烧多少，也没有工具去预判。一个功能上线前，没人能告诉 CEO \"这会让我们每月多花多少钱\"。\n\n第三位是多模型切换的工程负担。他们必须持续测试新模型（因为竞争对手在测），但每接一个新模型都是几天的工程量。\n\n第四位才是价格。他们对价格敏感，但没有敏感到愿意为省 5% 而承担稳定性风险。\n\n决策链：极短。CTO 或技术负责人一个人就能拍板，创始人参与大额决策。这意味着销售周期可以非常短——最快 1–2 周——但也意味着决策可以被同样快速地推翻。\n\n销售打法：直接给测试额度，让他跑起来。这类客户不听 PPT，只看跑通的结果和账单。第一次交流的目标应该是\"拿到测试账号的使用\"，而不是\"讲完我们的价值主张\"。\n\n风险：客户死亡率高。要控制单客户的授信额度，不给或少给账期。\n\n\n\n 1.2 中大型企业客户\n\n识别特征：员工数百人以上，有独立的 IT 或数字化部门，AI 属于新立项目或数字化转型的一部分。预算走年度流程，采购有正式流程。\n\n真实痛点排序：\n\n第一位是合规与可审计。谁批的、花了多少、用在哪、数据去哪了、出事谁负责——这些问题必须有答案，而且要能应付内审和外审。2026 年起对第三方模型调用的公示与留存要求（详见模块 08）让这件事变得更硬。\n\n第二位是内部成本归属。AI 支出必须能拆到部门、拆到项目，否则财务无法核算，明年的预算就批不下来。这是我们的子账号和部门归集功能的直接卖点。\n\n第三位是供应商资质与稳定性。他们需要合同、发票、SLA、故障责任条款，需要供应商能通过他们的供应商准入审查。\n\n第四位是能力覆盖。需要多模型、多模态，可能还需要私有化部署或数据不出域。\n\n价格在他们这里通常排第五位甚至更后。销售在这类客户面前主动降价是严重的错误动作——它会让对方怀疑我们的专业性和交付能力。\n\n决策链：长且复杂。典型路径是业务部门提需求 → IT 部门做技术评估 → 采购部门比价与合规审查 → 法务审合同 → 财务定付款条件 → 分管领导签批。销售必须识别出四个角色：使用者（业务部门）、技术把关人（IT）、经济决策者（分管领导）、流程守门人（采购与法务）。漏掉任何一个都会在最后一刻卡住。\n\n销售周期：4–12 周为常态，复杂项目可能半年。\n\n销售打法：从一个具体部门的具体场景切入做 POC，用小项目建立信任，再横向扩展到其他部门。不要一上来就谈全公司级的框架协议，那会触发最复杂的审批流程，且成功率极低。\n\n\n\n 1.3 中小企业与开发者\n\n识别特征：几人到几十人的公司，或个人开发者。用量小（月消费几百到几千元），需求零散，几乎不需要定制。\n\n真实痛点排序：第一是注册与充值门槛（很多官方渠道有企业认证要求或最低充值门槛）；第二是不知道该用哪个模型（选择困难，缺乏判断依据）；第三是开票麻烦；第四是价格。\n\n决策链：一个人。销售周期以小时计。\n\n销售打法：完全不要用人力销售。 这类客户的获客必须靠内容、SEO、开发者社区、口碑扩散和极致顺畅的自助注册流程。一个销售花两小时谈下一个月消费 800 元的客户，这笔账永远算不回来。\n\n战略价值：这类客户是口碑的扩散源和产品的压力测试场。开发者会在社区讨论、写文章、推荐给同行。同时他们会最快发现产品的所有毛病。要用极低成本服务他们，但不能忽视他们。\n\n\n\n 1.4 下游代理商与渠道伙伴\n\n识别特征：本地 IT 服务商、软件开发商、系统集成商、行业 SaaS 公司、以及各类\"想做 AI 生意但没有技术能力\"的创业者。他们有客户关系但没有产品，我们有产品但没有他们的客户关系。\n\n真实痛点排序：第一是能不能低门槛开始（不想投入研发、不想压资金）；第二是分润够不够、结算稳不稳；第三是能不能用自己的品牌（不想让终端客户知道上游是谁）；第四是技术和售后谁兜底。\n\n决策链：老板一个人，但会反复衡量投入产出。\n\n销售打法：讲清楚三件事——他要投入什么（尽量少）、他能赚多少（要算给他看）、我们兜底什么（技术、交付、售后）。给渠道伙伴的第一份材料应该是一张收益测算表，不是一份产品介绍。\n\n风险：渠道失控是这条线的主要风险——低价窜货、虚假宣传、服务质量拖累品牌、以及最危险的代理商用我们的通道服务了违规客户。管理办法见模块 07 和模块 08。\n\n\n\n 二、客户结构的健康标准\n\n前文提到过，四类客户任何一类的收入占比不应超过 40%。补充两条：\n\n单一客户收入占比不应超过 15%。 超过这个数，这个客户就有了定价权，且他的流失会直接冲击公司生存。\n\n账期客户的应收总额不应超过月收入的 1.5 倍。 超过意味着我们在给客户垫资，现金流风险陡增。\n\n\n\n 三、高价值场景库\n\n场景是销售的弹药。以下场景按\"token 消耗量大 + 客户付费意愿强 + 我们能提供额外价值\"三个标准筛选，是销售应该主动去找的场景。\n\n智能客服与工单处理：消耗稳定、可预测、量大。客户的核心诉求是降低人工成本，ROI 容易算清楚。我们的价值点在于成本可预测和多模型降级（高峰用便宜模型兜底）。\n\n代码生成与研发助手：这是当下 token 消耗最猛的场景，也是最容易失控的场景（Uber 案例）。客户的核心诉求是提升研发效率，但最怕预算失控。我们的预算管控和部门归集功能在这个场景是刚需，不是加分项。\n\n文档处理与知识库问答：长上下文输入为主，输入输出比可达 50:1，缓存优化空间极大。这是最容易做出\"帮你省了 40%\"效果的场景，适合作为首单和信任建立的切入点。\n\n内容生成与营销素材：输出为主，单价高。客户对质量敏感，对模型选型有真实需求，适合销售我们的模型选型咨询能力。\n\n多 Agent 工作流与自动化：消耗量最大、增长最快、最不可预测。米哈游 13 小时 200 万的案例就出自这里。这个场景的客户几乎必然需要我们的熔断和告警能力，否则一次失控的循环调用就是重大事故。\n\n数据分析与报表生成：批量任务为主，对延迟不敏感，是批量调用折扣和低价模型的最佳应用场景，我们能通过路由策略显著降低其成本。\n\n\n\n 四、场景化的开场问题库\n\n好的销售不是讲产品，是问出客户自己都没意识到的问题。以下问题按场景整理，每个问题的设计目的都是让客户发现一个他答不上来的空白。\n\n面对任何客户，通用的三个开场问题是：\"你们现在同时在用几个模型？\"\"上个月的 AI 支出，能拆到具体哪个功能吗？\"\"如果主力模型明天限流两小时，你们的应急方案是什么？\"\n\n面对研发场景，问：\"给工程师开放 AI 编程工具之后，你们怎么控制预算？有没有人能在功能上线前告诉你它一个月会烧多少钱？\"\n\n面对企业 IT，问：\"财务问你 AI 这笔钱花在哪个部门了，你现在多久能给出答案？\"\"如果内审要查过去六个月的调用记录，你们留了吗？\"\n\n面对创业公司 CTO，问：\"你们的系统提示词有多长？每次调用都重传吗？\"（这个问题几乎总能引出缓存优化的机会）\n\n面对渠道伙伴，问：\"你现在的客户里，有多少人问过你 AI 相关的需求，但你只能告诉他们做不了？\"\n\n这些问题的共同点是：不推销任何东西，只暴露空白。 空白一旦被客户自己看见，销售就从\"推\"变成了\"拉\"。\n"}, {"id": "06-销售方法论与话术库", "code": "06", "title": "模块 06 · 销售方法论与话术库", "short": "销售方法论与话术库", "subs": ["一、销售的基本立场", "二、三段式销售流程", "三、核心异议处理", "四、销售的五条纪律", "五、跟进节奏建议"], "html": "<h1>模块 06 · 销售方法论与话术库</h1>\n<blockquote>\n<p>本模块解决的问题：怎么谈、怎么破异议、怎么不把自己谈死。\n使用者：销售全员，新人入职必修。</p>\n</blockquote>\n<hr />\n<h2>一、销售的基本立场</h2>\n<p>在讲任何话术之前，先确立一个立场问题：<strong>我们不是在卖 token，我们是在帮客户管理一笔正在快速膨胀且失控的支出。</strong></p>\n<p>这个立场的差别是根本性的。卖 token 的销售会陷入价格比较，因为 token 是标准品，标准品只能比价。管理支出的顾问会引导客户看总成本，而总成本包含了工程时间、故障损失、合规风险和优化空间——<strong>在这个维度上我们几乎总是赢的</strong>。</p>\n<p>所以整套销售方法论只有一条主线：<strong>尽快把对话从\"你比官方便宜多少\"转移到\"你们现在的 AI 支出是怎么管的\"。</strong> 谁掌控了话题的坐标系，谁就掌控了谈判。</p>\n<hr />\n<h2>二、三段式销售流程</h2>\n<h3>第一段：暴露空白（首次接触，20–30 分钟）</h3>\n<p>目标不是介绍产品，是<strong>让客户发现一个他答不上来的问题</strong>。</p>\n<p>按模块 05 的问题库提问，重点关注三类空白：<strong>成本可见性空白</strong>（说不清钱花在哪）、<strong>稳定性空白</strong>（没有故障预案）、<strong>合规空白</strong>（没做留存和公示）。</p>\n<p>这一段的成功标准是客户说出类似\"这个我们确实没想过\"或者\"这个得回去查一下\"的话。<strong>如果全程是我们在讲、客户在听，这次接触基本失败了</strong>，哪怕客户很客气地说\"挺好的，有需要联系你\"。</p>\n<p>一条纪律：<strong>第一次接触不主动报价。</strong> 报价会立刻把对话拽回比价框架。如果客户主动问价，标准回应是：\"价格我们肯定有竞争力，但更值钱的可能是另一件事——你们现在能看到缓存命中省了多少钱吗？大部分客户在这一块能立刻省下两三成。\"</p>\n<h3>第二段：证明价值（POC 阶段，1–4 周）</h3>\n<p>目标是<strong>用客户自己的数据，做出一个具体的数字</strong>。</p>\n<p>标准动作是：给测试额度 → 客户跑真实流量 → 我们出一份分析报告，内容包括当前成本构成、可优化项、优化后的预估成本、以及节省金额。</p>\n<p><strong>这份报告是整个销售流程中最重要的交付物。</strong> 它把抽象的\"我们能帮你省钱\"变成\"根据你们上周的 340 万次调用，把系统提示词做缓存后每月可省 1.8 万元\"。</p>\n<p>一条纪律：<strong>报告里的优化建议必须是真的、可验证的，哪怕它导致我们的收入下降。</strong> 帮客户省下的钱越多，客户留得越久，扩量越快。为了短期收入隐瞒优化空间，是这门生意里最短视的行为。</p>\n<h3>第三段：降低风险（成交阶段）</h3>\n<p>到了这一步，客户认可价值，卡住的通常不是
