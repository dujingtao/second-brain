上的根本区别，不是能力差距。\n2. 连语义缓存都还是少数派，而且都是租户内的。 Cloudflare 这种体量的厂商至今只做精确匹配，并把语义缓存列为\"未来计划\"——这说明误命中风险在大规模生产中是被认真对待的工程难题，不是配个向量库就能上。\n3. 行业主流形态是 LangSmith 式的：日志 → 数据集 → 动态 fewshot / 评测集。 权重不变、数据可删除、可按租户隔离。这是我们最应该抄的形态。\n\n\n\n 七、可执行的分级方案\n\n把\"用客户数据\"拆成四个等级，逐级放行，不得跳级。\n\n 级别  做什么  是否需要客户数据内容  法律身份  需要的授权  结论 \n\n L0  上游 prompt caching 对齐、网关链路优化、精确缓存（含租户 ID）  完全不需要。只操作请求结构与哈希  受托处理者  标准委托合同即可  ✅ 立即做，优先级最高 \n L1  模型路由（用长度、任务类型等元数据，不读内容）、用量与成本可观测性  元数据级  受托处理者  标准委托合同  ✅ 做 \n L2  单租户内的 RAG、示例库、提示优化、评测集；数据严格不出客户边界  需要，但不跨租户、不进权重、单条可删  受托处理者（前提是隔离到位）  委托合同写全六要素 + PIA + 可验证删除机制  ✅ 做，但架构必须先过隔离评审 \n L2.5  单租户语义缓存  需要  受托处理者  同 L2  ⚠️ 慎入。误命中损害准确率 2.7–7.5%；须有跨租户命中告警 \n L3  用单个客户的数据微调仅供该客户使用的模型  需要，进权重  翻转为独立处理者  终端用户单独同意 + 授权记录 + 大模型备案 + 语料安全评估  ⛔ 暂不做。经济性不成立（第五节），合规链条有结构性断点（第 3 节卡点 5） \n L4  跨客户数据混用（共享库或混合微调）  需要  独立处理者 + 二次提供  告知义务在结构上无法履行  🚫 红线，永不做 \n\n 7.1 执行顺序\n\n第 0 步（做任何优化之前）：测量端到端 TTFT 的构成，拆出「网关自身开销 / 网络 RTT / 上游 prefill 与排队」三段占比。没有这个数字，L0 的收益都是猜的。\n\n第一阶段（L0，零数据风险）：上游缓存对齐是全表里唯一\"不依赖任何模型质量假设\"的确定性收益——读价 0.1 倍是合同写死的。这是纯工程活：把稳定的 system prompt 和工具定义放前面、保证前缀字节级一致、不要在 prompt 开头插时间戳。\n\n第二阶段（L1）：模型路由。对外宣传用 35%–45%，不要用 85%。\n\n第三阶段（L2）：这是\"用对话数据\"的正确形态——数据 → 数据集 → 检索/示例/评测，模型权重不动，单条记录可删，可按租户审计。\n\nL3 的重新评估触发条件（三条须同时满足，缺一不可）：\n1. 有客户明确提出需求，且愿意自行完成终端用户单独同意与授权记录的取得；\n2. 该客户的流量能把一个 4B 级实例压到 70% 以上利用率（或提供足以覆盖固定成本的付费承诺）；\n3. 在其数据上跑过对照实验，微调相对\"RAG + 提示优化\"有可复现的显著增益。\n\n 三条里最容易被忽略的是第 3 条。 不要因为客户愿意付钱就跳过验证——如果微调打不过 RAG，我们收了钱交付了一个更差的东西，长期是负资产。\n\n 7.2 三条红线\n\n1. 不做跨客户数据混用——任何形式，包括\"匿名化后\"的共享示例库。\n2. 不把\"我们做了脱敏\"作为免除同意义务的法律主张——它是安全措施，不是合规出口。\n3. 不在没有租户隔离评审通过前上线任何共享缓存组件——参见 OpenAI redispy 事故。\n\n\n\n 八、对外怎么说\n\n客户问\"你们会不会用我的数据\"时，这是一次销售机会，不是防守。因为：\n\n上游厂商在这件事上的条款普遍很差，而我们可以做得比上游更干净。（详见第九节的横向对比）\n\n推荐话术：\n\n \"我们对您数据的处理，只做三件事：转发、计费、可观测性。\n\n 我们不用您的数据训练任何模型——不是因为我们承诺不做，是因为我们的架构里根本没有这条通路。\n\n 我们能给您的优化，来自三个地方：把请求结构重排以命中上游的缓存折扣（这能让重复的长上下文部分只花十分之一的钱）、按任务难度路由到合适的模型（同等质量下成本可降三到四成）、以及在您自己的租户内为您沉淀评测集和示例库——那些数据始终是您的，随时可以导出，随时可以删除，我们有可验证的删除机制。\n\n 另外有一件上游厂商通常不会主动告诉您的事：国内主流大模型平台里，有几家的默认条款是允许用您的输入优化模型的，而且没有关闭开关。 我们可以按您的合规要求，帮您把流量只路由到条款干净的那几家。\"\n\n这段话的三个作用：把\"不用数据\"从道德承诺变成架构事实（不可证伪的承诺没有说服力，不可能的架构才有）；把话题从\"你会不会拿我的数据\"转向\"我帮你管住上游\"；顺势卖出选型咨询——这正是模块 02 §2.4 定位的解决方案线。\n\n\n\n 九、意外发现：上游转售条款（这件事比本题更严重）\n\n ⚠️ 这一节不是本模块的原定范围，是核查上游数据条款时撞上的。它对公司的威胁远大于数据使用问题本身，必须单独立项处理。\n\n 9.1 三家上游明确禁止转售\n\n 厂商  条款  原文要点 \n\n 阿里云百炼  第 4.6 条  \"未经我们及相关权利人书面许可，您不得转售本服务及平台内模型\" \n 腾讯混元  第 2.6(6) 条  \"未经腾讯云事先书面同意，不得通过出租、出借、出售、分销、转售或转让等其他方式向第三方提供本服务或本服务的 API Token\" \n 智谱  用户协议七条 3 款；GLM Coding Plan 团队套餐协议六条 2 款  \"不得将 GLM Coding Plan 以转售、代售、转包装、聚合转发等方式向任何第三方提供\"；\"不得以共享账号、出租、出借……使他人实际使用\" \n\n智谱的\"聚合转发\"四个字，是目前检索到的唯一直接以我们这种业态为规制对象的措辞。腾讯的\"本服务的 API Token\"同样没有解释空间。\n\n这意味着：如果我们只是拿标准商用账号去转卖阿里/腾讯/智谱的额度，在协议层面已经构成违约。厂商可依约随时终止，且参照同类条款的通行做法，可能不退未消耗余额。\n\n 9.2 但三家都留了同一个出口\n\n\"未经……书面许可/同意\"——这不是禁止业态，是要求逐案授权。\n\n可行路径只有一条：走各家的官方渠道/经销/ISV 合作，签订书面转售授权。 这与模块 02 第一条业务线\"代理身份换信任\"的方向一致——但它把\"拿到官方代理资质\"从\"锦上添花\"变成了\"业务合法性的前提\"。这是定性的变化。\n\n 9.3 结构性困境\n\n协议允许我们转售的厂商，数据条款差到我们没法对下游承诺；数据条款好的厂商，恰恰明确禁止我们转售。\n\n 厂商  默认是否用于训练  有无关闭开关  转售限制  对我们的可用性 \n\n 腾讯混元  否（4.2 条明确承诺）  无需  明确禁止（点名 API Token）  数据条款最优，但必须拿书面授权 \n 阿里云百炼  标准 API 否（6.2.5）；Token Plan 个人版 / Coding Plan 是（5.2.2）  无，只能停用，且已用数据不可撤回  明确禁止（4.6）  需区分产品线；须拿书面授权 \n 智谱  是（用户协议四条 10 款，\"匿名数据机器学习/模型算法训练\"）  无  最严（点名聚合转发）  通用 API 数据条款差；团队版承诺不训练但禁止代持 \n Kimi  是（六条 3 款，直接授予免费使用权用于\"模型服务优化\"）  无  最宽松：三条 1 款\"仅供您内部使用或向最终用户提供服务\"  唯一正面许可服务终端用户，但数据条款最差 \n DeepSeek  平台协议沉默；隐私政策称\"可能会用\"  App 内有，API 侧未检索到  未见禁止  可转售，但无法向下游书面证明任何事；且把备案与内容审核义务全压给我们 \n 火山方舟  ⚠️ 二手：通用 API 否；Coding Plan 永久授权且不可撤回  未核实  未获取  ⚠️ 协议正文不可公开抓取，须登录核实 \n 百度千帆  未获取  未获取  未获取  ⚠️ 协议正文不可公开抓取，须登录核实 \n\n 9.4 与国际厂商的差距（会成为企业客户的谈判筹码）\n\n OpenAI：API 数据默认不用于训练（20230301 起），留存 最长 30 天，可申请 零数据留存（ZDR）；微调模型\"仅供你使用，绝不提供给其他客户或用于训练其他模型\"。\n Anthropic：留存数据未经明确许可绝不用于训练；ZDR 可按组织开通；分场景留存期明确到天。\n\n三处差距，企业客户的合规部门一定会问：\n\n1. 留存期限不可数化。国内除智谱团队版的 180 天欠费删除期外，全部是\"必需的最短期间\"这类不可验证的表述。\n2. 没有任何一家国内厂商提供 ZDR。这是结构性的——AIGC 暂行办法与网安法要求留存以备监管溯源，ZDR 与合规义务直接冲突。这个差距我们补不了，只能如实说明。\n3. 微调权重的排他承诺全线缺失。国内没有一家做出\"你的微调模型不会被跨客户复用\"的书面承诺。阿里 7.3 把权属推给产品文档、未约定则\"协商\"；智谱只规定用户自担责；腾讯与 Kimi 完全不提。\n\n 9.5 立即行动项\n\n1. [最高优先级] 盘点当前已接入或计划接入的每一家上游，确认我们的账号类型是否被协议允许用于转售。存量违约状态越早发现越好。\n2. 启动官方渠道/经销资质的商务谈判，把\"书面转售授权\"作为业务合法性的前提，而不是可选项。\n3. 签约前必须索取\"渠道协议里的数据处理附录\"——公开协议的数据承诺（如阿里 6.2.5）未必自动传递给转售场景下的最终用户。这份文件公开完全检索不到，只能通过商务谈判获取。\n4. 登录核实火山方舟与百度千帆的协议正文（两家的文档站为 SPA，公开不可抓取）。火山的\"永久授权、技术上无法撤回\"若属实，影响重大。\n5. 把\"上游数据条款\"做成销售物料——这是我们做选型咨询的天然抓手，见第八节话术。\n\n\n\n 十、与既有模块的关系、冲突与修正\n\n 10.1 与模块 02 §2.4 的一致性验证 ✅\n\n模块 02 §2.4 在 202607 重新定位为：\"这条线要从'替客户建'改成'让客户自己建的东西跑得更省、更稳、更看得清'——我们提供脚手架和度量，客户保留领域知识与业务逻辑。\"\n\n本模块的 L2 分级（单租户 RAG / 示例库 / 评测集）正是这个定位的技术实现。 而 L4（跨客户数据混用）直接违背它——把客户的领域知识收归我方，恰恰是 §2.4 明确放弃的方向。\n\n 两条独立的推理路径（一条从行业主张出发，一条从合规与技术出发）得出了同一个结论。这提高了 §2.4 定位的可信度。\n\n 10.2 与模块 25 的一致性验证 ✅\n\n模块 25 从硅基流动财务倒推出\"公有云 token 毛利率 −119%，不做自建供给\"。\n\n本模块 §5.2 从完全不同的路径（阿里云公开的实例价 vs API 价）得出了同构的结论：32B 独占实例打平点约 502 亿 token/月，而物理吞吐上限约 78 亿 token/月，差 6 倍。\n\n两条独立路径互相印证：在我们这个体量上，任何形式的\"持有推理资产\"都不成立。 模块 25 的四阶段路线图（先转售 → 租用 → 小规模采购 → 扩张）同样适用于 L3 微调托管——L3 的重估触发条件（7.1 节）本质上就是模块 25 阶段 1 的条件在数据场景下的翻译。\n\n 10.3 对模块 18「脱媒」威胁的补充\n\n模块 18 第五节把\"厂商向应用层上行导致的脱媒\"列为首要威胁。直觉上，持有客户数据能增加粘性、对抗脱媒。本模块否定了这个直觉的一半：\n\n ❌ 模型权重不是有效的粘性资产——经济性不成立（打平点高于物理吞吐），且客户可举证追责（成员推理 AUC 0.938）。\n ✅ 评测集、路由策略、成本基线、可观测性数据才是——它们随客户业务演进而增值，迁移时需要重建，且完全在委托处理关系内，没有法律敞口。\n\n 修正后的表述：对抗脱媒的资产不是\"我们拥有客户的数据\"，而是\"客户在我们这里积累了他自己都还没来得及沉淀的运营知识\"。前者是占有，后者是共建——后者的粘性更强，因为它不引发对抗。\n\n 10.4 对模块 08（合规与风险控制）的新增要求\n\n模块 08 现有内容覆盖备案号公示与 6 个月日志留存。本模块新增五项：\n\n1. 《网络数据安全管理条例》第 28 条的 1000 万人门槛——跨所有客户合并计算，聚合网关很容易触及，触及即适用重要数据处理者的组织架构与报告义务。\n2. 《个人信息保护合规审计管理办法》（20250501 施行）第 4 条——处理 1000 万人以上的，每两年至少一次合规审计。\n3. 委托处理的记录保存 ≥3 年（《网络数据安全管理条例》第 12 条）。\n4. PIA 是法定前置义务（PIPL 第 55 条），委托处理、向第三方提供、处理敏感个人信息、出境均触发。\n5. 纠正一处潜在误用：网安法的 6 个月日志留存指网络运行日志，不能用来给\"保留全量对话内容\"背书。\n\n 10.5 待修正项（本模块产生，需在其他模块执行）\n\n 目标模块  修正内容  状态 \n\n 00 · 模块地图  新增模块 26 行  ✅ 已执行 \n 00 · 修正留痕  记录 10.3 的脱媒资产表述修正、10.6 的转售条款发现  ✅ 已执行 \n 02 · 2.4  补充指针：L2 分级是该定位的技术实现路径  ✅ 已执行 \n 08 · 合规  并入 10.4 的五项  ⬜ 待执行（下一版） \n 18 · 五  修正脱媒对抗资产的表述  ⬜ 待执行（下一版） \n 02 · 业务线一/三  转售条款风险须并入，这是业务合法性前提的定性变化  ⬜ 待执行，最高优先级 \n\n 10.6 一条必须记入留痕的认知变化\n\n原有的隐含假设：我们作为中间层，只要与客户签好合同，转售上游 API 在法律上是干净的。\n\n被证伪：阿里 4.6、腾讯 2.6(6)、智谱七条 3 款+团队协议六条 2 款均明确禁止未经书面许可的转售，智谱直接点名\"聚合转发\"、腾讯直接点名\"API Token\"。\n\n修正为：官方渠道/经销书面授权不是\"锦上添花的信任背书\"，而是业务合法性的前提。 没有它，第一条和第三条业务线在协议层面处于违约状态。\n\n\n\n 十一、观察指标与复核触发条件\n\n 指标  当前值  复核触发  影响 \n\n 上游缓存读价折扣  0.1×（Anthropic/DeepSeek/阿里）/ 0.5×（OpenAI）  折扣收窄至 0.5× 以上  L0 的核心收益来源，收窄则需重估优先级 \n 4B 级模型质量  未验证  出现能替代 32B 的 4B 级模型  L3 经济性可能翻转（打平点降一个量级） \n 独占实例月价  Qwen332B ¥52,236/月  降至 API 打平点以下  同上 \n 监管执法  未见\"训练同意\"类处罚案例  出现首例  L3 的风险定价需上调 \n 上游转售条款  三家明确禁止  任一家出台公开的渠道数据附录  §9 的行动项优先级 \n 国内厂商 ZDR  无一提供  出现首家  §8 话术与合规差距叙事需更新 \n 同行产品形态  无人做跨客户微调  出现首家且未被处罚  需重新评估 L4 判断（但商业秘密问题独立存在，不因此松动） \n\n\n\n 十二、核心来源\n\n法律法规与标准\n 《个人信息保护法》 https://www.cac.gov.cn/202108/20/c_1631050028355286.htm\n 《生成式人工智能服务管理暂行办法》 https://www.cac.gov.cn/202307/13/c_1690898327029107.htm\n 《网络数据安全管理条例》（20250101 施行） https://www.cac.gov.cn/202409/30/c_1729384452307680.htm\n 《个人信息保护合规审计管理办法》（20250501 施行） https://www.cac.gov.cn/202502/14/c_1741233507681519.htm\n GB/T 45654—2025《生成式人工智能服务安全基本要求》（20251101 实施） https://www.tc260.org.cn/portal/article/1/20250630122232\n 「清朗·整治 AI 应用乱象」专项行动（20260430） https://www.cac.gov.cn/202604/30/c_1779289298718765.htm\n\n上游厂商协议\n 阿里云百炼服务协议 https://terms.alicdn.com/legalagreement/terms/common_platform_service/20230728213935489/20230728213935489.html\n 腾讯混元大模型服务条款 https://cloud.tencent.com/document/product/301/97822\n 智谱用户协议 https://docs.bigmodel.cn/cn/terms/useragreement ｜ GLM Coding Plan 团队套餐协议 https://docs.bigmodel.cn/cn/terms/subscriptionagreementteam\n Kimi 开放平台服务协议 https://platform.kimi.com/docs/agreement/modeluse\n DeepSeek 开放平台服务协议 https://cdn.deepseek.com/policies/zhCN/deepseekopenplatformtermsofservice.html ｜ 隐私政策 https://cdn.deepseek.com/policies/zhCN/deepseekprivacypolicy.html\n OpenAI Enterprise Privacy https://openai.com/enterpriseprivacy/ ｜ Anthropic Data Retention https://platform.claude.com/docs/en/manageclaude/apianddataretention\n\n技术证据\n FineTuning or Retrieval?（EMNLP 2024） https://aclanthology.org/2024.emnlpmain.15.pdf\n LoRA Learns Less and Forgets Less（TMLR 2024） https://arxiv.org/abs/2405.09673\n Quantifying Memorization Across Neural Language Models（ICLR 2023） https://arxiv.org/pdf/2202.07646\n Scalable Extraction of Training Data from Production LMs https://arxiv.org/html/2311.17035v1\n SPVMIA（NeurIPS 2024） https://fi.ee.tsinghua.edu.cn/~gaochen/papers/SPVMIA.pdf\n RouteLLM（LMSYS） https://www.lmsys.org/blog/20240701routellm/\n vLLM 推测解码实测 https://vllm.ai/blog/20241017specdecode\n OpenAI 20230320 事故官方报告 https://openai.com/index/march20chatgptoutage/\n 阿里云百炼训练与部署计费 https://developer.aliyun.com/article/1734727 ｜ 模型价格 https://help.aliyun.com/zh/modelstudio/modelpricing\n\n同行产品\n Cloudflare AI Gateway 缓存 https://developers.cloudflare.com/aigateway/features/caching/\n Portkey 缓存 https://portkey.ai/docs/product/aigateway/cachesimpleandsemantic\n LangSmith 动态 fewshot https://docs.smith.langchain.com/evaluation/how_to_guides/index_datasets_for_dynamic_few_shot_example_selection\n OpenPipe https://docs.openpipe.ai/introduction\n\n\n\n 十三、明确的检索空白（禁止在此处外推）\n\n1. 未检索到中国境内以\"未经单独同意将用户数据用于模型训练\"为主要案由的公开处罚/约谈案例（2024–2026）。\n2. 未检索到任何法律法规明文规定\"训练数据变更须重新备案\"；仅有\"重大变更\"的概括表述。\n3. 未检索到网信办对\"调用境外大模型 API 是否构成数据出境\"的明文界定。业界主流理解是构成出境，属解读。\n4. 未检索到 embedding / 向量是否构成个人信息的官方口径。保守按个人信息处理。\n5. 未获取火山方舟与百度千帆的协议正文（文档站为 SPA，需登录）。§9.3 表中两家的信息为二手或空缺。\n6. 未检索到因模型训练导致跨企业客户数据吐出的公开确认案例。（三星事件性质不同，见 6.4。）\n7. 未检索到 RAG 在真实企业生产环境的准确率提升幅度（可信数字全部来自学术论文）。\n8. 未检索到模型路由器自身开销计入后的净延迟改善。\n9. 未检索到国内 GPU 租用的一手价目表。§5 全部以云厂商公开按 token 价为基准。\n"}, {"id": "27-量子计算现状与对本业务的影响", "code": "27", "title": "27 · 量子计算：现状、时间表，以及它对我们到底意味着什么", "short": "27 · 量子计算：现状、时间表，以及它对我们到底意味着什么", "subs": ["一、先给结论", "二、现状：到底做到哪一步了", "三、时间表：谁在说什么，以及为什么方差本身是信息", "四、\"出实验室\"了吗？——已商业化的形态与真实成色", "五、对 AI 产业的影响", "六、唯一真正会触达我们的量子变量：后量子密码（PQC）", "七、明确不要做的事", "八、为什么量子算力永远进不了我们的供给组合（架构性理由）", "九、中国的情况", "十、观察指标与复核触发条件", "十一、核心来源", "十二、明确的检索空白（禁止外推）"], "html": "<h1>27 · 量子计算：现状、时间表，以及它对我们到底意味着什么</h1>\n<blockquote>\n<p><strong>版本 v1.0</strong> ｜ 撰写日期：2026-07-28 ｜ 密级：内部\n触发问题：「现在的量子计算发展到什么程度了？未来会有什么样的发展？什么时间可以突破出实验室？会对目前的 AI 产业有什么影响？」\n关联模块：18（战略推演）· 22（国产算力卡）· 26（数据边界与合规）</p>\n</blockquote>\n<hr />\n<h2>一、先给结论</h2>\n<p><strong>量子计算对我们是一个合规问题，不是算力问题。用一周把后量子密码做掉，然后忘掉它十年。</strong></p>\n<p>四句话版本：</p>\n<ol>\n<li>\n<p><strong>现状</strong>：全球最好的机器是 100–200 个物理比特量级，逻辑比特最多几十个且码距极浅。<strong>没有任何一台机器能运行一个需要纠错的、有商业价值的算法。</strong> 整个全球量子计算产业 2025 年收入约 <strong>10 亿美元</strong>——大约是 Nvidia 一天多一点的收入。</p>\n</li>\n<li>\n<p><strong>时间表</strong>：厂商路线图指向 2029–2030（IBM Starling 200 逻辑比特 / 1 亿门、Quantinuum Apollo）。但这些是<strong>承诺不是成果</strong>，且历史上量子领域的时间表大幅推迟是常态。最严肃的专家调查给出\"10 年内出现密码学相关量子计算机\"的概率是 <strong>28%–49%</strong>——注意这个调查只有 26 位受访者，且<strong>零个中国专家</strong>，参与者大多来自量子产业本身。</p>\n</li>\n<li>\n<p><strong>对 AI 的影响</strong>：<strong>目前为零，且大概率长期为零。</strong> 量子机器学习在经典数据任务上<strong>一次都没赢过</strong>（5 个数据集里普通逻辑回归赢了 3 个；MNIST 上量子模型慢 1,200 倍）。更根本的是有一条已发表的结构性定理：<strong>可训练的量子模型往往经典可高效模拟</strong>——能训练的量子也能经典跑，经典跑不了的训练不动。这不是待解决的工程问题。</p>\n</li>\n<li>\n<p><strong>反方向才是真的</strong>：AI 正在实质性帮助量子（DeepMind 的 AlphaQubit 纠错解码），而每台走向容错的量子机都需要挂载 GPU/FPGA 集群做实时纠错解码。<strong>在可见的未来，量子计算增加而非减少 GPU 需求。它是 GPU 的客户，不是替代者。</strong></p>\n</li>\n</ol>\n<hr />\n<h2>二、现状：到底做到哪一步了</h2>\n<h3>2.1 硬件参数横向对比（截至 2026-07）</h3>\n<table>\n<thead>\n<tr>\n<th>玩家</th>\n<th>最大物理比特</th>\n<th>已实测逻辑比特</th>\n<th>双比特门保真度</th>\n<th>相干时间</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>IBM</strong></td>\n<td>Nighthawk 120（218 耦合器，可靠执行 ~5,000 双比特门）</td>\n<td>无公开多逻辑比特运算演示</td>\n<td>未检索到</td>\n<td>未检索到</td>\n</tr>\n<tr>\n<td><strong>Google</strong></td>\n<td>Willow 105</td>\n<td><strong>1</strong>（距离-7 表面码）</td>\n<td>~99.88%</td>\n<td>T1 ~68–100 μs</td>\n</tr>\n<tr>\n<td><strong>Quantinuum</strong></td>\n<td>Helios 98（全连通）</td>\n<td><strong>48</strong>（2:1 编码率）</td>\n<td><strong>99.921%</strong></td>\n<td>秒–分钟量级</td>\n</tr>\n<tr>\n<td><strong>IonQ</strong></td>\n<td>未检索到生产机公开比特数</td>\n<td>未检索到</td>\n<td>99.99%（<strong>仅实验室原型，未披露规模</strong>）</td>\n<td>同离子阱</td>\n</tr>\n<tr>\n<td><strong>QuEra / 中性原子</strong></td>\n<td>448 原子（Caltech 演示 6,100 原子阵列）</td>\n<td><strong>96</strong>（4.7:1）</td>\n<td>未检索到</td>\n<td>未检索到</td>\n</tr>\n<tr>\n<td><strong>Atom Computing + 微软</strong></td>\n<td>1,180</td>\n<td><strong>24</strong>（49:1）</td>\n<td>未检索到</td>\n<td>未检索到</td>\n</tr>\n<tr>\n<td><strong>PsiQuantum（光子）</strong></td>\n<td><strong>从未公开任何物理比特数</strong></td>\n<td>无</td>\n<td>无</td>\n<td>无</td>\n</tr>\n<tr>\n<td><strong>微软（拓扑）</strong></td>\n<td>声称 8 个拓扑比特</td>\n<td>无</td>\n<td>无</td>\n<td>无</td>\n</tr>\n<tr>\n<td><strong>祖冲之三号</strong></td>\n<td>105（182 耦合器）</td>\n<td>无</td>\n<td>99.62%</td>\n<td>T1 ~72 μs / T2 ~58 μs</td>\n</tr>\n<tr>\n<td><strong>九章四号（光子）</strong></td>\n<td>1,024 压缩态 / 8,176 模式</td>\n<td>不适用（非通用门模型）</td>\n<td>不适用</td>\n<td>不适用</td>\n</tr>\n<tr>\n<td><strong>本源悟空-180</strong></td>\n<td>180 计算比特 + 251 耦合比特</td>\n<td>无</td>\n<td><strong>99%</strong></td>\n<td>未检索到</td>\n</tr>\n</tbody>\n</table>\n<h3>2.2 三个必须点破的口径问题</h3>\n<p><strong>第一，IonQ 的 99.99% 不是整机保真度。</strong> 来源明确写了那是\"R&amp;D 实验室原型\"上的两比特测量，<strong>未披露比特数与陷阱规模</strong>。把它当成 IonQ 生产系统的水平是错的。</p>\n<p><strong>第二，逻辑比特数不能横向比，因为编码率天差地别。</strong> 目前实测比率：Quantinuum 2:1 → QuEra 4.7:1 → IBM qLDPC 24:1 → Atom+微软 49:1 → Google 表面码 105:1。</p>\n<p><strong>看起来 Google 最差，但恰恰相反</strong>——Google 是<strong>唯一一个真正做到\"码距增大 → 逻辑错误率指数下降\"（低于阈值纠错）</strong>的。Quantinuum 的 2:1 意味着几乎没有冗余，能纠的错误极其有限。<strong>比率越低不等于越先进，可能只是码距越浅。</strong></p>\n<p><strong>第三，真正有意义的锚点不是比特数，是\"跑一个有用算法要多少物理比特\"。</strong></p>\n<ul>\n<li>AWS 量子硬件负责人给的经验值：<strong>约 1,000 个物理比特换 1 个逻辑比特</strong></li>\n<li>IBM 2029 年目标 Starling：<strong>200 逻辑比特 / 1 亿门</strong></li>\n<li>破解 RSA-2048：Google 的 Gidney 2025 年把估算压到 <strong>&lt; 100 万含噪物理比特、&lt; 1 周</strong></li>\n</ul>\n<p><strong>从今天的\"48 个 2:1 编码的逻辑比特\"到\"200 个能跑 1 亿门的逻辑比特\"，中间隔着 3 年的路线图承诺和至少两个数量级的工程量。</strong></p>\n<h3>2.3 微软 Majorana 这条线要单独打标记 ⚠️</h3>\n<p>微软 2025-02 发布 Majorana 1，称\"世界首个拓扑核心 QPU\"、\"造出理论上才存在的新物质态\"。</p>\n<p><strong>但那篇 Nature 论文自己写道</strong>：结果\"本身并不能确定干涉测量到的低能态是否为拓扑态\"，且\"<strong>完全可能该器件只包含 Andreev 模式而不含任何 Majorana 模式</strong>\"。四位审稿人意见分裂，两位有保留。</p>\n<p><strong>而且有前科</strong>：2018 年微软作者的 Nature 论文声称\"Majorana 零模的决定性证据\"，后因数据与 Andreev 模式一致而<strong>撤稿</strong>。2026-06 的 Majorana 2 数据公开有限，质疑重起。<strong>至今无独立验证。</strong></p>\n<blockquote>\n<p><strong>纪律：涉及微软拓扑路线的任何数据，一律标记「未经独立验证」，不得引用为技术判断依据。</strong></p>\n</blockquote>\n<h3>2.4 2024 年之后确实有的实质进展</h3>\n<p>不能只讲怀疑，这些是真的：</p>\n<ol>\n<li><strong>Google Willow（2024-12）低于阈值纠错</strong>——这是量子纠错领域二十年来最重要的实验结果，第一次证明\"加更多物理比特真的能让逻辑错误率下降\"。</li>\n<li><strong>QuEra/Harvard/MIT 的逻辑层面魔态蒸馏</strong>（Nature 2025）——通往通用容错的必要组件，过去两年最实质的进展之一。</li>\n<li><strong>IBM 的 FPGA 实时解码器做到 &lt;480 ns</strong>（需求是 1 μs 周期），比 GPU 方案快一个数量级，<strong>比计划提前一年</strong>。</li>\n<li><strong>Google Quantum Echoes（2025-10, Nature）</strong>：声称比最快经典超算快 <strong>13,000 倍</strong>，且结果\"可验证\"（可在其他量子硬件上复现）。</li>\n</ol>\n<blockquote>\n<p>⚠️ <strong>但 Quantum Echoes 的 13,000 倍要放在正确的尺度上看</strong>：它不是 2019 年 Sycamore 那种\"经典要一万年\"的 10^15 量级。<strong>13,000 倍是一个经典算法改进就可能吃掉的余量</strong>。已有 2026 年论文在专门论证\"经典方法无法可行地模拟它\"——<strong>防守方论文的存在本身，说明这个宣称正在被攻击。</strong></p>\n</blockquote>\n<hr />\n<h2>三、时间表：谁在说什么，以及为什么方差本身是信息</h2>\n<h3>3.1 厂商官方路线图（全部是承诺，不是成果）</h3>\n<table>\n<thead>\n<tr>\n<th>厂商</th>\n<th>节点</th>\n<th>年份</th>\n<th>内容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>IBM</td>\n<td>Kookaburra / Cockatoo / <strong>Starling</strong> / Blue Jay</td>\n<td>2026 / 2027 / <strong>2029</strong></td>\n<td>Starling = 200 逻辑比特、1 亿门</td>\n</tr>\n<tr>\n<td>IBM</td>\n<td>\"量子优势\"</td>\n<td>2026 年底</td>\n<td>定义灵活，见 4.2</td>\n</tr>\n<tr>\n<td>Google</td>\n<td>里程碑 6</td>\n<td>~2029</td>\n<td>需约 <strong>100 万</strong>物理比特</td>\n</tr>\n<tr>\n<td>Quantinuum</td>\n<td>Helios → Sol → <strong>Apollo</strong></td>\n<td>2025 → 2027 → <strong>2029/2030</strong></td>\n<td>Apollo = 通用容错</td>\n</tr>\n<tr>\n<td>QuEra</td>\n<td>容错系统上 Amazon Braket</td>\n<td>2028</td>\n<td>—</td>\n</tr>\n<tr>\n<td>美国能源部</td>\n<td>Grand Challenge：首台容错量子计算机</td>\n<td><strong>2028</strong></td>\n<td>2025-11 宣布 6.25 亿美元续期</td>\n</tr>\n<tr>\n<td>PsiQuantum</td>\n<td>百万比特级（布里斯班）</td>\n<td>原定 2027 年底</td>\n<td><strong>已延迟约 12 个月</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>两条现实检查：</strong></p>\n<ul>\n<li><strong>PsiQuantum 的延迟很说明问题</strong>：澳洲联邦+昆士兰州承诺 9.4 亿澳元，<strong>但截至 2025-12 一分钱都还没提取，机场公共咨询程序都还没启动</strong>。这就是\"百万比特计划\"的实际进度。</li>\n<li><strong>美国能源部 2028 目标的人才约束</strong>：全球量子纠错专家只有 <strong>600–700 人</strong>，2030 年前需要 <strong>1.6 万人</strong>，而培养一个人要 <strong>10 年</strong>。耶鲁的 Steven Girvin 评价是\"非常乐观但值得追求\"，同时指出\"我们离真正的容错还很远\"。</li>\n</ul>\n<h3>3.2 公开表态的时间线——方差本身就是最重要的信息</h3>\n<table>\n<thead>\n<tr>\n<th>时间</th>\n<th>人物</th>\n<th>表态</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2025-01</td>\n<td><strong>黄仁勋</strong></td>\n<td>可用量子计算机\"15 年太早、30 年太晚、20 年可以接受\"。量子概念股暴跌</td>\n</tr>\n<tr>\n<td>2025-02-05</td>\n<td><strong>Hartmut Neven</strong>（Google 量子 AI 负责人）</td>\n<td>\"<strong>五年内</strong>会看到量子计算机独有能力解决的真实世界应用\"</td>\n</tr>\n<tr>\n<td>2025-03-20</td>\n<td><strong>黄仁勋</strong></td>\n<td>GTC 上公开承认 <strong>\"我说错了\"（I was wrong）</strong></td>\n</tr>\n<tr>\n<td>2025-03-21</td>\n<td>—</td>\n<td>他试图补救，结果量子股又跌了一轮</td>\n</tr>\n<tr>\n<td>2025-10-28</td>\n<td><strong>Nvidia</strong></td>\n<td>发布 <strong>NVQLink</strong>，17 家量子厂商 + 9 个国家实验室参与。立场从\"20 年\"实质转向\"现在就卖铲子\"</td>\n</tr>\n<tr>\n<td>2026-04-30</td>\n<td><strong>Arvind Krishna</strong>（IBM CEO）</td>\n<td>\"我们强烈相信我们的<strong>合作伙伴</strong>今年会实现量子优势的首批案例\"</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>读法</strong>：同一年里，最懂硬件的人（黄仁勋）说 20 年然后被迫改口；最有动机乐观的人（Neven）说 5 年；最会措辞的人（Krishna）把主语换成了\"合作伙伴\"。</p>\n<p><strong>这个区间跨度说明的不是\"某个人错了\"，而是没有人真的知道。</strong> 任何引用单一权威时间表的论证都是不可靠的。</p>\n</blockquote>\n<h3>3.3 唯一给出概率分布的严肃调查</h3>\n<p>Global Risk Institute《Quantum Threat Timeline Report 2025》：</p>\n<table>\n<thead>\n<tr>\n<th>时间窗</th>\n<th>出现密码学相关量子计算机（CRQC）的概率</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>10 年内</strong></td>\n<td><strong>28%–49%</strong>（视统计口径；2024 年为 14%–34%，<strong>七年来最高、单年最大跳升</strong>）</td>\n</tr>\n<tr>\n<td>15 年内</td>\n<td>26 人中 18 人认为 ≥50%</td>\n</tr>\n<tr>\n<td>20 年内</td>\n<td>26 人中 24 人（92%）认为 ≥50%</td>\n</tr>\n<tr>\n<td>30 年内</td>\n<td>接近共识</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>⚠️ <strong>必须打的折扣</strong>：受访者只有 <strong>26 人</strong>（2024 年 32 人、2023 年 37 人，<strong>样本在缩水</strong>），地域分布为北美 9、欧洲 12、亚洲 3、大洋洲 2、<strong>中国 0</strong>，且大多来自量子产业本身（利益相关）。</p>\n<p><strong>这个分布应当理解为\"业内乐观派的自我估计\"，不是中立预测。</strong></p>\n</blockquote>\n<p><strong>对照预测市场</strong>（Manifold, 2025-12）：对\"2026 年内实现无争议的量子优势\"呈现<strong>压倒性怀疑</strong>；对\"2030 年前破解 RSA-2048\"判为<strong>不太可能</strong>。</p>\n<hr />\n<h2>四、\"出实验室\"了吗？——已商业化的形态与真实成色</h2>\n<h3>4.1 现在能买到的量子算力：云访问，按 shot 或按小时</h3>\n<p>AWS Braket 实际挂牌价：</p>\n<table>\n<thead>\n<tr>\n<th>计价方式</th>\n<th>价格</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>按任务</td>\n<td>$0.30 / task + 每 shot 费用</td>\n</tr>\n<tr>\n<td>每 shot</td>\n<td>IonQ Forte <strong>$0.08</strong>；QuEra Aquila $0.01；Rigetti Cepheus $0.000425</td>\n</tr>\n<tr>\n<td><strong>独占预留（小时）</strong></td>\n<td><strong>IonQ Forte $7,000/小时</strong>；Rigetti $4,100；IQM $3,000–4,000；QuEra $2,500</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>对照感</strong>：$7,000/小时 约等于 <strong>80–140 张 H100 的按需小时价</strong>。而这一小时的量子算力，<strong>在任何已知商业问题上都跑不过一台笔记本电脑</strong>。</p>\n</blockquote>\n<p><strong>付费客户在用它做什么</strong>：研发型探索与概念验证。McKinsey 称 300+ 家企业在与量子公司合作，33% 年投入 &gt;1,000 万美元。中文媒体对同一现实的表述更直白：产业\"至今没有给出一个经过独立验证的商业答案\"。</p>\n<h3>4.2 有没有经得起检验的实用量子优越性？——一个都没有</h3>\n<p><strong>这是本模块最重要的一节。</strong></p>\n<p><strong>(a) 随机线路采样 / 玻色采样：无实用价值的基准</strong></p>\n<p>祖冲之三号宣称比 Frontier 快 10^15 倍，但同一份技术分析明确承认\"RCS 本质上是概念验证任务\"。九章四号宣称经典需 &gt;10^42 年——<strong>但这个宣称的存在本身，就是因为上一代九章被经典算法打败了</strong>（Oh &amp; Jiang, <em>Nature Physics</em> 2024，证明 MPS 方法可利用光子损耗高效模拟早期玻色采样实验）。九章四号是把源效率提到 92%、压缩态提到 1,024 个来逃出可模拟区间。</p>\n<p><strong>(b) 被经典算法反超（dequantization）的历史——这条必须重点记住</strong></p>\n<table>\n<thead>\n<tr>\n<th>宣称</th>\n<th>结局</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Google Sycamore 2019：\"经典需一万年\"</td>\n<td><strong>2023 年前被经典方法基本抹平</strong></td>\n</tr>\n<tr>\n<td>IBM 2023 年 127 比特\"量子实用性\"（Nature 封面）</td>\n<td><strong>几天到几周内</strong>被多组张量网络复现，<strong>部分在普通笔记本/单台工作站上完成</strong></td>\n</tr>\n<tr>\n<td>玻色采样</td>\n<td>Nature Physics 2024 证明可经典模拟</td>\n</tr>\n<tr>\n<td>量子机器学习的\"指数加速\"</td>\n<td>Ewin Tang 系列 dequantization 工作系统性拆掉</td>\n</tr>\n<tr>\n<td>2026 年仍在继续</td>\n<td>arXiv:2604.12131 继续 dequantize 短路径量子算法</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>规律：每一次\"量子优越性\"宣称的平均存活期约 1–4 年。目前存活的（Quantum Echoes、九章四号、祖冲之三号）都还在保修期内。</strong></p>\n</blockquote>\n<p><strong>(c) 最接近\"真实商业问题\"的一次尝试，及其真实成色</strong></p>\n<p>IBM + RIKEN（2025-10）：77 比特 Heron + Fugaku 全部 152,064 节点，模拟铁硫簇电子结构。</p>\n<p><strong>结果距离最好的经典方法仍差约 0.1 Hartree ≈ 63 kcal/mol</strong>——对分子性质预测而言这是巨大误差。评论者的原话是，把这个称作量子优势需要\"<strong>定义体操</strong>\"（definitional gymnastics）。</p>\n<p><strong>另外注意 IBM 自己对\"量子优势\"的定义</strong>：不是硬指标，而是\"在算力、效率、成本、精度或其组合上有确凿证据\"。<strong>这是一个可以被灵活满足的定义。</strong> 当 IBM 在 2026 年底宣布\"实现量子优势\"时，请先看它用的是哪一条。</p>\n<h3>4.3 行业营收规模：一个字，小</h3>\n<table>\n<thead>\n<tr>\n<th>主体</th>\n<th>FY2025 营收</th>\n<th>FY2025 净亏损</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>全球量子公司合计</strong></td>\n<td><strong>&gt;10 亿美元</strong></td>\n<td>—</td>\n</tr>\n<tr>\n<td>IonQ</td>\n<td>1.30 亿美元（+202%）</td>\n<td><strong>5.104 亿美元</strong></td>\n</tr>\n<tr>\n<td>Quantinuum</td>\n<td>3,090 万美元</td>\n<td><strong>1.926 亿美元</strong></td>\n</tr>\n<tr>\n<td>D-Wave</td>\n<td>2,460 万美元（+179%）</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Rigetti</td>\n<td>710 万美元（<strong>从 1,080 万下滑</strong>）</td>\n<td><strong>2.161 亿美元</strong></td>\n</tr>\n<tr>\n<td>国盾量子（688027）</td>\n<td>人民币 3.1 亿元（+22.53%）</td>\n<td><strong>净利 +539 万元（首次扭亏）</strong></td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>量级感</strong>：整个全球量子计算产业 2025 年收入约 10 亿美元。这大约是 <strong>OpenAI 两周左右的收入</strong>，或 <strong>Nvidia 一天多一点的收入</strong>。</p>\n</blockquote>\n<p><strong>估值与基本面的脱节（这一条与模块 24 证伪中昊芯英是同一类问题）</strong>：</p>\n<ul>\n<li><strong>Quantinuum</strong> 2026-06 纳斯达克 IPO，估值约 <strong>140 亿美元 = 453 倍市销率</strong>；且 <strong>2026 Q1 营收同比下滑 73% 至 520 万美元</strong>，单季亏损 1.366 亿美元。</li>\n<li><strong>IonQ</strong> 前瞻市销率约 <strong>66 倍</strong>（行业中位数 4.36 倍）；2026-07 中旬股价从月内高点回落约 35%。</li>\n<li>2025 年全行业融资 <strong>126 亿美元</strong>（同比 6.3 倍），97% 是私人资本。<strong>资金流入速度远超收入增长速度</strong>——典型的预期驱动而非需求驱动。</li>\n</ul>\n<hr />\n<h2>五、对 AI 产业的影响</h2>\n<h3>5.1 量子机器学习：在经典数据上一次都没赢过</h3>\n<p>2026 年 QML 现状综述的直接结论：</p>\n<blockquote>\n<p>\"在经过强经典基线对照和完整硬件成本核算之后，<strong>没有任何量子学习结果获得广泛认可为端到端优势</strong>。\"</p>\n</blockquote>\n<p>具体证据：</p>\n<ul>\n<li><strong>Sheoran et al., Scientific Reports, 2025-12</strong>：5 个数据集上，<strong>普通逻辑回归在其中 3 个上胜过量子分类器</strong>。</li>\n<li><strong>2026-05 预印本</strong>：MNIST 上模拟的量子模型比经典<strong>慢约 1,200 倍</strong>。</li>\n<li>唯一有真实优势的场景是<strong>量子数据</strong>（学习量子系统本身）和<strong>人工构造的密码学数据集</strong>。<strong>这两类都不是商业数据。</strong></li>\n</ul>\n<h3>5.2 Barren Plateau：不是没解决，是解决了也没用</h3>\n<p>Barren plateau 指变分量子线路的损失函数梯度随比特数指数消失，导致无法训练。过去五年的主流方向是设计\"没有 barren plateau 的线路结构\"。</p>\n<p><strong>结果是一条已发表的结构性定理</strong>（Cerezo 等，<em>Nature Communications</em> 2025）：</p>\n<blockquote>\n<p><strong>可证明不存在 barren plateau，往往意味着该线路经典可高效模拟。</strong></p>\n</blockquote>\n<p>即：<strong>能训练的量子模型，经典计算机也能跑；经典跑不了的，训练不动。</strong> 配套结果：量子卷积神经网络（QCNN）被证明有效经典可模拟（LANL）。</p>\n<blockquote>\n<p><strong>这不是一个待解决的工程问题，而是一个结构性的两难。</strong> 这一条是整个 QML 叙事最致命的证据，比任何 benchmark 数字都重要。</p>\n</blockquote>\n<h3>5.3 量子能不能加速大模型训练或推理？不能，差距是 10^13 量级</h3>\n<p>最完整的技术分析（arXiv:2511.01253）给出的综合劣势拆解：</p>\n<table>\n<thead>\n<tr>\n<th>因子</th>\n<th>倍数</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>门速度 vs 浮点运算</td>\n<td>~10^3</td>\n<td>超导双比特门 20–100 ns，离子阱 10–100 μs；GPU FLOP 是亚纳秒级</td>\n</tr>\n<tr>\n<td>纠错开销</td>\n<td>~10^2</td>\n<td>逻辑门要靠大量物理门合成</td>\n</tr>\n<tr>\n<td><strong>单位美元的 GPU 并行度</strong></td>\n<td><strong>~10^8</strong></td>\n<td><strong>最致命的一项</strong></td>\n</tr>\n<tr>\n<td><strong>合计</strong></td>\n<td><strong>~10^13</strong></td>\n<td></td>\n</tr>\n</tbody>\n</table>\n<p>要吃掉 10^13 的劣势，问题规模必须巨大到渐进优势才起作用：量子聚类需要 10^13 个以上数据点；Grover 超参搜索需要 <strong>10^24 的搜索空间</strong>（实践中是几百）；量子强化学习需要 &gt;10^20 个动作。</p>\n<p><strong>更根本的瓶颈：数据加载 / QRAM。</strong></p>\n<p>要在量子计算机上处理经典数据，必须先把数据编码进量子态。对一般数据，<strong>这个加载开销可以和你希望加速的计算本身一样大</strong>——优势被入口抵消。而实现 QRAM 的难度\"与建造一台容错量子计算机相当\"，<strong>甚至可能根本不可行</strong>。</p>\n<p><strong>Scott Aaronson 的框架</strong>：量子只在三处有可信加速——<strong>量子模拟（化学/材料）、Shor 破密、Grover 平方根加速</strong>。而 Grover 对优化和 ML 只是平方级，不是指数级。他的原话是其他领域是\"堑壕战，不是魔法般地加速一切\"。</p>\n<blockquote>\n<p>⚠️ <strong>引用 Aaronson 时必须分开两个判断</strong>：他对<strong>容错时间线偏乐观</strong>（\"照当前速度，十年内要么有可用的容错量子计算机，要么发生了某些令人意外的事\"），但对 <strong>QML 明确不看好</strong>。不要把这两条混为一谈。</p>\n</blockquote>\n<h3>5.4 反方向：AI 正在实质性帮助量子——这条线比 QML 扎实得多</h3>\n<ul>\n<li><strong>AlphaQubit</strong>（DeepMind, <em>Nature</em> 2024-11）：基于 Transformer 的表面码解码器，比张量网络方法<strong>少 6% 错误</strong>，比 correlated matching <strong>少 30% 错误</strong>。在真实 Sycamore 数据上验证。</li>\n<li><strong>但论文自己说明局限</strong>：AlphaQubit \"太慢，无法对超导处理器做实时纠错\"。</li>\n<li><strong>实时解码的工程解法反而是专用硬件</strong>：IBM 的 FPGA 解码器 &lt;480 ns，比 GPU 方案快一个数量级。</li>\n<li><strong>Nvidia NVQLink</strong>（2025-10）：把 Grace Blackwell 与 QPU 直连，<strong>专门服务于实时量子纠错解码这一个 workload</strong>，17 家量子厂商 + 9 个科学实验室采用。</li>\n</ul>\n<blockquote>\n<p><strong>这条线对 AI 产业的含义是反直觉的，也是本模块最值得记住的一句话</strong>：</p>\n<p><strong>短期内，量子计算是 GPU 的需求方，不是替代者。每台走向容错的量子机都要挂一套 GPU/FPGA 实时解码集群。如果量子计算成功，GPU 需求增加。</strong></p>\n</blockquote>\n<h3>5.5 严肃的反方论证清单</h3>\n<table>\n<thead>\n<tr>\n<th>论者</th>\n<th>身份</th>\n<th>核心论点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Matthias Troyer</strong></td>\n<td>微软</td>\n<td>量子门比晶体管慢若干数量级；平方级加速需运行数世纪；I/O 带宽比经典慢千倍到百万倍</td>\n</tr>\n<tr>\n<td><strong>Oskar Painter</strong></td>\n<td>AWS 量子硬件负责人</td>\n<td>行业存在\"巨量炒作\"；容错至少还要十年；约 1,000 物理比特换 1 逻辑比特</td>\n</tr>\n<tr>\n<td><strong>Yann LeCun</strong></td>\n<td>Meta</td>\n<td>怀疑能否造出\"真正有用\"的量子计算机</td>\n</tr>\n<tr>\n<td><strong>Scott Aaronson</strong></td>\n<td>UT Austin</td>\n<td>只有量子模拟/Shor/Grover 三处可信；QML 前景不佳</td>\n</tr>\n<tr>\n<td><strong>arXiv:2511.01253 作者组</strong></td>\n<td>—</td>\n<td>量子深度学习面临 ~10^13 综合劣势；QRAM 可能根本不可行</td>\n</tr>\n<tr>\n<td><strong>Yuval Boger</strong></td>\n<td>QuEra CMO（<strong>业内人士</strong>）</td>\n<td>承认行业过度承诺</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>六、唯一真正会触达我们的量子变量：后量子密码（PQC）</h2>\n<p><strong>这一节是本模块唯一有行动项的部分。</strong></p>\n<h3>6.1 技术差距 vs 监管日历</h3>\n<p><strong>技术侧</strong>：破解 RSA-2048 需要 &lt; 100 万含噪物理比特。当前最大机器是 100–200 物理比特量级。<strong>差距约 4 个数量级。</strong></p>\n<p><strong>但监管不等技术。合规时间表已经是硬的：</strong></p>\n<table>\n<thead>\n<tr>\n<th>主体</th>\n<th>节点</th>\n<th>要求</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>美国行政令（2026-06-22 签署）</strong></td>\n<td><strong>2030 年底 / 2031 年底</strong></td>\n<td>密钥建立 / 数字签名，联邦机构<strong>及政府承包商</strong>必须迁移</td>\n</tr>\n<tr>\n<td><strong>NIST IR 8547</strong></td>\n<td><strong>2030 / 2035</strong></td>\n<td>RSA-2048、ECC P-256 弃用 / 完全禁用</td>\n</tr>\n<tr>\n<td><strong>NSA CNSA 2.0</strong></td>\n<td>2027-01-01</td>\n<td>软件/固件签名必须专用 PQC</td>\n</tr>\n<tr>\n<td></td>\n<td><strong>2033</strong></td>\n<td><strong>云服务专用 PQC</strong></td>\n</tr>\n<tr>\n<td><strong>欧盟路线图</strong></td>\n<td>2026 年底 / 2030 年底</td>\n<td>成员国发布策略与密码资产清点 / 关键基础设施完成</td>\n</tr>\n<tr>\n<td><strong>中国</strong></td>\n<td>2025-02 启动</td>\n<td>商用密码标准研究院启动新一代公钥算法征集，明确面向抗量子。<strong>具体截止日与标准发布时间未检索到</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>6.2 已实际发生的迁移进度</h3>\n<p>截至 2025-10，<strong>通过 Cloudflare 网络的人类 web 流量已有超过 50% 采用后量子加密</strong>（混合模式，如 X25519 + ML-KEM）。Cloudflare 自 2025 年初起对全网站点默认启用。</p>\n<blockquote>\n<p><strong>关键区分——这一条直接关系到我们</strong>：</p>\n<p>浏览器 ↔ CDN 这一段是\"<strong>容易的一半</strong>\"，已经过半。</p>\n<p><strong>源站侧、内部 API 调用、服务间 mTLS、遗留设备是\"难的一半\"，进度慢得多。而我们的业务恰好全部由这类流量构成。</strong></p>\n</blockquote>\n<h3>6.3 我们该做什么（成本：人天到人周级，不是战略级投入）</h3>\n<p><strong>(a) 现在就把面向客户的 TLS 打开混合后量子密钥交换（X25519 + ML-KEM）。</strong>\n我们的入口在 Cloudflare 后面，<strong>这基本上是一个开关</strong>。Cloudflare 自 2025 年初已对全网站点默认开启。<strong>成本近似为零。</strong></p>\n<p><strong>(b) 做一次密码资产清点（cryptographic inventory）。</strong>\n清点范围：API 密钥签发机制、JWT 签名算法、与上游模型厂商的 mTLS、内部服务间调用、密钥托管方案分别用什么算法。</p>\n<blockquote>\n<p><strong>这份清单在 2027–2029 年会被企业客户和采购问卷反复要求。现在做要 2 人天，被问到时临时做要 2 个月。</strong></p>\n</blockquote>\n<p><strong>(c) 把它变成差异化卖点。</strong>\n\"难的一半\"正好在我们这一层。<strong>一家能在 2027 年就出具\"PQC-ready\"证明的 API 网关，在面向金融、政企、出海欧美客户的招标里是加分项，而这个加分项现在的获取成本几乎为零。</strong></p>\n<p>这与模块 08 的基本判断一致：<strong>合规不是成本，是准入门槛，也是竞争壁垒。</strong> PQC 是这条判断的又一个实例。</p>\n<hr />\n<h2>七、明确不要做的事</h2>\n<ol>\n<li><strong>不要在任何对外材料里提\"量子\"。</strong> 这个行业 2025–2026 年正在经历估值修正（IonQ 从月内高点回落 35%；Quantinuum IPO 453 倍市销率且 Q1 营收同比 -73%）。<strong>蹭这个词在 2026 年已经从加分变成减分。</strong></li>\n<li><strong>不要招量子相关人才、不要做\"量子就绪\"产品页、不要跟量子公司做无实质内容的战略合作 PR。</strong></li>\n<li><strong>不要相信任何\"量子将颠覆 AI\"的卖方研报。</strong> 经同行评议的证据是：QML 在经典数据上一次都没赢过，且\"可训练的量子模型往往经典可模拟\"是一个<strong>已发表的结构性定理</strong>，不是待解决的工程问题。</li>\n<li><strong>不要为量子算力做任何供给侧规划。</strong> 见第八节的架构性理由。</li>\n</ol>\n<hr />\n<h2>八、为什么量子算力永远进不了我们的供给组合（架构性理由）</h2>\n<p>这一节解释的是\"为什么不是时间问题\"。</p>\n<p><strong>(1) 不可分割 vs 可切分。</strong>\nGPU 可以虚拟化、切分、多租户、按 token 计价，利用率可以逼近 90%+。<strong>量子机是单任务独占</strong>——这正是 AWS Braket 要按\"$7,000/小时独占预留\"计价的原因。<strong>你无法把一台 QPU 的 5% 卖给一个客户。</strong></p>\n<blockquote>\n<p><strong>这从根上决定了量子算力不可能形成 token 级的分销市场。</strong> 而 token 级分销正是我们全部四条业务线的载体（见模块 02）。<strong>这不是\"现在还不行、以后会行\"，这是架构性错配。</strong></p>\n</blockquote>\n<p><strong>(2) 没有摩尔定律曲线。</strong>\nGPU 每代单位算力成本下降是可预期的。量子的成本下降路径<strong>不来自制程</strong>，而来自纠错开销的降低（如 IBM 的 qLDPC 声称比表面码省 10 倍物理比特）——<strong>这是算法/编码理论的进步，不是制造业的规模曲线</strong>，节奏不可预测，也不能外推。</p>\n<blockquote>\n<p><strong>这一条与模块 22 对国产算力卡的判断形成有意思的对照</strong>：国产卡的降价要等良率过 60%，那是一条<strong>可预测的制造业曲线</strong>；量子的成本下降没有对应的曲线，因此<strong>不能用同样的方法做规划</strong>。</p>\n</blockquote>\n<p><strong>(3) 功耗对比是个陷阱。</strong>\n超导量子机（含稀释制冷机）约 <strong>10–25 kW</strong>，对照 Frontier 约 21 MW——看起来便宜三个数量级。<strong>但分母不同</strong>：Frontier 每小时产出海量有用的 FLOP，量子机每小时产出的有用商业计算目前约等于零。</p>\n<blockquote>\n<p><strong>每单位有用计算的能耗，量子当前是无穷大。引用\"量子更省电\"的论证时必须问：省电做什么。</strong></p>\n</blockquote>\n<p><strong>(4) 造价与运营成本量级</strong>（供参考，不构成规划依据）：</p>\n<table>\n<thead>\n<tr>\n<th>项目</th>\n<th>量级</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Rigetti Novera 9 比特 QPU</td>\n<td>约 90 万美元；含升级整机约 285 万美元</td>\n</tr>\n<tr>\n<td>IQM 54 比特系统（含 HPC 集成）</td>\n<td>€2,500 万</td>\n</tr>\n<tr>\n<td>稀释制冷机（Bluefors）</td>\n<td>70 万–1,000 万美元（视级别）</td>\n</tr>\n<tr>\n<td>氦-3 初装 + 回收系统</td>\n<td>约 28 万美元；年补充 1.5 万–5 万美元</td>\n</tr>\n<tr>\n<td><strong>年运营成本</strong></td>\n<td>入门 5 比特约 61 万美元/年；<strong>工业级 200 万–3,000 万美元/年</strong></td>\n</tr>\n<tr>\n<td><strong>五年 TCO</strong></td>\n<td>入门约 510 万美元；<strong>工业级 3,000 万–8,000 万美元</strong></td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>九、中国的情况</h2>\n<h3>9.1 投入与政策</h3>\n<p><strong>公共投入</strong>（截至 2025-04，全球 540 亿美元）：<strong>中国 153 亿美元（全球第一，约占三分之一）</strong> &gt; 日本 92 亿 &gt; 美国 60 亿。</p>\n<p><strong>但社会风险投资差一个数量级</strong>：中国约 1 亿美元 vs 美国 17 亿美元。</p>\n<p><strong>政策沿革</strong>：十二五列为重点方向 → 十三五设\"科技创新 2030\"专项 → <strong>十四五列为七大前沿科技之一</strong> → <strong>二十届四中全会（2025-10）把\"量子科技\"列在新增长点列举的第一位</strong> → 十五五规划纲要多方位布局（媒体口径称排在未来产业布局首位，<strong>规划纲要一手原文未取得</strong>）。</p>\n<p><strong>产业分布</strong>：全国 140 余家相关企业，合肥集聚 70 余家；全球 12 家量子\"独角兽\"中中国占 4 家。</p>\n<h3>9.2 领先在哪，落后在哪</h3>\n<p><strong>领先或并跑</strong>：\n- <strong>量子通信明确世界第一</strong>（2016 墨子号、2017 京沪干线、2025 跨亚非大陆星地通信）\n- <strong>随机线路采样 / 玻色采样并跑或领先</strong>（祖冲之三号 PRL 2025、九章四号 Nature 2026）</p>\n<p><strong>落后（这才是关键）</strong>：\n- <strong>纠错与逻辑比特明显落后。</strong> 全球逻辑比特排行榜前六名（QuEra 96、Quantinuum 48、Atom+微软 24、Google 1、Infleqtion 12、Nord Quantique 1）<strong>没有一家中国机构</strong>。中国的公开成果集中在\"物理比特数 + 采样优越性\"，而<strong>国际前沿已转向\"逻辑比特 + 纠错开销\"</strong>。\n- <strong>关键器件卡脖子</strong>：稀释制冷机、单光子探测器、专用设备仍依赖进口。\n- <strong>时间表落差</strong>：IBM 计划 2028 年前后建成约 200 逻辑比特原型机；中国企业的公开目标是 <strong>2030 年达到同等量级</strong>。</p>\n<blockquote>\n<p><strong>最诚实的差距刻度</strong>：本源悟空-180 的双比特门保真度是 <strong>99%</strong>，而 Quantinuum Helios 是 <strong>99.921%</strong>、Google Willow 是 <strong>99.88%</strong>。</p>\n<p><strong>99% 与 99.9% 之间是 10 倍的错误率差距，这对纠错是决定性的——在 99% 的双比特保真度下，低于阈值纠错做不到。</strong></p>\n</blockquote>\n<h3>9.3 商业化：与国际同行处于同一档，即\"基本没有\"</h3>\n<ul>\n<li><strong>国盾量子（688027）</strong>：唯一 A 股纯量子标的。2025 年营收人民币 3.1 亿元（+22.53%），净利 539 万元，<strong>连亏四年后首次扭亏</strong>；量子计算业务近 1.2 亿元（+111.82%，占比约 39%）。已成为中国电信全资子公司控股企业。</li>\n<li><strong>本源量子</strong>：完成近 30 亿元 Pre-IPO 轮，投前估值 <strong>210 亿元</strong>，冲刺 IPO。</li>\n<li><strong>图灵量子</strong> 近 10 亿元融资、估值超 70 亿元；<strong>玻色量子</strong> 10 亿元 B 轮。</li>\n<li><strong>2026 年 Q1 国内量子融资 32.04 亿元，单季超过 2025 年全年。</strong></li>\n</ul>\n<blockquote>\n<p><strong>判读</strong>：国盾量子 3.1 亿元人民币营收（约 4,300 万美元）实际上<strong>比 Quantinuum 的 3,090 万美元还高</strong>——这更多说明<strong>国际同行有多小</strong>，而不是中国有多强。</p>\n<p>国资驱动特征明显（中国电信控股、国资抢投），这意味着<strong>订单质量与市场化订单不同</strong>。这与模块 24 分析中昊芯英时的方法一致：<strong>看订单来源，不只看订单金额。</strong></p>\n</blockquote>\n<hr />\n<h2>十、观察指标与复核触发条件</h2>\n<p><strong>每年花 15 分钟看一次即可，不需要更多。</strong></p>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>指标</th>\n<th>判据</th>\n<th>影响</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><strong>IBM Starling</strong></td>\n<td>2029 年是否真的交付 200 逻辑比特 / 1 亿门。若 2027 年底 Kookaburra/Cockatoo 节点明显延期，整条时间线右移</td>\n<td>全行业最具体、最可证伪的承诺</td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong>实用量子优势</strong></td>\n<td>是否出现<strong>独立第三方复现的、在真实商业问题上</strong>（非 RCS、非 OTOC、非人工构造数据集）的量子优势，且发表 ≥12 个月未被经典反超</td>\n<td>历史上这类宣称平均存活 1–4 年</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>QML 突破</strong></td>\n<td>是否出现在经典数据上端到端胜出、可复现的结果，特别是绕开数据加载瓶颈的方案（关注 QRAM / oracle sketching）</td>\n<td>目前有结构性定理阻挡</td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong>PQC 合规节点</strong></td>\n<td>2027（CNSA 2.0 签名）、2030（NIST 弃用 + 美国行政令密钥建立）、2031（数字签名）、2033（CNSA 云服务）</td>\n<td><strong>不需要触发条件，直接按日历执行</strong></td>\n</tr>\n<tr>\n<td>5</td>\n<td>中国标准</td>\n<td>新一代国密抗量子算法标准发布时间</td>\n<td>影响国内客户的合规要求时点</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>十一、核心来源</h2>\n<p><strong>硬件与实验</strong>\n- IBM 大规模容错路径 https://www.ibm.com/quantum/blog/large-scale-ftqc ｜ 路线图 https://www.ibm.com/roadmaps/quantum.p
