strong>百万 Token 性价比提升超过 2 倍</strong>，相比传统同等性能芯片功耗降低 50%。</p>\n<p><strong>这些是厂商自述数据，无第三方实测佐证，引用时必须标注。</strong></p>\n<hr />\n<h2>四、产品线</h2>\n<table>\n<thead>\n<tr>\n<th>产品</th>\n<th>类型</th>\n<th>关键参数</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>刹那</strong></td>\n<td>第一代 TPU</td>\n<td>单芯 <strong>204 TFLOPS</strong>（FP16），12nm 量产</td>\n</tr>\n<tr>\n<td><strong>泰则</strong></td>\n<td>千卡集群</td>\n<td>支持 1024 片高速互联</td>\n</tr>\n<tr>\n<td><strong>须臾</strong></td>\n<td>第二代 TPU（2026 年发布）</td>\n<td>混合精度浮点 <strong>896 TFLOPS</strong>，8-bit 推理 <strong>1792 TOPS</strong>，支持百万词元高并发推理</td>\n</tr>\n</tbody>\n</table>\n<p><strong>独创 UE8M0 FP8 格式</strong>：宣称单位成本降低 42%、训练成本降低 30%。</p>\n<p><strong>\"刹那\"的厂商宣称</strong>：能效比国际 GPU 高 30%，性能超英伟达同级产品 1.5 倍，功耗降低 30%，单位成本降低 50%。<strong>\"同级产品\"未指明具体型号，这类无参照对象的对比宣称价值有限。</strong></p>\n<p><strong>制程</strong>：12nm 已量产。<strong>注意</strong>：对照模块 22，昇腾 950 已用 HBM3e、4TB/s 带宽，而 12nm 是相对成熟的制程。<strong>用成熟制程做出高算力，正是 TPU 架构效率优势的体现，但也意味着在制程红利上没有空间。</strong></p>\n<hr />\n<h2>五、大模型适配</h2>\n<p><strong>通过中国信通院\"DeepSeek 大模型适配测试\"</strong>，与华为、寒武纪等共同获得认证，<strong>已适配 DeepSeek-V3.1 等大模型</strong>。</p>\n<p><strong>这是本档案中少数有第三方机构背书的事实，可信度较高。</strong></p>\n<p><strong>但要注意适配深度的差别</strong>：模块 23 记录天数智芯已进入 DeepSeek-<strong>V4</strong> 的适配名单，而中昊芯英公开可查的是 <strong>V3.1</strong>。<strong>版本代差可能反映适配进度差异，但也可能只是公开信息更新不同步，不宜过度解读。</strong></p>\n<p><strong>TPU 路线的适配难度需要如实说明</strong>：TPU 是专用架构，与 CUDA 生态无兼容关系。这意味着<strong>迁移成本显著高于走兼容路线的海光、天数智芯</strong>。厂商自述软件生态\"处于初期阶段\"——<strong>这是公司自己承认的短板，销售应当如实转述而非回避。</strong></p>\n<hr />\n<h2>六、客户与落地</h2>\n<p><strong>已披露的客户与项目</strong>：\n- 初代芯片应用于<strong>深圳联通、天津移动、太极股份</strong>等机构建设的超大规模智算中心\n- 覆盖金融、教育、传媒等行业\n- 青海\"丝绸云谷\"<strong>9 亿元服务器订单</strong>\n- 与深圳联通共建智算中心\n- 与浙江大学推进 AI 应用\n- 有报道提及字节跳动、阿里等企业订单（<strong>未见双方确认，存疑</strong>）</p>\n<p><strong>产能布局</strong>：\n- 2025 年 5 月 15 日，温岭第一条整线生产线投产\n- <strong>绍兴基地</strong>：总投资 28 亿元，一期 14.5 亿元，2025 年 6 月开工，<strong>2027 年 4 月竣工</strong>\n- <strong>台州基地</strong>：总投资 10 亿元，预计年产值 20 亿元</p>\n<p><strong>运营商与地方国资项目是其主力客户结构</strong>，这在国产芯片厂商中很典型——<strong>也意味着营收质量高度依赖政府与国企采购节奏。</strong></p>\n<hr />\n<h2>七、政策支持</h2>\n<p>这是中昊芯英相对天数智芯明显更强的一项：</p>\n<p>2024 年\"中国芯\"最高奖；2024 年度\"年大重大创新突破产品\"；2024 德勤中国高科技高成长 50 强<strong>榜首</strong>；人社部\"最具成长潜力\"留学人员创业企业；<strong>国家级专精特新\"小巨人\"企业</strong>；2025 硬核芯生态大会唯一\"年度创业团队奖\"。</p>\n<p><strong>国家级专精特新\"小巨人\"是其中含金量最高的一项</strong>，它对应实质性的政策资源与地方配套。<strong>在服务信创客户时，这类资质是可以引用的加分项。</strong></p>\n<hr />\n<h2>八、资本路径：一条充满不确定性的曲线</h2>\n<p><strong>这一节请仔细读，它是本档案的核心风险所在。</strong></p>\n<p><strong>融资与估值</strong>：2025 年 6 月完成 C 轮融资，<strong>估值 40 亿元</strong>（另有报道称约 44 亿元）。股东包括科德教育持股 6.21%、艾布鲁子公司持股 9.73%。</p>\n<p><strong>对赌压力</strong>：需在 <strong>2026 年 12 月 31 日前</strong>完成合格 IPO 或借壳上市。若 2024–2025 两年净利润合计低于 2 亿元，<strong>需 17.31 亿元回购</strong>；已有投资人豁免其中 10.68 亿元。</p>\n<p><strong>曲线上市路径</strong>：创始人杨龚轶凡入主 A 股上市公司<strong>天普股份</strong>（宁波天普橡胶，汽车橡胶管路企业，2024 年营收 3.42 亿元、净利 0.33 亿元）。</p>\n<p>交易经过：2025 年 8 月 15 日天普股份停牌，8 月 21 日发布重组公告，8 月 22 日复牌涨停；<strong>2025 年 12 月 24 日易主三步全部完成</strong>，中昊芯英及一致行动人合计持股约 <strong>68.29%</strong>，杨龚轶凡成为实际控制人；12 月 29 日完成董事会换届。</p>\n<h3>8.1 这里有一个必须正视的矛盾</h3>\n<p><strong>天普股份 2025 年股价从 12.59 元涨到 218.02 元，累计涨幅 1631.69%，位居 A 股第二。</strong> 随后<strong>收到监管函</strong>（涉嫌信息披露违规），<strong>四个月内经历五次停牌核查</strong>。</p>\n<p>而中昊芯英方面<strong>多次公开承诺</strong>：没有在未来 12 个月内改变上市公司主营业务的计划、没有出售合并等明确计划，<strong>且声称\"无开展人工智能相关业务的计划\"</strong>。</p>\n<p><strong>市场普遍视之为借壳上市，公司却持续否认——这个矛盾本身就是最大的风险信号。</strong></p>\n<p>两种解读都成立：一种是确实暂无注入计划，控制权收购另有考虑；另一种是受限于借壳的监管审查与时间窗口，暂不便表态。<strong>无论哪种，结论都一样：中昊芯英的上市路径在 2026 年底前存在实质不确定性，而对赌条款的时限恰好压在同一时点。</strong></p>\n<hr />\n<h2>九、⚠️ 数据可信度警示：必读</h2>\n<p><strong>关于中昊芯英，网络上流传着一批严重失实或内部矛盾的数据，如果照单全收会做出错误判断。</strong></p>\n<h3>9.1 估值的巨大落差</h3>\n<p>有面向散户的财经自媒体给出\"保守估计 500 亿元、初上市 1000 亿元、长期乐观 3000 亿元以上\"的市值预期。</p>\n<p><strong>而其 2025 年 6 月 C 轮的实际估值是 40 亿元（另有报道称 44 亿元）。</strong></p>\n<p><strong>这中间是十倍到七十倍的差距。</strong> 那类预期是二级市场情绪推演，<strong>不是公司估值，不得引用</strong>。</p>\n<h3>9.2 财务数据内部矛盾</h3>\n<p>同一批自媒体给出的财务数据如下，<strong>请注意它们无法自洽</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>期间</th>\n<th>流传的营收</th>\n<th>流传的净利润</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2023</td>\n<td>4.85 亿元</td>\n<td>8133 万元</td>\n</tr>\n<tr>\n<td>2024</td>\n<td>5.98 亿元</td>\n<td>8591 万元</td>\n</tr>\n<tr>\n<td>2025 H1</td>\n<td>1.02 亿元</td>\n<td><strong>−1.44 亿元</strong></td>\n</tr>\n<tr>\n<td>2025 全年\"预期\"</td>\n<td>20 亿元</td>\n<td>4.5 亿元</td>\n</tr>\n</tbody>\n</table>\n<p><strong>三处硬伤：</strong></p>\n<p><strong>其一</strong>，2024 年营收 5.98 亿、净利 8591 万的公司，<strong>不可能在 2025 年 6 月只融到 40 亿估值</strong>——那相当于约 7 倍 PS、47 倍 PE，远低于当前国产芯片一级市场水平（对照天数智芯 IPO 前 120 亿估值对应 2024 年 5.40 亿营收，约 22 倍 PS）。</p>\n<p><strong>其二</strong>，2025 上半年营收 1.02 亿、亏损 1.44 亿，却预期全年 20 亿营收、4.5 亿净利——<strong>下半年要做出 19 亿营收和近 6 亿利润，不具备现实性。</strong></p>\n<p><strong>其三</strong>，同一篇材料称\"近三年收入增长率达 3534%\"，与 4.85 亿 → 5.98 亿（约 23% 增长）直接冲突。</p>\n<p><strong>处理方式：本模块不采信上述任何一组财务数字。</strong> 中昊芯英未上市、无审计披露义务，<strong>其真实经营状况目前无法从公开渠道核实</strong>。这与天数智芯（招股书经审计、数据可核验）形成鲜明对比。</p>\n<h3>9.3 与模块 20 的一处关联提醒</h3>\n<p>模块 20 那份待证实材料曾给出\"国产卡生态没问题\"的乐观判断，模块 22 已指出其与行业调研冲突。<strong>中昊芯英自述\"软件生态处于初期阶段\"，恰好从厂商侧印证了模块 22 的判断——生态差距是真实的。</strong></p>\n<hr />\n<h2>十、风险评估</h2>\n<p><strong>资本路径不确定</strong>：对赌时限 2026 年底，借壳预期与公司否认之间存在矛盾，标的公司已收监管函。<strong>这是最需要盯的一项。</strong></p>\n<p><strong>财务不透明</strong>：无审计披露，流传数据不可信。</p>\n<p><strong>生态最薄弱</strong>：TPU 专用架构与 CUDA 无兼容关系，迁移成本显著高于海光、天数智芯，公司自述生态处于初期。</p>\n<p><strong>万卡规模未验证</strong>：泰则集群标称支持 1024 片互联，但对照模块 22——超节点能力是国产阵营差距最大的环节，华为是国内唯一具备千卡级稳定交付能力的厂商。<strong>中昊芯英的千卡能力需要实际项目验证。</strong></p>\n<p><strong>客户集中于运营商与地方国资</strong>：营收质量依赖政府采购节奏。</p>\n<p><strong>技术叙事强、商业验证弱</strong>：创始人背景与架构选择的说服力，明显强于可核验的经营数据。</p>\n<hr />\n<h2>十一、对我们意味着什么</h2>\n<p><strong>第一，TPU 的长上下文优势值得持续关注，但现在不是下注的时候。</strong></p>\n<p>如果\"提升 KV Cache 命中率、削减历史上下文重复计算\"的能力被实测验证，它针对的正是我们在模块 21 第 1.5 节推导出的 Agent 成本结构——<strong>这是硬件层面对我们最相关的一条技术进展</strong>。Agent 是我们判断中 token 消耗最猛的场景（模块 16），能从根子上降低这块成本的架构，长期看会改变推理成本曲线。</p>\n<p><strong>但目前全部是厂商自述，没有第三方实测。建议列入观察，不作为任何方案的依据。</strong></p>\n<p><strong>第二，它在「信创合规通道」机会中的位置：政策资质强，但落地可核验性弱。</strong></p>\n<p>国家级专精特新\"小巨人\"、完全自主 IP 核与指令集、无国外授权依赖——<strong>这套自主可控叙事在政务、金融客户面前是有说服力的</strong>。加上信通院 DeepSeek 适配认证，是可以引用的第三方背书。</p>\n<p><strong>但</strong>：我们要做的是\"跑在国产算力上的 API 通道\"（模块 22 第 6.3 节），需要的是<strong>能对外提供 API 服务的上游</strong>。中昊芯英的客户是运营商与地方智算中心——<strong>真正该摸排的是深圳联通、天津移动这类基于其芯片建设的智算中心，是否对外提供 API 及能否出具书面说明。</strong></p>\n<p><strong>第三，把它当作判断 TPU 路线是否可行的观察窗口。</strong></p>\n<p>TPU vs GPGPU 是国产算力最重要的路线分歧之一。<strong>中昊芯英基本是国内 TPU 路线的唯一样本</strong>——它成了，说明专用架构在中国走得通；它没成，说明生态成本终究压倒了架构效率。<strong>这个结论会影响我们未来两三年对上游结构的判断。</strong></p>\n<p><strong>第四，2026 年 12 月 31 日是必须标记的日期。</strong></p>\n<p>对赌时限与上市窗口重合。<strong>如果客户方案里涉及中昊芯英的芯片，建议在商务条款中考虑供应商持续性风险</strong>——这不是唱衰，是尽职。模块 22 已定纪律：芯片厂商的经营风险最终会传导为客户的服务连续性风险。</p>\n<p><strong>销售纪律（三条，与模块 22 第 6.5 节一致）</strong>：</p>\n<p>不引用 500 亿/1000 亿/3000 亿这类市值预期；不引用第九节列出的任何财务数字；性能参数一律标注\"厂商标称，无第三方实测\"。</p>\n<p><strong>可以放心引用的只有四项</strong>：创始人的谷歌 TPU 2/3/4 背景、信通院 DeepSeek 适配认证、国家级专精特新\"小巨人\"资质、以及深圳联通/天津移动/太极股份的落地案例。<strong>这四项都有第三方可核验来源。</strong></p>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://caifuhao.eastmoney.com/news/1606283642\">解读中昊芯英——国内 TPU 架构 AI 芯片的领军企业 - 东方财富财富号</a>（公司沿革、团队、产品参数、政策奖项。<strong>⚠️ 该文财务数据与市值预期不可采信，见第九节</strong>）</li>\n<li><a href=\"https://www.163.com/dy/article/L16616VD053469RG.html\">中昊芯英：直击智能体算力成本痛点，探索国产 TPU 无人区 - 网易</a>（须臾参数、长上下文优势、客户案例、CEO 判断）</li>\n<li><a href=\"https://www.chnfund.com/article/ARb135c98e-51c6-29ea-5dd3-3a1be325e3aa\">中昊芯英创始人拟入主天普股份 - 中国基金报</a>（交易结构、C 轮估值 40 亿、股东）</li>\n<li><a href=\"https://news.qq.com/rain/a/20260105A027LB00\">暴涨 1631% 牛股天普股份涉违规收监管函，业绩双降受中昊芯英\"借壳\"传闻袭扰 - 腾讯新闻</a>（监管函、股价、公司否认表态、易主完成情况）</li>\n<li><a href=\"https://finance.sina.com.cn/tech/digi/2025-12-30/doc-inheqixn9579388.shtml\">中昊芯英 CEO 杨龚轶凡：第二代 TPU 芯片计划 2026 年正式推向市场 - 新浪科技</a></li>\n<li>内部交叉引用：模块 16 与 21（Agent 消耗机制，TPU 优化的针对性）、模块 22（国产算力大盘、超节点差距、信创机会、销售纪律）、模块 23（天数智芯对照）</li>\n</ul>\n<blockquote>\n<p>本模块信息来源以媒体报道为主，<strong>公司未上市、无审计披露</strong>。所有性能与财务数据均<strong>不得作为对客承诺</strong>，引用前请核对第九节的可信度警示。</p>\n</blockquote>", "plain": " 模块 24 · 中昊芯英档案\n\n 单家厂商深度档案。杭州中昊芯英（Zhonghao Xinying），国产 TPU 路线代表。\n 使用者：决策层、销售（信创与 Agent 场景客户）、售前。\n 数据采集日：20260727。\n ⚠️ 本模块含大量需要证伪的网络传言，请务必读完第九节再引用任何数据。\n\n\n\n 一、一句话定位\n\n国内极少数走 TPU（张量处理器）专用架构路线的 AI 芯片公司，创始人是前谷歌 TPU 核心研发者，技术叙事扎实，但资本路径与财务真实性存在显著疑点。\n\n它与天数智芯（模块 23）构成一组有价值的对照：天数智芯走 GPGPU 通用路线、已上市、财务可核验；中昊芯英走 TPU 专用路线、未上市、财务信息混乱。\n\n\n\n 二、起源与团队\n\n2018 年创立，2020 年在杭州正式注册落地。\n\n创始人杨龚轶凡——这是这家公司最硬的资产，值得单独说清楚：斯坦福硕士、密歇根学士，硅谷高端芯片研发超 10 年，深度参与 Google TPU 2/3/4 代设计，此前在甲骨文主导过 12 款顶级 CPU 设计。\n\n核心团队来自谷歌、英伟达、微软、甲骨文、三星等，研发人员占比 70% 以上，掌握 28nm 至 7nm 各代制程工艺。\n\n这个背景的含金量是真实的。 全球真正做过 TPU 量产级设计的人极少，而 TPU 是被谷歌验证过的、唯一在大规模生产环境中与 GPU 长期共存的替代架构。创始人背景是本档案中可信度最高的一项。\n\n\n\n 三、技术路线：为什么选 TPU\n\n杨龚轶凡的路线判断值得完整记录，因为它解释了这家公司的全部战略：\n\n他认为通用 GPU 难以突破——英伟达、AMD 深耕 GPU 三十年，每年投入数十亿美元研发，硬件架构与 CUDA 软件栈的优化空间基本耗尽。相比之下，TPU 在张量计算上的数据复用率远高于通用 GPU。\n\n技术特征：完全自主可控的 IP 核与指令集，不依赖任何国外授权。这一点在信创语境下有独特价值——它比\"兼容 CUDA\"的路线在自主可控叙事上更彻底。\n\n目标定位：杨龚轶凡把公司目标表述为做\"AI 界的 x86\"，计划开放协同、共建 TPU 软硬件标准。\n\n 3.1 TPU 路线在 Agent 场景的结构性优势\n\n这一节对我们业务最有价值，因为它直接关联模块 16 与模块 21 讲的 Agent 消耗机制。\n\n其 CEO 的判断是：超长上下文推理需求爆发，市面上现有算力设备很难高效支撑百万 Token 级上下文窗口。第二代芯片\"须臾\"通过重构脉动阵列的数据流调度，大幅提升 KV Cache 缓存命中率，削减历史上下文的重复计算。\n\n这段话如果属实，指向的正是我们在模块 21 第 1.5 节推导的那个问题——Agent 每轮输入都累积前面所有轮次，总消耗随轮次呈平方增长。KV Cache 命中率的提升，正是针对这个成本结构的硬件级优化。\n\n宣称的收益：第二代相比一代综合性能提升 3 倍（其中架构升级贡献 1.5 倍），百万 Token 性价比提升超过 2 倍，相比传统同等性能芯片功耗降低 50%。\n\n这些是厂商自述数据，无第三方实测佐证，引用时必须标注。\n\n\n\n 四、产品线\n\n 产品  类型  关键参数 \n\n 刹那  第一代 TPU  单芯 204 TFLOPS（FP16），12nm 量产 \n 泰则  千卡集群  支持 1024 片高速互联 \n 须臾  第二代 TPU（2026 年发布）  混合精度浮点 896 TFLOPS，8bit 推理 1792 TOPS，支持百万词元高并发推理 \n\n独创 UE8M0 FP8 格式：宣称单位成本降低 42%、训练成本降低 30%。\n\n\"刹那\"的厂商宣称：能效比国际 GPU 高 30%，性能超英伟达同级产品 1.5 倍，功耗降低 30%，单位成本降低 50%。\"同级产品\"未指明具体型号，这类无参照对象的对比宣称价值有限。\n\n制程：12nm 已量产。注意：对照模块 22，昇腾 950 已用 HBM3e、4TB/s 带宽，而 12nm 是相对成熟的制程。用成熟制程做出高算力，正是 TPU 架构效率优势的体现，但也意味着在制程红利上没有空间。\n\n\n\n 五、大模型适配\n\n通过中国信通院\"DeepSeek 大模型适配测试\"，与华为、寒武纪等共同获得认证，已适配 DeepSeekV3.1 等大模型。\n\n这是本档案中少数有第三方机构背书的事实，可信度较高。\n\n但要注意适配深度的差别：模块 23 记录天数智芯已进入 DeepSeekV4 的适配名单，而中昊芯英公开可查的是 V3.1。版本代差可能反映适配进度差异，但也可能只是公开信息更新不同步，不宜过度解读。\n\nTPU 路线的适配难度需要如实说明：TPU 是专用架构，与 CUDA 生态无兼容关系。这意味着迁移成本显著高于走兼容路线的海光、天数智芯。厂商自述软件生态\"处于初期阶段\"——这是公司自己承认的短板，销售应当如实转述而非回避。\n\n\n\n 六、客户与落地\n\n已披露的客户与项目：\n 初代芯片应用于深圳联通、天津移动、太极股份等机构建设的超大规模智算中心\n 覆盖金融、教育、传媒等行业\n 青海\"丝绸云谷\"9 亿元服务器订单\n 与深圳联通共建智算中心\n 与浙江大学推进 AI 应用\n 有报道提及字节跳动、阿里等企业订单（未见双方确认，存疑）\n\n产能布局：\n 2025 年 5 月 15 日，温岭第一条整线生产线投产\n 绍兴基地：总投资 28 亿元，一期 14.5 亿元，2025 年 6 月开工，2027 年 4 月竣工\n 台州基地：总投资 10 亿元，预计年产值 20 亿元\n\n运营商与地方国资项目是其主力客户结构，这在国产芯片厂商中很典型——也意味着营收质量高度依赖政府与国企采购节奏。\n\n\n\n 七、政策支持\n\n这是中昊芯英相对天数智芯明显更强的一项：\n\n2024 年\"中国芯\"最高奖；2024 年度\"年大重大创新突破产品\"；2024 德勤中国高科技高成长 50 强榜首；人社部\"最具成长潜力\"留学人员创业企业；国家级专精特新\"小巨人\"企业；2025 硬核芯生态大会唯一\"年度创业团队奖\"。\n\n国家级专精特新\"小巨人\"是其中含金量最高的一项，它对应实质性的政策资源与地方配套。在服务信创客户时，这类资质是可以引用的加分项。\n\n\n\n 八、资本路径：一条充满不确定性的曲线\n\n这一节请仔细读，它是本档案的核心风险所在。\n\n融资与估值：2025 年 6 月完成 C 轮融资，估值 40 亿元（另有报道称约 44 亿元）。股东包括科德教育持股 6.21%、艾布鲁子公司持股 9.73%。\n\n对赌压力：需在 2026 年 12 月 31 日前完成合格 IPO 或借壳上市。若 2024–2025 两年净利润合计低于 2 亿元，需 17.31 亿元回购；已有投资人豁免其中 10.68 亿元。\n\n曲线上市路径：创始人杨龚轶凡入主 A 股上市公司天普股份（宁波天普橡胶，汽车橡胶管路企业，2024 年营收 3.42 亿元、净利 0.33 亿元）。\n\n交易经过：2025 年 8 月 15 日天普股份停牌，8 月 21 日发布重组公告，8 月 22 日复牌涨停；2025 年 12 月 24 日易主三步全部完成，中昊芯英及一致行动人合计持股约 68.29%，杨龚轶凡成为实际控制人；12 月 29 日完成董事会换届。\n\n 8.1 这里有一个必须正视的矛盾\n\n天普股份 2025 年股价从 12.59 元涨到 218.02 元，累计涨幅 1631.69%，位居 A 股第二。 随后收到监管函（涉嫌信息披露违规），四个月内经历五次停牌核查。\n\n而中昊芯英方面多次公开承诺：没有在未来 12 个月内改变上市公司主营业务的计划、没有出售合并等明确计划，且声称\"无开展人工智能相关业务的计划\"。\n\n市场普遍视之为借壳上市，公司却持续否认——这个矛盾本身就是最大的风险信号。\n\n两种解读都成立：一种是确实暂无注入计划，控制权收购另有考虑；另一种是受限于借壳的监管审查与时间窗口，暂不便表态。无论哪种，结论都一样：中昊芯英的上市路径在 2026 年底前存在实质不确定性，而对赌条款的时限恰好压在同一时点。\n\n\n\n 九、⚠️ 数据可信度警示：必读\n\n关于中昊芯英，网络上流传着一批严重失实或内部矛盾的数据，如果照单全收会做出错误判断。\n\n 9.1 估值的巨大落差\n\n有面向散户的财经自媒体给出\"保守估计 500 亿元、初上市 1000 亿元、长期乐观 3000 亿元以上\"的市值预期。\n\n而其 2025 年 6 月 C 轮的实际估值是 40 亿元（另有报道称 44 亿元）。\n\n这中间是十倍到七十倍的差距。 那类预期是二级市场情绪推演，不是公司估值，不得引用。\n\n 9.2 财务数据内部矛盾\n\n同一批自媒体给出的财务数据如下，请注意它们无法自洽：\n\n 期间  流传的营收  流传的净利润 \n\n 2023  4.85 亿元  8133 万元 \n 2024  5.98 亿元  8591 万元 \n 2025 H1  1.02 亿元  −1.44 亿元 \n 2025 全年\"预期\"  20 亿元  4.5 亿元 \n\n三处硬伤：\n\n其一，2024 年营收 5.98 亿、净利 8591 万的公司，不可能在 2025 年 6 月只融到 40 亿估值——那相当于约 7 倍 PS、47 倍 PE，远低于当前国产芯片一级市场水平（对照天数智芯 IPO 前 120 亿估值对应 2024 年 5.40 亿营收，约 22 倍 PS）。\n\n其二，2025 上半年营收 1.02 亿、亏损 1.44 亿，却预期全年 20 亿营收、4.5 亿净利——下半年要做出 19 亿营收和近 6 亿利润，不具备现实性。\n\n其三，同一篇材料称\"近三年收入增长率达 3534%\"，与 4.85 亿 → 5.98 亿（约 23% 增长）直接冲突。\n\n处理方式：本模块不采信上述任何一组财务数字。 中昊芯英未上市、无审计披露义务，其真实经营状况目前无法从公开渠道核实。这与天数智芯（招股书经审计、数据可核验）形成鲜明对比。\n\n 9.3 与模块 20 的一处关联提醒\n\n模块 20 那份待证实材料曾给出\"国产卡生态没问题\"的乐观判断，模块 22 已指出其与行业调研冲突。中昊芯英自述\"软件生态处于初期阶段\"，恰好从厂商侧印证了模块 22 的判断——生态差距是真实的。\n\n\n\n 十、风险评估\n\n资本路径不确定：对赌时限 2026 年底，借壳预期与公司否认之间存在矛盾，标的公司已收监管函。这是最需要盯的一项。\n\n财务不透明：无审计披露，流传数据不可信。\n\n生态最薄弱：TPU 专用架构与 CUDA 无兼容关系，迁移成本显著高于海光、天数智芯，公司自述生态处于初期。\n\n万卡规模未验证：泰则集群标称支持 1024 片互联，但对照模块 22——超节点能力是国产阵营差距最大的环节，华为是国内唯一具备千卡级稳定交付能力的厂商。中昊芯英的千卡能力需要实际项目验证。\n\n客户集中于运营商与地方国资：营收质量依赖政府采购节奏。\n\n技术叙事强、商业验证弱：创始人背景与架构选择的说服力，明显强于可核验的经营数据。\n\n\n\n 十一、对我们意味着什么\n\n第一，TPU 的长上下文优势值得持续关注，但现在不是下注的时候。\n\n如果\"提升 KV Cache 命中率、削减历史上下文重复计算\"的能力被实测验证，它针对的正是我们在模块 21 第 1.5 节推导出的 Agent 成本结构——这是硬件层面对我们最相关的一条技术进展。Agent 是我们判断中 token 消耗最猛的场景（模块 16），能从根子上降低这块成本的架构，长期看会改变推理成本曲线。\n\n但目前全部是厂商自述，没有第三方实测。建议列入观察，不作为任何方案的依据。\n\n第二，它在「信创合规通道」机会中的位置：政策资质强，但落地可核验性弱。\n\n国家级专精特新\"小巨人\"、完全自主 IP 核与指令集、无国外授权依赖——这套自主可控叙事在政务、金融客户面前是有说服力的。加上信通院 DeepSeek 适配认证，是可以引用的第三方背书。\n\n但：我们要做的是\"跑在国产算力上的 API 通道\"（模块 22 第 6.3 节），需要的是能对外提供 API 服务的上游。中昊芯英的客户是运营商与地方智算中心——真正该摸排的是深圳联通、天津移动这类基于其芯片建设的智算中心，是否对外提供 API 及能否出具书面说明。\n\n第三，把它当作判断 TPU 路线是否可行的观察窗口。\n\nTPU vs GPGPU 是国产算力最重要的路线分歧之一。中昊芯英基本是国内 TPU 路线的唯一样本——它成了，说明专用架构在中国走得通；它没成，说明生态成本终究压倒了架构效率。这个结论会影响我们未来两三年对上游结构的判断。\n\n第四，2026 年 12 月 31 日是必须标记的日期。\n\n对赌时限与上市窗口重合。如果客户方案里涉及中昊芯英的芯片，建议在商务条款中考虑供应商持续性风险——这不是唱衰，是尽职。模块 22 已定纪律：芯片厂商的经营风险最终会传导为客户的服务连续性风险。\n\n销售纪律（三条，与模块 22 第 6.5 节一致）：\n\n不引用 500 亿/1000 亿/3000 亿这类市值预期；不引用第九节列出的任何财务数字；性能参数一律标注\"厂商标称，无第三方实测\"。\n\n可以放心引用的只有四项：创始人的谷歌 TPU 2/3/4 背景、信通院 DeepSeek 适配认证、国家级专精特新\"小巨人\"资质、以及深圳联通/天津移动/太极股份的落地案例。这四项都有第三方可核验来源。\n\n\n\n 数据来源\n\n [解读中昊芯英——国内 TPU 架构 AI 芯片的领军企业  东方财富财富号](https://caifuhao.eastmoney.com/news/1606283642)（公司沿革、团队、产品参数、政策奖项。⚠️ 该文财务数据与市值预期不可采信，见第九节）\n [中昊芯英：直击智能体算力成本痛点，探索国产 TPU 无人区  网易](https://www.163.com/dy/article/L16616VD053469RG.html)（须臾参数、长上下文优势、客户案例、CEO 判断）\n [中昊芯英创始人拟入主天普股份  中国基金报](https://www.chnfund.com/article/ARb135c98e51c629ea5dd33a1be325e3aa)（交易结构、C 轮估值 40 亿、股东）\n [暴涨 1631% 牛股天普股份涉违规收监管函，业绩双降受中昊芯英\"借壳\"传闻袭扰  腾讯新闻](https://news.qq.com/rain/a/20260105A027LB00)（监管函、股价、公司否认表态、易主完成情况）\n [中昊芯英 CEO 杨龚轶凡：第二代 TPU 芯片计划 2026 年正式推向市场  新浪科技](https://finance.sina.com.cn/tech/digi/20251230/docinheqixn9579388.shtml)\n 内部交叉引用：模块 16 与 21（Agent 消耗机制，TPU 优化的针对性）、模块 22（国产算力大盘、超节点差距、信创机会、销售纪律）、模块 23（天数智芯对照）\n\n 本模块信息来源以媒体报道为主，公司未上市、无审计披露。所有性能与财务数据均不得作为对客承诺，引用前请核对第九节的可信度警示。\n"}, {"id": "25-Token工厂可行性与起步路径", "code": "25", "title": "模块 25 · Token 工厂可行性与起步路径", "short": "Token 工厂可行性与起步路径", "subs": ["一、什么是 Token 工厂，它和我们现在做的有什么本质区别", "二、看起来成立的那个逻辑", "三、行业标杆的真实处境：一个残酷的对照", "四、从公开数据推导出的关键结论", "五、价格战仍在进行时（并修正我们此前的一个判断）", "六、还有两条长期威胁", "七、结论与可行的切口", "八、分阶段起步路径", "九、观察指标：什么会改变这个结论", "十、本模块触发的修正", "数据来源"], "html": "<h1>模块 25 · Token 工厂可行性与起步路径</h1>\n<blockquote>\n<p>本模块解决的问题：我们要不要自建推理产能？如果要，从几个客户、多大负载开始？\n使用者：决策层（这是一个需要明确表态的重大决策）、财务、售前。\n数据采集日：2026-07-27。\n⚠️ <strong>本模块的结论是\"现阶段不做公有云 Token 工厂\"，理由见第三节。请完整读完再决策。</strong></p>\n</blockquote>\n<hr />\n<h2>一、什么是 Token 工厂，它和我们现在做的有什么本质区别</h2>\n<p>\"Token 工厂\"已经是行业通用叫法，指<strong>自己持有或租用算力、部署模型、把 token 作为商品生产并对外销售</strong>的服务商。行业里对这个角色的自我定位很准确：不做模型，也不做应用，<strong>把异构算力、多模型和企业调用需求，封装成可稳定交付、可计量、可收费的 Token 供应服务。</strong></p>\n<p><strong>它与我们现在四条业务线的区别，一句话概括：从贸易变成制造。</strong></p>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>我们现在（转售/聚合）</th>\n<th>Token 工厂（自建产能）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>固定成本</td>\n<td><strong>接近零</strong></td>\n<td><strong>极高</strong>（卡、机房、电力、运维）</td>\n</tr>\n<tr>\n<td>边际成本</td>\n<td>高（等于上游采购价）</td>\n<td>低（主要是电）</td>\n</tr>\n<tr>\n<td>毛利结构</td>\n<td>薄但稳定（10%–25%）</td>\n<td><strong>利用率决定生死</strong></td>\n</tr>\n<tr>\n<td>主要风险</td>\n<td>上游政策、脱媒</td>\n<td><strong>现金流、利用率崩塌</strong></td>\n</tr>\n<tr>\n<td>失败方式</td>\n<td>慢慢被挤掉</td>\n<td><strong>可能一次性拖垮公司</strong></td>\n</tr>\n<tr>\n<td>能力要求</td>\n<td>商务 + 网关工程</td>\n<td><strong>推理优化、集群运维、供应链</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>这不是业务延伸，是换一门生意做。</strong> 决策层必须清楚：它需要的资本结构、技术能力、组织形态，跟我们现在做的完全不同。</p>\n<hr />\n<h2>二、看起来成立的那个逻辑</h2>\n<p>先把支持做这件事的论证讲完整，因为它确实有道理。</p>\n<p>模块 21 第三节给出过一个关键数字：<strong>自建比调 API 便宜的利用率临界点约 52%</strong>。而现实是：</p>\n<ul>\n<li>单个企业客户的 GPU 利用率只有 <strong>30%–50%</strong>——因为业务有波峰波谷，为峰值买的卡在低谷空转</li>\n<li>API 厂商的集群利用率在 <strong>90% 以上</strong>——因为<strong>聚合了成千上万客户的波峰波谷，互相填平</strong></li>\n</ul>\n<p><strong>于是很自然会推出一个结论</strong>：单个企业自建不划算，是因为它填不平波谷；而我们如果有足够多的客户，就能像 API 厂商一样把利用率做到 90%——<strong>那我们不就应该自己造 token 吗？</strong></p>\n<p><strong>这个逻辑本身没错，但它漏掉了三件事</strong>：这个行业当前的实际毛利水平、价格战的进行时状态、以及我们自身的能力缺口。下面用数据说清楚。</p>\n<hr />\n<h2>三、行业标杆的真实处境：一个残酷的对照</h2>\n<p><strong>硅基流动是中国最成功的独立 Token 工厂</strong>——中国第四大词元供应平台、独立平台第一、市场份额 1.5%、支持超 170 个模型、服务 13000+ 企业客户、注册用户从 2024 年底 12.7 万涨到 2026 年 4 月的 <strong>1028 万</strong>、日均词元吞吐量 <strong>5785 亿</strong>。</p>\n<p><strong>它的招股书数据如下：</strong></p>\n<table>\n<thead>\n<tr>\n<th>指标</th>\n<th>2024</th>\n<th>2025</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>收入</td>\n<td>734.6 万元</td>\n<td><strong>5533.0 万元</strong>（+653.2%）</td>\n</tr>\n<tr>\n<td>毛利率</td>\n<td>+39.4%</td>\n<td><strong>−24.0%</strong></td>\n</tr>\n<tr>\n<td>年内亏损</td>\n<td>8191.5 万元</td>\n<td><strong>3.45 亿元</strong>（增 4.2 倍）</td>\n</tr>\n<tr>\n<td>经调整净亏损</td>\n<td>—</td>\n<td>1.87 亿元</td>\n</tr>\n<tr>\n<td>销售成本</td>\n<td>445.2 万元</td>\n<td>6863.2 万元（<strong>增约 15 倍</strong>）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>月均现金消耗率 1480 万元。</strong></p>\n<p><strong>其中最关键的一个数字：公有云服务毛利率 −119.0%。</strong></p>\n<p><strong>读懂这个数字</strong>：每收 1 元钱，成本是 2.19 元。<strong>收入越多，亏得越多。</strong> 这不是\"还没到规模效应\"，这是<strong>在当前价格水平下，公有云 token 池的单位经济模型是负的</strong>。</p>\n<p><strong>一个做到 1028 万用户、13000 家企业客户、日均近 6000 亿 token 的公司，公有云业务仍然是每赚一元亏一元一毛九。</strong> 我们现在连它的百分之一都没有。</p>\n<p><strong>这就是对第二节那个\"聚合利用率\"逻辑最直接的回答：利用率不是唯一变量，售价也是。</strong> 当售价被价格战压到成本线以下时，再高的利用率也救不回来。</p>\n<hr />\n<h2>四、从公开数据推导出的关键结论</h2>\n<p><strong>这一节是本模块最有价值的部分，也是最反常识的。</strong></p>\n<p>硅基流动披露了三个数字：整体收入 5533.0 万、整体毛利率 −24.0%、公有云收入 2926.1 万（占 52.9%）、公有云毛利率 −119.0%。本地部署收入 2606.9 万（占 47.1%）。</p>\n<p><strong>用这几个数字可以反推出它没有单独披露的那一项：</strong></p>\n<pre><code>整体毛利   = 5533.0 × (−24.0%)  = −1327.9 万元\n公有云毛利 = 2926.1 × (−119.0%) = −3482.1 万元\n本地部署毛利 = −1327.9 − (−3482.1) = +2154.1 万元\n本地部署收入 = 5533.0 − 2926.1 = 2606.9 万元\n\n→ 本地部署毛利率 ≈ +82.6%\n</code></pre>\n<p><strong>同一家公司，同一年：公有云 token 池毛利率 −119%，本地部署毛利率 +83%。</strong></p>\n<p><strong>这个反差是本模块的核心结论：</strong></p>\n<p><strong>公有云 token 是标准品，在打价格战，毛利为负。</strong>\n<strong>本地部署是解决方案，有交付门槛，毛利率超过 80%。</strong></p>\n<p><strong>它把整个战略问题的答案直接摆出来了：如果我们要碰\"生产\"这件事，该做的是本地部署与私有化交付，不是公有云 token 池。</strong></p>\n<blockquote>\n<p><strong>推算说明</strong>：以上为本模块基于公开披露数据的推导，<strong>非该公司直接披露</strong>。前提是两项业务的毛利率口径一致且无其他收入。方向性结论可靠，具体数值仅供参考。</p>\n</blockquote>\n<p><strong>这个结论与模块 18、模块 20 的判断完全一致，且是第三次独立印证</strong>：</p>\n<p>模块 18 说标准品环节的毛利在被系统性挤压；模块 20 记录上游明确以\"让独立部署的第三方无利可图\"为定价目标；<strong>现在硅基流动的招股书用真金白银证明了——在公有云 token 这个标准品战场上，独立第三方确实无利可图。</strong></p>\n<hr />\n<h2>五、价格战仍在进行时（并修正我们此前的一个判断）</h2>\n<p><strong>必须修正模块 00 基本认知第一条与模块 18 第 3.1 节的表述。</strong></p>\n<p>我们此前根据智谱 API 定价提升 83% 的公开数据，判断\"2026 年行业从价格战转入价值战，进入涨价周期\"。</p>\n<p><strong>这个判断过于绝对。同期的另一组数据是</strong>：自 2023 年起 API 累计降价十余次，部分模型累计降幅超 90%；<strong>DeepSeek V4-Pro 降价 75% 至 6 元/百万 Token，小米、腾讯随后跟进，降幅达 97.5%–99%。</strong></p>\n<p><strong>准确的表述应该是：市场出现分化，不是单向涨价。</strong></p>\n<p><strong>走价值战的</strong>（如智谱）：提价，靠能力与场景溢价，接受更小的量。\n<strong>走规模战的</strong>（如 DeepSeek 系及跟进者）：继续降价，靠成本领先与体量。</p>\n<p><strong>这两条路线同时存在，且都理性。</strong> 对我们的实际含义是：</p>\n<p><strong>做 Token 工厂就是选择进入规模战那一侧的战场，而那一侧的对手是有自有芯片、自有电力、极致工程优化能力的巨头</strong>（模块 18 第 3.1 节的判断在此得到印证）。</p>\n<hr />\n<h2>六、还有两条长期威胁</h2>\n<p><strong>端侧分流。</strong> 行业预测未来 <strong>30%–50% 的推理需求将在端侧完成</strong>（AI PC、AI 手机，对照模块 18 第 2.4 节记录的 3000 万台年出货预期）。这直接收窄云端 Token 工厂的增长天花板——<strong>而重资产投入是按云端需求持续增长做的假设。</strong></p>\n<p><strong>三重挤压。</strong> 行业总结的核心矛盾是\"效率提升速度跟不上价格下降速度\"，来自三个方向：大厂下场、头部客户自建集群、端侧 AI 普及。<strong>注意第二项正是模块 19 收录 001 识别的\"自建推理替代 API 采购\"风险——它同时打击我们的转售业务和潜在的 Token 工厂业务。</strong></p>\n<p>有投资人对这个赛道的判断是存在\"一定泡沫迹象\"，部分企业为追求规模盲目扩张。<strong>行业融资很热（硅基流动超 20 亿元 B 轮、无问芯穹累计超 22 亿元），但融资额与盈利能力是两回事。</strong></p>\n<hr />\n<h2>七、结论与可行的切口</h2>\n<h3>7.1 现阶段的明确结论</h3>\n<p><strong>不做公有云 Token 工厂。</strong> 理由已充分：</p>\n<p>行业标杆的公有云毛利率是 <strong>−119%</strong>，规模越大亏越多；价格战仍在进行（跟进降幅达 97.5%–99%）；上游以\"让第三方无利可图\"为定价目标；我们没有规模、没有资本、没有推理优化的技术积累；端侧分流长期收窄天花板。</p>\n<p><strong>这条路上，我们没有任何一项能赢的要素。</strong></p>\n<h3>7.2 真正可行的切口：本地部署与私有化交付</h3>\n<p><strong>如果要碰\"生产\"，只应从这里切。</strong> 依据就是第四节推导的那组数字——同一家公司，本地部署毛利率 +83%。</p>\n<p><strong>为什么本地部署的毛利能撑住？</strong> 因为它不是标准品：</p>\n<p>它有交付门槛（部署、调优、验收、运维），有场景绑定（客户的数据、流程、合规要求），<strong>不能简单比价</strong>——客户买的不是 token，是一套跑得起来的系统。<strong>这正好回到模块 02 的核心论点：标准品比价格，非标品比能力。</strong></p>\n<p><strong>而且它与我们已有的两条线天然衔接</strong>：模块 22 识别的<strong>信创合规通道</strong>机会（政务、金融、国企要国产化又建不起来），本质上就是本地部署交付；模块 02 重新定位后的<strong>场景化解决方案</strong>线（让客户自建的系统跑得更省更稳），也落在同一个位置。</p>\n<p><strong>换句话说：我们不需要新开一条业务线，我们需要把已有的解决方案线往\"交付能力\"方向做深。</strong></p>\n<h3>7.3 三条不该碰的红线</h3>\n<p><strong>不为了压低采购成本而自建。</strong> 上游的定价目标就是让这件事不划算（模块 20），而且我们的规模远达不到成本优势。</p>\n<p><strong>不先买产能再找客户。</strong> 这是重资产业务最经典的死法——<strong>先有确定的基础负载，再有产能，顺序绝不能反。</strong></p>\n<p><strong>不进入公有云 token 的价格战。</strong> 那是有自有芯片和电力的玩家的战场。</p>\n<hr />\n<h2>八、分阶段起步路径</h2>\n<p><strong>回答\"多少客户的时候怎么做\"这个问题，关键指标不是客户数，是「可预测的基础负载」。</strong></p>\n<p>原因很直接：<strong>利用率决定一切</strong>（模块 21 第 3.1 节）。一百个用量飘忽的客户，不如三个负载稳定的客户更适合支撑自建产能。<strong>所以下面每个阶段的触发条件，都以\"稳定基础负载\"为准，客户数只是参考。</strong></p>\n<h3>阶段 0 · 当前：纯转售，零固定成本</h3>\n<p><strong>做什么</strong>：维持现状，把模块 21 的测算能力、模块 22 的信创摸排做扎实。</p>\n<p><strong>这个阶段最重要的事，是积累判断下一阶段的数据</strong>：哪些客户的负载是稳定可预测的、他们的波峰波谷形态、私有化需求的真实频次。<strong>没有这些数据，任何自建决策都是拍脑袋。</strong></p>\n<p><strong>退出条件</strong>：出现两个及以上愿意为私有化/独占实例付费的客户，且需求可验证。</p>\n<h3>阶段 1 · 试水：租算力，不买卡</h3>\n<p><strong>触发条件</strong>：<strong>1–2 个确定的私有化交付订单</strong>，客户已签约或付定金。</p>\n<p><strong>做什么</strong>：<strong>租用算力</strong>而非采购，为特定客户交付私有化实例。目标不是赚钱，是<strong>验证三件事</strong>：我们的推理部署与调优能力够不够、交付周期与人力投入的真实数字、客户愿意为\"托管 + 调优 + 运维\"付多少溢价。</p>\n<p><strong>投入</strong>：轻。租用算力按月付，可随时退出。</p>\n<p><strong>为什么必须先租不买</strong>：模块 22 记录国产 8 卡服务器 2026 年标价约 200 万元/台且在涨价，<strong>在能力未验证前投入重资产是不可接受的风险</strong>。租用的溢价，买的是\"随时能退出\"这个期权。</p>\n<p><strong>失败信号</strong>：交付周期远超预期、人力投入吃掉全部毛利、客户不认可溢价。<strong>出现任一条即停在阶段 0。</strong></p>\n<h3>阶段 2 · 小规模自建：有基础负载才买卡</h3>\n<p><strong>触发条件（三条必须同时满足）</strong>：</p>\n<p><strong>其一，稳定基础负载能撑住 60% 以上利用率。</strong> 注意是 60% 不是 52%——模块 21 给的 52% 是盈亏平衡点，<strong>平衡点不是决策点</strong>，要留安全边际。</p>\n<p><strong>其二，负载来自签约客户的合同承诺，不是销售预测。</strong> 预测会落空，合同不会。</p>\n<p><strong>其三，阶段 1 已验证我们的交付能力，且毛利为正。</strong></p>\n<p><strong>做什么</strong>：按<strong>已签约负载</strong>采购最小规模产能，<strong>不留富余</strong>。缺口继续用租用或转售补。</p>\n<p><strong>测算方法</strong>：用模块 21 第 3.3 节的公式，把模块 22 的 200 万元/台作为硬件锚。</p>\n<pre><code>盈亏平衡月消耗量 Q* = 自建月固定成本 ÷ API 单价\n</code></pre>\n<p><strong>月固定成本必须包含全部八项</strong>（模块 21 第 3.2 节）：硬件折旧、电力、带宽、机房、<strong>运维人力</strong>、模型迭代跟进、峰值冗余、资金占用。<strong>其中运维人力最常被漏掉，而它常是最大项之一。</strong></p>\n<p><strong>风险控制</strong>：单笔自建投入不得超过模块 04 第四节规定的资金上限；采购合同中争取残值回购或租转售条款。</p>\n<h3>阶段 3 · 规模化：只在阶段 2 持续盈利后考虑</h3>\n<p><strong>触发条件</strong>：阶段 2 连续两个季度贡献毛利为正，且利用率稳定在 70% 以上，且有排队等待的私有化需求。</p>\n<p><strong>在此之前不讨论规模化。</strong></p>\n<h3>阶段门槛速查</h3>\n<table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>触发条件</th>\n<th>资产形态</th>\n<th>可退出性</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0 · 转售</td>\n<td>—</td>\n<td>零固定成本</td>\n<td>完全</td>\n</tr>\n<tr>\n<td>1 · 试水</td>\n<td>1–2 个签约私有化订单</td>\n<td><strong>租用</strong></td>\n<td>高（按月退租）</td>\n</tr>\n<tr>\n<td>2 · 小规模自建</td>\n<td>签约负载撑住 60% 利用率 + 阶段 1 毛利为正</td>\n<td>采购，最小规模</td>\n<td>低</td>\n</tr>\n<tr>\n<td>3 · 规模化</td>\n<td>阶段 2 连续两季盈利 + 利用率 70%+</td>\n<td>采购，扩张</td>\n<td>极低</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>九、观察指标：什么会改变这个结论</h2>\n<p><strong>本模块的结论是基于 2026 年中的价格与成本环境，它不是永久的。</strong> 以下三项发生实质变化时，应重新评估：</p>\n<p><strong>公有云 token 的行业毛利率转正。</strong> 当前标杆是 −119%。这是最直接的指标——<strong>行业不再流血，说明价格战结束了。</strong></p>\n<p><strong>硬件成本转向。</strong> 模块 22 的观察指标：国产先进制程良率是否突破 60%（规模化分水岭）、8 卡服务器标价是否掉头。硬件降价会降低自建的固定成本门槛。</p>\n<p><strong>我们自己的私有化交付订单频次。</strong> 如果一个季度内出现三个以上私有化需求且我们因产能不足而错失，<strong>说明市场在推着我们往前走，此时才值得重新算这笔账。</strong></p>\n<hr />\n<h2>十、本模块触发的修正</h2>\n<table>\n<thead>\n<tr>\n<th>模块</th>\n<th>修正内容</th>\n<th>状态</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>00 · 基本认知第一条</td>\n<td>「2026 进入涨价周期」→ <strong>「市场分化：部分厂商涨价走价值战，部分继续降价走规模战」</strong></td>\n<td>已修正</td>\n</tr>\n<tr>\n<td>18 · 3.1</td>\n<td>同上，补充 DeepSeek V4-Pro 降价 75%、跟进降幅 97.5%–99% 的反向证据</td>\n<td>已修正</td>\n</tr>\n<tr>\n<td>02 · 业务线</td>\n<td>新增指针：Token 工厂作为候选第五条线，结论为现阶段不做公有云、可从本地部署切入</td>\n<td>已修正</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://www.qbitai.com/2026/07/441127.html\">卖 Token 也不是稳赚不赔！硅基流动招股书来了 - 量子位</a>（营收、毛利率、亏损、公有云 −119%、用户与吞吐数据）</li>\n<li><a href=\"https://www.163.com/dy/article/KVNNCGJ60512B07B.html\">疯狂扩产的「Token 工厂」：营收数十倍增长上演资本狂欢，API 价格战、端侧分流双重夹击 - 网易</a>（行业玩家、价格战数据、端侧分流、三重挤压、泡沫判断）</li>\n<li><a href=\"https://www.bjnews.com.cn/detail/1784285027129411.html\">Token 工厂站上资本风口，\"AI 卖铲人\"盈利待考 - 新京报</a></li>\n<li><a href=\"https://www.36kr.com/p/3855461124389767\">硅基流动完成新一轮超 20 亿元融资 - 36氪</a></li>\n<li>内部交叉引用：模块 02（标准品 vs 非标品）、模块 04（资金上限）、模块 18（标准品毛利被挤压）、模块 20（上游定价目标）、模块 21（利用率与盈亏平衡公式）、模块 22（硬件价格锚、信创机会）</li>\n</ul>\n<blockquote>\n<p>第四节的本地部署毛利率为<strong>本模块推算</strong>，非直接披露，引用时须注明。</p>\n</blockquote>", "plain": " 模块 25 · Token 工厂可行性与起步路径\n\n 本模块解决的问题：我们要不要自建推理产能？如果要，从几个客户、多大负载开始？\n 使用者：决策层（这是一个需要明确表态的重大决策）、财务、售前。\n 数据采集日：20260727。\n ⚠️ 本模块的结论是\"现阶段不做公有云 Token 工厂\"，理由见第三节。请完整读完再决策。\n\n\n\n 一、什么是 Token 工厂，它和我们现在做的有什么本质区别\n\n\"Token 工厂\"已经是行业通用叫法，指自己持有或租用算力、部署模型、把 token 作为商品生产并对外销售的服务商。行业里对这个角色的自我定位很准确：不做模型，也不做应用，把异构算力、多模型和企业调用需求，封装成可稳定交付、可计量、可收费的 Token 供应服务。\n\n它与我们现在四条业务线的区别，一句话概括：从贸易变成制造。\n\n 维度  我们现在（转售/聚合）  Token 工厂（自建产能） \n\n 固定成本  接近零  极高（卡、机房、电力、运维） \n 边际成本  高（等于上游采购价）  低（主要是电） \n 毛利结构  薄但稳定（10%–25%）  利用率决定生死 \n 主要风险  上游政策、脱媒  现金流、利用率崩塌 \n 失败方式  慢慢被挤掉  可能一次性拖垮公司 \n 能力要求  商务 + 网关工程  推理优化、集群运维、供应链 \n\n这不是业务延伸，是换一门生意做。 决策层必须清楚：它需要的资本结构、技术能力、组织形态，跟我们现在做的完全不同。\n\n\n\n 二、看起来成立的那个逻辑\n\n先把支持做这件事的论证讲完整，因为它确实有道理。\n\n模块 21 第三节给出过一个关键数字：自建比调 API 便宜的利用率临界点约 52%。而现实是：\n\n 单个企业客户的 GPU 利用率只有 30%–50%——因为业务有波峰波谷，为峰值买的卡在低谷空转\n API 厂商的集群利用率在 90% 以上——因为聚合了成千上万客户的波峰波谷，互相填平\n\n于是很自然会推出一个结论：单个企业自建不划算，是因为它填不平波谷；而我们如果有足够多的客户，就能像 API 厂商一样把利用率做到 90%——那我们不就应该自己造 token 吗？\n\n这个逻辑本身没错，但它漏掉了三件事：这个行业当前的实际毛利水平、价格战的进行时状态、以及我们自身的能力缺口。下面用数据说清楚。\n\n\n\n 三、行业标杆的真实处境：一个残酷的对照\n\n硅基流动是中国最成功的独立 Token 工厂——中国第四大词元供应平台、独立平台第一、市场份额 1.5%、支持超 170 个模型、服务 13000+ 企业客户、注册用户从 2024 年底 12.7 万涨到 2026 年 4 月的 1028 万、日均词元吞吐量 5785 亿。\n\n它的招股书数据如下：\n\n 指标  2024  2025 \n\n 收入  734.6 万元  5533.0 万元（+653.2%） \n 毛利率  +39.4%  −24.0% \n 年内亏损  8191.5 万元  3.45 亿元（增 4.2 倍） \n 经调整净亏损  —  1.87 亿元 \n 销售成本  445.2 万元  6863.2 万元（增约 15 倍） \n\n月均现金消耗率 1480 万元。\n\n其中最关键的一个数字：公有云服务毛利率 −119.0%。\n\n读懂这个数字：每收 1 元钱，成本是 2.19 元。收入越多，亏得越多。 这不是\"还没到规模效应\"，这是在当前价格水平下，公有云 token 池的单位经济模型是负的。\n\n一个做到 1028 万用户、13000 家企业客户、日均近 6000 亿 token 的公司，公有云业务仍然是每赚一元亏一元一毛九。 我们现在连它的百分之一都没有。\n\n这就是对第二节那个\"聚合利用率\"逻辑最直接的回答：利用率不是唯一变量，售价也是。 当售价被价格战压到成本线以下时，再高的利用率也救不回来。\n\n\n\n 四、从公开数据推导出的关键结论\n\n这一节是本模块最有价值的部分，也是最反常识的。\n\n硅基流动披露了三个数字：整体收入 5533.0 万、整体毛利率 −24.0%、公有云收入 2926.1 万（占 52.9%）、公有云毛利率 −119.0%。本地部署收入 2606.9 万（占 47.1%）。\n\n用这几个数字可以反推出它没有单独披露的那一项：\n\n\n整体毛利   = 5533.0 × (−24.0%)  = −1327.9 万元\n公有云毛利 = 2926.1 × (−119.0%) = −3482.1 万元\n本地部署毛利 = −1327.9 − (−3482.1) = +2154.1 万元\n本地部署收入 = 5533.0 − 2926.1 = 2606.9 万元\n\n→ 本地部署毛利率 ≈ +82.6%\n\n\n同一家公司，同一年：公有云 token 池毛利率 −119%，本地部署毛利率 +83%。\n\n这个反差是本模块的核心结论：\n\n公有云 token 是标准品，在打价格战，毛利为负。\n本地部署是解决方案，有交付门槛，毛利率超过 80%。\n\n它把整个战略问题的答案直接摆出来了：如果我们要碰\"生产\"这件事，该做的是本地部署与私有化交付，不是公有云 token 池。\n\n 推算说明：以上为本模块基于公开披露数据的推导，非该公司直接披露。前提是两项业务的毛利率口径一致且无其他收入。方向性结论可靠，具体数值仅供参考。\n\n这个结论与模块 18、模块 20 的判断完全一致，且是第三次独立印证：\n\n模块 18 说标准品环节的毛利在被系统性挤压；模块 20 记录上游明确以\"让独立部署的第三方无利可图\"为定价目标；现在硅基流动的招股书用真金白银证明了——在公有云 token 这个标准品战场上，独立第三方确实无利可图。\n\n\n\n 五、价格战仍在进行时（并修正我们此前的一个判断）\n\n必须修正模块 00 基本认知第一条与模块 18 第 3.1 节的表述。\n\n我们此前根据智谱 API 定价提升 83% 的公开数据，判断\"2026 年行业从价格战转入价值战，进入涨价周期\"。\n\n这个判断过于绝对。同期的另一组数据是：自 2023 年起 API 累计降价十余次，部分模型累计降幅超 90%；DeepSeek V4Pro 降价 75% 至 6 元/百万 Token，小米、腾讯随后跟进，降幅达 97.5%–99%。\n\n准确的表述应该是：市场出现分化，不是单向涨价。\n\n走价值战的（如智谱）：提价，靠能力与场景溢价，接受更小的量。\n走规模战的（如 DeepSeek 系及跟进者）：继续降价，靠成本领先与体量。\n\n这两条路线同时存在，且都理性。 对我们的实际含义是：\n\n做 Token 工厂就是选择进入规模战那一侧的战场，而那一侧的对手是有自有芯片、自有电力、极致工程优化能力的巨头（模块 18 第 3.1 节的判断在此得到印证）。\n\n\n\n 六、还有两条长期威胁\n\n端侧分流。 行业预测未来 30%–50% 的推理需求将在端侧完成（AI PC、AI 手机，对照模块 18 第 2.4 节记录的 3000 万台年出货预期）。这直接收窄云端 Token 工厂的增长天花板——而重资产投入是按云端需求持续增长做的假设。\n\n三重挤压。 行业总结的核心矛盾是\"效率提升速度跟不上价格下降速度\"，来自三个方向：大厂下场、头部客户自建集群、端侧 AI 普及。注意第二项正是模块 19 收录 001 识别的\"自建推理替代 API 采购\"风险——它同时打击我们的转售业务和潜在的 Token 工厂业务。\n\n有投资人对这个赛道的判断是存在\"一定泡沫迹象\"，部分企业为追求规模盲目扩张。行业融资很热（硅基流动超 20 亿元 B 轮、无问芯穹累计超 22 亿元），但融资额与盈利能力是两回事。\n\n\n\n 七、结论与可行的切口\n\n 7.1 现阶段的明确结论\n\n不做公有云 Token 工厂。 理由已充分：\n\n行业标杆的公有云毛利率是 −119%，规模越大亏越多；价格战仍在进行（跟进降幅达 97.5%–99%）；上游以\"让第三方无利可图\"为定价目标；我们没有规模、没有资本、没有推理优化的技术积累；端侧分流长期收窄天花板。\n\n这条路上，我们没有任何一项能赢的要素。\n\n 7.2 真正可行的切口：本地部署与私有化交付\n\n如果要碰\"生产\"，只应从这里切。 依据就是第四节推导的那组数字——同一家公司，本地部署毛利率 +83%。\n\n为什么本地部署的毛利能撑住？ 因为它不是标准品：\n\n它有交付门槛（部署、调优、验收、运维），有场景绑定（客户的数据、流程、合规要求），不能简单比价——客户买的不是 token，是一套跑得起来的系统。这正好回到模块 02 的核心论点：标准品比价格，非标品比能力。\n\n而且它与我们已有的两条线天然衔接：模块 22 识别的信创合规通道机会（政务、金融、国企要国产化又建不起来），本质上就是本地部署交付；模块 02 重新定位后的场景化解决方案线（让客户自建的系统跑得更省更稳），也落在同一个位置。\n\n换句话说：我们不需要新开一条业务线，我们需要把已有的解决方案线往\"交付能力\"方向做深。\n\n 7.3 三条不该碰的红线\n\n不为了压低采购成本而自建。 上游的定价目标就是让这件事不划算（模块 20），而且我们的规模远达不到成本优势。\n\n不先买产能再找客户。 这是重资产业务最经典的死法——先有确定的基础负载，再有产能，顺序绝不能反。\n\n不进入公有云 token 的价格战。 那是有自有芯片和电力的玩家的战场。\n\n\n\n 八、分阶段起步路径\n\n回答\"多少客户的时候怎么做\"这个问题，关键指标不是客户数，是「可预测的基础负载」。\n\n原因很直接：利用率决定一切（模块 21 第 3.1 节）。一百个用量飘忽的客户，不如三个负载稳定的客户更适合支撑自建产能。所以下面每个阶段的触发条件，都以\"稳定基础负载\"为准，客户数只是参考。\n\n 阶段 0 · 当前：纯转售，零固定成本\n\n做什么：维持现状，把模块 21 的测算能力、模块 22 的信创摸排做扎实。\n\n这个阶段最重要的事，是积累判断下一阶段的数据：哪些客户的负载是稳定可预测的、他们的波峰波谷形态、私有化需求的真实频次。没有这些数据，任何自建决策都是拍脑袋。\n\n退出条件：出现两个及以上愿意为私有化/独占实例付费的客户，且需求可验证。\n\n 阶段 1 · 试水：租算力，不买卡\n\n触发条件：1–2 个确定的私有化交付订单，客户已签约或付定金。\n\n做什么：租用算力而非采购，为特定客户交付私有化实例。目标不是赚钱，是验证三件事：我们的推理部署与调优能力够不够、交付周期与人力投入的真实数字、客户愿意为\"托管 + 调优 + 运维\"付多少溢价。\n\n投入：轻。租用算力按月付，可随时退出。\n\n为什么必须先租不买：模块 22 记录国产 8 卡服务器 2026 年标价约 200 万元/台且在涨价，在能力未验证前投入重资产是不可接受的风险。租用的溢价，买的是\"随时能退出\"这个期权。\n\n失败信号：交付周期远超预期、人力投入吃掉全部毛利、客户不认可溢价。出现任一条即停在阶段 0。\n\n 阶段 2 · 小规模自建：有基础负载才买卡\n\n触发条件（三条必须同时满足）：\n\n其一，稳定基础负载能撑住 60% 以上利用率。 注意是 60% 不是 52%——模块 21 给的 52% 是盈亏平衡点，平衡点不是决策点，要留安全边际。\n\n其二，负载来自签约客户的合同承诺，不是销售预测。 预测会落空，合同不会。\n\n其三，阶段 1 已验证我们的交付能力，且毛利为正。\n\n做什么：按已签约负载采购最小规模产能，不留富余。缺口继续用租用或转售补。\n\n测算方法：用模块 21 第 3.3 节的公式，把模块 22 的 200 万元/台作为硬件锚。\n\n\n盈亏平衡月消耗量 Q = 自建月固定成本 ÷ API 单价\n\n\n月固定成本必须包含全部八项（模块 21 第 3.2 节）：硬件折旧、电力、带宽、机房、运维人力、模型迭代跟进、峰值冗余、资金占用。其中运维人力最常被漏掉，而它常是最大项之一。\n\n风险控制：单笔自建投入不得超过模块 04 第四节规定的资金上限；采购合同中争取残值回购或租转售条款。\n\n 阶段 3 · 规模化：只在阶段 2 持续盈利后考虑\n\n触发条件：阶段 2 连续两个季度贡献毛利为正，且利用率稳定在 70% 以上，且有排队等待的私有化需求。\n\n在此之前不讨论规模化。\n\n 阶段门槛速查\n\n 阶段  触发条件  资产形态  可退出性 \n\n 0 · 转售  —  零固定成本  完全 \n 1 · 试水  1–2 个签约私有化订单  租用  高（按月退租） \n 2 · 小规模自建  签约负载撑住 60% 利用率 + 阶段 1 毛利为正  采购，最小规模  低 \n 3 · 规模化  阶段 2 连续两季盈利 + 利用率 70%+  采购，扩张  极低 \n\n\n\n 九、观察指标：什么会改变这个结论\n\n本模块的结论是基于 2026 年中的价格与成本环境，它不是永久的。 以下三项发生实质变化时，应重新评估：\n\n公有云 token 的行业毛利率转正。 当前标杆是 −119%。这是最直接的指标——行业不再流血，说明价格战结束了。\n\n硬件成本转向。 模块 22 的观察指标：国产先进制程良率是否突破 60%（规模化分水岭）、8 卡服务器标价是否掉头。硬件降价会降低自建的固定成本门槛。\n\n我们自己的私有化交付订单频次。 如果一个季度内出现三个以上私有化需求且我们因产能不足而错失，说明市场在推着我们往前走，此时才值得重新算这笔账。\n\n\n\n 十、本模块触发的修正\n\n 模块  修正内容  状态 \n\n 00 · 基本认知第一条  「2026 进入涨价周期」→ 「市场分化：部分厂商涨价走价值战，部分继续降价走规模战」  已修正 \n 18 · 3.1  同上，补充 DeepSeek V4Pro 降价 75%、跟进降幅 97.5%–99% 的反向证据  已修正 \n 02 · 业务线  新增指针：Token 工厂作为候选第五条线，结论为现阶段不做公有云、可从本地部署切入  已修正 \n\n\n\n 数据来源\n\n [卖 Token 也不是稳赚不赔！硅基流动招股书来了  量子位](https://www.qbitai.com/2026/07/441127.html)（营收、毛利率、亏损、公有云 −119%、用户与吞吐数据）\n [疯狂扩产的「Token 工厂」：营收数十倍增长上演资本狂欢，API 价格战、端侧分流双重夹击  网易](https://www.163.com/dy/article/KVNNCGJ60512B07B.html)（行业玩家、价格战数据、端侧分流、三重挤压、泡沫判断）\n [Token 工厂站上资本风口，\"AI 卖铲人\"盈利待考  新京报](https://www.bjnews.com.cn/detail/1784285027129411.html)\n [硅基流动完成新一轮超 20 亿元融资  36氪](https://www.36kr.com/p/3855461124389767)\n 内部交叉引用：模块 02（标准品 vs 非标品）、模块 04（资金上限）、模块 18（标准品毛利被挤压）、模块 20（上游定价目标）、模块 21（利用率与盈亏平衡公式）、模块 22（硬件价格锚、信创机会）\n\n 第四节的本地部署毛利率为本模块推算，非直接披露，引用时须注明。\n"}, {"id": "26-客户数据使用边界与数据资产化", "code": "26", "title": "26 · 客户数据能不能用：合规边界、技术现实与分级方案", "short": "26 · 客户数据能不能用：合规边界、技术现实与分级方案", "subs": ["一、先给结论", "二、这个问题的真正枢纽：我们在法律上是谁", "三、三种用法的合规判定", "四、技术现实：想提升的东西，微调恰恰做不到", "五、成本账：训练很便宜，托管很贵", "六、风险：客户能举证，我们不能自证", "七、可执行的分级方案", "八、对外怎么说", "九、意外发现：上游转售条款（这件事比本题更严重）", "十、与既有模块的关系、冲突与修正", "十一、观察指标与复核触发条件", "十二、核心来源", "十三、明确的检索空白（禁止在此处外推）"], "html": "<h1>26 · 客户数据能不能用：合规边界、技术现实与分级方案</h1>\n<blockquote>\n<p><strong>版本 v1.0</strong> ｜ 撰写日期：2026-07-28 ｜ 密级：<strong>内部核心 · 决策层与技术负责人</strong>\n触发问题：「在做这个业务的过程中，我们能否通过客户授权使用客户的对话记录，提升大模型的准确性和智慧能力，进一步提升 AI 对客户的反应速度和准确性？」\n关联模块：02（业务线定位）· 04（单位经济模型）· 08（合规与风控）· 18（战略推演）· 21（选型方法论）· 25（Token 工厂）</p>\n</blockquote>\n<hr />\n<h2>一、先给结论</h2>\n<p><strong>这个问题的答案是\"能，但你想做的那件事不能做，而真正能做的那件事不需要动模型权重\"。</strong></p>\n<p>拆成三句：</p>\n<ol>\n<li>\n<p><strong>不要用客户对话去微调模型。</strong> 不是因为不合规（虽然确实很难合规），而是<strong>因为它解决不了你想解决的问题</strong>。客户抱怨的\"不准\"绝大多数是事实性错误，而学术证据显示微调在注入事实知识上收益极弱、甚至为负——Llama2-7B 在全新知识任务上微调后准确率从 0.353 <strong>掉到 0.219</strong>，而同一任务上 RAG 是 0.585。你会花一个数量级的钱，换一个可能更差的模型，外加一个客户能举证、你无法自证的法律敞口。</p>\n</li>\n<li>\n<p><strong>绝对不要做跨客户的数据混用。</strong> 这是本模块唯一的红线级禁令。它同时踩三条线：法律上无法履行 PIPL 第 23 条的告知义务（接收方名单动态且不可枚举）、商业上侵犯客户商业秘密、技术上有可被举证的泄露路径（对微调模型的成员推理攻击 AUC 已达 <strong>0.938</strong>）。</p>\n</li>\n<li>\n<p><strong>真正能提升\"速度和准确性\"的前三条路径，完全不需要读客户对话内容。</strong> 上游 prompt caching 对齐（缓存读价 <strong>0.1 倍</strong>，是合同确定的价差，不依赖任何模型质量假设）、网关自身链路优化（唯一 100% 由我们掌控的延迟）、精确缓存（哈希级，不需理解内容）。<strong>先把这三条做完，再谈其他。</strong></p>\n</li>\n</ol>\n<p><strong>一句话版本：把\"数据 → 模型权重\"这条路封死，把\"数据 → 评测集 / 示例库 / 路由策略\"这条路做深。前者是幻觉，后者才是护城河。</strong></p>\n<hr />\n<h2>二、这个问题的真正枢纽：我们在法律上是谁</h2>\n<p>大多数人把这个问题想成\"客户授权了没有\"。<strong>这是错的。真正的枢纽是：在每一种用法下，我们的法律身份会不会从\"受托处理者\"翻转成\"独立的个人信息处理者\"。</strong></p>\n<h3>2.1 两种身份，两套义务</h3>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th><strong>受托处理者</strong>（PIPL 第 21 条）</th>\n<th><strong>独立处理者 / 向第三方提供</strong>（PIPL 第 23 条）</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>判定标准</td>\n<td>无独立处理目的，按委托方指令处理</td>\n<td>自主决定处理目的、处理方式（第 73 条第一项）</td>\n</tr>\n<tr>\n<td>是否需要单独同意</td>\n<td><strong>不需要</strong></td>\n<td><strong>必须取得终端用户的单独同意</strong>，并逐项告知我方名称、联系方式、处理目的、处理方式、个人信息种类</td>\n</tr>\n<tr>\n<td>合同要求</td>\n<td>必须写全六要素：委托目的、期限、处理方式、个人信息种类、保护措施、双方权利义务</td>\n<td>需按《网络数据安全管理条例》第 12 条约定目的、方式、范围及安全义务</td>\n</tr>\n<tr>\n<td>转委托</td>\n<td><strong>未经委托方同意不得转委托</strong>——我们把数据转给上游厂商属转委托</td>\n<td>—</td>\n</tr>\n<tr>\n<td>合同终止后</td>\n<td><strong>必须返还或删除，不得保留</strong></td>\n<td>可依自身合法基础留存</td>\n</tr>\n<tr>\n<td>事前 PIA</td>\n<td>需要（第 55 条第三项）</td>\n<td>需要（第 55 条第三项）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>关键机制</strong>：身份翻转<strong>不以合同怎么写为准，以实际处理目的为准</strong>。把跨客户知识库包装成\"受客户委托构建\"是无效的形式包装——我们是在为自己和其他客户的利益使用 A 客户的数据，独立处理目的板上钉钉。锦天城的分析明确要求\"进行实质认定，而非形式上的判断\"。</p>\n<h3>2.2 客户企业无权替它的终端用户授权</h3>\n<p><strong>这是整件事最反直觉、也最容易搞错的一点。</strong></p>\n<p>我们的合同相对方是<strong>客户企业</strong>。但对话记录里的个人信息，主体是<strong>客户的终端用户</strong>。PIPL 第 13、14 条要求的是\"个人的同意\"、\"由个人在充分知情的前提下自愿、明确作出\"。</p>\n<p>所以：</p>\n<ul>\n<li>如果我们是<strong>受托处理者</strong>，客户的授权是有效的——因为它授权的只是\"替我干活\"，数据在法律上仍由客户控制。</li>\n<li>如果我们要<strong>自主使用数据</strong>（微调、跨客户库），客户在商务合同里写的\"我保证已取得授权\"<strong>只是一项民事担保</strong>。它给我们一个向客户追偿的依据，<strong>但不能免除我们自身的行政责任</strong>——PIPL 第 66 条的责任是按各自的处理者身份独立追究的。</li>\n</ul>\n<p><strong>换句话说：客户签的那张纸，在监管面前保护不了我们。</strong></p>\n<h3>2.3 「概括授权」为什么不够——四条独立理由，任何一条都足以否定它</h3>\n<ol>\n<li><strong>主体不对</strong>。合同相对方是企业，不是个人信息主体。</li>\n<li><strong>形式不对</strong>。《网络数据安全管理条例》第 62 条定义单独同意为\"针对其个人信息进行特定处理而<strong>专门</strong>作出具体、明确的同意\"。一揽子条款不满足\"专门\"。</li>\n<li><strong>告知不足</strong>。第 23 条要求告知接收方名称、联系方式。终端用户在客户的 App 里根本不知道\"我们\"的存在。</li>\n<li><strong>捆绑同意被禁止</strong>。《网络数据安全管理条例》第 22 条禁止以不同意为由拒绝提供服务（必需除外）。把\"同意用于训练\"与\"能否使用服务\"绑定，直接踩线。</li>\n</ol>\n<p>另有 <strong>PIPL 第 14 条第二款</strong>：处理目的、方式、种类发生变更的，<strong>应当重新取得个人同意</strong>。从\"为提供推理服务而传输\"变更为\"用于训练\"，是典型的目的变更——<strong>即便原授权有效，也需要重新取得同意</strong>。</p>\n<h3>2.4 一条必须纠正的常见误读</h3>\n<p>网上大量材料把《生成式人工智能服务管理暂行办法》<strong>第十一条</strong>读作\"禁止将用户输入用于训练\"。<strong>这个读法在条文上站不住。</strong></p>\n<p>第十一条原文是：不得\"<strong>非法</strong>留存能够识别使用者身份的输入信息和使用记录\"、不得\"<strong>非法</strong>向他人提供使用者的输入信息和使用记录\"。</p>\n<p><strong>\"非法\"二字把判断标准指回了 PIPL。</strong> 第十一条本身不是训练用途的禁止性规定，它的作用是<strong>让 PIPL 的违法后果同时构成 AIGC 规章项下的违法</strong>（可被责令暂停服务）。</p>\n<p>但它有一处对我们直接命中：<strong>我们把对话记录转给上游模型厂商用于其训练，属于\"向他人提供使用者的输入信息和使用记录\"</strong>，必须有合法基础，否则即\"非法提供\"。这一条与 2.1 表中\"转委托需委托方同意\"叠加，构成上游对接的双重约束。</p>\n<h3>2.5 另一条容易被用错的论证</h3>\n<p>不要用《网络安全法》\"日志留存不少于六个月\"给\"保留全量 prompt/completion\"做合规背书。<strong>网安法留存的是网络运行日志，不是对话内容。</strong> 这两者混为一谈，是内部文件里常见的错误论证，在监管检查时会成为反证。</p>\n<hr />\n<h2>三、三种用法的合规判定</h2>\n<p>把问题拆成三种用法，难度排序是 <strong>(b) ≫ (a) &gt; (c)</strong>。</p>\n<h3>(c) 单客户内部的缓存、检索增强、提示优化 —— 难度：低，<strong>这是唯一可规模化落地的路径</strong></h3>\n<p><strong>为什么低</strong>：数据不出客户边界、不改变处理目的、我们不为自身目的使用 → 稳稳留在第 21 条委托处理关系内，不触发第 23 条。</p>\n<p><strong>四个可工程化解决的卡点</strong>：</p>\n<ol>\n<li>委托合同必须按第 21 条写全六要素；处理情况记录<strong>至少保存 3 年</strong>（《网络数据安全管理条例》第 12 条）。</li>\n<li><strong>严格的租户隔离</strong>——缓存、向量库、提示模板必须按客户物理/逻辑隔离。<strong>一旦 A 客户的缓存命中 B 客户的请求，性质立刻变成 (b)。这是架构上最容易\"滑坡\"的地方，见第六节。</strong></li>\n<li><strong>转委托限制</strong>：把数据转给上游厂商须获客户明确同意，并向下背靠背传导义务。</li>\n<li>合同终止后必须<strong>返还或删除，不得保留</strong>——缓存、embedding、索引都要有可验证的删除机制。（embedding 是否属于个人信息目前<strong>无明确条文</strong>，保守做法是按个人信息处理。）</li>\n</ol>\n<h3>(a) 用客户对话做微调 —— 难度：高，路径存在但成本极高</h3>\n<p>按阻塞强度排序的十个卡点：</p>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>卡点</th>\n<th>依据</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><strong>终端用户的单独同意</strong>，不是客户企业的授权</td>\n<td>PIPL 第 23 条</td>\n</tr>\n<tr>\n<td>2</td>\n<td>处理目的变更需<strong>重新取得同意</strong></td>\n<td>PIPL 第 14 条第二款</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>敏感个人信息的第二重单独同意</strong>，而我们无法事先识别哪条 prompt 含敏感信息</td>\n<td>PIPL 第 28、29、30 条；GB/T 45654-2025 §4.2.3</td>\n</tr>\n<tr>\n<td>4</td>\n<td>须持有<strong>终端用户级的\"使用者授权记录\"</strong></td>\n<td>GB/T 45654-2025 §4.1.3 d)</td>\n</tr>\n<tr>\n<td>5</td>\n<td>须提供<strong>便捷的关闭选项（≤4 次点击）</strong>并显著告知——但我们不直接触达终端用户 UI，<strong>这是合规链条上的结构性断点</strong></td>\n<td>GB/T 45654-2025 §6.3</td>\n</tr>\n<tr>\n<td>6</td>\n<td><strong>身份跃迁</strong>：从\"纯转售走登记\"变成\"训练/二次开发模型\"，需走<strong>大模型备案</strong> + 安全评估</td>\n<td>暂行办法第 17 条</td>\n</tr>\n<tr>\n<td>7</td>\n<td>训练前须做<strong>语料抽样安全评估</strong>（违法不良信息 &gt;5% 不得使用）</td>\n<td>GB/T 45654-2025 §4.1.1</td>\n</tr>\n<tr>\n<td>8</td>\n<td>事前 PIA；处理 <strong>1000 万人以上</strong>还需<strong>两年一次合规审计</strong></td>\n<td>PIPL 第 55、56 条；《个人信息保护合规审计管理办法》第 4 条</td>\n</tr>\n<tr>\n<td>9</td>\n<td><strong>删除权无法履行</strong>——模型权重中的信息无法定向删除，法律尚无豁免条文</td>\n<td>PIPL 第 47 条</td>\n</tr>\n<tr>\n<td>10</td>\n<td>若在海外算力上微调 → 叠加 PIPL 第 38、39 条出境路径与<strong>第二道单独同意</strong></td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>第 5 条是最要命的</strong>：GB/T 45654-2025 明确要求提供关闭开关且\"从服务主界面开始到达该选项所需操作不超过 4 次点击\"。我们是中间层，没有终端用户界面。<strong>这个义务只能靠客户侧实现，而我们无法验证客户是否真的实现了。</strong> 这意味着 (a) 用法的合规性永远建立在一个我们控制不了的环节上。</p>\n</blockquote>\n<h3>(b) 跨客户共享的知识/示例库 —— <strong>红线，不做</strong></h3>\n<p>(b) 承担 (a) 的<strong>全部</strong>卡点，并额外叠加三层：</p>\n<ol>\n<li><strong>二次触发第 23 条</strong>。把 A 客户的对话做成示例库供 B 客户调用，是把 A 的终端用户个人信息提供给了 B。需要向 A 的终端用户告知\"接收方 B 的名称、联系方式\"——<strong>在多租户网关上，接收方名单是动态的、不可枚举的，这个告知义务在结构上无法履行。</strong> 不是难，是不可能。</li>\n<li>若示例库可检索/可见，可能进一步触发 <strong>PIPL 第 25 条</strong>（公开个人信息需单独同意）。</li>\n<li><strong>商业秘密与竞业冲突</strong>。客户 prompt 里的业务逻辑、内部数据、代码命名是客户的商业秘密。跨客户共享<strong>与个人信息问题无关地</strong>独立构成违约与不正当竞争风险。<strong>即便所有个人信息都清理干净，这一条依然成立。</strong></li>\n</ol>\n<p><strong>唯一相对可行的改造</strong>：不使用原始对话，只沉淀<strong>经我方人员人工抽象、不含任何客户业务内容与个人信息的通用方法论</strong>（例如\"这类任务适合用 XX 提示结构\"）。此时它不再是个人信息处理，问题转化为商业秘密与合同问题。</p>\n<p><strong>注意：靠\"匿名化\"把原始对话洗成共享库的方案不成立。</strong> 见 3.1。</p>\n<h3>3.1 为什么\"匿名化\"不是出口</h3>\n<p>PIPL 第 73 条把两个概念分得很清楚：</p>\n<ul>\n<li><strong>去标识化</strong>：不借助额外信息无法识别特定自然人。<strong>仍然是个人信息</strong>，全部 PIPL 义务继续适用。</li>\n<li><strong>匿名化</strong>：无法识别<strong>且不能复原</strong>。<strong>不再是个人信息</strong>（第 4 条明确\"不包括匿名化处理后的信息\"）。</li>\n</ul>\n<p>差别在\"可复原性\"——去标识化保留了钥匙（哪怕锁在另一个库），匿名化要求钥匙被销毁且不可能重建。</p>\n<p><strong>对话自由文本实操上做不到匿名化</strong>，四条理由：</p>\n<ol>\n<li>准标识符不可穷举。\"我在 XX 医院看的 XX 科\"\"上周三从上海飞成都\"这类描述，正则和 NER 无法保证召回。</li>\n<li>稀有组合仍可重识别。独特的业务背景、内部命名、罕见病症组合都可能定位到唯一个人。</li>\n<li><strong>模型记忆化使\"不能复原\"的假设失效</strong>——去标识化后的语料进入训练，模型仍可能逐字复现。</li>\n<li>我们不掌握客户的上下文，<strong>无法评估重识别风险</strong>——而这恰恰是判断是否达到匿名化的前提。</li>\n</ol>\n<blockquote>\n<p><strong>纪律</strong>：把\"我们做了脱敏\"定位为<strong>降低风险的安全措施</strong>，<strong>绝不作为免除同意义务的法律主张</strong>。对外宣称\"已匿名化因此无需同意\"，在监管检查时是高风险陈述。</p>\n</blockquote>\n<h3>3.2 对话记录里哪些内容会触发敏感个人信息</h3>\n<p>PIPL 第 28 条列举：生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹，<strong>以及不满十四周岁未成年人的全部个人信息</strong>。</p>\n<table>\n<thead>\n<tr>\n<th>客户类型</th>\n<th>高频触发内容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>医疗健康、保险</td>\n<td>问诊描述、检验报告文本</td>\n</tr>\n<tr>\n<td>金融、客服机器人</td>\n<td>卡号、余额、还款记录、征信描述</td>\n</tr>\n<tr>\n<td>政企、人力</td>\n<td>身份证号、职业资格、党派/军人身份</td>\n</tr>\n<tr>\n<td>出行、物流</td>\n<td>地址、行程单、定位描述</td>\n</tr>\n<tr>\n<td>多模态场景</td>\n<td>人脸图片、声纹片段</td>\n</tr>\n<tr>\n<td><strong>教育、陪伴、玩具</strong></td>\n<td><strong>这类客户的全部对话都需按敏感个人信息 + 监护人同意处理</strong></td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>结构性难题</strong>：我们<strong>无法事先知道</strong>某一条 prompt 是否含敏感个人信息，因此不能按\"分类型分别取同意\"设计产品。只有两条路：<strong>要么按最高标准（全部按敏感处理）</strong>，<strong>要么入库前强制过滤并接受残余风险</strong>。</p>\n</blockquote>\n<h3>3.3 罚则与执法现状</h3>\n<ul>\n<li><strong>PIPL 第 66 条</strong>：一般情形拒不改正处 100 万元以下；<strong>情节严重的，处 5000 万元以下或上一年度营业额 5% 以下</strong>，可责令停业整顿、吊销营业执照；直接责任人 10 万–100 万元并可禁业。已知最高罚单：知网 5000 万元。</li>\n<li><strong>《网络安全法》2025 修正版（2026-01-01 施行）</strong> 罚则大幅提高，特别严重情形 <strong>200 万–1000 万元</strong>。</li>\n<li><strong>《网络数据安全管理条例》第 28 条</strong>：处理 <strong>1000 万人以上</strong>个人信息的，须适用重要数据处理者的组织架构与报告义务。<strong>聚合网关的终端用户基数很容易触及这个门槛，且是跨所有客户合并计算的。</strong></li>\n</ul>\n<p><strong>执法现状——这一条必须如实记录：</strong></p>\n<blockquote>\n<p>⚠️ <strong>本次检索未找到中国境内任何一起以\"未经单独同意将用户对话数据用于模型训练\"为主要案由的公开行政处罚或约谈案例（2024–2026）。请勿在任何内部或对外材料中援引不存在的案例。</strong></p>\n</blockquote>\n<p>但方向是明确的：<strong>2026 年 4 月 30 日部署的\"清朗·整治 AI 应用乱象\"专项行动，已把\"模型训练过程中使用未经授权的文字、图片、音视频等数据\"明文写入整治清单。</strong> 监管当前的主抓手仍是\"备案/登记\"和\"语料来源合法性\"，但风险窗口正在收窄。</p>\n<hr />\n<h2>四、技术现实：想提升的东西，微调恰恰做不到</h2>\n<p><strong>即便合规问题全部解决，这条路在技术上也是错的。</strong> 这一节的证据比合规部分更有决定性，因为它不依赖任何法律解释。</p>\n<h3>4.1 微调 vs RAG：注入知识这件事，微调是输的</h3>\n<p>Ovadia 等人 EMNLP 2024 的对照实验（7B 级模型，0-shot）：</p>\n<table>\n<thead>\n<tr>\n<th>任务</th>\n<th>模型</th>\n<th>Base</th>\n<th>微调</th>\n<th>RAG</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>MMLU-Anatomy</td>\n<td>Mistral 7B</td>\n<td>0.556</td>\n<td>0.570</td>\n<td><strong>0.681</strong></td>\n</tr>\n<tr>\n<td>MMLU-College Bio</td>\n<td>Mistral 7B</td>\n<td>0.681</td>\n<td>0.701</td>\n<td><strong>0.757</strong></td>\n</tr>\n<tr>\n<td><strong>当前事件（全新知识）</strong></td>\n<td>Mistral 7B</td>\n<td>0.481</td>\n<td>0.504</td>\n<td><strong>0.875</strong></td>\n</tr>\n<tr>\n<td><strong>当前事件</strong></td>\n<td>Llama2 7B</td>\n<td>0.353</td>\n<td><strong>0.219 ↓</strong></td>\n<td><strong>0.585</strong></td>\n</tr>\n<tr>\n<td><strong>当前事件</strong></td>\n<td>Orca2 7B</td>\n<td>0.456</td>\n<td>0.511</td>\n<td><strong>0.876</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>三个读数：</strong></p>\n<ol>\n<li>在<strong>已有知识</strong>上，微调 +1~8.6pp，RAG +2~12.5pp，RAG 全面占优。</li>\n<li>在<strong>全新知识</strong>上差距是数量级的：微调 +2.3~5.5pp，RAG <strong>+22~42pp</strong>。</li>\n<li><strong>Llama2-7B 微调后从 0.353 掉到 0.219</strong>——这是\"微调注入事实知识反而更差\"的直接实证。</li>\n</ol>\n<p><strong>还有一条对我们特别致命的发现</strong>：论文指出，要让微调真的学进新事实，必须提供<strong>同一事实的多个改写版本</strong>（Mistral 加改写后 0.504→0.588）。<strong>也就是说，我们手里的原始对话日志格式，恰恰是微调最学不进去的形态。</strong> 想用它就得先做大规模改写和标注，成本又翻一个量级。</p>\n<p><strong>对照组</strong>：微软的农业案例（arXiv 2401.08406）结论更温和——微调 +6pp、RAG 再 +5pp、两者可叠加。但注意那里的微调数据是<strong>专门用 GPT-4 生成的 QA 对</strong>，不是原始日志。</p>\n<blockquote>\n<p><strong>工程结论</strong>：微调有用的场景是<strong>教格式、教风格、教任务范式</strong>，不是教事实。而客户抱怨的\"不准\"，绝大部分属于后者。</p>\n</blockquote>\n<h3>4.2 LoRA 的取舍：学得少，忘得也少</h3>\n<p>Llama-2-7B 上的实测（TMLR 2024）：</p>\n<table>\n<thead>\n<tr>\n<th>指标</th>\n<th>全参微调</th>\n<th>LoRA r=256</th>\n<th>LoRA r=16</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>HumanEval（目标域）</td>\n<td>0.497</td>\n<td>0.498</td>\n<td>0.358</td>\n</tr>\n<tr>\n<td>通用能力保留（代码微调后均值）</td>\n<td><strong>0.414</strong></td>\n<td>0.517</td>\n<td>—</td>\n</tr>\n</tbody>\n</table>\n<p><strong>全参微调把通用能力打到 0.414，LoRA 保住 0.51+，差约 10 个百分点</strong>——这是\"灾难性遗忘\"的量化代价。但代价是 LoRA 低秩时目标域性能显著落后（HumanEval 差 14pp）。在大规模继续预训练场景 LoRA 全面落后。</p>\n<p>另一项 1B–7B 的实证研究发现：<strong>在这个区间，模型越大遗忘越严重</strong>。</p>\n<h3>4.3 各路径的真实收益对照</h3>\n<table>\n<thead>\n<tr>\n<th>路径</th>\n<th>准确率收益</th>\n<th>延迟收益</th>\n<th>证据口径</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>上游 prompt caching</strong></td>\n<td>—</td>\n<td>DeepSeek 报 128K prompt TTFT 13s→500ms（极端最佳情况）</td>\n<td><strong>厂商合同价：读价 0.1×（Anthropic/DeepSeek/阿里）或 0.5×（OpenAI）</strong></td>\n</tr>\n<tr>\n<td><strong>精确缓存</strong></td>\n<td>无风险</td>\n<td>命中 &lt;5ms vs 未命中 2–5s</td>\n<td>二手</td>\n</tr>\n<tr>\n<td><strong>模型路由</strong></td>\n<td>保持 95% 强模型性能</td>\n<td>通常降低 TTFT，但路由器自身开销未计净值</td>\n<td><strong>成本降 35%（GSM8K）/ 45%（MMLU）/ 85%（MT Bench）</strong></td>\n</tr>\n<tr>\n<td><strong>提示词优化（DSPy 类）</strong></td>\n<td>HotPotQA <strong>+3.8~5.9pp</strong>；GSM8K +20~47pp</td>\n<td>通常<strong>恶化</strong>（prompt 变长）</td>\n<td>实验室</td>\n</tr>\n<tr>\n<td><strong>RAG</strong></td>\n<td>新知识 <strong>+22~42pp</strong>；已有知识 +2~12.5pp</td>\n<td>增加检索延迟</td>\n<td>实验室</td>\n</tr>\n<tr>\n<td><strong>语义缓存</strong></td>\n<td><strong>损害准确率：2.7%~7.5% 的命中是错的</strong></td>\n<td>命中时 &lt;5ms</td>\n<td>合成实验 + 二手</td>\n</tr>\n<tr>\n<td><strong>推测解码</strong></td>\n<td>—</td>\n<td>QPS=1 时 1.5–2.8× 加速；<strong>高 QPS 反而慢 1.4–1.8×</strong></td>\n<td>vLLM 官方实测</td>\n</tr>\n<tr>\n<td><strong>跨客户混合微调</strong></td>\n<td><strong>注入事实知识为负收益</strong></td>\n<td>—</td>\n<td>见 4.1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>三条必须记住的口径警告：</strong></p>\n<ol>\n<li><strong>RouteLLM 的\"85% 成本下降\"只在 MT Bench 上成立。</strong> MT Bench 是主观对话评分基准，有大量弱模型也能答好的闲聊。换到知识密集（MMLU）和推理密集（GSM8K）任务，同一路由器只能省 45% 和 35%。<strong>对客户宣传时用 35%–45% 这个区间，不要用 85%。</strong></li>\n<li><strong>DSPy 的 +47pp 来自 GSM8K，基线只有 33.1%。</strong> 在更接近真实检索问答的 HotPotQA 上，增益回落到 +3.8~5.9pp。</li>\n<li><strong>语义缓存的命中率被严重夸大。</strong> 生产口径下：FAQ/客服 40–60%，内部知识库 30–45%，<strong>开放式聊天 10–20%，代码生成 5–15%</strong>。我们的真实流量结构大概率偏向后两者。<strong>现实区间是 5%–25%，不是营销材料里的 60%+。</strong></li>\n<li><strong>推测解码对我们基本无关</strong>——不仅高并发下会变慢，更根本的是<strong>我们调用上游 API，推理栈不在自己手里</strong>，除非自托管否则无从实施。</li>\n</ol>\n<h3>4.4 响应速度到底由什么决定</h3>\n<p>TTFT 的构成，按影响排序：<strong>Prompt 长度</strong>（prefill 计算量正比于输入长度）&gt; <strong>系统负载/排队延迟</strong> &gt; prefill 计算本身。</p>\n<p>但对我们还要叠加<strong>我们自己能控制的部分</strong>：网关到上游的网络 RTT、TLS 握手、鉴权/计费/日志中间件的同步开销、连接池复用率。</p>\n<blockquote>\n<p><strong>这是唯一 100% 由我们掌控的延迟。第 0 步应该是测量它占端到端 TTFT 的比例——没有这个数字，其他所有优化的收益都是猜的。</strong></p>\n</blockquote>\n<hr />\n<h2>五、成本账：训练很便宜，托管很贵</h2>\n<p>这一节的结论与<strong>模块 25（Token 工厂）完全一致</strong>，而且是从另一条路径独立得出的。</p>\n<h3>5.1 训练成本根本不是瓶颈</h3>\n<p>阿里云百炼公开训练价格（按 token 计费，含算力）：Qwen3-8B <strong>6 元/百万 token</strong>，Qwen3-32B <strong>40 元/百万</strong>，Qwen2.5-72B <strong>150 元/百万</strong>。</p>\n<p><strong>推算</strong>（我方计算，非厂商数据）：一次典型 LoRA 微调用 5000 万 token（约 5 万条对话 × 1000 token × 2–3 epoch）：</p>\n<table>\n<thead>\n<tr>\n<th>模型规模</th>\n<th>单次微调成本</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>8B 级</td>\n<td><strong>约 300 元</strong></td>\n</tr>\n<tr>\n<td>32B 级</td>\n<td><strong>约 2,000 元</strong></td>\n</tr>\n<tr>\n<td>72B 级</td>\n<td><strong>约 7,500 元</strong></td>\n</tr>\n</tbody>\n</table>\n<p>即使跑 10 轮超参搜索，也在几千到十万元量级。<strong>训练便宜到可以忽略。</strong></p>\n<h3>5.2 推理托管才是成本杀手</h3>\n<p>阿里云百炼独占实例：<strong>Qwen3-32B 预付费 ¥52,236/月</strong>（后付费 ¥108/小时）。</p>\n<p>对照 API 调用价：Qwen-Plus 最低档 ¥0.8 输入 / ¥2 输出（每百万 token）。</p>\n<p><strong>打平点推算</strong>（我方计算，输入输出比 4:1，混合均价 ¥1.04/百万 token）：</p>\n<pre><code>月固定成本 52,236 元 ÷ 1.04 元/百万 token ≈ 502 亿 token/月\n                                        ≈ 16.7 亿 token/天\n</code></pre>\n<p><strong>但这里有一个更硬的约束</strong>：一个 32B 独占实例的物理吞吐上限。即便乐观假设持续 3,000 tokens/s 且<strong>利用率 100% 无空闲</strong>：</p>\n<pre><code>3,000 × 86,400 × 30 ≈ 78 亿 token/月\n</code></pre>\n<p><strong>78 亿 &lt; 502 亿，差约 6 倍。</strong></p>\n<blockquote>\n<p><strong>结论：按公开价格，为一个微调后的 32B 模型做独占部署，在物理上就不可能比直接调用同级 API 便宜。</strong> 不是利用率不够的问题，是打平点高于物理吞吐上限。除非（a）微调后能降到 4B 级还保持质量，或（b）流量是单一窄任务且能压到接近满载——<strong>这两个条件都必须先验证，不能假设。</strong></p>\n</blockquote>\n<h3>5.3 一个反向的价格信号</h3>\n<p>OpenAI 定价页显示：微调后模型推理<strong>开启数据共享时</strong> $2/$8 每百万 token，比基础模型的 $4/$16 <strong>便宜一半</strong>。</p>\n<p><strong>这个折扣结构本身就是答案：数据的商业价值，上游厂商定价为\"推理费五折\"。</strong> 如果连 OpenAI 都只愿意为数据出这个价，我们自己囤数据的估值应该更保守。</p>\n<h3>5.4 对照：真正划算的那条路</h3>\n<p>语义缓存基础设施成本：embedding 约 $0.02/1M tokens，向量存储 $50–200/月，<strong>总计通常低于节省额的 5%</strong>。</p>\n<p>相对上述几万元/月的推理托管，这是<strong>两个数量级的差距</strong>。</p>\n<hr />\n<h2>六、风险：客户能举证，我们不能自证</h2>\n<h3>6.1 记忆化是可测量的，不是理论担忧</h3>\n<p>Carlini 等人的量化研究（ICLR 2023，GPT-Neo / The Pile）：</p>\n<ul>\n<li><strong>模型规模每增加 10 倍，可提取记忆增加 19 个百分点</strong>（log-linear，R²=99.8%）。125M 模型约 5% 可提取，<strong>6B 模型约 40%</strong>。</li>\n<li><strong>重复次数决定性影响</strong>：训练集中重复 100 次的序列，6B 模型约 15% 可提取；重复 724–861 次，<strong>约 53% 可提取</strong>。</li>\n<li>但论文明确指出：<strong>\"即使只重复几次，记忆化仍然发生\"</strong>——去重不能消除泄露。</li>\n<li><strong>上下文长度放大提取</strong>：给 50 token 上下文时 33% 可提取，给 450 token 时 <strong>65%</strong>。</li>\n</ul>\n<blockquote>\n<p><strong>直接映射到我们</strong>：客户的<strong>系统提示词、模板、固定话术、合同条款、内部知识片段</strong>在日志里天然高频重复，<strong>正好落在\"高重复 = 高可提取\"的区间</strong>。这不是小概率事件，这是结构性的。</p>\n</blockquote>\n<h3>6.2 生产模型上的实际提取攻击</h3>\n<p>Nasr、Carlini 等人对 <strong>ChatGPT（gpt-3.5-turbo）</strong> 的攻击：用 <strong>$200 的查询费用</strong>提取出<strong>超过一万条训练数据样本</strong>，作者估计再多花钱可提取 10 倍以上。</p>\n<p>关键洞察：用传统基线方法看，ChatGPT 显得比此前任何模型\"私密 50 倍\"——<strong>但\"发散攻击\"的提取率是基线的约 150 倍。也就是说，对齐只是掩盖了记忆，没有消除它。</strong></p>\n<p>开源模型的逐字记忆率：GPT-Neo 0.16%–0.24%，Pythia 0.45%–0.60%，RedPajama 0.77%–1.44%。</p>\n<blockquote>\n<p>0.5% 听起来小，但在一个日处理十亿 token 的网关上，<strong>0.5% 是每天数百万 token 的逐字复现量。</strong></p>\n</blockquote>\n<h3>6.3 成员推理：客户能举证，我们无法自证</h3>\n<p>SPV-MIA（NeurIPS 2024，专门针对<strong>微调过的</strong> LLM）：</p>\n<table>\n<thead>\n<tr>\n<th>攻击</th>\n<th>平均 AUC</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>最好的既有基线</td>\n<td>0.744</td>\n</tr>\n<tr>\n<td><strong>SPV-MIA</strong></td>\n<td><strong>0.938</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>AUC 0.938 意味着：客户拿一段文本，判断\"这段是否在你的微调集里\"的准确度非常高。</strong></p>\n<blockquote>\n<p><strong>这是本节最重要的一句话</strong>：<strong>客户 A 有技术手段证明它的数据进了我们的模型；我们没有任何技术手段证明它没进。</strong> 举证责任的不对称是结构性的，不是靠合同条款能平衡的。</p>\n</blockquote>\n<p><strong>差分隐私救不了这一点。</strong> DP 保护的是\"某条样本是否参与训练\"，而客户合同关心的是\"你有没有拿我的数据训练\"——<strong>这是目的限制问题，DP 不提供豁免</strong>。而且 DP 微调的\"低代价\"结论只在\"任务简单 + 有强预训练基座\"时成立；从零 DP 训练（ε=8）在 CIFAR-10 上只有 62%，比非私有的 91.25% 低约 29 个百分点。</p>\n<h3>6.4 最有操作价值的一条：真实事故发生在网关层，不在模型层</h3>\n<p><strong>必须区分两类风险，因为对我们的启示完全不同：</strong></p>\n<p><strong>(a) 模型训练导致的跨客户数据吐出</strong>：<strong>未检索到公开确认的真实企业案例。</strong></p>\n<blockquote>\n<p>⚠️ 常被引用的三星事件<strong>不是这一类</strong>。那是员工主动把源代码和会议记录粘贴进 ChatGPT，属于数据外流，<strong>不是模型吐给了第三方</strong>。不要在内部材料中把它当作\"模型记忆泄露\"的证据。</p>\n</blockquote>\n<p><strong>(b) 基础设施层的跨租户泄露：真实发生过，而且就发生在网关这一层。</strong></p>\n<p>OpenAI 2023 年 3 月 20 日事故官方报告：</p>\n<ul>\n<li><strong>泄露内容</strong>：其他用户的聊天标题，以及 Plus 订阅者的<strong>姓名、邮箱、账单地址、信用卡类型、卡号后四位、有效期</strong>。</li>\n<li><strong>影响范围</strong>：该 9 小时窗口内活跃 Plus 订阅者的 <strong>1.2%</strong>。</li>\n<li><strong>根因</strong>：<strong>redis-py 在 asyncio 下，请求被取消后连接状态污染，下一个无关请求收到了上一个用户的残留数据。</strong></li>\n</ul>\n<blockquote>\n<p><strong>这是本模块对我们最有操作价值的一条结论</strong>：</p>\n<p><strong>真实世界里，网关/缓存/连接池层的跨租户串数据，比\"模型记住了训练数据\"发生得更早、更频繁、更容易。</strong></p>\n<p>一个共享的语义缓存，如果租户隔离做错，<strong>就是这次事故的翻版，而且是我们主动设计出来的</strong>。</p>\n<p><strong>硬性要求：缓存键必须包含租户 ID；必须建立跨租户命中的自动化检测与告警。这条写进技术评审清单，不可豁免。</strong></p>\n</blockquote>\n<h3>6.5 行业事实：没有一家同行在做我们设想的那件事</h3>\n<table>\n<thead>\n<tr>\n<th>厂商</th>\n<th>缓存</th>\n<th>是否用对话数据做优化</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Cloudflare AI Gateway</strong></td>\n<td><strong>仅精确匹配</strong>；文档明说\"计划未来加入语义搜索\"</td>\n<td>无</td>\n</tr>\n<tr>\n<td><strong>Helicone</strong></td>\n<td><strong>仅精确缓存</strong>（哈希请求体）</td>\n<td>提供日志与实验功能</td>\n</tr>\n<tr>\n<td><strong>Portkey</strong></td>\n<td>精确 + 语义（cosine 阈值默认 0.95）</td>\n<td>prompt 版本管理与 observability，<strong>未描述用生产日志自动优化</strong></td>\n</tr>\n<tr>\n<td><strong>LiteLLM</strong></td>\n<td>精确 + 语义</td>\n<td>无</td>\n</tr>\n<tr>\n<td><strong>New API</strong></td>\n<td>Redis 缓存</td>\n<td><strong>无微调/数据优化功能</strong></td>\n</tr>\n<tr>\n<td><strong>OpenPipe</strong></td>\n<td>—</td>\n<td><strong>有：代理捕获日志 → 微调</strong>，但<strong>单租户</strong>：客户自己的日志，微调客户自己的模型</td>\n</tr>\n<tr>\n<td><strong>LangSmith</strong></td>\n<td>—</td>\n<td><strong>有：trace → 数据集 → 动态 few-shot 示例选择</strong>，权重不变</td>\n</tr>\n</tbody>\n</table>\n<p><strong>三条可以直接拿来用的行业事实：</strong></p>\n<ol>\n<li><strong>没有一家主流网关做\"跨客户数据微调\"。</strong> 做数据→模型这件事的 OpenPipe 是严格单租户的。这是产品形态上的根本区别，不是能力差距。</li>\n<li><strong>连语义缓存都还是少数派，而且都是租户内的。</strong> Cloudflare 这种体量的厂商至今只做精确匹配，并把语义缓存列为\"未来计划\"——<strong>这说明误命中风险在大规模生产中是被认真对待的工程难题，不是配个向量库就能上。</strong></li>\n<li><strong>行业主流形态是 LangSmith 式的：日志 → 数据集 → 动态 few-shot / 评测集。</strong> 权重不变、数据可删除、可按租户隔离。<strong>这是我们最应该抄的形态。</strong></li>\n</ol>\n<hr />\n<h2>七、可执行的分级方案</h2>\n<p>把\"用客户数据\"拆成四个等级，<strong>逐级放行，不得跳级</strong>。</p>\n<table>\n<thead>\n<tr>\n<th>级别</th>\n<th>做什么</th>\n<th>是否需要客户数据内容</th>\n<th>法律身份</th>\n<th>需要的授权</th>\n<th>结论</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>L0</strong></td>\n<td>上游 prompt caching 对齐、网关链路优化、精确缓存（含租户 ID）</td>\n<td><strong>完全不需要</strong>。只操作请求结构与哈希</td>\n<td>受托处理者</td>\n<td>标准委托合同即可</td>\n<td>✅ <strong>立即做，优先级最高</strong></td>\n</tr>\n<tr>\n<td><strong>L1</strong></td>\n<td>模型路由（用长度、任务类型等<strong>元数据</strong>，不读内容）、用量与成本可观测性</td>\n<td>元数据级</td>\n<td>受托处理者</td>\n<td>标准委托合同</td>\n<td>✅ <strong>做</strong></td>\n</tr>\n<tr>\n<td><strong>L2</strong></td>\n<td>单租户内的 RAG、示例库、提示优化、评测集；数据严格不出客户边界</td>\n<td>需要，但<strong>不跨租户、不进权重、单条可删</strong></td>\n<td>受托处理者（前提是隔离到位）</td>\n<td>委托合同写全六要素 + PIA + 可验证删除机制</td>\n<td>✅ <strong>做，但架构必须先过隔离评审</strong></td>\n</tr>\n<tr>\n<td><strong>L2.5</strong></td>\n<td>单租户语义缓存</td>\n<td>需要</td>\n<td>受托处理者</td>\n<td>同 L2</td>\n<td>⚠️ <strong>慎入</strong>。误命中损害准确率 2.7–7.5%；须有跨租户命中告警</td>\n</tr>\n<tr>\n<td><strong>L3</strong></td>\n<td>用单个客户的数据微调<strong>仅供该客户使用</strong>的模型</td>\n<td>需要，进权重</td>\n<td><strong>翻转为独立处理者</strong></td>\n<td>终端用户单独同意 + 授权记录 + 大模型备案 + 语料安全评估</td>\n<td>⛔ <strong>暂不做</strong>。经济性不成立（第五节），合规链条有结构性断点（第 3 节卡点 5）</td>\n</tr>\n<tr>\n<td><strong>L4</strong></td>\n<td>跨客户数据混用（共享库或混合微调）</td>\n<td>需要</td>\n<td>独立处理者 + 二次提供</td>\n<td><strong>告知义务在结构上无法履行</strong></td>\n<td>🚫 <strong>红线，永不做</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>7.1 执行顺序</h3>\n<p><strong>第 0 步（做任何优化之前）</strong>：测量端到端 TTFT 的构成，拆出「网关自身开销 / 网络 RTT / 上游 prefill 与排队」三段占比。<strong>没有这个数字，L0 的收益都是猜的。</strong></p>\n<p><strong>第一阶段（L0，零数据风险）</strong>：上游缓存对齐是全表里<strong>唯一\"不依赖任何模型质量假设\"的确定性收益</strong>——读价 0.1 倍是合同写死的。这是纯工程活：把稳定的 system prompt 和工具定义放前面、保证前缀字节级一致、<strong>不要在 prompt 开头插时间戳</strong>。</p>\n<p><strong>第二阶段（L1）</strong>：模型路由。对外宣传用 <strong>35%–45%</strong>，不要用 85%。</p>\n<p><strong>第三阶段（L2）</strong>：这是\"用对话数据\"的<strong>正确形态</strong>——数据 → 数据集 → 检索/示例/评测，模型权重不动，单条记录可删，可按租户审计。</p>\n<p><strong>L3 的重新评估触发条件</strong>（三条须同时满足，缺一不可）：\n1. 有客户明确提出需求，<strong>且愿意自行完成终端用户单独同意与授权记录的取得</strong>；\n2. 该客户的流量能把一个 4B 级实例压到 <strong>70% 以上利用率</strong>（或提供足以覆盖固定成本的付费承诺）；\n3. 在其数据上跑过对照实验，<strong>微调相对\"RAG + 提示优化\"有可复现的显著增益</strong>。</p>\n<blockquote>\n<p><strong>三条里最容易被忽略的是第 3 条。</strong> 不要因为客户愿意付钱就跳过验证——如果微调打不过 RAG，我们收了钱交付了一个更差的东西，长期是负资产。</p>\n</blockquote>\n<h3>7.2 三条红线</h3>\n<ol>\n<li><strong>不做跨客户数据混用</strong>——任何形式，包括\"匿名化后\"的共享示例库。</li>\n<li><strong>不把\"我们做了脱敏\"作为免除同意义务的法律主张</strong>——它是安全措施，不是合规出口。</li>\n<li><strong>不在没有租户隔离评审通过前上线任何共享缓存组件</strong>——参见 OpenAI redis-py 事故。</li>\n</ol>\n<hr />\n<h2>八、对外怎么说</h2>\n<p>客户问\"你们会不会用我的数据\"时，<strong>这是一次销售机会，不是防守</strong>。因为：</p>\n<p><strong>上游厂商在这件事上的条款普遍很差，而我们可以做得比上游更干净。</strong>（详见第九节的横向对比）</p>\n<p><strong>推荐话术：</strong></p>\n<blockquote>\n<p>\"我们对您数据的处理，只做三件事：<strong>转发、计费、可观测性</strong>。</p>\n<p>我们<strong>不用您的数据训练任何模型</strong>——不是因为我们承诺不做，是因为我们的架构里根本没有这条通路。</p>\n<p>我们能给您的优化，来自三个地方：<strong>把请求结构重排以命中上游的缓存折扣</strong>（这能让重复的长上下文部分只花十分之一的钱）、<strong>按任务难度路由到合适的模型</strong>（同等质量下成本可降三到四成）、以及<strong>在您自己的租户内</strong>为您沉淀评测集和示例库——<strong>那些数据始终是您的，随时可以导出，随时可以删除，我们有可验证的删除机制。</strong></p>\n<p>另外有一件上游厂商通常不会主动告诉您的事：<strong>国内主流大模型平台里，有几家的默认条款是允许用您的输入优化模型的，而且没有关闭开关。</strong> 我们可以按您的合规要求，帮您把流量只路由到条款干净的那几家。\"</p>\n</blockquote>\n<p><strong>这段话的三个作用</strong>：把\"不用数据\"从道德承诺变成<strong>架构事实</strong>（不可证伪的承诺没有说服力，不可能的架构才有）；把话题从\"你会不会拿我的数据\"转向\"我帮你管住上游\"；<strong>顺势卖出选型咨询</strong>——这正是模块 02 §2.4 定位的解决方案线。</p>\n<hr />\n<h2>九、意外发现：上游转售条款（这件事比本题更严重）</h2>\n<blockquote>\n<p>⚠️ <strong>这一节不是本模块的原定范围，是核查上游数据条款时撞上的。它对公司的威胁远大于数据使用问题本身，必须单独立项处理。</strong></p>\n</blockquote>\n<h3>9.1 三家上游明确禁止转售</h3>\n<table>\n<thead>\n<tr>\n<th>厂商</th>\n<th>条款</th>\n<th>原文要点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>阿里云百炼</strong></td>\n<td>第 4.6 条</td>\n<td>\"未经我们及相关权利人<strong>书面许可</strong>，您<strong>不得转售本服务及平台内模型</strong>\"</td>\n</tr>\n<tr>\n<td><strong>腾讯混元</strong></td>\n<td>第 2.6(6) 条</td>\n<td>\"未经腾讯云事先书面同意，不得通过出租、出借、出售、分销、转售或转让等其他方式向第三方提供本服务或<strong>本服务的 API Token</strong>\"</td>\n</tr>\n<tr>\n<td><strong>智谱</strong></td>\n<td>用户协议七条 3 款；GLM Coding Plan 团队套餐协议六条 2 款</td>\n<td>\"不得将 GLM Coding Plan 以<strong>转售、代售、转包装、聚合转发</strong>等方式向任何第三方提供\"；\"不得以共享账号、出租、出借……使他人实际使用\"</td>\n</tr>\n</tbody>\n</table>\n<p><strong>智谱的\"聚合转发\"四个字，是目前检索到的唯一直接以我们这种业态为规制对象的措辞。腾讯的\"本服务的 API Token\"同样没有解释空间。</strong></p>\n<p><strong>这意味着</strong>：如果我们只是拿标准商用账号去转卖阿里/腾讯/智谱的额度，<strong>在协议层面已经构成违约</strong>。厂商可依约随时终止，且参照同类条款的通行做法，<strong>可能不退未消耗余额</strong>。</p>\n<h3>9.2 但三家都留了同一个出口</h3>\n<p><strong>\"未经……书面许可/同意\"——这不是禁止业态，是要求逐案授权。</strong></p>\n<p>可行路径只有一条：<strong>走各家的官方渠道/经销/ISV 合作，签订书面转售授权。</strong> 这与模块 02 第一条业务线\"代理身份换信任\"的方向一致——<strong>但它把\"拿到官方代理资质\"从\"锦上添花\"变成了\"业务合法性的前提\"</strong>。这是定性的变化。</p>\n<h3>9.3 结构性困境</h3>\n<p><strong>协议允许我们转售的厂商，数据条款差到我们没法对下游承诺；数据条款好的厂商，恰恰明确禁止我们转售。</strong></p>\n<table>\n<thead>\n<tr>\n<th>厂商</th>\n<th>默认是否用于训练</th>\n<th>有无关闭开关</th>\n<th>转售限制</th>\n<th>对我们的可用性</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>腾讯混元</strong></td>\n<td><strong>否</strong>（4.2 条明确承诺）</td>\n<td>无需</td>\n<td><strong>明确禁止</strong>（点名 API Token）</td>\n<td>数据条款最优，但必须拿书面授权</td>\n</tr>\n<tr>\n<td><strong>阿里云百炼</strong></td>\n<td>标准 API <strong>否</strong>（6.2.5）；<strong>Token Plan 个人版 / Coding Plan 是</strong>（5.2.2）</td>\n<td><strong>无，只能停用，且已用数据不可撤回</strong></td>\n<td><strong>明确禁止</strong>（4.6）</td>\n<td>需区分产品线；须拿书面授权</td>\n</tr>\n<tr>\n<td><strong>智谱</strong></td>\n<td><strong>是</strong>（用户协议四条 10 款，\"匿名数据机器学习/模型算法训练\"）</td>\n<td><strong>无</strong></td>\n<td><strong>最严</strong>（点名聚合转发）</td>\n<td>通用 API 数据条款差；团队版承诺不训练但禁止代持</td>\n</tr>\n<tr>\n<td><strong>Kimi</strong></td>\n<td><strong>是</strong>（六条 3 款，直接授予免费使用权用于\"模型服务优化\"）</td>\n<td><strong>无</strong></td>\n<td><strong>最宽松</strong>：三条 1 款\"仅供您内部使用<strong>或向最终用户提供服务</strong>\"</td>\n<td><strong>唯一正面许可服务终端用户，但数据条款最差</strong></td>\n</tr>\n<tr>\n<td><strong>DeepSeek</strong></td>\n<td>平台协议<strong>沉默</strong>；隐私政策称\"可能会用\"</td>\n<td>App 内有，<strong>API 侧未检索到</strong></td>\n<td><strong>未见禁止</strong></td>\n<td>可转售，但<strong>无法向下游书面证明任何事</strong>；且把备案与内容审核义务全压给我们</td>\n</tr>\n<tr>\n<td><strong>火山方舟</strong></td>\n<td>⚠️ 二手：通用 API 否；Coding Plan <strong>永久授权且不可撤回</strong></td>\n<td>未核实</td>\n<td><strong>未获取</strong></td>\n<td>⚠️ 协议正文不可公开抓取，<strong>须登录核实</strong></td>\n</tr>\n<tr>\n<td><strong>百度千帆</strong></td>\n<td><strong>未获取</strong></td>\n<td><strong>未获取</strong></td>\n<td><strong>未获取</strong></td>\n<td>⚠️ 协议正文不可公开抓取，<strong>须登录核实</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>9.4 与国际厂商的差距（会成为企业客户的谈判筹码）</h3>\n<ul>\n<li><strong>OpenAI</strong>：API 数据默认不用于训练（2023-03-01 起），留存 <strong>最长 30 天</strong>，可申请 <strong>零数据留存（ZDR）</strong>；微调模型\"<strong>仅供你使用，绝不提供给其他客户或用于训练其他模型</strong>\"。</li>\n<li><strong>Anthropic</strong>：留存数据未经明确许可<strong>绝不用于训练</strong>；ZDR 可按组织开通；分场景留存期明确到天。</li>\n</ul>\n<p><strong>三处差距，企业客户的合规部门一定会问：</strong></p>\n<ol>\n<li><strong>留存期限不可数化</strong>。国内除智谱团队版的 180 天欠费删除期外，<strong>全部是\"必需的最短期间\"这类不可验证的表述</strong>。</li>\n<li><strong>没有任何一家国内厂商提供 ZDR</strong>。这是结构性的——AIGC 暂行办法与网安法要求留存以备监管溯源，ZDR 与合规义务直接冲突。<strong>这个差距我们补不了，只能如实说明。</strong></li>\n<li><strong>微调权重的排他承诺全线缺失</strong>。国内没有一家做出\"你的微调模型不会被跨客户复用\"的书面承诺。阿里 7.3 把权属推给产品文档、未约定则\"协商\"；智谱只规定用户自担责；腾讯与 Kimi 完全不提。</li>\n</ol>\n<h3>9.5 立即行动项</h3>\n<ol>\n<li><strong>[最高优先级]</strong> 盘点当前已接入或计划接入的每一家上游，<strong>确认我们的账号类型是否被协议允许用于转售</strong>。存量违约状态越早发现越好。</li>\n<li><strong>启动官方渠道/经销资质的商务谈判</strong>，把\"书面转售授权\"作为业务合法性的前提，而不是可选项。</li>\n<li><strong>签约前必须索取\"渠道协议里的数据处理附录\"</strong>——公开协议的数据承诺（如阿里 6.2.5）<strong>未必自动传递给转售场景下的最终用户</strong>。这份文件公开完全检索不到，只能通过商务谈判获取。</li>\n<li><strong>登录核实火山方舟与百度千帆的协议正文</strong>（两家的文档站为 SPA，公开不可抓取）。火山的\"永久授权、技术上无法撤回\"若属实，影响重大。</li>\n<li><strong>把\"上游数据条款\"做成销售物料</strong>——这是我们做选型咨询的天然抓手，见第八节话术。</li>\n</ol>\n<hr />\n<h2>十、与既有模块的关系、冲突与修正</h2>\n<h3>10.1 与模块 02 §2.4 的一致性验证 ✅</h3>\n<p>模块 02 §2.4 在 2026-07 重新定位为：\"<strong>这条线要从'替客户建'改成'让客户自己建的东西跑得更省、更稳、更看得清'</strong>——我们提供脚手架和度量，客户保留领域知识与业务逻辑。\"</p>\n<p><strong>本模块的 L2 分级（单租户 RAG / 示例库 / 评测集）正是这个定位的技术实现。</strong> 而 L4（跨客户数据混用）<strong>直接违背</strong>它——把客户的领域知识收归我方，恰恰是 §2.4 明确放弃的方向。</p>\n<blockquote>\n<p><strong>两条独立的推理路径（一条从行业主张出发，一条从合规与技术出发）得出了同一个结论。这提高了 §2.4 定位的可信度。</strong></p>\n</blockquote>\n<h3>10.2 与模块 25 的一致性验证 ✅</h3>\n<p>模块 25 从硅基流动财务倒推出\"公有云 token 毛利率 −119%，不做自建供给\"。</p>\n<p><strong>本模块 §5.2 从完全不同的路径（阿里云公开的实例价 vs API 价）得出了同构的结论</strong>：32B 独占实例打平点约 502 亿 token/月，而物理吞吐上限约 78 亿 token/月，<strong>差 6 倍</strong>。</p>\n<p><strong>两条独立路径互相印证：在我们这个体量上，任何形式的\"持有推理资产\"都不成立。</strong> 模块 25 的四阶段路线图（先转售 → 租用 → 小规模采购 → 扩张）同样适用于 L3 微调托管——<strong>L3 的重估触发条件（7.1 节）本质上就是模块 25 阶段 1 的条件在数据场景下的翻译。</strong></p>\n<h3>10.3 对模块 18「脱媒」威胁的补充</h3>\n<p>模块 18 第五节把\"厂商向应用层上行导致的脱媒\"列为首要威胁。<strong>直觉上，持有客户数据能增加粘性、对抗脱媒。本模块否定了这个直觉的一半：</strong></p>\n<ul>\n<li>❌ <strong>模型权重不是有效的粘性资产</strong>——经济性不成立（打平点高于物理吞吐），且客户可举证追责（成员推理 AUC 0.938）。</li>\n<li>✅ <strong>评测集、路由策略、成本基线、可观测性数据才是</strong>——它们随客户业务演进而增值，迁移时需要重建，且<strong>完全在委托处理关系内，没有法律敞口</strong>。</li>\n</ul>\n<blockquote>\n<p><strong>修正后的表述</strong>：对抗脱媒的资产不是\"我们拥有客户的数据\"，而是\"<strong>客户在我们这里积累了他自己都还没来得及沉淀的运营知识</strong>\"。前者是占有，后者是共建——<strong>后者的粘性更强，因为它不引发对抗</strong>。</p>\n</blockquote>\n<h3>10.4 对模块 08（合规与风险控制）的新增要求</h3>\n<p>模块 08 现有内容覆盖备案号公示与 6 个月日志留存。本模块新增五项：</p>\n<ol>\n<li><strong>《网络数据安全管理条例》第 28 条的 1000 万人门槛</strong>——跨所有客户合并计算，聚合网关很容易触及，触及即适用重要数据处理者的组织架构与报告义务。</li>\n<li><strong>《个人信息保护合规审计管理办法》（2025-05-01 施行）第 4 条</strong>——处理 1000 万人以上的，<strong>每两年至少一次合规审计</strong>。</li>\n<li><strong>委托处理的记录保存 ≥3 年</strong>（《网络数据安全管理条例》第 12 条）。</li>\n<li><strong>PIA 是法定前置义务</strong>（PIPL 第 55 条），委托处理、向第三方提供、处理敏感个人信息、出境均触发。</li>\n<li><strong>纠正一处潜在误用</strong>：网安法的 6 个月日志留存指网络运行日志，<strong>不能用来给\"保留全量对话内容\"背书</strong>。</li>\n</ol>\n<h3>10.5 待修正项（本模块产生，需在其他模块执行）</h3>\n<table>\n<thead>\n<tr>\n<th>目标模块</th>\n<th>修正内容</th>\n<th>状态</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>00 · 模块地图</td>\n<td>新增模块 26 行</td>\n<td>✅ 已执行</td>\n</tr>\n<tr>\n<td>00 · 修正留痕</td>\n<td>记录 10.3 的脱媒资产表述修正、10.6 的转售条款发现</td>\n<td>✅ 已执行</td>\n</tr>\n<tr>\n<td>02 · 2.4</td>\n<td>补充指针：L2 分级是该定位的技术实现路径</td>\n<td>✅ 已执行</td>\n</tr>\n<tr>\n<td>08 · 合规</td>\n<td>并入 10.4 的五项</td>\n<td>⬜ <strong>待执行</strong>（下一版）</td>\n</tr>\n<tr>\n<td>18 · 五</td>\n<td>修正脱媒对抗资产的表述</td>\n<td>⬜ <strong>待执行</strong>（下一版）</td>\n</tr>\n<tr>\n<td>02 · 业务线一/三</td>\n<td><strong>转售条款风险须并入</strong>，这是业务合法性前提的定性变化</td>\n<td>⬜ <strong>待执行，最高优先级</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>10.6 一条必须记入留痕的认知变化</h3>\n<p><strong>原有的隐含假设</strong>：我们作为中间层，只要与客户签好合同，转售上游 API 在法律上是干净的。</p>\n<p><strong>被证伪</strong>：阿里 4.6、腾讯 2.6(6)、智谱七条 3 款+团队协议六条 2 款均明确禁止未经书面许可的转售，智谱直接点名\"<strong>聚合转发</strong>\"、腾讯直接点名\"<strong>API Token</strong>\"。</p>\n<p><strong>修正为</strong>：<strong>官方渠道/经销书面授权不是\"锦上添花的信任背书\"，而是业务合法性的前提。</strong> 没有它，第一条和第三条业务线在协议层面处于违约状态。</p>\n<hr />\n<h2>十一、观察指标与复核触发条件</h2>\n<table>\n<thead>\n<tr>\n<th>指标</th>\n<th>当前值</th>\n<th>复核触发</th>\n<th>影响</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>上游缓存读价折扣</td>\n<td>0.1×（Anthropic/DeepSeek/阿里）/ 0.5×（OpenAI）</td>\n<td>折扣收窄至 0.5× 以上</td>\n<td>L0 的核心收益来源，收窄则需重估优先级</td>\n</tr>\n<tr>\n<td>4B 级模型质量</td>\n<td>未验证</td>\n<td>出现能替代 32B 的 4B 级模型</td>\n<td>L3 经济性可能翻转（打平点降一个量级）</td>\n</tr>\n<tr>\n<td>独占实例月价</td>\n<td>Qwen3-32B ¥52,236/月</td>\n<td>降至 API 打平点以下</td>\n<td>同上</td>\n</tr>\n<tr>\n<td>监管执法</td>\n<td>未见\"训练同意\"类处罚案例</td>\n<td>出现首例</td>\n<td>L3 的风险定价需上调</td>\n</tr>\n<tr>\n<td>上游转售条款</td>\n<td>三家明确禁止</td>\n<td>任一家出台公开的渠道数据附录</td>\n<td>§9 的行动项优先级</td>\n</tr>\n<tr>\n<td>国内厂商 ZDR</td>\n<td>无一提供</td>\n<td>出现首家</td>\n<td>§8 话术与合规差距叙事需更新</td>\n</tr>\n<tr>\n<td>同行产品形态</td>\n<td>无人做跨客户微调</td>\n<td>出现首家且未被处罚</td>\n<td>需重新评估 L4 判断（<strong>但商业秘密问题独立存在，不因此松动</strong>）</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>十二、核心来源</h2>\n<p><strong>法律法规与标准</strong>\n- 《个人信息保护法》 https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm\n- 《生成式人工智能服务管理暂行办法》 https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm\n- 《网络数据安全管理条例》（2025-01-01 施行） https://www.cac.gov.cn/2024-09/30/c_1729384452307680.htm\n- 《个人信息保护合规审计管理办法》（2025-05-01 施行） https://www.cac.gov.cn/2025-02/14/c_1741233507681519.htm\n- <strong>GB/T 45654—2025《生成式人工智能服务安全基本要求》</strong>（2025-11-01 实施） https://www.tc260.org.cn/portal/article/1/20250630122232\n- 「清朗·整治 AI 应用乱象」专项行动（2026-04-30） https://www.cac.gov.cn/2026-04/30/c_1779289298718765.htm</p>\n<p><strong>上游厂商协议</strong>\n- 阿里云百炼服务协议 https://terms.alicdn.com/legal-agreement/terms/common_platform_service/20230728213935489/20230728213935489.html\n- 腾讯混元大模型服务条款 https://cloud.tencent.com/document/product/301/97822\n- 智谱用户协议 https://docs.bigmodel.cn/cn/terms/user-agreement ｜ GLM Coding Plan 团队套餐协议 https://docs.bigmodel.cn/cn/terms/subscription-agreement-team\n- Kimi 开放平台服务协议 https://platform.kimi.com/docs/agreement/modeluse\n- DeepSeek 开放平台服务协议 https://cdn.deepseek.com/policies/zh-CN/deepseek-open-platform-terms-of-service.html ｜ 隐私政策 https://cdn.deepseek.com/policies/zh-CN/deepseek-privacy-policy.html\n- OpenAI Enterprise Privacy https://openai.com/enterprise-privacy/ ｜ Anthropic Data Retention https://platform.claude.com/docs/en/manage-claude/api-and-data-retention</p>\n<p><strong>技术证据</strong>\n- Fine-Tuning or Retrieval?（EMNLP 2024） https://aclanthology.org/2024.emnlp-main.15.pdf\n- LoRA Learns Less and Forgets Less（TMLR 2024） https://arxiv.org/abs/2405.09673\n- Quantifying Memorization Across Neural Language Models（ICLR 2023） https://arxiv.org/pdf/2202.07646\n- Scalable Extraction of Training Data from Production LMs https://arxiv.org/html/2311.17035v1\n- SPV-MIA（NeurIPS 2024） https://fi.ee.tsinghua.edu.cn/~gaochen/papers/SPV-MIA.pdf\n- RouteLLM（LMSYS） https://www.lmsys.org/blog/2024-07-01-routellm/\n- vLLM 推测解码实测 https://vllm.ai/blog/2024-10-17-spec-decode\n- <strong>OpenAI 2023-03-20 事故官方报告</strong> https://openai.com/index/march-20-chatgpt-outage/\n- 阿里云百炼训练与部署计费 https://developer.aliyun.com/article/1734727 ｜ 模型价格 https://help.aliyun.com/zh/model-studio/model-pricing</p>\n<p><strong>同行产品</strong>\n- Cloudflare AI Gateway 缓存 https://developers.cloudflare.com/ai-gateway/features/caching/\n- Portkey 缓存 https://portkey.ai/docs/product/ai-gateway/cache-simple-and-semantic\n- LangSmith 动态 few-shot https://docs.smith.langchain.com/evaluation/how_to_guides/index_datasets_for_dynamic_few_shot_example_selection\n- OpenPipe https://docs.openpipe.ai/introduction</p>\n<hr />\n<h2>十三、明确的检索空白（禁止在此处外推）</h2>\n<ol>\n<li><strong>未检索到</strong>中国境内以\"未经单独同意将用户数据用于模型训练\"为主要案由的公开处罚/约谈案例（2024–2026）。</li>\n<li><strong>未检索到</strong>任何法律法规明文规定\"训练数据变更须重新备案\"；仅有\"重大变更\"的概括表述。</li>\n<li><strong>未检索到</strong>网信办对\"调用境外大模型 API 是否构成数据出境\"的明文界定。业界主流理解是构成出境，属解读。</li>\n<li><strong>未检索到</strong> embedding / 向量是否构成个人信息的官方口径。保守按个人信息处理。</li>\n<li><strong>未获取</strong>火山方舟与百度千帆的协议正文（文档站为 SPA，需登录）。§9.3 表中两家的信息为二手或空缺。</li>\n<li><strong>未检索到</strong>因<strong>模型训练</strong>导致跨企业客户数据吐出的公开确认案例。（三星事件性质不同，见 6.4。）</li>\n<li><strong>未检索到</strong> RAG 在真实企业生产环境的准确率提升幅度（可信数字全部来自学术论文）。</li>\n<li><strong>未检索到</strong>模型路由器自身开销计入后的<strong>净</strong>延迟改善。</li>\n<li><strong>未检索到</strong>国内 GPU 租用的一手价目表。§5 全部以云厂商公开按 token 价为基准。</li>\n</ol>", "plain": " 26 · 客户数据能不能用：合规边界、技术现实与分级方案\n\n 版本 v1.0 ｜ 撰写日期：20260728 ｜ 密级：内部核心 · 决策层与技术负责人\n 触发问题：「在做这个业务的过程中，我们能否通过客户授权使用客户的对话记录，提升大模型的准确性和智慧能力，进一步提升 AI 对客户的反应速度和准确性？」\n 关联模块：02（业务线定位）· 04（单位经济模型）· 08（合规与风控）· 18（战略推演）· 21（选型方法论）· 25（Token 工厂）\n\n\n\n 一、先给结论\n\n这个问题的答案是\"能，但你想做的那件事不能做，而真正能做的那件事不需要动模型权重\"。\n\n拆成三句：\n\n1. 不要用客户对话去微调模型。 不是因为不合规（虽然确实很难合规），而是因为它解决不了你想解决的问题。客户抱怨的\"不准\"绝大多数是事实性错误，而学术证据显示微调在注入事实知识上收益极弱、甚至为负——Llama27B 在全新知识任务上微调后准确率从 0.353 掉到 0.219，而同一任务上 RAG 是 0.585。你会花一个数量级的钱，换一个可能更差的模型，外加一个客户能举证、你无法自证的法律敞口。\n\n2. 绝对不要做跨客户的数据混用。 这是本模块唯一的红线级禁令。它同时踩三条线：法律上无法履行 PIPL 第 23 条的告知义务（接收方名单动态且不可枚举）、商业上侵犯客户商业秘密、技术上有可被举证的泄露路径（对微调模型的成员推理攻击 AUC 已达 0.938）。\n\n3. 真正能提升\"速度和准确性\"的前三条路径，完全不需要读客户对话内容。 上游 prompt caching 对齐（缓存读价 0.1 倍，是合同确定的价差，不依赖任何模型质量假设）、网关自身链路优化（唯一 100% 由我们掌控的延迟）、精确缓存（哈希级，不需理解内容）。先把这三条做完，再谈其他。\n\n一句话版本：把\"数据 → 模型权重\"这条路封死，把\"数据 → 评测集 / 示例库 / 路由策略\"这条路做深。前者是幻觉，后者才是护城河。\n\n\n\n 二、这个问题的真正枢纽：我们在法律上是谁\n\n大多数人把这个问题想成\"客户授权了没有\"。这是错的。真正的枢纽是：在每一种用法下，我们的法律身份会不会从\"受托处理者\"翻转成\"独立的个人信息处理者\"。\n\n 2.1 两种身份，两套义务\n\n 维度  受托处理者（PIPL 第 21 条）  独立处理者 / 向第三方提供（PIPL 第 23 条） \n\n 判定标准  无独立处理目的，按委托方指令处理  自主决定处理目的、处理方式（第 73 条第一项） \n 是否需要单独同意  不需要  必须取得终端用户的单独同意，并逐项告知我方名称、联系方式、处理目的、处理方式、个人信息种类 \n 合同要求  必须写全六要素：委托目的、期限、处理方式、个人信息种类、保护措施、双方权利义务  需按《网络数据安全管理条例》第 12 条约定目的、方式、范围及安全义务 \n 转委托  未经委托方同意不得转委托——我们把数据转给上游厂商属转委托  — \n 合同终止后  必须返还或删除，不得保留  可依自身合法基础留存 \n 事前 PIA  需要（第 55 条第三项）  需要（第 55 条第三项） \n\n关键机制：身份翻转不以合同怎么写为准，以实际处理目的为准。把跨客户知识库包装成\"受客户委托构建\"是无效的形式包装——我们是在为自己和其他客户的利益使用 A 客户的数据，独立处理目的板上钉钉。锦天城的分析明确要求\"进行实质认定，而非形式上的判断\"。\n\n 2.2 客户企业无权替它的终端用户授权\n\n这是整件事最反直觉、也最容易搞错的一点。\n\n我们的合同相对方是客户企业。但对话记录里的个人信息，主体是客户的终端用户。PIPL 第 13、14 条要求的是\"个人的同意\"、\"由个人在充分知情的前提下自愿、明确作出\"。\n\n所以：\n\n 如果我们是受托处理者，客户的授权是有效的——因为它授权的只是\"替我干活\"，数据在法律上仍由客户控制。\n 如果我们要自主使用数据（微调、跨客户库），客户在商务合同里写的\"我保证已取得授权\"只是一项民事担保。它给我们一个向客户追偿的依据，但不能免除我们自身的行政责任——PIPL 第 66 条的责任是按各自的处理者身份独立追究的。\n\n换句话说：客户签的那张纸，在监管面前保护不了我们。\n\n 2.3 「概括授权」为什么不够——四条独立理由，任何一条都足以否定它\n\n1. 主体不对。合同相对方是企业，不是个人信息主体。\n2. 形式不对。《网络数据安全管理条例》第 62 条定义单独同意为\"针对其个人信息进行特定处理而专门作出具体、明确的同意\"。一揽子条款不满足\"专门\"。\n3. 告知不足。第 23 条要求告知接收方名称、联系方式。终端用户在客户的 App 里根本不知道\"我们\"的存在。\n4. 捆绑同意被禁止。《网络数据安全管理条例》第 22 条禁止以不同意为由拒绝提供服务（必需除外）。把\"同意用于训练\"与\"能否使用服务\"绑定，直接踩线。\n\n另有 PIPL 第 14 条第二款：处理目的、方式、种类发生变更的，应当重新取得个人同意。从\"为提供推理服务而传输\"变更为\"用于训练\"，是典型的目的变更——即便原授权有效，也需要重新取得同意。\n\n 2.4 一条必须纠正的常见误读\n\n网上大量材料把《生成式人工智能服务管理暂行办法》第十一条读作\"禁止将用户输入用于训练\"。这个读法在条文上站不住。\n\n第十一条原文是：不得\"非法留存能够识别使用者身份的输入信息和使用记录\"、不得\"非法向他人提供使用者的输入信息和使用记录\"。\n\n\"非法\"二字把判断标准指回了 PIPL。 第十一条本身不是训练用途的禁止性规定，它的作用是让 PIPL 的违法后果同时构成 AIGC 规章项下的违法（可被责令暂停服务）。\n\n但它有一处对我们直接命中：我们把对话记录转给上游模型厂商用于其训练，属于\"向他人提供使用者的输入信息和使用记录\"，必须有合法基础，否则即\"非法提供\"。这一条与 2.1 表中\"转委托需委托方同意\"叠加，构成上游对接的双重约束。\n\n 2.5 另一条容易被用错的论证\n\n不要用《网络安全法》\"日志留存不少于六个月\"给\"保留全量 prompt/completion\"做合规背书。网安法留存的是网络运行日志，不是对话内容。 这两者混为一谈，是内部文件里常见的错误论证，在监管检查时会成为反证。\n\n\n\n 三、三种用法的合规判定\n\n把问题拆成三种用法，难度排序是 (b) ≫ (a)  (c)。\n\n (c) 单客户内部的缓存、检索增强、提示优化 —— 难度：低，这是唯一可规模化落地的路径\n\n为什么低：数据不出客户边界、不改变处理目的、我们不为自身目的使用 → 稳稳留在第 21 条委托处理关系内，不触发第 23 条。\n\n四个可工程化解决的卡点：\n\n1. 委托合同必须按第 21 条写全六要素；处理情况记录至少保存 3 年（《网络数据安全管理条例》第 12 条）。\n2. 严格的租户隔离——缓存、向量库、提示模板必须按客户物理/逻辑隔离。一旦 A 客户的缓存命中 B 客户的请求，性质立刻变成 (b)。这是架构上最容易\"滑坡\"的地方，见第六节。\n3. 转委托限制：把数据转给上游厂商须获客户明确同意，并向下背靠背传导义务。\n4. 合同终止后必须返还或删除，不得保留——缓存、embedding、索引都要有可验证的删除机制。（embedding 是否属于个人信息目前无明确条文，保守做法是按个人信息处理。）\n\n (a) 用客户对话做微调 —— 难度：高，路径存在但成本极高\n\n按阻塞强度排序的十个卡点：\n\n   卡点  依据 \n\n 1  终端用户的单独同意，不是客户企业的授权  PIPL 第 23 条 \n 2  处理目的变更需重新取得同意  PIPL 第 14 条第二款 \n 3  敏感个人信息的第二重单独同意，而我们无法事先识别哪条 prompt 含敏感信息  PIPL 第 28、29、30 条；GB/T 456542025 §4.2.3 \n 4  须持有终端用户级的\"使用者授权记录\"  GB/T 456542025 §4.1.3 d) \n 5  须提供便捷的关闭选项（≤4 次点击）并显著告知——但我们不直接触达终端用户 UI，这是合规链条上的结构性断点  GB/T 456542025 §6.3 \n 6  身份跃迁：从\"纯转售走登记\"变成\"训练/二次开发模型\"，需走大模型备案 + 安全评估  暂行办法第 17 条 \n 7  训练前须做语料抽样安全评估（违法不良信息 5% 不得使用）  GB/T 456542025 §4.1.1 \n 8  事前 PIA；处理 1000 万人以上还需两年一次合规审计  PIPL 第 55、56 条；《个人信息保护合规审计管理办法》第 4 条 \n 9  删除权无法履行——模型权重中的信息无法定向删除，法律尚无豁免条文  PIPL 第 47 条 \n 10  若在海外算力上微调 → 叠加 PIPL 第 38、39 条出境路径与第二道单独同意  — \n\n 第 5 条是最要命的：GB/T 456542025 明确要求提供关闭开关且\"从服务主界面开始到达该选项所需操作不超过 4 次点击\"。我们是中间层，没有终端用户界面。这个义务只能靠客户侧实现，而我们无法验证客户是否真的实现了。 这意味着 (a) 用法的合规性永远建立在一个我们控制不了的环节上。\n\n (b) 跨客户共享的知识/示例库 —— 红线，不做\n\n(b) 承担 (a) 的全部卡点，并额外叠加三层：\n\n1. 二次触发第 23 条。把 A 客户的对话做成示例库供 B 客户调用，是把 A 的终端用户个人信息提供给了 B。需要向 A 的终端用户告知\"接收方 B 的名称、联系方式\"——在多租户网关上，接收方名单是动态的、不可枚举的，这个告知义务在结构上无法履行。 不是难，是不可能。\n2. 若示例库可检索/可见，可能进一步触发 PIPL 第 25 条（公开个人信息需单独同意）。\n3. 商业秘密与竞业冲突。客户 prompt 里的业务逻辑、内部数据、代码命名是客户的商业秘密。跨客户共享与个人信息问题无关地独立构成违约与不正当竞争风险。即便所有个人信息都清理干净，这一条依然成立。\n\n唯一相对可行的改造：不使用原始对话，只沉淀经我方人员人工抽象、不含任何客户业务内容与个人信息的通用方法论（例如\"这类任务适合用 XX 提示结构\"）。此时它不再是个人信息处理，问题转化为商业秘密与合同问题。\n\n注意：靠\"匿名化\"把原始对话洗成共享库的方案不成立。 见 3.1。\n\n 3.1 为什么\"匿名化\"不是出口\n\nPIPL 第 73 条把两个概念分得很清楚：\n\n 去标识化：不借助额外信息无法识别特定自然人。仍然是个人信息，全部 PIPL 义务继续适用。\n 匿名化：无法识别且不能复原。不再是个人信息（第 4 条明确\"不包括匿名化处理后的信息\"）。\n\n差别在\"可复原性\"——去标识化保留了钥匙（哪怕锁在另一个库），匿名化要求钥匙被销毁且不可能重建。\n\n对话自由文本实操上做不到匿名化，四条理由：\n\n1. 准标识符不可穷举。\"我在 XX 医院看的 XX 科\"\"上周三从上海飞成都\"这类描述，正则和 NER 无法保证召回。\n2. 稀有组合仍可重识别。独特的业务背景、内部命名、罕见病症组合都可能定位到唯一个人。\n3. 模型记忆化使\"不能复原\"的假设失效——去标识化后的语料进入训练，模型仍可能逐字复现。\n4. 我们不掌握客户的上下文，无法评估重识别风险——而这恰恰是判断是否达到匿名化的前提。\n\n 纪律：把\"我们做了脱敏\"定位为降低风险的安全措施，绝不作为免除同意义务的法律主张。对外宣称\"已匿名化因此无需同意\"，在监管检查时是高风险陈述。\n\n 3.2 对话记录里哪些内容会触发敏感个人信息\n\nPIPL 第 28 条列举：生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹，以及不满十四周岁未成年人的全部个人信息。\n\n 客户类型  高频触发内容 \n\n 医疗健康、保险  问诊描述、检验报告文本 \n 金融、客服机器人  卡号、余额、还款记录、征信描述 \n 政企、人力  身份证号、职业资格、党派/军人身份 \n 出行、物流  地址、行程单、定位描述 \n 多模态场景  人脸图片、声纹片段 \n 教育、陪伴、玩具  这类客户的全部对话都需按敏感个人信息 + 监护人同意处理 \n\n 结构性难题：我们无法事先知道某一条 prompt 是否含敏感个人信息，因此不能按\"分类型分别取同意\"设计产品。只有两条路：要么按最高标准（全部按敏感处理），要么入库前强制过滤并接受残余风险。\n\n 3.3 罚则与执法现状\n\n PIPL 第 66 条：一般情形拒不改正处 100 万元以下；情节严重的，处 5000 万元以下或上一年度营业额 5% 以下，可责令停业整顿、吊销营业执照；直接责任人 10 万–100 万元并可禁业。已知最高罚单：知网 5000 万元。\n 《网络安全法》2025 修正版（20260101 施行） 罚则大幅提高，特别严重情形 200 万–1000 万元。\n 《网络数据安全管理条例》第 28 条：处理 1000 万人以上个人信息的，须适用重要数据处理者的组织架构与报告义务。聚合网关的终端用户基数很容易触及这个门槛，且是跨所有客户合并计算的。\n\n执法现状——这一条必须如实记录：\n\n ⚠️ 本次检索未找到中国境内任何一起以\"未经单独同意将用户对话数据用于模型训练\"为主要案由的公开行政处罚或约谈案例（2024–2026）。请勿在任何内部或对外材料中援引不存在的案例。\n\n但方向是明确的：2026 年 4 月 30 日部署的\"清朗·整治 AI 应用乱象\"专项行动，已把\"模型训练过程中使用未经授权的文字、图片、音视频等数据\"明文写入整治清单。 监管当前的主抓手仍是\"备案/登记\"和\"语料来源合法性\"，但风险窗口正在收窄。\n\n\n\n 四、技术现实：想提升的东西，微调恰恰做不到\n\n即便合规问题全部解决，这条路在技术上也是错的。 这一节的证据比合规部分更有决定性，因为它不依赖任何法律解释。\n\n 4.1 微调 vs RAG：注入知识这件事，微调是输的\n\nOvadia 等人 EMNLP 2024 的对照实验（7B 级模型，0shot）：\n\n 任务  模型  Base  微调  RAG \n\n MMLUAnatomy  Mistral 7B  0.556  0.570  0.681 \n MMLUCollege Bio  Mistral 7B  0.681  0.701  0.757 \n 当前事件（全新知识）  Mistral 7B  0.481  0.504  0.875 \n 当前事件  Llama2 7B  0.353  0.219 ↓  0.585 \n 当前事件  Orca2 7B  0.456  0.511  0.876 \n\n三个读数：\n\n1. 在已有知识上，微调 +1~8.6pp，RAG +2~12.5pp，RAG 全面占优。\n2. 在全新知识上差距是数量级的：微调 +2.3~5.5pp，RAG +22~42pp。\n3. Llama27B 微调后从 0.353 掉到 0.219——这是\"微调注入事实知识反而更差\"的直接实证。\n\n还有一条对我们特别致命的发现：论文指出，要让微调真的学进新事实，必须提供同一事实的多个改写版本（Mistral 加改写后 0.504→0.588）。也就是说，我们手里的原始对话日志格式，恰恰是微调最学不进去的形态。 想用它就得先做大规模改写和标注，成本又翻一个量级。\n\n对照组：微软的农业案例（arXiv 2401.08406）结论更温和——微调 +6pp、RAG 再 +5pp、两者可叠加。但注意那里的微调数据是专门用 GPT4 生成的 QA 对，不是原始日志。\n\n 工程结论：微调有用的场景是教格式、教风格、教任务范式，不是教事实。而客户抱怨的\"不准\"，绝大部分属于后者。\n\n 4.2 LoRA 的取舍：学得少，忘得也少\n\nLlama27B 上的实测（TMLR 2024）：\n\n 指标  全参微调  LoRA r=256  LoRA r=16 \n\n HumanEval（目标域）  0.497  0.498  0.358 \n 通用能力保留（代码微调后均值）  0.414  0.517  — \n\n全参微调把通用能力打到 0.414，LoRA 保住 0.51+，差约 10 个百分点——这是\"灾难性遗忘\"的量化代价。但代价是 LoRA 低秩时目标域性能显著落后（HumanEval 差 14pp）。在大规模继续预训练场景 LoRA 全面落后。\n\n另一项 1B–7B 的实证研究发现：在这个区间，模型越大遗忘越严重。\n\n 4.3 各路径的真实收益对照\n\n 路径  准确率收益  延迟收益  证据口径 \n\n 上游 prompt caching  —  DeepSeek 报 128K prompt TTFT 13s→500ms（极端最佳情况）  厂商合同价：读价 0.1×（Anthropic/DeepSeek/阿里）或 0.5×（OpenAI） \n 精确缓存  无风险  命中 <5ms vs 未命中 2–5s  二手 \n 模型路由  保持 95% 强模型性能  通常降低 TTFT，但路由器自身开销未计净值  成本降 35%（GSM8K）/ 45%（MMLU）/ 85%（MT Bench） \n 提示词优化（DSPy 类）  HotPotQA +3.8~5.9pp；GSM8K +20~47pp  通常恶化（prompt 变长）  实验室 \n RAG  新知识 +22~42pp；已有知识 +2~12.5pp  增加检索延迟  实验室 \n 语义缓存  损害准确率：2.7%~7.5% 的命中是错的  命中时 <5ms  合成实验 + 二手 \n 推测解码  —  QPS=1 时 1.5–2.8× 加速；高 QPS 反而慢 1.4–1.8×  vLLM 官方实测 \n 跨客户混合微调  注入事实知识为负收益  —  见 4.1 \n\n三条必须记住的口径警告：\n\n1. RouteLLM 的\"85% 成本下降\"只在 MT Bench 上成立。 MT Bench 是主观对话评分基准，有大量弱模型也能答好的闲聊。换到知识密集（MMLU）和推理密集（GSM8K）任务，同一路由器只能省 45% 和 35%。对客户宣传时用 35%–45% 这个区间，不要用 85%。\n2. DSPy 的 +47pp 来自 GSM8K，基线只有 33.1%。 在更接近真实检索问答的 HotPotQA 上，增益回落到 +3.8~5.9pp。\n3. 语义缓存的命中率被严重夸大。 生产口径下：FAQ/客服 40–60%，内部知识库 30–45%，开放式聊天 10–20%，代码生成 5–15%。我们的真实流量结构大概率偏向后两者。现实区间是 5%–25%，不是营销材料里的 60%+。\n4. 推测解码对我们基本无关——不仅高并发下会变慢，更根本的是我们调用上游 API，推理栈不在自己手里，除非自托管否则无从实施。\n\n 4.4 响应速度到底由什么决定\n\nTTFT 的构成，按影响排序：Prompt 长度（prefill 计算量正比于输入长度） 系统负载/排队延迟  prefill 计算本身。\n\n但对我们还要叠加我们自己能控制的部分：网关到上游的网络 RTT、TLS 握手、鉴权/计费/日志中间件的同步开销、连接池复用率。\n\n 这是唯一 100% 由我们掌控的延迟。第 0 步应该是测量它占端到端 TTFT 的比例——没有这个数字，其他所有优化的收益都是猜的。\n\n\n\n 五、成本账：训练很便宜，托管很贵\n\n这一节的结论与模块 25（Token 工厂）完全一致，而且是从另一条路径独立得出的。\n\n 5.1 训练成本根本不是瓶颈\n\n阿里云百炼公开训练价格（按 token 计费，含算力）：Qwen38B 6 元/百万 token，Qwen332B 40 元/百万，Qwen2.572B 150 元/百万。\n\n推算（我方计算，非厂商数据）：一次典型 LoRA 微调用 5000 万 token（约 5 万条对话 × 1000 token × 2–3 epoch）：\n\n 模型规模  单次微调成本 \n\n 8B 级  约 300 元 \n 32B 级  约 2,000 元 \n 72B 级  约 7,500 元 \n\n即使跑 10 轮超参搜索，也在几千到十万元量级。训练便宜到可以忽略。\n\n 5.2 推理托管才是成本杀手\n\n阿里云百炼独占实例：Qwen332B 预付费 ¥52,236/月（后付费 ¥108/小时）。\n\n对照 API 调用价：QwenPlus 最低档 ¥0.8 输入 / ¥2 输出（每百万 token）。\n\n打平点推算（我方计算，输入输出比 4:1，混合均价 ¥1.04/百万 token）：\n\n\n月固定成本 52,236 元 ÷ 1.04 元/百万 token ≈ 502 亿 token/月\n                                        ≈ 16.7 亿 token/天\n\n\n但这里有一个更硬的约束：一个 32B 独占实例的物理吞吐上限。即便乐观假设持续 3,000 tokens/s 且利用率 100% 无空闲：\n\n\n3,000 × 86,400 × 30 ≈ 78 亿 token/月\n\n\n78 亿 < 502 亿，差约 6 倍。\n\n 结论：按公开价格，为一个微调后的 32B 模型做独占部署，在物理上就不可能比直接调用同级 API 便宜。 不是利用率不够的问题，是打平点高于物理吞吐上限。除非（a）微调后能降到 4B 级还保持质量，或（b）流量是单一窄任务且能压到接近满载——这两个条件都必须先验证，不能假设。\n\n 5.3 一个反向的价格信号\n\nOpenAI 定价页显示：微调后模型推理开启数据共享时 $2/$8 每百万 token，比基础模型的 $4/$16 便宜一半。\n\n这个折扣结构本身就是答案：数据的商业价值，上游厂商定价为\"推理费五折\"。 如果连 OpenAI 都只愿意为数据出这个价，我们自己囤数据的估值应该更保守。\n\n 5.4 对照：真正划算的那条路\n\n语义缓存基础设施成本：embedding 约 $0.02/1M tokens，向量存储 $50–200/月，总计通常低于节省额的 5%。\n\n相对上述几万元/月的推理托管，这是两个数量级的差距。\n\n\n\n 六、风险：客户能举证，我们不能自证\n\n 6.1 记忆化是可测量的，不是理论担忧\n\nCarlini 等人的量化研究（ICLR 2023，GPTNeo / The Pile）：\n\n 模型规模每增加 10 倍，可提取记忆增加 19 个百分点（loglinear，R²=99.8%）。125M 模型约 5% 可提取，6B 模型约 40%。\n 重复次数决定性影响：训练集中重复 100 次的序列，6B 模型约 15% 可提取；重复 724–861 次，约 53% 可提取。\n 但论文明确指出：\"即使只重复几次，记忆化仍然发生\"——去重不能消除泄露。\n 上下文长度放大提取：给 50 token 上下文时 33% 可提取，给 450 token 时 65%。\n\n 直接映射到我们：客户的系统提示词、模板、固定话术、合同条款、内部知识片段在日志里天然高频重复，正好落在\"高重复 = 高可提取\"的区间。这不是小概率事件，这是结构性的。\n\n 6.2 生产模型上的实际提取攻击\n\nNasr、Carlini 等人对 ChatGPT（gpt3.5turbo） 的攻击：用 $200 的查询费用提取出超过一万条训练数据样本，作者估计再多花钱可提取 10 倍以上。\n\n关键洞察：用传统基线方法看，ChatGPT 显得比此前任何模型\"私密 50 倍\"——但\"发散攻击\"的提取率是基线的约 150 倍。也就是说，对齐只是掩盖了记忆，没有消除它。\n\n开源模型的逐字记忆率：GPTNeo 0.16%–0.24%，Pythia 0.45%–0.60%，RedPajama 0.77%–1.44%。\n\n 0.5% 听起来小，但在一个日处理十亿 token 的网关上，0.5% 是每天数百万 token 的逐字复现量。\n\n 6.3 成员推理：客户能举证，我们无法自证\n\nSPVMIA（NeurIPS 2024，专门针对微调过的 LLM）：\n\n 攻击  平均 AUC \n\n 最好的既有基线  0.744 \n SPVMIA  0.938 \n\nAUC 0.938 意味着：客户拿一段文本，判断\"这段是否在你的微调集里\"的准确度非常高。\n\n 这是本节最重要的一句话：客户 A 有技术手段证明它的数据进了我们的模型；我们没有任何技术手段证明它没进。 举证责任的不对称是结构性的，不是靠合同条款能平衡的。\n\n差分隐私救不了这一点。 DP 保护的是\"某条样本是否参与训练\"，而客户合同关心的是\"你有没有拿我的数据训练\"——这是目的限制问题，DP 不提供豁免。而且 DP 微调的\"低代价\"结论只在\"任务简单 + 有强预训练基座\"时成立；从零 DP 训练（ε=8）在 CIFAR10 上只有 62%，比非私有的 91.25% 低约 29 个百分点。\n\n 6.4 最有操作价值的一条：真实事故发生在网关层，不在模型层\n\n必须区分两类风险，因为对我们的启示完全不同：\n\n(a) 模型训练导致的跨客户数据吐出：未检索到公开确认的真实企业案例。\n\n ⚠️ 常被引用的三星事件不是这一类。那是员工主动把源代码和会议记录粘贴进 ChatGPT，属于数据外流，不是模型吐给了第三方。不要在内部材料中把它当作\"模型记忆泄露\"的证据。\n\n(b) 基础设施层的跨租户泄露：真实发生过，而且就发生在网关这一层。\n\nOpenAI 2023 年 3 月 20 日事故官方报告：\n\n 泄露内容：其他用户的聊天标题，以及 Plus 订阅者的姓名、邮箱、账单地址、信用卡类型、卡号后四位、有效期。\n 影响范围：该 9 小时窗口内活跃 Plus 订阅者的 1.2%。\n 根因：redispy 在 asyncio 下，请求被取消后连接状态污染，下一个无关请求收到了上一个用户的残留数据。\n\n 这是本模块对我们最有操作价值的一条结论：\n\n 真实世界里，网关/缓存/连接池层的跨租户串数据，比\"模型记住了训练数据\"发生得更早、更频繁、更容易。\n\n 一个共享的语义缓存，如果租户隔离做错，就是这次事故的翻版，而且是我们主动设计出来的。\n\n 硬性要求：缓存键必须包含租户 ID；必须建立跨租户命中的自动化检测与告警。这条写进技术评审清单，不可豁免。\n\n 6.5 行业事实：没有一家同行在做我们设想的那件事\n\n 厂商  缓存  是否用对话数据做优化 \n\n Cloudflare AI Gateway  仅精确匹配；文档明说\"计划未来加入语义搜索\"  无 \n Helicone  仅精确缓存（哈希请求体）  提供日志与实验功能 \n Portkey  精确 + 语义（cosine 阈值默认 0.95）  prompt 版本管理与 observability，未描述用生产日志自动优化 \n LiteLLM  精确 + 语义  无 \n New API  Redis 缓存  无微调/数据优化功能 \n OpenPipe  —  有：代理捕获日志 → 微调，但单租户：客户自己的日志，微调客户自己的模型 \n LangSmith  —  有：trace → 数据集 → 动态 fewshot 示例选择，权重不变 \n\n三条可以直接拿来用的行业事实：\n\n1. 没有一家主流网关做\"跨客户数据微调\"。 做数据→模型这件事的 OpenPipe 是严格单租户的。这是产品形态
