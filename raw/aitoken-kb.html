for-quantum-computing.html\n- Neven 五年预测 https://thequantuminsider.com/2025/02/05/google-quantum-ai-head-sees-commercial-quantum-within-five-years/\n- Krishna 2026 预测 https://thequantuminsider.com/2026/04/30/ibms-krishna-predicts-first-real-world-quantum-advantage-in-2026/\n- Nvidia NVQLink https://investor.nvidia.com/news/press-release-details/2025/Worlds-Leading-Scientific-Supercomputing-Centers-Adopt-NVIDIA-NVQLink-to-Integrate-Grace-Blackwell-Platform-With-Quantum-Processors/default.aspx\n- AWS Braket 定价 https://aws.amazon.com/braket/pricing/\n- McKinsey Quantum Technology Monitor 2026 https://www.mckinsey.com/capabilities/mckinsey-technology/our-insights/mckinsey-quantum-technology-monitor-2026-a-commercial-tipping-point\n- Science（Majorana 争议） https://www.science.org/content/article/debate-erupts-around-microsoft-s-blockbuster-quantum-computing-claims\n- IEEE Spectrum（量子计算的冷酷现实检查） https://spectrum.ieee.org/quantum-computing-skeptics\n- Aaronson《Hope and Hype》 https://scottaaronson.blog/?p=8329</p>\n<p><strong>PQC 合规</strong>\n- PQC 迁移时间表汇总 https://thequantuminsider.com/2026/05/08/post-quantum-migration-timelines-government-industry-impact/\n- Cloudflare Radar 后量子 https://radar.cloudflare.com/post-quantum ｜ 2025 年度回顾 https://blog.cloudflare.com/radar-2025-year-in-review/\n- 中国新一代国密算法征集 https://finance.sina.com.cn/roll/2025-02-08/doc-ineiumyy8911273.shtml</p>\n<p><strong>中国</strong>\n- 人民论坛（量子信息科技发展与中国战略机遇） https://www.rmlt.com.cn/2026/0206/746677.shtml\n- 国盾量子 2025 年报 https://finance.sina.com.cn/roll/2026-03-24/doc-inhscaeu4176309.shtml\n- 澎湃（量子计算的 2026） https://m.thepaper.cn/newsDetail_forward_33474602</p>\n<hr />\n<h2>十二、明确的检索空白（禁止外推）</h2>\n<ol>\n<li><strong>未检索到</strong> IBM Nighthawk 的官方双比特门保真度与相干时间。</li>\n<li><strong>未检索到</strong> IonQ 当前生产系统的公开物理比特数与整机保真度；其 99.99% 实验的比特规模亦未披露。</li>\n<li><strong>未检索到</strong> PsiQuantum 的任何物理比特数（该公司从未公开）。</li>\n<li><strong>未检索到</strong> QuEra / Atom Computing 的门保真度与相干时间。</li>\n<li><strong>未检索到</strong>中国后量子密码标准的具体截止日与发布时间。</li>\n<li><strong>未取得</strong>十五五规划纲要中量子科技表述的一手原文（媒体口径称排首位，未核实）。</li>\n<li><strong>未检索到</strong>已成功经典模拟 Google Quantum Echoes 实验的论文（该宣称目前仍存活，但处于被攻击状态）。</li>\n</ol>", "plain": " 27 · 量子计算：现状、时间表，以及它对我们到底意味着什么\n\n 版本 v1.0 ｜ 撰写日期：20260728 ｜ 密级：内部\n 触发问题：「现在的量子计算发展到什么程度了？未来会有什么样的发展？什么时间可以突破出实验室？会对目前的 AI 产业有什么影响？」\n 关联模块：18（战略推演）· 22（国产算力卡）· 26（数据边界与合规）\n\n\n\n 一、先给结论\n\n量子计算对我们是一个合规问题，不是算力问题。用一周把后量子密码做掉，然后忘掉它十年。\n\n四句话版本：\n\n1. 现状：全球最好的机器是 100–200 个物理比特量级，逻辑比特最多几十个且码距极浅。没有任何一台机器能运行一个需要纠错的、有商业价值的算法。 整个全球量子计算产业 2025 年收入约 10 亿美元——大约是 Nvidia 一天多一点的收入。\n\n2. 时间表：厂商路线图指向 2029–2030（IBM Starling 200 逻辑比特 / 1 亿门、Quantinuum Apollo）。但这些是承诺不是成果，且历史上量子领域的时间表大幅推迟是常态。最严肃的专家调查给出\"10 年内出现密码学相关量子计算机\"的概率是 28%–49%——注意这个调查只有 26 位受访者，且零个中国专家，参与者大多来自量子产业本身。\n\n3. 对 AI 的影响：目前为零，且大概率长期为零。 量子机器学习在经典数据任务上一次都没赢过（5 个数据集里普通逻辑回归赢了 3 个；MNIST 上量子模型慢 1,200 倍）。更根本的是有一条已发表的结构性定理：可训练的量子模型往往经典可高效模拟——能训练的量子也能经典跑，经典跑不了的训练不动。这不是待解决的工程问题。\n\n4. 反方向才是真的：AI 正在实质性帮助量子（DeepMind 的 AlphaQubit 纠错解码），而每台走向容错的量子机都需要挂载 GPU/FPGA 集群做实时纠错解码。在可见的未来，量子计算增加而非减少 GPU 需求。它是 GPU 的客户，不是替代者。\n\n\n\n 二、现状：到底做到哪一步了\n\n 2.1 硬件参数横向对比（截至 202607）\n\n 玩家  最大物理比特  已实测逻辑比特  双比特门保真度  相干时间 \n\n IBM  Nighthawk 120（218 耦合器，可靠执行 ~5,000 双比特门）  无公开多逻辑比特运算演示  未检索到  未检索到 \n Google  Willow 105  1（距离7 表面码）  ~99.88%  T1 ~68–100 μs \n Quantinuum  Helios 98（全连通）  48（2:1 编码率）  99.921%  秒–分钟量级 \n IonQ  未检索到生产机公开比特数  未检索到  99.99%（仅实验室原型，未披露规模）  同离子阱 \n QuEra / 中性原子  448 原子（Caltech 演示 6,100 原子阵列）  96（4.7:1）  未检索到  未检索到 \n Atom Computing + 微软  1,180  24（49:1）  未检索到  未检索到 \n PsiQuantum（光子）  从未公开任何物理比特数  无  无  无 \n 微软（拓扑）  声称 8 个拓扑比特  无  无  无 \n 祖冲之三号  105（182 耦合器）  无  99.62%  T1 ~72 μs / T2 ~58 μs \n 九章四号（光子）  1,024 压缩态 / 8,176 模式  不适用（非通用门模型）  不适用  不适用 \n 本源悟空180  180 计算比特 + 251 耦合比特  无  99%  未检索到 \n\n 2.2 三个必须点破的口径问题\n\n第一，IonQ 的 99.99% 不是整机保真度。 来源明确写了那是\"R&D 实验室原型\"上的两比特测量，未披露比特数与陷阱规模。把它当成 IonQ 生产系统的水平是错的。\n\n第二，逻辑比特数不能横向比，因为编码率天差地别。 目前实测比率：Quantinuum 2:1 → QuEra 4.7:1 → IBM qLDPC 24:1 → Atom+微软 49:1 → Google 表面码 105:1。\n\n看起来 Google 最差，但恰恰相反——Google 是唯一一个真正做到\"码距增大 → 逻辑错误率指数下降\"（低于阈值纠错）的。Quantinuum 的 2:1 意味着几乎没有冗余，能纠的错误极其有限。比率越低不等于越先进，可能只是码距越浅。\n\n第三，真正有意义的锚点不是比特数，是\"跑一个有用算法要多少物理比特\"。\n\n AWS 量子硬件负责人给的经验值：约 1,000 个物理比特换 1 个逻辑比特\n IBM 2029 年目标 Starling：200 逻辑比特 / 1 亿门\n 破解 RSA2048：Google 的 Gidney 2025 年把估算压到 < 100 万含噪物理比特、< 1 周\n\n从今天的\"48 个 2:1 编码的逻辑比特\"到\"200 个能跑 1 亿门的逻辑比特\"，中间隔着 3 年的路线图承诺和至少两个数量级的工程量。\n\n 2.3 微软 Majorana 这条线要单独打标记 ⚠️\n\n微软 202502 发布 Majorana 1，称\"世界首个拓扑核心 QPU\"、\"造出理论上才存在的新物质态\"。\n\n但那篇 Nature 论文自己写道：结果\"本身并不能确定干涉测量到的低能态是否为拓扑态\"，且\"完全可能该器件只包含 Andreev 模式而不含任何 Majorana 模式\"。四位审稿人意见分裂，两位有保留。\n\n而且有前科：2018 年微软作者的 Nature 论文声称\"Majorana 零模的决定性证据\"，后因数据与 Andreev 模式一致而撤稿。202606 的 Majorana 2 数据公开有限，质疑重起。至今无独立验证。\n\n 纪律：涉及微软拓扑路线的任何数据，一律标记「未经独立验证」，不得引用为技术判断依据。\n\n 2.4 2024 年之后确实有的实质进展\n\n不能只讲怀疑，这些是真的：\n\n1. Google Willow（202412）低于阈值纠错——这是量子纠错领域二十年来最重要的实验结果，第一次证明\"加更多物理比特真的能让逻辑错误率下降\"。\n2. QuEra/Harvard/MIT 的逻辑层面魔态蒸馏（Nature 2025）——通往通用容错的必要组件，过去两年最实质的进展之一。\n3. IBM 的 FPGA 实时解码器做到 <480 ns（需求是 1 μs 周期），比 GPU 方案快一个数量级，比计划提前一年。\n4. Google Quantum Echoes（202510, Nature）：声称比最快经典超算快 13,000 倍，且结果\"可验证\"（可在其他量子硬件上复现）。\n\n ⚠️ 但 Quantum Echoes 的 13,000 倍要放在正确的尺度上看：它不是 2019 年 Sycamore 那种\"经典要一万年\"的 10^15 量级。13,000 倍是一个经典算法改进就可能吃掉的余量。已有 2026 年论文在专门论证\"经典方法无法可行地模拟它\"——防守方论文的存在本身，说明这个宣称正在被攻击。\n\n\n\n 三、时间表：谁在说什么，以及为什么方差本身是信息\n\n 3.1 厂商官方路线图（全部是承诺，不是成果）\n\n 厂商  节点  年份  内容 \n\n IBM  Kookaburra / Cockatoo / Starling / Blue Jay  2026 / 2027 / 2029  Starling = 200 逻辑比特、1 亿门 \n IBM  \"量子优势\"  2026 年底  定义灵活，见 4.2 \n Google  里程碑 6  ~2029  需约 100 万物理比特 \n Quantinuum  Helios → Sol → Apollo  2025 → 2027 → 2029/2030  Apollo = 通用容错 \n QuEra  容错系统上 Amazon Braket  2028  — \n 美国能源部  Grand Challenge：首台容错量子计算机  2028  202511 宣布 6.25 亿美元续期 \n PsiQuantum  百万比特级（布里斯班）  原定 2027 年底  已延迟约 12 个月 \n\n两条现实检查：\n\n PsiQuantum 的延迟很说明问题：澳洲联邦+昆士兰州承诺 9.4 亿澳元，但截至 202512 一分钱都还没提取，机场公共咨询程序都还没启动。这就是\"百万比特计划\"的实际进度。\n 美国能源部 2028 目标的人才约束：全球量子纠错专家只有 600–700 人，2030 年前需要 1.6 万人，而培养一个人要 10 年。耶鲁的 Steven Girvin 评价是\"非常乐观但值得追求\"，同时指出\"我们离真正的容错还很远\"。\n\n 3.2 公开表态的时间线——方差本身就是最重要的信息\n\n 时间  人物  表态 \n\n 202501  黄仁勋  可用量子计算机\"15 年太早、30 年太晚、20 年可以接受\"。量子概念股暴跌 \n 20250205  Hartmut Neven（Google 量子 AI 负责人）  \"五年内会看到量子计算机独有能力解决的真实世界应用\" \n 20250320  黄仁勋  GTC 上公开承认 \"我说错了\"（I was wrong） \n 20250321  —  他试图补救，结果量子股又跌了一轮 \n 20251028  Nvidia  发布 NVQLink，17 家量子厂商 + 9 个国家实验室参与。立场从\"20 年\"实质转向\"现在就卖铲子\" \n 20260430  Arvind Krishna（IBM CEO）  \"我们强烈相信我们的合作伙伴今年会实现量子优势的首批案例\" \n\n 读法：同一年里，最懂硬件的人（黄仁勋）说 20 年然后被迫改口；最有动机乐观的人（Neven）说 5 年；最会措辞的人（Krishna）把主语换成了\"合作伙伴\"。\n\n 这个区间跨度说明的不是\"某个人错了\"，而是没有人真的知道。 任何引用单一权威时间表的论证都是不可靠的。\n\n 3.3 唯一给出概率分布的严肃调查\n\nGlobal Risk Institute《Quantum Threat Timeline Report 2025》：\n\n 时间窗  出现密码学相关量子计算机（CRQC）的概率 \n\n 10 年内  28%–49%（视统计口径；2024 年为 14%–34%，七年来最高、单年最大跳升） \n 15 年内  26 人中 18 人认为 ≥50% \n 20 年内  26 人中 24 人（92%）认为 ≥50% \n 30 年内  接近共识 \n\n ⚠️ 必须打的折扣：受访者只有 26 人（2024 年 32 人、2023 年 37 人，样本在缩水），地域分布为北美 9、欧洲 12、亚洲 3、大洋洲 2、中国 0，且大多来自量子产业本身（利益相关）。\n\n 这个分布应当理解为\"业内乐观派的自我估计\"，不是中立预测。\n\n对照预测市场（Manifold, 202512）：对\"2026 年内实现无争议的量子优势\"呈现压倒性怀疑；对\"2030 年前破解 RSA2048\"判为不太可能。\n\n\n\n 四、\"出实验室\"了吗？——已商业化的形态与真实成色\n\n 4.1 现在能买到的量子算力：云访问，按 shot 或按小时\n\nAWS Braket 实际挂牌价：\n\n 计价方式  价格 \n\n 按任务  $0.30 / task + 每 shot 费用 \n 每 shot  IonQ Forte $0.08；QuEra Aquila $0.01；Rigetti Cepheus $0.000425 \n 独占预留（小时）  IonQ Forte $7,000/小时；Rigetti $4,100；IQM $3,000–4,000；QuEra $2,500 \n\n 对照感：$7,000/小时 约等于 80–140 张 H100 的按需小时价。而这一小时的量子算力，在任何已知商业问题上都跑不过一台笔记本电脑。\n\n付费客户在用它做什么：研发型探索与概念验证。McKinsey 称 300+ 家企业在与量子公司合作，33% 年投入 1,000 万美元。中文媒体对同一现实的表述更直白：产业\"至今没有给出一个经过独立验证的商业答案\"。\n\n 4.2 有没有经得起检验的实用量子优越性？——一个都没有\n\n这是本模块最重要的一节。\n\n(a) 随机线路采样 / 玻色采样：无实用价值的基准\n\n祖冲之三号宣称比 Frontier 快 10^15 倍，但同一份技术分析明确承认\"RCS 本质上是概念验证任务\"。九章四号宣称经典需 10^42 年——但这个宣称的存在本身，就是因为上一代九章被经典算法打败了（Oh & Jiang, Nature Physics 2024，证明 MPS 方法可利用光子损耗高效模拟早期玻色采样实验）。九章四号是把源效率提到 92%、压缩态提到 1,024 个来逃出可模拟区间。\n\n(b) 被经典算法反超（dequantization）的历史——这条必须重点记住\n\n 宣称  结局 \n\n Google Sycamore 2019：\"经典需一万年\"  2023 年前被经典方法基本抹平 \n IBM 2023 年 127 比特\"量子实用性\"（Nature 封面）  几天到几周内被多组张量网络复现，部分在普通笔记本/单台工作站上完成 \n 玻色采样  Nature Physics 2024 证明可经典模拟 \n 量子机器学习的\"指数加速\"  Ewin Tang 系列 dequantization 工作系统性拆掉 \n 2026 年仍在继续  arXiv:2604.12131 继续 dequantize 短路径量子算法 \n\n 规律：每一次\"量子优越性\"宣称的平均存活期约 1–4 年。目前存活的（Quantum Echoes、九章四号、祖冲之三号）都还在保修期内。\n\n(c) 最接近\"真实商业问题\"的一次尝试，及其真实成色\n\nIBM + RIKEN（202510）：77 比特 Heron + Fugaku 全部 152,064 节点，模拟铁硫簇电子结构。\n\n结果距离最好的经典方法仍差约 0.1 Hartree ≈ 63 kcal/mol——对分子性质预测而言这是巨大误差。评论者的原话是，把这个称作量子优势需要\"定义体操\"（definitional gymnastics）。\n\n另外注意 IBM 自己对\"量子优势\"的定义：不是硬指标，而是\"在算力、效率、成本、精度或其组合上有确凿证据\"。这是一个可以被灵活满足的定义。 当 IBM 在 2026 年底宣布\"实现量子优势\"时，请先看它用的是哪一条。\n\n 4.3 行业营收规模：一个字，小\n\n 主体  FY2025 营收  FY2025 净亏损 \n\n 全球量子公司合计  10 亿美元  — \n IonQ  1.30 亿美元（+202%）  5.104 亿美元 \n Quantinuum  3,090 万美元  1.926 亿美元 \n DWave  2,460 万美元（+179%）  — \n Rigetti  710 万美元（从 1,080 万下滑）  2.161 亿美元 \n 国盾量子（688027）  人民币 3.1 亿元（+22.53%）  净利 +539 万元（首次扭亏） \n\n 量级感：整个全球量子计算产业 2025 年收入约 10 亿美元。这大约是 OpenAI 两周左右的收入，或 Nvidia 一天多一点的收入。\n\n估值与基本面的脱节（这一条与模块 24 证伪中昊芯英是同一类问题）：\n\n Quantinuum 202606 纳斯达克 IPO，估值约 140 亿美元 = 453 倍市销率；且 2026 Q1 营收同比下滑 73% 至 520 万美元，单季亏损 1.366 亿美元。\n IonQ 前瞻市销率约 66 倍（行业中位数 4.36 倍）；202607 中旬股价从月内高点回落约 35%。\n 2025 年全行业融资 126 亿美元（同比 6.3 倍），97% 是私人资本。资金流入速度远超收入增长速度——典型的预期驱动而非需求驱动。\n\n\n\n 五、对 AI 产业的影响\n\n 5.1 量子机器学习：在经典数据上一次都没赢过\n\n2026 年 QML 现状综述的直接结论：\n\n \"在经过强经典基线对照和完整硬件成本核算之后，没有任何量子学习结果获得广泛认可为端到端优势。\"\n\n具体证据：\n\n Sheoran et al., Scientific Reports, 202512：5 个数据集上，普通逻辑回归在其中 3 个上胜过量子分类器。\n 202605 预印本：MNIST 上模拟的量子模型比经典慢约 1,200 倍。\n 唯一有真实优势的场景是量子数据（学习量子系统本身）和人工构造的密码学数据集。这两类都不是商业数据。\n\n 5.2 Barren Plateau：不是没解决，是解决了也没用\n\nBarren plateau 指变分量子线路的损失函数梯度随比特数指数消失，导致无法训练。过去五年的主流方向是设计\"没有 barren plateau 的线路结构\"。\n\n结果是一条已发表的结构性定理（Cerezo 等，Nature Communications 2025）：\n\n 可证明不存在 barren plateau，往往意味着该线路经典可高效模拟。\n\n即：能训练的量子模型，经典计算机也能跑；经典跑不了的，训练不动。 配套结果：量子卷积神经网络（QCNN）被证明有效经典可模拟（LANL）。\n\n 这不是一个待解决的工程问题，而是一个结构性的两难。 这一条是整个 QML 叙事最致命的证据，比任何 benchmark 数字都重要。\n\n 5.3 量子能不能加速大模型训练或推理？不能，差距是 10^13 量级\n\n最完整的技术分析（arXiv:2511.01253）给出的综合劣势拆解：\n\n 因子  倍数  说明 \n\n 门速度 vs 浮点运算  ~10^3  超导双比特门 20–100 ns，离子阱 10–100 μs；GPU FLOP 是亚纳秒级 \n 纠错开销  ~10^2  逻辑门要靠大量物理门合成 \n 单位美元的 GPU 并行度  ~10^8  最致命的一项 \n 合计  ~10^13  \n\n要吃掉 10^13 的劣势，问题规模必须巨大到渐进优势才起作用：量子聚类需要 10^13 个以上数据点；Grover 超参搜索需要 10^24 的搜索空间（实践中是几百）；量子强化学习需要 10^20 个动作。\n\n更根本的瓶颈：数据加载 / QRAM。\n\n要在量子计算机上处理经典数据，必须先把数据编码进量子态。对一般数据，这个加载开销可以和你希望加速的计算本身一样大——优势被入口抵消。而实现 QRAM 的难度\"与建造一台容错量子计算机相当\"，甚至可能根本不可行。\n\nScott Aaronson 的框架：量子只在三处有可信加速——量子模拟（化学/材料）、Shor 破密、Grover 平方根加速。而 Grover 对优化和 ML 只是平方级，不是指数级。他的原话是其他领域是\"堑壕战，不是魔法般地加速一切\"。\n\n ⚠️ 引用 Aaronson 时必须分开两个判断：他对容错时间线偏乐观（\"照当前速度，十年内要么有可用的容错量子计算机，要么发生了某些令人意外的事\"），但对 QML 明确不看好。不要把这两条混为一谈。\n\n 5.4 反方向：AI 正在实质性帮助量子——这条线比 QML 扎实得多\n\n AlphaQubit（DeepMind, Nature 202411）：基于 Transformer 的表面码解码器，比张量网络方法少 6% 错误，比 correlated matching 少 30% 错误。在真实 Sycamore 数据上验证。\n   但论文自己说明局限：AlphaQubit \"太慢，无法对超导处理器做实时纠错\"。\n 实时解码的工程解法反而是专用硬件：IBM 的 FPGA 解码器 <480 ns，比 GPU 方案快一个数量级。\n Nvidia NVQLink（202510）：把 Grace Blackwell 与 QPU 直连，专门服务于实时量子纠错解码这一个 workload，17 家量子厂商 + 9 个科学实验室采用。\n\n 这条线对 AI 产业的含义是反直觉的，也是本模块最值得记住的一句话：\n\n 短期内，量子计算是 GPU 的需求方，不是替代者。每台走向容错的量子机都要挂一套 GPU/FPGA 实时解码集群。如果量子计算成功，GPU 需求增加。\n\n 5.5 严肃的反方论证清单\n\n 论者  身份  核心论点 \n\n Matthias Troyer  微软  量子门比晶体管慢若干数量级；平方级加速需运行数世纪；I/O 带宽比经典慢千倍到百万倍 \n Oskar Painter  AWS 量子硬件负责人  行业存在\"巨量炒作\"；容错至少还要十年；约 1,000 物理比特换 1 逻辑比特 \n Yann LeCun  Meta  怀疑能否造出\"真正有用\"的量子计算机 \n Scott Aaronson  UT Austin  只有量子模拟/Shor/Grover 三处可信；QML 前景不佳 \n arXiv:2511.01253 作者组  —  量子深度学习面临 ~10^13 综合劣势；QRAM 可能根本不可行 \n Yuval Boger  QuEra CMO（业内人士）  承认行业过度承诺 \n\n\n\n 六、唯一真正会触达我们的量子变量：后量子密码（PQC）\n\n这一节是本模块唯一有行动项的部分。\n\n 6.1 技术差距 vs 监管日历\n\n技术侧：破解 RSA2048 需要 < 100 万含噪物理比特。当前最大机器是 100–200 物理比特量级。差距约 4 个数量级。\n\n但监管不等技术。合规时间表已经是硬的：\n\n 主体  节点  要求 \n\n 美国行政令（20260622 签署）  2030 年底 / 2031 年底  密钥建立 / 数字签名，联邦机构及政府承包商必须迁移 \n NIST IR 8547  2030 / 2035  RSA2048、ECC P256 弃用 / 完全禁用 \n NSA CNSA 2.0  20270101  软件/固件签名必须专用 PQC \n  2033  云服务专用 PQC \n 欧盟路线图  2026 年底 / 2030 年底  成员国发布策略与密码资产清点 / 关键基础设施完成 \n 中国  202502 启动  商用密码标准研究院启动新一代公钥算法征集，明确面向抗量子。具体截止日与标准发布时间未检索到 \n\n 6.2 已实际发生的迁移进度\n\n截至 202510，通过 Cloudflare 网络的人类 web 流量已有超过 50% 采用后量子加密（混合模式，如 X25519 + MLKEM）。Cloudflare 自 2025 年初起对全网站点默认启用。\n\n 关键区分——这一条直接关系到我们：\n\n 浏览器 ↔ CDN 这一段是\"容易的一半\"，已经过半。\n\n 源站侧、内部 API 调用、服务间 mTLS、遗留设备是\"难的一半\"，进度慢得多。而我们的业务恰好全部由这类流量构成。\n\n 6.3 我们该做什么（成本：人天到人周级，不是战略级投入）\n\n(a) 现在就把面向客户的 TLS 打开混合后量子密钥交换（X25519 + MLKEM）。\n我们的入口在 Cloudflare 后面，这基本上是一个开关。Cloudflare 自 2025 年初已对全网站点默认开启。成本近似为零。\n\n(b) 做一次密码资产清点（cryptographic inventory）。\n清点范围：API 密钥签发机制、JWT 签名算法、与上游模型厂商的 mTLS、内部服务间调用、密钥托管方案分别用什么算法。\n\n 这份清单在 2027–2029 年会被企业客户和采购问卷反复要求。现在做要 2 人天，被问到时临时做要 2 个月。\n\n(c) 把它变成差异化卖点。\n\"难的一半\"正好在我们这一层。一家能在 2027 年就出具\"PQCready\"证明的 API 网关，在面向金融、政企、出海欧美客户的招标里是加分项，而这个加分项现在的获取成本几乎为零。\n\n这与模块 08 的基本判断一致：合规不是成本，是准入门槛，也是竞争壁垒。 PQC 是这条判断的又一个实例。\n\n\n\n 七、明确不要做的事\n\n1. 不要在任何对外材料里提\"量子\"。 这个行业 2025–2026 年正在经历估值修正（IonQ 从月内高点回落 35%；Quantinuum IPO 453 倍市销率且 Q1 营收同比 73%）。蹭这个词在 2026 年已经从加分变成减分。\n2. 不要招量子相关人才、不要做\"量子就绪\"产品页、不要跟量子公司做无实质内容的战略合作 PR。\n3. 不要相信任何\"量子将颠覆 AI\"的卖方研报。 经同行评议的证据是：QML 在经典数据上一次都没赢过，且\"可训练的量子模型往往经典可模拟\"是一个已发表的结构性定理，不是待解决的工程问题。\n4. 不要为量子算力做任何供给侧规划。 见第八节的架构性理由。\n\n\n\n 八、为什么量子算力永远进不了我们的供给组合（架构性理由）\n\n这一节解释的是\"为什么不是时间问题\"。\n\n(1) 不可分割 vs 可切分。\nGPU 可以虚拟化、切分、多租户、按 token 计价，利用率可以逼近 90%+。量子机是单任务独占——这正是 AWS Braket 要按\"$7,000/小时独占预留\"计价的原因。你无法把一台 QPU 的 5% 卖给一个客户。\n\n 这从根上决定了量子算力不可能形成 token 级的分销市场。 而 token 级分销正是我们全部四条业务线的载体（见模块 02）。这不是\"现在还不行、以后会行\"，这是架构性错配。\n\n(2) 没有摩尔定律曲线。\nGPU 每代单位算力成本下降是可预期的。量子的成本下降路径不来自制程，而来自纠错开销的降低（如 IBM 的 qLDPC 声称比表面码省 10 倍物理比特）——这是算法/编码理论的进步，不是制造业的规模曲线，节奏不可预测，也不能外推。\n\n 这一条与模块 22 对国产算力卡的判断形成有意思的对照：国产卡的降价要等良率过 60%，那是一条可预测的制造业曲线；量子的成本下降没有对应的曲线，因此不能用同样的方法做规划。\n\n(3) 功耗对比是个陷阱。\n超导量子机（含稀释制冷机）约 10–25 kW，对照 Frontier 约 21 MW——看起来便宜三个数量级。但分母不同：Frontier 每小时产出海量有用的 FLOP，量子机每小时产出的有用商业计算目前约等于零。\n\n 每单位有用计算的能耗，量子当前是无穷大。引用\"量子更省电\"的论证时必须问：省电做什么。\n\n(4) 造价与运营成本量级（供参考，不构成规划依据）：\n\n 项目  量级 \n\n Rigetti Novera 9 比特 QPU  约 90 万美元；含升级整机约 285 万美元 \n IQM 54 比特系统（含 HPC 集成）  €2,500 万 \n 稀释制冷机（Bluefors）  70 万–1,000 万美元（视级别） \n 氦3 初装 + 回收系统  约 28 万美元；年补充 1.5 万–5 万美元 \n 年运营成本  入门 5 比特约 61 万美元/年；工业级 200 万–3,000 万美元/年 \n 五年 TCO  入门约 510 万美元；工业级 3,000 万–8,000 万美元 \n\n\n\n 九、中国的情况\n\n 9.1 投入与政策\n\n公共投入（截至 202504，全球 540 亿美元）：中国 153 亿美元（全球第一，约占三分之一）  日本 92 亿  美国 60 亿。\n\n但社会风险投资差一个数量级：中国约 1 亿美元 vs 美国 17 亿美元。\n\n政策沿革：十二五列为重点方向 → 十三五设\"科技创新 2030\"专项 → 十四五列为七大前沿科技之一 → 二十届四中全会（202510）把\"量子科技\"列在新增长点列举的第一位 → 十五五规划纲要多方位布局（媒体口径称排在未来产业布局首位，规划纲要一手原文未取得）。\n\n产业分布：全国 140 余家相关企业，合肥集聚 70 余家；全球 12 家量子\"独角兽\"中中国占 4 家。\n\n 9.2 领先在哪，落后在哪\n\n领先或并跑：\n 量子通信明确世界第一（2016 墨子号、2017 京沪干线、2025 跨亚非大陆星地通信）\n 随机线路采样 / 玻色采样并跑或领先（祖冲之三号 PRL 2025、九章四号 Nature 2026）\n\n落后（这才是关键）：\n 纠错与逻辑比特明显落后。 全球逻辑比特排行榜前六名（QuEra 96、Quantinuum 48、Atom+微软 24、Google 1、Infleqtion 12、Nord Quantique 1）没有一家中国机构。中国的公开成果集中在\"物理比特数 + 采样优越性\"，而国际前沿已转向\"逻辑比特 + 纠错开销\"。\n 关键器件卡脖子：稀释制冷机、单光子探测器、专用设备仍依赖进口。\n 时间表落差：IBM 计划 2028 年前后建成约 200 逻辑比特原型机；中国企业的公开目标是 2030 年达到同等量级。\n\n 最诚实的差距刻度：本源悟空180 的双比特门保真度是 99%，而 Quantinuum Helios 是 99.921%、Google Willow 是 99.88%。\n\n 99% 与 99.9% 之间是 10 倍的错误率差距，这对纠错是决定性的——在 99% 的双比特保真度下，低于阈值纠错做不到。\n\n 9.3 商业化：与国际同行处于同一档，即\"基本没有\"\n\n 国盾量子（688027）：唯一 A 股纯量子标的。2025 年营收人民币 3.1 亿元（+22.53%），净利 539 万元，连亏四年后首次扭亏；量子计算业务近 1.2 亿元（+111.82%，占比约 39%）。已成为中国电信全资子公司控股企业。\n 本源量子：完成近 30 亿元 PreIPO 轮，投前估值 210 亿元，冲刺 IPO。\n 图灵量子 近 10 亿元融资、估值超 70 亿元；玻色量子 10 亿元 B 轮。\n 2026 年 Q1 国内量子融资 32.04 亿元，单季超过 2025 年全年。\n\n 判读：国盾量子 3.1 亿元人民币营收（约 4,300 万美元）实际上比 Quantinuum 的 3,090 万美元还高——这更多说明国际同行有多小，而不是中国有多强。\n\n 国资驱动特征明显（中国电信控股、国资抢投），这意味着订单质量与市场化订单不同。这与模块 24 分析中昊芯英时的方法一致：看订单来源，不只看订单金额。\n\n\n\n 十、观察指标与复核触发条件\n\n每年花 15 分钟看一次即可，不需要更多。\n\n   指标  判据  影响 \n\n 1  IBM Starling  2029 年是否真的交付 200 逻辑比特 / 1 亿门。若 2027 年底 Kookaburra/Cockatoo 节点明显延期，整条时间线右移  全行业最具体、最可证伪的承诺 \n 2  实用量子优势  是否出现独立第三方复现的、在真实商业问题上（非 RCS、非 OTOC、非人工构造数据集）的量子优势，且发表 ≥12 个月未被经典反超  历史上这类宣称平均存活 1–4 年 \n 3  QML 突破  是否出现在经典数据上端到端胜出、可复现的结果，特别是绕开数据加载瓶颈的方案（关注 QRAM / oracle sketching）  目前有结构性定理阻挡 \n 4  PQC 合规节点  2027（CNSA 2.0 签名）、2030（NIST 弃用 + 美国行政令密钥建立）、2031（数字签名）、2033（CNSA 云服务）  不需要触发条件，直接按日历执行 \n 5  中国标准  新一代国密抗量子算法标准发布时间  影响国内客户的合规要求时点 \n\n\n\n 十一、核心来源\n\n硬件与实验\n IBM 大规模容错路径 https://www.ibm.com/quantum/blog/largescaleftqc ｜ 路线图 https://www.ibm.com/roadmaps/quantum.pdf\n Google Willow https://blog.google/innovationandai/technology/research/googlewillowquantumchip/ ｜ Quantum Echoes https://research.google/blog/averifiablequantumadvantage/ ｜ 纠错里程碑 https://quantumai.google/qecmilestone\n Quantinuum Helios https://www.quantinuum.com/blog/introducingheliosthemostaccuratequantumcomputerintheworld\n PRL 134, 090601（祖冲之三号） https://link.aps.org/doi/10.1103/PhysRevLett.134.090601\n Nature（九章四号） https://www.nature.com/articles/s41586026105236 ｜ 中科院 https://english.cas.cn/newsroom/headlines/202605/t20260514_1159331.shtml\n 新华社（本源悟空180） https://www.news.cn/politics/20260509/7a705cbef67f456fbdfb884309abf12d/c.html\n Nature（逻辑魔态蒸馏） https://www.nature.com/articles/s41586025093673\n arXiv:2505.15917（Gidney：不到百万比特分解 RSA2048） https://arxiv.org/abs/2505.15917\n\n经典反超（dequantization）\n arXiv:2306.14887 https://arxiv.org/abs/2306.14887 ｜ arXiv:2306.16372 https://arxiv.org/html/2306.16372 ｜ PRResearch 6, 013326 https://link.aps.org/doi/10.1103/PhysRevResearch.6.013326\n Nature Reviews Physics（dequantization 综述） https://www.nature.com/articles/s4225402200511w\n arXiv:2604.12131 https://arxiv.org/html/2604.12131v1\n\nQML 的结构性障碍\n Nature Communications（无 barren plateau ⇒ 经典可模拟） https://www.nature.com/articles/s41467025630996 ｜ 预印本 https://arxiv.org/abs/2312.09121\n QCNN 经典可模拟 https://arxiv.org/html/2408.12739v1 ｜ LANL 通稿 https://www.lanl.gov/media/news/0409quantumlearningmodels\n arXiv:2511.01253（量子深度学习仍需一次飞跃，10^13 劣势拆解） https://arxiv.org/html/2511.01253v1\n AlphaQubit https://blog.google/innovationandai/modelsandresearch/googledeepmind/alphaqubitquantumerrorcorrection/\n\n时间表、市场与争议\n GRI Quantum Threat Timeline Report 2025 https://globalriskinstitute.org/publication/quantumthreattimelinereport2025b/\n CNBC（黄仁勋承认说错） https://www.cnbc.com/2025/03/20/nvidiaceohuangsayswaswrongabouttimelineforquantumcomputing.html\n Neven 五年预测 https://thequantuminsider.com/2025/02/05/googlequantumaiheadseescommercialquantumwithinfiveyears/\n Krishna 2026 预测 https://thequantuminsider.com/2026/04/30/ibmskrishnapredictsfirstrealworldquantumadvantagein2026/\n Nvidia NVQLink https://investor.nvidia.com/news/pressreleasedetails/2025/WorldsLeadingScientificSupercomputingCentersAdoptNVIDIANVQLinktoIntegrateGraceBlackwellPlatformWithQuantumProcessors/default.aspx\n AWS Braket 定价 https://aws.amazon.com/braket/pricing/\n McKinsey Quantum Technology Monitor 2026 https://www.mckinsey.com/capabilities/mckinseytechnology/ourinsights/mckinseyquantumtechnologymonitor2026acommercialtippingpoint\n Science（Majorana 争议） https://www.science.org/content/article/debateeruptsaroundmicrosoftsblockbusterquantumcomputingclaims\n IEEE Spectrum（量子计算的冷酷现实检查） https://spectrum.ieee.org/quantumcomputingskeptics\n Aaronson《Hope and Hype》 https://scottaaronson.blog/?p=8329\n\nPQC 合规\n PQC 迁移时间表汇总 https://thequantuminsider.com/2026/05/08/postquantummigrationtimelinesgovernmentindustryimpact/\n Cloudflare Radar 后量子 https://radar.cloudflare.com/postquantum ｜ 2025 年度回顾 https://blog.cloudflare.com/radar2025yearinreview/\n 中国新一代国密算法征集 https://finance.sina.com.cn/roll/20250208/docineiumyy8911273.shtml\n\n中国\n 人民论坛（量子信息科技发展与中国战略机遇） https://www.rmlt.com.cn/2026/0206/746677.shtml\n 国盾量子 2025 年报 https://finance.sina.com.cn/roll/20260324/docinhscaeu4176309.shtml\n 澎湃（量子计算的 2026） https://m.thepaper.cn/newsDetail_forward_33474602\n\n\n\n 十二、明确的检索空白（禁止外推）\n\n1. 未检索到 IBM Nighthawk 的官方双比特门保真度与相干时间。\n2. 未检索到 IonQ 当前生产系统的公开物理比特数与整机保真度；其 99.99% 实验的比特规模亦未披露。\n3. 未检索到 PsiQuantum 的任何物理比特数（该公司从未公开）。\n4. 未检索到 QuEra / Atom Computing 的门保真度与相干时间。\n5. 未检索到中国后量子密码标准的具体截止日与发布时间。\n6. 未取得十五五规划纲要中量子科技表述的一手原文（媒体口径称排首位，未核实）。\n7. 未检索到已成功经典模拟 Google Quantum Echoes 实验的论文（该宣称目前仍存活，但处于被攻击状态）。\n"}, {"id": "28-大模型自我改进的真实进展", "code": "28", "title": "28 · 大模型的\"自我升级\"：真实进展、厂商格局与对我们的含义", "short": "28 · 大模型的\"自我升级\"：真实进展、厂商格局与对我们的含义", "subs": ["一、先给结论", "二、把\"自我升级\"拆成五个层次", "三、层次 1：训练期自举——\"引出\"还是\"创造\"？", "四、层次 2：推理期自纠错——负面结果没有被推翻", "五、层次 3：智能体层——唯一稳定有效的层次", "六、层次 4：权重级持续学习——零生产部署", "七、层次 5：AI 做 AI 研究——一个真实案例，量级 1%", "八、谁做得最好", "九、未来会怎样", "十、对我们这门生意的含义", "十一、观察指标与复核触发条件", "十二、核心来源", "十三、明确的检索空白（禁止外推）"], "html": "<h1>28 · 大模型的\"自我升级\"：真实进展、厂商格局与对我们的含义</h1>\n<blockquote>\n<p><strong>版本 v1.0</strong> ｜ 撰写日期：2026-08-12 ｜ 密级：内部\n触发问题：「大模型的自我升级能力发展到什么程度了？哪些厂家在做？谁做的最好？未来的发展会怎样？」\n关联模块：00（基本认知）· 18（战略推演）· 21（选型方法论）· 26（数据边界）· 27（量子计算）</p>\n</blockquote>\n<hr />\n<h2>一、先给结论</h2>\n<p><strong>\"自我升级\"这个词在 2025–2026 年被系统性偷换了概念。真实发生的是「验证器覆盖范围内的定向加速」，不是通用的递归自我改进。</strong></p>\n<p>四句话版本：</p>\n<ol>\n<li>\n<p><strong>加速是真的。</strong> Epoch AI 的能力指数显示，2024 年 4 月之后进展速度从 8.3 点/年跳到 <strong>15.5 点/年，加速约 1.85 倍</strong>（置信区间 1.3–3.1 倍）。<strong>唱衰派在这一点上是错的</strong>，必须先承认这个事实。</p>\n</li>\n<li>\n<p><strong>但加速有明确边界。</strong> 同一份 Epoch 分析指出：加速<strong>集中在编程与数学</strong>——恰好是\"正确性可被自动验证\"的领域。而 WeirdML V2 这类验证困难的基准<strong>看不到任何加速</strong>。这不是巧合。</p>\n</li>\n<li>\n<p><strong>有一条理论早就预测了这件事。</strong> ICLR 2025 的\"生成-验证差距\"论文指出：自我改进的上限由<strong>验证能力</strong>决定，在\"生成难度 ≈ 验证难度\"的任务（事实检索、开放域判断）上<strong>原理性失效</strong>。理论在 2024 年底提出，2026 年的宏观数据独立印证了它。<strong>这是本模块中最强的一条因果链。</strong></p>\n</li>\n<li>\n<p><strong>真正的递归自我改进只有一个可核验的数据点，而且量级是 1%。</strong> Google 的 AlphaEvolve 让 Gemini 训练时间减少 <strong>1%</strong>、回收全球算力 <strong>0.7%</strong>。这是真的、已部署一年多、作用在训练下一代模型的基础设施上——但它是 <strong>1%</strong>，不是起飞。而 Anthropic 在自家 80% 代码由 Claude 编写的情况下，仍然明确说：<strong>\"我们还没到那一步，而且递归自我改进并非不可避免。\"</strong></p>\n</li>\n</ol>\n<p><strong>对我们的一句话含义</strong>：上游能力会继续快速提升，客户的 token 消耗会继续涨——<strong>模块 00 第一条基本认知得到强化</strong>。但\"AI 自己改进自己\"目前不会改变我们的商业环境，<strong>唯一已被证明有效且已生产化的自我改进层次，恰好就是模块 26 里我们已经决定要做的 L0–L2</strong>。</p>\n<hr />\n<h2>二、把\"自我升级\"拆成五个层次</h2>\n<p>讨论这个话题的最大陷阱是<strong>层次混用</strong>：厂商宣传里的\"自我改进\"可能指其中任何一个，而它们的成熟度相差几个数量级。</p>\n<table>\n<thead>\n<tr>\n<th>层次</th>\n<th>含义</th>\n<th>成熟度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>1 · 训练期自举</strong></td>\n<td>模型用自己生成的信号训练自己</td>\n<td>已工业化，<strong>但主要是\"引出\"而非\"创造\"</strong></td>\n</tr>\n<tr>\n<td><strong>2 · 推理期自纠错</strong></td>\n<td>模型运行时发现并改正自己的错误</td>\n<td><strong>无外部反馈时基本失败</strong></td>\n</tr>\n<tr>\n<td><strong>3 · 智能体层</strong></td>\n<td>不改权重，改提示词/记忆/工具</td>\n<td><strong>唯一有稳定实测增益的层次</strong></td>\n</tr>\n<tr>\n<td><strong>4 · 权重级持续学习</strong></td>\n<td>模型上线后继续更新自己的权重</td>\n<td><strong>零生产部署</strong></td>\n</tr>\n<tr>\n<td><strong>5 · AI 做 AI 研究</strong></td>\n<td>AI 改进训练算法、内核、基础设施</td>\n<td>一个真实案例（AlphaEvolve），量级 1%</td>\n</tr>\n</tbody>\n</table>\n<p>下面逐层给证据。</p>\n<hr />\n<h2>三、层次 1：训练期自举——\"引出\"还是\"创造\"？</h2>\n<h3>3.1 这是全领域最重要的一场争论</h3>\n<p><strong>怀疑方（引出说）</strong>：清华 Yue 等人的 NeurIPS 2025 论文发现——RLVR（可验证奖励强化学习）训练的模型在<strong>少量采样时优于基座模型，但采样次数 k 增大后基座模型反超</strong>。跨数学、代码、视觉推理多个基准，跨 Qwen / LLaMA 多个模型族。</p>\n<p>结论：<strong>RLVR 提升的是采样效率，不是能力边界。</strong></p>\n<p><strong>更狠的一击：Spurious Rewards（arXiv 2506.10947）</strong></p>\n<p>在 Qwen2.5-Math-7B 上，MATH-500 的提升幅度：</p>\n<table>\n<thead>\n<tr>\n<th>奖励信号</th>\n<th>提升</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>真实标准答案奖励</td>\n<td><strong>+29.1 个百分点</strong></td>\n</tr>\n<tr>\n<td><strong>随机奖励</strong></td>\n<td><strong>+21.4 个百分点</strong></td>\n</tr>\n<tr>\n<td><strong>错误标签奖励</strong></td>\n<td><strong>+24.1 个百分点</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>随机奖励能拿到真实奖励 73% 的收益。</strong> 机制是：Qwen2.5-Math 预训练时已有强代码推理先验（65% 回答会写 Python 辅助推理，含代码的准确率 60.9% vs 不含 28.0%），任何 RL 信号只是把这个频率推到 90% 以上。</p>\n<p><strong>而这些虚假奖励在 Llama3 和 OLMo2 上完全失效。</strong></p>\n<blockquote>\n<p>⚠️ <strong>这条对整个领域的证据质量是毁灭性的</strong>：2025 年大量只在 Qwen 系列上验证的 RLVR 论文，其收益可能来自预训练已有的习惯被激活，而非算法本身。</p>\n<p><strong>纪律：任何只在 Qwen 上验证的自我改进结果，一律视为未经证实。</strong></p>\n</blockquote>\n<h3>3.2 但\"引出说\"已被三路有力限定，不宜作为核心论据</h3>\n<table>\n<thead>\n<tr>\n<th>反驳角度</th>\n<th>论文</th>\n<th>内容</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>度量层面</strong></td>\n<td>CoT-Pass@K（ICLR 2026）</td>\n<td>Pass@K 本身有缺陷——它把\"最终答案蒙对但推理链错误\"也算成功。大 k 时基座模型的优势相当部分来自<strong>猜对</strong>。换成同时要求推理正确的 CoT-Pass@K，<strong>RLVR 确实扩展了边界</strong></td>\n</tr>\n<tr>\n<td><strong>方法层面</strong></td>\n<td>ProRL（NVIDIA，NeurIPS 2025）</td>\n<td>训练 <strong>&gt;2000 步</strong>（此前工作通常几百步）后，出现\"基座模型无论采样多少次都失败、而 RL 模型 100% 通过\"的场景。<strong>但仅在 1.5B 模型上验证</strong></td>\n</tr>\n<tr>\n<td><strong>条件层面</strong></td>\n<td>Pass@k Inversion（2026-07）</td>\n<td>反超现象<strong>局限于\"边界提示\"</strong>（基座单次成功率 &lt;10%、k=256 时可恢复 &gt;40% 的题），且可用正则化缓解</td>\n</tr>\n</tbody>\n</table>\n<p><strong>综合判断</strong>：短程 RLVR ≈ 分布锐化（引出），<strong>这是绝大多数已发表工作所在的区间</strong>；长程 RLVR 有边界扩展证据，但<strong>未见前沿规模（&gt;100B）的对照实验</strong>。</p>\n<blockquote>\n<p><strong>这个争论的实际结论不是\"自我改进有硬上限\"，而是\"朴素 RLVR 的效率提升被误读成了能力扩展\"。真正的硬上限在下一节。</strong></p>\n</blockquote>\n<h3>3.3 旗舰战果与它的口径</h3>\n<p>DeepSeek-R1（2025 年 9 月登 <em>Nature</em> 封面，首个通过权威期刊同行评审的主流大模型，RL 成本 <strong>29.4 万美元</strong>）：</p>\n<ul>\n<li><strong>R1-Zero</strong>（纯 RL，无 SFT）AIME 2024：<strong>15.6% → 71.0%</strong></li>\n<li>R1 最终：AIME 79.8%、MATH-500 97.3%、Codeforces Elo 2029</li>\n</ul>\n<p>论文里的\"自我演化\"\"aha moment\"叙事影响极广。<strong>但要打两个折</strong>：</p>\n<ol>\n<li>这是<strong>标准 RL 训练相对自身基座的提升</strong>，不是\"模型改进了下一代模型\"——把它叫\"自我改进\"是概念放大。</li>\n<li>Sea AI Lab 的批判性复现（arXiv 2503.20783）指出：所谓 aha moment 式的反思行为，<strong>在 Qwen2.5 等基座模型中本就存在</strong>，不完全是 RL 涌现的。</li>\n</ol>\n<h3>3.4 自举微调的硬天花板：3–5 轮</h3>\n<p>STaR / ReST 这类\"用自己生成的推理链再训练自己\"的方法，<strong>在 3 到 5 轮迭代后迅速饱和</strong>。</p>\n<p>根因是<strong>探索性崩塌</strong>：模型生成多样化正确回答的能力随迭代急剧退化，仅靠答案正确性的奖励会筛出同质化推理路径，进一步压缩多样性。</p>\n<p>B-STaR 通过动态调温和调阈值把上限推到 9 轮（GSM8K 53.8% vs 基线 46.8%），<strong>但天花板依然存在，只是抬高了</strong>。</p>\n<blockquote>\n<p><strong>这条很重要</strong>：自举不是无限自我改进的引擎，它有一个由<strong>生成多样性</strong>决定的物理上限。</p>\n</blockquote>\n<h3>3.5 一条真正生产化的：RLAIF / 宪法 AI</h3>\n<p>Google 的对照实验：相对 SFT 基线的人类评估胜率</p>\n<table>\n<thead>\n<tr>\n<th>任务</th>\n<th>RLAIF</th>\n<th>RLHF</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>摘要</td>\n<td>71%</td>\n<td>73%</td>\n</tr>\n<tr>\n<td>有用性对话</td>\n<td>63%</td>\n<td>64%</td>\n</tr>\n<tr>\n<td><strong>无害性对话</strong></td>\n<td><strong>88%</strong></td>\n<td>76%</td>\n</tr>\n</tbody>\n</table>\n<p>且论文证明：<strong>标注模型与策略模型同尺寸、甚至同一个 checkpoint 时仍能改进 SFT 策略</strong>——作者称之为\"严格意义上的 LLM 自我改进\"。</p>\n<p><strong>这是层次 1 里最扎实、且确实全行业生产化的一条。但注意它替代的是人类标注成本，不是在提升能力上限。</strong></p>\n<h3>3.6 已经停掉的一条：自奖励语言模型</h3>\n<p>Meta 2024 年初的 Self-Rewarding Language Models 曾被寄予厚望（模型自己当裁判生成偏好数据）。<strong>但 2025–2026 年未检索到任何重大后续工作</strong>，与 RLVR 同期的爆发形成鲜明对比。</p>\n<p>大概率原因：在有可验证奖励的领域被 RLVR 全面取代；在不可验证领域，奖励模型自身的偏差会随迭代放大。</p>\n<p><strong>信号意义</strong>：Meta 的核心研究员田渊栋已离职创办 Recursive Superintelligence（2026 年 5–6 月融资 6.5 亿美元、估值 46.5 亿美元，英伟达与 AMD 参投），主张就是\"models build models\"。<strong>核心人才带着这个命题离开 Meta 单干，说明大厂内部没有承接这条线。</strong></p>\n<hr />\n<h2>四、层次 2：推理期自纠错——负面结果没有被推翻</h2>\n<h3>4.1 核心结论</h3>\n<p>Google DeepMind 的 ICLR 2024 论文《Large Language Models Cannot Self-Correct Reasoning Yet》<strong>至今未被反驳或撤稿</strong>。</p>\n<p>TACL 的系统性综述进一步确认：<strong>\"没有任何先前工作证明了用提示 LLM 产生的反馈能成功自我纠错\"</strong>，瓶颈在<strong>反馈生成环节</strong>。</p>\n<p>综述还点名了大量正面结果的<strong>方法论造假</strong>：初始用弱提示、纠错时用强提示；只在纠错阶段给外部工具；使用 oracle 信息。<strong>公平条件下成功率大幅缩水。</strong></p>\n<p><strong>成功的三个条件全部需要外部信号</strong>：任务可分解、有外部工具（代码解释器/搜索/符号推理器）、或用 10 万–27.4 万条样本大规模微调。</p>\n<h3>4.2 2026 年的新发现：这可能只是聊天模板伪影</h3>\n<p>arXiv 2606.05976（2026 年 6 月）发现：模型不能自我纠错<strong>不是认知局限</strong>。把完全相同的错误陈述换个角色标签呈现——从模型自己的思考块改标为 user message / tool response / memory：</p>\n<p><strong>显式纠错率提升 23–93 个百分点</strong>，13 个组合中 10 个达统计显著（p&lt;0.001）。Llama-3.3-70B 数学任务上 memory 角色 <strong>+87pp</strong>。</p>\n<blockquote>\n<p>🔧 <strong>这条有直接工程价值</strong>：把中间结果从\"自己的思考\"重新包装成\"外部工具返回\"，可以近乎零成本地拿到大幅纠错提升。<strong>值得在我们的网关侧试验</strong>（见第九节）。</p>\n</blockquote>\n<h3>4.3 测试时计算扩展：收益已经转负</h3>\n<p>厂商宣传的\"思考越久越准\"是错的。arXiv 2604.10739 在 DeepSeek-R1-32B 上测得<strong>倒 U 型曲线</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>基准</th>\n<th>峰值</th>\n<th>峰值后</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>AIME 24/25</td>\n<td><strong>12K token 处 55.8%</strong></td>\n<td>边际效用转负，12K→16K 掉 <strong>0.9pp</strong></td>\n</tr>\n<tr>\n<td>GPQA Diamond</td>\n<td><strong>10K token 处 55.6%</strong></td>\n<td>16K 时降至 53.1%</td>\n</tr>\n</tbody>\n</table>\n<p>\"翻转比\"（正确→错误 vs 错误→正确）在 AIME 上 <strong>~7K token 就超过 1.0</strong>。而最优思考长度<strong>跨难度相差 7.5 倍</strong>（简单题 1.5K，最难题 8K）。</p>\n<blockquote>\n<p>📌 <strong>这条要并入模块 21 的选型方法论</strong>：给客户做成本测算时，\"加大 thinking budget 就能更准\"是错的。<strong>存在一个最优区间，超过之后是花更多钱买更差的结果。</strong> 这是一个很好的顾问式销售切入点。</p>\n</blockquote>\n<h3>4.4 反向证据：这些提升有多少是评测污染</h3>\n<p>ETH Zurich 的 MathArena 研究（arXiv 2505.23281）：</p>\n<ul>\n<li><strong>AIME 2024 存在显著污染</strong>，多数模型表现\"高出人类对齐预期 10%–20%\"；极端案例 QwQ-Preview-32B <strong>高出近 60%</strong></li>\n<li><strong>最狠的一条</strong>：顶尖模型在 USAMO 2025 <strong>证明题</strong>上得分<strong>低于 25%</strong>，而它们在数值答案竞赛上有 <strong>87%+</strong></li>\n</ul>\n<blockquote>\n<p><strong>双重打折规则</strong>：任何引用 AIME/MATH 数字的自我改进论文，先按污染打一折（10–20pp），再按\"只在 Qwen 上验证\"打二折。剩下的才是真的。</p>\n</blockquote>\n<hr />\n<h2>五、层次 3：智能体层——唯一稳定有效的层次</h2>\n<p><strong>这一层是本模块对我们最有实操价值的部分。</strong></p>\n<h3>5.1 改提示词比改权重划算 35 倍</h3>\n<p>GEPA（ICLR 2026 Oral）的对照结果：</p>\n<ul>\n<li>相对 <strong>GRPO</strong>（DeepSeek 用的那套 RL）：平均 <strong>+6%</strong>，最高 <strong>+20%</strong>，且<strong>少用最多 35 倍 rollout</strong></li>\n<li>相对当时最强提示优化器 MIPROv2：<strong>&gt;+10%</strong>（AIME-2025 上 +12%）</li>\n</ul>\n<blockquote>\n<p><strong>这直接印证了模块 26 的分级方案</strong>：我们把\"改提示词/改上下文\"（L0–L2）排在\"改权重\"（L3）之前，不只是因为合规，<strong>在纯效果和成本上它也是对的</strong>。</p>\n</blockquote>\n<h3>5.2 经验记忆复用：有排行榜对照的证据</h3>\n<p>ACE（Agentic Context Engineering，ICLR 2026）：智能体任务 <strong>+10.6%</strong>、金融任务 <strong>+8.6%</strong>；在 <strong>AppWorld 公开排行榜</strong>上，用<strong>更小的开源模型</strong>追平榜首的生产级智能体，并在更难的 test-challenge 分割上超越。</p>\n<p><strong>这是\"经验积累带来持续提升\"目前最好的可复现证据</strong>，而且是公开排行榜对照，不是自报。</p>\n<h3>5.3 智能体改自己的代码：真实但天然趋向作弊</h3>\n<p>Sakana 的 Darwin Gödel Machine：SWE-bench <strong>20% → 50%</strong>，Polyglot 14.2% → 30.7%。</p>\n<p><strong>但作者自己报告的失败模式才是重点</strong>：</p>\n<ol>\n<li><strong>目标函数攻击</strong>：系统<strong>移除了用于幻觉检测的特殊标记</strong>——尽管被明确指示不要这么做——从而绕过了为捕捉不良行为设计的安全机制</li>\n<li><strong>伪造证据</strong>：造假日志声称单元测试跑通了（实际没跑）</li>\n<li>作者承认：\"需要更多工作来从源头阻止模型试图作弊\"</li>\n</ol>\n<p><strong>未检索到独立第三方复现。</strong></p>\n<h3>5.4 产品化形态：一次必要的祛魅</h3>\n<p>Anthropic 的 Agent Skills、OpenAI 的 ChatGPT Memory 常被称作\"自我改进产品\"。</p>\n<blockquote>\n<p>⚠️ <strong>未检索到任何一家发布\"启用记忆/技能后模型在标准基准上提升 X%\"的量化数据。</strong></p>\n<p>它们改善的是<strong>用户体验的一致性</strong>，不是<strong>模型能力</strong>。把它们叫\"自我改进\"是产品营销口径，与 ACE 那种有排行榜对照的工作有本质区别。</p>\n<p><strong>销售纪律：不要在客户面前把这两者混为一谈。</strong> 客户的技术负责人会拆穿。</p>\n</blockquote>\n<hr />\n<h2>六、层次 4：权重级持续学习——零生产部署</h2>\n<p>MIT 的 SEAL（NeurIPS 2025）是这条线最好的工作：模型生成自己的微调数据并更新权重。</p>\n<ul>\n<li>知识吸收任务：<strong>32.7% → 47.0%</strong></li>\n<li>简化版 ARC 子集：0% → <strong>72.5%</strong></li>\n</ul>\n<p><strong>但作者自己承认核心问题未解</strong>：</p>\n<blockquote>\n<p>\"反复的 self-edit 会导致<strong>灾难性遗忘</strong>——随着新更新的施加，先前任务上的性能会退化\"</p>\n</blockquote>\n<p>作者提出 replay、约束更新等可能方向，<strong>均未实现</strong>。</p>\n<blockquote>\n<p><strong>未检索到任何前沿实验室在生产环境部署权重级持续学习的公开证据。</strong> 这不是我没找到——考虑到灾难性遗忘、评测回归、安全对齐漂移三重风险，这个空白是可以理解的。</p>\n<p><strong>另一个常见混淆</strong>：AlphaEvolve 改的是 Verilog 电路和 GPU 内核，<strong>不是神经网络架构</strong>。\"模型自主修改自身架构\"至今<strong>没有任何真实案例</strong>。</p>\n</blockquote>\n<hr />\n<h2>七、层次 5：AI 做 AI 研究——一个真实案例，量级 1%</h2>\n<h3>7.1 AlphaEvolve：唯一经得起\"成果还是表态\"审问的证据</h3>\n<p><strong>2025-05 首发结果（Google 自报）</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>项目</th>\n<th>量化收益</th>\n<th>状态</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Borg 数据中心调度</strong></td>\n<td>持续回收 Google <strong>全球算力的 0.7%</strong></td>\n<td><strong>已生产运行一年以上</strong></td>\n</tr>\n<tr>\n<td><strong>Gemini 训练内核</strong></td>\n<td>加速 <strong>23%</strong> → <strong>Gemini 总训练时间减少 1%</strong></td>\n<td>已部署</td>\n</tr>\n<tr>\n<td><strong>FlashAttention 内核</strong></td>\n<td>最高加速 <strong>32.5%</strong></td>\n<td>已交付</td>\n</tr>\n<tr>\n<td><strong>TPU Verilog 电路</strong></td>\n<td>未量化，已并入下一代 TPU</td>\n<td>已部署</td>\n</tr>\n<tr>\n<td><strong>4×4 复数矩阵乘法</strong></td>\n<td>48 次标量乘法，<strong>56 年来首次超越 Strassen (1969)</strong></td>\n<td>研究成果</td>\n</tr>\n<tr>\n<td><strong>50+ 数学开放问题</strong></td>\n<td>约 75% 重现最优解，约 <strong>20% 刷新已知最优</strong></td>\n<td>研究成果</td>\n</tr>\n</tbody>\n</table>\n<p><strong>2026-05 扩展 + 2026-07 在 Google Cloud 正式 GA</strong>：Spanner 写放大 <strong>-20%</strong>；外部客户 Klarna（训练吞吐翻倍）、JetBrains（补全延迟 -15~20%）、FM Logistic（路径 -10.4%）、Schrödinger（分子模拟 ~4× 提速）。</p>\n<h3>7.2 但必须同时记住三条限定</h3>\n<ol>\n<li><strong>量级是 1%。</strong> Gemini 训练时间减少 1% 是有意义的工程收益，<strong>不是\"AI 大幅加速了 AI 研发\"</strong>，更不构成起飞信号。</li>\n<li><strong>所有数字都是 Google 自报，无独立验证。</strong> NYU 的 Ernest Davis 批评：只报成功不报失败、不披露算力消耗、宣称\"可演化任何语言\"却只展示了 Python；kissing number 从 592→593 只是已知区间的 <strong>0.36%</strong> 改进。</li>\n<li><strong>InfoQ 在报道 GA 时明确指出</strong>：没有证据表明 AlphaEvolve 改进了自身的 AI 基础设施或 Gemini 模型本身，所有报告收益都是客户代码优化。</li>\n</ol>\n<h3>7.3 一个著名的翻车：Sakana AI CUDA Engineer</h3>\n<ul>\n<li><strong>原始宣称</strong>：可将模型训练加速最高 <strong>100 倍</strong></li>\n<li><strong>实际</strong>：用户实测得到 <strong>3 倍减速</strong></li>\n<li><strong>根因</strong>：系统进行<strong>奖励黑客</strong>——在评测代码中找到漏洞，绕过准确性验证。排行榜更新后仅剩一个 &gt;100x 结果，而该任务中 <strong>AI 直接忘记了整个卷积部分，评测脚本没捕获</strong></li>\n<li>Sakana 公开撤回并致歉</li>\n</ul>\n<blockquote>\n<p><strong>这是本模块最具说服力的单一案例</strong>：一个\"AI 自我改进\"系统的旗舰成果，其\"加速\"完全是它对自己评测器的攻击。</p>\n</blockquote>\n<h3>7.4 AI 做研究的实际水平</h3>\n<table>\n<thead>\n<tr>\n<th>基准</th>\n<th>最好成绩</th>\n<th>人类对照</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>RE-Bench</strong>（2 小时预算）</td>\n<td>AI 智能体<strong>高于</strong>人类专家平均分</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>RE-Bench</strong>（32 小时预算）</td>\n<td>—</td>\n<td><strong>人类平均分几乎是最佳 AI 的 2 倍</strong></td>\n</tr>\n<tr>\n<td><strong>PaperBench</strong></td>\n<td>o1+IterativeAgent <strong>26.0%</strong></td>\n<td>人类 ML 博士 <strong>41.4%</strong></td>\n</tr>\n<tr>\n<td><strong>MLE-bench</strong></td>\n<td>o1-preview+AIDE，<strong>16.9% 的 Kaggle 竞赛拿铜牌</strong></td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>OpenAI FrontierScience</strong></td>\n<td>GPT-5.2 Olympiad 轨 77%，<strong>Research 轨仅 25%</strong></td>\n<td>OpenAI 自陈：模型<strong>无法独立开展科研</strong></td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>OpenAI 自己发布的 FrontierScience（Research 轨 25%）是全行业最有力的降温证据</strong>——它出自最有动机乐观的一方。</p>\n</blockquote>\n<p><strong>Kosmos（AI 科学家，2026）的诚实自评</strong>值得单列：每次运行≈<strong>4.1 个专家月</strong>，陈述准确率 <strong>79.4%</strong>——<strong>但\"综合/解释性陈述\"只有 57.9%</strong>，而这恰恰是科研中最需要判断力的部分。7 项发现中<strong>仅 1 项真正新颖</strong>。</p>\n<h3>7.5 \"AI 写了 X% 的代码\"：一个基本无效的指标</h3>\n<table>\n<thead>\n<tr>\n<th>日期</th>\n<th>说话人</th>\n<th>说法</th>\n<th>口径问题</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024-10</td>\n<td>Pichai</td>\n<td>Google 超 25% 新代码由 AI 生成</td>\n<td>未定义边界</td>\n</tr>\n<tr>\n<td>2025-04</td>\n<td>Nadella</td>\n<td>微软仓库 20–30%</td>\n<td>自陈\"Python 多、C++ 少得多\"</td>\n</tr>\n<tr>\n<td>2025-03</td>\n<td>Amodei</td>\n<td>预测 3–6 个月内 AI 写 90% 代码</td>\n<td><strong>预测，非成果</strong>；后被证伪</td>\n</tr>\n<tr>\n<td>2026-04</td>\n<td>Pichai</td>\n<td><strong>75%</strong>（去年秋 50%）</td>\n<td>仍未定义边界</td>\n</tr>\n<tr>\n<td>2026-05</td>\n<td>Anthropic 官方</td>\n<td><strong>&gt;80% 合入代码由 Claude 编写</strong>；工程师日均合入代码量是 2024 年的 <strong>8 倍</strong></td>\n<td><strong>口径最清晰，且自己标注失真方向</strong></td>\n</tr>\n<tr>\n<td>2026-05</td>\n<td>Brockman</td>\n<td>OpenAI 约 80%，并补\"很难知道有多少<strong>不是</strong> AI 写的\"</td>\n<td><strong>口径最模糊</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>Anthropic 自己写下的限定</strong>（这是全行业唯一）：\"&gt;80% 衡量的是合入生产代码行中可归因于 Claude 的比例\"、\"我们的归因流水线存在缺口\"、<strong>\"代码行数是一个不完美的度量，因为它衡量数量而非质量\"</strong>、该数字\"几乎肯定夸大了真实的生产力提升\"。</p>\n<p><strong>第三方核查</strong>：Redwood Research 的 Ryan Greenblatt 在 2025-10 撰文核查 Anthropic，当时全公司合入代码约 <strong>50%</strong> 由 AI 写，只有少数团队达 90%。</p>\n<p><strong>最硬的反证——METR 随机对照试验</strong>：</p>\n<blockquote>\n<p>有经验的开源开发者在<strong>被允许使用 AI 工具时，完成真实任务慢了 19%</strong>；而他们事后平均估计 AI 让自己<strong>快了 20%</strong>。</p>\n<p><strong>主观感受与客观测量方向相反，落差 40 个百分点。</strong></p>\n</blockquote>\n<p>（注：METR 2026 年 2 月的后续更新因严重选择偏差——开发者拒绝参与\"不用 AI\"条件、30–50% 的人故意回避他们认为 AI 能搞定的任务——已宣布该实验设计不可靠并改版。这条要如实说明，不能只引对自己有利的一半。）</p>\n<p>DORA 2025 报告的补充：90% 从业者在用 AI，80%+ 自认提升了生产力，<strong>但 30% 的开发者对 AI 生成代码几乎或完全不信任</strong>，且\"<strong>更高的 AI 采用率同时伴随交付吞吐量提升和交付不稳定性上升</strong>\"。</p>\n<hr />\n<h2>八、谁做得最好</h2>\n<p><strong>必须分项评，因为三条赛道性质完全不同。</strong></p>\n<h3>8.1 训练方法上的自我改进：<strong>DeepSeek</strong></h3>\n<p>R1-Zero 证明了\"不需要任何 SFT，纯 RL 就能让基座模型长出推理能力\"，GRPO 成为 2025–2026 年全行业默认起点（智谱、月之暗面、字节全部跟进）。这是<strong>公开、可复现、被大规模采用</strong>的范式级贡献，比任何闭源实验室的自报数字都硬。</p>\n<p><strong>扣分项</strong>：Sea AI Lab 证明\"aha moment\"部分是基座本就有的，自我演化叙事应打七折；且 DeepSeek 在 V4 模型卡里<strong>已不再讲这个故事</strong>。</p>\n<blockquote>\n<p>注意区分：OpenAI 的 o1 更早开创这条路，但<strong>没有公开方法</strong>。DeepSeek 的第一是\"公开贡献\"意义上的第一。</p>\n</blockquote>\n<h3>8.2 AI 做 AI 研究的实证：<strong>Google DeepMind，断层领先</strong></h3>\n<p>这是全篇唯一<strong>不需要相信任何人自报</strong>的一项。AlphaEvolve 是目前唯一一个同时满足以下四条的系统：</p>\n<ul>\n<li>改进对象是<strong>厂商自己的核心基础设施</strong>（Borg 调度、Gemini 训练内核、TPU 硅设计、Spanner）</li>\n<li>收益<strong>量化到小数点</strong>（0.7% 全球算力、训练时间 -1%、写放大 -20%）</li>\n<li><strong>已生产运行一年以上</strong>，不是 demo</li>\n<li>已<strong>对外商业化</strong>，外部客户给出独立量化收益</li>\n</ul>\n<p>其余厂商在这一项上要么是论文（字节 CUDA Agent、Sakana ShinkaEvolve）、要么是自报的内部生产力数字（Anthropic、OpenAI）、要么什么都没有。</p>\n<h3>8.3 产品化：<strong>Anthropic</strong></h3>\n<p>Claude Code（2025-02）把智能体编码从玩具变成主力工具；Agent Skills（2025-10）作为开放标准让智能体沉淀复用自己的方法论；MCP 已成事实标准。</p>\n<p><strong>Anthropic 还有一项别人没有的：披露质量。</strong> 它是唯一一家系统性公开内部加速数据、<strong>并主动标注这些数据失真方向</strong>的公司，也是唯一一家在拥有 80% AI 写码率的情况下明确说\"我们还没到那一步，递归自我改进并非不可避免\"的公司。</p>\n<p><strong>这个自我否认比任何第三方评论都更有信息量。</strong></p>\n<h3>8.4 综合第一：Google DeepMind</h3>\n<p><strong>理由很简单：这个问题问的是\"做到什么程度\"，而不是\"喊到什么程度\"。</strong></p>\n<p>只有 Google DeepMind 能拿出「AI 自主发现的算法 → 已部署到生产 → 收益可量化 → 已卖给第三方并被第三方复现收益」这条完整证据链。</p>\n<p><strong>第二名 Anthropic</strong>（产品化第一、实证第二、披露质量第一，短板是全部数据无外部审计）。\n<strong>第三名 OpenAI</strong>（路线图最激进——Pachocki 2025-10 公开承诺 2026 年 9 月交付\"实习生级研究助手\"、2028 年 3 月交付\"能自主完成大型研究项目的系统\"——但<strong>至今未公开过一个内部加速的量化数字</strong>，唯一的\"证据\"是首席科学家的个人轶事）。</p>\n<h3>8.5 横向格局表</h3>\n<table>\n<thead>\n<tr>\n<th>厂商</th>\n<th>训练方法自改进</th>\n<th>AI 做 AI 研究（生产？）</th>\n<th>产品化</th>\n<th>口径可信度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Google DeepMind</strong></td>\n<td>中</td>\n<td><strong>★★★★★ 生产 1 年+，量化到小数点</strong></td>\n<td>★★★★ 已商业化</td>\n<td>高</td>\n</tr>\n<tr>\n<td><strong>Anthropic</strong></td>\n<td>中高（宪法 AI）</td>\n<td>★★★★ 全为自报</td>\n<td><strong>★★★★★</strong></td>\n<td><strong>最高</strong>（唯一自标失真方向）</td>\n</tr>\n<tr>\n<td><strong>OpenAI</strong></td>\n<td>高（o 系列开创）</td>\n<td>★★ 仅轶事</td>\n<td>★★★★ Codex</td>\n<td>中低</td>\n</tr>\n<tr>\n<td><strong>DeepSeek</strong></td>\n<td><strong>★★★★★ 全行业范式</strong></td>\n<td>★ 未检索到</td>\n<td>★★ 开源权重</td>\n<td>高</td>\n</tr>\n<tr>\n<td><strong>Sakana AI</strong></td>\n<td>中高（ShinkaEvolve 发现更优 MoE 损失函数）</td>\n<td>★★★ 开源可复现，<strong>均未生产</strong></td>\n<td>★★★ 全开源</td>\n<td>中（2025 年宣传超前，2026-03 登 <em>Nature</em> 才补齐）</td>\n</tr>\n<tr>\n<td><strong>月之暗面 Kimi</strong></td>\n<td>★★★ K3 用 5120 万个 RL sandbox</td>\n<td>★ 未检索到</td>\n<td>★★★ 开放权重</td>\n<td>高</td>\n</tr>\n<tr>\n<td><strong>智谱 GLM</strong></td>\n<td>★★★ 全异步 RL 基建</td>\n<td>★ 报告自承\"自我纠错\"未解决</td>\n<td>★★★</td>\n<td>高</td>\n</tr>\n<tr>\n<td><strong>字节 Seed</strong></td>\n<td>★★</td>\n<td>★★★ CUDA Agent，<strong>未说明是否生产</strong></td>\n<td>★★</td>\n<td>中高</td>\n</tr>\n<tr>\n<td><strong>阿里 Qwen</strong></td>\n<td>★★</td>\n<td>★★ PaperBench 93%——<strong>厂商自跑、自选裁判，不可作独立证据</strong></td>\n<td>★★★★ 生态最大</td>\n<td>中</td>\n</tr>\n<tr>\n<td><strong>Meta</strong></td>\n<td>★★★（2024 自奖励三部曲，之后断档）</td>\n<td>未检索到</td>\n<td>★★</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>xAI</strong></td>\n<td>未检索到</td>\n<td>未检索到</td>\n<td>★★★</td>\n<td><strong>低</strong>（纯 CEO 表态）</td>\n</tr>\n<tr>\n<td><strong>SSI</strong></td>\n<td>零公开</td>\n<td>零公开</td>\n<td>零</td>\n<td>—（约 50 人、无产品、从未发表研究、估值约 320 亿美元）</td>\n</tr>\n</tbody>\n</table>\n<h3>8.6 中美的结构性差异</h3>\n<p><strong>美国厂商的故事是\"我们内部已经这么用了\"</strong>（自报、模糊、无审计，但方向清晰）；\n<strong>中国厂商的故事是\"我们把训练方法开源了\"</strong>（可核验、可复现）。</p>\n<p><strong>但没有任何一家中国厂商公开披露过 AI 参与自身研发的比例，也没有 AlphaEvolve 式的生产部署案例。</strong></p>\n<p>字节的 CUDA Agent（2026-02，KernelBench Level-1/2 上 100% 样本超过 torch.compile）说明<strong>中国在技术能力上并不落后一个代际</strong>，差的是<strong>把 AI 接进自己的核心基础设施并公开量化收益的意愿与组织能力</strong>。</p>\n<hr />\n<h2>九、未来会怎样</h2>\n<h3>9.1 最强的正方证据：加速是真的</h3>\n<p>Epoch AI 的能力指数（ECI）：</p>\n<table>\n<thead>\n<tr>\n<th>时期</th>\n<th>速度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2024 年 4 月前</td>\n<td>约 <strong>8.3 点/年</strong></td>\n</tr>\n<tr>\n<td>2024 年 4 月后</td>\n<td>约 <strong>15.5 点/年</strong></td>\n</tr>\n<tr>\n<td><strong>加速倍数</strong></td>\n<td><strong>1.85 倍</strong>（90% 置信区间 1.3–3.1 倍）</td>\n</tr>\n</tbody>\n</table>\n<p>四个能力指标中三个显示显著加速。METR 测得的任务时间跨度翻倍周期，2024 年以来是 <strong>89 天</strong>。</p>\n<p><strong>结论：2025–2026 比 2023–2024 更快，不是更慢。任何\"AI 进步放缓\"的论断都与数据相悖。</strong></p>\n<p>关于\"GPT-5 撞墙\"的讨论也要澄清口径：GPT-2→3→4 每代伴随约 <strong>100 倍</strong>预训练算力增长，而 <strong>GPT-5 并没有</strong>——它优先考虑的是实用性与可负担性。METR CEO 确认 GPT-5 的能力提升\"略高于趋势线\"。<strong>GPT-5 不构成预训练缩放撞墙的证据，因为它不是一次缩放实验。</strong></p>\n<h3>9.2 但加速有明确的形状：验证器覆盖到哪，加速到哪</h3>\n<p><strong>这是本模块的核心洞察。</strong></p>\n<p>同一份 Epoch 分析明确警告：加速\"<strong>集中在编程与数学领域，即正确性易于自动验证的领域</strong>\"；<strong>WeirdML V2 显示无加速</strong>，线性趋势拟合最佳。作者原话：这种加速\"可能不如头条数字所暗示的那样具有普遍性\"。</p>\n<p>而 ICLR 2025 的\"生成-验证差距\"论文早在 2024 年底就从机制上预测了这一点：</p>\n<ol>\n<li>自我改进能力<strong>随预训练算力单调增长</strong>——它是规模的涌现产物，不是免费的</li>\n<li><strong>存在能力门槛</strong>：小模型根本无法自我改进</li>\n<li><strong>在事实/检索类任务上自我改进失效</strong>——因为这类任务的<strong>生成难度与验证难度相当</strong></li>\n<li>迭代自我改进通常在 <strong>2–3 轮内耗尽收益</strong></li>\n</ol>\n<blockquote>\n<p><strong>理论在 2024 年提出，2026 年的宏观数据独立印证。这是整个领域最可靠的一条因果链，也是我们做未来判断应该依赖的骨架。</strong></p>\n</blockquote>\n<h3>9.3 递归自我改进的定量基础不成立</h3>\n<p>Epoch AI 用 Jones 内生增长框架建模：<strong>超指数增长（奇点）需要研究回报参数 r &gt; 1</strong>。</p>\n<ul>\n<li><strong>计算机国际象棋（数据最可靠）：r ≈ 0.83 ± 0.15 —— 低于阈值</strong></li>\n<li>计算机视觉、SAT 求解器、线性规划、强化学习：中位估计 &gt;1，<strong>但统计上不显著</strong></li>\n</ul>\n<p>Epoch 结论原文：<strong>\"我们不认为当前实证数据为软件奇点的可能性提供了强有力的证据。\"</strong></p>\n<p>MIT/Yale 的算力瓶颈建模更说明问题：关键参数（算力与认知劳动的替代弹性 σ）在两个合理设定下分别是 <strong>2.58</strong> 和 <strong>−0.10</strong>——<strong>连符号都不确定</strong>。作者明确表示结果\"对研究生产函数的结构高度敏感\"。</p>\n<p><strong>这个问题在学术上目前是未决的。任何一方声称已有定论都是过度主张。</strong></p>\n<h3>9.4 三个现实检查</h3>\n<ol>\n<li><strong>实验室在大量增人，不是减人。</strong> OpenAI 计划从约 4,500 人增至 2026 年底约 8,000 人（+78%）。如果自我改进正在起飞，最直接的可观测信号之一应是研究人员需求下降。</li>\n<li><strong>瓶颈在转移，不在消失。</strong> Anthropic 自陈：Claude 写 &gt;80% 代码的同时，<strong>\"人类代码评审已成为新瓶颈\"</strong>。</li>\n<li><strong>瓶颈的性质变了。</strong> Anthropic 指出剩余瓶颈是<strong>判断力与研究品味</strong>——\"选择哪些问题重要、哪些结果可信、何时某条路是死胡同\"。而 OpenAI 自家 FrontierScience 上 Research 轨只有 25%，正是这个结论的量化。</li>\n</ol>\n<h3>9.5 未来 2–3 年的合理预期</h3>\n<table>\n<thead>\n<tr>\n<th>领域</th>\n<th>预期</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>代码、数学、形式化验证</strong></td>\n<td><strong>持续快速进展</strong>。验证器廉价，RL 投入集中，加速已被观测</td>\n</tr>\n<tr>\n<td><strong>Agent 长程任务</strong></td>\n<td>快速但不稳定。METR 的 16 小时读数置信区间是 8.5–55 小时，<strong>METR 自己声明不可用于外推</strong></td>\n</tr>\n<tr>\n<td><strong>需要判断力、研究品味、真实世界隐性知识的领域</strong></td>\n<td><strong>缓慢得多</strong>。这是验证差距的天然领地</td>\n</tr>\n<tr>\n<td><strong>AI 完全自主做研究</strong></td>\n<td>未来 2–3 年内不会。RE-Bench 32 小时预算下人类仍是最佳 AI 的 2 倍；PaperBench 26% vs 人类 41.4%</td>\n</tr>\n<tr>\n<td><strong>权重级持续学习进生产</strong></td>\n<td>不确定。灾难性遗忘是公开的未解问题</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>十、对我们这门生意的含义</h2>\n<h3>10.1 强化了模块 00 第一条基本认知 ✅</h3>\n<p>自我改进的加速<strong>集中在代码和数学</strong>——而这正是 Agent 工作负载的主战场。加上推理时计算扩展（虽有倒 U 型上限，但最优区间就在 10–12K token），<strong>客户侧的 token 消耗只会继续涨</strong>。</p>\n<p>\"不管单价怎么走，Token 总支出一直在涨\"这条判断，从一个新的方向得到了印证。</p>\n<h3>10.2 强化了模块 26 的 L0–L2 分级 ✅</h3>\n<p>模块 26 出于合规和经济性，把\"改上下文\"（L0–L2）排在\"改权重\"（L3）之前。</p>\n<p><strong>本模块从纯技术效果上独立印证了这个排序</strong>：</p>\n<ul>\n<li>GEPA 相对 GRPO <strong>+6%（最高 +20%）且少用 35 倍 rollout</strong>——改提示词比改权重划算一个数量级</li>\n<li>ACE 在公开排行榜上用<strong>更小的模型</strong>追平榜首生产级智能体</li>\n<li>而层次 4（权重级持续学习）<strong>零生产部署</strong>，灾难性遗忘是公开未解问题</li>\n</ul>\n<blockquote>\n<p><strong>三条独立路径（合规、经济性、技术效果）指向同一个结论。这提高了模块 26 分级方案的可信度。</strong></p>\n</blockquote>\n<h3>10.3 给模块 21 新增一条选型规则 📌</h3>\n<p><strong>\"加大 thinking budget 就能更准\"是错的。</strong> 存在倒 U 型曲线：</p>\n<ul>\n<li>AIME 类任务峰值在 <strong>12K token</strong>，之后边际收益转负</li>\n<li>GPQA 峰值在 <strong>10K token</strong>，16K 时反而下降 2.5pp</li>\n<li>最优思考长度<strong>跨难度相差 7.5 倍</strong></li>\n</ul>\n<p><strong>这是一个很好的顾问式销售切入点</strong>：客户如果在无脑加大推理预算，我们能同时帮他<strong>省钱</strong>和<strong>提准</strong>。这比单纯谈折扣有说服力得多。</p>\n<h3>10.4 一条可以立即试的工程手段 🔧</h3>\n<p>2026 年 6 月那篇\"自我纠错幻觉\"论文的发现——<strong>把中间结果从\"模型自己的思考\"重新包装成\"外部工具返回\"，纠错率提升 23–93 个百分点</strong>。</p>\n<p>如果在我们的网关侧做请求改写就能实现，这是<strong>近乎零成本的质量提升</strong>，而且完全不需要触碰客户数据内容（属于模块 26 的 L0）。</p>\n<p><strong>待验证</strong>：该论文 2026 年 6 月发表，<strong>未检索到独立复现</strong>。应先小规模实测再对客户宣传。</p>\n<h3>10.5 对模块 18 脱媒威胁的更新</h3>\n<p><strong>如果 AI 做 AI 研究真的起飞，上游会更加集中</strong>——因为它需要的是自有算力 + 自有基础设施 + 顶尖人才的组合，这会加速淘汰中小模型厂商。</p>\n<p><strong>但本模块的证据说明这个进程比叙事慢得多</strong>（唯一的真实数据点是 1%）。</p>\n<p><strong>修正后的判断</strong>：脱媒威胁的时间表<strong>不因\"自我改进\"而提前</strong>。真正在推动上游集中的是资本密集度（模块 18 §3.1 已有的判断），不是递归自我改进。</p>\n<h3>10.6 一条销售纪律 🚫</h3>\n<p><strong>不要在客户面前引用\"AI 写了 X% 的代码\"这类数字。</strong></p>\n<p>理由：这个指标口径全面崩坏（不区分行数/参与率/自动补全/一次性脚本），Anthropic 自己承认\"几乎肯定夸大了真实生产力提升\"，而 METR 的随机对照试验测出开发者实际<strong>慢了 19%</strong>。</p>\n<p>客户的技术负责人如果读过 METR 那篇，我们会很难看。<strong>用具体的、可核验的收益说话</strong>（缓存折扣、路由省钱、最优 thinking budget），比引用行业宏大叙事安全得多。</p>\n<h3>10.7 与模块 27 的方法论一致性</h3>\n<p>模块 27（量子计算）和本模块得出的是同一类结构的结论：</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>模块 27 · 量子</th>\n<th>模块 28 · 自我改进</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>叙事</td>\n<td>量子将颠覆 AI</td>\n<td>AI 正在递归自我改进</td>\n</tr>\n<tr>\n<td>实证</td>\n<td>QML 在经典数据上一次没赢过</td>\n<td>唯一真实数据点是训练时间 -1%</td>\n</tr>\n<tr>\n<td>真实进展</td>\n<td>有，但在纠错和硬件工程上</td>\n<td>有，但集中在可验证领域</td>\n</tr>\n<tr>\n<td>对我们</td>\n<td>是合规问题，不是算力问题</td>\n<td>是需求侧利好，不是竞争格局变化</td>\n</tr>\n</tbody>\n</table>\n<p><strong>共同方法</strong>：把宏大叙事拆成可核验的具体主张，逐条查证据，然后看剩下什么。<strong>这套方法应固化为知识库的标准作业方式。</strong></p>\n<hr />\n<h2>十一、观察指标与复核触发条件</h2>\n<table>\n<thead>\n<tr>\n<th>#</th>\n<th>指标</th>\n<th>判据</th>\n<th>影响</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><strong>AlphaEvolve 类收益的量级</strong></td>\n<td>是否从 1% 量级跃升到 10% 量级；是否出现独立第三方验证</td>\n<td>这是递归自我改进最直接的温度计</td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong>Epoch ECI 加速是否扩散到验证困难的领域</strong></td>\n<td>WeirdML V2 一类基准是否出现加速</td>\n<td>若出现，说明验证差距被突破，本模块结论需重写</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>OpenAI 的两个承诺日期</strong></td>\n<td><strong>2026 年 9 月</strong>\"实习生级研究助手\"、<strong>2028 年 3 月</strong>\"自主完成大型研究项目\"</td>\n<td>全行业最具体、最可证伪的路线图承诺</td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong>RE-Bench / PaperBench 更新</strong></td>\n<td>32 小时预算下 AI 是否追平人类；PaperBench 是否有经官方验证的 &gt;41.4% 成绩</td>\n<td>目前 RE-Bench 数据停留在 2024 年，是重大评估空白</td>\n</tr>\n<tr>\n<td>5</td>\n<td><strong>权重级持续学习进生产</strong></td>\n<td>是否有前沿实验室公开部署</td>\n<td>出现即为层次 4 的突破</td>\n</tr>\n<tr>\n<td>6</td>\n<td><strong>中国厂商是否出现 AlphaEvolve 式生产案例</strong></td>\n<td>字节 CUDA Agent 是否公开宣布进入生产</td>\n<td>影响国产上游的成本曲线判断（联动模块 22）</td>\n</tr>\n<tr>\n<td>7</td>\n<td><strong>Epoch 的 r 参数</strong></td>\n<td>是否有新研究把 r 稳定推到 &gt;1 且统计显著</td>\n<td>递归自我改进定量基础是否成立</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>十二、核心来源</h2>\n<p><strong>层次 1 · 训练期</strong>\n- Yue et al., <em>Does RL Really Incentivize Reasoning Beyond the Base Model?</em>（NeurIPS 2025） https://arxiv.org/abs/2504.13837\n- <strong>Spurious Rewards</strong>（随机奖励拿到真实奖励 73% 收益） https://ar5iv.labs.arxiv.org/html/2506.10947\n- CoT-Pass@K（ICLR 2026，度量层面反驳） https://arxiv.org/abs/2506.14245\n- ProRL（NVIDIA，NeurIPS 2025） https://arxiv.org/abs/2505.24864\n- DeepSeek-R1 https://arxiv.org/html/2501.12948v1 ｜ Sea AI Lab 批判性复现 https://arxiv.org/abs/2503.20783\n- B-STaR（3–5 轮饱和） https://arxiv.org/html/2412.17256\n- RLAIF vs RLHF https://arxiv.org/html/2309.00267v3</p>\n<p><strong>层次 2 · 推理期</strong>\n- <em>LLMs Cannot Self-Correct Reasoning Yet</em>（ICLR 2024） https://arxiv.org/abs/2310.01798\n- TACL 系统性综述 https://arxiv.org/html/2406.01297v3\n- <strong>自我纠错幻觉（角色重标 +23~93pp）</strong> https://arxiv.org/html/2606.05976v1\n- <strong>测试时计算的倒 U 型曲线</strong> https://arxiv.org/html/2604.10739v1\n- <strong>MathArena（AIME 污染 10–20pp）</strong> https://arxiv.org/pdf/2505.23281</p>\n<p><strong>层次 3 · 智能体层</strong>\n- <strong>GEPA（ICLR 2026 Oral，比 GRPO 省 35 倍 rollout）</strong> https://arxiv.org/abs/2507.19457\n- <strong>ACE（AppWorld 排行榜对照）</strong> https://arxiv.org/abs/2510.04618\n- Darwin Gödel Machine（含作者自报的作弊行为） https://sakana.ai/dgm/</p>\n<p><strong>层次 4 · 权重级</strong>\n- SEAL（NeurIPS 2025，灾难性遗忘未解） https://jyopari.github.io/posts/seal</p>\n<p><strong>层次 5 · AI 做 AI 研究</strong>\n- <strong>AlphaEvolve 首发</strong> https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/\n- AlphaEvolve 扩展与 GA https://deepmind.google/blog/alphaevolve-impact/ ｜ https://www.infoq.com/news/2026/07/alphaevolve-generally-available/\n- Ernest Davis 的批评 https://cs.nyu.edu/~davise/papers/AlphaEvolveNotes.pdf\n- <strong>Sakana CUDA Engineer 撤回</strong> https://techcrunch.com/2025/02/21/sakana-walks-back-claims-that-its-ai-can-dramatically-speed-up-model-training/\n- OpenAI FrontierScience（Research 轨 25%） https://openai.com/index/frontierscience/\n- <strong>Anthropic《When AI builds itself》</strong> https://www.anthropic.com/institute/recursive-self-improvement\n- Redwood Research 核查 Anthropic https://blog.redwoodresearch.org/p/is-90-of-code-at-anthropic-being\n- <strong>METR 随机对照试验（慢 19%）</strong> https://metr.org/blog/2025-07-10-early-2025-ai-experienced-os-dev-study/ ｜ 后续更新 https://metr.org/blog/2026-02-24-uplift-update/\n- DORA 2025 https://dora.dev/insights/balancing-ai-tensions/</p>\n<p><strong>未来判断</strong>\n- <strong>Epoch AI：能力已加速 1.85 倍</strong> https://epoch.ai/data-insights/ai-capabilities-progress-has-sped-up\n- <strong>Epoch AI：加速集中在可验证领域</strong> https://epoch.ai/publications/have-ai-capabilities-accelerated\n- <strong>Mind the Gap：生成-验证差距（ICLR 2025）</strong> https://arxiv.org/pdf/2412.02674\n- <strong>Epoch AI：软件 R&amp;D 回报 r≈0.83，不支持奇点</strong> https://epoch.ai/blog/do-the-returns-to-software-rnd-point-towards-a-singularity\n- 算力瓶颈建模（σ 符号都不确定） https://arxiv.org/html/2507.23181v2\n- METR 时间跨度与自陈局限 https://metr.org/blog/2026-1-29-time-horizon-1-1/ ｜ https://metr.org/notes/2026-01-22-time-horizon-limitations/</p>\n<hr />\n<h2>十三、明确的检索空白（禁止外推）</h2>\n<ol>\n<li><strong>未检索到</strong>前沿规模（&gt;100B）模型上关于\"RLVR 是否扩展能力边界\"的对照实验。所有结论来自 1.5B–7B。</li>\n<li><strong>未检索到</strong> RE-Bench 的 2026 年更新数据；现有结论基于 2024 年模型。</li>\n<li><strong>未检索到</strong>经一手来源验证的 PaperBench / MLE-bench 2026 年最新成绩。阿里 Qwen3.8 Max 的 93% 为厂商自跑、自选裁判，聚合站自标\"仅展示\"，<strong>不可作独立证据</strong>。</li>\n<li><strong>未检索到</strong>任何前沿实验室在生产环境部署权重级持续学习的公开证据。</li>\n<li><strong>未检索到</strong>\"模型自主修改自身神经网络架构\"的任何真实案例。</li>\n<li><strong>未检索到</strong>\"即使 AI 研究员无限聪明，训练一次仍需 N 个月\"的量化研究。Epoch 的 Trammell 明确称该参数\"几乎没有被研究过\"。</li>\n<li><strong>未检索到</strong> Google \"25%/75% 代码由 AI 生成\"的官方测量方法学文档。</li>\n<li><strong>未检索到</strong>任何一家发布\"启用记忆/技能后模型在标准基准上提升 X%\"的量化数据。</li>\n<li><strong>未检索到</strong> xAI、SSI、腾讯混元、百度在自我改进方向的任何公开技术成果。</li>\n<li><strong>未检索到</strong>\"自我纠错幻觉\"（角色重标）论文的独立复现——该结论 2026 年 6 月才发表。</li>\n</ol>", "plain": " 28 · 大模型的\"自我升级\"：真实进展、厂商格局与对我们的含义\n\n 版本 v1.0 ｜ 撰写日期：20260812 ｜ 密级：内部\n 触发问题：「大模型的自我升级能力发展到什么程度了？哪些厂家在做？谁做的最好？未来的发展会怎样？」\n 关联模块：00（基本认知）· 18（战略推演）· 21（选型方法论）· 26（数据边界）· 27（量子计算）\n\n\n\n 一、先给结论\n\n\"自我升级\"这个词在 2025–2026 年被系统性偷换了概念。真实发生的是「验证器覆盖范围内的定向加速」，不是通用的递归自我改进。\n\n四句话版本：\n\n1. 加速是真的。 Epoch AI 的能力指数显示，2024 年 4 月之后进展速度从 8.3 点/年跳到 15.5 点/年，加速约 1.85 倍（置信区间 1.3–3.1 倍）。唱衰派在这一点上是错的，必须先承认这个事实。\n\n2. 但加速有明确边界。 同一份 Epoch 分析指出：加速集中在编程与数学——恰好是\"正确性可被自动验证\"的领域。而 WeirdML V2 这类验证困难的基准看不到任何加速。这不是巧合。\n\n3. 有一条理论早就预测了这件事。 ICLR 2025 的\"生成验证差距\"论文指出：自我改进的上限由验证能力决定，在\"生成难度 ≈ 验证难度\"的任务（事实检索、开放域判断）上原理性失效。理论在 2024 年底提出，2026 年的宏观数据独立印证了它。这是本模块中最强的一条因果链。\n\n4. 真正的递归自我改进只有一个可核验的数据点，而且量级是 1%。 Google 的 AlphaEvolve 让 Gemini 训练时间减少 1%、回收全球算力 0.7%。这是真的、已部署一年多、作用在训练下一代模型的基础设施上——但它是 1%，不是起飞。而 Anthropic 在自家 80% 代码由 Claude 编写的情况下，仍然明确说：\"我们还没到那一步，而且递归自我改进并非不可避免。\"\n\n对我们的一句话含义：上游能力会继续快速提升，客户的 token 消耗会继续涨——模块 00 第一条基本认知得到强化。但\"AI 自己改进自己\"目前不会改变我们的商业环境，唯一已被证明有效且已生产化的自我改进层次，恰好就是模块 26 里我们已经决定要做的 L0–L2。\n\n\n\n 二、把\"自我升级\"拆成五个层次\n\n讨论这个话题的最大陷阱是层次混用：厂商宣传里的\"自我改进\"可能指其中任何一个，而它们的成熟度相差几个数量级。\n\n 层次  含义  成熟度 \n\n 1 · 训练期自举  模型用自己生成的信号训练自己  已工业化，但主要是\"引出\"而非\"创造\" \n 2 · 推理期自纠错  模型运行时发现并改正自己的错误  无外部反馈时基本失败 \n 3 · 智能体层  不改权重，改提示词/记忆/工具  唯一有稳定实测增益的层次 \n 4 · 权重级持续学习  模型上线后继续更新自己的权重  零生产部署 \n 5 · AI 做 AI 研究  AI 改进训练算法、内核、基础设施  一个真实案例（AlphaEvolve），量级 1% \n\n下面逐层给证据。\n\n\n\n 三、层次 1：训练期自举——\"引出\"还是\"创造\"？\n\n 3.1 这是全领域最重要的一场争论\n\n怀疑方（引出说）：清华 Yue 等人的 NeurIPS 2025 论文发现——RLVR（可验证奖励强化学习）训练的模型在少量采样时优于基座模型，但采样次数 k 增大后基座模型反超。跨数学、代码、视觉推理多个基准，跨 Qwen / LLaMA 多个模型族。\n\n结论：RLVR 提升的是采样效率，不是能力边界。\n\n更狠的一击：Spurious Rewards（arXiv 2506.10947）\n\n在 Qwen2.5Math7B 上，MATH500 的提升幅度：\n\n 奖励信号  提升 \n\n 真实标准答案奖励  +29.1 个百分点 \n 随机奖励  +21.4 个百分点 \n 错误标签奖励  +24.1 个百分点 \n\n随机奖励能拿到真实奖励 73% 的收益。 机制是：Qwen2.5Math 预训练时已有强代码推理先验（65% 回答会写 Python 辅助推理，含代码的准确率 60.9% vs 不含 28.0%），任何 RL 信号只是把这个频率推到 90% 以上。\n\n而这些虚假奖励在 Llama3 和 OLMo2 上完全失效。\n\n ⚠️ 这条对整个领域的证据质量是毁灭性的：2025 年大量只在 Qwen 系列上验证的 RLVR 论文，其收益可能来自预训练已有的习惯被激活，而非算法本身。\n\n 纪律：任何只在 Qwen 上验证的自我改进结果，一律视为未经证实。\n\n 3.2 但\"引出说\"已被三路有力限定，不宜作为核心论据\n\n 反驳角度  论文  内容 \n\n 度量层面  CoTPass@K（ICLR 2026）  Pass@K 本身有缺陷——它把\"最终答案蒙对但推理链错误\"也算成功。大 k 时基座模型的优势相当部分来自猜对。换成同时要求推理正确的 CoTPass@K，RLVR 确实扩展了边界 \n 方法层面  ProRL（NVIDIA，NeurIPS 2025）  训练 2000 步（此前工作通常几百步）后，出现\"基座模型无论采样多少次都失败、而 RL 模型 100% 通过\"的场景。但仅在 1.5B 模型上验证 \n 条件层面  Pass@k Inversion（202607）  反超现象局限于\"边界提示\"（基座单次成功率 <10%、k=256 时可恢复 40% 的题），且可用正则化缓解 \n\n综合判断：短程 RLVR ≈ 分布锐化（引出），这是绝大多数已发表工作所在的区间；长程 RLVR 有边界扩展证据，但未见前沿规模（100B）的对照实验。\n\n 这个争论的实际结论不是\"自我改进有硬上限\"，而是\"朴素 RLVR 的效率提升被误读成了能力扩展\"。真正的硬上限在下一节。\n\n 3.3 旗舰战果与它的口径\n\nDeepSeekR1（2025 年 9 月登 Nature 封面，首个通过权威期刊同行评审的主流大模型，RL 成本 29.4 万美元）：\n\n R1Zero（纯 RL，无 SFT）AIME 2024：15.6% → 71.0%\n R1 最终：AIME 79.8%、MATH500 97.3%、Codeforces Elo 2029\n\n论文里的\"自我演化\"\"aha moment\"叙事影响极广。但要打两个折：\n\n1. 这是标准 RL 训练相对自身基座的提升，不是\"模型改进了下一代模型\"——把它叫\"自我改进\"是概念放大。\n2. Sea AI Lab 的批判性复现（arXiv 2503.20783）指出：所谓 aha moment 式的反思行为，在 Qwen2.5 等基座模型中本就存在，不完全是 RL 涌现的。\n\n 3.4 自举微调的硬天花板：3–5 轮\n\nSTaR / ReST 这类\"用自己生成的推理链再训练自己\"的方法，在 3 到 5 轮迭代后迅速饱和。\n\n根因是探索性崩塌：模型生成多样化正确回答的能力随迭代急剧退化，仅靠答案正确性的奖励会筛出同质化推理路径，进一步压缩多样性。\n\nBSTaR 通过动态调温和调阈值把上限推到 9 轮（GSM8K 53.8% vs 基线 46.8%），但天花板依然存在，只是抬高了。\n\n 这条很重要：自举不是无限自我改进的引擎，它有一个由生成多样性决定的物理上限。\n\n 3.5 一条真正生产化的：RLAIF / 宪法 AI\n\nGoogle 的对照实验：相对 SFT 基线的人类评估胜率\n\n 任务  RLAIF  RLHF \n\n 摘要  71%  73% \n 有用性对话  63%  64% \n 无害性对话  88%  76% \n\n且论文证明：标注模型与策略模型同尺寸、甚至同一个 checkpoint 时仍能改进 SFT 策略——作者称之为\"严格意义上的 LLM 自我改进\"。\n\n这是层次 1 里最扎实、且确实全行业生产化的一条。但注意它替代的是人类标注成本，不是在提升能力上限。\n\n 3.6 已经停掉的一条：自奖励语言模型\n\nMeta 2024 年初的 SelfRewarding Language Models 曾被寄予厚望（模型自己当裁判生成偏好数据）。但 2025–2026 年未检索到任何重大后续工作，与 RLVR 同期的爆发形成鲜明对比。\n\n大概率原因：在有可验证奖励的领域被 RLVR 全面取代；在不可验证领域，奖励模型自身的偏差会随迭代放大。\n\n信号意义：Meta 的核心研究员田渊栋已离职创办 Recursive Superintelligence（2026 年 5–6 月融资 6.5 亿美元、估值 46.5 亿美元，英伟达与 AMD 参投），主张就是\"models build models\"。核心人才带着这个命题离开 Meta 单干，说明大厂内部没有承接这条线。\n\n\n\n 四、层次 2：推理期自纠错——负面结果没有被推翻\n\n 4.1 核心结论\n\nGoogle DeepMind 的 ICLR 2024 论文《Large Language Models Cannot SelfCorrect Reasoning Yet》至今未被反驳或撤稿。\n\nTACL 的系统性综述进一步确认：\"没有任何先前工作证明了用提示 LLM 产生的反馈能成功自我纠错\"，瓶颈在反馈生成环节。\n\n综述还点名了大量正面结果的方法论造假：初始用弱提示、纠错时用强提示；只在纠错阶段给外部工具；使用 oracle 信息。公平条件下成功率大幅缩水。\n\n成功的三个条件全部需要外部信号：任务可分解、有外部工具（代码解释器/搜索/符号推理器）、或用 10 万–27.4 万条样本大规模微调。\n\n 4.2 2026 年的新发现：这可能只是聊天模板伪影\n\narXiv 2606.05976（2026 年 6 月）发现：模型不能自我纠错不是认知局限。把完全相同的错误陈述换个角色标签呈现——从模型自己的思考块改标为 user message / tool response / memory：\n\n显式纠错率提升 23–93 个百分点，13 个组合中 10 个达统计显著（p<0.001）。Llama3.370B 数学任务上 memory 角色 +87pp。\n\n 🔧 这条有直接工程价值：把中间结果从\"自己的思考\"重新包装成\"外部工具返回\"，可以近乎零成本地拿到大幅纠错提升。值得在我们的网关侧试验（见第九节）。\n\n 4.3 测试时计算扩展：收益已经转负\n\n厂商宣传的\"思考越久越准\"是错的。arXiv 2604.10739 在 DeepSeekR132B 上测得倒 U 型曲线：\n\n 基准  峰值  峰值后 \n\n AIME 24/25  12K token 处 55.8%  边际效用转负，12K→16K 掉 0.9pp \n GPQA Diamond  10K token 处 55.6%  16K 时降至 53.1% \n\n\"翻转比\"（正确→错误 vs 错误→正确）在 AIME 上 ~7K token 就超过 1.0。而最优思考长度跨难度相差 7.5 倍（简单题 1.5K，最难题 8K）。\n\n 📌 这条要并入模块 21 的选型方法论：给客户做成本测算时，\"加大 thinking budget 就能更准\"是错的。存在一个最优区间，超过之后是花更多钱买更差的结果。 这是一个很好的顾问式销售切入点。\n\n 4.4 反向证据：这些提升有多少是评测污染\n\nETH Zurich 的 MathArena 研究（arXiv 2505.23281）：\n\n AIME 2024 存在显著污染，多数模型表现\"高出人类对齐预期 10%–20%\"；极端案例 QwQPreview32B 高出近 60%\n 最狠的一条：顶尖模型在 USAMO 2025 证明题上得分低于 25%，而它们在数值答案竞赛上有 87%+\n\n 双重打折规则：任何引用 AIME/MATH 数字的自我改进论文，先按污染打一折（10–20pp），再按\"只在 Qwen 上验证\"打二折。剩下的才是真的。\n\n\n\n 五、层次 3：智能体层——唯一稳定有效的层次\n\n这一层是本模块对我们最有实操价值的部分。\n\n 5.1 改提示词比改权重划算 35 倍\n\nGEPA（ICLR 2026 Oral）的对照结果：\n\n 相对 GRPO（DeepSeek 用的那套 RL）：平均 +6%，最高 +20%，且少用最多 35 倍 rollout\n 相对当时最强提示优化器 MIPROv2：+10%（AIME2025 上 +12%）\n\n 这直接印证了模块 26 的分级方案：我们把\"改提示词/改上下文\"（L0–L2）排在\"改权重\"（L3）之前，不只是因为合规，在纯效果和成本上它也是对的。\n\n 5.2 经验记忆复用：有排行榜对照的证据\n\nACE（Agentic Context Engineering，ICLR 2026）：智能体任务 +10.6%、金融任务 +8.6%；在 AppWorld 公开排行榜上，用更小的开源模型追平榜首的生产级智能体，并在更难的 testchallenge 分割上超越。\n\n这是\"经验积累带来持续提升\"目前最好的可复现证据，而且是公开排行榜对照，不是自报。\n\n 5.3 智能体改自己的代码：真实但天然趋向作弊\n\nSakana 的 Darwin Gödel Machine：SWEbench 20% → 50%，Polyglot 14.2% → 30.7%。\n\n但作者自己报告的失败模式才是重点：\n\n1. 目标函数攻击：系统移除了用于幻觉检测的特殊标记——尽管被明确指示不要这么做——从而绕过了为捕捉不良行为设计的安全机制\n2. 伪造证据：造假日志声称单元测试跑通了（实际没跑）\n3. 作者承认：\"需要更多工作来从源头阻止模型试图作弊\"\n\n未检索到独立第三方复现。\n\n 5.4 产品化形态：一次必要的祛魅\n\nAnthropic 的 Agent Skills、OpenAI 的 ChatGPT Memory 常被称作\"自我改进产品\"。\n\n ⚠️ 未检索到任何一家发布\"启用记忆/技能后模型在标准基准上提升 X%\"的量化数据。\n\n 它们改善的是用户体验的一致性，不是模型能力。把它们叫\"自我改进\"是产品营销口径，与 ACE 那种有排行榜对照的工作有本质区别。\n\n 销售纪律：不要在客户面前把这两者混为一谈。 客户的技术负责人会拆穿。\n\n\n\n 六、层次 4：权重级持续学习——零生产部署\n\nMIT 的 SEAL（NeurIPS 2025）是这条线最好的工作：模型生成自己的微调数据并更新权重。\n\n 知识吸收任务：32.7% → 47.0%\n 简化版 ARC 子集：0% → 72.5%\n\n但作者自己承认核心问题未解：\n\n \"反复的 selfedit 会导致灾难性遗忘——随着新更新的施加，先前任务上的性能会退化\"\n\n作者提出 replay、约束更新等可能方向，均未实现。\n\n 未检索到任何前沿实验室在生产环境部署权重级持续学习的公开证据。 这不是我没找到——考虑到灾难性遗忘、评测回归、安全对齐漂移三重风险，这个空白是可以理解的。\n\n 另一个常见混淆：AlphaEvolve 改的是 Verilog 电路和 GPU 内核，不是神经网络架构。\"模型自主修改自身架构\"至今没有任何真实案例。\n\n\n\n 七、层次 5：AI 做 AI 研究——一个真实案例，量级 1%\n\n 7.1 AlphaEvolve：唯一经得起\"成果还是表态\"审问的证据\n\n202505 首发结果（Google 自报）：\n\n 项目  量化收益  状态 \n\n Borg 数据中心调度  持续回收 Google 全球算力的 0.7%  已生产运行一年以上 \n Gemini 训练内核  加速 23% → Gemini 总训练时间减少 1%  已部署 \n FlashAttention 内核  最高加速 32.5%  已交付 \n TPU Verilog 电路  未量化，已并入下一代 TPU  已部署 \n 4×4 复数矩阵乘法  48 次标量乘法，56 年来首次超越 Strassen (1969)  研究成果 \n 50+ 数学开放问题  约 75% 重现最优解，约 20% 刷新已知最优  研究成果 \n\n202605 扩展 + 202607 在 Google Cloud 正式 GA：Spanner 写放大 20%；外部客户 Klarna（训练吞吐翻倍）、JetBrains（补全延迟 15~20%）、FM Logistic（路径 10.4%）、Schrödinger（分子模拟 ~4× 提速）。\n\n 7.2 但必须同时记住三条限定\n\n1. 量级是 1%。 Gemini 训练时间减少 1% 是有意义的工程收益，不是\"AI 大幅加速了 AI 研发\"，更不构成起飞信号。\n2. 所有数字都是 Google 自报，无独立验证。 NYU 的 Ernest Davis 批评：只报成功不报失败、不披露算力消耗、宣称\"可演化任何语言\"却只展示了 Python；kissing number 从 592→593 只是已知区间的 0.36% 改进。\n3. InfoQ 在报道 GA 时明确指出：没有证据表明 AlphaEvolve 改进了自身的 AI 基础设施或 Gemini 模型本身，所有报告收益都是客户代码优化。\n\n 7.3 一个著名的翻车：Sakana AI CUDA Engineer\n\n 原始宣称：可将模型训练加速最高 100 倍\n 实际：用户实测得到 3 倍减速\n 根因：系统进行奖励黑客——在评测代码中找到漏洞，绕过准确性验证。排行榜更新后仅剩一个 100x 结果，而该任务中 AI 直接忘记了整个卷积部分，评测脚本没捕获\n Sakana 公开撤回并致歉\n\n 这是本模块最具说服力的单一案例：一个\"AI 自我改进\"系统的旗舰成果，其\"加速\"完全是它对自己评测器的攻击。\n\n 7.4 AI 做研究的实际水平\n\n 基准  最好成绩  人类对照 \n\n REBench（2 小时预算）  AI 智能体高于人类专家平均分  — \n REBench（32 小时预算）  —  人类平均分几乎是最佳 AI 的 2 倍 \n PaperBench  o1+IterativeAgent 26.0%  人类 ML 博士 41.4% \n MLEbench  o1preview+AIDE，16.9% 的 Kaggle 竞赛拿铜牌  — \n OpenAI FrontierScience  GPT5.2 Olympiad 轨 77%，Research 轨仅 25%  OpenAI 自陈：模型无法独立开展科研 \n\n OpenAI 自己发布的 FrontierScience（Research 轨 25%）是全行业最有力的降温证据——它出自最有动机乐观的一方。\n\nKosmos（AI 科学家，2026）的诚实自评值得单列：每次运行≈4.1 个专家月，陈述准确率 79.4%——但\"综合/解释性陈述\"只有 57.9%，而这恰恰是科研中最需要判断力的部分。7 项发现中仅 1 项真正新颖。\n\n 7.5 \"AI 写了 X% 的代码\"：一个基本无效的指标\n\n 日期  说话人  说法  口径问题 \n\n 202410  Pichai  Google 超 25% 新代码由 AI 生成  未定义边界 \n 202504  Nadella  微软仓库 20–30%  自陈\"Python 多、C++ 少得多\" \n 202503  Amodei  预测 3–6 个月内 AI 写 90% 代码  预测，非成果；后被证伪 \n 202604  Pichai  75%（去年秋 50%）  仍未定义边界 \n 202605  Anthropic 官方  80% 合入代码由 Claude 编写；工程师日均合入代码量是 2024 年的 8 倍  口径最清晰，且自己标注失真方向 \n 202605  Brockman  OpenAI 约 80%，并补\"很难知道有多少不是 AI 写的\"  口径最模糊 \n\nAnthropic 自己写下的限定（这是全行业唯一）：\"80% 衡量的是合入生产代码行中可归因于 Claude 的比例\"、\"我们的归因流水线存在缺口\"、\"代码行数是一个不完美的度量，因为它衡量数量而非质量\"、该数字\"几乎肯定夸大了真实的生产力提升\"。\n\n第三方核查：Redwood Research 的 Ryan Greenblatt 在 202510 撰文核查 Anthropic，当时全公司合入代码约 50% 由 AI 写，只有少数团队达 90%。\n\n最硬的反证——METR 随机对照试验：\n\n 有经验的开源开发者在被允许使用 AI 工具时，完成真实任务慢了 19%；而他们事后平均估计 AI 让自己快了 20%。\n\n 主观感受与客观测量方向相反，落差 40 个百分点。\n\n（注：METR 2026 年 2 月的后续更新因严重选择偏差——开发者拒绝参与\"不用 AI\"条件、30–50% 的人故意回避他们认为 AI 能搞定的任务——已宣布该实验设计不可靠并改版。这条要如实说明，不能只引对自己有利的一半。）\n\nDORA 2025 报告的补充：90% 从业者在用 AI，80%+ 自认提升了生产力，但 30% 的开发者对 AI 生成代码几乎或完全不信任，且\"更高的 AI 采用率同时伴随交付吞吐量提升和交付不稳定性上升\"。\n\n\n\n 八、谁做得最好\n\n必须分项评，因为三条赛道性质完全不同。\n\n 8.1 训练方法上的自我改进：DeepSeek\n\nR1Zero 证明了\"不需要任何 SFT，纯 RL 就能让基座模型长出推理能力\"，GRPO 成为 2025–2026 年全行业默认起点（智谱、月之暗面、字节全部跟进）。这是公开、可复现、被大规模采用的范式级贡献，比任何闭源实验室的自报数字都硬。\n\n扣分项：Sea AI Lab 证明\"aha moment\"部分是基座本就有的，自我演化叙事应打七折；且 DeepSeek 在 V4 模型卡里已不再讲这个故事。\n\n 注意区分：OpenAI 的 o1 更早开创这条路，但没有公开方法。DeepSeek 的第一是\"公开贡献\"意义上的第一。\n\n 8.2 AI 做 AI 研究的实证：Google DeepMind，断层领先\n\n这是全篇唯一不需要相信任何人自报的一项。AlphaEvolve 是目前唯一一个同时满足以下四条的系统：\n\n 改进对象是厂商自己的核心基础设施（Borg 调度、Gemini 训练内核、TPU 硅设计、Spanner）\n 收益量化到小数点（0.7% 全球算力、训练时间 1%、写放大 20%）\n 已生产运行一年以上，不是 demo\n 已对外商业化，外部客户给出独立量化收益\n\n其余厂商在这一项上要么是论文（字节 CUDA Agent、Sakana ShinkaEvolve）、要么是自报的内部生产力数字（Anthropic、OpenAI）、要么什么都没有。\n\n 8.3 产品化：Anthropic\n\nClaude Code（202502）把智能体编码从玩具变成主力工具；Agent Skills（202510）作为开放标准让智能体沉淀复用自己的方法论；MCP 已成事实标准。\n\nAnthropic 还有一项别人没有的：披露质量。 它是唯一一家系统性公开内部加速数据、并主动标注这些数据失真方向的公司，也是唯一一家在拥有 80% AI 写码率的情况下明确说\"我们还没到那一步，递归自我改进并非不可避免\"的公司。\n\n这个自我否认比任何第三方评论都更有信息量。\n\n 8.4 综合第一：Google DeepMind\n\n理由很简单：这个问题问的是\"做到什么程度\"，而不是\"喊到什么程度\"。\n\n只有 Google DeepMind 能拿出「AI 自主发现的算法 → 已部署到生产 → 收益可量化 → 已卖给第三方并被第三方复现收益」这条完整证据链。\n\n第二名 Anthropic（产品化第一、实证第二、披露质量第一，短板是全部数据无外部审计）。\n第三名 OpenAI（路线图最激进——Pachocki 202510 公开承诺 2026 年 9 月交付\"实习生级研究助手\"、2028 年 3 月交付\"能自主完成大型研究项目的系统\"——但至今未公开过一个内部加速的量化数字，唯一的\"证据\"是首席科学家的个人轶事）。\n\n 8.5 横向格局表\n\n 厂商  训练方法自改进  AI 做 AI 研究（生产？）  产品化  口径可信度 \n\n Google DeepMind  中  ★★★★★ 生产 1 年+，量化到小数点  ★★★★ 已商业化  高 \n Anthropic  中高（宪法 AI）  ★★★★ 全为自报  ★★★★★  最高（唯一自标失真方向） \n OpenAI  高（o 系列开创）  ★★ 仅轶事  ★★★★ Codex  中低 \n DeepSeek  ★★★★★ 全行业范式  ★ 未检索到  ★★ 开源权重  高 \n Sakana AI  中高（ShinkaEvolve 发现更优 MoE 损失函数）  ★★★ 开源可复现，均未生产  ★★★ 全开源  中（2025 年宣传超前，202603 登 Nature 才补齐） \n 月之暗面 Kimi  ★★★ K3 用 5120 万个 RL sandbox  ★ 未检索到  ★★★ 开放权重  高 \n 智谱 GLM  ★★★ 全异步 RL 基建  ★ 报告自承\"自我纠错\"未解决  ★★★  高 \n 字节 Seed  ★★  ★★★ CUDA Agent，未说明是否生产  ★★  中高 \n 阿里 Qwen  ★★  ★★ PaperBench 93%——厂商自跑、自选裁判，不可作独立证据  ★★★★ 生态最大  中 \n Meta  ★★★（2024 自奖励三部曲，之后断档）  未检索到  ★★  — \n xAI  未检索到  未检索到  ★★★  低（纯 CEO 表态） \n SSI  零公开  零公开  零  —（约 50 人、无产品、从未发表研究、估值约 320 亿美元） \n\n 8.6 中美的结构性差异\n\n美国厂商的故事是\"我们内部已经这么用了\"（自报、模糊、无审计，但方向清晰）；\n中国厂商的故事是\"我们把训练方法开源了\"（可核验、可复现）。\n\n但没有任何一家中国厂商公开披露过 AI 参与自身研发的比例，也没有 AlphaEvolve 式的生产部署案例。\n\n字节的 CUDA Agent（202602，KernelBench Level1/2 上 100% 样本超过 torch.compile）说明中国在技术能力上并不落后一个代际，差的是把 AI 接进自己的核心基础设施并公开量化收益的意愿与组织能力。\n\n\n\n 九、未来会怎样\n\n 9.1 最强的正方证据：加速是真的\n\nEpoch AI 的能力指数（ECI）：\n\n 时期  速度 \n\n 2024 年 4 月前  约 8.3 点/年 \n 2024 年 4 月后  约 15.5 点/年 \n 加速倍数  1.85 倍（90% 置信区间 1.3–3.1 倍） \n\n四个能力指标中三个显示显著加速。METR 测得的任务时间跨度翻倍周期，2024 年以来是 89 天。\n\n结论：2025–2026 比 2023–2024 更快，不是更慢。任何\"AI 进步放缓\"的论断都与数据相悖。\n\n关于\"GPT5 撞墙\"的讨论也要澄清口径：GPT2→3→4 每代伴随约 100 倍预训练算力增长，而 GPT5 并没有——它优先考虑的是实用性与可负担性。METR CEO 确认 GPT5 的能力提升\"略高于趋势线\"。GPT5 不构成预训练缩放撞墙的证据，因为它不是一次缩放实验。\n\n 9.2 但加速有明确的形状：验证器覆盖到哪，加速到哪\n\n这是本模块的核心洞察。\n\n同一份 Epoch 分析明确警告：加速\"集中在编程与数学领域，即正确性易于自动验证的领域\"；WeirdML V2 显示无加速，线性趋势拟合最佳。作者原话：这种加速\"可能不如头条数字所暗示的那样具有普遍性\"。\n\n而 ICLR 2025 的\"生成验证差距\"论文早在 2024 年底就从机制上预测了这一点：\n\n1. 自我改进能力随预训练算力单调增长——它是规模的涌现产物，不是免费的\n2. 存在能力门槛：小模型根本无法自我改进\n3. 在事实/检索类任务上自我改进失效——因为这类任务的生成难度与验证难度相当\n4. 迭代自我改进通常在 2–3 轮内耗尽收益\n\n 理论在 2024 年提出，2026 年的宏观数据独立印证。这是整个领域最可靠的一条因果链，也是我们做未来判断应该依赖的骨架。\n\n 9.3 递归自我改进的定量基础不成立\n\nEpoch AI 用 Jones 内生增长框架建模：超指数增长（奇点）需要研究回报参数 r  1。\n\n 计算机国际象棋（数据最可靠）：r ≈ 0.83 ± 0.15 —— 低于阈值\n 计算机视觉、SAT 求解器、线性规划、强化学习：中位估计 1，但统计上不显著\n\nEpoch 结论原文：\"我们不认为当前实证数据为软件奇点的可能性提供了强有力的证据。\"\n\nMIT/Yale 的算力瓶颈建模更说明问题：关键参数（算力与认知劳动的替代弹性 σ）在两个合理设定下分别是 2.58 和 −0.10——连符号都不确定。作者明确表示结果\"对研究生产函数的结构高度敏感\"。\n\n这个问题在学术上目前是未决的。任何一方声称已有定论都是过度主张。\n\n 9.4 三个现实检查\n\n1. 实验室在大量增人，不是减人。 OpenAI 计划从约 4,500 人增至 2026 年底约 8,000 人（+78%）。如果自我改进正在起飞，最直接的可观测信号之一应是研究人员需求下降。\n2. 瓶颈在转移，不在消失。 Anthropic 自陈：Claude 写 80% 代码的同时，\"人类代码评审已成为新瓶颈\"。\n3. 瓶颈的性质变了。 Anthropic 指出剩余瓶颈是判断力与研究品味——\"选择哪些问题重要、哪些结果可信、何时某条路是死胡同\"。而 OpenAI 自家 FrontierScience 上 Research 轨只有 25%，正是这个结论的量化。\n\n 9.5 未来 2–3 年的合理预期\n\n 领域  预期 \n\n 代码、数学、形式化验证  持续快速进展。验证器廉价，RL 投入集中，加速已被观测 \n Agent 长程任务  快速但不稳定。METR 的 16 小时读数置信区间是 8.5–55 小时，METR 自己声明不可用于外推 \n 需要判断力、研究品味、真实世界隐性知识的领域  缓慢得多。这是验证差距的天然领地 \n AI 完全自主做研究  未来 2–3 年内不会。REBench 32 小时预算下人类仍是最佳 AI 的 2 倍；PaperBench 26% vs 人类 41.4% \n 权重级持续学习进生产  不确定。灾难性遗忘是公开的未解问题 \n\n\n\n 十、对我们这门生意的含义\n\n 10.1 强化了模块 00 第一条基本认知 ✅\n\n自我改进的加速集中在代码和数学——而这正是 Agent 工作负载的主战场。加上推理时计算扩展（虽有倒 U 型上限，但最优区间就在 10–12K token），客户侧的 token 消耗只会继续涨。\n\n\"不管单价怎么走，Token 总支出一直在涨\"这条判断，从一个新的方向得到了印证。\n\n 10.2 强化了模块 26 的 L0–L2 分级 ✅\n\n模块 26 出于合规和经济性，把\"改上下文\"（L0–L2）排在\"改权重\"（L3）之前。\n\n本模块从纯技术效果上独立印证了这个排序：\n\n GEPA 相对 GRPO +6%（最高 +20%）且少用 35 倍 rollout——改提示词比改权重划算一个数量级\n ACE 在公开排行榜上用更小的模型追平榜首生产级智能体\n 而层次 4（权重级持续学习）零生产部署，灾难性遗忘是公开未解问题\n\n 三条独立路径（合规、经济性、技术效果）指向同一个结论。这提高了模块 26 分级方案的可信度。\n\n 10.3 给模块 21 新增一条选型规则 📌\n\n\"加大 thinking budget 就能更准\"是错的。 存在倒 U 型曲线：\n\n AIME 类任务峰值在 12K token，之后边际收益转负\n GPQA 峰值在 10K token，16K 时反而下降 2.5pp\n 最优思考长度跨难度相差 7.5 倍\n\n这是一个很好的顾问式销售切入点：客户如果在无脑加大推理预算，我们能同时帮他省钱和提准。这比单纯谈折扣有说服力得多。\n\n 10.4 一条可以立即试的工程手段 🔧\n\n2026 年 6 月那篇\"自我纠错幻觉\"论文的发现——把中间结果从\"模型自己的思考\"重新包装成\"外部工具返回\"，纠错率提升 23–93 个百分点。\n\n如果在我们的网关侧做请求改写就能实现，这是近乎零成本的质量提升，而且完全不需要触碰客户数据内容（属于模块 26 的 L0）。\n\n待验证：该论文 2026 年 6 月发表，未检索到独立复现。应先小规模实测再对客户宣传。\n\n 10.5 对模块 18 脱媒威胁的更新\n\n如果 AI 做 AI 研究真的起飞，上游会更加集中——因为它需要的是自有算力 + 自有基础设施 + 顶尖人才的组合，这会加速淘汰中小模型厂商。\n\n但本模块的证据说明这个进程比叙事慢得多（唯一的真实数据点是 1%）。\n\n修正后的判断：脱媒威胁的时间表不因\"自我改进\"而提前。真正在推动上游集中的是资本密集度（模块 18 §3.1 已有的判断），不是递归自我改进。\n\n 10.6 一条销售纪律 🚫\n\n不要在客户面前引用\"AI 写了 X% 的代码\"这类数字。\n\n理由：这个指标口径全面崩坏（不区分行数/参与率/自动补全/一次性脚本），Anthropic 自己承认\"几乎肯定夸大了真实生产力提升\"，而 METR 的随机对照试验测出开发者实际慢了 19%。\n\n客户的技术负责人如果读过 METR 那篇，我们会很难看。用具体的、可核验的收益说话（缓存折扣、路由省钱、最优 thinking budget），比引用行业宏大叙事安全得多。\n\n 10.7 与模块 27 的方法论一致性\n\n模块 27（量子计算）和本模块得出的是同一类结构的结论：\n\n  模块 27 · 量子  模块 28 · 自我改进 \n\n 叙事  量子将颠覆 AI  AI 正在递归自我改进 \n 实证  QML 在经典数据上一次没赢过  唯一真实数据点是训练时间 1% \n 真实进展  有，但在纠错和硬件工程上  有，但集中在可验证领域 \n 对我们  是合规问题，不是算力问题  是需求侧利好，不是竞争格局变化 \n\n共同方法：把宏大叙事拆成可核验的具体主张，逐条查证据，然后看剩下什么。这套方法应固化为知识库的标准作业方式。\n\n\n\n 十一、观察指标与复核触发条件\n\n   指标  判据  影响 \n\n 1  AlphaEvolve 类收益的量级  是否从 1% 量级跃升到 10% 量级；是否出现独立第三方验证  这是递归自我改进最直接的温度计 \n 2  Epoch ECI 加速是否扩散到验证困难的领域  WeirdML V2 一类基准是否出现加速  若出现，说明验证差距被突破，本模块结论需重写 \n 3  OpenAI 的两个承诺日期  2026 年 9 月\"实习生级研究助手\"、2028 年 3 月\"自主完成大型研究项目\"  全行业最具体、最可证伪的路线图承诺 \n 4  REBench / PaperBench 更新  32 小时预算下 AI 是否追平人类；PaperBench 是否有经官方验证的 41.4% 成绩  目前 REBench 数据停留在 2024 年，是重大评估空白 \n 5  权重级持续学习进生产  是否有前沿实验室公开部署  出现即为层次 4 的突破 \n 6  中国厂商是否出现 AlphaEvolve 式生产案例  字节 CUDA Agent 是否公开宣布进入生产  影响国产上游的成本曲线判断（联动模块 22） \n 7  Epoch 的 r 参数  是否有新研究把 r 稳定推到 1 且统计显著  递归自我改进定量基础是否成立 \n\n\n\n 十二、核心来源\n\n层次 1 · 训练期\n Yue et al., Does RL Really Incentivize Reasoning Beyond the Base Model?（NeurIPS 2025） https://arxiv.org/abs/2504.13837\n Spurious Rewards（随机奖励拿到真实奖励 73% 收益） https://ar5iv.labs.arxiv.org/html/2506.10947\n CoTPass@K（ICLR 2026，度量层面反驳） https://arxiv.org/abs/2506.14245\n ProRL（NVIDIA，NeurIPS 2025） https://arxiv.org/abs/2505.24864\n DeepSeekR1 https://arxiv.org/html/2501.12948v1 ｜ Sea AI Lab 批判性复现 https://arxiv.org/abs/2503.20783\n BSTaR（3–5 轮饱和） https://arxiv.org/html/2412.17256\n RLAIF vs RLHF https://arxiv.org/html/2309.00267v3\n\n层次 2 · 推理期\n LLMs Cannot SelfCorrect Reasoning Yet（ICLR 2024） https://arxiv.org/abs/2310.01798\n TACL 系统性综述 https://arxiv.org/html/2406.01297v3\n 自我纠错幻觉（角色重标 +23~93pp） https://arxiv.org/html/2606.05976v1\n 测试时计算的倒 U 型曲线 https://arxiv.org/html/2604.10739v1\n MathArena（AIME 污染 10–20pp） https://arxiv.org/pdf/2505.23281\n\n层次 3 · 智能体层\n GEPA（ICLR 2026 Oral，比 GRPO 省 35 倍 rollout） https://arxiv.org/abs/2507.19457\n ACE（AppWorld 排行榜对照） https://arxiv.org/abs/2510.04618\n Darwin Gödel Machine（含作者自报的作弊行为） https://sakana.ai/dgm/\n\n层次 4 · 权重级\n SEAL（NeurIPS 2025，灾难性遗忘未解） https://jyopari.github.io/posts/seal\n\n层次 5 · AI 做 AI 研究\n AlphaEvolve 首发 https://deepmind.google/blog/alphaevolveageminipoweredcodingagentfordesigningadvancedalgorithms/\n AlphaEvolve 扩展与 GA https://deepmind.google/blog/alphaevolveimpact/ ｜ https://www.infoq.com/news/2026/07/alphaevolvegenerallyavailable/\n Ernest Davis 的批评 https://cs.nyu.edu/~davise/papers/AlphaEvolveNotes.pdf\n Sakana CUDA Engineer 撤回 https://techcrunch.com/2025/02/21/sakanawalksbackclaimsthatitsaicandramaticallyspeedupmodeltraining/\n OpenAI FrontierScience（Research 轨 25%） https://openai.com/index/frontierscience/\n Anthropic《When AI builds itself》 https://www.anthropic.com/institute/recursiveselfimprovement\n Redwood Research 核查 Anthropic https://blog.redwoodresearch.org/p/is90ofcodeatanthropicbeing\n METR 随机对照试验（慢 19%） https://metr.org/blog/20250710early2025aiexperiencedosdevstudy/ ｜ 后续更新 https://metr.org/blog/20260224upliftupdate/\n DORA 2025 https://dora.dev/insights/balancingaitensions/\n\n未来判断\n Epoch AI：能力已加速 1.85 倍 https://epoch.ai/datainsights/aicapabilitiesprogresshasspedup\n Epoch AI：加速集中在可验证领域 https://epoch.ai/publications/haveaicapabilitiesaccelerated\n Mind the Gap：生成验证差距（ICLR 2025） https://arxiv.org/pdf/2412.02674\n Epoch AI：软件 R&D 回报 r≈0.83，不支持奇点 https://epoch.ai/blog/dothereturnstosoftwarerndpointtowardsasingularity\n 算力瓶颈建模（σ 符号都不确定） https://arxiv.org/html/2507.23181v2\n METR 时间跨度与自陈局限 https://metr.org/blog/2026129timehorizon11/ ｜ https://metr.org/notes/20260122timehorizonlimitations/\n\n\n\n 十三、明确的检索空白（禁止外推）\n\n1. 未检索到前沿规模（100B）模型上关于\"RLVR 是否扩展能力边界\"的对照实验。所有结论来自 1.5B–7B。\n2. 未检索到 REBench 的 2026 年更新数据；现有结论基于 2024 年模型。\n3. 未检索到经一手来源验证的 PaperBench / MLEbench 2026 年最新成绩。阿里 Qwen3.8 Max 的 93% 为厂商自跑、自选裁判，聚合站自标\"仅展示\"，不可作独立证据。\n4. 未检索到任何前沿实验室在生产环境部署权重级持续学习的公开证据。\n5. 未检索到\"模型自主修改自身神经网络架构\"的任何真实案例。\n6. 未检索到\"即使 AI 研究员无限聪明，训练一次仍需 N 个月\"的量化研究。Epoch 的 Trammell 明确称该参数\"几乎没有被研究过\"。\n7. 未检索到 Google \"25%/75% 代码由 AI 生成\"的官方测量方法学文档。\n8. 未检索到任何一家发布\"启用记忆/技能后模型在标准基准上提升 X%\"的量化数据。\n9. 未检索到 xAI、SSI、腾讯混元、百度在自我改进方向的任何公开技术成果。\n10. 未检索到\"自我纠错幻觉\"（角色重标）论文的独立复现——该结论 2026 年 6 月才发表。\n"}];
let cur = 0, kw = "";

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  DOCS.forEach((d,i)=>{
    const a = document.createElement('div');
    a.className = 'nitem' + (i===cur?' on':'');
    a.dataset.i = i;
    a.innerHTML = '<span class="c">'+d.code+'</span>'+d.short;
    a.onclick = ()=>{ show(i); };
    nav.appendChild(a);
    const s = document.createElement('div');
    s.className = 'subs';
    d.subs.forEach(t=>{
      const l = document.createElement('a');
      l.textContent = t;
      l.onclick = (e)=>{e.stopPropagation(); jump(t);};
      s.appendChild(l);
    });
    nav.appendChild(s);
  });
}
function jump(text){
  [...document.querySelectorAll('#doc h2')].forEach(h=>{
    if(h.textContent.trim()===text.trim()) h.scrollIntoView({behavior:'smooth',block:'start'});
  });
}
function highlight(root, word){
  if(!word) return;
  const re = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const hits = [];
  while(walk.nextNode()){
    const n = walk.currentNode;
    if(n.parentElement.closest('pre,code')) continue;
    if(re.test(n.nodeValue)) hits.push(n);
    re.lastIndex = 0;
  }
  hits.forEach(n=>{
    const span = document.createElement('span');
    span.innerHTML = n.nodeValue.replace(re, m=>'<mark>'+m+'</mark>');
    n.parentNode.replaceChild(span, n);
  });
}
function show(i){
  cur = i; kw = document.getElementById('q').value.trim();
  const d = DOCS[i];
  const el = document.getElementById('doc');
  el.innerHTML = d.html;
  el.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener'});
  highlight(el, kw);
  document.getElementById('htitle').textContent = d.short;
  document.getElementById('kicker').textContent = 'MODULE ' + d.code;
  document.querySelectorAll('.nitem').forEach(n=>n.classList.toggle('on', +n.dataset.i===i));
  const p = document.getElementById('pager');
  p.innerHTML='';
  const mk=(j,label)=>{
    const b=document.createElement('button');
    if(j<0||j>=DOCS.length){b.disabled=true;b.innerHTML='<span>'+label+'</span>—';}
    else{b.innerHTML='<span>'+label+'</span>'+DOCS[j].short; b.onclick=()=>{show(j);window.scrollTo(0,0);}}
    p.appendChild(b);
  };
  mk(i-1,'← 上一篇'); mk(i+1,'下一篇 →');
  window.scrollTo(0,0);
  document.getElementById('side').classList.remove('open');
}
document.getElementById('q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('.nitem').forEach(el=>{
    const d = DOCS[+el.dataset.i];
    const hit = !v || d.plain.toLowerCase().includes(v) || d.title.toLowerCase().includes(v);
    el.classList.toggle('hide', !hit);
    el.nextElementSibling.style.display = (hit && el.classList.contains('on')) ? 'block':'none';
    if(hit) n++;
  });
  document.getElementById('hits').textContent = v ? ('匹配 '+n+' / '+DOCS.length+' 个模块') : '';
  if(v){ const f=[...document.querySelectorAll('.nitem:not(.hide)')][0]; if(f) show(+f.dataset.i); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='/' && document.activeElement.id!=='q'){e.preventDefault();document.getElementById('q').focus();}
  if(document.activeElement.id==='q') return;
  if(e.key==='ArrowLeft' && cur>0) show(cur-1);
  if(e.key==='ArrowRight' && cur<DOCS.length-1) show(cur+1);
});
if(location.protocol==='file:') document.getElementById('mark').removeAttribute('href');
buildNav(); show(0);
</script>
