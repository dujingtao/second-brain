作方式的理解。</strong></p>\n<p><strong>黄仁勋的立场</strong>：专业化不仅需要好模型，更需要围绕模型构建专属 Harness 并注入领域知识；<strong>企业核心智能绝不能外包，必须依托开放工具自主构建</strong>。</p>\n<p><strong>NemoClaw 蓝图的核心主张</strong>：企业需要<strong>控制模型周围的系统</strong>——工具、上下文、评估、运行位置、策略。目标是建立\"开放、受管的智能体系统\"，实现对专有知识的所有权与控制，面向受监管行业强调可审计性与风险管理。</p>\n<h3>三、站得住的部分</h3>\n<p><strong>「性能差异来自 harness 而非模型」这句话，直接支撑了我们在模块 18 的核心反驳。</strong></p>\n<p>模块 18 第 3.2 节论证过：换 URL 只需三十秒，但换来的是一个<strong>能跑</strong>的系统而不是<strong>等价</strong>的系统，真实成本藏在验证里。<strong>Harness 工程给这件事起了名字，还给了它一套工程学科。</strong> 提示词调优、评测集、trace 分析、上下文压缩策略、子 Agent 协调——这些全是围绕特定模型行为积累起来的资产，换模型就要重来一遍。</p>\n<p><strong>这条对销售极其有用</strong>，因为它把一个抽象的说法变成了客户能听懂的具体投入。话术：</p>\n<blockquote>\n<p>\"你们的 Agent 效果好不好，其实不主要取决于用哪个模型，取决于你们围着模型搭的那一套东西——规划怎么做、上下文怎么压、子 Agent 怎么协调、trace 怎么看。这套东西才是你们真正的资产。所以模型这一层反而应该保持灵活，别把自己焊死在一家上。\"</p>\n</blockquote>\n<p><strong>这个话术的高明之处在于</strong>：它同时论证了\"harness 值得投入\"（客户认同）和\"模型层应当可切换\"（正好是我们的产品）。<strong>它把客户对自身资产的重视，转化成了对我们的需求。</strong></p>\n<p><strong>「真相来源从代码变成代码 + trace」也是可直接落地的一条。</strong> 它意味着企业客户会越来越需要完整的调用轨迹——而<strong>轨迹留存正是我们已经在做的事</strong>（模块 08 要求的 6 个月日志留存）。原本是合规负担，现在同时是工程刚需。<strong>这是一个可以立刻改写话术的转变</strong>：从\"我们帮你满足监管要求\"变成\"我们帮你满足监管要求，顺便给了你调试 Agent 必需的 trace\"。</p>\n<h3>四、需要警惕的部分</h3>\n<h4>4.1 两位对话者的判断互相矛盾，而且各自都在讲对自己有利的话</h4>\n<p><strong>这是本次收录最需要记住的一点。</strong></p>\n<p><strong>黄仁勋说</strong>：企业核心智能不能外包，必须依托开放工具自主构建。\n<strong>Chase 的观点却暗示</strong>：harness 自研比构建框架难得多，<strong>大多数公司会采购现成方案</strong>（比如 LangChain 的 Deep Agents）。</p>\n<p>两个人在同一场对话里，给出了方向相反的建议。原因不难理解：</p>\n<p><strong>英伟达卖算力。</strong> 企业自建 harness、自托管开源模型、跑在自己的基础设施上——每一项都直接增加 GPU 需求。\"自主构建\"对 NVIDIA 是最优解。</p>\n<p><strong>LangChain 卖 harness。</strong> \"自研很难\"这个判断，恰好通向\"所以用我们的\"。</p>\n<p><strong>两个人可能都是对的，但都不是中立的。</strong> 更可能的现实是分层：<strong>核心业务逻辑与领域知识自建（黄仁勋对的部分），底层工程脚手架采购（Chase 对的部分）</strong>。</p>\n<p><strong>给销售的纪律</strong>：不要引用任何一方的结论作为\"行业共识\"。可以引用 Chase 关于\"性能差异来自 harness\"的观察（那是经验事实），但不要引用\"必须自建\"或\"多数会采购\"作为论据——<strong>客户里但凡有懂行的，一问立场就把我们问住了。</strong></p>\n<h4>4.2 那个 10 倍成本优势是厂商自评，不能对外引用</h4>\n<p>蓝图宣称 Nemotron 3 Ultra 在 LangChain 的评估中得分 0.86、成本 $4.48，<strong>推理成本比次优模型低约 10 倍</strong>。</p>\n<p>这是<strong>联合发布方自己发布的评测</strong>，评测集、口径、对比对象都由利益相关方选定。<strong>任何\"某模型便宜 10 倍\"的量化宣称都不能写进我们的对外材料</strong>（这与模块 10 第三节\"不能说的话\"一致）。内部参考可以，对客引用不行。</p>\n<h4>4.3 「不能外包核心智能」直接冲击我们的解决方案业务线</h4>\n<p>模块 02 把\"场景化解决方案\"列为终局业务，模块 18 又确认了这个判断。<strong>但如果\"核心智能不能外包\"成为企业共识，这条业务线的形态必须改。</strong></p>\n<p>客户不会再买\"你帮我建一个 Agent\"——那正是他们被告诫不要做的事。</p>\n<p><strong>所以这条线要从\"替客户建\"改成\"让客户自己建的东西跑得更省、更稳、更看得清\"</strong>：模型选型咨询、成本优化、路由策略设计、trace 与评测的基础设施、跨模型的账单归集。<strong>我们提供脚手架和度量，客户保留领域知识和业务逻辑。</strong></p>\n<p>这个转向反而是好事——<strong>它的毛利结构和可复制性都优于定制开发</strong>，而且不会陷入项目制交付的人力陷阱。</p>\n<h3>五、新识别的风险：自建推理替代 API 采购</h3>\n<p><strong>这是本次收录最重要的产出，也是模块 18 没有覆盖到的一条。</strong></p>\n<p>NemoClaw 蓝图的完整含义是：<strong>开源模型（Nemotron）+ 受管运行时（OpenShell）+ 自建 harness，跑在企业自己的基础设施上。</strong></p>\n<p>如果这条路径成为受监管行业的主流，那么<strong>这些企业将不再向任何人采购 token</strong>。这不是脱媒（模块 18 第五节说的厂商绕过我们直接服务客户），这是<strong>需求本身消失</strong>——客户既不买我们的，也不买厂商的。</p>\n<p><strong>风险敞口最大的正是我们最看重的那批客户</strong>：模块 17 里 RAGFlow 那类文档密集型的金融、法律、医疗客户，模块 15 里已经在用 Open WebUI 跑本地模型的企业。<strong>他们本来就在往这个方向走，蓝图只是把路铺平了。</strong></p>\n<p><strong>但这条风险有三个现实的缓冲，不必过度恐慌：</strong></p>\n<p><strong>第一，自建推理有沉重的隐性成本。</strong> GPU 采购与折旧、运维人力、模型版本跟进、峰值容量的浪费。<strong>大多数企业的负载曲线极不平坦</strong>，为峰值买硬件意味着大部分时间在闲置。</p>\n<p><strong>第二，混合架构是更现实的形态</strong>，而这正是模块 15 第四节已经写过的判断：常规负载走本地（零边际成本、数据不出网），复杂任务走外部商业模型（能力强、按量付费）。<strong>自建不等于全自建。</strong></p>\n<p><strong>第三，本地开源模型与前沿模型的能力差距在高价值任务上依然存在</strong>（模块 18 第 3.4 节的哑铃结构判断）。</p>\n<p><strong>所以正确的应对不是抵抗自建，是重新定位我们在自建架构里的位置：</strong></p>\n<p><strong>从\"便宜的 token 供应商\"，变成\"本地模型干不了的那部分的出口 + 横跨本地与云端的成本核算层\"。</strong></p>\n<p>具体三件事：<strong>一是把\"混合路由\"做成明确的产品能力</strong>——按场景、按复杂度自动决定走本地还是走我们，这件事客户自己做很麻烦。<strong>二是把账单做成跨本地与云端的统一视图</strong>，让客户能算清\"本地那套的真实成本 vs 走 API 的成本\"，<strong>这个对比目前没人能给他</strong>。三是<strong>接受并主动提出混合方案</strong>，不要在客户提自建时表现出抵触——<strong>那会立刻暴露我们只是个卖 token 的</strong>。</p>\n<h3>六、本条触发的修正</h3>\n<table>\n<thead>\n<tr>\n<th>模块</th>\n<th>修正内容</th>\n<th>状态</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>02 · 商业模式</td>\n<td>解决方案业务线从\"替客户建 Agent\"改为\"让客户自建的系统跑得更省更稳\"</td>\n<td>已修正</td>\n</tr>\n<tr>\n<td>18 · 战略推演</td>\n<td>新增第三条威胁「自建推理替代 API 采购」，与脱媒并列</td>\n<td>已修正</td>\n</tr>\n<tr>\n<td>18 · 第 3.2 节</td>\n<td>补充 Harness 工程作为「切换成本不在配置而在验证」的实证支撑</td>\n<td>已修正</td>\n</tr>\n<tr>\n<td>06 · 销售话术</td>\n<td>新增 harness 切入话术</td>\n<td>见本条第三节，待并入</td>\n</tr>\n</tbody>\n</table>\n<h3>七、来源</h3>\n<ul>\n<li><a href=\"https://www.infoq.cn/article/2XfMOshHpdVVKjB2hxms\">LangChain 创始人警告：2026 成为「Agent 工程」分水岭 - InfoQ</a></li>\n<li><a href=\"https://www.langchain.com/blog/langchain-and-nvidia-launch-the-nemoclaw-deep-agents-blueprint\">LangChain and NVIDIA Launch NemoClaw Deep Agents Blueprint - LangChain 官方博客</a></li>\n<li><a href=\"https://www.opensourceforu.com/2026/07/nvidia-and-langchain-open-source-enterprise-ai-agent-blueprint/\">NVIDIA and LangChain Open Source Enterprise AI Agent Blueprint - Open Source For You</a></li>\n<li><a href=\"https://blog.csdn.net/csdnnews/article/details/162867185\">黄仁勋最新 26 分钟对话：未来公司将建立在 Harness 之上 - CSDN</a></li>\n<li>原始视频由业务负责人提供（微信/YouTube 转述，2026-07-27）</li>\n</ul>\n<hr />\n<h2>收录模板（新增条目请复制此结构）</h2>\n<pre><code>## 收录 00X · 标题\n**来源**：\n**收录日期**：\n**评级**：高 / 中 / 低（是否触发修正）\n\n一、事实核对        —— 转述与公开信息不符之处\n二、论点骨架        —— 压缩后的核心主张，不照搬原文\n三、站得住的部分    —— 附我方已有证据的交叉引用\n四、需要警惕的部分  —— 含提出者的利益立场分析\n五、对我们的指导    —— 具体到业务线、话术或产品\n六、本条触发的修正  —— 表格，留痕\n七、来源\n</code></pre>", "plain": " 模块 19 · 外部观点收录与研判\n\n 本模块解决的问题：把外部看到的行业观点变成可用的判断，并留下修正痕迹。\n 使用者：决策层、销售、业务智能体。\n 维护方式：流水账式追加，每条一节，编号递增，不删旧条。\n\n\n\n 本模块的方法与规则\n\n我们会持续从视频、播客、文章、访谈里接触到各种行业观点。大部分是噪音，少数会改变我们的判断。 这个模块的作用是把两者分开，并且留下\"为什么改\"的痕迹。\n\n三条硬规则：\n\n第一，先核对事实，再评估观点。 转述过程中丢失和扭曲信息是常态。每条收录都必须标注原始出处，并明确列出转述与事实不符的地方。这不是挑刺，是防止错误信息进入知识库后被当成事实反复引用。\n\n第二，必须写出提出者的利益立场。 芯片厂商说\"企业该自建\"、框架公司说\"自建很难该采购\"——这些判断可能都对，但它们都不是中立的。不分析立场就照单全收，等于让别人的商业利益替我们做决策。\n\n第三，必须落到\"它改变了什么\"。 如果一条观点读完之后我们什么都不用改，就明确写\"无需修正\"。如果它触发了对现有模块的修改，必须在这里留痕——否则三个月后没人知道模块 01 的价格判断为什么被改过。\n\n只有战略级别的观点才升格为独立模块（如模块 18），其余留在本模块。\n\n\n\n 收录 001 · Harness 工程与「核心智能不能外包」\n\n来源：黄仁勋与 LangChain 创始人 Harrison Chase 的对话（2026 年 7 月），以及同日发布的 NemoClaw Deep Agents Blueprint。\n收录日期：20260727\n评级：高。触发了对模块 02、18 的修正，并识别出一条此前未记录的风险。\n\n 一、事实核对\n\n原始转述中有一处归属需要更正，这个错误如果留在知识库里会导致销售在客户面前说错话：\n\nDeep Agents 是 LangChain 的产品，不是英伟达的。 准确的关系是：2026 年 7 月 8 日，LangChain 与 NVIDIA 联合发布 NemoClaw Deep Agents Blueprint，它由三层组成——开源模型层 NVIDIA Nemotron 3 Ultra、智能体框架层 LangChain Deep Agents Code（dcode）、受管运行时 NVIDIA OpenShell。OpenShell 负责沙箱化的智能体执行、工具交互、以及系统与数据的访问策略。\n\n其余转述与公开信息一致：对话确实围绕 Harness 展开，确实提出了\"未来公司将建立在 Harness 之上\"的判断。\n\n 二、论点骨架\n\nHarness 是什么。 按 Harrison Chase 的定义，它是比框架更有主张的工程架构——不只是提供能力，而是对\"该怎么做\"有明确立场。核心构件包括：内置决策机制的规划工具、用于长任务防止信息溢出的上下文压缩、承担状态管理与中间结果存储的文件系统交互、以及主副 Agent 之间的子 Agent 协调。\n\n为什么它突然重要。 Chase 给出的理由是范式变了：过去几十年软件工程有个稳定前提——系统行为写在代码里。Agent 打破了这一点，决定行为的不再只是代码，还有模型这个非确定性黑箱。由此产生三个连锁变化：可验证性从\"读代码就能推断行为\"变成\"必须真的跑一遍才知道它会做什么\"；真相来源从代码变成代码 + 执行轨迹（trace）；迭代周期从改代码变成更频繁地调 prompt 和指令。\n\n最关键的一句判断（对我们价值最大）：几乎所有做编程 Agent 的公司现在都自研 harness，性能差异并非完全来自模型，而来自对模型在 harness 中工作方式的理解。\n\n黄仁勋的立场：专业化不仅需要好模型，更需要围绕模型构建专属 Harness 并注入领域知识；企业核心智能绝不能外包，必须依托开放工具自主构建。\n\nNemoClaw 蓝图的核心主张：企业需要控制模型周围的系统——工具、上下文、评估、运行位置、策略。目标是建立\"开放、受管的智能体系统\"，实现对专有知识的所有权与控制，面向受监管行业强调可审计性与风险管理。\n\n 三、站得住的部分\n\n「性能差异来自 harness 而非模型」这句话，直接支撑了我们在模块 18 的核心反驳。\n\n模块 18 第 3.2 节论证过：换 URL 只需三十秒，但换来的是一个能跑的系统而不是等价的系统，真实成本藏在验证里。Harness 工程给这件事起了名字，还给了它一套工程学科。 提示词调优、评测集、trace 分析、上下文压缩策略、子 Agent 协调——这些全是围绕特定模型行为积累起来的资产，换模型就要重来一遍。\n\n这条对销售极其有用，因为它把一个抽象的说法变成了客户能听懂的具体投入。话术：\n\n \"你们的 Agent 效果好不好，其实不主要取决于用哪个模型，取决于你们围着模型搭的那一套东西——规划怎么做、上下文怎么压、子 Agent 怎么协调、trace 怎么看。这套东西才是你们真正的资产。所以模型这一层反而应该保持灵活，别把自己焊死在一家上。\"\n\n这个话术的高明之处在于：它同时论证了\"harness 值得投入\"（客户认同）和\"模型层应当可切换\"（正好是我们的产品）。它把客户对自身资产的重视，转化成了对我们的需求。\n\n「真相来源从代码变成代码 + trace」也是可直接落地的一条。 它意味着企业客户会越来越需要完整的调用轨迹——而轨迹留存正是我们已经在做的事（模块 08 要求的 6 个月日志留存）。原本是合规负担，现在同时是工程刚需。这是一个可以立刻改写话术的转变：从\"我们帮你满足监管要求\"变成\"我们帮你满足监管要求，顺便给了你调试 Agent 必需的 trace\"。\n\n 四、需要警惕的部分\n\n 4.1 两位对话者的判断互相矛盾，而且各自都在讲对自己有利的话\n\n这是本次收录最需要记住的一点。\n\n黄仁勋说：企业核心智能不能外包，必须依托开放工具自主构建。\nChase 的观点却暗示：harness 自研比构建框架难得多，大多数公司会采购现成方案（比如 LangChain 的 Deep Agents）。\n\n两个人在同一场对话里，给出了方向相反的建议。原因不难理解：\n\n英伟达卖算力。 企业自建 harness、自托管开源模型、跑在自己的基础设施上——每一项都直接增加 GPU 需求。\"自主构建\"对 NVIDIA 是最优解。\n\nLangChain 卖 harness。 \"自研很难\"这个判断，恰好通向\"所以用我们的\"。\n\n两个人可能都是对的，但都不是中立的。 更可能的现实是分层：核心业务逻辑与领域知识自建（黄仁勋对的部分），底层工程脚手架采购（Chase 对的部分）。\n\n给销售的纪律：不要引用任何一方的结论作为\"行业共识\"。可以引用 Chase 关于\"性能差异来自 harness\"的观察（那是经验事实），但不要引用\"必须自建\"或\"多数会采购\"作为论据——客户里但凡有懂行的，一问立场就把我们问住了。\n\n 4.2 那个 10 倍成本优势是厂商自评，不能对外引用\n\n蓝图宣称 Nemotron 3 Ultra 在 LangChain 的评估中得分 0.86、成本 $4.48，推理成本比次优模型低约 10 倍。\n\n这是联合发布方自己发布的评测，评测集、口径、对比对象都由利益相关方选定。任何\"某模型便宜 10 倍\"的量化宣称都不能写进我们的对外材料（这与模块 10 第三节\"不能说的话\"一致）。内部参考可以，对客引用不行。\n\n 4.3 「不能外包核心智能」直接冲击我们的解决方案业务线\n\n模块 02 把\"场景化解决方案\"列为终局业务，模块 18 又确认了这个判断。但如果\"核心智能不能外包\"成为企业共识，这条业务线的形态必须改。\n\n客户不会再买\"你帮我建一个 Agent\"——那正是他们被告诫不要做的事。\n\n所以这条线要从\"替客户建\"改成\"让客户自己建的东西跑得更省、更稳、更看得清\"：模型选型咨询、成本优化、路由策略设计、trace 与评测的基础设施、跨模型的账单归集。我们提供脚手架和度量，客户保留领域知识和业务逻辑。\n\n这个转向反而是好事——它的毛利结构和可复制性都优于定制开发，而且不会陷入项目制交付的人力陷阱。\n\n 五、新识别的风险：自建推理替代 API 采购\n\n这是本次收录最重要的产出，也是模块 18 没有覆盖到的一条。\n\nNemoClaw 蓝图的完整含义是：开源模型（Nemotron）+ 受管运行时（OpenShell）+ 自建 harness，跑在企业自己的基础设施上。\n\n如果这条路径成为受监管行业的主流，那么这些企业将不再向任何人采购 token。这不是脱媒（模块 18 第五节说的厂商绕过我们直接服务客户），这是需求本身消失——客户既不买我们的，也不买厂商的。\n\n风险敞口最大的正是我们最看重的那批客户：模块 17 里 RAGFlow 那类文档密集型的金融、法律、医疗客户，模块 15 里已经在用 Open WebUI 跑本地模型的企业。他们本来就在往这个方向走，蓝图只是把路铺平了。\n\n但这条风险有三个现实的缓冲，不必过度恐慌：\n\n第一，自建推理有沉重的隐性成本。 GPU 采购与折旧、运维人力、模型版本跟进、峰值容量的浪费。大多数企业的负载曲线极不平坦，为峰值买硬件意味着大部分时间在闲置。\n\n第二，混合架构是更现实的形态，而这正是模块 15 第四节已经写过的判断：常规负载走本地（零边际成本、数据不出网），复杂任务走外部商业模型（能力强、按量付费）。自建不等于全自建。\n\n第三，本地开源模型与前沿模型的能力差距在高价值任务上依然存在（模块 18 第 3.4 节的哑铃结构判断）。\n\n所以正确的应对不是抵抗自建，是重新定位我们在自建架构里的位置：\n\n从\"便宜的 token 供应商\"，变成\"本地模型干不了的那部分的出口 + 横跨本地与云端的成本核算层\"。\n\n具体三件事：一是把\"混合路由\"做成明确的产品能力——按场景、按复杂度自动决定走本地还是走我们，这件事客户自己做很麻烦。二是把账单做成跨本地与云端的统一视图，让客户能算清\"本地那套的真实成本 vs 走 API 的成本\"，这个对比目前没人能给他。三是接受并主动提出混合方案，不要在客户提自建时表现出抵触——那会立刻暴露我们只是个卖 token 的。\n\n 六、本条触发的修正\n\n 模块  修正内容  状态 \n\n 02 · 商业模式  解决方案业务线从\"替客户建 Agent\"改为\"让客户自建的系统跑得更省更稳\"  已修正 \n 18 · 战略推演  新增第三条威胁「自建推理替代 API 采购」，与脱媒并列  已修正 \n 18 · 第 3.2 节  补充 Harness 工程作为「切换成本不在配置而在验证」的实证支撑  已修正 \n 06 · 销售话术  新增 harness 切入话术  见本条第三节，待并入 \n\n 七、来源\n\n [LangChain 创始人警告：2026 成为「Agent 工程」分水岭  InfoQ](https://www.infoq.cn/article/2XfMOshHpdVVKjB2hxms)\n [LangChain and NVIDIA Launch NemoClaw Deep Agents Blueprint  LangChain 官方博客](https://www.langchain.com/blog/langchainandnvidialaunchthenemoclawdeepagentsblueprint)\n [NVIDIA and LangChain Open Source Enterprise AI Agent Blueprint  Open Source For You](https://www.opensourceforu.com/2026/07/nvidiaandlangchainopensourceenterpriseaiagentblueprint/)\n [黄仁勋最新 26 分钟对话：未来公司将建立在 Harness 之上  CSDN](https://blog.csdn.net/csdnnews/article/details/162867185)\n 原始视频由业务负责人提供（微信/YouTube 转述，20260727）\n\n\n\n 收录模板（新增条目请复制此结构）\n\n\n 收录 00X · 标题\n来源：\n收录日期：\n评级：高 / 中 / 低（是否触发修正）\n\n一、事实核对        —— 转述与公开信息不符之处\n二、论点骨架        —— 压缩后的核心主张，不照搬原文\n三、站得住的部分    —— 附我方已有证据的交叉引用\n四、需要警惕的部分  —— 含提出者的利益立场分析\n五、对我们的指导    —— 具体到业务线、话术或产品\n六、本条触发的修正  —— 表格，留痕\n七、来源\n\n"}, {"id": "20-梁文锋520投资讲话精华", "code": "20", "title": "模块 20 · 梁文锋 520 投资讲话精华", "short": "梁文锋 520 投资讲话精华", "subs": ["⚠️ 使用前必读：两条硬约束", "一、核心定价逻辑（对我们价值最大的部分）", "二、开源逻辑与它的隐含条件", "三、竞争格局的终局判断", "四、算力与国产芯片（内部参考，数字不得外传）", "五、技术路线：与我们知识库的交叉验证", "六、DeepSeek 的商业化姿态：我们最大的机会", "七、组织与文化（对我们建团队的参照）", "八、本模块触发的修正", "九、一句话总结"], "html": "<h1>模块 20 · 梁文锋 520 投资讲话精华</h1>\n<blockquote>\n<p>来源：《梁文锋投资者交流会 · 录音文字稿》，音频标注 5 月 20 日，时长约 3 小时 44 分，AI 自动转写整理，整理日期 2026-07-16。\n收录日期：2026-07-27 ｜ 评级：<strong>极高</strong>——这是我们目前拿到的、关于上游定价逻辑最直接的一手材料。</p>\n</blockquote>\n<hr />\n<h2>⚠️ 使用前必读：两条硬约束</h2>\n<p><strong>第一条 · 真实性未经当事人确认。</strong></p>\n<p>这份文稿由语音识别自动转写并经 AI 整理，<strong>未区分说话人</strong>，原稿自己就注明\"个别专有名词与数字可能存在识别误差，请以原录音为准\"。公开网络检索不到原始音频，梁文锋与 DeepSeek 至今<strong>既未确认也未否认</strong>。有报道称已向参与投资的机构核实闭门会确实在 5 月召开，但<strong>内容有多少是原话，无法验证</strong>。</p>\n<p><strong>因此：本模块所有内容一律标记为「待证实」，不得作为事实引用。</strong> 尤其不能对客户、投资人说\"梁文锋说过……\"。可以说的是\"行业内流传的一份材料显示……\"，并且只在内部推演中使用。</p>\n<p><strong>第二条 · 这份材料是违反会议约定流出的。</strong></p>\n<p>文稿中主持人明确提醒与会者不要外传数字与情况（特别点名卡量），也不要录屏对外分享。<strong>这意味着文件里的非公开经营数据属于泄露信息。</strong></p>\n<p><strong>硬性纪律：本模块中的算力规模、成本结构、融资情况、内部利润倍数等非公开数字，严禁出现在任何对外材料、销售话术、投资人 BP 或公开内容中。</strong> 违反的法律与商誉风险远超它能带来的谈资价值。内部用于判断可以，出口即违规。</p>\n<hr />\n<h2>一、核心定价逻辑（对我们价值最大的部分）</h2>\n<h3>1.1 「十个月回本」是一条明确的定价锚</h3>\n<p>文稿中反复出现同一个定价原则：<strong>API 定价的依据是设备成本在十个月内收回</strong>，对应大约<strong>六倍利润</strong>。这不是推算出来的，是他直接说出的口径，且明确表示 V3.2 Flash 等产品都按这个标准。</p>\n<p><strong>这条对我们的意义是结构性的：上游价格从此变得可预测。</strong> 它既不会暴涨（因为定价不以利润最大化为目标），也不会崩塌（因为要覆盖设备成本）。</p>\n<p><strong>这直接修正了模块 18 第 3.1 节的判断范围。</strong> 我们此前根据智谱涨价 83% 的公开数据，判断\"行业进入涨价周期\"。这个判断需要加限定：<strong>涨价周期主要发生在把定价交给市场博弈的厂商身上；对于把定价锚定在自身成本回收周期的 DeepSeek，价格是被主动锁住的。</strong></p>\n<h3>1.2 「需求无弹性」——供给侧最强玩家的一手论证</h3>\n<p>文稿里有一句判断，我认为是整份材料里对销售最有用的：<strong>价格翻倍或者减半，token 消耗量区别不大。</strong></p>\n<p>他据此解释了两件事：为什么不涨价（涨了收入会增加，但那不是他们的目标），以及<strong>为什么不继续降价（因为再降需求也不会明显增加）</strong>。</p>\n<p><strong>这条对我们的杀伤和帮助是双向的：</strong></p>\n<p><strong>帮助</strong>：它以供给侧最强玩家的实测经验，独立佐证了模块 02 基本认知第三条「不要打价格战」。价格战在一个需求无弹性的市场里，是纯粹的自我伤害——<strong>降价不会换来量，只会等比例损失毛利</strong>。</p>\n<p><strong>杀伤</strong>：反过来说，<strong>我们的促销和折扣同样换不来增量</strong>。销售必须放弃\"给个折扣冲一下量\"的思路——那在这个市场里是无效动作。<strong>能换来量的只有新客户、新场景、新用量，不是更低的单价。</strong></p>\n<h3>1.3 「让独立部署的第三方无利可图」——这句话必须正视</h3>\n<p>文稿中有一句直接针对第三方的表述：按十个月回本定价，<strong>就能让独立部署的第三方无利可图</strong>，因为第三方做不到这个成本。他还提到阿里、腾讯的成本\"应该要比这个高好几倍\"。</p>\n<p><strong>这句话有两层含义，一层对我们有利，一层对我们不利。</strong></p>\n<p><strong>有利的一层</strong>：它大幅削弱了模块 19 收录 001 识别的「自建推理替代 API 采购」风险——<strong>至少在 DeepSeek 系模型上，企业自建部署在经济上不划算</strong>，官方 API 已经把价格压到自建无利可图。这对我们是好消息：客户不会因为省钱而转向自建。</p>\n<p><strong>不利的一层</strong>：这个定价策略的目标是压制所有中间环节的套利空间，<strong>而我们也是\"独立第三方\"</strong>。我们不做自建部署，但我们的价差同样来自这个被刻意压薄的空间。当一家厂商公开宣称\"我的定价就是要让第三方无利可图\"时，<strong>指望靠渠道折扣长期获得可观价差，是不现实的。</strong></p>\n<p><strong>这再次指向模块 18 第六节的结论，而且比原来更急迫：收入必须从「价差」迁移到「软件费 + 节省分成 + 服务费」。</strong> 在 DeepSeek 这条线上，价差模式的天花板是被上游主动焊死的。</p>\n<h3>1.4 未来的价格方向</h3>\n<p>他提到利润倍数未来可能降到四倍、三倍，并认为\"再到底也不可能再降了\"；同时承认当前\"确实还有降价空间\"，模型优化上也还有空间。</p>\n<p><strong>给决策层的判断</strong>：不要基于\"上游会持续降价\"做囤货决策（模块 04 第四节），但也不要预期大幅涨价。<strong>合理的规划假设是：DeepSeek 系价格在未来 12 个月内小幅下行或持平。</strong></p>\n<hr />\n<h2>二、开源逻辑与它的隐含条件</h2>\n<p>文稿中开源与商业化不冲突的论证有一个<strong>明确的前置条件</strong>，这个条件很少被外界注意到：</p>\n<p><strong>\"只赚六倍利润\"是开源不影响商业模式的前提。</strong> 他的原话逻辑是：如果目标是赚一百倍利润，那开源确实会有影响，因为第三方部署可能是二十倍成本，就比你低了。</p>\n<p>换句话说：<strong>低毛利本身就是开源的护城河。</strong> 把利润压到六倍，第三方即使拿到完全一样的开源模型，也无法通过自建部署赚到钱。<strong>开源不是慷慨，是一种以放弃暴利换取生态与安全的策略。</strong></p>\n<p>他还确认了两点：<strong>开源出去的模型与自己部署的模型完全一样</strong>，不存在\"开源差的、自留好的\"；以及他希望别人能部署起来，只担心别人部署不好导致效果差、成本高。</p>\n<p><strong>对我们的直接启示</strong>：客户如果提到\"我们可以直接部署开源模型\"，正确的回应不是否认（那是事实），而是引用他自己的担忧——<strong>部署得起来不等于部署得好</strong>。细节没做对，效果会差、成本会更高。这正好是我们提供托管与优化价值的位置。</p>\n<hr />\n<h2>三、竞争格局的终局判断</h2>\n<h3>3.1 最终差距只剩三样：成本、时间、体验</h3>\n<p>文稿中对大模型竞争终局的判断非常干脆：最终差距体现在<strong>成本、时间、用户体验</strong>三方面，除此之外没有太大差距，其中<strong>成本排第一</strong>。并且判断\"不至于哪一家有暴利，成本控制得好的多赚一点，差的少赚一点\"。</p>\n<p><strong>这与模块 18 第 3.4 节的「哑铃结构」判断有分歧，值得记录。</strong> 我们此前判断中低端商品化、前沿持续分化。而这份材料认为差距会全面收敛到成本与时间维度。</p>\n<p><strong>我倾向于保留我们原来的判断</strong>，理由是：他自己在同一份材料里也承认，在 800B 级别的大模型上\"训不起\"，与美国存在数量级的算力差距，且这个差距\"目前看来很难弥补\"。<strong>这本身就说明前沿仍在分化。</strong> 但他关于\"国内三四家之间不会有暴利\"的判断，我认为是成立的。</p>\n<h3>3.2 国内会收敛到三四家</h3>\n<p>他明确判断国内做基模的公司太多、资源分散、<strong>最终一定会收敛</strong>，参照美国的三家格局，认为中国最后三四家竞争就已经很充分了。</p>\n<p><strong>这对我们是一条重要的规划输入</strong>：<strong>上游数量会减少。</strong> 模块 03 铁律一要求\"任何单一上游采购占比不超过 40%\"——在只剩三四家可选的市场里，这条铁律会越来越难执行。<strong>建议决策层提前评估：当可选上游收敛到三四家时，我们的分散策略还剩多少空间。</strong></p>\n<h3>3.3 「拿得少的打败拿得多的」</h3>\n<p>文稿里有一段关于愿景与份额的推演：如果目标是拿走全球 GDP 的 5%，会被只想拿 1% 的人打败；只想拿 1% 的，又会被只想拿 0.1% 的打败。他据此认为 OpenAI 会遇到很多挑战者。</p>\n<p><strong>这段逻辑对我们同样适用，而且是个警告。</strong> 我们如果把目标定成\"赚尽可能高的价差\"，就会被一个愿意只赚更薄价差的竞争者打败。<strong>这个行业的中间层，愿意拿得少的人永远会出现。</strong> 所以我们的立身之本不能是\"价差多少\"，只能是\"除了价差之外我们还提供了什么\"。</p>\n<hr />\n<h2>四、算力与国产芯片（内部参考，数字不得外传）</h2>\n<h3>4.1 CUDA 护城河正在瓦解</h3>\n<p>这是整份材料里技术含量最高、也可能影响最深远的一段。核心是他们自研的高级语言 <strong>TileLang</strong>：用它重写 CUDA 算子，可以把英伟达那套生态整体重写一遍，<strong>效率损失约 1%–2%</strong>，而且他判断长期是\"大幅提高效率\"而非降低。</p>\n<p>配套的判断是：AI 本身让构建生态变得容易得多（AI 可以写代码，他们甚至在用 AI 写 TileLang）；专用芯片与 CUDA 不绑定，原有生态作用大幅减少；<strong>国产 AI 芯片的硬件和生态都没问题，唯一问题是产能</strong>，预计一年内这个认知会被事实扭转。</p>\n<p><strong>对我们的意义</strong>：如果国产芯片生态在一年内跑通，<strong>推理成本会进一步下行，价格底会下移</strong>。这对我们的批发囤货业务是明确的风险信号——<strong>囤货的贬值风险不只来自厂商降价，也来自成本曲线本身的下移</strong>（模块 04 第四节的降价保护条款因此更加关键）。</p>\n<h3>4.2 与美国的差距在资源不在人才</h3>\n<p>他明确表示差距\"只有一点，就是资源\"，人才没有差距。整体落后美国约 12–18 个月，但<strong>只用了约二十分之一的算力</strong>，并把\"缩短这个时间\"当作目标。</p>\n<hr />\n<h2>五、技术路线：与我们知识库的交叉验证</h2>\n<h3>5.1 AGI 阶梯</h3>\n<p><strong>语言模型 → CoT（思维链）→ Agent → 持续学习 → 自我迭代奇点 → 具身智能。</strong></p>\n<p>每一步都建立在前一步基础上，不存在跳跃。他判断当前站在 Agent 这一级，<strong>看得到的下一个瓶颈是持续学习</strong>——目前全世界都还没找到有效方法，仍在摸索阶段。</p>\n<p><strong>这条与模块 16 的 Agent 消耗机制、模块 19 的 Harness 论述完全能接上</strong>：Agent 之所以烧 token，正是因为它缺乏持续学习能力，只能靠把上下文反复塞回去来模拟\"记住\"。</p>\n<h3>5.2 明确不做的方向</h3>\n<p>他明确表示不做 3D、视频生成、世界模型——判断这些与智能主线关系不大。多模态是\"组件\"不是主线，会做但不是重点。</p>\n<p><strong>销售可用的一条</strong>：客户如果需要视频生成、3D 类能力，<strong>不要指望 DeepSeek 线</strong>，要走通义等多模态更全的厂商。这正好是我们多模型聚合的价值场景。</p>\n<h3>5.3 「国内最合理的做法是全力做通用 Agent，优先 Coding Agent」</h3>\n<p>被问到是否会做金融、医疗等垂直 Agent 时，他的判断是：现阶段国内最合理的是<strong>全力做通用 Agent，其他垂直 Agent 优先级更低，要先做 Coding</strong>，因为 Coding Agent 能覆盖很多，且能带出很多垂直 Agent。</p>\n<p><strong>这是模块 16 战略重要性的独立佐证</strong>——我们判断编程 Agent 是 token 消耗最猛的一层，而上游最强玩家把 Coding Agent 排在自己的第一优先级。<strong>两边判断一致，这一层的资源投入应当被确认。</strong></p>\n<hr />\n<h2>六、DeepSeek 的商业化姿态：我们最大的机会</h2>\n<p>这是整份材料里<strong>对我们价值主张最强的佐证</strong>，而且来自厂商本人。</p>\n<p>文稿中他把卖 API 描述为做 AGI 路上的<strong>副产品</strong>，明确表示只需要几个人维护这个 API，<strong>甚至客服都没有，也不用销售</strong>，用户会自己来。他还表示不希望向上游应用做垂直整合，只想吃自己最擅长的那一块。</p>\n<p><strong>这几句话逐条对应我们的价值主张（模块 02）：</strong></p>\n<table>\n<thead>\n<tr>\n<th>他明确不做的</th>\n<th>正是我们提供的</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>没有客服</td>\n<td>技术支持、接入陪同、故障响应</td>\n</tr>\n<tr>\n<td>不用销售</td>\n<td>方案设计、选型咨询、商务对接</td>\n</tr>\n<tr>\n<td>不做垂直整合</td>\n<td>场景落地、成本优化、混合路由</td>\n</tr>\n<tr>\n<td>To B 是\"副产品\"</td>\n<td>To B 是我们的全部</td>\n</tr>\n</tbody>\n</table>\n<p><strong>这是模块 02「复杂度税」论点能拿到的最强证据——上游自己承认不提供服务。</strong></p>\n<p>同时它也校准了模块 18 的一条风险判断。我们此前把\"厂商直销下沉\"列为第一威胁。<strong>至少 DeepSeek 明确表示无意于此</strong>——他把服务、销售、垂直整合都排除在自己要做的事情之外。<strong>这条威胁对 DeepSeek 应当降级，但对阿里、腾讯这类有完整销售体系的云厂商仍然成立。</strong></p>\n<p>另一条需要记住的：他判断 <strong>To B 需求有上限，受制于需求而不是算力</strong>。这与模块 01「用量会一直涨」的乐观判断存在温差，值得作为反方观点保留。</p>\n<hr />\n<h2>七、组织与文化（对我们建团队的参照）</h2>\n<p>几条值得记录的做法：公司靠<strong>愿景而非 KPI</strong> 组织，愿景甚至不是成文的；管理分两条线，自下而上（无人管、无 KPI）与自上而下（正式协作），并刻意控制<strong>正式工作不超过员工一半时间</strong>；不加班，理由是研究需要松弛的环境，且因为足够聚焦所以事情本来就少。</p>\n<p><strong>最值得记住的一条是他对核心利益的定义：整个公司唯一不可让渡的核心利益是「保持团队稳定性」</strong>，钱和资源都可以克制，只有这一条不能。</p>\n<p><strong>对我们的参照价值有限但有一条可借鉴</strong>：他把\"克制\"作为战略而非美德——<strong>主动放弃一部分利益，是为了提高做成的概率</strong>。这与模块 04「主动退出失血客户」、模块 06「诚实说出我们不适合服务谁」是同一种思维方式。</p>\n<hr />\n<h2>八、本模块触发的修正</h2>\n<table>\n<thead>\n<tr>\n<th>模块</th>\n<th>修正内容</th>\n<th>状态</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>18 · 第 3.1 节</td>\n<td>「涨价周期」判断需加限定：不适用于把定价锚在自身成本回收周期的厂商</td>\n<td>待并入</td>\n</tr>\n<tr>\n<td>18 · 第五节</td>\n<td>「厂商直销下沉」威胁对 DeepSeek 降级，对云厂商维持</td>\n<td>待并入</td>\n</tr>\n<tr>\n<td>19 · 收录 001</td>\n<td>「自建推理替代 API」风险在 DeepSeek 系模型上被大幅削弱</td>\n<td>待并入</td>\n</tr>\n<tr>\n<td>04 · 第四节</td>\n<td>囤货贬值风险新增来源：国产芯片跑通导致的成本曲线下移</td>\n<td>待并入</td>\n</tr>\n<tr>\n<td>06 · 销售纪律</td>\n<td>新增：需求无弹性，折扣换不来量，禁止用降价冲量</td>\n<td>待并入</td>\n</tr>\n<tr>\n<td>03 · 铁律一</td>\n<td>上游收敛到三四家后，40% 分散上限的可执行性需重新评估</td>\n<td>待评估</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>九、一句话总结</h2>\n<p><strong>如果这份材料属实，它同时告诉了我们三件事：</strong></p>\n<p><strong>第一，上游价格是可预测的</strong>——锚在十个月回本、约六倍利润，不会暴涨也不会崩塌。</p>\n<p><strong>第二，价差空间是被主动焊死的</strong>——上游明确以\"让独立第三方无利可图\"为定价目标，靠价差活着的中间层没有长期未来。</p>\n<p><strong>第三，服务空间是被完全让出来的</strong>——上游自己说不做客服、不做销售、不做垂直整合。</p>\n<p><strong>这三条合起来只有一个结论，和模块 18 完全一致：我们不能靠差价活，只能靠上游明确不做的那部分活。</strong> 区别在于，这次的证据来自上游本人。</p>", "plain": " 模块 20 · 梁文锋 520 投资讲话精华\n\n 来源：《梁文锋投资者交流会 · 录音文字稿》，音频标注 5 月 20 日，时长约 3 小时 44 分，AI 自动转写整理，整理日期 20260716。\n 收录日期：20260727 ｜ 评级：极高——这是我们目前拿到的、关于上游定价逻辑最直接的一手材料。\n\n\n\n ⚠️ 使用前必读：两条硬约束\n\n第一条 · 真实性未经当事人确认。\n\n这份文稿由语音识别自动转写并经 AI 整理，未区分说话人，原稿自己就注明\"个别专有名词与数字可能存在识别误差，请以原录音为准\"。公开网络检索不到原始音频，梁文锋与 DeepSeek 至今既未确认也未否认。有报道称已向参与投资的机构核实闭门会确实在 5 月召开，但内容有多少是原话，无法验证。\n\n因此：本模块所有内容一律标记为「待证实」，不得作为事实引用。 尤其不能对客户、投资人说\"梁文锋说过……\"。可以说的是\"行业内流传的一份材料显示……\"，并且只在内部推演中使用。\n\n第二条 · 这份材料是违反会议约定流出的。\n\n文稿中主持人明确提醒与会者不要外传数字与情况（特别点名卡量），也不要录屏对外分享。这意味着文件里的非公开经营数据属于泄露信息。\n\n硬性纪律：本模块中的算力规模、成本结构、融资情况、内部利润倍数等非公开数字，严禁出现在任何对外材料、销售话术、投资人 BP 或公开内容中。 违反的法律与商誉风险远超它能带来的谈资价值。内部用于判断可以，出口即违规。\n\n\n\n 一、核心定价逻辑（对我们价值最大的部分）\n\n 1.1 「十个月回本」是一条明确的定价锚\n\n文稿中反复出现同一个定价原则：API 定价的依据是设备成本在十个月内收回，对应大约六倍利润。这不是推算出来的，是他直接说出的口径，且明确表示 V3.2 Flash 等产品都按这个标准。\n\n这条对我们的意义是结构性的：上游价格从此变得可预测。 它既不会暴涨（因为定价不以利润最大化为目标），也不会崩塌（因为要覆盖设备成本）。\n\n这直接修正了模块 18 第 3.1 节的判断范围。 我们此前根据智谱涨价 83% 的公开数据，判断\"行业进入涨价周期\"。这个判断需要加限定：涨价周期主要发生在把定价交给市场博弈的厂商身上；对于把定价锚定在自身成本回收周期的 DeepSeek，价格是被主动锁住的。\n\n 1.2 「需求无弹性」——供给侧最强玩家的一手论证\n\n文稿里有一句判断，我认为是整份材料里对销售最有用的：价格翻倍或者减半，token 消耗量区别不大。\n\n他据此解释了两件事：为什么不涨价（涨了收入会增加，但那不是他们的目标），以及为什么不继续降价（因为再降需求也不会明显增加）。\n\n这条对我们的杀伤和帮助是双向的：\n\n帮助：它以供给侧最强玩家的实测经验，独立佐证了模块 02 基本认知第三条「不要打价格战」。价格战在一个需求无弹性的市场里，是纯粹的自我伤害——降价不会换来量，只会等比例损失毛利。\n\n杀伤：反过来说，我们的促销和折扣同样换不来增量。销售必须放弃\"给个折扣冲一下量\"的思路——那在这个市场里是无效动作。能换来量的只有新客户、新场景、新用量，不是更低的单价。\n\n 1.3 「让独立部署的第三方无利可图」——这句话必须正视\n\n文稿中有一句直接针对第三方的表述：按十个月回本定价，就能让独立部署的第三方无利可图，因为第三方做不到这个成本。他还提到阿里、腾讯的成本\"应该要比这个高好几倍\"。\n\n这句话有两层含义，一层对我们有利，一层对我们不利。\n\n有利的一层：它大幅削弱了模块 19 收录 001 识别的「自建推理替代 API 采购」风险——至少在 DeepSeek 系模型上，企业自建部署在经济上不划算，官方 API 已经把价格压到自建无利可图。这对我们是好消息：客户不会因为省钱而转向自建。\n\n不利的一层：这个定价策略的目标是压制所有中间环节的套利空间，而我们也是\"独立第三方\"。我们不做自建部署，但我们的价差同样来自这个被刻意压薄的空间。当一家厂商公开宣称\"我的定价就是要让第三方无利可图\"时，指望靠渠道折扣长期获得可观价差，是不现实的。\n\n这再次指向模块 18 第六节的结论，而且比原来更急迫：收入必须从「价差」迁移到「软件费 + 节省分成 + 服务费」。 在 DeepSeek 这条线上，价差模式的天花板是被上游主动焊死的。\n\n 1.4 未来的价格方向\n\n他提到利润倍数未来可能降到四倍、三倍，并认为\"再到底也不可能再降了\"；同时承认当前\"确实还有降价空间\"，模型优化上也还有空间。\n\n给决策层的判断：不要基于\"上游会持续降价\"做囤货决策（模块 04 第四节），但也不要预期大幅涨价。合理的规划假设是：DeepSeek 系价格在未来 12 个月内小幅下行或持平。\n\n\n\n 二、开源逻辑与它的隐含条件\n\n文稿中开源与商业化不冲突的论证有一个明确的前置条件，这个条件很少被外界注意到：\n\n\"只赚六倍利润\"是开源不影响商业模式的前提。 他的原话逻辑是：如果目标是赚一百倍利润，那开源确实会有影响，因为第三方部署可能是二十倍成本，就比你低了。\n\n换句话说：低毛利本身就是开源的护城河。 把利润压到六倍，第三方即使拿到完全一样的开源模型，也无法通过自建部署赚到钱。开源不是慷慨，是一种以放弃暴利换取生态与安全的策略。\n\n他还确认了两点：开源出去的模型与自己部署的模型完全一样，不存在\"开源差的、自留好的\"；以及他希望别人能部署起来，只担心别人部署不好导致效果差、成本高。\n\n对我们的直接启示：客户如果提到\"我们可以直接部署开源模型\"，正确的回应不是否认（那是事实），而是引用他自己的担忧——部署得起来不等于部署得好。细节没做对，效果会差、成本会更高。这正好是我们提供托管与优化价值的位置。\n\n\n\n 三、竞争格局的终局判断\n\n 3.1 最终差距只剩三样：成本、时间、体验\n\n文稿中对大模型竞争终局的判断非常干脆：最终差距体现在成本、时间、用户体验三方面，除此之外没有太大差距，其中成本排第一。并且判断\"不至于哪一家有暴利，成本控制得好的多赚一点，差的少赚一点\"。\n\n这与模块 18 第 3.4 节的「哑铃结构」判断有分歧，值得记录。 我们此前判断中低端商品化、前沿持续分化。而这份材料认为差距会全面收敛到成本与时间维度。\n\n我倾向于保留我们原来的判断，理由是：他自己在同一份材料里也承认，在 800B 级别的大模型上\"训不起\"，与美国存在数量级的算力差距，且这个差距\"目前看来很难弥补\"。这本身就说明前沿仍在分化。 但他关于\"国内三四家之间不会有暴利\"的判断，我认为是成立的。\n\n 3.2 国内会收敛到三四家\n\n他明确判断国内做基模的公司太多、资源分散、最终一定会收敛，参照美国的三家格局，认为中国最后三四家竞争就已经很充分了。\n\n这对我们是一条重要的规划输入：上游数量会减少。 模块 03 铁律一要求\"任何单一上游采购占比不超过 40%\"——在只剩三四家可选的市场里，这条铁律会越来越难执行。建议决策层提前评估：当可选上游收敛到三四家时，我们的分散策略还剩多少空间。\n\n 3.3 「拿得少的打败拿得多的」\n\n文稿里有一段关于愿景与份额的推演：如果目标是拿走全球 GDP 的 5%，会被只想拿 1% 的人打败；只想拿 1% 的，又会被只想拿 0.1% 的打败。他据此认为 OpenAI 会遇到很多挑战者。\n\n这段逻辑对我们同样适用，而且是个警告。 我们如果把目标定成\"赚尽可能高的价差\"，就会被一个愿意只赚更薄价差的竞争者打败。这个行业的中间层，愿意拿得少的人永远会出现。 所以我们的立身之本不能是\"价差多少\"，只能是\"除了价差之外我们还提供了什么\"。\n\n\n\n 四、算力与国产芯片（内部参考，数字不得外传）\n\n 4.1 CUDA 护城河正在瓦解\n\n这是整份材料里技术含量最高、也可能影响最深远的一段。核心是他们自研的高级语言 TileLang：用它重写 CUDA 算子，可以把英伟达那套生态整体重写一遍，效率损失约 1%–2%，而且他判断长期是\"大幅提高效率\"而非降低。\n\n配套的判断是：AI 本身让构建生态变得容易得多（AI 可以写代码，他们甚至在用 AI 写 TileLang）；专用芯片与 CUDA 不绑定，原有生态作用大幅减少；国产 AI 芯片的硬件和生态都没问题，唯一问题是产能，预计一年内这个认知会被事实扭转。\n\n对我们的意义：如果国产芯片生态在一年内跑通，推理成本会进一步下行，价格底会下移。这对我们的批发囤货业务是明确的风险信号——囤货的贬值风险不只来自厂商降价，也来自成本曲线本身的下移（模块 04 第四节的降价保护条款因此更加关键）。\n\n 4.2 与美国的差距在资源不在人才\n\n他明确表示差距\"只有一点，就是资源\"，人才没有差距。整体落后美国约 12–18 个月，但只用了约二十分之一的算力，并把\"缩短这个时间\"当作目标。\n\n\n\n 五、技术路线：与我们知识库的交叉验证\n\n 5.1 AGI 阶梯\n\n语言模型 → CoT（思维链）→ Agent → 持续学习 → 自我迭代奇点 → 具身智能。\n\n每一步都建立在前一步基础上，不存在跳跃。他判断当前站在 Agent 这一级，看得到的下一个瓶颈是持续学习——目前全世界都还没找到有效方法，仍在摸索阶段。\n\n这条与模块 16 的 Agent 消耗机制、模块 19 的 Harness 论述完全能接上：Agent 之所以烧 token，正是因为它缺乏持续学习能力，只能靠把上下文反复塞回去来模拟\"记住\"。\n\n 5.2 明确不做的方向\n\n他明确表示不做 3D、视频生成、世界模型——判断这些与智能主线关系不大。多模态是\"组件\"不是主线，会做但不是重点。\n\n销售可用的一条：客户如果需要视频生成、3D 类能力，不要指望 DeepSeek 线，要走通义等多模态更全的厂商。这正好是我们多模型聚合的价值场景。\n\n 5.3 「国内最合理的做法是全力做通用 Agent，优先 Coding Agent」\n\n被问到是否会做金融、医疗等垂直 Agent 时，他的判断是：现阶段国内最合理的是全力做通用 Agent，其他垂直 Agent 优先级更低，要先做 Coding，因为 Coding Agent 能覆盖很多，且能带出很多垂直 Agent。\n\n这是模块 16 战略重要性的独立佐证——我们判断编程 Agent 是 token 消耗最猛的一层，而上游最强玩家把 Coding Agent 排在自己的第一优先级。两边判断一致，这一层的资源投入应当被确认。\n\n\n\n 六、DeepSeek 的商业化姿态：我们最大的机会\n\n这是整份材料里对我们价值主张最强的佐证，而且来自厂商本人。\n\n文稿中他把卖 API 描述为做 AGI 路上的副产品，明确表示只需要几个人维护这个 API，甚至客服都没有，也不用销售，用户会自己来。他还表示不希望向上游应用做垂直整合，只想吃自己最擅长的那一块。\n\n这几句话逐条对应我们的价值主张（模块 02）：\n\n 他明确不做的  正是我们提供的 \n\n 没有客服  技术支持、接入陪同、故障响应 \n 不用销售  方案设计、选型咨询、商务对接 \n 不做垂直整合  场景落地、成本优化、混合路由 \n To B 是\"副产品\"  To B 是我们的全部 \n\n这是模块 02「复杂度税」论点能拿到的最强证据——上游自己承认不提供服务。\n\n同时它也校准了模块 18 的一条风险判断。我们此前把\"厂商直销下沉\"列为第一威胁。至少 DeepSeek 明确表示无意于此——他把服务、销售、垂直整合都排除在自己要做的事情之外。这条威胁对 DeepSeek 应当降级，但对阿里、腾讯这类有完整销售体系的云厂商仍然成立。\n\n另一条需要记住的：他判断 To B 需求有上限，受制于需求而不是算力。这与模块 01「用量会一直涨」的乐观判断存在温差，值得作为反方观点保留。\n\n\n\n 七、组织与文化（对我们建团队的参照）\n\n几条值得记录的做法：公司靠愿景而非 KPI 组织，愿景甚至不是成文的；管理分两条线，自下而上（无人管、无 KPI）与自上而下（正式协作），并刻意控制正式工作不超过员工一半时间；不加班，理由是研究需要松弛的环境，且因为足够聚焦所以事情本来就少。\n\n最值得记住的一条是他对核心利益的定义：整个公司唯一不可让渡的核心利益是「保持团队稳定性」，钱和资源都可以克制，只有这一条不能。\n\n对我们的参照价值有限但有一条可借鉴：他把\"克制\"作为战略而非美德——主动放弃一部分利益，是为了提高做成的概率。这与模块 04「主动退出失血客户」、模块 06「诚实说出我们不适合服务谁」是同一种思维方式。\n\n\n\n 八、本模块触发的修正\n\n 模块  修正内容  状态 \n\n 18 · 第 3.1 节  「涨价周期」判断需加限定：不适用于把定价锚在自身成本回收周期的厂商  待并入 \n 18 · 第五节  「厂商直销下沉」威胁对 DeepSeek 降级，对云厂商维持  待并入 \n 19 · 收录 001  「自建推理替代 API」风险在 DeepSeek 系模型上被大幅削弱  待并入 \n 04 · 第四节  囤货贬值风险新增来源：国产芯片跑通导致的成本曲线下移  待并入 \n 06 · 销售纪律  新增：需求无弹性，折扣换不来量，禁止用降价冲量  待并入 \n 03 · 铁律一  上游收敛到三四家后，40% 分散上限的可执行性需重新评估  待评估 \n\n\n\n 九、一句话总结\n\n如果这份材料属实，它同时告诉了我们三件事：\n\n第一，上游价格是可预测的——锚在十个月回本、约六倍利润，不会暴涨也不会崩塌。\n\n第二，价差空间是被主动焊死的——上游明确以\"让独立第三方无利可图\"为定价目标，靠价差活着的中间层没有长期未来。\n\n第三，服务空间是被完全让出来的——上游自己说不做客服、不做销售、不做垂直整合。\n\n这三条合起来只有一个结论，和模块 18 完全一致：我们不能靠差价活，只能靠上游明确不做的那部分活。 区别在于，这次的证据来自上游本人。\n"}, {"id": "21-客户需求测算与选型方法论", "code": "21", "title": "模块 21 · 客户需求测算与选型方法论", "short": "客户需求测算与选型方法论", "subs": ["零、为什么这三个问题必须放在一起", "一、问题一：客户的 token 需求量怎么算", "二、问题二：什么模型最合适", "三、问题三：自建要多少钱，API 要多少钱", "四、三个问题合起来：标准测算流程", "五、待补的工具化", "数据来源与复核"], "html": "<h1>模块 21 · 客户需求测算与选型方法论</h1>\n<blockquote>\n<p>本模块解决三个问题：客户到底要烧多少 token、该用什么模型、自建和买 API 各要多少钱。\n使用者：销售必修，售前与解决方案的核心工具，业务智能体的计算逻辑来源。\n数据采集日：2026-07-27。成本类数据变动快，公式长期有效，参考值需按季度复核。</p>\n</blockquote>\n<hr />\n<h2>零、为什么这三个问题必须放在一起</h2>\n<p><strong>这三个问题是同一个决策链条的三段，拆开回答就没有价值。</strong></p>\n<p>客户真正在问的从来不是\"你们的 token 多少钱一百万\"，而是：<strong>我这件事要花多少钱，有没有更省的做法。</strong> 回答这个问题需要依次算清楚三件事——要用多少、用什么、怎么用最省。</p>\n<p>而这条链条正是我们区别于纯通道商的地方。<strong>上游厂商不会替客户做这个测算</strong>（模块 20 里上游自己说没有销售、没有客服），开源网关也做不了（模块 14 第五节：开源方案给数据，不给结论）。<strong>能把这三段算清楚，我们才是顾问；只能报价，我们就只是通道。</strong></p>\n<p>三段的关系是串行的：</p>\n<p><strong>量</strong> 决定了这笔生意的规模，也决定了值不值得投入销售资源（模块 12 第五节的授信判断）。\n<strong>选型</strong> 决定了单位成本，而单位任务成本与单价是两回事（模块 20 第 1.2 节）。\n<strong>自建对比</strong> 决定了我们会不会在最后一刻被\"我们自己搭一套\"干掉。</p>\n<p><strong>一条贯穿全模块的纪律：所有测算都必须给出区间和假设，不给点估计。</strong> 报一个精确到个位的数字，客户会当承诺；实际偏差超过 30% 时，我们就失去了信任。<strong>说\"按你现在的场景推算是每月 800 万到 1500 万 token，主要不确定性在 Agent 的循环轮次\"，比说\"大概 1200 万\"专业得多。</strong></p>\n<hr />\n<h2>一、问题一：客户的 token 需求量怎么算</h2>\n<h3>1.1 先分清两种情形</h3>\n<p><strong>情形 A：客户已经在用（有历史账单）。</strong> 不要估算，去读数据。重点不是总量，是<strong>结构</strong>。</p>\n<p><strong>情形 B：客户还没上线或要上新功能。</strong> 必须自下而上估算。这是本节的重点，也是最能体现专业度的地方。</p>\n<h3>1.2 情形 A：读已有用量的四个切面</h3>\n<p>拿到客户历史数据后，按四个维度拆解，每个维度都对应一个可能的销售切入点。</p>\n<p><strong>按输入/输出/缓存拆。</strong> 这是最基础也最容易出成绩的一刀。输出单价通常是输入的 3–4 倍；而缓存命中价常见为原价的 10%–25%（模块 01）。<strong>如果缓存占比接近零而输入中有大量重复前缀，这就是一个立刻可兑现的优化点。</strong></p>\n<p><strong>按模型拆。</strong> 找出是否存在\"用旗舰模型干简单活\"的情况。这是第二常见的浪费。</p>\n<p><strong>按业务/功能拆。</strong> 通常符合 80/20——两三个功能吃掉大部分消耗。<strong>优化要打在这几个上，其余不用管。</strong></p>\n<p><strong>按时段拆。</strong> 波峰波谷比决定了两件事：客户是否需要并发保障（我们的 SLA 价值），以及自建对他划不划算（见第三节，波动越大自建越亏）。</p>\n<h3>1.3 情形 B：自下而上估算的基本公式</h3>\n<pre><code>月 token 量 = 月业务量 × 每次业务的调用轮次 × 每轮平均 token\n</code></pre>\n<p>其中\"每轮平均 token\"必须拆成输入、输出、缓存三类分别算，<strong>不能用一个平均数</strong>（原因见模块 04 第二节）。</p>\n<p>难点全在中间那个\"轮次\"上。不同场景差异可以到两个数量级。</p>\n<h3>1.4 场景系数参考表</h3>\n<p><strong>这张表是估算的核心工具。</strong> 数值为经验区间，用于快速定档，<strong>不是承诺值</strong>。</p>\n<table>\n<thead>\n<tr>\n<th>场景</th>\n<th>轮次</th>\n<th>单轮输入</th>\n<th>单轮输出</th>\n<th>输入输出比</th>\n<th>估算难度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>单轮问答 / 分类 / 抽取</td>\n<td>1</td>\n<td>500–2,000</td>\n<td>100–500</td>\n<td>3:1 左右</td>\n<td>低，误差 ±20%</td>\n</tr>\n<tr>\n<td>RAG 知识库问答</td>\n<td>1</td>\n<td>5,000–30,000</td>\n<td>300–1,000</td>\n<td><strong>20:1–50:1</strong></td>\n<td>中，看检索片段数</td>\n</tr>\n<tr>\n<td>长文档摘要 / 合同抽取</td>\n<td>1</td>\n<td>10,000–150,000</td>\n<td>500–3,000</td>\n<td><strong>极高</strong></td>\n<td>低，输入可直接测</td>\n</tr>\n<tr>\n<td>内容生成 / 营销文案</td>\n<td>1–3</td>\n<td>500–3,000</td>\n<td>1,000–4,000</td>\n<td><strong>1:2 反向</strong></td>\n<td>低</td>\n</tr>\n<tr>\n<td>工作流（Dify 多节点）</td>\n<td>节点数</td>\n<td>视节点</td>\n<td>视节点</td>\n<td>混合</td>\n<td>中，逐节点累加</td>\n</tr>\n<tr>\n<td>Agent 循环</td>\n<td><strong>10–50</strong></td>\n<td><strong>单调增长</strong></td>\n<td>300–2,000</td>\n<td>高</td>\n<td><strong>高，误差可达数倍</strong></td>\n</tr>\n<tr>\n<td>编程 Agent</td>\n<td><strong>20–100+</strong></td>\n<td><strong>单调增长且基数大</strong></td>\n<td>500–3,000</td>\n<td>高</td>\n<td><strong>最高，波动最大</strong></td>\n</tr>\n</tbody>\n</table>\n<h3>1.5 Agent 场景：为什么天真估算会低估好几倍</h3>\n<p><strong>这是本模块最重要的一个公式，也是销售最有杀伤力的一段讲解。</strong></p>\n<p>多数人估 Agent 消耗时会算「轮次 × 单轮输入」。<strong>这是错的，而且错得很离谱。</strong> 因为 Agent 每一轮的输入里都累积着前面所有轮次的内容（机制见模块 16、模块 13 的 ReAct 说明）。</p>\n<p>设初始上下文为 <code>C₀</code>，每轮新增（模型输出 + 工具返回）为 <code>ΔC</code>，共 <code>N</code> 轮，则第 i 轮的输入约为 <code>C₀ + (i-1)·ΔC</code>。累加得：</p>\n<pre><code>Agent 总输入 token ≈ N·C₀ + ΔC · N(N-1)/2\n</code></pre>\n<p><strong>这是等差数列求和，第二项随轮次呈平方增长——这就是 Agent 烧钱的数学本质。</strong></p>\n<p><strong>算例</strong>：<code>N=20</code>、<code>C₀=8,000</code>、<code>ΔC=1,500</code></p>\n<pre><code>天真估算：20 × 8,000                    = 160,000 token\n实际估算：20×8,000 + 1,500×20×19/2      = 445,000 token\n                                          ↑ 低估了 2.8 倍\n</code></pre>\n<p><strong>轮次翻倍到 40 轮时，实际消耗涨到约 1,490,000——是 20 轮的 3.3 倍，而不是 2 倍。</strong></p>\n<p><strong>这段话应该原样讲给客户听。</strong> 它同时做到三件事：证明我们懂他的技术、解释他账单为什么超预期、以及自然引出\"所以上下文压缩和缓存值多少钱\"。</p>\n<h3>1.6 三种估算方法与精度</h3>\n<table>\n<thead>\n<tr>\n<th>方法</th>\n<th>做法</th>\n<th>精度</th>\n<th>适用</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>类比法</strong></td>\n<td>拿场景相似的存量客户实际数据外推</td>\n<td><strong>最高，±30%</strong></td>\n<td>我们有同类客户数据时首选</td>\n</tr>\n<tr>\n<td>自下而上</td>\n<td>业务量 × 轮次 × 单轮 token</td>\n<td>±50%，Agent 场景更差</td>\n<td>通用，无参照时用</td>\n</tr>\n<tr>\n<td><strong>压测法</strong></td>\n<td>POC 跑真实流量，按比例外推</td>\n<td><strong>最高，±15%</strong></td>\n<td>客户愿意配合时最优</td>\n</tr>\n</tbody>\n</table>\n<p><strong>类比法的价值随我们的客户数增长而增长——这正是模块 02 说的\"数据资产\"的具体形态之一。</strong> 每服务一个客户，我们估下一个同类客户的能力就强一分。<strong>建议从第一个客户开始，就按场景标签沉淀真实用量数据。</strong></p>\n<h3>1.7 安全边际：宁可高估</h3>\n<p><strong>估算误差的代价是不对称的。</strong></p>\n<p>低估的后果是客户第一张账单超预期，愤怒、失去信任、大概率流失（模块 16 第六节：这一层客户流失的首要原因就是账单震惊）。高估的后果只是我们少赚一点，或者客户觉得比预想的便宜——<strong>后者甚至是好事</strong>。</p>\n<p><strong>所以：对客沟通一律用区间的上沿，内部规划用中位数。</strong></p>\n<p>建议的安全系数：确定性场景（单轮、RAG）×1.3；工作流场景 ×1.5；<strong>Agent 场景 ×2.0</strong>。</p>\n<h3>1.8 销售现场必问的七个问题</h3>\n<p>按这个顺序问，问完就能定档：</p>\n<p>业务量是多少（日/月调用次数或处理单量）；<strong>是不是 Agent 类，如果是，一个任务大概几轮</strong>；有没有知识库检索，一次注入几个片段；系统提示词多长，每次调用是否重传；输入长还是输出长；有没有波峰波谷，峰值是均值的几倍；<strong>现在有没有在跑，能不能给一周的真实账单</strong>。</p>\n<p>最后一个问题的价值最大——<strong>只要拿到真实账单，前面六个问题的答案都能验证。</strong></p>\n<hr />\n<h2>二、问题二：什么模型最合适</h2>\n<h3>2.1 核心原则：选\"够用的最便宜\"，不是\"最好的\"，更不是\"最便宜的\"</h3>\n<p>选型的目标函数是<strong>在满足能力门槛的前提下，最小化单位任务成本</strong>。</p>\n<p>这里有两个常见错误，方向相反但都很贵：</p>\n<p><strong>错误一：迷信旗舰。</strong> 用最强的模型干分类、抽取、格式化这类活，成本可能是必要成本的十倍。</p>\n<p><strong>错误二：迷信低价。</strong> 这个错误更隐蔽，也更贵。<strong>低价模型往往更贵</strong>——能力弱意味着更多轮次、更长思考链、更多重试才能完成同一任务（模块 20 第 1.2 节，来自上游一手论述）。</p>\n<h3>2.2 关键公式：单位任务成本</h3>\n<p><strong>这是选型的唯一正确标尺。</strong></p>\n<pre><code>单位任务成本 = 模型单价 × 单任务 token 量 × (1 + 重试率)\n</code></pre>\n<p>弱模型在后两项上同时吃亏：token 量更高（要更多轮次），重试率更高（一次做不对）。<strong>所以单价便宜三倍的模型，单位任务成本完全可能更高。</strong></p>\n<p><strong>这个公式必须讲给客户听</strong>，因为它把\"我们不推荐你用最便宜的\"从\"想多卖钱\"变成了\"帮你算总账\"。</p>\n<h3>2.3 任务分层与选型矩阵</h3>\n<p>把客户的业务拆成任务层级，逐层配模型——<strong>这是混合路由的设计依据，也是我们的核心产品价值所在。</strong></p>\n<table>\n<thead>\n<tr>\n<th>层级</th>\n<th>典型任务</th>\n<th>能力门槛</th>\n<th>建议档位</th>\n<th>选型要点</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>L1</strong></td>\n<td>分类、实体抽取、格式化、路由判断</td>\n<td>低</td>\n<td>走量层（0.3–0.8 元档）</td>\n<td>越便宜越好，甚至可用免费额度</td>\n</tr>\n<tr>\n<td><strong>L2</strong></td>\n<td>常规问答、摘要、改写、翻译</td>\n<td>中</td>\n<td>主力层（2–5 元档）</td>\n<td>性价比模型的主战场</td>\n</tr>\n<tr>\n<td><strong>L3</strong></td>\n<td>复杂推理、代码生成、Agent 规划</td>\n<td><strong>高</strong></td>\n<td>旗舰层（5–15 元档）</td>\n<td><strong>这里省不得</strong>，弱模型的重试成本更高</td>\n</tr>\n<tr>\n<td><strong>L4</strong></td>\n<td>多模态、图文音视频</td>\n<td>专项</td>\n<td>按模态选专门厂商</td>\n<td>DeepSeek 系明确不做（模块 20 第 5.2 节）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>一个典型的 Agent 业务应该跨三层配置</strong>：主规划用 L3，工具调用参数生成用 L2，输入分类与路由判断用 L1。<strong>这样配下来，成本通常能降到全程用旗舰的三到五成，而效果几乎无损。</strong></p>\n<p><strong>这正是我们相对客户直连官方的硬价值</strong>——直连官方要开三个账号、写三套适配；在我们这里一个 Key、一套协议、账单还能按层级拆开看（模块 16 第四节 Roo Code 分模式配置就是这个场景的完美载体）。</p>\n<h3>2.4 非功能约束清单</h3>\n<p>能力够了不等于能用。以下每一条不满足都是一票否决：</p>\n<p><strong>上下文长度</strong>是否覆盖最长输入；<strong>协议兼容</strong>是否原生支持客户工具所需的协议（Anthropic 原生还是 OpenAI 兼容，见模块 12 第三节）；<strong>function calling / 结构化输出</strong>的行为是否稳定；<strong>并发与限流</strong>能否支撑峰值；<strong>合规</strong>是否有模型备案号可提供（模块 08）；<strong>多模态</strong>能力是否具备；<strong>缓存</strong>是否支持及计费如何。</p>\n<h3>2.5 选型必须验证，不能靠感觉</h3>\n<p><strong>任何没有经过评测的选型建议都是猜测。</strong> 给一个最小可行的验证方法，客户配合成本很低：</p>\n<p>从客户真实业务中抽 <strong>30–50 条样本</strong>（覆盖典型случай和边界情况）→ 人工标注期望输出 → 用 2–3 个候选模型各跑一遍 → 比较三项：<strong>准确率、单任务 token 量、单任务成本</strong>。</p>\n<p><strong>注意第二项和第三项经常被忽略，而它们恰恰是决定性的。</strong> 一个准确率高 3 个百分点但成本高两倍的模型，在多数业务场景里并不划算。</p>\n<p>这套评测做完，我们交付给客户的就不是一句\"建议用 X\"，而是一份带数据的选型报告——<strong>这是模块 09 阶段三\"价值证明\"最有力的交付物形态之一。</strong></p>\n<hr />\n<h2>三、问题三：自建要多少钱，API 要多少钱</h2>\n<h3>3.1 决定性变量不是硬件价格，是利用率</h3>\n<p><strong>这一节如果只记一句话，就记这句：自建划不划算，取决于 GPU 利用率，而不是硬件多少钱。</strong></p>\n<p>公开的成本核算研究给出了一个非常关键的数字：<strong>自建相对 API 更便宜的利用率临界点约为 52%</strong>（蒙特卡洛模拟 95% 置信区间 48%–56%）。而现实是：</p>\n<ul>\n<li><strong>典型 AI 创业公司的实际 GPU 利用率只有 30%–50%</strong></li>\n<li><strong>API 厂商的集群利用率在 90% 以上</strong></li>\n</ul>\n<p><strong>也就是说，绝大多数企业恰好落在临界点以下的\"陷阱区间\"——他们以为自建省钱，实际更贵。</strong></p>\n<p>原因不难理解：企业的业务有波峰波谷，为峰值买的卡在低谷时空转，而<strong>折旧照算</strong>。有测算指出，在 30% 利用率、4×H100 的配置下，<strong>每年约有相当于一张 GPU 采购成本的折旧被浪费在空转上</strong>。</p>\n<p>而 API 厂商能做到 90%+ 利用率，是因为<strong>他们聚合了成千上万客户的波峰波谷，互相填平</strong>。<strong>这是结构性的成本优势，单个企业无论怎么优化都追不上。</strong></p>\n<h3>3.2 自建的完整成本构成</h3>\n<p><strong>客户自己算自建成本时，八成只算了第一项。</strong> 我们的价值就是把后面几项摆出来。</p>\n<table>\n<thead>\n<tr>\n<th>成本项</th>\n<th>说明</th>\n<th>常见遗漏程度</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>GPU 采购/租赁折旧</td>\n<td>按 3–5 年摊销</td>\n<td>一般会算</td>\n</tr>\n<tr>\n<td>电力</td>\n<td>含制冷</td>\n<td>常低估</td>\n</tr>\n<tr>\n<td>带宽</td>\n<td></td>\n<td><strong>常遗漏</strong></td>\n</tr>\n<tr>\n<td>机房 / 托管 / 制冷</td>\n<td></td>\n<td><strong>常遗漏</strong></td>\n</tr>\n<tr>\n<td><strong>运维人力</strong></td>\n<td>部署、监控、故障处理、版本升级</td>\n<td><strong>最常被遗漏，也常是最大项之一</strong></td>\n</tr>\n<tr>\n<td>模型迭代跟进</td>\n<td>新版本重新部署、重新评测</td>\n<td><strong>几乎总被遗漏</strong></td>\n</tr>\n<tr>\n<td>峰值冗余</td>\n<td>按峰值买、按均值用的浪费</td>\n<td><strong>几乎总被遗漏</strong></td>\n</tr>\n<tr>\n<td>资金占用</td>\n<td>一次性投入的机会成本</td>\n<td>常遗漏</td>\n</tr>\n</tbody>\n</table>\n<p>参考量级：公开核算中一套 4×H100 配置的年总成本约 11 万美元，其中 GPU 折旧约 4 万、机房约 1.8 万、运维人力约 2.4 万、带宽约 1.2 万、电力约 0.4 万。<strong>注意运维人力接近折旧的六成——这一项客户几乎从不计入。</strong></p>\n<h3>3.3 核心公式</h3>\n<p><strong>自建的单位 token 成本：</strong></p>\n<pre><code>自建每百万 token 成本 = 月总成本 ÷ (理论月产能 × 实际利用率)\n</code></pre>\n<p><strong>⚠️ 最常见的测算错误就出在分母上：用理论产能除，而不是用实际产出除。</strong> 这个错误会让自建成本看起来低 2–3 倍。</p>\n<p>网上大量\"自建比 API 便宜 5 到 100 倍\"的说法，基本都犯了这个错——<strong>它们只算电费，不算折旧、不算人力、更不按实际利用率折算</strong>。销售遇到客户拿这类材料来，可以直接指出分母问题。</p>\n<p><strong>盈亏平衡的月消耗量：</strong></p>\n<pre><code>平衡点 Q* = 自建月固定成本 ÷ API 单价\n</code></pre>\n<p>低于 Q<em>，买 API 更划算；高于 Q</em>，自建才开始有意义（且前提是利用率能撑住）。</p>\n<p><strong>算例（用客户自己的数字替换）</strong>：若某方案月固定成本 10 万元，采用的 API 综合单价 2 元/百万 token，则</p>\n<pre><code>Q* = 100,000 ÷ 2 = 50,000 百万 token = 500 亿 token / 月\n</code></pre>\n<p><strong>500 亿 token/月 是什么概念？</strong> 对照模块 12 的用量预判表——这远超绝大多数企业客户的量级。<strong>大多数客户根本达不到自建的盈亏平衡点，这个计算一做出来，自建的话题基本就结束了。</strong></p>\n<h3>3.4 与上游定价逻辑的交叉印证</h3>\n<p>模块 20 记录了一条来自上游的表述：按十个月回本定价，<strong>就能让独立部署的第三方无利可图</strong>，因为第三方做不到这个成本。</p>\n<p><strong>这与 52% 利用率临界点是同一件事的两个视角</strong>——上游用极高的集群利用率把单位成本压到极低，再按合理利润定价，自然就把自建的经济空间挤掉了。</p>\n<p><strong>两个独立来源指向同一结论，这条判断的可信度比单一来源高得多。</strong>（注意：模块 20 的材料真实性未经证实，对外只能引用 52% 那组公开数据，不能引用上游的表述。）</p>\n<h3>3.5 但是：自建有非成本理由，不要用成本去反驳</h3>\n<p><strong>这一节是销售纪律，违反了会翻车。</strong></p>\n<p>客户选择自建，可能压根不是为了省钱：</p>\n<p><strong>数据不出域</strong>（金融、医疗、政务、法律的硬合规要求）；<strong>不受限流</strong>（业务不能因上游波动中断）；<strong>深度定制</strong>（微调、蒸馏、改架构）；<strong>内部立项需要</strong>（部门要有自己的技术资产）；<strong>长期战略</strong>（不想在基础设施上受制于人）。</p>\n<p><strong>遇到这些理由时，用成本去反驳是无效的，而且会立刻暴露我们只是想卖 token。</strong></p>\n<p>正确的姿态是承认这些理由成立，然后转向<strong>混合架构</strong>——这也是模块 15 第四节和模块 19 第五节反复指向的现实答案：</p>\n<blockquote>\n<p>\"数据不能出去这条我完全理解，那部分就该在你们内网跑。但你们本地模型在复杂推理和长文档上肯定吃力，这部分走出去的量很小，却是效果差距最大的地方。我们可以做成按场景自动路由——常规的走本地一分钱不花，只有本地干不了的才走我们。而且两边的成本能合到一张账单上看。\"</p>\n</blockquote>\n<p><strong>这段话的关键在于：我们不与客户的自建竞争，我们做他自建体系的补充和度量层。</strong></p>\n<h3>3.6 什么时候我们该建议客户自建</h3>\n<p><strong>是的，我们应该有这个诚实的判断。</strong> 满足以下全部条件时，自建对客户确实更优，硬推 API 是不专业的：</p>\n<p>月消耗量稳定超过盈亏平衡点；<strong>负载平稳，利用率能持续维持在 60% 以上</strong>；有专职运维能力；模型选型已经固定、不需要频繁跟进新版本；且有明确的合规或定制刚需。</p>\n<p><strong>同时满足这五条的客户，坦率说非常少。</strong> 但遇到时如实说，长期收益远大于硬啃一单——而且这类客户往往仍然需要一条 API 通道做峰值溢出和能力补充。</p>\n<hr />\n<h2>四、三个问题合起来：标准测算流程</h2>\n<p>把三节串成一个可执行的售前流程，对应模块 09 的阶段二和阶段三。</p>\n<p><strong>第一步 · 问量（30 分钟）。</strong> 用 1.8 节的七个问题定档，现场给出粗略区间。<strong>能拿到真实账单就跳过估算直接读数据。</strong></p>\n<p><strong>第二步 · 拆层（内部，半天）。</strong> 把业务拆成 L1–L4，识别当前是否存在\"旗舰干轻活\"和\"缓存没用\"两类浪费。</p>\n<p><strong>第三步 · 出选型建议（需评测支撑）。</strong> 30–50 条样本跑 2–3 个候选模型，比准确率、token 量、单位任务成本三项。</p>\n<p><strong>第四步 · 算三笔账。</strong> 当前方案成本、优化后方案成本、自建方案成本（含全部隐性项与利用率折算）。</p>\n<p><strong>第五步 · 出报告。</strong> 这就是模块 09 阶段三的《成本分析与优化建议报告》，也是整个销售流程中最重要的交付物。</p>\n<p><strong>报告里必须包含的一句话是：「以上测算基于以下假设……，主要不确定性来自……」。</strong> 带假设的测算是专业，不带假设的测算是承诺——<strong>这个区别在客户账单出来那天会变得非常重要。</strong></p>\n<hr />\n<h2>五、待补的工具化</h2>\n<p>本模块的三套公式建议做进业务管理台，与现有的毛利测算器并列：</p>\n<p><strong>需求测算器</strong>（场景系数 + Agent 等差数列公式 → 月 token 量区间）；<strong>选型对比器</strong>（多模型的单位任务成本对比）；<strong>自建对比器</strong>（完整成本项 + 利用率 → 盈亏平衡点）。</p>\n<p><strong>尤其是自建对比器</strong>——它把一场可能失去客户的争论，变成一张客户自己按着算的表。</p>\n<hr />\n<h2>数据来源与复核</h2>\n<ul>\n<li><a href=\"https://www.infoq.cn/article/hocbRjZumiBA6MN4s7bu\">AI 推理成本首次算清：GPU 利用率不到 52%，千万别自建 - InfoQ</a>（52% 临界点、利用率区间、成本构成）</li>\n<li><a href=\"https://www.ertas.ai/zh/blog/ai-inference-cost-comparison-2026\">2026 年 AI 推理成本对比：云 API vs 自托管 vs 专用芯片 - Ertas AI</a>（<strong>该文宣称自建比 API 便宜 5–100 倍，与前一来源结论冲突。经核对，其算法只计电费、未计折旧与运维、且未按实际利用率折算——即本模块 3.3 节指出的典型错误。此处作为反面案例引用，其结论不予采信。</strong>）</li>\n<li>内部交叉引用：模块 01（价格结构与缓存）、模块 04（单位经济模型）、模块 12（用量预判表）、模块 16（Agent 消耗机制）、模块 20（上游定价逻辑，待证实）</li>\n</ul>\n<blockquote>\n<p>Agent 消耗的等差数列公式为本模块基于 ReAct 循环机制的推导，非引用，<strong>建议用真实调用数据校准后再对外使用</strong>。</p>\n</blockquote>", "plain": " 模块 21 · 客户需求测算与选型方法论\n\n 本模块解决三个问题：客户到底要烧多少 token、该用什么模型、自建和买 API 各要多少钱。\n 使用者：销售必修，售前与解决方案的核心工具，业务智能体的计算逻辑来源。\n 数据采集日：20260727。成本类数据变动快，公式长期有效，参考值需按季度复核。\n\n\n\n 零、为什么这三个问题必须放在一起\n\n这三个问题是同一个决策链条的三段，拆开回答就没有价值。\n\n客户真正在问的从来不是\"你们的 token 多少钱一百万\"，而是：我这件事要花多少钱，有没有更省的做法。 回答这个问题需要依次算清楚三件事——要用多少、用什么、怎么用最省。\n\n而这条链条正是我们区别于纯通道商的地方。上游厂商不会替客户做这个测算（模块 20 里上游自己说没有销售、没有客服），开源网关也做不了（模块 14 第五节：开源方案给数据，不给结论）。能把这三段算清楚，我们才是顾问；只能报价，我们就只是通道。\n\n三段的关系是串行的：\n\n量 决定了这笔生意的规模，也决定了值不值得投入销售资源（模块 12 第五节的授信判断）。\n选型 决定了单位成本，而单位任务成本与单价是两回事（模块 20 第 1.2 节）。\n自建对比 决定了我们会不会在最后一刻被\"我们自己搭一套\"干掉。\n\n一条贯穿全模块的纪律：所有测算都必须给出区间和假设，不给点估计。 报一个精确到个位的数字，客户会当承诺；实际偏差超过 30% 时，我们就失去了信任。说\"按你现在的场景推算是每月 800 万到 1500 万 token，主要不确定性在 Agent 的循环轮次\"，比说\"大概 1200 万\"专业得多。\n\n\n\n 一、问题一：客户的 token 需求量怎么算\n\n 1.1 先分清两种情形\n\n情形 A：客户已经在用（有历史账单）。 不要估算，去读数据。重点不是总量，是结构。\n\n情形 B：客户还没上线或要上新功能。 必须自下而上估算。这是本节的重点，也是最能体现专业度的地方。\n\n 1.2 情形 A：读已有用量的四个切面\n\n拿到客户历史数据后，按四个维度拆解，每个维度都对应一个可能的销售切入点。\n\n按输入/输出/缓存拆。 这是最基础也最容易出成绩的一刀。输出单价通常是输入的 3–4 倍；而缓存命中价常见为原价的 10%–25%（模块 01）。如果缓存占比接近零而输入中有大量重复前缀，这就是一个立刻可兑现的优化点。\n\n按模型拆。 找出是否存在\"用旗舰模型干简单活\"的情况。这是第二常见的浪费。\n\n按业务/功能拆。 通常符合 80/20——两三个功能吃掉大部分消耗。优化要打在这几个上，其余不用管。\n\n按时段拆。 波峰波谷比决定了两件事：客户是否需要并发保障（我们的 SLA 价值），以及自建对他划不划算（见第三节，波动越大自建越亏）。\n\n 1.3 情形 B：自下而上估算的基本公式\n\n\n月 token 量 = 月业务量 × 每次业务的调用轮次 × 每轮平均 token\n\n\n其中\"每轮平均 token\"必须拆成输入、输出、缓存三类分别算，不能用一个平均数（原因见模块 04 第二节）。\n\n难点全在中间那个\"轮次\"上。不同场景差异可以到两个数量级。\n\n 1.4 场景系数参考表\n\n这张表是估算的核心工具。 数值为经验区间，用于快速定档，不是承诺值。\n\n 场景  轮次  单轮输入  单轮输出  输入输出比  估算难度 \n\n 单轮问答 / 分类 / 抽取  1  500–2,000  100–500  3:1 左右  低，误差 ±20% \n RAG 知识库问答  1  5,000–30,000  300–1,000  20:1–50:1  中，看检索片段数 \n 长文档摘要 / 合同抽取  1  10,000–150,000  500–3,000  极高  低，输入可直接测 \n 内容生成 / 营销文案  1–3  500–3,000  1,000–4,000  1:2 反向  低 \n 工作流（Dify 多节点）  节点数  视节点  视节点  混合  中，逐节点累加 \n Agent 循环  10–50  单调增长  300–2,000  高  高，误差可达数倍 \n 编程 Agent  20–100+  单调增长且基数大  500–3,000  高  最高，波动最大 \n\n 1.5 Agent 场景：为什么天真估算会低估好几倍\n\n这是本模块最重要的一个公式，也是销售最有杀伤力的一段讲解。\n\n多数人估 Agent 消耗时会算「轮次 × 单轮输入」。这是错的，而且错得很离谱。 因为 Agent 每一轮的输入里都累积着前面所有轮次的内容（机制见模块 16、模块 13 的 ReAct 说明）。\n\n设初始上下文为 C₀，每轮新增（模型输出 + 工具返回）为 ΔC，共 N 轮，则第 i 轮的输入约为 C₀ + (i1)·ΔC。累加得：\n\n\nAgent 总输入 token ≈ N·C₀ + ΔC · N(N1)/2\n\n\n这是等差数列求和，第二项随轮次呈平方增长——这就是 Agent 烧钱的数学本质。\n\n算例：N=20、C₀=8,000、ΔC=1,500\n\n\n天真估算：20 × 8,000                    = 160,000 token\n实际估算：20×8,000 + 1,500×20×19/2      = 445,000 token\n                                          ↑ 低估了 2.8 倍\n\n\n轮次翻倍到 40 轮时，实际消耗涨到约 1,490,000——是 20 轮的 3.3 倍，而不是 2 倍。\n\n这段话应该原样讲给客户听。 它同时做到三件事：证明我们懂他的技术、解释他账单为什么超预期、以及自然引出\"所以上下文压缩和缓存值多少钱\"。\n\n 1.6 三种估算方法与精度\n\n 方法  做法  精度  适用 \n\n 类比法  拿场景相似的存量客户实际数据外推  最高，±30%  我们有同类客户数据时首选 \n 自下而上  业务量 × 轮次 × 单轮 token  ±50%，Agent 场景更差  通用，无参照时用 \n 压测法  POC 跑真实流量，按比例外推  最高，±15%  客户愿意配合时最优 \n\n类比法的价值随我们的客户数增长而增长——这正是模块 02 说的\"数据资产\"的具体形态之一。 每服务一个客户，我们估下一个同类客户的能力就强一分。建议从第一个客户开始，就按场景标签沉淀真实用量数据。\n\n 1.7 安全边际：宁可高估\n\n估算误差的代价是不对称的。\n\n低估的后果是客户第一张账单超预期，愤怒、失去信任、大概率流失（模块 16 第六节：这一层客户流失的首要原因就是账单震惊）。高估的后果只是我们少赚一点，或者客户觉得比预想的便宜——后者甚至是好事。\n\n所以：对客沟通一律用区间的上沿，内部规划用中位数。\n\n建议的安全系数：确定性场景（单轮、RAG）×1.3；工作流场景 ×1.5；Agent 场景 ×2.0。\n\n 1.8 销售现场必问的七个问题\n\n按这个顺序问，问完就能定档：\n\n业务量是多少（日/月调用次数或处理单量）；是不是 Agent 类，如果是，一个任务大概几轮；有没有知识库检索，一次注入几个片段；系统提示词多长，每次调用是否重传；输入长还是输出长；有没有波峰波谷，峰值是均值的几倍；现在有没有在跑，能不能给一周的真实账单。\n\n最后一个问题的价值最大——只要拿到真实账单，前面六个问题的答案都能验证。\n\n\n\n 二、问题二：什么模型最合适\n\n 2.1 核心原则：选\"够用的最便宜\"，不是\"最好的\"，更不是\"最便宜的\"\n\n选型的目标函数是在满足能力门槛的前提下，最小化单位任务成本。\n\n这里有两个常见错误，方向相反但都很贵：\n\n错误一：迷信旗舰。 用最强的模型干分类、抽取、格式化这类活，成本可能是必要成本的十倍。\n\n错误二：迷信低价。 这个错误更隐蔽，也更贵。低价模型往往更贵——能力弱意味着更多轮次、更长思考链、更多重试才能完成同一任务（模块 20 第 1.2 节，来自上游一手论述）。\n\n 2.2 关键公式：单位任务成本\n\n这是选型的唯一正确标尺。\n\n\n单位任务成本 = 模型单价 × 单任务 token 量 × (1 + 重试率)\n\n\n弱模型在后两项上同时吃亏：token 量更高（要更多轮次），重试率更高（一次做不对）。所以单价便宜三倍的模型，单位任务成本完全可能更高。\n\n这个公式必须讲给客户听，因为它把\"我们不推荐你用最便宜的\"从\"想多卖钱\"变成了\"帮你算总账\"。\n\n 2.3 任务分层与选型矩阵\n\n把客户的业务拆成任务层级，逐层配模型——这是混合路由的设计依据，也是我们的核心产品价值所在。\n\n 层级  典型任务  能力门槛  建议档位  选型要点 \n\n L1  分类、实体抽取、格式化、路由判断  低  走量层（0.3–0.8 元档）  越便宜越好，甚至可用免费额度 \n L2  常规问答、摘要、改写、翻译  中  主力层（2–5 元档）  性价比模型的主战场 \n L3  复杂推理、代码生成、Agent 规划  高  旗舰层（5–15 元档）  这里省不得，弱模型的重试成本更高 \n L4  多模态、图文音视频  专项  按模态选专门厂商  DeepSeek 系明确不做（模块 20 第 5.2 节） \n\n一个典型的 Agent 业务应该跨三层配置：主规划用 L3，工具调用参数生成用 L2，输入分类与路由判断用 L1。这样配下来，成本通常能降到全程用旗舰的三到五成，而效果几乎无损。\n\n这正是我们相对客户直连官方的硬价值——直连官方要开三个账号、写三套适配；在我们这里一个 Key、一套协议、账单还能按层级拆开看（模块 16 第四节 Roo Code 分模式配置就是这个场景的完美载体）。\n\n 2.4 非功能约束清单\n\n能力够了不等于能用。以下每一条不满足都是一票否决：\n\n上下文长度是否覆盖最长输入；协议兼容是否原生支持客户工具所需的协议（Anthropic 原生还是 OpenAI 兼容，见模块 12 第三节）；function calling / 结构化输出的行为是否稳定；并发与限流能否支撑峰值；合规是否有模型备案号可提供（模块 08）；多模态能力是否具备；缓存是否支持及计费如何。\n\n 2.5 选型必须验证，不能靠感觉\n\n任何没有经过评测的选型建议都是猜测。 给一个最小可行的验证方法，客户配合成本很低：\n\n从客户真实业务中抽 30–50 条样本（覆盖典型случай和边界情况）→ 人工标注期望输出 → 用 2–3 个候选模型各跑一遍 → 比较三项：准确率、单任务 token 量、单任务成本。\n\n注意第二项和第三项经常被忽略，而它们恰恰是决定性的。 一个准确率高 3 个百分点但成本高两倍的模型，在多数业务场景里并不划算。\n\n这套评测做完，我们交付给客户的就不是一句\"建议用 X\"，而是一份带数据的选型报告——这是模块 09 阶段三\"价值证明\"最有力的交付物形态之一。\n\n\n\n 三、问题三：自建要多少钱，API 要多少钱\n\n 3.1 决定性变量不是硬件价格，是利用率\n\n这一节如果只记一句话，就记这句：自建划不划算，取决于 GPU 利用率，而不是硬件多少钱。\n\n公开的成本核算研究给出了一个非常关键的数字：自建相对 API 更便宜的利用率临界点约为 52%（蒙特卡洛模拟 95% 置信区间 48%–56%）。而现实是：\n\n 典型 AI 创业公司的实际 GPU 利用率只有 30%–50%\n API 厂商的集群利用率在 90% 以上\n\n也就是说，绝大多数企业恰好落在临界点以下的\"陷阱区间\"——他们以为自建省钱，实际更贵。\n\n原因不难理解：企业的业务有波峰波谷，为峰值买的卡在低谷时空转，而折旧照算。有测算指出，在 30% 利用率、4×H100 的配置下，每年约有相当于一张 GPU 采购成本的折旧被浪费在空转上。\n\n而 API 厂商能做到 90%+ 利用率，是因为他们聚合了成千上万客户的波峰波谷，互相填平。这是结构性的成本优势，单个企业无论怎么优化都追不上。\n\n 3.2 自建的完整成本构成\n\n客户自己算自建成本时，八成只算了第一项。 我们的价值就是把后面几项摆出来。\n\n 成本项  说明  常见遗漏程度 \n\n GPU 采购/租赁折旧  按 3–5 年摊销  一般会算 \n 电力  含制冷  常低估 \n 带宽   常遗漏 \n 机房 / 托管 / 制冷   常遗漏 \n 运维人力  部署、监控、故障处理、版本升级  最常被遗漏，也常是最大项之一 \n 模型迭代跟进  新版本重新部署、重新评测  几乎总被遗漏 \n 峰值冗余  按峰值买、按均值用的浪费  几乎总被遗漏 \n 资金占用  一次性投入的机会成本  常遗漏 \n\n参考量级：公开核算中一套 4×H100 配置的年总成本约 11 万美元，其中 GPU 折旧约 4 万、机房约 1.8 万、运维人力约 2.4 万、带宽约 1.2 万、电力约 0.4 万。注意运维人力接近折旧的六成——这一项客户几乎从不计入。\n\n 3.3 核心公式\n\n自建的单位 token 成本：\n\n\n自建每百万 token 成本 = 月总成本 ÷ (理论月产能 × 实际利用率)\n\n\n⚠️ 最常见的测算错误就出在分母上：用理论产能除，而不是用实际产出除。 这个错误会让自建成本看起来低 2–3 倍。\n\n网上大量\"自建比 API 便宜 5 到 100 倍\"的说法，基本都犯了这个错——它们只算电费，不算折旧、不算人力、更不按实际利用率折算。销售遇到客户拿这类材料来，可以直接指出分母问题。\n\n盈亏平衡的月消耗量：\n\n\n平衡点 Q = 自建月固定成本 ÷ API 单价\n\n\n低于 Q，买 API 更划算；高于 Q，自建才开始有意义（且前提是利用率能撑住）。\n\n算例（用客户自己的数字替换）：若某方案月固定成本 10 万元，采用的 API 综合单价 2 元/百万 token，则\n\n\nQ = 100,000 ÷ 2 = 50,000 百万 token = 500 亿 token / 月\n\n\n500 亿 token/月 是什么概念？ 对照模块 12 的用量预判表——这远超绝大多数企业客户的量级。大多数客户根本达不到自建的盈亏平衡点，这个计算一做出来，自建的话题基本就结束了。\n\n 3.4 与上游定价逻辑的交叉印证\n\n模块 20 记录了一条来自上游的表述：按十个月回本定价，就能让独立部署的第三方无利可图，因为第三方做不到这个成本。\n\n这与 52% 利用率临界点是同一件事的两个视角——上游用极高的集群利用率把单位成本压到极低，再按合理利润定价，自然就把自建的经济空间挤掉了。\n\n两个独立来源指向同一结论，这条判断的可信度比单一来源高得多。（注意：模块 20 的材料真实性未经证实，对外只能引用 52% 那组公开数据，不能引用上游的表述。）\n\n 3.5 但是：自建有非成本理由，不要用成本去反驳\n\n这一节是销售纪律，违反了会翻车。\n\n客户选择自建，可能压根不是为了省钱：\n\n数据不出域（金融、医疗、政务、法律的硬合规要求）；不受限流（业务不能因上游波动中断）；深度定制（微调、蒸馏、改架构）；内部立项需要（部门要有自己的技术资产）；长期战略（不想在基础设施上受制于人）。\n\n遇到这些理由时，用成本去反驳是无效的，而且会立刻暴露我们只是想卖 token。\n\n正确的姿态是承认这些理由成立，然后转向混合架构——这也是模块 15 第四节和模块 19 第五节反复指向的现实答案：\n\n \"数据不能出去这条我完全理解，那部分就该在你们内网跑。但你们本地模型在复杂推理和长文档上肯定吃力，这部分走出去的量很小，却是效果差距最大的地方。我们可以做成按场景自动路由——常规的走本地一分钱不花，只有本地干不了的才走我们。而且两边的成本能合到一张账单上看。\"\n\n这段话的关键在于：我们不与客户的自建竞争，我们做他自建体系的补充和度量层。\n\n 3.6 什么时候我们该建议客户自建\n\n是的，我们应该有这个诚实的判断。 满足以下全部条件时，自建对客户确实更优，硬推 API 是不专业的：\n\n月消耗量稳定超过盈亏平衡点；负载平稳，利用率能持续维持在 60% 以上；有专职运维能力；模型选型已经固定、不需要频繁跟进新版本；且有明确的合规或定制刚需。\n\n同时满足这五条的客户，坦率说非常少。 但遇到时如实说，长期收益远大于硬啃一单——而且这类客户往往仍然需要一条 API 通道做峰值溢出和能力补充。\n\n\n\n 四、三个问题合起来：标准测算流程\n\n把三节串成一个可执行的售前流程，对应模块 09 的阶段二和阶段三。\n\n第一步 · 问量（30 分钟）。 用 1.8 节的七个问题定档，现场给出粗略区间。能拿到真实账单就跳过估算直接读数据。\n\n第二步 · 拆层（内部，半天）。 把业务拆成 L1–L4，识别当前是否存在\"旗舰干轻活\"和\"缓存没用\"两类浪费。\n\n第三步 · 出选型建议（需评测支撑）。 30–50 条样本跑 2–3 个候选模型，比准确率、token 量、单位任务成本三项。\n\n第四步 · 算三笔账。 当前方案成本、优化后方案成本、自建方案成本（含全部隐性项与利用率折算）。\n\n第五步 · 出报告。 这就是模块 09 阶段三的《成本分析与优化建议报告》，也是整个销售流程中最重要的交付物。\n\n报告里必须包含的一句话是：「以上测算基于以下假设……，主要不确定性来自……」。 带假设的测算是专业，不带假设的测算是承诺——这个区别在客户账单出来那天会变得非常重要。\n\n\n\n 五、待补的工具化\n\n本模块的三套公式建议做进业务管理台，与现有的毛利测算器并列：\n\n需求测算器（场景系数 + Agent 等差数列公式 → 月 token 量区间）；选型对比器（多模型的单位任务成本对比）；自建对比器（完整成本项 + 利用率 → 盈亏平衡点）。\n\n尤其是自建对比器——它把一场可能失去客户的争论，变成一张客户自己按着算的表。\n\n\n\n 数据来源与复核\n\n [AI 推理成本首次算清：GPU 利用率不到 52%，千万别自建  InfoQ](https://www.infoq.cn/article/hocbRjZumiBA6MN4s7bu)（52% 临界点、利用率区间、成本构成）\n [2026 年 AI 推理成本对比：云 API vs 自托管 vs 专用芯片  Ertas AI](https://www.ertas.ai/zh/blog/aiinferencecostcomparison2026)（该文宣称自建比 API 便宜 5–100 倍，与前一来源结论冲突。经核对，其算法只计电费、未计折旧与运维、且未按实际利用率折算——即本模块 3.3 节指出的典型错误。此处作为反面案例引用，其结论不予采信。）\n 内部交叉引用：模块 01（价格结构与缓存）、模块 04（单位经济模型）、模块 12（用量预判表）、模块 16（Agent 消耗机制）、模块 20（上游定价逻辑，待证实）\n\n Agent 消耗的等差数列公式为本模块基于 ReAct 循环机制的推导，非引用，建议用真实调用数据校准后再对外使用。\n"}, {"id": "22-国产算力卡现状与对策", "code": "22", "title": "模块 22 · 国产算力卡现状与对策", "short": "国产算力卡现状与对策", "subs": ["一、为什么这件事我们必须懂", "二、现状：四家主力的能力盘点", "三、产能：真正的瓶颈", "四、价格：一个反直觉的事实", "五、生态：差距是真实的", "六、我们该怎么做", "七、观察指标", "数据来源与复核"], "html": "<h1>模块 22 · 国产算力卡现状与对策</h1>\n<blockquote>\n<p>本模块解决的问题：国产卡到底能不能用、贵不贵、对我们三条业务线各意味着什么。\n使用者：决策层（批发业务决策）、销售（信创客户）、售前（自建测算）。\n数据采集日：2026-07-27。<strong>硬件参数与产能数据变动极快，建议每季度复核。</strong></p>\n</blockquote>\n<hr />\n<h2>一、为什么这件事我们必须懂</h2>\n<p>国产算力卡看起来是硬件话题，跟我们卖 token 隔了两层。但它<strong>同时影响我们三条业务线</strong>，而且方向不都一样：</p>\n<p><strong>对算力/额度批发分销（模块 02 第三条）</strong>：国产卡的产能与价格直接决定这条线是机会还是陷阱。</p>\n<p><strong>对自建 vs API 的测算（模块 21 第三节）</strong>：硬件价格是自建成本的第一大项，它涨还是跌，直接改变我们给客户算的那笔账。</p>\n<p><strong>对上游选择与合规（模块 03、模块 08）</strong>：政务、金融、国企的信创要求正在从\"模型国产化\"延伸到\"算力也要国产化\"。<strong>这可能是一个我们还没利用起来的差异化机会。</strong></p>\n<p>还有一层更直接的原因：<strong>客户会问。</strong> 一个正在做私有化方案的企业客户，几乎必然会问\"能不能跑在国产卡上\"。答不上来，专业形象就没了。</p>\n<hr />\n<h2>二、现状：四家主力的能力盘点</h2>\n<p>以下为 2026 年 7 月公开渠道采集的参数，<strong>厂商标称值，非实测</strong>。</p>\n<table>\n<thead>\n<tr>\n<th>厂商</th>\n<th>型号</th>\n<th>FP16</th>\n<th>显存</th>\n<th>集群规模</th>\n<th>定位与状态</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>华为昇腾</strong></td>\n<td>910B</td>\n<td>320 TFLOPS</td>\n<td>64GB HBM2e / 1.6TB/s</td>\n<td>4096 卡</td>\n<td>当前训练主力</td>\n</tr>\n<tr>\n<td></td>\n<td>950</td>\n<td><strong>512 TFLOPS</strong>（FP8 1 PFLOPS）</td>\n<td><strong>256GB HBM3e / 4TB/s</strong></td>\n<td><strong>8192 卡</strong></td>\n<td>2026 Q4 交付</td>\n</tr>\n<tr>\n<td><strong>海光</strong></td>\n<td>K100</td>\n<td>150 TFLOPS</td>\n<td>64GB HBM2e</td>\n<td>—</td>\n<td><strong>CUDA 兼容性最优，现货充足</strong></td>\n</tr>\n<tr>\n<td></td>\n<td>K200</td>\n<td>256 TFLOPS</td>\n<td>128GB HBM3e</td>\n<td>600GB/s 互联</td>\n<td>2026 Q3 交付</td>\n</tr>\n<tr>\n<td><strong>寒武纪</strong></td>\n<td>思元 590</td>\n<td>256 TFLOPS</td>\n<td>64GB HBM3e</td>\n<td>512 卡</td>\n<td><strong>推理吞吐 6500 tokens/s</strong></td>\n</tr>\n<tr>\n<td></td>\n<td>思元 370</td>\n<td>—</td>\n<td>—</td>\n<td>边缘 75W</td>\n<td>成本最低</td>\n</tr>\n<tr>\n<td><strong>沐曦</strong></td>\n<td>曦云 C500</td>\n<td>256 TFLOPS</td>\n<td>128GB HBM3e</td>\n<td>—</td>\n<td>AI+渲染混合，交付快（2–3 周）</td>\n</tr>\n</tbody>\n</table>\n<p><strong>⚠️ 不要只看纸面算力。</strong> 行业调研明确建议：选型应\"以目标模型实测\"为准，而非比较标称算力，并把 CANN 版本锁定、权重可迁移性写进采购清单。<strong>这条建议我们应当原样转给做自建评估的客户——这是很容易赢得信任的一句话。</strong></p>\n<h3>2.1 训练与推理必须分开看</h3>\n<p><strong>这是本模块最重要的一个区分，也是最常被混淆的地方。</strong></p>\n<p><strong>训练侧的门槛极高。</strong> 目前能独立完成全尺寸大模型训练的国产芯片只有三款：华为昇腾（训练 DeepSeek V4）、百度昆仑芯（训练文心）、阿里平头哥（支持通义千问基础版本）。<strong>其余所有国产芯片只能稳定支撑 70B 及以下的中小参数模型训练。</strong></p>\n<p><strong>推理侧的门槛低得多</strong>，国产卡已经具备实用性。</p>\n<p><strong>对我们的意义</strong>：我们的业务只涉及推理，<strong>所以国产卡对我们的相关性远高于对训练方的相关性</strong>。客户拿\"国产卡训不动大模型\"来质疑时，要能指出这是训练侧的问题，不是推理侧的。</p>\n<h3>2.2 代差：两级台阶</h3>\n<p>行业调研给出的判断相当直接：<strong>英伟达整体领先华为昇腾 1–1.5 年，华为又领先昆仑、平头哥、寒武纪、海光这个第二梯队 1 年以上。</strong></p>\n<p>差距最大的是<strong>超节点（大规模集群互联）</strong>：华为是国内唯一具备千卡级稳定交付能力的厂商；百度当前稳定量产 64 卡集群，256 卡因供应链延期；阿里 128 卡超节点已上线，256/512 卡方案要到 2026 年底至 2027 年初。</p>\n<p><strong>这个差距对我们的直接含义</strong>：客户如果要自建一个能跑大模型的国产卡集群，<strong>除了华为几乎没有第二个现实选项</strong>——而华为的产能又是有限的（见下一节）。<strong>这实质上堵死了大多数企业\"全国产化自建\"的路。</strong></p>\n<hr />\n<h2>三、产能：真正的瓶颈</h2>\n<p><strong>卡不是设计出来的，是造出来的。</strong> 这一节的数据比参数表更能决定实际格局。</p>\n<p><strong>晶圆产能有硬上限</strong>：中芯国际年晶圆出货上限不超过 300 万片。2026 年 10 月四季度完成设备扩产后，<strong>全年晶圆产能在去年基础上提升 50% 的确定性较强，但要翻倍难度极大。</strong></p>\n<p><strong>良率是第一道坎</strong>：国产先进制程（N+2/N+3）量产良率<strong>仅 30%–40%</strong>。行业共识是\"良率突破 50% 是产能释放的第一道门槛，60% 是规模化量产的分水岭\"——<strong>也就是说目前还没跨过第一道门槛。</strong></p>\n<p><strong>代工切换带来延期</strong>：有厂商因从三星 7nm 切换到中芯国产产线（为进入信创名录），产品发布从 5 月推迟到 7 月。<strong>信创合规与产能供应之间存在真实的取舍。</strong></p>\n<h3>3.1 出货量与市场份额</h3>\n<p>2026 年预期出货：</p>\n<table>\n<thead>\n<tr>\n<th>厂商</th>\n<th>预期出货量</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>华为昇腾</td>\n<td><strong>130 多万张</strong></td>\n</tr>\n<tr>\n<td>阿里平头哥</td>\n<td>30–50 万张</td>\n</tr>\n<tr>\n<td>百度昆仑</td>\n<td>约 25 万张</td>\n</tr>\n<tr>\n<td>寒武纪</td>\n<td>约 20 万张</td>\n</tr>\n<tr>\n<td>海光</td>\n<td>20 万张，年底可冲至 40 万张以上</td>\n</tr>\n</tbody>\n</table>\n<p><strong>英伟达在国内市场占比已跌破 50%，全年预计仅占 30%–40% 区间。</strong></p>\n<p>2027 年行业需求总量预计冲到 <strong>800 万张</strong>，各厂商出货规模同步上浮 20%–30%，份额格局基本维持当前分层。</p>\n<hr />\n<h2>四、价格：一个反直觉的事实</h2>\n<p><strong>这是本模块最需要被记住的一条，因为它直接推翻了我们此前的一个推论。</strong></p>\n<p><strong>搭载国产芯片的 8 卡服务器：2025 年均价 150 万元/台，2026 年标价上浮至 200 万元。</strong></p>\n<p>而且涨价不是芯片单一因素——<strong>存储、HBM、高速交换芯片、光模块全线涨价叠加。</strong></p>\n<h3>4.1 这条数据修正了我们此前的判断</h3>\n<p>模块 20 里我们根据一份待证实材料记录过一条推论：<strong>国产芯片生态跑通后，推理成本会进一步下行、价格底会下移</strong>，并把它列为囤货业务的风险信号。</p>\n<p><strong>这条推论在 2026 年内不成立，方向恰恰相反——硬件在涨价。</strong></p>\n<p>原因也清楚：良率没突破 50%、晶圆产能有硬上限、而需求在 2027 年要冲到 800 万张。<strong>在供不应求且良率未达规模化门槛的阶段，国产替代带来的是涨价而不是降价。</strong></p>\n<p><strong>降价要等到良率过 60%、产能规模化之后</strong>，那是 2027 年往后的事。</p>\n<h3>4.2 对模块 21 自建测算的影响</h3>\n<p><strong>这条对我们是好消息，而且是直接可用的销售弹药：</strong></p>\n<p>自建的固定成本不但没降，反而在涨（8 卡机 150 万 → 200 万）→ <strong>盈亏平衡点上移</strong> → <strong>更多客户不该自建</strong>。</p>\n<p><strong>模块 21 第三节的算例可以直接用这个数字更新。</strong> 一台 200 万元的 8 卡国产服务器，按 3 年折旧就是月摊销约 5.6 万，再加电力、机房、带宽、运维人力，月固定成本轻松超过 10 万元。<strong>盈亏平衡量按模块 21 的公式算，仍然是绝大多数客户达不到的量级。</strong></p>\n<hr />\n<h2>五、生态：差距是真实的</h2>\n<p>参数和产能之外，<strong>软件栈才是企业实际踩坑最多的地方。</strong></p>\n<p><strong>推理吞吐达到同档国际产品的 70%–85%</strong>（取决于批大小与序列长度）。BF16 相对成熟，<strong>INT8 精度需要逐个验证</strong>。</p>\n<p><strong>三大工程风险</strong>（行业调研原文归纳）：</p>\n<p><strong>算子覆盖缺口</strong>——复杂算子仍缺，自定义层可能导致训练中断。昇腾算子覆盖率超 95%，但剩下那 5% 往往就是卡住项目的地方。</p>\n<p><strong>驱动碎片化</strong>——910B 存在多个固件版本，与 CANN 版本构成复杂的兼容矩阵。</p>\n<p><strong>人才短缺</strong>——熟悉 HCCL/MindIE 的工程师<strong>薪资溢价 20%–40%</strong>。</p>\n<p><strong>海光的差异化正在这里</strong>：它以 <strong>CUDA 兼容性最优</strong>弥补性能上的差距（K100 只有 150 TFLOPS，明显低于同期竞品），且现货充足。<strong>对于迁移成本敏感、性能要求不极致的企业客户，海光往往是更务实的选择——这一点销售应该知道。</strong></p>\n<h3>5.1 一处需要指出的矛盾</h3>\n<p>模块 20 记录的那份待证实材料中，有\"国产 AI 芯片的硬件和生态都没问题，唯一有问题的是产能不够\"的判断，并预计一年内会扭转外界认知。</p>\n<p><strong>这与本模块的行业调研数据存在明显出入</strong>——算子覆盖缺口、驱动碎片化、人才溢价 20–40%、推理吞吐只有 70–85%，这些都是具体且可验证的生态问题。</p>\n<p><strong>如何看待这个矛盾</strong>：那份材料的说话人有明确立场（他希望华为把生态做好，且自己有 TileLang 这类自研工具绕开生态依赖），而这份行业调研更贴近普通企业的实际体验。<strong>能自己写编译器的团队和普通企业 IT 部门，面对的根本不是同一个\"生态\"。</strong></p>\n<p><strong>结论：对我们和对客户而言，生态差距是真实存在的，不能引用那条乐观判断。</strong></p>\n<hr />\n<h2>六、我们该怎么做</h2>\n<h3>6.1 对「算力/额度批发分销」业务线</h3>\n<p><strong>囤货的风险方向反转了，必须重新评估。</strong></p>\n<p>模块 04 第四节把\"上游降价导致存货贬值\"列为首要风险。<strong>在当前的国产算力涨价周期里，主要风险变成了\"拿不到货\"。</strong> 这印证了模块 01 第四节早就写过的一句话——<strong>在算力稀缺的窗口期，能稳定拿到额度本身就是一种资源。</strong></p>\n<p><strong>但窗口是有限的，必须写清楚它什么时候关闭：</strong></p>\n<p>关闭信号是<strong>良率突破 60%</strong>（规模化量产分水岭）叠加<strong>2027 年产能释放</strong>。届时价格会转向，囤货逻辑随之反转。</p>\n<p><strong>给决策层的建议</strong>：这条线在 2026 年内有机会，但<strong>必须严格执行模块 04 第四节的资金上限与 60 天周转纪律</strong>，并把\"良率与产能进展\"列入模块 18 第八节的季度观察指标。<strong>不要因为当下缺货就放松周转纪律——涨价周期结束得往往比预期快。</strong></p>\n<h3>6.2 对自建 vs API 测算</h3>\n<p><strong>立即更新模块 21 第三节的参考锚</strong>：国产 8 卡服务器 200 万元/台（2026 年标价）。</p>\n<p><strong>销售可以直接用的一段话</strong>：</p>\n<blockquote>\n<p>\"你们要是打算上国产卡自建，先算一笔账：8 卡机现在标价 200 万，比去年涨了三分之一，而且存储、HBM、光模块还在跟着涨。这还只是硬件——再加机房、电力、带宽，以及最容易被漏掉的运维人力。然后关键问题是利用率：业内实测自建比 API 便宜的临界点在 52% 左右，而多数企业实际只有 30%–50%。\"</p>\n</blockquote>\n<p><strong>这段话的力量在于它不是在推销，是在帮客户算账</strong>（模块 21 第三节的完整方法）。</p>\n<h3>6.3 新机会：信创合规通道</h3>\n<p><strong>这是我从这批数据里看到的最有价值的机会，此前知识库没有覆盖。</strong></p>\n<p>逻辑链条是这样的：</p>\n<p>政务、金融、国企有明确的信创要求，而且要求正在从\"模型国产化\"延伸到\"算力国产化\"（有厂商为进入信创名录不惜切换代工产线并承担延期，说明这个名录的价值很实在）。</p>\n<p>但这些客户<strong>大多不具备自建国产卡集群的能力</strong>——超节点只有华为能做到千卡级稳定交付，产能还紧张；硬件在涨价；生态有算子覆盖和驱动碎片化的坑；懂 HCCL/MindIE 的人还要溢价 20%–40% 才招得到。</p>\n<p><strong>于是出现一个空档：他们既要国产化，又建不起来。</strong></p>\n<p><strong>如果我们能提供「跑在国产算力上的模型 API 通道」并给出可核验的证明材料，就有了一个野生中转站和多数聚合平台都给不了的差异化。</strong> 这与模块 08「合规是准入门槛也是竞争壁垒」的逻辑完全一致——<strong>合规类差异化的特点是别人嫌麻烦不愿做，而一旦做了就是护城河。</strong></p>\n<p><strong>下一步该做的事</strong>：摸清主要上游厂商中，哪些的推理服务实际跑在国产卡上、能否提供书面说明。<strong>这件事我们目前答不上来，而它是可以调研清楚的。</strong></p>\n<h3>6.4 销售场景：客户问「能不能跑国产卡」</h3>\n<p><strong>这个问题背后有三种完全不同的真实需求，答错方向就跑偏了。先分辨再回答。</strong></p>\n<p><strong>问法一：\"我们有信创要求。\"</strong> → 这是合规需求，价格不是重点。需要的是证明材料。<strong>在我们摸清上游情况之前，标准回答是\"这个我需要跟具体厂商确认后给您书面说明\"，不要现场承诺。</strong></p>\n<p><strong>问法二：\"国产卡是不是更便宜？\"</strong> → 反直觉答案：<strong>现在在涨价</strong>，8 卡机一年涨了三分之一。顺势转入模块 21 的自建测算。</p>\n<p><strong>问法三：\"国产卡效果是不是差一截？\"</strong> → 要分训练和推理。<strong>推理侧吞吐达到同档国际产品的 70%–85%，实用性没问题</strong>；训练侧差距大，能训全尺寸大模型的国产芯片只有三款。<strong>我们的业务只涉及推理，所以这个担心在我们的场景里影响有限。</strong></p>\n<h3>6.5 三条销售纪律</h3>\n<p><strong>第一，不承诺我们没核实的通道属性。</strong> 在拿到上游书面说明之前，不得对客户说\"我们的服务跑在国产卡上\"。这类承诺一旦被戳破，损失的是整个合规形象——<strong>而合规形象正是我们最贵的资产。</strong></p>\n<p><strong>第二，不引用模块 20 那条\"国产卡生态没问题\"的乐观判断。</strong> 它来源待证实、说话人有立场，且与行业调研数据冲突。</p>\n<p><strong>第三，参数一律标注为厂商标称值。</strong> 行业调研自己都建议\"以目标模型实测为准\"，我们更不该拿标称参数当承诺。</p>\n<hr />\n<h2>七、观察指标</h2>\n<p>建议并入模块 18 第八节的季度检查，三项：</p>\n<p><strong>先进制程良率</strong>——是否突破 50%（产能释放门槛）、60%（规模化分水岭）。<strong>这是判断价格何时转向的核心指标。</strong></p>\n<p><strong>8 卡服务器标价</strong>——继续上行还是掉头。它是自建成本测算的直接输入，也是囤货窗口是否关闭的信号。</p>\n<p><strong>具备全尺寸大模型训练能力的国产芯片数量</strong>——目前是 3 款，行业预计 2028 年多模态专用芯片批量交付后至少 5 家具备。这一项跑得比预期快，说明生态成熟度在加速。</p>\n<hr />\n<h2>数据来源与复核</h2>\n<ul>\n<li><a href=\"https://hwcomputing.csdn.net/6a630f7b662f9a54cb93d507.html\">2026 年国产 AI 算力卡选型指南：昇腾/海光/寒武纪/沐曦适用场景对比</a>（型号参数）</li>\n<li><a href=\"https://finance.sina.com.cn/stock/stockzmt/2026-07-23/doc-iniivayy9417719.shtml\">国产算力专家交流纪要 - 新浪财经</a>（产能、良率、价格、出货量、代差）</li>\n<li><a href=\"https://www.heibaos.com/post/369563007320073/domestic-ai-computing-ecosystem-2026\">2026 国产 AI 算力生态全景分析：昇腾、寒武纪与软件栈协同成熟度评估 - 黑豹科技</a>（软件栈差距、工程风险）</li>\n<li><a href=\"https://www.ithome.com/0/964/457.htm\">曲速、昇腾、寒武纪海光：2026 国产 AI 算力三条路线代表 - IT之家</a></li>\n<li>内部交叉引用：模块 01（算力稀缺即资源）、模块 04（囤货风控）、模块 08（合规壁垒）、模块 20（待证实的乐观判断，本模块指出其与调研数据的冲突）、模块 21（自建测算）</li>\n</ul>\n<blockquote>\n<p><strong>本模块的参数与产能数据来自公开渠道的行业调研与厂商资料，未经我方实测验证。</strong> 用于内部判断与销售参考，<strong>不得作为对客承诺</strong>。</p>\n</blockquote>", "plain": " 模块 22 · 国产算力卡现状与对策\n\n 本模块解决的问题：国产卡到底能不能用、贵不贵、对我们三条业务线各意味着什么。\n 使用者：决策层（批发业务决策）、销售（信创客户）、售前（自建测算）。\n 数据采集日：20260727。硬件参数与产能数据变动极快，建议每季度复核。\n\n\n\n 一、为什么这件事我们必须懂\n\n国产算力卡看起来是硬件话题，跟我们卖 token 隔了两层。但它同时影响我们三条业务线，而且方向不都一样：\n\n对算力/额度批发分销（模块 02 第三条）：国产卡的产能与价格直接决定这条线是机会还是陷阱。\n\n对自建 vs API 的测算（模块 21 第三节）：硬件价格是自建成本的第一大项，它涨还是跌，直接改变我们给客户算的那笔账。\n\n对上游选择与合规（模块 03、模块 08）：政务、金融、国企的信创要求正在从\"模型国产化\"延伸到\"算力也要国产化\"。这可能是一个我们还没利用起来的差异化机会。\n\n还有一层更直接的原因：客户会问。 一个正在做私有化方案的企业客户，几乎必然会问\"能不能跑在国产卡上\"。答不上来，专业形象就没了。\n\n\n\n 二、现状：四家主力的能力盘点\n\n以下为 2026 年 7 月公开渠道采集的参数，厂商标称值，非实测。\n\n 厂商  型号  FP16  显存  集群规模  定位与状态 \n\n 华为昇腾  910B  320 TFLOPS  64GB HBM2e / 1.6TB/s  4096 卡  当前训练主力 \n  950  512 TFLOPS（FP8 1 PFLOPS）  256GB HBM3e / 4TB/s  8192 卡  2026 Q4 交付 \n 海光  K100  150 TFLOPS  64GB HBM2e  —  CUDA 兼容性最优，现货充足 \n  K200  256 TFLOPS  128GB HBM3e  600GB/s 互联  2026 Q3 交付 \n 寒武纪  思元 590  256 TFLOPS  64GB HBM3e  512 卡  推理吞吐 6500 tokens/s \n  思元 370  —  —  边缘 75W  成本最低 \n 沐曦  曦云 C500  256 TFLOPS  128GB HBM3e  —  AI+渲染混合，交付快（2–3 周） \n\n⚠️ 不要只看纸面算力。 行业调研明确建议：选型应\"以目标模型实测\"为准，而非比较标称算力，并把 CANN 版本锁定、权重可迁移性写进采购清单。这条建议我们应当原样转给做自建评估的客户——这是很容易赢得信任的一句话。\n\n 2.1 训练与推理必须分开看\n\n这是本模块最重要的一个区分，也是最常被混淆的地方。\n\n训练侧的门槛极高。 目前能独立完成全尺寸大模型训练的国产芯片只有三款：华为昇腾（训练 DeepSeek V4）、百度昆仑芯（训练文心）、阿里平头哥（支持通义千问基础版本）。其余所有国产芯片只能稳定支撑 70B 及以下的中小参数模型训练。\n\n推理侧的门槛低得多，国产卡已经具备实用性。\n\n对我们的意义：我们的业务只涉及推理，所以国产卡对我们的相关性远高于对训练方的相关性。客户拿\"国产卡训不动大模型\"来质疑时，要能指出这是训练侧的问题，不是推理侧的。\n\n 2.2 代差：两级台阶\n\n行业调研给出的判断相当直接：英伟达整体领先华为昇腾 1–1.5 年，华为又领先昆仑、平头哥、寒武纪、海光这个第二梯队 1 年以上。\n\n差距最大的是超节点（大规模集群互联）：华为是国内唯一具备千卡级稳定交付能力的厂商；百度当前稳定量产 64 卡集群，256 卡因供应链延期；阿里 128 卡超节点已上线，256/512 卡方案要到 2026 年底至 2027 年初。\n\n这个差距对我们的直接含义：客户如果要自建一个能跑大模型的国产卡集群，除了华为几乎没有第二个现实选项——而华为的产能又是有限的（见下一节）。这实质上堵死了大多数企业\"全国产化自建\"的路。\n\n\n\n 三、产能：真正的瓶颈\n\n卡不是设计出来的，是造出来的。 这一节的数据比参数表更能决定实际格局。\n\n晶圆产能有硬上限：中芯国际年晶圆出货上限不超过 300 万片。2026 年 10 月四季度完成设备扩产后，全年晶圆产能在去年基础上提升 50% 的确定性较强，但要翻倍难度极大。\n\n良率是第一道坎：国产先进制程（N+2/N+3）量产良率仅 30%–40%。行业共识是\"良率突破 50% 是产能释放的第一道门槛，60% 是规模化量产的分水岭\"——也就是说目前还没跨过第一道门槛。\n\n代工切换带来延期：有厂商因从三星 7nm 切换到中芯国产产线（为进入信创名录），产品发布从 5 月推迟到 7 月。信创合规与产能供应之间存在真实的取舍。\n\n 3.1 出货量与市场份额\n\n2026 年预期出货：\n\n 厂商  预期出货量 \n\n 华为昇腾  130 多万张 \n 阿里平头哥  30–50 万张 \n 百度昆仑  约 25 万张 \n 寒武纪  约 20 万张 \n 海光  20 万张，年底可冲至 40 万张以上 \n\n英伟达在国内市场占比已跌破 50%，全年预计仅占 30%–40% 区间。\n\n2027 年行业需求总量预计冲到 800 万张，各厂商出货规模同步上浮 20%–30%，份额格局基本维持当前分层。\n\n\n\n 四、价格：一个反直觉的事实\n\n这是本模块最需要被记住的一条，因为它直接推翻了我们此前的一个推论。\n\n搭载国产芯片的 8 卡服务器：2025 年均价 150 万元/台，2026 年标价上浮至 200 万元。\n\n而且涨价不是芯片单一因素——存储、HBM、高速交换芯片、光模块全线涨价叠加。\n\n 4.1 这条数据修正了我们此前的判断\n\n模块 20 里我们根据一份待证实材料记录过一条推论：国产芯片生态跑通后，推理成本会进一步下行、价格底会下移，并把它列为囤货业务的风险信号。\n\n这条推论在 2026 年内不成立，方向恰恰相反——硬件在涨价。\n\n原因也清楚：良率没突破 50%、晶圆产能有硬上限、而需求在 2027 年要冲到 800 万张。在供不应求且良率未达规模化门槛的阶段，国产替代带来的是涨价而不是降价。\n\n降价要等到良率过 60%、产能规模化之后，那是 2027 年往后的事。\n\n 4.2 对模块 21 自建测算的影响\n\n这条对我们是好消息，而且是直接可用的销售弹药：\n\n自建的固定成本不但没降，反而在涨（8 卡机 150 万 → 200 万）→ 盈亏平衡点上移 → 更多客户不该自建。\n\n模块 21 第三节的算例可以直接用这个数字更新。 一台 200 万元的 8 卡国产服务器，按 3 年折旧就是月摊销约 5.6 万，再加电力、机房、带宽、运维人力，月固定成本轻松超过 10 万元。盈亏平衡量按模块 21 的公式算，仍然是绝大多数客户达不到的量级。\n\n\n\n 五、生态：差距是真实的\n\n参数和产能之外，软件栈才是企业实际踩坑最多的地方。\n\n推理吞吐达到同档国际产品的 70%–85%（取决于批大小与序列长度）。BF16 相对成熟，INT8 精度需要逐个验证。\n\n三大工程风险（行业调研原文归纳）：\n\n算子覆盖缺口——复杂算子仍缺，自定义层可能导致训练中断。昇腾算子覆盖率超 95%，但剩下那 5% 往往就是卡住项目的地方。\n\n驱动碎片化——910B 存在多个固件版本，与 CANN 版本构成复杂的兼容矩阵。\n\n人才短缺——熟悉 HCCL/MindIE 的工程师薪资溢价 20%–40%。\n\n海光的差异化正在这里：它以 CUDA 兼容性最优弥补性能上的差距（K100 只有 150 TFLOPS，明显低于同期竞品），且现货充足。对于迁移成本敏感、性能要求不极致的企业客户，海光往往是更务实的选择——这一点销售应该知道。\n\n 5.1 一处需要指出的矛盾\n\n模块 20 记录的那份待证实材料中，有\"国产 AI 芯片的硬件和生态都没问题，唯一有问题的是产能不够\"的判断，并预计一年内会扭转外界认知。\n\n这与本模块的行业调研数据存在明显出入——算子覆盖缺口、驱动碎片化、人才溢价 20–40%、推理吞吐只有 70–85%，这些都是具体且可验证的生态问题。\n\n如何看待这个矛盾：那份材料的说话人有明确立场（他希望华为把生态做好，且自己有 TileLang 这类自研工具绕开生态依赖），而这份行业调研更贴近普通企业的实际体验。能自己写编译器的团队和普通企业 IT 部门，面对的根本不是同一个\"生态\"。\n\n结论：对我们和对客户而言，生态差距是真实存在的，不能引用那条乐观判断。\n\n\n\n 六、我们该怎么做\n\n 6.1 对「算力/额度批发分销」业务线\n\n囤货的风险方向反转了，必须重新评估。\n\n模块 04 第四节把\"上游降价导致存货贬值\"列为首要风险。在当前的国产算力涨价周期里，主要风险变成了\"拿不到货\"。 这印证了模块 01 第四节早就写过的一句话——在算力稀缺的窗口期，能稳定拿到额度本身就是一种资源。\n\n但窗口是有限的，必须写清楚它什么时候关闭：\n\n关闭信号是良率突破 60%（规模化量产分水岭）叠加2027 年产能释放。届时价格会转向，囤货逻辑随之反转。\n\n给决策层的建议：这条线在 2026 年内有机会，但必须严格执行模块 04 第四节的资金上限与 60 天周转纪律，并把\"良率与产能进展\"列入模块 18 第八节的季度观察指标。不要因为当下缺货就放松周转纪律——涨价周期结束得往往比预期快。\n\n 6.2 对自建 vs API 测算\n\n立即更新模块 21 第三节的参考锚：国产 8 卡服务器 200 万元/台（2026 年标价）。\n\n销售可以直接用的一段话：\n\n \"你们要是打算上国产卡自建，先算一笔账：8 卡机现在标价 200 万，比去年涨了三分之一，而且存储、HBM、光模块还在跟着涨。这还只是硬件——再加机房、电力、带宽，以及最容易被漏掉的运维人力。然后关键问题是利用率：业内实测自建比 API 便宜的临界点在 52% 左右，而多数企业实际只有 30%–50%。\"\n\n这段话的力量在于它不是在推销，是在帮客户算账（模块 21 第三节的完整方法）。\n\n 6.3 新机会：信创合规通道\n\n这是我从这批数据里看到的最有价值的机会，此前知识库没有覆盖。\n\n逻辑链条是这样的：\n\n政务、金融、国企有明确的信创要求，而且要求正在从\"模型国产化\"延伸到\"算力国产化\"（有厂商为进入信创名录不惜切换代工产线并承担延期，说明这个名录的价值很实在）。\n\n但这些客户大多不具备自建国产卡集群的能力——超节点只有华为能做到千卡级稳定交付，产能还紧张；硬件在涨价；生态有算子覆盖和驱动碎片化的坑；懂 HCCL/MindIE 的人还要溢价 20%–40% 才招得到。\n\n于是出现一个空档：他们既要国产化，又建不起来。\n\n如果我们能提供「跑在国产算力上的模型 API 通道」并给出可核验的证明材料，就有了一个野生中转站和多数聚合平台都给不了的差异化。 这与模块 08「合规是准入门槛也是竞争壁垒」的逻辑完全一致——合规类差异化的特点是别人嫌麻烦不愿做，而一旦做了就是护城河。\n\n下一步该做的事：摸清主要上游厂商中，哪些的推理服务实际跑在国产卡上、能否提供书面说明。这件事我们目前答不上来，而它是可以调研清楚的。\n\n 6.4 销售场景：客户问「能不能跑国产卡」\n\n这个问题背后有三种完全不同的真实需求，答错方向就跑偏了。先分辨再回答。\n\n问法一：\"我们有信创要求。\" → 这是合规需求，价格不是重点。需要的是证明材料。在我们摸清上游情况之前，标准回答是\"这个我需要跟具体厂商确认后给您书面说明\"，不要现场承诺。\n\n问法二：\"国产卡是不是更便宜？\" → 反直觉答案：现在在涨价，8 卡机一年涨了三分之一。顺势转入模块 21 的自建测算。\n\n问法三：\"国产卡效果是不是差一截？\" → 要分训练和推理。推理侧吞吐达到同档国际产品的 70%–85%，实用性没问题；训练侧差距大，能训全尺寸大模型的国产芯片只有三款。我们的业务只涉及推理，所以这个担心在我们的场景里影响有限。\n\n 6.5 三条销售纪律\n\n第一，不承诺我们没核实的通道属性。 在拿到上游书面说明之前，不得对客户说\"我们的服务跑在国产卡上\"。这类承诺一旦被戳破，损失的是整个合规形象——而合规形象正是我们最贵的资产。\n\n第二，不引用模块 20 那条\"国产卡生态没问题\"的乐观判断。 它来源待证实、说话人有立场，且与行业调研数据冲突。\n\n第三，参数一律标注为厂商标称值。 行业调研自己都建议\"以目标模型实测为准\"，我们更不该拿标称参数当承诺。\n\n\n\n 七、观察指标\n\n建议并入模块 18 第八节的季度检查，三项：\n\n先进制程良率——是否突破 50%（产能释放门槛）、60%（规模化分水岭）。这是判断价格何时转向的核心指标。\n\n8 卡服务器标价——继续上行还是掉头。它是自建成本测算的直接输入，也是囤货窗口是否关闭的信号。\n\n具备全尺寸大模型训练能力的国产芯片数量——目前是 3 款，行业预计 2028 年多模态专用芯片批量交付后至少 5 家具备。这一项跑得比预期快，说明生态成熟度在加速。\n\n\n\n 数据来源与复核\n\n [2026 年国产 AI 算力卡选型指南：昇腾/海光/寒武纪/沐曦适用场景对比](https://hwcomputing.csdn.net/6a630f7b662f9a54cb93d507.html)（型号参数）\n [国产算力专家交流纪要  新浪财经](https://finance.sina.com.cn/stock/stockzmt/20260723/dociniivayy9417719.shtml)（产能、良率、价格、出货量、代差）\n [2026 国产 AI 算力生态全景分析：昇腾、寒武纪与软件栈协同成熟度评估  黑豹科技](https://www.heibaos.com/post/369563007320073/domesticaicomputingecosystem2026)（软件栈差距、工程风险）\n [曲速、昇腾、寒武纪海光：2026 国产 AI 算力三条路线代表  IT之家](https://www.ithome.com/0/964/457.htm)\n 内部交叉引用：模块 01（算力稀缺即资源）、模块 04（囤货风控）、模块 08（合规壁垒）、模块 20（待证实的乐观判断，本模块指出其与调研数据的冲突）、模块 21（自建测算）\n\n 本模块的参数与产能数据来自公开渠道的行业调研与厂商资料，未经我方实测验证。 用于内部判断与销售参考，不得作为对客承诺。\n"}, {"id": "23-天数智芯档案", "code": "23", "title": "模块 23 · 天数智芯档案", "short": "天数智芯档案", "subs": ["一、一句话定位", "二、起源与历史：一段值得警惕的管理层变迁", "三、技术路线", "四、产品线与路线图", "五、大模型适配", "六、经营数据（招股书口径，可核验）", "七、资本状态", "八、政策支持与客户情况", "九、风险评估", "十、对我们意味着什么", "数据来源"], "html": "<h1>模块 23 · 天数智芯档案</h1>\n<blockquote>\n<p>单家厂商深度档案。上海天数智芯半导体股份有限公司（Iluvatar CoreX），港交所代码 9903。\n使用者：决策层（上游与算力合作判断）、销售（信创客户答疑）、售前。\n数据采集日：2026-07-27。<strong>芯片行业数据变动快，建议每季度复核。</strong></p>\n</blockquote>\n<hr />\n<h2>一、一句话定位</h2>\n<p><strong>国产通用 GPU（GPGPU）路线的头部之一，2026 年 1 月刚在港交所上市，是国产 GPGPU 阵营里少数财务公开可查的公司。</strong></p>\n<p>在模块 22 的分层里，它属于\"第二梯队\"——落后华为昇腾一年以上。但它有一个其他第二梯队厂商没有的优势：<strong>上市公司身份带来的财务透明度</strong>。这对我们判断\"这家公司会不会突然倒掉\"极其重要。</p>\n<hr />\n<h2>二、起源与历史：一段值得警惕的管理层变迁</h2>\n<p><strong>2015 年成立于上海。</strong> 这段历史必须完整记录，因为它直接关系到风险判断。</p>\n<p><strong>第一阶段 · 李云鹏（创始人）</strong>：前甲骨文高管，提出过\"更愿意成为像谷歌那样有系统能力的公司\"的愿景。2019 年主导推出首款产品——边缘端 AI 推理芯片 Iluvatar CoreX I。<strong>但产品发布不足一年后即退出管理层。</strong></p>\n<p><strong>第二阶段 · 刁石京（第二任董事长）</strong>：曾任工业和信息化部电子信息司司长。接任后推动公司<strong>从边缘端转向通用 GPU 赛道</strong>，2021 年推出训练系列\"天垓 Gen 1\"。<strong>2022 年因个人原因离职。</strong></p>\n<p><strong>第三阶段 · 盖鲁江（现任）</strong>：财务、投资背景出身。</p>\n<p><strong>十年内创始人出走、两次换帅、战略从边缘推理转向通用 GPU 训练、之后又面临训练与推理重心的再次调整。</strong></p>\n<p><strong>这段历史该怎么读？</strong> 有媒体用\"战略反复摇摆\"来概括，这个批评是成立的。但需要给一个平衡的视角：<strong>2015 年到 2026 年恰好是 AI 芯片赛道路线剧烈变化的十年</strong>，从边缘推理到训练卡再到大模型推理，赛道本身在变，跟随调整不完全等同于摇摆。<strong>真正值得警惕的不是转向本身，而是转向的代价——每次转向都意味着前期投入的部分沉没，以及生态积累的中断。</strong></p>\n<hr />\n<h2>三、技术路线</h2>\n<p><strong>GPGPU 路线</strong>，即通用 GPU，与英伟达同赛道。核心策略是<strong>自研软件栈实现与主流 GPU 编程生态的兼容性</strong>，采用\"一次部署，持续适配\"的方式支持主流 AI 框架。</p>\n<p><strong>这条路线的取舍很清楚</strong>：兼容主流生态意味着客户迁移成本低（这是相对于 TPU 等专用架构的最大优势），但也意味着要在英伟达最擅长的战场上正面竞争，且永远在追赶 CUDA 的生态深度。</p>\n<p>对照模块 22 的行业判断——海光以\"CUDA 兼容性最优\"作为差异化，天数智芯走的是类似逻辑：<strong>用兼容性换迁移成本，而不是用绝对性能取胜。</strong></p>\n<hr />\n<h2>四、产品线与路线图</h2>\n<table>\n<thead>\n<tr>\n<th>系列</th>\n<th>定位</th>\n<th>型号与时间</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>天垓</strong></td>\n<td>训练</td>\n<td>天垓 100（2021）、Gen2（2023 Q4）、Gen3（2024 Q3）、<strong>Gen4（预计 2026 Q2）</strong>、Gen5（预计 2027 Q2）</td>\n</tr>\n<tr>\n<td><strong>智铠</strong></td>\n<td>推理</td>\n<td>智铠 Gen1 / Gen1X（2022 年 12 月）、Gen2（预计 2025 Q4）、<strong>Gen3u（预计 2026 Q2）</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>节奏大致是训练与推理各自约两年一代</strong>，2026 年二季度是两条线同时更新的节点。</p>\n<p><strong>注意</strong>：路线图中标注\"预计\"的型号能否按期交付，需要复核。模块 22 记录过行业普遍现象——因代工产线切换导致产品延期是常态。</p>\n<hr />\n<h2>五、大模型适配</h2>\n<p><strong>已参与 DeepSeek-V4 的国产化适配</strong>，与华为昇腾 950PR、寒武纪等一同被列入主流国产 AI 芯片的全栈深度适配名单，官方口径称实现了\"从 CUDA 到国产异构计算架构的彻底切换\"，整体\"推理效率提升 3 倍以上\"。</p>\n<p><strong>但必须诚实说明一个信息缺口</strong>：公开渠道<strong>查不到</strong>天数智芯的具体适配型号清单、性能对标数据、适配开发周期与技术难点。目前能拿到的都是概览性宣传，<strong>没有可核验的实测对比</strong>。</p>\n<p><strong>这个缺口本身就是一条重要信息</strong>：</p>\n<p><strong>对销售的含义</strong>——客户如果问\"天数智芯跑 DeepSeek 效果怎么样\"，正确答案是\"官方在适配名单里，但公开的实测数据很少，建议以目标模型实测为准\"。<strong>这与模块 22 引用的行业选型建议一致，也比含糊地说\"没问题\"专业得多。</strong></p>\n<p><strong>\"在适配名单里\"和\"跑得好\"是两回事。</strong> 适配意味着能跑通，不意味着性能、稳定性、算子覆盖达到生产标准。模块 22 记录的行业实情是：国产芯片推理吞吐达同档国际产品的 70%–85%，复杂算子仍缺。</p>\n<hr />\n<h2>六、经营数据（招股书口径，可核验）</h2>\n<p><strong>这是天数智芯相对其他非上市国产芯片厂商最大的价值——数据是公开且经过审计的。</strong></p>\n<h3>6.1 营收与毛利</h3>\n<table>\n<thead>\n<tr>\n<th>年份</th>\n<th>营收</th>\n<th>综合毛利率</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2022</td>\n<td>1.89 亿元</td>\n<td>59.4%</td>\n</tr>\n<tr>\n<td>2023</td>\n<td>2.89 亿元</td>\n<td>49.5%</td>\n</tr>\n<tr>\n<td>2024</td>\n<td><strong>5.40 亿元</strong></td>\n<td>49.1%</td>\n</tr>\n<tr>\n<td>2025 H1</td>\n<td>3.24 亿元</td>\n<td>50.1%</td>\n</tr>\n</tbody>\n</table>\n<p>2022–2024 年复合年增长率 <strong>68.8%</strong>。</p>\n<p><strong>一个必须注意的结构性变化</strong>：2024 年训练类 GPU 收入 2.69 亿元、占比约 50%、<strong>毛利率 60.2%</strong>；而推理类 GPU 占比约 50%、<strong>2025 上半年毛利率仅 32%</strong>。</p>\n<p><strong>推理侧毛利率的塌陷是这份财报里最值得关注的信号。</strong> 它说明推理卡市场的价格竞争已经相当激烈——而推理恰恰是量最大的市场。<strong>这与模块 22 记录的\"硬件整体在涨价\"看似矛盾，实则不然</strong>：整机涨价源于存储、HBM、光模块的成本推动，而芯片厂商之间的竞争把毛利吃掉了。<strong>成本在涨、售价涨不动、毛利被两头挤压。</strong></p>\n<h3>6.2 出货量与市场份额</h3>\n<table>\n<thead>\n<tr>\n<th>时间</th>\n<th>出货量</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2022</td>\n<td>7,800 片</td>\n</tr>\n<tr>\n<td>2023</td>\n<td>16,800 片</td>\n</tr>\n<tr>\n<td>2025 H1</td>\n<td>15,700 片</td>\n</tr>\n<tr>\n<td><strong>截至 2025-06-30 累计</strong></td>\n<td><strong>超 52,000 片</strong></td>\n</tr>\n</tbody>\n</table>\n<p><strong>市场份额</strong>：中国通用 GPU 整体市场 <strong>0.3%</strong>，国产通用 GPU 市场 <strong>9.8%</strong>。</p>\n<p><strong>这两个数字的对比极具说服力</strong>：在国产阵营里拿到近一成份额，放到整个中国市场只有 0.3%。<strong>国产替代的空间有多大、进度有多早，这一组数字比任何论述都清楚。</strong></p>\n<h3>6.3 客户结构（健康度的关键指标）</h3>\n<p><strong>客户数量</strong>：2022 年 22 家 → 2024 年 <strong>181 家</strong>。</p>\n<p><strong>前五大客户占比</strong>：94.2% → 73.3% → 73.4% → <strong>38.6%</strong>。</p>\n<p><strong>这是整份财报里最健康的一组数据。</strong> 客户集中度从 94% 降到 39%，意味着它正在摆脱对少数几个大客户（很可能是政府背景项目）的依赖，走向真正的市场化销售。</p>\n<p><strong>对照我们自己的模块 05 第二节</strong>——我们给自己定的红线是单一客户收入占比不超过 15%、前五大不宜过高。<strong>用同一把尺子量，天数智芯的客户结构在快速改善，这是判断其可持续性的正面信号。</strong></p>\n<h3>6.4 研发投入：仍在重度烧钱</h3>\n<table>\n<thead>\n<tr>\n<th>年份</th>\n<th>研发开支</th>\n<th>占营收比</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2022</td>\n<td>4.566 亿元</td>\n<td><strong>241.1%</strong></td>\n</tr>\n<tr>\n<td>2023</td>\n<td>6.159 亿元</td>\n<td><strong>213.1%</strong></td>\n</tr>\n<tr>\n<td>2024</td>\n<td>7.728 亿元</td>\n<td><strong>143.2%</strong></td>\n</tr>\n</tbody>\n</table>\n<p>研发团队 484 人，占员工总数 <strong>70.6%</strong>。</p>\n<p><strong>研发投入长期超过营收，说明公司仍处在需要持续外部输血的阶段。</strong> 但趋势是好的——占比从 241% 降到 143%，说明营收增速快于研发投入增速。<strong>若这个收敛趋势持续，大约还需要两到三年才能接近收支平衡。</strong></p>\n<hr />\n<h2>七、资本状态</h2>\n<p><strong>上市</strong>：2026 年 1 月 8 日在港交所挂牌，代码 <strong>9903</strong>，发行价每股 <strong>144.6 港元</strong>，募资约 <strong>35 亿港元</strong>，IPO 市值约 <strong>354 亿港元</strong>。IPO 认购火爆。</p>\n<p><strong>注意口径差异</strong>：部分报道提到\"狂揽 70 亿港元\"，与\"募资约 35 亿港元\"不一致，可能是含超额配售或引述口径不同。<strong>引用时以招股书与交易所公告为准。</strong></p>\n<p><strong>IPO 前融资</strong>：累计募资超 55 亿元，D+ 轮估值 <strong>120 亿元</strong>，投资方包括红杉中国、元禾基金等。</p>\n<p><strong>股权结构</strong>：第一大股东为上海数麒，持股 <strong>23.61%</strong>，代表多个特殊目的实体行使表决权。招股书自述所有权\"一直由雇员通过多个特殊目的实体以及多元化的被动财务投资者持有\"——<strong>即无单一强控股股东，也无国资绝对控股。</strong></p>\n<p><strong>估值对比（值得注意）</strong>：IPO 前估值 120 亿元，<strong>明显低于摩尔线程、沐曦股份等竞品 200 亿元以上的水平</strong>。这个折价反映了资本市场对其战略摇摆历史与竞争位置的评价。</p>\n<hr />\n<h2>八、政策支持与客户情况</h2>\n<p><strong>政策层面</strong>：公开报道中天数智芯被描述为\"领跑国内通用 GPU 赛道\"，参与 DeepSeek 国产化适配的官方名单。<strong>但相比中昊芯英（模块 24），其获得的具名政策奖项与专项支持在公开信息中较少。</strong></p>\n<p><strong>客户情况</strong>：181 家客户，结构分散化明显。公开信息中未见完整客户名单。<strong>从\"通用 GPU 存量替代主战场\"的定位判断，主力应为智算中心、政企与运营商项目。</strong></p>\n<p><strong>价格</strong>：<strong>公开渠道查不到天数智芯产品的官方售价。</strong> 这在国产 AI 芯片行业是普遍现象——定价随项目、批量、配套服务一事一议。可用的替代锚是模块 22 记录的\"国产 8 卡服务器 2026 年标价约 200 万元/台\"这一整机价格水平。</p>\n<hr />\n<h2>九、风险评估</h2>\n<p><strong>管理层稳定性</strong>：创始人出走、两次换帅，是这家公司最显著的历史包袱。<strong>上市后管理层能否稳定，是需要持续观察的第一项。</strong></p>\n<p><strong>推理侧毛利塌陷</strong>：从 56.6% 降到 32%，而推理是量最大的市场。<strong>若持续下行，营收增长将无法转化为利润。</strong></p>\n<p><strong>仍在烧钱</strong>：研发占营收 143%，尚未自我造血。上市募资缓解了短期压力，但不解决结构问题。</p>\n<p><strong>竞争位置</strong>：估值折价于摩尔线程、沐曦；在模块 22 的代差判断中属于落后昇腾一年以上的第二梯队。</p>\n<p><strong>生态深度</strong>：走兼容路线意味着永远在追赶 CUDA，且模块 22 记录的算子覆盖、驱动碎片化问题同样适用。</p>\n<hr />\n<h2>十、对我们意味着什么</h2>\n<p><strong>先说清楚一件事：我们不采购芯片，我们采购的是 API。</strong> 所以天数智芯对我们的意义不是\"要不要买它的卡\"，而是三个间接但真实的层面。</p>\n<p><strong>第一，它是「信创合规通道」这条机会线的候选支点（模块 22 第 6.3 节）。</strong>\n我们识别出的机会是：政务、金融、国企既要算力国产化，又建不起来。要把这个机会做实，前提是搞清楚<strong>哪些上游厂商的推理服务实际跑在国产卡上</strong>。天数智芯已进入 DeepSeek-V4 适配名单，是这条链路上值得优先摸排的对象之一。<strong>下一步动作：了解是否有 MaaS 平台或智算中心基于天数智芯提供对外 API 服务，能否出具书面说明。</strong></p>\n<p><strong>第二，它的财务透明度让它成为最适合被引用的国产芯片样本。</strong>\n在跟客户讨论国产算力时，<strong>引用一家上市公司的招股书数据，远比引用行业传闻可信。</strong> 尤其是\"国产 GPGPU 市场份额 9.8%，但中国通用 GPU 整体市场只占 0.3%\"这组对比——它一句话说清了国产替代的现状与空间，且数据可核验。</p>\n<p><strong>第三，它的推理毛利率塌陷是一条重要的行业信号。</strong>\n推理卡毛利从 56.6% 掉到 32%，说明<strong>推理侧硬件的价格竞争已经很激烈</strong>。这对我们是好消息也是提醒：好消息是长期看推理算力成本会被竞争压下来（尽管模块 22 指出 2026 年内整机仍在涨价）；提醒是<strong>硬件厂商的日子不好过，靠卖硬件赚钱越来越难——这与我们所在的转售层面临的处境高度相似</strong>（模块 18 第四节）。<strong>产业链上每一个\"只提供标准品\"的环节，毛利都在被挤压。</strong></p>\n<p><strong>销售纪律</strong>：在拿到书面材料前，<strong>不得对客户宣称\"我们的服务跑在天数智芯上\"</strong>（模块 22 第 6.5 节的纪律同样适用）。可以说的是\"天数智芯已进入 DeepSeek-V4 官方适配名单\"，这是可核验的事实。</p>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://news.qq.com/rain/a/20251222A03BNV00\">天数智芯赴港 IPO：累计出货 5.2 万片，拿下 9.8% 国产 GPGPU 市场 - 腾讯新闻</a>（出货、份额、营收、毛利、客户、研发）</li>\n<li><a href=\"https://finance.sina.cn/stock/jdts/2026-01-05/detail-inhfhavn6752098.d.html\">创始人出走、两次换帅、战略反复摇摆，天数智芯终于要上市了 - 新浪财经</a>（管理层变迁、股权、产品路线图、估值对比）</li>\n<li><a href=\"https://www.stcn.com/article/detail/3578117.html\">天数智芯正式登陆港交所，进入国产 GPU 存量替代主战场 - 证券时报</a></li>\n<li><a href=\"https://cloud.tencent.com/developer/article/2660020\">DeepSeek-V4 国产化落地：主流国产 AI 芯片全栈深度适配 - 腾讯云开发者社区</a>（适配名单，<strong>内容为概览性宣传，缺乏实测细节</strong>）</li>\n<li>内部交叉引用：模块 22（国产算力大盘、代差、生态问题、信创机会）、模块 05（客户集中度标准）、模块 18（标准品环节毛利被挤压）</li>\n</ul>\n<blockquote>\n<p>本模块数据来自公开招股书与媒体报道，<strong>未经我方实测验证，不得作为对客承诺</strong>。</p>\n</blockquote>", "plain": " 模块 23 · 天数智芯档案\n\n 单家厂商深度档案。上海天数智芯半导体股份有限公司（Iluvatar CoreX），港交所代码 9903。\n 使用者：决策层（上游与算力合作判断）、销售（信创客户答疑）、售前。\n 数据采集日：20260727。芯片行业数据变动快，建议每季度复核。\n\n\n\n 一、一句话定位\n\n国产通用 GPU（GPGPU）路线的头部之一，2026 年 1 月刚在港交所上市，是国产 GPGPU 阵营里少数财务公开可查的公司。\n\n在模块 22 的分层里，它属于\"第二梯队\"——落后华为昇腾一年以上。但它有一个其他第二梯队厂商没有的优势：上市公司身份带来的财务透明度。这对我们判断\"这家公司会不会突然倒掉\"极其重要。\n\n\n\n 二、起源与历史：一段值得警惕的管理层变迁\n\n2015 年成立于上海。 这段历史必须完整记录，因为它直接关系到风险判断。\n\n第一阶段 · 李云鹏（创始人）：前甲骨文高管，提出过\"更愿意成为像谷歌那样有系统能力的公司\"的愿景。2019 年主导推出首款产品——边缘端 AI 推理芯片 Iluvatar CoreX I。但产品发布不足一年后即退出管理层。\n\n第二阶段 · 刁石京（第二任董事长）：曾任工业和信息化部电子信息司司长。接任后推动公司从边缘端转向通用 GPU 赛道，2021 年推出训练系列\"天垓 Gen 1\"。2022 年因个人原因离职。\n\n第三阶段 · 盖鲁江（现任）：财务、投资背景出身。\n\n十年内创始人出走、两次换帅、战略从边缘推理转向通用 GPU 训练、之后又面临训练与推理重心的再次调整。\n\n这段历史该怎么读？ 有媒体用\"战略反复摇摆\"来概括，这个批评是成立的。但需要给一个平衡的视角：2015 年到 2026 年恰好是 AI 芯片赛道路线剧烈变化的十年，从边缘推理到训练卡再到大模型推理，赛道本身在变，跟随调整不完全等同于摇摆。真正值得警惕的不是转向本身，而是转向的代价——每次转向都意味着前期投入的部分沉没，以及生态积累的中断。\n\n\n\n 三、技术路线\n\nGPGPU 路线，即通用 GPU，与英伟达同赛道。核心策略是自研软件栈实现与主流 GPU 编程生态的兼容性，采用\"一次部署，持续适配\"的方式支持主流 AI 框架。\n\n这条路线的取舍很清楚：兼容主流生态意味着客户迁移成本低（这是相对于 TPU 等专用架构的最大优势），但也意味着要在英伟达最擅长的战场上正面竞争，且永远在追赶 CUDA 的生态深度。\n\n对照模块 22 的行业判断——海光以\"CUDA 兼容性最优\"作为差异化，天数智芯走的是类似逻辑：用兼容性换迁移成本，而不是用绝对性能取胜。\n\n\n\n 四、产品线与路线图\n\n 系列  定位  型号与时间 \n\n 天垓  训练  天垓 100（2021）、Gen2（2023 Q4）、Gen3（2024 Q3）、Gen4（预计 2026 Q2）、Gen5（预计 2027 Q2） \n 智铠  推理  智铠 Gen1 / Gen1X（2022 年 12 月）、Gen2（预计 2025 Q4）、Gen3u（预计 2026 Q2） \n\n节奏大致是训练与推理各自约两年一代，2026 年二季度是两条线同时更新的节点。\n\n注意：路线图中标注\"预计\"的型号能否按期交付，需要复核。模块 22 记录过行业普遍现象——因代工产线切换导致产品延期是常态。\n\n\n\n 五、大模型适配\n\n已参与 DeepSeekV4 的国产化适配，与华为昇腾 950PR、寒武纪等一同被列入主流国产 AI 芯片的全栈深度适配名单，官方口径称实现了\"从 CUDA 到国产异构计算架构的彻底切换\"，整体\"推理效率提升 3 倍以上\"。\n\n但必须诚实说明一个信息缺口：公开渠道查不到天数智芯的具体适配型号清单、性能对标数据、适配开发周期与技术难点。目前能拿到的都是概览性宣传，没有可核验的实测对比。\n\n这个缺口本身就是一条重要信息：\n\n对销售的含义——客户如果问\"天数智芯跑 DeepSeek 效果怎么样\"，正确答案是\"官方在适配名单里，但公开的实测数据很少，建议以目标模型实测为准\"。这与模块 22 引用的行业选型建议一致，也比含糊地说\"没问题\"专业得多。\n\n\"在适配名单里\"和\"跑得好\"是两回事。 适配意味着能跑通，不意味着性能、稳定性、算子覆盖达到生产标准。模块 22 记录的行业实情是：国产芯片推理吞吐达同档国际产品的 70%–85%，复杂算子仍缺。\n\n\n\n 六、经营数据（招股书口径，可核验）\n\n这是天数智芯相对其他非上市国产芯片厂商最大的价值——数据是公开且经过审计的。\n\n 6.1 营收与毛利\n\n 年份  营收  综合毛利率 \n\n 2022  1.89 亿元  59.4% \n 2023  2.89 亿元  49.5% \n 2024  5.40 亿元  49.1% \n 2025 H1  3.24 亿元  50.1% \n\n2022–2024 年复合年增长率 68.8%。\n\n一个必须注意的结构性变化：2024 年训练类 GPU 收入 2.69 亿元、占比约 50%、毛利率 60.2%；而推理类 GPU 占比约 50%、2025 上半年毛利率仅 32%。\n\n推理侧毛利率的塌陷是这份财报里最值得关注的信号。 它说明推理卡市场的价格竞争已经相当激烈——而推理恰恰是量最大的市场。这与模块 22 记录的\"硬件整体在涨价\"看似矛盾，实则不然：整机涨价源于存储、HBM、光模块的成本推动，而芯片厂商之间的竞争把毛利吃掉了。成本在涨、售价涨不动、毛利被两头挤压。\n\n 6.2 出货量与市场份额\n\n 时间  出货量 \n\n 2022  7,800 片 \n 2023  16,800 片 \n 2025 H1  15,700 片 \n 截至 20250630 累计  超 52,000 片 \n\n市场份额：中国通用 GPU 整体市场 0.3%，国产通用 GPU 市场 9.8%。\n\n这两个数字的对比极具说服力：在国产阵营里拿到近一成份额，放到整个中国市场只有 0.3%。国产替代的空间有多大、进度有多早，这一组数字比任何论述都清楚。\n\n 6.3 客户结构（健康度的关键指标）\n\n客户数量：2022 年 22 家 → 2024 年 181 家。\n\n前五大客户占比：94.2% → 73.3% → 73.4% → 38.6%。\n\n这是整份财报里最健康的一组数据。 客户集中度从 94% 降到 39%，意味着它正在摆脱对少数几个大客户（很可能是政府背景项目）的依赖，走向真正的市场化销售。\n\n对照我们自己的模块 05 第二节——我们给自己定的红线是单一客户收入占比不超过 15%、前五大不宜过高。用同一把尺子量，天数智芯的客户结构在快速改善，这是判断其可持续性的正面信号。\n\n 6.4 研发投入：仍在重度烧钱\n\n 年份  研发开支  占营收比 \n\n 2022  4.566 亿元  241.1% \n 2023  6.159 亿元  213.1% \n 2024  7.728 亿元  143.2% \n\n研发团队 484 人，占员工总数 70.6%。\n\n研发投入长期超过营收，说明公司仍处在需要持续外部输血的阶段。 但趋势是好的——占比从 241% 降到 143%，说明营收增速快于研发投入增速。若这个收敛趋势持续，大约还需要两到三年才能接近收支平衡。\n\n\n\n 七、资本状态\n\n上市：2026 年 1 月 8 日在港交所挂牌，代码 9903，发行价每股 144.6 港元，募资约 35 亿港元，IPO 市值约 354 亿港元。IPO 认购火爆。\n\n注意口径差异：部分报道提到\"狂揽 70 亿港元\"，与\"募资约 35 亿港元\"不一致，可能是含超额配售或引述口径不同。引用时以招股书与交易所公告为准。\n\nIPO 前融资：累计募资超 55 亿元，D+ 轮估值 120 亿元，投资方包括红杉中国、元禾基金等。\n\n股权结构：第一大股东为上海数麒，持股 23.61%，代表多个特殊目的实体行使表决权。招股书自述所有权\"一直由雇员通过多个特殊目的实体以及多元化的被动财务投资者持有\"——即无单一强控股股东，也无国资绝对控股。\n\n估值对比（值得注意）：IPO 前估值 120 亿元，明显低于摩尔线程、沐曦股份等竞品 200 亿元以上的水平。这个折价反映了资本市场对其战略摇摆历史与竞争位置的评价。\n\n\n\n 八、政策支持与客户情况\n\n政策层面：公开报道中天数智芯被描述为\"领跑国内通用 GPU 赛道\"，参与 DeepSeek 国产化适配的官方名单。但相比中昊芯英（模块 24），其获得的具名政策奖项与专项支持在公开信息中较少。\n\n客户情况：181 家客户，结构分散化明显。公开信息中未见完整客户名单。从\"通用 GPU 存量替代主战场\"的定位判断，主力应为智算中心、政企与运营商项目。\n\n价格：公开渠道查不到天数智芯产品的官方售价。 这在国产 AI 芯片行业是普遍现象——定价随项目、批量、配套服务一事一议。可用的替代锚是模块 22 记录的\"国产 8 卡服务器 2026 年标价约 200 万元/台\"这一整机价格水平。\n\n\n\n 九、风险评估\n\n管理层稳定性：创始人出走、两次换帅，是这家公司最显著的历史包袱。上市后管理层能否稳定，是需要持续观察的第一项。\n\n推理侧毛利塌陷：从 56.6% 降到 32%，而推理是量最大的市场。若持续下行，营收增长将无法转化为利润。\n\n仍在烧钱：研发占营收 143%，尚未自我造血。上市募资缓解了短期压力，但不解决结构问题。\n\n竞争位置：估值折价于摩尔线程、沐曦；在模块 22 的代差判断中属于落后昇腾一年以上的第二梯队。\n\n生态深度：走兼容路线意味着永远在追赶 CUDA，且模块 22 记录的算子覆盖、驱动碎片化问题同样适用。\n\n\n\n 十、对我们意味着什么\n\n先说清楚一件事：我们不采购芯片，我们采购的是 API。 所以天数智芯对我们的意义不是\"要不要买它的卡\"，而是三个间接但真实的层面。\n\n第一，它是「信创合规通道」这条机会线的候选支点（模块 22 第 6.3 节）。\n我们识别出的机会是：政务、金融、国企既要算力国产化，又建不起来。要把这个机会做实，前提是搞清楚哪些上游厂商的推理服务实际跑在国产卡上。天数智芯已进入 DeepSeekV4 适配名单，是这条链路上值得优先摸排的对象之一。下一步动作：了解是否有 MaaS 平台或智算中心基于天数智芯提供对外 API 服务，能否出具书面说明。\n\n第二，它的财务透明度让它成为最适合被引用的国产芯片样本。\n在跟客户讨论国产算力时，引用一家上市公司的招股书数据，远比引用行业传闻可信。 尤其是\"国产 GPGPU 市场份额 9.8%，但中国通用 GPU 整体市场只占 0.3%\"这组对比——它一句话说清了国产替代的现状与空间，且数据可核验。\n\n第三，它的推理毛利率塌陷是一条重要的行业信号。\n推理卡毛利从 56.6% 掉到 32%，说明推理侧硬件的价格竞争已经很激烈。这对我们是好消息也是提醒：好消息是长期看推理算力成本会被竞争压下来（尽管模块 22 指出 2026 年内整机仍在涨价）；提醒是硬件厂商的日子不好过，靠卖硬件赚钱越来越难——这与我们所在的转售层面临的处境高度相似（模块 18 第四节）。产业链上每一个\"只提供标准品\"的环节，毛利都在被挤压。\n\n销售纪律：在拿到书面材料前，不得对客户宣称\"我们的服务跑在天数智芯上\"（模块 22 第 6.5 节的纪律同样适用）。可以说的是\"天数智芯已进入 DeepSeekV4 官方适配名单\"，这是可核验的事实。\n\n\n\n 数据来源\n\n [天数智芯赴港 IPO：累计出货 5.2 万片，拿下 9.8% 国产 GPGPU 市场  腾讯新闻](https://news.qq.com/rain/a/20251222A03BNV00)（出货、份额、营收、毛利、客户、研发）\n [创始人出走、两次换帅、战略反复摇摆，天数智芯终于要上市了  新浪财经](https://finance.sina.cn/stock/jdts/20260105/detailinhfhavn6752098.d.html)（管理层变迁、股权、产品路线图、估值对比）\n [天数智芯正式登陆港交所，进入国产 GPU 存量替代主战场  证券时报](https://www.stcn.com/article/detail/3578117.html)\n [DeepSeekV4 国产化落地：主流国产 AI 芯片全栈深度适配  腾讯云开发者社区](https://cloud.tencent.com/developer/article/2660020)（适配名单，内容为概览性宣传，缺乏实测细节）\n 内部交叉引用：模块 22（国产算力大盘、代差、生态问题、信创机会）、模块 05（客户集中度标准）、模块 18（标准品环节毛利被挤压）\n\n 本模块数据来自公开招股书与媒体报道，未经我方实测验证，不得作为对客承诺。\n"}, {"id": "24-中昊芯英档案", "code": "24", "title": "模块 24 · 中昊芯英档案", "short": "中昊芯英档案", "subs": ["一、一句话定位", "二、起源与团队", "三、技术路线：为什么选 TPU", "四、产品线", "五、大模型适配", "六、客户与落地", "七、政策支持", "八、资本路径：一条充满不确定性的曲线", "九、⚠️ 数据可信度警示：必读", "十、风险评估", "十一、对我们意味着什么", "数据来源"], "html": "<h1>模块 24 · 中昊芯英档案</h1>\n<blockquote>\n<p>单家厂商深度档案。杭州中昊芯英（Zhonghao Xinying），国产 TPU 路线代表。\n使用者：决策层、销售（信创与 Agent 场景客户）、售前。\n数据采集日：2026-07-27。\n⚠️ <strong>本模块含大量需要证伪的网络传言，请务必读完第九节再引用任何数据。</strong></p>\n</blockquote>\n<hr />\n<h2>一、一句话定位</h2>\n<p><strong>国内极少数走 TPU（张量处理器）专用架构路线的 AI 芯片公司，创始人是前谷歌 TPU 核心研发者，技术叙事扎实，但资本路径与财务真实性存在显著疑点。</strong></p>\n<p>它与天数智芯（模块 23）构成一组有价值的对照：<strong>天数智芯走 GPGPU 通用路线、已上市、财务可核验；中昊芯英走 TPU 专用路线、未上市、财务信息混乱。</strong></p>\n<hr />\n<h2>二、起源与团队</h2>\n<p><strong>2018 年创立，2020 年在杭州正式注册落地。</strong></p>\n<p><strong>创始人杨龚轶凡</strong>——这是这家公司最硬的资产，值得单独说清楚：斯坦福硕士、密歇根学士，硅谷高端芯片研发超 10 年，<strong>深度参与 Google TPU 2/3/4 代设计</strong>，此前在甲骨文主导过 12 款顶级 CPU 设计。</p>\n<p><strong>核心团队</strong>来自谷歌、英伟达、微软、甲骨文、三星等，研发人员占比 70% 以上，掌握 28nm 至 7nm 各代制程工艺。</p>\n<p><strong>这个背景的含金量是真实的。</strong> 全球真正做过 TPU 量产级设计的人极少，而 TPU 是被谷歌验证过的、唯一在大规模生产环境中与 GPU 长期共存的替代架构。<strong>创始人背景是本档案中可信度最高的一项。</strong></p>\n<hr />\n<h2>三、技术路线：为什么选 TPU</h2>\n<p>杨龚轶凡的路线判断值得完整记录，因为它解释了这家公司的全部战略：</p>\n<p><strong>他认为通用 GPU 难以突破</strong>——英伟达、AMD 深耕 GPU 三十年，每年投入数十亿美元研发，硬件架构与 CUDA 软件栈的优化空间基本耗尽。相比之下，<strong>TPU 在张量计算上的数据复用率远高于通用 GPU</strong>。</p>\n<p><strong>技术特征</strong>：完全自主可控的 IP 核与指令集，<strong>不依赖任何国外授权</strong>。这一点在信创语境下有独特价值——它比\"兼容 CUDA\"的路线在自主可控叙事上更彻底。</p>\n<p><strong>目标定位</strong>：杨龚轶凡把公司目标表述为做\"AI 界的 x86\"，计划开放协同、共建 TPU 软硬件标准。</p>\n<h3>3.1 TPU 路线在 Agent 场景的结构性优势</h3>\n<p><strong>这一节对我们业务最有价值，因为它直接关联模块 16 与模块 21 讲的 Agent 消耗机制。</strong></p>\n<p>其 CEO 的判断是：超长上下文推理需求爆发，<strong>市面上现有算力设备很难高效支撑百万 Token 级上下文窗口</strong>。第二代芯片\"须臾\"通过重构脉动阵列的数据流调度，<strong>大幅提升 KV Cache 缓存命中率，削减历史上下文的重复计算</strong>。</p>\n<p><strong>这段话如果属实，指向的正是我们在模块 21 第 1.5 节推导的那个问题</strong>——Agent 每轮输入都累积前面所有轮次，总消耗随轮次呈平方增长。<strong>KV Cache 命中率的提升，正是针对这个成本结构的硬件级优化。</strong></p>\n<p>宣称的收益：第二代相比一代综合性能提升 3 倍（其中架构升级贡献 1.5 倍），<
