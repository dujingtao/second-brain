\"值不值\"，而是\"万一出事怎么办\"。</p>\n<p>标准动作是把风险一条条拆开消解：稳定性风险用 SLA 条款和故障补偿消解；切换风险用\"保留原通道并行运行、灰度切流\"消解；资金风险用\"小额起充、余额可退\"消解；合规风险用资质文件包和备案材料消解；决策风险用\"先做一个部门、一个场景\"消解。</p>\n<p><strong>成交阶段销售的角色是帮客户写好他向老板汇报的稿子。</strong> 客户内部要为这个决策负责，我们提供的材料越能让他交差，成交越快。</p>\n<hr />\n<h2>三、核心异议处理</h2>\n<p>以下每一条都给出客户的原话、背后的真实顾虑、以及推荐回应。<strong>推荐回应不要背诵，要理解逻辑后用自己的话讲。</strong> 背出来的话术客户一听就知道。</p>\n<hr />\n<h3>异议 1：「你不就是个中间商吗？我直接找官方就行了」</h3>\n<p><strong>真实顾虑</strong>：担心多付钱、担心多一层风险。</p>\n<p><strong>回应逻辑</strong>：不否认中间层，而是重新定义中间层的价值。</p>\n<blockquote>\n<p>\"对，我们确实在中间。问题是您现在中间有几层——DeepSeek 一层、通义一层、豆包一层，每层一个账号、一套协议、一份账单、一次商务。我们做的事是把这五层变成一层。您直连官方省的是我们的差价，但花的是您工程师的时间和您财务的时间。如果您只用一个模型、而且不打算换，那确实不需要我们，我会直接告诉您。\"</p>\n</blockquote>\n<p><strong>关键点</strong>：主动说出\"如果你只用一个模型就不需要我们\"。这句诚实的话会立刻提升可信度，而且绝大多数客户不止用一个模型。</p>\n<hr />\n<h3>异议 2：「XX 平台比你们便宜」</h3>\n<p><strong>真实顾虑</strong>：想压价，或者真的在意价格。</p>\n<p><strong>回应逻辑</strong>：不接价格战，把比较维度扩展。</p>\n<blockquote>\n<p>\"他们的价格我知道，确实低。有三个问题您可以顺便问问他们：一是他们的 SLA 是多少、故障了怎么赔；二是账单能不能区分缓存命中和普通调用；三是能不能开专票、能不能提供模型备案文件。这三条我们都能给。如果这三条对您不重要，那说实话选他们没问题。\"</p>\n</blockquote>\n<p><strong>关键点</strong>：给出三个具体的、竞品大概率答不上来的问题。<strong>让客户自己去发现差距，比我们说一百句都有效。</strong></p>\n<p><strong>纪律</strong>：<strong>绝不因为竞品报价而立刻降价。</strong> 一次轻易的降价会让客户认定我们的报价永远有水分，后续每次续约都要再砍一刀。</p>\n<hr />\n<h3>异议 3：「我们已经在用 XX 了，切换太麻烦」</h3>\n<p><strong>真实顾虑</strong>：担心迁移成本和线上事故。</p>\n<p><strong>回应逻辑</strong>：把\"切换\"改造成\"并行\"。</p>\n<blockquote>\n<p>\"不用切换。您把 base_url 改一行，先把 5% 的流量导过来跑一周，原来的通道一点不动。一周后对比一下稳定性和账单，觉得不行随时切回去，成本就是那一行代码。\"</p>\n</blockquote>\n<p><strong>关键点</strong>：把决策的风险降到接近零。<strong>\"先跑 5%\"是这个行业最有效的成交话术，因为它几乎不需要客户承担任何东西。</strong></p>\n<hr />\n<h3>异议 4：「你们太小了，万一哪天倒闭了怎么办」</h3>\n<p><strong>真实顾虑</strong>：供应商持续性风险。这是初创公司面对大客户时最难回答、也最常遇到的问题。</p>\n<p><strong>回应逻辑</strong>：不辩解规模，用架构消解风险。</p>\n<blockquote>\n<p>\"这个担心很合理，我不会跟您说我们一定不会有问题。我们的做法是让您不依赖我们的存活：第一，我们完全兼容 OpenAI 协议，您改一行 base_url 就能切走，没有任何技术锁定；第二，您的余额可以随时申请退回，我们不设消费门槛；第三，您可以保留一条官方直连通道做备份，我们不要求独家。您用我们是因为好用，不是因为切不走。\"</p>\n</blockquote>\n<p><strong>关键点</strong>：<strong>主动降低客户的锁定，反而是最能建立信任的动作。</strong> 试图用锁定留住客户的小公司，往往连第一单都签不下来。</p>\n<hr />\n<h3>异议 5：「我们有数据安全要求，数据不能出去」</h3>\n<p><strong>真实顾虑</strong>：合规红线，通常不可谈判。</p>\n<p><strong>回应逻辑</strong>：分层解决，不硬碰。</p>\n<blockquote>\n<p>\"分几种情况。如果是数据不能出公司网络，那我们的网关组件可以部署在您的环境里，只有出站调用走我们的通道，数据不落我们的库。如果是数据完全不能给第三方模型，那需要私有化部署模型，这块我们可以帮您对接厂商的私有化方案。如果只是要求数据留存在境内且可审计，那我们的标准方案就能满足，调用日志我们留存六个月以上，随时可导出。\"</p>\n</blockquote>\n<p><strong>关键点</strong>：先问清楚\"不能出去\"具体指什么。<strong>大多数时候客户的表述比实际要求严格得多</strong>，问清楚之后往往发现标准方案就够。</p>\n<hr />\n<h3>异议 6：「价格能不能再低点」（临门一脚的压价）</h3>\n<p><strong>真实顾虑</strong>：习惯性砍价，或需要向内部证明自己谈判有功。</p>\n<p><strong>回应逻辑</strong>：不直接降价，用等价物交换。</p>\n<blockquote>\n<p>\"价格上我这边空间不大了。不过有几个东西我可以给您争取：一是把优化服务的首季度免费给您，按您现在的量算大概能省 X 万；二是把 SLA 从 99.9 提到 99.95 写进合同；三是给您开通专属的技术响应通道。这几个加起来的价值比再降两个点要多。\"</p>\n</blockquote>\n<p><strong>关键点</strong>：<strong>用服务换价格，而不是用价格换成交。</strong> 服务的边际成本低于价差，且能提升客户粘性。如果实在必须降价，一定要换取对等条件——更长的合同期、更高的承诺量、或者一个可对外的案例授权。</p>\n<hr />\n<h3>异议 7：「让我再考虑考虑」</h3>\n<p><strong>真实顾虑</strong>：通常是有一个没说出口的障碍，或者决策链上有我们没接触到的人。</p>\n<p><strong>回应逻辑</strong>：不追问决策，追问障碍。</p>\n<blockquote>\n<p>\"没问题。我想确认一下，如果今天要拍板，最让您犹豫的是哪一点？是价格、稳定性，还是内部还有别的同事需要看一下？我问这个不是催您，是想知道我还该准备什么材料。\"</p>\n</blockquote>\n<p><strong>关键点</strong>：<strong>\"你还需要什么材料\"比\"你什么时候能定\"有效十倍。</strong> 前者把销售放在协助者的位置，后者把销售放在施压者的位置。</p>\n<hr />\n<h2>四、销售的五条纪律</h2>\n<p><strong>第一，不承诺做不到的事。</strong> SLA、交付时间、功能上线时间——承诺了就必须兑现。一次失信在这个圈子里传播极快。</p>\n<p><strong>第二，不隐瞒通道性质。</strong> 某个模型如果走的是第三方聚合通道而非官方直连，必须如实告知。客户事后发现的代价远大于当时说清楚。</p>\n<p><strong>第三，不主动挑起价格战。</strong> 我们不是价格最低的，也不打算是。</p>\n<p><strong>第四，不为冲量签失血订单。</strong> 毛利低于 8% 的订单必须走审批（详见模块 04）。</p>\n<p><strong>第五，不帮客户绕过合规。</strong> 如果客户的用途明显违规，或者要求我们协助规避备案公示义务，直接拒绝。这类客户带来的收入与它可能造成的损失完全不成比例。</p>\n<hr />\n<h2>五、跟进节奏建议</h2>\n<p>初次接触后 24 小时内发送一份纪要，内容包括我们理解的他的现状、我们发现的空白点、以及下一步建议。<strong>纪要的价值不在于记录，在于把\"聊了一次\"变成\"有了共识\"。</strong></p>\n<p>POC 期间每周一次简短同步，主动汇报观察到的数据，不等客户问。</p>\n<p>未成交客户按温度分级跟进：高温（有明确预算和时间表）两周一次，中温（认可价值但无时间表）一月一次，低温（礼貌性接触）三月一次并转入内容触达。</p>\n<p><strong>已成交客户的首月复盘必须做，而且必须由销售亲自参与。</strong> 这是扩量和转介绍的最佳时机，也是唯一能把关系从交易升级为信任的窗口。</p>", "plain": " 模块 06 · 销售方法论与话术库\n\n 本模块解决的问题：怎么谈、怎么破异议、怎么不把自己谈死。\n 使用者：销售全员，新人入职必修。\n\n\n\n 一、销售的基本立场\n\n在讲任何话术之前，先确立一个立场问题：我们不是在卖 token，我们是在帮客户管理一笔正在快速膨胀且失控的支出。\n\n这个立场的差别是根本性的。卖 token 的销售会陷入价格比较，因为 token 是标准品，标准品只能比价。管理支出的顾问会引导客户看总成本，而总成本包含了工程时间、故障损失、合规风险和优化空间——在这个维度上我们几乎总是赢的。\n\n所以整套销售方法论只有一条主线：尽快把对话从\"你比官方便宜多少\"转移到\"你们现在的 AI 支出是怎么管的\"。 谁掌控了话题的坐标系，谁就掌控了谈判。\n\n\n\n 二、三段式销售流程\n\n 第一段：暴露空白（首次接触，20–30 分钟）\n\n目标不是介绍产品，是让客户发现一个他答不上来的问题。\n\n按模块 05 的问题库提问，重点关注三类空白：成本可见性空白（说不清钱花在哪）、稳定性空白（没有故障预案）、合规空白（没做留存和公示）。\n\n这一段的成功标准是客户说出类似\"这个我们确实没想过\"或者\"这个得回去查一下\"的话。如果全程是我们在讲、客户在听，这次接触基本失败了，哪怕客户很客气地说\"挺好的，有需要联系你\"。\n\n一条纪律：第一次接触不主动报价。 报价会立刻把对话拽回比价框架。如果客户主动问价，标准回应是：\"价格我们肯定有竞争力，但更值钱的可能是另一件事——你们现在能看到缓存命中省了多少钱吗？大部分客户在这一块能立刻省下两三成。\"\n\n 第二段：证明价值（POC 阶段，1–4 周）\n\n目标是用客户自己的数据，做出一个具体的数字。\n\n标准动作是：给测试额度 → 客户跑真实流量 → 我们出一份分析报告，内容包括当前成本构成、可优化项、优化后的预估成本、以及节省金额。\n\n这份报告是整个销售流程中最重要的交付物。 它把抽象的\"我们能帮你省钱\"变成\"根据你们上周的 340 万次调用，把系统提示词做缓存后每月可省 1.8 万元\"。\n\n一条纪律：报告里的优化建议必须是真的、可验证的，哪怕它导致我们的收入下降。 帮客户省下的钱越多，客户留得越久，扩量越快。为了短期收入隐瞒优化空间，是这门生意里最短视的行为。\n\n 第三段：降低风险（成交阶段）\n\n到了这一步，客户认可价值，卡住的通常不是\"值不值\"，而是\"万一出事怎么办\"。\n\n标准动作是把风险一条条拆开消解：稳定性风险用 SLA 条款和故障补偿消解；切换风险用\"保留原通道并行运行、灰度切流\"消解；资金风险用\"小额起充、余额可退\"消解；合规风险用资质文件包和备案材料消解；决策风险用\"先做一个部门、一个场景\"消解。\n\n成交阶段销售的角色是帮客户写好他向老板汇报的稿子。 客户内部要为这个决策负责，我们提供的材料越能让他交差，成交越快。\n\n\n\n 三、核心异议处理\n\n以下每一条都给出客户的原话、背后的真实顾虑、以及推荐回应。推荐回应不要背诵，要理解逻辑后用自己的话讲。 背出来的话术客户一听就知道。\n\n\n\n 异议 1：「你不就是个中间商吗？我直接找官方就行了」\n\n真实顾虑：担心多付钱、担心多一层风险。\n\n回应逻辑：不否认中间层，而是重新定义中间层的价值。\n\n \"对，我们确实在中间。问题是您现在中间有几层——DeepSeek 一层、通义一层、豆包一层，每层一个账号、一套协议、一份账单、一次商务。我们做的事是把这五层变成一层。您直连官方省的是我们的差价，但花的是您工程师的时间和您财务的时间。如果您只用一个模型、而且不打算换，那确实不需要我们，我会直接告诉您。\"\n\n关键点：主动说出\"如果你只用一个模型就不需要我们\"。这句诚实的话会立刻提升可信度，而且绝大多数客户不止用一个模型。\n\n\n\n 异议 2：「XX 平台比你们便宜」\n\n真实顾虑：想压价，或者真的在意价格。\n\n回应逻辑：不接价格战，把比较维度扩展。\n\n \"他们的价格我知道，确实低。有三个问题您可以顺便问问他们：一是他们的 SLA 是多少、故障了怎么赔；二是账单能不能区分缓存命中和普通调用；三是能不能开专票、能不能提供模型备案文件。这三条我们都能给。如果这三条对您不重要，那说实话选他们没问题。\"\n\n关键点：给出三个具体的、竞品大概率答不上来的问题。让客户自己去发现差距，比我们说一百句都有效。\n\n纪律：绝不因为竞品报价而立刻降价。 一次轻易的降价会让客户认定我们的报价永远有水分，后续每次续约都要再砍一刀。\n\n\n\n 异议 3：「我们已经在用 XX 了，切换太麻烦」\n\n真实顾虑：担心迁移成本和线上事故。\n\n回应逻辑：把\"切换\"改造成\"并行\"。\n\n \"不用切换。您把 base_url 改一行，先把 5% 的流量导过来跑一周，原来的通道一点不动。一周后对比一下稳定性和账单，觉得不行随时切回去，成本就是那一行代码。\"\n\n关键点：把决策的风险降到接近零。\"先跑 5%\"是这个行业最有效的成交话术，因为它几乎不需要客户承担任何东西。\n\n\n\n 异议 4：「你们太小了，万一哪天倒闭了怎么办」\n\n真实顾虑：供应商持续性风险。这是初创公司面对大客户时最难回答、也最常遇到的问题。\n\n回应逻辑：不辩解规模，用架构消解风险。\n\n \"这个担心很合理，我不会跟您说我们一定不会有问题。我们的做法是让您不依赖我们的存活：第一，我们完全兼容 OpenAI 协议，您改一行 base_url 就能切走，没有任何技术锁定；第二，您的余额可以随时申请退回，我们不设消费门槛；第三，您可以保留一条官方直连通道做备份，我们不要求独家。您用我们是因为好用，不是因为切不走。\"\n\n关键点：主动降低客户的锁定，反而是最能建立信任的动作。 试图用锁定留住客户的小公司，往往连第一单都签不下来。\n\n\n\n 异议 5：「我们有数据安全要求，数据不能出去」\n\n真实顾虑：合规红线，通常不可谈判。\n\n回应逻辑：分层解决，不硬碰。\n\n \"分几种情况。如果是数据不能出公司网络，那我们的网关组件可以部署在您的环境里，只有出站调用走我们的通道，数据不落我们的库。如果是数据完全不能给第三方模型，那需要私有化部署模型，这块我们可以帮您对接厂商的私有化方案。如果只是要求数据留存在境内且可审计，那我们的标准方案就能满足，调用日志我们留存六个月以上，随时可导出。\"\n\n关键点：先问清楚\"不能出去\"具体指什么。大多数时候客户的表述比实际要求严格得多，问清楚之后往往发现标准方案就够。\n\n\n\n 异议 6：「价格能不能再低点」（临门一脚的压价）\n\n真实顾虑：习惯性砍价，或需要向内部证明自己谈判有功。\n\n回应逻辑：不直接降价，用等价物交换。\n\n \"价格上我这边空间不大了。不过有几个东西我可以给您争取：一是把优化服务的首季度免费给您，按您现在的量算大概能省 X 万；二是把 SLA 从 99.9 提到 99.95 写进合同；三是给您开通专属的技术响应通道。这几个加起来的价值比再降两个点要多。\"\n\n关键点：用服务换价格，而不是用价格换成交。 服务的边际成本低于价差，且能提升客户粘性。如果实在必须降价，一定要换取对等条件——更长的合同期、更高的承诺量、或者一个可对外的案例授权。\n\n\n\n 异议 7：「让我再考虑考虑」\n\n真实顾虑：通常是有一个没说出口的障碍，或者决策链上有我们没接触到的人。\n\n回应逻辑：不追问决策，追问障碍。\n\n \"没问题。我想确认一下，如果今天要拍板，最让您犹豫的是哪一点？是价格、稳定性，还是内部还有别的同事需要看一下？我问这个不是催您，是想知道我还该准备什么材料。\"\n\n关键点：\"你还需要什么材料\"比\"你什么时候能定\"有效十倍。 前者把销售放在协助者的位置，后者把销售放在施压者的位置。\n\n\n\n 四、销售的五条纪律\n\n第一，不承诺做不到的事。 SLA、交付时间、功能上线时间——承诺了就必须兑现。一次失信在这个圈子里传播极快。\n\n第二，不隐瞒通道性质。 某个模型如果走的是第三方聚合通道而非官方直连，必须如实告知。客户事后发现的代价远大于当时说清楚。\n\n第三，不主动挑起价格战。 我们不是价格最低的，也不打算是。\n\n第四，不为冲量签失血订单。 毛利低于 8% 的订单必须走审批（详见模块 04）。\n\n第五，不帮客户绕过合规。 如果客户的用途明显违规，或者要求我们协助规避备案公示义务，直接拒绝。这类客户带来的收入与它可能造成的损失完全不成比例。\n\n\n\n 五、跟进节奏建议\n\n初次接触后 24 小时内发送一份纪要，内容包括我们理解的他的现状、我们发现的空白点、以及下一步建议。纪要的价值不在于记录，在于把\"聊了一次\"变成\"有了共识\"。\n\nPOC 期间每周一次简短同步，主动汇报观察到的数据，不等客户问。\n\n未成交客户按温度分级跟进：高温（有明确预算和时间表）两周一次，中温（认可价值但无时间表）一月一次，低温（礼貌性接触）三月一次并转入内容触达。\n\n已成交客户的首月复盘必须做，而且必须由销售亲自参与。 这是扩量和转介绍的最佳时机，也是唯一能把关系从交易升级为信任的窗口。\n"}, {"id": "07-渠道与代理商体系", "code": "07", "title": "模块 07 · 渠道与代理商体系", "short": "渠道与代理商体系", "subs": ["一、为什么要做渠道，以及什么时候不该做", "二、代理商分级体系", "三、分润与折扣设计", "四、渠道赋能：我们必须提供什么", "五、渠道风险与管控", "六、渠道启动的分阶段建议"], "html": "<h1>模块 07 · 渠道与代理商体系</h1>\n<blockquote>\n<p>⚠️ 本模块含分润底线数据，对外版本需删除第三节的成本红线部分。\n本模块解决的问题：怎么发展下游、怎么分钱、怎么不被渠道反噬。\n使用者：渠道负责人、决策层。</p>\n</blockquote>\n<hr />\n<h2>一、为什么要做渠道，以及什么时候不该做</h2>\n<p>渠道的本质是<strong>用别人的客户关系换我们的产品覆盖</strong>。它的杠杆极大：一个渠道经理可以管理三十个代理商，而三十个代理商背后可能是几百个终端客户——这是直销团队永远达不到的效率。</p>\n<p>但渠道也有明确的<strong>前置条件</strong>，不满足就做，必然翻车：</p>\n<p><strong>第一，产品必须已经跑通。</strong> 代理商没有能力处理产品缺陷，客户一投诉他就跑了，还会到处说我们的坏话。产品不稳定期做渠道，等于把 bug 放大三十倍传播出去。</p>\n<p><strong>第二，交付必须已经标准化。</strong> 如果每个客户的接入都要我们的技术手把手带，那代理商带来的每一单都是我们的成本，规模越大越亏。</p>\n<p><strong>第三，结算系统必须已经自动化。</strong> 手工算分润在十个代理商时还能撑，三十个时必然算错，一算错信任就崩了。</p>\n<p><strong>给决策层的建议：起步期前 6 个月不要大规模招募代理商，先用 3–5 个种子代理跑通流程。</strong> 种子代理的作用是暴露问题，不是贡献收入。</p>\n<hr />\n<h2>二、代理商分级体系</h2>\n<h3>2.1 三级结构</h3>\n<p><strong>注册代理（入门级）</strong>\n无需预付，无需资质要求，线上注册即可。以推荐返佣的形式合作——推荐客户成交后按该客户消费额的固定比例获得返佣，返佣期建议设为 12 个月。</p>\n<p>这一级的作用是<strong>低门槛吸纳流量</strong>。适合个人、自由职业者、有零散客户资源的技术服务者。管理成本必须接近零，全部自助化。</p>\n<p><strong>授权代理（主力级）</strong>\n需签署正式代理协议，有一定预付或年度承诺量要求，需通过基础的资质审核（营业执照、经营范围合规）。享受阶梯折扣拿货，自主定价，赚取价差。</p>\n<p>这一级是<strong>渠道体系的主力</strong>，贡献大部分渠道收入。适合本地 IT 服务商、软件开发商、行业 SaaS 公司。需要配备渠道经理提供支持。</p>\n<p><strong>战略伙伴（顶级）</strong>\n需较高的预付和承诺量，通过完整资质审核与业务尽调。享受最深折扣、白标能力（独立品牌控制台与域名）、独立结算后台、区域或行业保护、专属技术支持与联合市场活动。</p>\n<p>这一级数量应严格控制，<strong>宁少勿滥</strong>。每一个战略伙伴都应该是某个区域或某个垂直行业的实质性突破口。</p>\n<h3>2.2 升降级规则</h3>\n<p>分级不是终身制。建议按季度评估，评估维度包括实际采购量、客户数量、客户留存率、服务质量投诉、以及合规记录。</p>\n<p><strong>降级必须真的执行。</strong> 一个只升不降的分级体系，最终会变成一堆享受高折扣但不产出的\"僵尸战略伙伴\"，直接侵蚀毛利。</p>\n<hr />\n<h2>三、分润与折扣设计</h2>\n<h3>3.1 设计原则</h3>\n<p><strong>原则一：折扣必须与实际采购量挂钩，且按季度结算兑现。</strong> 承诺量不是采购量，预支折扣是渠道体系最常见的亏损来源。</p>\n<p><strong>原则二：任何层级的代理折扣，都必须给公司留出不低于既定毛利底线的空间。</strong> 具体底线由决策层设定（建议不低于 8%），且计算时必须扣除渠道支持的人力成本，而不是只看价差。</p>\n<p><strong>原则三：返佣和分润的计算规则必须公开、可查、可自助核对。</strong> 代理商能在后台看到每一笔的计算过程，是渠道信任的基础。<strong>分润算不清楚是渠道体系崩溃的第一大原因。</strong></p>\n<p><strong>原则四：结算周期要短且准时。</strong> 建议月结，次月固定日期前打款。<strong>准时结算的信誉，比多给两个点的折扣更能留住代理商。</strong> 一次延迟结算造成的信任损失，需要半年才能修复。</p>\n<h3>3.2 阶梯设计的对齐原则</h3>\n<p>对下游的折扣阶梯必须与我们从上游拿到的阶梯<strong>结构对齐</strong>。如果上游在月采购达到某个量级时给我们提升 3 个点，那我们对下游的阶梯拐点应该设在能推动整体跨过这个量级的位置。</p>\n<p><strong>错误做法</strong>：随手按整数设阶梯（10 万一档、50 万一档），结果代理商拿到的折扣提升与我们的成本下降不同步，量上去了毛利反而下降。</p>\n<hr />\n<h2>四、渠道赋能：我们必须提供什么</h2>\n<p>代理商选择我们而不是别人，很大程度上取决于<strong>我们让他做生意有多容易</strong>。以下是必须提供的赋能包。</p>\n<p><strong>销售物料</strong>：产品介绍、场景方案、竞品对比、报价工具、合同模板。全部提供可编辑版本，允许代理商替换品牌信息。</p>\n<p><strong>收益测算工具</strong>：这是招募代理商时最有效的单一材料。给他一张表，输入客户数和平均消费额，输出他的年度收益预估。<strong>先给测算表，再给产品介绍。</strong></p>\n<p><strong>技术支持</strong>：明确的技术支持通道和响应时效承诺。代理商最怕的就是客户问了问题他答不上来、找我们又找不到人。</p>\n<p><strong>培训体系</strong>：新代理必须完成基础培训（产品、话术、合规红线）才能正式开展业务。培训内容直接取自本知识库的模块 02、03、06、08。</p>\n<p><strong>客户保护机制</strong>：报备制度——代理商报备的客户在保护期内（建议 90 天）不被其他代理或我们的直销团队触碰。<strong>这一条必须严格执行，一次撞单处理不公，整个渠道体系的信任就没了。</strong></p>\n<hr />\n<h2>五、渠道风险与管控</h2>\n<p>渠道是双刃剑，以下五类风险必须建立明确的管控机制。</p>\n<p><strong>窜货与低价倾销。</strong> 代理商为抢单跌破指导价，扰乱整个价格体系，最终所有人都赚不到钱。管控方式是设定最低指导价、建立价格违规举报与核查机制、屡犯者降级或终止合作。</p>\n<p><strong>虚假宣传。</strong> 代理商为成交夸大承诺——承诺我们做不到的 SLA、宣称拥有实际没有的官方授权、夸大成本节省效果。这些承诺最终要我们兜底。管控方式是在代理协议中明确宣传口径的边界，提供标准物料并要求不得擅自修改核心表述，建立客户端的核实渠道。</p>\n<p><strong>服务质量拖累品牌。</strong> 代理商服务不到位，终端客户的不满会归因到我们头上。管控方式是建立终端客户的直接反馈通道，定期抽样回访。</p>\n<p><strong>合规连带风险。这是最危险的一条。</strong> 代理商可能把我们的通道卖给做违规内容生成的客户，一旦出事，责任会追溯到通道提供方。管控方式必须是硬性的：代理商必须对其终端客户做实名与用途核验、我们保留对异常调用的监控与切断权、代理协议中明确合规责任与连带追偿条款。<strong>详见模块 08。</strong></p>\n<p><strong>渠道依赖。</strong> 单一代理商贡献过高收入后获得议价权，甚至可能带着客户整体迁移。管控方式是设置单一代理商收入占比上限（建议不超过 20%），并保持对终端客户的一定可见度。</p>\n<hr />\n<h2>六、渠道启动的分阶段建议</h2>\n<p><strong>第一阶段（0–6 个月）：种子验证。</strong> 招募 3–5 个种子代理，重点不是收入，是跑通报备、结算、支持、培训四套流程，并暴露问题。这个阶段允许亏损。</p>\n<p><strong>第二阶段（6–12 个月）：小规模复制。</strong> 扩展到 20–30 个授权代理，验证渠道经理的管理半径和赋能材料的有效性。开始考核渠道的贡献毛利。</p>\n<p><strong>第三阶段（12 个月后）：体系化扩张。</strong> 建立完整的分级、培训、认证、激励体系，发展战略伙伴，按行业和区域做结构化布局。</p>\n<p><strong>任何一个阶段没跑通就跳到下一阶段，风险会指数级放大。</strong> 尤其是结算系统——在代理商数量超过 20 个之前必须完成自动化，否则必然出错。</p>", "plain": " 模块 07 · 渠道与代理商体系\n\n ⚠️ 本模块含分润底线数据，对外版本需删除第三节的成本红线部分。\n 本模块解决的问题：怎么发展下游、怎么分钱、怎么不被渠道反噬。\n 使用者：渠道负责人、决策层。\n\n\n\n 一、为什么要做渠道，以及什么时候不该做\n\n渠道的本质是用别人的客户关系换我们的产品覆盖。它的杠杆极大：一个渠道经理可以管理三十个代理商，而三十个代理商背后可能是几百个终端客户——这是直销团队永远达不到的效率。\n\n但渠道也有明确的前置条件，不满足就做，必然翻车：\n\n第一，产品必须已经跑通。 代理商没有能力处理产品缺陷，客户一投诉他就跑了，还会到处说我们的坏话。产品不稳定期做渠道，等于把 bug 放大三十倍传播出去。\n\n第二，交付必须已经标准化。 如果每个客户的接入都要我们的技术手把手带，那代理商带来的每一单都是我们的成本，规模越大越亏。\n\n第三，结算系统必须已经自动化。 手工算分润在十个代理商时还能撑，三十个时必然算错，一算错信任就崩了。\n\n给决策层的建议：起步期前 6 个月不要大规模招募代理商，先用 3–5 个种子代理跑通流程。 种子代理的作用是暴露问题，不是贡献收入。\n\n\n\n 二、代理商分级体系\n\n 2.1 三级结构\n\n注册代理（入门级）\n无需预付，无需资质要求，线上注册即可。以推荐返佣的形式合作——推荐客户成交后按该客户消费额的固定比例获得返佣，返佣期建议设为 12 个月。\n\n这一级的作用是低门槛吸纳流量。适合个人、自由职业者、有零散客户资源的技术服务者。管理成本必须接近零，全部自助化。\n\n授权代理（主力级）\n需签署正式代理协议，有一定预付或年度承诺量要求，需通过基础的资质审核（营业执照、经营范围合规）。享受阶梯折扣拿货，自主定价，赚取价差。\n\n这一级是渠道体系的主力，贡献大部分渠道收入。适合本地 IT 服务商、软件开发商、行业 SaaS 公司。需要配备渠道经理提供支持。\n\n战略伙伴（顶级）\n需较高的预付和承诺量，通过完整资质审核与业务尽调。享受最深折扣、白标能力（独立品牌控制台与域名）、独立结算后台、区域或行业保护、专属技术支持与联合市场活动。\n\n这一级数量应严格控制，宁少勿滥。每一个战略伙伴都应该是某个区域或某个垂直行业的实质性突破口。\n\n 2.2 升降级规则\n\n分级不是终身制。建议按季度评估，评估维度包括实际采购量、客户数量、客户留存率、服务质量投诉、以及合规记录。\n\n降级必须真的执行。 一个只升不降的分级体系，最终会变成一堆享受高折扣但不产出的\"僵尸战略伙伴\"，直接侵蚀毛利。\n\n\n\n 三、分润与折扣设计\n\n 3.1 设计原则\n\n原则一：折扣必须与实际采购量挂钩，且按季度结算兑现。 承诺量不是采购量，预支折扣是渠道体系最常见的亏损来源。\n\n原则二：任何层级的代理折扣，都必须给公司留出不低于既定毛利底线的空间。 具体底线由决策层设定（建议不低于 8%），且计算时必须扣除渠道支持的人力成本，而不是只看价差。\n\n原则三：返佣和分润的计算规则必须公开、可查、可自助核对。 代理商能在后台看到每一笔的计算过程，是渠道信任的基础。分润算不清楚是渠道体系崩溃的第一大原因。\n\n原则四：结算周期要短且准时。 建议月结，次月固定日期前打款。准时结算的信誉，比多给两个点的折扣更能留住代理商。 一次延迟结算造成的信任损失，需要半年才能修复。\n\n 3.2 阶梯设计的对齐原则\n\n对下游的折扣阶梯必须与我们从上游拿到的阶梯结构对齐。如果上游在月采购达到某个量级时给我们提升 3 个点，那我们对下游的阶梯拐点应该设在能推动整体跨过这个量级的位置。\n\n错误做法：随手按整数设阶梯（10 万一档、50 万一档），结果代理商拿到的折扣提升与我们的成本下降不同步，量上去了毛利反而下降。\n\n\n\n 四、渠道赋能：我们必须提供什么\n\n代理商选择我们而不是别人，很大程度上取决于我们让他做生意有多容易。以下是必须提供的赋能包。\n\n销售物料：产品介绍、场景方案、竞品对比、报价工具、合同模板。全部提供可编辑版本，允许代理商替换品牌信息。\n\n收益测算工具：这是招募代理商时最有效的单一材料。给他一张表，输入客户数和平均消费额，输出他的年度收益预估。先给测算表，再给产品介绍。\n\n技术支持：明确的技术支持通道和响应时效承诺。代理商最怕的就是客户问了问题他答不上来、找我们又找不到人。\n\n培训体系：新代理必须完成基础培训（产品、话术、合规红线）才能正式开展业务。培训内容直接取自本知识库的模块 02、03、06、08。\n\n客户保护机制：报备制度——代理商报备的客户在保护期内（建议 90 天）不被其他代理或我们的直销团队触碰。这一条必须严格执行，一次撞单处理不公，整个渠道体系的信任就没了。\n\n\n\n 五、渠道风险与管控\n\n渠道是双刃剑，以下五类风险必须建立明确的管控机制。\n\n窜货与低价倾销。 代理商为抢单跌破指导价，扰乱整个价格体系，最终所有人都赚不到钱。管控方式是设定最低指导价、建立价格违规举报与核查机制、屡犯者降级或终止合作。\n\n虚假宣传。 代理商为成交夸大承诺——承诺我们做不到的 SLA、宣称拥有实际没有的官方授权、夸大成本节省效果。这些承诺最终要我们兜底。管控方式是在代理协议中明确宣传口径的边界，提供标准物料并要求不得擅自修改核心表述，建立客户端的核实渠道。\n\n服务质量拖累品牌。 代理商服务不到位，终端客户的不满会归因到我们头上。管控方式是建立终端客户的直接反馈通道，定期抽样回访。\n\n合规连带风险。这是最危险的一条。 代理商可能把我们的通道卖给做违规内容生成的客户，一旦出事，责任会追溯到通道提供方。管控方式必须是硬性的：代理商必须对其终端客户做实名与用途核验、我们保留对异常调用的监控与切断权、代理协议中明确合规责任与连带追偿条款。详见模块 08。\n\n渠道依赖。 单一代理商贡献过高收入后获得议价权，甚至可能带着客户整体迁移。管控方式是设置单一代理商收入占比上限（建议不超过 20%），并保持对终端客户的一定可见度。\n\n\n\n 六、渠道启动的分阶段建议\n\n第一阶段（0–6 个月）：种子验证。 招募 3–5 个种子代理，重点不是收入，是跑通报备、结算、支持、培训四套流程，并暴露问题。这个阶段允许亏损。\n\n第二阶段（6–12 个月）：小规模复制。 扩展到 20–30 个授权代理，验证渠道经理的管理半径和赋能材料的有效性。开始考核渠道的贡献毛利。\n\n第三阶段（12 个月后）：体系化扩张。 建立完整的分级、培训、认证、激励体系，发展战略伙伴，按行业和区域做结构化布局。\n\n任何一个阶段没跑通就跳到下一阶段，风险会指数级放大。 尤其是结算系统——在代理商数量超过 20 个之前必须完成自动化，否则必然出错。\n"}, {"id": "08-合规与风险控制", "code": "08", "title": "模块 08 · 合规与风险控制", "short": "合规与风险控制", "subs": ["一、为什么合规是这门生意的第一优先级", "二、法规框架与备案要求", "三、经营资质清单", "四、内容与用途风控", "五、其他关键风险", "六、合规自查清单", "参考来源"], "html": "<h1>模块 08 · 合规与风险控制</h1>\n<blockquote>\n<p>本模块解决的问题：什么不能碰、必须办什么、怎么不出事。\n使用者：全员必读，决策层与法务重点关注。\n⚠️ 本模块内容涉及监管要求，具体执行前请咨询专业律师。本文档为业务理解与自查用，不构成法律意见。</p>\n</blockquote>\n<hr />\n<h2>一、为什么合规是这门生意的第一优先级</h2>\n<p>先说一个判断：<strong>在 AI token 转售这个行业里，合规不是成本，是分水岭。</strong></p>\n<p>市场上存在大量野生\"API 中转站\"，它们靠低价和灵活性生存，但普遍缺乏资质、无法开票、不做日志留存、不提供备案信息。随着监管要求在 2026 年落地咬合，这批玩家会被逐步清退出企业级市场。</p>\n<p>这意味着两件事。第一，<strong>我们把合规做扎实，等于自动获得了一批竞争对手无法进入的市场</strong>——所有需要过内审、外审、供应商准入的企业客户。第二，<strong>合规做不扎实，我们不是慢慢被淘汰，而是可能一次出事就结束</strong>。</p>\n<p>监管风险与商业风险的性质不同：商业风险是渐进的、可修补的；合规风险是断崖式的、不可逆的。所以它必须排在第一位。</p>\n<hr />\n<h2>二、法规框架与备案要求</h2>\n<h3>2.1 核心法规</h3>\n<p>《生成式人工智能服务管理暂行办法》自 2023 年 8 月 15 日起施行，是这个领域的基础性规范。配套还有《生成式人工智能服务安全基本要求》、《互联网信息服务算法推荐管理规定》及相关的算法备案与安全评估要求。国家网信办定期公告已备案的生成式人工智能服务信息。</p>\n<h3>2.2 「纯调用」与「二次开发」的关键区分</h3>\n<p>这是本模块最重要的一条实操知识，<strong>直接决定我们和客户各自要办什么</strong>。</p>\n<p><strong>纯 API 调用</strong>：仅调用第三方已备案模型的能力，不改写输出逻辑、不做自定义封装、不做提示词工程层面的深度改造、不做再训练。这种情况下，通常仅需完成属地登记并公示相关备案信息，无需按自研模型标准办理国家级大模型备案。</p>\n<p><strong>二次开发</strong>：对模型输出逻辑进行改写、做自定义封装、进行提示词工程优化或再训练。这种情况下，需按自研模型的标准办理国家级备案。</p>\n<p><strong>这个区分对我们的业务设计有直接影响。</strong> 我们的网关如果只做通道透传、路由和计量，属于纯调用范畴；但如果我们开始提供\"优化后的 prompt 模板\"\"场景化封装\"等能力，就可能落入二次开发范畴，合规义务显著加重。</p>\n<p><strong>业务纪律：任何涉及输出逻辑改写的新功能上线前，必须先做合规评估。</strong> 不能技术先上线、合规后补。</p>\n<h3>2.3 备案号公示义务（2026 年起的硬性要求）</h3>\n<p>自 2026 年起，通过 API 调用第三方大模型面向公众提供服务的应用，<strong>必须在显著位置公示</strong>以下三项信息：</p>\n<p>一是<strong>模型名称</strong>，二是<strong>国家网信办备案号</strong>，三是<strong>属地登记编号</strong>。</p>\n<p>公示位置规范为：放置于首页底部、服务协议页或\"关于我们\"板块；字体不小于正文常规字号；不得遮挡、不得折叠。</p>\n<p><strong>这一条对我们是双重意义的。</strong> 一方面我们自己的平台必须做到；另一方面，<strong>这是一个极好的销售切入点</strong>——大量客户还不知道有这个要求，我们主动告知并提供所需的模型备案文件，是建立专业形象的最快方式。</p>\n<h3>2.4 材料留存要求</h3>\n<p>必须完整留存以下档案：API 服务协议、模型备案文件、<strong>接口调用日志（不少于 6 个月）</strong>、内容审核记录。</p>\n<p><strong>6 个月的日志留存是硬性技术要求，必须在产品架构设计时就考虑存储成本。</strong> 这不是可选项，也不能事后补。</p>\n<h3>2.5 面向公众 vs 面向企业内部</h3>\n<p>面向公众提供服务的应用，合规义务完整适用。仅面向企业内部使用的应用，直接的监管义务相对较轻，但仍需满足数据安全合规要求。</p>\n<p><strong>销售必须问清楚客户的服务对象。</strong> 客户如果是 to C 产品，我们要主动提示公示义务并提供材料；如果是内部工具，可以简化说明。<strong>问错了会给客户带来实际风险。</strong></p>\n<h3>2.6 具有舆论属性或社会动员能力的服务</h3>\n<p>具有舆论属性或社会动员能力的服务，需要额外完成安全评估并提交自评估报告。内容生成、社交、资讯类客户往往落在这个范畴，销售识别到这类客户时应提示其合规义务。</p>\n<hr />\n<h2>三、经营资质清单</h2>\n<p>以下为业务开展所需的资质，具体适用性需结合最终业务形态咨询专业机构确认。</p>\n<p><strong>基础资质</strong>：营业执照（经营范围需覆盖软件和信息技术服务、技术推广等）、ICP 备案（网站上线的前提）。</p>\n<p><strong>增值电信业务经营许可证</strong>：对外提供在线服务并收费的平台通常需要，具体类别（ICP 许可证 / EDI 许可证）取决于业务形态定性，需专业判断。</p>\n<p><strong>生成式人工智能服务相关备案/登记</strong>：按第 2.2 节的\"纯调用\"与\"二次开发\"区分确定义务范围。</p>\n<p><strong>信息安全等级保护测评</strong>：服务企业客户尤其是金融、医疗、政务类客户时通常是准入前提，等级根据系统重要性确定。</p>\n<p><strong>行业性资质</strong>：视目标客户所在行业可能有额外要求。</p>\n<p><strong>给决策层的建议</strong>：资质办理周期长（部分需要数月），<strong>必须在业务规模化之前启动，不能等到客户要求时再办</strong>。建议在 0→1 阶段就把基础资质和 ICP/EDI 的申请排上日程，等保测评在首个企业客户进入商务流程时同步启动。</p>\n<hr />\n<h2>四、内容与用途风控</h2>\n<h3>4.1 客户准入审核</h3>\n<p>所有客户（包括代理商的终端客户）在开通正式服务前必须完成：主体身份核验（企业需营业执照，个人需实名）、<strong>用途声明</strong>（明确说明使用场景）、以及对高风险用途的额外审核。</p>\n<p><strong>明确拒绝服务的用途</strong>包括但不限于：违法违规内容的生成与分发、诈骗与虚假信息制作、侵犯他人合法权益的用途、以及任何要求我们协助规避监管义务的需求。</p>\n<p><strong>销售纪律：识别到明显违规用途时直接拒绝，不上报、不犹豫、不为了业绩变通。</strong> 这类客户带来的收入与它可能造成的损失完全不成比例。</p>\n<h3>4.2 运行时监控</h3>\n<p>产品层面必须具备：异常调用模式的自动识别（如短时间内的超高频调用、明显的批量违规内容特征）、可疑账号的自动限制与人工复核、以及<strong>紧急切断能力</strong>。</p>\n<p><strong>紧急切断能力必须真实可用，且响应时间以分钟计。</strong> 出事时监管部门不会等我们走内部流程。</p>\n<h3>4.3 代理商的连带风险</h3>\n<p>这是渠道体系最危险的一环。代理商可能把通道卖给违规客户，而责任会追溯到通道提供方。</p>\n<p>管控要求：代理协议中明确代理商对其终端客户的核验义务与连带责任；我们保留对所有下级账号的监控权与切断权；终端客户的实名信息必须可追溯到具体主体，<strong>不允许出现\"代理商批量开号、终端客户不可见\"的情况</strong>。</p>\n<hr />\n<h2>五、其他关键风险</h2>\n<h3>5.1 数据安全</h3>\n<p>客户通过我们的通道传输的内容可能包含商业机密或个人信息。基本原则是<strong>最小化留存</strong>：调用日志按合规要求留存元数据（时间、模型、token 数、账号），<strong>内容本身除非客户明确要求否则不做长期存储</strong>。存储的数据必须加密，访问必须有权限控制和审计记录。</p>\n<p>涉及个人信息的处理，需遵守《个人信息保护法》的相关要求。为有此类需求的客户提供私有化部署方案（网关组件部署在客户侧，数据不落我们的库）是最稳妥的解法。</p>\n<h3>5.2 资金风险</h3>\n<p><strong>预付款风险</strong>：客户预充值形成的资金属于预收账款，必须与运营资金分账管理，不得挪用。<strong>挪用客户预付款是最快的死法</strong>，一旦出现兑付困难就是刑事风险。</p>\n<p><strong>上游预付风险</strong>：详见模块 04 第四节，核心是降价保护条款、周转周期控制和资金上限。</p>\n<p><strong>坏账风险</strong>：账期客户必须有授信额度上限，超期自动停供。单一客户应收不超过总应收的 25%。</p>\n<h3>5.3 SLA 赔付风险</h3>\n<p>签署的 SLA 必须与实际架构能力匹配。<strong>赔付条款要设定单次和年度上限</strong>（常见做法是赔付以当期服务费为上限），避免一次故障造成不可承受的损失。</p>\n<h3>5.4 上游依赖风险</h3>\n<p>任何单一上游采购占比不超过 40%，每个主力模型至少两条通道（详见模块 03）。同时与上游的合同中应关注：单方终止的通知期、价格调整的提前告知义务、以及已购额度的处理方式。</p>\n<hr />\n<h2>六、合规自查清单</h2>\n<p>建议按月自查以下项目，任何一项为\"否\"都需要限期整改。</p>\n<p>平台是否已按规范公示所调用模型的名称、备案号与属地登记编号；调用日志留存是否满足 6 个月且可完整导出；所有客户是否完成主体核验与用途声明；是否存在未经审核的高风险用途客户；紧急切断能力是否经过实际演练；客户预付款是否与运营资金分账；单一上游采购占比是否超过 40%；单一客户收入占比是否超过 15%；代理商的终端客户是否全部可追溯到实名主体；已签署的 SLA 是否均在架构实际能力范围内；新上线功能是否均已完成合规评估。</p>\n<hr />\n<h2>参考来源</h2>\n<ul>\n<li><a href=\"https://www.cac.gov.cn/2023-07/13/c_1690898327029107.htm\">生成式人工智能服务管理暂行办法 - 中央网信办</a></li>\n<li><a href=\"https://help.aliyun.com/zh/model-studio/compliance-and-launch-filing-guide-for-ai-apps-powered-by-the-tongyi-model\">千问大模型应用上架合规操作 - 阿里云百炼帮助中心</a></li>\n<li><a href=\"https://www.cs003.vip/Mobile/Article/help?article_id=793\">API 调用方注意：2026 年使用第三方大模型必须公示备案号</a></li>\n<li><a href=\"https://www.cac.gov.cn/2026-05/13/c_1780413225190669.htm\">国家互联网信息办公室关于发布生成式人工智能服务已备案信息的公告 - 中央网信办</a></li>\n</ul>\n<p><strong>再次提示：本模块为业务理解与自查之用，具体合规方案请咨询专业律师及当地网信、通管部门。</strong></p>", "plain": " 模块 08 · 合规与风险控制\n\n 本模块解决的问题：什么不能碰、必须办什么、怎么不出事。\n 使用者：全员必读，决策层与法务重点关注。\n ⚠️ 本模块内容涉及监管要求，具体执行前请咨询专业律师。本文档为业务理解与自查用，不构成法律意见。\n\n\n\n 一、为什么合规是这门生意的第一优先级\n\n先说一个判断：在 AI token 转售这个行业里，合规不是成本，是分水岭。\n\n市场上存在大量野生\"API 中转站\"，它们靠低价和灵活性生存，但普遍缺乏资质、无法开票、不做日志留存、不提供备案信息。随着监管要求在 2026 年落地咬合，这批玩家会被逐步清退出企业级市场。\n\n这意味着两件事。第一，我们把合规做扎实，等于自动获得了一批竞争对手无法进入的市场——所有需要过内审、外审、供应商准入的企业客户。第二，合规做不扎实，我们不是慢慢被淘汰，而是可能一次出事就结束。\n\n监管风险与商业风险的性质不同：商业风险是渐进的、可修补的；合规风险是断崖式的、不可逆的。所以它必须排在第一位。\n\n\n\n 二、法规框架与备案要求\n\n 2.1 核心法规\n\n《生成式人工智能服务管理暂行办法》自 2023 年 8 月 15 日起施行，是这个领域的基础性规范。配套还有《生成式人工智能服务安全基本要求》、《互联网信息服务算法推荐管理规定》及相关的算法备案与安全评估要求。国家网信办定期公告已备案的生成式人工智能服务信息。\n\n 2.2 「纯调用」与「二次开发」的关键区分\n\n这是本模块最重要的一条实操知识，直接决定我们和客户各自要办什么。\n\n纯 API 调用：仅调用第三方已备案模型的能力，不改写输出逻辑、不做自定义封装、不做提示词工程层面的深度改造、不做再训练。这种情况下，通常仅需完成属地登记并公示相关备案信息，无需按自研模型标准办理国家级大模型备案。\n\n二次开发：对模型输出逻辑进行改写、做自定义封装、进行提示词工程优化或再训练。这种情况下，需按自研模型的标准办理国家级备案。\n\n这个区分对我们的业务设计有直接影响。 我们的网关如果只做通道透传、路由和计量，属于纯调用范畴；但如果我们开始提供\"优化后的 prompt 模板\"\"场景化封装\"等能力，就可能落入二次开发范畴，合规义务显著加重。\n\n业务纪律：任何涉及输出逻辑改写的新功能上线前，必须先做合规评估。 不能技术先上线、合规后补。\n\n 2.3 备案号公示义务（2026 年起的硬性要求）\n\n自 2026 年起，通过 API 调用第三方大模型面向公众提供服务的应用，必须在显著位置公示以下三项信息：\n\n一是模型名称，二是国家网信办备案号，三是属地登记编号。\n\n公示位置规范为：放置于首页底部、服务协议页或\"关于我们\"板块；字体不小于正文常规字号；不得遮挡、不得折叠。\n\n这一条对我们是双重意义的。 一方面我们自己的平台必须做到；另一方面，这是一个极好的销售切入点——大量客户还不知道有这个要求，我们主动告知并提供所需的模型备案文件，是建立专业形象的最快方式。\n\n 2.4 材料留存要求\n\n必须完整留存以下档案：API 服务协议、模型备案文件、接口调用日志（不少于 6 个月）、内容审核记录。\n\n6 个月的日志留存是硬性技术要求，必须在产品架构设计时就考虑存储成本。 这不是可选项，也不能事后补。\n\n 2.5 面向公众 vs 面向企业内部\n\n面向公众提供服务的应用，合规义务完整适用。仅面向企业内部使用的应用，直接的监管义务相对较轻，但仍需满足数据安全合规要求。\n\n销售必须问清楚客户的服务对象。 客户如果是 to C 产品，我们要主动提示公示义务并提供材料；如果是内部工具，可以简化说明。问错了会给客户带来实际风险。\n\n 2.6 具有舆论属性或社会动员能力的服务\n\n具有舆论属性或社会动员能力的服务，需要额外完成安全评估并提交自评估报告。内容生成、社交、资讯类客户往往落在这个范畴，销售识别到这类客户时应提示其合规义务。\n\n\n\n 三、经营资质清单\n\n以下为业务开展所需的资质，具体适用性需结合最终业务形态咨询专业机构确认。\n\n基础资质：营业执照（经营范围需覆盖软件和信息技术服务、技术推广等）、ICP 备案（网站上线的前提）。\n\n增值电信业务经营许可证：对外提供在线服务并收费的平台通常需要，具体类别（ICP 许可证 / EDI 许可证）取决于业务形态定性，需专业判断。\n\n生成式人工智能服务相关备案/登记：按第 2.2 节的\"纯调用\"与\"二次开发\"区分确定义务范围。\n\n信息安全等级保护测评：服务企业客户尤其是金融、医疗、政务类客户时通常是准入前提，等级根据系统重要性确定。\n\n行业性资质：视目标客户所在行业可能有额外要求。\n\n给决策层的建议：资质办理周期长（部分需要数月），必须在业务规模化之前启动，不能等到客户要求时再办。建议在 0→1 阶段就把基础资质和 ICP/EDI 的申请排上日程，等保测评在首个企业客户进入商务流程时同步启动。\n\n\n\n 四、内容与用途风控\n\n 4.1 客户准入审核\n\n所有客户（包括代理商的终端客户）在开通正式服务前必须完成：主体身份核验（企业需营业执照，个人需实名）、用途声明（明确说明使用场景）、以及对高风险用途的额外审核。\n\n明确拒绝服务的用途包括但不限于：违法违规内容的生成与分发、诈骗与虚假信息制作、侵犯他人合法权益的用途、以及任何要求我们协助规避监管义务的需求。\n\n销售纪律：识别到明显违规用途时直接拒绝，不上报、不犹豫、不为了业绩变通。 这类客户带来的收入与它可能造成的损失完全不成比例。\n\n 4.2 运行时监控\n\n产品层面必须具备：异常调用模式的自动识别（如短时间内的超高频调用、明显的批量违规内容特征）、可疑账号的自动限制与人工复核、以及紧急切断能力。\n\n紧急切断能力必须真实可用，且响应时间以分钟计。 出事时监管部门不会等我们走内部流程。\n\n 4.3 代理商的连带风险\n\n这是渠道体系最危险的一环。代理商可能把通道卖给违规客户，而责任会追溯到通道提供方。\n\n管控要求：代理协议中明确代理商对其终端客户的核验义务与连带责任；我们保留对所有下级账号的监控权与切断权；终端客户的实名信息必须可追溯到具体主体，不允许出现\"代理商批量开号、终端客户不可见\"的情况。\n\n\n\n 五、其他关键风险\n\n 5.1 数据安全\n\n客户通过我们的通道传输的内容可能包含商业机密或个人信息。基本原则是最小化留存：调用日志按合规要求留存元数据（时间、模型、token 数、账号），内容本身除非客户明确要求否则不做长期存储。存储的数据必须加密，访问必须有权限控制和审计记录。\n\n涉及个人信息的处理，需遵守《个人信息保护法》的相关要求。为有此类需求的客户提供私有化部署方案（网关组件部署在客户侧，数据不落我们的库）是最稳妥的解法。\n\n 5.2 资金风险\n\n预付款风险：客户预充值形成的资金属于预收账款，必须与运营资金分账管理，不得挪用。挪用客户预付款是最快的死法，一旦出现兑付困难就是刑事风险。\n\n上游预付风险：详见模块 04 第四节，核心是降价保护条款、周转周期控制和资金上限。\n\n坏账风险：账期客户必须有授信额度上限，超期自动停供。单一客户应收不超过总应收的 25%。\n\n 5.3 SLA 赔付风险\n\n签署的 SLA 必须与实际架构能力匹配。赔付条款要设定单次和年度上限（常见做法是赔付以当期服务费为上限），避免一次故障造成不可承受的损失。\n\n 5.4 上游依赖风险\n\n任何单一上游采购占比不超过 40%，每个主力模型至少两条通道（详见模块 03）。同时与上游的合同中应关注：单方终止的通知期、价格调整的提前告知义务、以及已购额度的处理方式。\n\n\n\n 六、合规自查清单\n\n建议按月自查以下项目，任何一项为\"否\"都需要限期整改。\n\n平台是否已按规范公示所调用模型的名称、备案号与属地登记编号；调用日志留存是否满足 6 个月且可完整导出；所有客户是否完成主体核验与用途声明；是否存在未经审核的高风险用途客户；紧急切断能力是否经过实际演练；客户预付款是否与运营资金分账；单一上游采购占比是否超过 40%；单一客户收入占比是否超过 15%；代理商的终端客户是否全部可追溯到实名主体；已签署的 SLA 是否均在架构实际能力范围内；新上线功能是否均已完成合规评估。\n\n\n\n 参考来源\n\n [生成式人工智能服务管理暂行办法  中央网信办](https://www.cac.gov.cn/202307/13/c_1690898327029107.htm)\n [千问大模型应用上架合规操作  阿里云百炼帮助中心](https://help.aliyun.com/zh/modelstudio/complianceandlaunchfilingguideforaiappspoweredbythetongyimodel)\n [API 调用方注意：2026 年使用第三方大模型必须公示备案号](https://www.cs003.vip/Mobile/Article/help?article_id=793)\n [国家互联网信息办公室关于发布生成式人工智能服务已备案信息的公告  中央网信办](https://www.cac.gov.cn/202605/13/c_1780413225190669.htm)\n\n再次提示：本模块为业务理解与自查之用，具体合规方案请咨询专业律师及当地网信、通管部门。\n"}, {"id": "09-运营SOP与客户成功", "code": "09", "title": "模块 09 · 运营 SOP 与客户成功", "short": "运营 SOP 与客户成功", "subs": ["一、客户全生命周期的六个阶段", "二、日常运营 SOP", "三、故障响应 SOP", "四、客户流失预警与挽回", "五、知识管理与内部协同"], "html": "<h1>模块 09 · 运营 SOP 与客户成功</h1>\n<blockquote>\n<p>本模块解决的问题：每天具体怎么干、每个环节谁负责、什么时候做什么动作。\n使用者：全员，尤其是新人和客户成功岗。</p>\n</blockquote>\n<hr />\n<h2>一、客户全生命周期的六个阶段</h2>\n<p>整个运营体系围绕客户生命周期展开。每个阶段有明确的负责人、标准动作、交付物和进入下一阶段的判定标准。<strong>没有判定标准的流程会变成糊涂账</strong>——销售会一直说\"在跟进中\"，而这个客户其实早就死了。</p>\n<h3>阶段一：获客（线索生成）</h3>\n<p><strong>负责人</strong>：市场 + 销售</p>\n<p><strong>渠道分工</strong>：中小客户与开发者靠内容、SEO、社区、口碑；创业公司靠社群、活动、投资机构与孵化器关系、开发者口碑；中大型企业靠直销拓展、行业活动、老客户转介绍；代理商靠定向招募与行业展会。</p>\n<p><strong>判定标准（线索 → 商机）</strong>：确认对方有真实的模型调用需求、能找到对接人、且不属于明确拒绝的用途范畴。</p>\n<p><strong>交付物</strong>：线索记录，包含来源、联系人、初步需求描述。</p>\n<hr />\n<h3>阶段二：需求诊断（首次深度接触）</h3>\n<p><strong>负责人</strong>：销售</p>\n<p><strong>标准动作</strong>：按模块 06 的\"第一段：暴露空白\"执行。必须搞清楚的六个信息点是——当前使用的模型有哪些、月度大致支出、主要应用场景、当前最大的痛点、服务对象是 to C 还是内部、决策链上有谁。</p>\n<p><strong>判定标准（商机 → POC）</strong>：客户承认存在至少一个空白点，并同意接受测试账号。</p>\n<p><strong>交付物</strong>：24 小时内发出的会谈纪要（见模块 06 第五节）。</p>\n<hr />\n<h3>阶段三：POC 与价值证明</h3>\n<p><strong>负责人</strong>：销售 + 技术支持</p>\n<p><strong>标准动作</strong>：开通测试额度 → 协助接入（目标是让客户在 1 小时内跑通第一个调用）→ 客户跑真实流量 1–2 周 → 我们出具成本分析与优化建议报告。</p>\n<p><strong>这一阶段的关键指标是\"首次成功调用时长\"。</strong> 如果客户从拿到 Key 到跑通超过一天，流失概率大幅上升。文档质量和接入体验必须持续打磨。</p>\n<p><strong>判定标准（POC → 商务）</strong>：客户确认稳定性达标，且分析报告中至少有一条优化建议被客户认可为有价值。</p>\n<p><strong>交付物</strong>：《成本分析与优化建议报告》。这是整个销售流程中最重要的交付物。</p>\n<hr />\n<h3>阶段四：商务成交</h3>\n<p><strong>负责人</strong>：销售（企业客户需业务负责人参与）</p>\n<p><strong>标准动作</strong>：方案与报价 → 内部毛利测算与审批（按模块 04 的权限表）→ 合同谈判 → 资质材料交付 → 签约与首充。</p>\n<p><strong>企业客户额外需要准备的材料包</strong>：营业执照、资质证明、模型备案文件、SLA 条款、数据安全说明、等保材料（如适用）。<strong>建议把这些做成一个标准\"合规材料包\"，需要时一次性发出，而不是客户问一样给一样。</strong></p>\n<p><strong>判定标准</strong>：合同签署且首笔款项到账。</p>\n<hr />\n<h3>阶段五：交付与上线</h3>\n<p><strong>负责人</strong>：技术支持 + 客户成功</p>\n<p><strong>标准动作</strong>：正式账号开通 → 生产环境接入指导 → 灰度切流（建议 5% → 20% → 50% → 100%，每级观察至少 48 小时）→ 监控告警配置 → 预算与熔断规则配置。</p>\n<p><strong>必须主动帮客户配置预算告警和熔断规则，不能等客户自己配。</strong> 客户不配，第一次账单超预期时怪的是我们。</p>\n<p><strong>判定标准</strong>：流量全量切换且连续 7 天无重大问题。</p>\n<hr />\n<h3>阶段六：客户成功与扩量</h3>\n<p><strong>负责人</strong>：客户成功（大客户由销售共同负责）</p>\n<p>这个阶段最容易被忽略，但<strong>公司的利润几乎全部产生在这个阶段</strong>。新客户的获取成本高、首单毛利薄，只有留存和扩量才能把这笔账算回来。</p>\n<p><strong>首月复盘（必做，销售必须参与）</strong>：对比实际用量与预估、给出成本优化建议、确认服务体验、了解下一步的业务计划。<strong>这是转介绍和扩量的最佳时机。</strong></p>\n<p><strong>常规节奏</strong>：月度用量报告自动推送；季度业务回顾（针对重点客户）；异常用量主动预警；新模型上线时主动通知并提供测试额度。</p>\n<p><strong>扩量的三个方向</strong>：横向扩场景（从一个业务线扩到其他业务线）、纵向扩深度（引导购买增值服务）、外向扩人脉（转介绍）。</p>\n<hr />\n<h2>二、日常运营 SOP</h2>\n<h3>2.1 每日必做</h3>\n<p><strong>运维值班</strong>：检查各上游通道的可用性与延迟、查看告警队列、处理夜间异常。</p>\n<p><strong>客户健康巡检</strong>：查看用量异常客户（突增或突降）。<strong>用量突降是流失的最早信号，必须当天跟进。</strong> 用量突增可能是客户业务增长（好事，跟进扩量），也可能是客户系统出 bug 在疯狂重试（坏事，必须主动提醒，否则客户收到账单会翻脸）。</p>\n<p><strong>工单响应</strong>：按承诺时效响应，超时工单必须升级。</p>\n<h3>2.2 每周必做</h3>\n<p>销售周会：过一遍所有商机的阶段变化，超过两周无进展的商机必须给出说明或降级。</p>\n<p>技术周会：过一遍稳定性数据、故障复盘、以及本周的产品改进项。</p>\n<p>渠道周会：过一遍代理商的动态、报备冲突、结算问题。</p>\n<h3>2.3 每月必做</h3>\n<p><strong>财务与毛利复盘</strong>：按模块 04 的指标体系跑一遍，重点看贡献毛利率为负的客户名单，逐个给出处置动作。</p>\n<p><strong>客户健康度评级更新</strong>：更新每个客户的服务强度标签和健康度等级。</p>\n<p><strong>合规自查</strong>：按模块 08 第六节的清单逐项自查。</p>\n<p><strong>价格数据复核</strong>：核对上游各模型的官方价格是否有变动，同步更新报价工具。<strong>这一条必须做，价格变了而我们不知道，报价就是在裸奔。</strong></p>\n<h3>2.4 每季度必做</h3>\n<p>上游合作复盘与谈判（争取折扣提升）；代理商分级评估（含降级）；战略复盘（对照模块 01 的行业阶段判断，检查市场是否在按预期演进）。</p>\n<hr />\n<h2>三、故障响应 SOP</h2>\n<p>故障响应能力是我们对客户的核心承诺之一，必须有明确流程。</p>\n<p><strong>分级标准</strong>：P0 为全平台不可用或核心通道完全中断；P1 为单一主力模型不可用或大面积性能劣化；P2 为部分功能异常或个别客户受影响；P3 为轻微问题不影响主要业务。</p>\n<p><strong>响应动作</strong>：</p>\n<p>发现故障后第一时间<strong>触发自动切换</strong>（这是产品能力，不是人工动作）。</p>\n<p><strong>P0/P1 故障必须主动通知受影响客户，不等客户发现来问。</strong> 主动告知的措辞是\"我们监测到某通道异常，已自动切换到备用通道，您的服务未受影响\"——这样的通知不仅不会造成负面印象，反而是最好的能力证明。<strong>被客户先发现的故障，损失的信任是主动告知的十倍。</strong></p>\n<p>故障恢复后 24 小时内出具复盘说明，内容包括原因、影响范围、已采取的措施、以及防止再次发生的改进项。P0 故障按 SLA 条款执行补偿。</p>\n<p><strong>故障复盘不追责个人，只追问系统缺陷。</strong> 一个追责文化的团队，下次故障会先想着掩盖。</p>\n<hr />\n<h2>四、客户流失预警与挽回</h2>\n<h3>4.1 五个流失信号</h3>\n<p><strong>用量持续下降</strong>：连续两周下降超过 30%，且无业务季节性解释。</p>\n<p><strong>充值行为变化</strong>：从大额充值转为小额多次充值，通常意味着在测试其他供应商。</p>\n<p><strong>技术咨询消失</strong>：原本活跃的技术对接人突然不再提问。</p>\n<p><strong>续约拖延</strong>：临近续约期迟迟不给明确答复。</p>\n<p><strong>投诉后沉默</strong>：投诉过某个问题，问题解决后就不再有互动——这往往意味着他心里已经做了决定。</p>\n<h3>4.2 挽回动作</h3>\n<p>发现信号后 48 小时内直接联系对接人，<strong>不要用问卷，要用电话或面谈</strong>。核心问题只有一个：<strong>\"是我们哪里做得不好，还是您那边业务有变化？\"</strong></p>\n<p>如果是我们的问题，给出具体的改进承诺和时间表，并在承诺时间内主动回报进展。如果是价格问题，评估是否值得让利（按模块 04 的审批权限）。如果是客户业务萎缩，不强留，保持良好关系并做好交接——<strong>体面的分手会带来意想不到的转介绍</strong>。</p>\n<p><strong>一条重要认知：挽回成功率随时间急剧衰减。</strong> 信号出现后一周内介入，成功率可能有五成；一个月后再介入，基本只能送别。所以流失预警必须是自动化的、每天跑的，不能靠人的印象。</p>\n<hr />\n<h2>五、知识管理与内部协同</h2>\n<p>本知识库必须是<strong>活的</strong>。三条维护机制：</p>\n<p><strong>每次客户提出我们答不上来的问题，24 小时内补进模块 10 的 FAQ。</strong> 答不上来的问题不补，下次还会答不上来。</p>\n<p><strong>每次异议处理失败（客户因为某个理由拒绝了我们），复盘后更新模块 06。</strong> 失败的话术比成功的话术更有价值。</p>\n<p><strong>每次价格、政策、法规变动，当天更新对应模块并全员通知。</strong> 用过期信息报价或做合规承诺，后果由公司承担。</p>\n<p><strong>知识库的更新责任必须落实到具体的人和岗位</strong>，不能是\"大家一起维护\"——那等于没人维护。建议由客户成功岗兼任知识库管理员，每月出一份更新摘要。</p>", "plain": " 模块 09 · 运营 SOP 与客户成功\n\n 本模块解决的问题：每天具体怎么干、每个环节谁负责、什么时候做什么动作。\n 使用者：全员，尤其是新人和客户成功岗。\n\n\n\n 一、客户全生命周期的六个阶段\n\n整个运营体系围绕客户生命周期展开。每个阶段有明确的负责人、标准动作、交付物和进入下一阶段的判定标准。没有判定标准的流程会变成糊涂账——销售会一直说\"在跟进中\"，而这个客户其实早就死了。\n\n 阶段一：获客（线索生成）\n\n负责人：市场 + 销售\n\n渠道分工：中小客户与开发者靠内容、SEO、社区、口碑；创业公司靠社群、活动、投资机构与孵化器关系、开发者口碑；中大型企业靠直销拓展、行业活动、老客户转介绍；代理商靠定向招募与行业展会。\n\n判定标准（线索 → 商机）：确认对方有真实的模型调用需求、能找到对接人、且不属于明确拒绝的用途范畴。\n\n交付物：线索记录，包含来源、联系人、初步需求描述。\n\n\n\n 阶段二：需求诊断（首次深度接触）\n\n负责人：销售\n\n标准动作：按模块 06 的\"第一段：暴露空白\"执行。必须搞清楚的六个信息点是——当前使用的模型有哪些、月度大致支出、主要应用场景、当前最大的痛点、服务对象是 to C 还是内部、决策链上有谁。\n\n判定标准（商机 → POC）：客户承认存在至少一个空白点，并同意接受测试账号。\n\n交付物：24 小时内发出的会谈纪要（见模块 06 第五节）。\n\n\n\n 阶段三：POC 与价值证明\n\n负责人：销售 + 技术支持\n\n标准动作：开通测试额度 → 协助接入（目标是让客户在 1 小时内跑通第一个调用）→ 客户跑真实流量 1–2 周 → 我们出具成本分析与优化建议报告。\n\n这一阶段的关键指标是\"首次成功调用时长\"。 如果客户从拿到 Key 到跑通超过一天，流失概率大幅上升。文档质量和接入体验必须持续打磨。\n\n判定标准（POC → 商务）：客户确认稳定性达标，且分析报告中至少有一条优化建议被客户认可为有价值。\n\n交付物：《成本分析与优化建议报告》。这是整个销售流程中最重要的交付物。\n\n\n\n 阶段四：商务成交\n\n负责人：销售（企业客户需业务负责人参与）\n\n标准动作：方案与报价 → 内部毛利测算与审批（按模块 04 的权限表）→ 合同谈判 → 资质材料交付 → 签约与首充。\n\n企业客户额外需要准备的材料包：营业执照、资质证明、模型备案文件、SLA 条款、数据安全说明、等保材料（如适用）。建议把这些做成一个标准\"合规材料包\"，需要时一次性发出，而不是客户问一样给一样。\n\n判定标准：合同签署且首笔款项到账。\n\n\n\n 阶段五：交付与上线\n\n负责人：技术支持 + 客户成功\n\n标准动作：正式账号开通 → 生产环境接入指导 → 灰度切流（建议 5% → 20% → 50% → 100%，每级观察至少 48 小时）→ 监控告警配置 → 预算与熔断规则配置。\n\n必须主动帮客户配置预算告警和熔断规则，不能等客户自己配。 客户不配，第一次账单超预期时怪的是我们。\n\n判定标准：流量全量切换且连续 7 天无重大问题。\n\n\n\n 阶段六：客户成功与扩量\n\n负责人：客户成功（大客户由销售共同负责）\n\n这个阶段最容易被忽略，但公司的利润几乎全部产生在这个阶段。新客户的获取成本高、首单毛利薄，只有留存和扩量才能把这笔账算回来。\n\n首月复盘（必做，销售必须参与）：对比实际用量与预估、给出成本优化建议、确认服务体验、了解下一步的业务计划。这是转介绍和扩量的最佳时机。\n\n常规节奏：月度用量报告自动推送；季度业务回顾（针对重点客户）；异常用量主动预警；新模型上线时主动通知并提供测试额度。\n\n扩量的三个方向：横向扩场景（从一个业务线扩到其他业务线）、纵向扩深度（引导购买增值服务）、外向扩人脉（转介绍）。\n\n\n\n 二、日常运营 SOP\n\n 2.1 每日必做\n\n运维值班：检查各上游通道的可用性与延迟、查看告警队列、处理夜间异常。\n\n客户健康巡检：查看用量异常客户（突增或突降）。用量突降是流失的最早信号，必须当天跟进。 用量突增可能是客户业务增长（好事，跟进扩量），也可能是客户系统出 bug 在疯狂重试（坏事，必须主动提醒，否则客户收到账单会翻脸）。\n\n工单响应：按承诺时效响应，超时工单必须升级。\n\n 2.2 每周必做\n\n销售周会：过一遍所有商机的阶段变化，超过两周无进展的商机必须给出说明或降级。\n\n技术周会：过一遍稳定性数据、故障复盘、以及本周的产品改进项。\n\n渠道周会：过一遍代理商的动态、报备冲突、结算问题。\n\n 2.3 每月必做\n\n财务与毛利复盘：按模块 04 的指标体系跑一遍，重点看贡献毛利率为负的客户名单，逐个给出处置动作。\n\n客户健康度评级更新：更新每个客户的服务强度标签和健康度等级。\n\n合规自查：按模块 08 第六节的清单逐项自查。\n\n价格数据复核：核对上游各模型的官方价格是否有变动，同步更新报价工具。这一条必须做，价格变了而我们不知道，报价就是在裸奔。\n\n 2.4 每季度必做\n\n上游合作复盘与谈判（争取折扣提升）；代理商分级评估（含降级）；战略复盘（对照模块 01 的行业阶段判断，检查市场是否在按预期演进）。\n\n\n\n 三、故障响应 SOP\n\n故障响应能力是我们对客户的核心承诺之一，必须有明确流程。\n\n分级标准：P0 为全平台不可用或核心通道完全中断；P1 为单一主力模型不可用或大面积性能劣化；P2 为部分功能异常或个别客户受影响；P3 为轻微问题不影响主要业务。\n\n响应动作：\n\n发现故障后第一时间触发自动切换（这是产品能力，不是人工动作）。\n\nP0/P1 故障必须主动通知受影响客户，不等客户发现来问。 主动告知的措辞是\"我们监测到某通道异常，已自动切换到备用通道，您的服务未受影响\"——这样的通知不仅不会造成负面印象，反而是最好的能力证明。被客户先发现的故障，损失的信任是主动告知的十倍。\n\n故障恢复后 24 小时内出具复盘说明，内容包括原因、影响范围、已采取的措施、以及防止再次发生的改进项。P0 故障按 SLA 条款执行补偿。\n\n故障复盘不追责个人，只追问系统缺陷。 一个追责文化的团队，下次故障会先想着掩盖。\n\n\n\n 四、客户流失预警与挽回\n\n 4.1 五个流失信号\n\n用量持续下降：连续两周下降超过 30%，且无业务季节性解释。\n\n充值行为变化：从大额充值转为小额多次充值，通常意味着在测试其他供应商。\n\n技术咨询消失：原本活跃的技术对接人突然不再提问。\n\n续约拖延：临近续约期迟迟不给明确答复。\n\n投诉后沉默：投诉过某个问题，问题解决后就不再有互动——这往往意味着他心里已经做了决定。\n\n 4.2 挽回动作\n\n发现信号后 48 小时内直接联系对接人，不要用问卷，要用电话或面谈。核心问题只有一个：\"是我们哪里做得不好，还是您那边业务有变化？\"\n\n如果是我们的问题，给出具体的改进承诺和时间表，并在承诺时间内主动回报进展。如果是价格问题，评估是否值得让利（按模块 04 的审批权限）。如果是客户业务萎缩，不强留，保持良好关系并做好交接——体面的分手会带来意想不到的转介绍。\n\n一条重要认知：挽回成功率随时间急剧衰减。 信号出现后一周内介入，成功率可能有五成；一个月后再介入，基本只能送别。所以流失预警必须是自动化的、每天跑的，不能靠人的印象。\n\n\n\n 五、知识管理与内部协同\n\n本知识库必须是活的。三条维护机制：\n\n每次客户提出我们答不上来的问题，24 小时内补进模块 10 的 FAQ。 答不上来的问题不补，下次还会答不上来。\n\n每次异议处理失败（客户因为某个理由拒绝了我们），复盘后更新模块 06。 失败的话术比成功的话术更有价值。\n\n每次价格、政策、法规变动，当天更新对应模块并全员通知。 用过期信息报价或做合规承诺，后果由公司承担。\n\n知识库的更新责任必须落实到具体的人和岗位，不能是\"大家一起维护\"——那等于没人维护。建议由客户成功岗兼任知识库管理员，每月出一份更新摘要。\n"}, {"id": "10-核心论点库与FAQ", "code": "10", "title": "模块 10 · 核心论点库与 FAQ", "short": "核心论点库与 FAQ", "subs": ["一、核心论点库", "二、常见问题 FAQ", "三、对外统一口径", "四、给智能体的使用说明"], "html": "<h1>模块 10 · 核心论点库与 FAQ</h1>\n<blockquote>\n<p>本模块解决的问题：一句话怎么说清楚、被质疑时怎么回、智能体怎么答。\n使用者：智能体训练语料、销售速查、全员统一口径。</p>\n</blockquote>\n<hr />\n<h2>一、核心论点库</h2>\n<p>以下每条论点包含四部分：<strong>论点</strong>（一句话）、<strong>论证</strong>（为什么成立）、<strong>证据</strong>（支撑事实）、<strong>边界</strong>（什么情况下不成立）。</p>\n<p><strong>边界这一栏是最重要的。</strong> 一个只会说论点不知道边界的销售或智能体，在遇到懂行的对手时会瞬间崩盘。承认边界反而是可信度的最强来源。</p>\n<hr />\n<h3>论点 1：Token 单价在跌，Token 支出在涨</h3>\n<p><strong>论证</strong>：单价下降与支出上升不矛盾，因为工作负载形态从简单问答迁移到了 Agent 循环调用与长上下文推理，单任务的 token 消耗放大了十倍到百倍，消耗量的增速远超单价的降速。</p>\n<p><strong>证据</strong>：通用模型 token 价格三年内最高降幅达 99%；同期企业 AI 运营总支出上升。Uber 向 5000 名工程师开放 AI 编程工具后四个月烧光全年预算；米哈游一位工程师做多 Agent 协作测试 13 小时产生 200 万元账单。</p>\n<p><strong>边界</strong>：这个规律适用于正在深化 AI 应用的企业。对于用量已经稳定、场景固定不再演进的客户，单价下降确实会导致其支出下降。<strong>不要对所有客户套用这条论点。</strong></p>\n<hr />\n<h3>论点 2：我们卖的不是差价，是复杂度的消除</h3>\n<p><strong>论证</strong>：客户直连官方省下的是我们的差价，但付出的是五套协议、五个账户、五份账单、五次商务、五份合规材料的隐性成本，而这些成本消耗的是工程师和财务人员的时间——企业最贵的资源。</p>\n<p><strong>证据</strong>：主流 AI 应用普遍同时使用 3 个以上模型；模型能力差异化明显（DeepSeek 性价比与推理、通义多模态、文心搜索增强、智谱 Agent 能力），单一模型无法覆盖全部场景。</p>\n<p><strong>边界</strong>：<strong>如果客户只用一个模型、用量很小、不需要发票、对稳定性不敏感，我们确实没有价值。</strong> 这类客户应该被主动识别并放弃，硬啃既不赚钱也不产生口碑。</p>\n<hr />\n<h3>论点 3：0→1 阶段的竞争不在价格，在确定性</h3>\n<p><strong>论证</strong>：初创客户的产品直接跑在模型上，一次限流就是线上事故；企业客户的决策要过内审，一次合规瑕疵就是项目搁浅。稳定性与合规的价值在事故发生后会瞬间放大，而价格的 5% 差异在任何时候都只是 5%。</p>\n<p><strong>证据</strong>：市场上大量中转站基于开源网关搭建，无企业级保活机制、无 SLA 承诺、账单无法区分缓存命中、无法提供正式发票与备案材料。</p>\n<p><strong>边界</strong>：这条论点对价格极度敏感的客户（个人开发者、极早期项目）不成立。对他们只能靠自助化的低成本服务，不能靠这套说辞。</p>\n<hr />\n<h3>论点 4：合规是准入门槛，也是竞争壁垒</h3>\n<p><strong>论证</strong>：2026 年起的公示与留存要求把大批野生中转站挡在企业市场之外。主动做合规不是增加成本，是获得一片竞争对手进不去的市场。</p>\n<p><strong>证据</strong>：自 2026 年起，通过 API 调用第三方大模型面向公众提供服务的应用必须在显著位置公示模型名称、国家网信办备案号与属地登记编号，并留存 API 服务协议、模型备案文件与 6 个月以上的接口调用日志。</p>\n<p><strong>边界</strong>：合规资质需要时间和资金，且短期内不直接产生收入。<strong>在现金流极度紧张时，合规投入的节奏需要与生存需求平衡</strong>——但基础合规（备案、日志留存、客户核验）任何时候都不能省。</p>\n<hr />\n<h3>论点 5：转售是入口，成本管理是终局</h3>\n<p><strong>论证</strong>：纯转售的毛利会被规模化玩家和厂商直销持续压缩，这是确定趋势。真正能沉淀的资产是调用数据、优化模型和场景经验。今天卖 token 是为了获取这些资产，明天靠这些资产卖管理服务。</p>\n<p><strong>证据</strong>：行业公开的对客报价普遍在官方价的 8–9 折，意味着纯转售的毛利水位在 10%–25% 且持续下行；而咨询与优化类服务的毛利率可达 50%–70%。</p>\n<p><strong>边界</strong>：这个转型需要客户规模和数据积累作为前提。<strong>在客户数不足时空谈\"管理服务\"是自欺欺人</strong>，必须先老老实实把转售规模做起来。</p>\n<hr />\n<h3>论点 6：帮客户省钱，我们才能赚更多钱</h3>\n<p><strong>论证</strong>：这看似反直觉。但客户省下的钱不会退出预算，而是会投入到更多的 AI 场景中去——省下的 40% 会变成新功能的预算。同时，能帮客户省钱的供应商是顾问，不能的只是通道，前者的粘性和定价权远高于后者。</p>\n<p><strong>证据</strong>：长上下文场景通过缓存优化通常可节省 15%–40% 成本；多数平台账单无法区分缓存命中，客户根本看不到这块空间。</p>\n<p><strong>边界</strong>：这条逻辑要求客户处于 AI 应用扩张期。<strong>对于 AI 预算固定且不打算增加的客户，帮他省钱确实会直接减少我们的收入</strong>——但这类客户的长期价值本来就有限。</p>\n<hr />\n<h3>论点 7：客户结构比客户数量更重要</h3>\n<p><strong>论证</strong>：单一客户类型的集中会把公司命运绑定在一个群体的周期上。创业公司死亡率高，大企业周期长账期长，长尾客户单价低，渠道客户有失控风险——四类客户的风险特征互补，组合起来才稳定。</p>\n<p><strong>边界</strong>：起步期资源有限，同时打四类客户会导致每一类都做不透。<strong>现实的做法是分阶段侧重，但在结构上保持警觉，不让任何一类超过 40%。</strong></p>\n<hr />\n<h3>论点 8：不做锁定，反而留得住客户</h3>\n<p><strong>论证</strong>：初创供应商最大的信任障碍是\"你会不会倒闭\"。试图用技术锁定或资金锁定留住客户，只会加重这个疑虑，让客户从一开始就不敢进来。主动提供完全兼容的协议、可退的余额、不排他的条款，把\"能走\"变成明牌，客户反而敢来。</p>\n<p><strong>边界</strong>：不做锁定意味着我们必须持续用产品和服务赢得客户，任何一次服务滑坡都可能直接导致流失。<strong>这是一条对自己要求更高的路，不是一条更轻松的路。</strong></p>\n<hr />\n<h2>二、常见问题 FAQ</h2>\n<h3>客户最常问的问题</h3>\n<p><strong>Q：你们和官方比贵多少还是便宜多少？</strong>\nA：主流模型我们通常在官方价的 90%–95% 区间，部分引流模型更低。但更值得看的是总成本——多数客户在我们这里的第一件事是发现缓存没用好，光这一项通常能省 15%–40%，远超价差。</p>\n<p><strong>Q：你们的通道是官方直连吗？</strong>\nA：分模型说明，不能一概而论。主力模型走官方代理或企业级直采通道，个别长尾模型可能走第三方聚合作为补充。<strong>每个模型的通道性质我们会如实标注，这一点不能含糊。</strong></p>\n<p><strong>Q：接入要多久？</strong>\nA：改一行 base_url 即可，协议完全兼容 OpenAI。绝大多数客户在一小时内完成首次成功调用。</p>\n<p><strong>Q：稳定性怎么保证？出问题怎么办？</strong>\nA：每个主力模型至少配置两条通道，主通道异常时网关自动切换，客户无感知。签约客户的 SLA 写进合同，未达标按条款减免服务费。P0/P1 级故障我们主动通知，不等客户发现。</p>\n<p><strong>Q：能开发票吗？</strong>\nA：可以开具正式增值税发票，专票普票均可。</p>\n<p><strong>Q：数据安全怎么保障？</strong>\nA：调用日志按合规要求留存元数据，内容本身除非客户明确要求否则不做长期存储；存储数据加密、访问有权限控制与审计。有严格数据不出域要求的客户，我们提供网关组件私有化部署方案。</p>\n<p><strong>Q：余额能退吗？有最低充值门槛吗？</strong>\nA：余额可申请退回。起步期不设最低充值门槛。</p>\n<p><strong>Q：万一你们公司出问题了，我们怎么办？</strong>\nA：我们完全兼容 OpenAI 协议，您改一行 base_url 就能切走，没有技术锁定；余额可随时申请退回；我们也不要求独家，您可以保留官方直连做备份。</p>\n<p><strong>Q：我们是 to C 产品，有什么合规要求？</strong>\nA：2026 年起，面向公众提供服务且调用第三方模型的应用，需要在首页底部、服务协议页或\"关于我们\"板块公示所用模型的名称、国家网信办备案号和属地登记编号，字体不小于正文、不遮挡不折叠；同时需留存 API 服务协议、模型备案文件和 6 个月以上的调用日志。我们会提供所需的模型备案材料。<strong>具体方案建议咨询专业律师。</strong></p>\n<p><strong>Q：我该用哪个模型？</strong>\nA：取决于场景。追求极致性价比和推理能力优先看 DeepSeek；多模态和图文音视频处理优先看通义；搜索增强场景看文心；Agent 和工具调用场景看智谱。我们可以基于您的真实调用数据做一次选型测算，这是免费的。</p>\n<hr />\n<h3>内部员工最常问的问题</h3>\n<p><strong>Q：为什么毛利这么低还要做？</strong>\nA：转售业务的作用是获客和积累数据，利润要靠增值服务和规模化后的上游折扣提升。见模块 04 第五节和模块 02 第二节。<strong>如果只把转售当终点，这门生意确实不值得做。</strong></p>\n<p><strong>Q：客户压价压到毛利只有 5%，签不签？</strong>\nA：走审批。低于 8% 必须有明确的战略理由（标杆客户、行业突破口、渠道价值），理由写进审批记录，季度复盘时验证。见模块 04 第三节。</p>\n<p><strong>Q：客户要求我们帮他绕过备案公示，怎么办？</strong>\nA：直接拒绝，不需要请示。这类客户的收入与它可能造成的损失完全不成比例。见模块 08 第四节。</p>\n<p><strong>Q：发现客户在疯狂重试导致费用暴涨，要不要提醒？</strong>\nA：<strong>当天必须提醒。</strong> 不提醒赚到的钱，会在客户收到账单时以十倍的代价还回去。见模块 09 第二节。</p>\n<p><strong>Q：竞品报价比我们低 15%，怎么跟？</strong>\nA：不跟价格，换维度。问客户三个问题：他们的 SLA 是多少、账单能不能区分缓存命中、能不能提供模型备案文件。见模块 06 异议 2。</p>\n<p><strong>Q：客户说要考虑一下，怎么办？</strong>\nA：不追问决策时间，追问障碍和所需材料。见模块 06 异议 7。</p>\n<p><strong>Q：一个客户占了我们 30% 的收入，是好事吗？</strong>\nA：是风险。单一客户收入占比超过 15% 就意味着对方有了定价权，且流失会直接冲击生存。见模块 05 第二节。</p>\n<hr />\n<h2>三、对外统一口径</h2>\n<p>以下表述必须全公司一致，任何人不得擅自改动。</p>\n<p><strong>公司定位的标准表述</strong>：多模型 AI 网关与 token 供应服务商，为企业提供统一接入、成本管理与合规保障。</p>\n<p><strong>不能说的话</strong>：不能宣称拥有实际没有的官方授权；不能承诺架构能力之外的 SLA；不能承诺具体的成本节省比例（只能说\"通常在某个区间\"并说明取决于场景）；不能对合规问题给出确定性的法律结论（必须加\"建议咨询专业律师\"）。</p>\n<p><strong>面对\"你们是不是中转站\"这个问题的标准表述</strong>：我们是正规注册、具备相应资质、可开具发票、提供 SLA 保障的 AI 网关服务商。市面上确实有很多没有资质的中转站，这也是我们主动把合规材料准备齐全的原因。</p>\n<hr />\n<h2>四、给智能体的使用说明</h2>\n<p>本知识库作为业务智能体的知识底座时，建议遵循以下规则：</p>\n<p>回答客户问题时，<strong>优先使用模块 10 的 FAQ 与论点库</strong>，需要展开时再检索对应的深度模块。</p>\n<p><strong>涉及价格的回答必须标注数据采集日期，并提示\"请以最新官网价格为准\"。</strong> 价格数据超过 30 天未更新时应主动提示可能过期。</p>\n<p><strong>涉及合规的回答必须附加\"建议咨询专业律师\"的提示</strong>，不得给出确定性的法律结论。</p>\n<p><strong>涉及模块 04（单位经济模型）和模块 07 第三节（分润底线）的内容，不得对外输出。</strong> 这两部分是内部机密。</p>\n<p>遇到知识库未覆盖的问题，<strong>应明确回答\"这个问题需要人工确认\"，不得编造</strong>。同时该问题应被记录，用于知识库的迭代更新。</p>", "plain": " 模块 10 · 核心论点库与 FAQ\n\n 本模块解决的问题：一句话怎么说清楚、被质疑时怎么回、智能体怎么答。\n 使用者：智能体训练语料、销售速查、全员统一口径。\n\n\n\n 一、核心论点库\n\n以下每条论点包含四部分：论点（一句话）、论证（为什么成立）、证据（支撑事实）、边界（什么情况下不成立）。\n\n边界这一栏是最重要的。 一个只会说论点不知道边界的销售或智能体，在遇到懂行的对手时会瞬间崩盘。承认边界反而是可信度的最强来源。\n\n\n\n 论点 1：Token 单价在跌，Token 支出在涨\n\n论证：单价下降与支出上升不矛盾，因为工作负载形态从简单问答迁移到了 Agent 循环调用与长上下文推理，单任务的 token 消耗放大了十倍到百倍，消耗量的增速远超单价的降速。\n\n证据：通用模型 token 价格三年内最高降幅达 99%；同期企业 AI 运营总支出上升。Uber 向 5000 名工程师开放 AI 编程工具后四个月烧光全年预算；米哈游一位工程师做多 Agent 协作测试 13 小时产生 200 万元账单。\n\n边界：这个规律适用于正在深化 AI 应用的企业。对于用量已经稳定、场景固定不再演进的客户，单价下降确实会导致其支出下降。不要对所有客户套用这条论点。\n\n\n\n 论点 2：我们卖的不是差价，是复杂度的消除\n\n论证：客户直连官方省下的是我们的差价，但付出的是五套协议、五个账户、五份账单、五次商务、五份合规材料的隐性成本，而这些成本消耗的是工程师和财务人员的时间——企业最贵的资源。\n\n证据：主流 AI 应用普遍同时使用 3 个以上模型；模型能力差异化明显（DeepSeek 性价比与推理、通义多模态、文心搜索增强、智谱 Agent 能力），单一模型无法覆盖全部场景。\n\n边界：如果客户只用一个模型、用量很小、不需要发票、对稳定性不敏感，我们确实没有价值。 这类客户应该被主动识别并放弃，硬啃既不赚钱也不产生口碑。\n\n\n\n 论点 3：0→1 阶段的竞争不在价格，在确定性\n\n论证：初创客户的产品直接跑在模型上，一次限流就是线上事故；企业客户的决策要过内审，一次合规瑕疵就是项目搁浅。稳定性与合规的价值在事故发生后会瞬间放大，而价格的 5% 差异在任何时候都只是 5%。\n\n证据：市场上大量中转站基于开源网关搭建，无企业级保活机制、无 SLA 承诺、账单无法区分缓存命中、无法提供正式发票与备案材料。\n\n边界：这条论点对价格极度敏感的客户（个人开发者、极早期项目）不成立。对他们只能靠自助化的低成本服务，不能靠这套说辞。\n\n\n\n 论点 4：合规是准入门槛，也是竞争壁垒\n\n论证：2026 年起的公示与留存要求把大批野生中转站挡在企业市场之外。主动做合规不是增加成本，是获得一片竞争对手进不去的市场。\n\n证据：自 2026 年起，通过 API 调用第三方大模型面向公众提供服务的应用必须在显著位置公示模型名称、国家网信办备案号与属地登记编号，并留存 API 服务协议、模型备案文件与 6 个月以上的接口调用日志。\n\n边界：合规资质需要时间和资金，且短期内不直接产生收入。在现金流极度紧张时，合规投入的节奏需要与生存需求平衡——但基础合规（备案、日志留存、客户核验）任何时候都不能省。\n\n\n\n 论点 5：转售是入口，成本管理是终局\n\n论证：纯转售的毛利会被规模化玩家和厂商直销持续压缩，这是确定趋势。真正能沉淀的资产是调用数据、优化模型和场景经验。今天卖 token 是为了获取这些资产，明天靠这些资产卖管理服务。\n\n证据：行业公开的对客报价普遍在官方价的 8–9 折，意味着纯转售的毛利水位在 10%–25% 且持续下行；而咨询与优化类服务的毛利率可达 50%–70%。\n\n边界：这个转型需要客户规模和数据积累作为前提。在客户数不足时空谈\"管理服务\"是自欺欺人，必须先老老实实把转售规模做起来。\n\n\n\n 论点 6：帮客户省钱，我们才能赚更多钱\n\n论证：这看似反直觉。但客户省下的钱不会退出预算，而是会投入到更多的 AI 场景中去——省下的 40% 会变成新功能的预算。同时，能帮客户省钱的供应商是顾问，不能的只是通道，前者的粘性和定价权远高于后者。\n\n证据：长上下文场景通过缓存优化通常可节省 15%–40% 成本；多数平台账单无法区分缓存命中，客户根本看不到这块空间。\n\n边界：这条逻辑要求客户处于 AI 应用扩张期。对于 AI 预算固定且不打算增加的客户，帮他省钱确实会直接减少我们的收入——但这类客户的长期价值本来就有限。\n\n\n\n 论点 7：客户结构比客户数量更重要\n\n论证：单一客户类型的集中会把公司命运绑定在一个群体的周期上。创业公司死亡率高，大企业周期长账期长，长尾客户单价低，渠道客户有失控风险——四类客户的风险特征互补，组合起来才稳定。\n\n边界：起步期资源有限，同时打四类客户会导致每一类都做不透。现实的做法是分阶段侧重，但在结构上保持警觉，不让任何一类超过 40%。\n\n\n\n 论点 8：不做锁定，反而留得住客户\n\n论证：初创供应商最大的信任障碍是\"你会不会倒闭\"。试图用技术锁定或资金锁定留住客户，只会加重这个疑虑，让客户从一开始就不敢进来。主动提供完全兼容的协议、可退的余额、不排他的条款，把\"能走\"变成明牌，客户反而敢来。\n\n边界：不做锁定意味着我们必须持续用产品和服务赢得客户，任何一次服务滑坡都可能直接导致流失。这是一条对自己要求更高的路，不是一条更轻松的路。\n\n\n\n 二、常见问题 FAQ\n\n 客户最常问的问题\n\nQ：你们和官方比贵多少还是便宜多少？\nA：主流模型我们通常在官方价的 90%–95% 区间，部分引流模型更低。但更值得看的是总成本——多数客户在我们这里的第一件事是发现缓存没用好，光这一项通常能省 15%–40%，远超价差。\n\nQ：你们的通道是官方直连吗？\nA：分模型说明，不能一概而论。主力模型走官方代理或企业级直采通道，个别长尾模型可能走第三方聚合作为补充。每个模型的通道性质我们会如实标注，这一点不能含糊。\n\nQ：接入要多久？\nA：改一行 base_url 即可，协议完全兼容 OpenAI。绝大多数客户在一小时内完成首次成功调用。\n\nQ：稳定性怎么保证？出问题怎么办？\nA：每个主力模型至少配置两条通道，主通道异常时网关自动切换，客户无感知。签约客户的 SLA 写进合同，未达标按条款减免服务费。P0/P1 级故障我们主动通知，不等客户发现。\n\nQ：能开发票吗？\nA：可以开具正式增值税发票，专票普票均可。\n\nQ：数据安全怎么保障？\nA：调用日志按合规要求留存元数据，内容本身除非客户明确要求否则不做长期存储；存储数据加密、访问有权限控制与审计。有严格数据不出域要求的客户，我们提供网关组件私有化部署方案。\n\nQ：余额能退吗？有最低充值门槛吗？\nA：余额可申请退回。起步期不设最低充值门槛。\n\nQ：万一你们公司出问题了，我们怎么办？\nA：我们完全兼容 OpenAI 协议，您改一行 base_url 就能切走，没有技术锁定；余额可随时申请退回；我们也不要求独家，您可以保留官方直连做备份。\n\nQ：我们是 to C 产品，有什么合规要求？\nA：2026 年起，面向公众提供服务且调用第三方模型的应用，需要在首页底部、服务协议页或\"关于我们\"板块公示所用模型的名称、国家网信办备案号和属地登记编号，字体不小于正文、不遮挡不折叠；同时需留存 API 服务协议、模型备案文件和 6 个月以上的调用日志。我们会提供所需的模型备案材料。具体方案建议咨询专业律师。\n\nQ：我该用哪个模型？\nA：取决于场景。追求极致性价比和推理能力优先看 DeepSeek；多模态和图文音视频处理优先看通义；搜索增强场景看文心；Agent 和工具调用场景看智谱。我们可以基于您的真实调用数据做一次选型测算，这是免费的。\n\n\n\n 内部员工最常问的问题\n\nQ：为什么毛利这么低还要做？\nA：转售业务的作用是获客和积累数据，利润要靠增值服务和规模化后的上游折扣提升。见模块 04 第五节和模块 02 第二节。如果只把转售当终点，这门生意确实不值得做。\n\nQ：客户压价压到毛利只有 5%，签不签？\nA：走审批。低于 8% 必须有明确的战略理由（标杆客户、行业突破口、渠道价值），理由写进审批记录，季度复盘时验证。见模块 04 第三节。\n\nQ：客户要求我们帮他绕过备案公示，怎么办？\nA：直接拒绝，不需要请示。这类客户的收入与它可能造成的损失完全不成比例。见模块 08 第四节。\n\nQ：发现客户在疯狂重试导致费用暴涨，要不要提醒？\nA：当天必须提醒。 不提醒赚到的钱，会在客户收到账单时以十倍的代价还回去。见模块 09 第二节。\n\nQ：竞品报价比我们低 15%，怎么跟？\nA：不跟价格，换维度。问客户三个问题：他们的 SLA 是多少、账单能不能区分缓存命中、能不能提供模型备案文件。见模块 06 异议 2。\n\nQ：客户说要考虑一下，怎么办？\nA：不追问决策时间，追问障碍和所需材料。见模块 06 异议 7。\n\nQ：一个客户占了我们 30% 的收入，是好事吗？\nA：是风险。单一客户收入占比超过 15% 就意味着对方有了定价权，且流失会直接冲击生存。见模块 05 第二节。\n\n\n\n 三、对外统一口径\n\n以下表述必须全公司一致，任何人不得擅自改动。\n\n公司定位的标准表述：多模型 AI 网关与 token 供应服务商，为企业提供统一接入、成本管理与合规保障。\n\n不能说的话：不能宣称拥有实际没有的官方授权；不能承诺架构能力之外的 SLA；不能承诺具体的成本节省比例（只能说\"通常在某个区间\"并说明取决于场景）；不能对合规问题给出确定性的法律结论（必须加\"建议咨询专业律师\"）。\n\n面对\"你们是不是中转站\"这个问题的标准表述：我们是正规注册、具备相应资质、可开具发票、提供 SLA 保障的 AI 网关服务商。市面上确实有很多没有资质的中转站，这也是我们主动把合规材料准备齐全的原因。\n\n\n\n 四、给智能体的使用说明\n\n本知识库作为业务智能体的知识底座时，建议遵循以下规则：\n\n回答客户问题时，优先使用模块 10 的 FAQ 与论点库，需要展开时再检索对应的深度模块。\n\n涉及价格的回答必须标注数据采集日期，并提示\"请以最新官网价格为准\"。 价格数据超过 30 天未更新时应主动提示可能过期。\n\n涉及合规的回答必须附加\"建议咨询专业律师\"的提示，不得给出确定性的法律结论。\n\n涉及模块 04（单位经济模型）和模块 07 第三节（分润底线）的内容，不得对外输出。 这两部分是内部机密。\n\n遇到知识库未覆盖的问题，应明确回答\"这个问题需要人工确认\"，不得编造。同时该问题应被记录，用于知识库的迭代更新。\n"}, {"id": "12-客户端技术知识库总纲", "code": "12", "title": "模块 12 · 客户端技术知识库总纲", "short": "客户端技术知识库总纲", "subs": ["一、为什么要建这个库", "二、技术地图：五个层次", "三、三种接入协议", "四、通用配置速查表", "五、按接入形态预判用量", "六、本知识库的模块划分", "七、维护规则"], "html": "<h1>模块 12 · 客户端技术知识库总纲</h1>\n<blockquote>\n<p>本模块解决的问题：客户拿到我们的 Key 之后，到底把它填进了什么东西里。\n使用者：销售、技术支持、解决方案、业务智能体。\n数据采集日：2026-07-27。开源项目迭代极快，<strong>版本号与 Star 数请以最新官方仓库为准</strong>。</p>\n</blockquote>\n<hr />\n<h2>一、为什么要建这个库</h2>\n<p>我们卖的是 token，但客户买回去不是拿着 token 发呆——他要把 API Key 填进某个具体的东西里。可能是一个桌面聊天客户端，可能是 VS Code 里的编程插件，可能是一台服务器上跑着的自托管 Agent，也可能是一整套企业内部的 AI 应用编排平台。</p>\n<p><strong>这个\"填进去的东西\"，决定了三件对我们至关重要的事：</strong></p>\n<p>第一，<strong>它决定了 token 怎么烧。</strong> 一个桌面聊天客户端一个月可能消耗几百万 token，一个多 Agent 循环调用的编程助手一天就能烧掉几千万。同样是一个客户，接入形态不同，收入量级差两三个数量级。不了解客户用什么，就无法预判他的用量，也就无法做容量规划和授信判断。</p>\n<p>第二，<strong>它决定了我们的技术支持成本。</strong> 客户接不上来的时候，问题九成不在我们的网关，而在他那个工具的配置方式——base_url 末尾要不要加 <code>/v1</code>、模型 ID 要不要带厂商前缀、用 OpenAI 协议还是 Anthropic 原生协议。<strong>技术支持人员如果不懂这些工具，每一个接入问题都要来回三五轮。</strong> 这些工时是实打实的成本，直接吃掉贡献毛利（见模块 04 的服务强度）。</p>\n<p>第三，<strong>它决定了销售能不能对上话。</strong> 一个客户说\"我们团队在用 Cline\"，销售如果能立刻接上\"那你们的 token 消耗应该主要在长上下文重传上，试过把系统提示词做缓存吗\"，这场对话的性质就完全不同了。<strong>懂客户的工具，是从\"卖 token 的\"变成\"懂行的人\"最快的路径。</strong></p>\n<p>一句话概括本模块的定位：<strong>这不是技术文档的搬运，是把技术信息翻译成业务信号。</strong> 每个项目都要回答\"它是什么\"和\"它对我们意味着什么\"两个问题，后者比前者重要。</p>\n<hr />\n<h2>二、技术地图：五个层次</h2>\n<p>客户侧的 AI 技术栈可以分成五层。理解这个分层，就能在客户报出任何一个工具名时，立刻定位它在哪一层、大概什么量级、该问什么问题。</p>\n<p><strong>第一层 · 桌面客户端</strong>：Cherry Studio、ChatBox、LobeChat、Open WebUI。个人或小团队直接和模型对话的入口，最接近\"消费级\"。用量小、笔数多、几乎不需要人工服务，是长尾客户的主要形态。</p>\n<p><strong>第二层 · 编程 Agent</strong>：Claude Code、Cursor、Cline、Roo Code。跑在 IDE 或终端里，为写代码服务。<strong>这一层是当下 token 消耗最猛、最不可预测、也最容易失控的地方</strong>，Uber 四个月烧光全年预算的案例就出自这一层。</p>\n<p><strong>第三层 · 自托管 Agent 与助手</strong>：Hermes Agent、OpenClaw、OpenManus。跑在服务器上、有持久记忆、能自主执行任务的通用助手。这一层的特点是<strong>长期在线 + 定时任务 + 多轮自我循环</strong>，消耗曲线是持续的而非脉冲的。</p>\n<p><strong>第四层 · 应用编排平台</strong>：Dify、Coze、FastGPT、n8n、RAGFlow。企业搭建自己的 AI 应用时的底座，一个平台后面可能挂着几十个业务流程。<strong>这一层是企业客户的主要形态</strong>，单客户量大、决策链长、粘性高。</p>\n<p><strong>第五层 · API 网关与中转</strong>：New API、One API、LiteLLM。这一层比较特殊——<strong>它既是客户可能用的东西，也是我们自己的业务本体</strong>。客户如果自建了 New API，说明他已经在做多模型管理，我们要么成为他的上游渠道之一，要么说服他用我们的托管服务替代自建。</p>\n<p>从第一层到第四层，客单价、决策复杂度、服务成本、粘性全部递增。<strong>销售资源应该优先投向第三、四层，第一层靠自助，第二层靠内容和口碑。</strong></p>\n<hr />\n<h2>三、三种接入协议</h2>\n<p>几乎所有客户端工具，接我们的网关都是走这三种协议之一。<strong>技术支持必须能在 30 秒内判断客户用的是哪一种</strong>，因为 base_url 的写法完全不同。</p>\n<p><strong>OpenAI 兼容协议（最通用）</strong>：绝大多数工具的默认选项。base_url 通常填到 <code>/v1</code> 结尾，例如 <code>https://api.你的域名/v1</code>。调用非 OpenAI 的模型时，模型 ID 往往需要带厂商前缀，例如 <code>anthropic/claude-...</code> 或 <code>deepseek/deepseek-v4</code>——<strong>前缀写法各家网关不一致，这是接入失败的头号原因</strong>，我们的文档必须把自己的写法写死写清楚。</p>\n<p><strong>Anthropic 原生协议</strong>：Claude Code、Cline 的 Anthropic 模式等使用。base_url 通常不带 <code>/v1</code>，而是指向一个专门的 Anthropic 端点，例如 <code>https://api.你的域名/anthropic</code>。认证头也不同（<code>x-api-key</code> 而非 <code>Authorization: Bearer</code>）。<strong>原生支持这个协议是我们区别于低端中转站的关键能力之一</strong>——靠中间件转译会丢字段，导致 tool use 行为异常。</p>\n<p><strong>Gemini 原生协议</strong>：使用面较窄，但部分多模态场景需要。</p>\n<p>一条销售可以直接用的话术：<strong>\"我们三种协议都是原生支持的，不做中间件转译。很多中转站只支持 OpenAI 协议，你用 Claude Code 或者需要 function calling 的时候就会出各种莫名其妙的问题。\"</strong></p>\n<hr />\n<h2>四、通用配置速查表</h2>\n<p>技术支持的第一页纸。客户报出工具名，直接照这张表回答。</p>\n<table>\n<thead>\n<tr>\n<th>工具</th>\n<th>配置位置</th>\n<th>协议</th>\n<th>base_url 写法</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Claude Code</td>\n<td>环境变量或 <code>~/.claude/settings.json</code></td>\n<td>Anthropic 原生</td>\n<td><code>https://api.域名/anthropic</code></td>\n</tr>\n<tr>\n<td>Cursor</td>\n<td><code>Cmd+,</code> → Models → Override Base URL</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>Cline</td>\n<td>侧栏齿轮 → API Provider</td>\n<td>两者皆可</td>\n<td>视所选 Provider</td>\n</tr>\n<tr>\n<td>Roo Code</td>\n<td>侧栏设置 → Provider</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>Cherry Studio</td>\n<td>设置 → 模型服务 → 添加供应商</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>ChatBox</td>\n<td>设置 → 模型 → 自定义 API</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>Open WebUI</td>\n<td>管理面板 → 连接 → OpenAI API</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>Hermes Agent</td>\n<td><code>~/.hermes/</code> 配置，选自定义 Provider</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>OpenClaw</td>\n<td><code>~/.openclaw/openclaw.json</code> + 环境变量</td>\n<td>视模型而定</td>\n<td>视协议而定</td>\n</tr>\n<tr>\n<td>OpenManus</td>\n<td><code>config/config.toml</code></td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>Dify</td>\n<td>设置 → 模型供应商 → OpenAI-API-compatible</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>FastGPT</td>\n<td><code>config.json</code> 模型配置 + 环境变量</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n<tr>\n<td>New API（客户自建）</td>\n<td>渠道管理 → 新建渠道</td>\n<td>OpenAI 兼容</td>\n<td><code>https://api.域名/v1</code></td>\n</tr>\n</tbody>\n</table>\n<p><strong>三个高频报错的标准答复：</strong></p>\n<p><code>401 Unauthorized</code> — Key 错了，或者用错了协议对应的认证头。先确认协议选对没有。</p>\n<p><code>404 Not Found</code> — 十有八九是 base_url 结尾的 <code>/v1</code> 多了或少了。OpenAI 协议要有，Anthropic 端点不要。</p>\n<p><code>模型不存在</code> — 模型 ID 写法不对，多半是厂商前缀问题。让客户从控制台的模型列表里直接复制。</p>\n<hr />\n<h2>五、按接入形态预判用量</h2>\n<p>这张表是销售做容量规划和授信判断的依据。数量级是经验区间，<strong>不是承诺值</strong>，实际差异可以很大。</p>\n<table>\n<thead>\n<tr>\n<th>接入形态</th>\n<th>单用户月消耗量级</th>\n<th>波动特征</th>\n<th>授信建议</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>桌面客户端（个人）</td>\n<td>十万～百万 token</td>\n<td>平稳，随使用习惯</td>\n<td>纯预付，不给账期</td>\n</tr>\n<tr>\n<td>桌面客户端（小团队）</td>\n<td>百万～千万</td>\n<td>平稳，随人数线性</td>\n<td>纯预付</td>\n</tr>\n<tr>\n<td>编程 Agent（单人）</td>\n<td>千万～亿级</td>\n<td><strong>剧烈波动，可能单日翻十倍</strong></td>\n<td>预付 + 强制预算熔断</td>\n</tr>\n<tr>\n<td>编程 Agent（团队）</td>\n<td>亿级以上</td>\n<td>同上，且叠加人数</td>\n<td>必须配部门预算与告警</td>\n</tr>\n<tr>\n<td>自托管 Agent（常驻）</td>\n<td>千万～亿级</td>\n<td>持续型，定时任务叠加</td>\n<td>预付 + 异常调用监控</td>\n</tr>\n<tr>\n<td>应用编排平台（企业）</td>\n<td>千万～十亿级</td>\n<td>随业务量，可预测性较好</td>\n<td>可给账期，需授信额度</td>\n</tr>\n<tr>\n<td>客户自建网关（转售）</td>\n<td>视其下游而定</td>\n<td>不可控</td>\n<td>按渠道政策管理，见模块 07</td>\n</tr>\n</tbody>\n</table>\n<p><strong>最重要的一条判断规则：凡是涉及 Agent 循环调用的形态（第二、三层），必须在开户时就把预算上限和熔断规则配好，不能等客户自己想起来。</strong> 这类客户的第一张账单如果超出预期三倍，流失概率极高——而这本来是可以避免的。</p>\n<hr />\n<h2>六、本知识库的模块划分</h2>\n<table>\n<thead>\n<tr>\n<th>模块</th>\n<th>覆盖项目</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>13 · 自托管 Agent 与通用助手</td>\n<td>Hermes Agent、OpenClaw、OpenManus、Manus</td>\n</tr>\n<tr>\n<td>14 · API 网关与中转系统</td>\n<td>New API、One API、LiteLLM</td>\n</tr>\n<tr>\n<td>15 · 桌面客户端</td>\n<td>Cherry Studio、ChatBox、LobeChat、Open WebUI</td>\n</tr>\n<tr>\n<td>16 · 编程 Agent</td>\n<td>Claude Code、Cursor、Cline、Roo Code</td>\n</tr>\n<tr>\n<td>17 · 应用编排平台</td>\n<td>Dify、Coze、FastGPT、n8n、RAGFlow</td>\n</tr>\n</tbody>\n</table>\n<p>每个项目按统一结构撰写：<strong>是什么 → 架构与关键机制 → 部署方式 → 接我们网关的具体配置 → token 消耗特征 → 客户画像与销售切入点 → 风险与注意事项。</strong></p>\n<p>其中最后三节是本知识库区别于普通技术文档的地方，也是销售应该重点读的部分。</p>\n<hr />\n<h2>七、维护规则</h2>\n<p><strong>开源项目的迭代速度远超商业软件</strong>，本模块的三条维护纪律：</p>\n<p><strong>Star 数、版本号、具体配置项按季度复核。</strong> 配置路径变更会直接导致技术支持给出错误指引，这类错误对专业形象的伤害极大。</p>\n<p><strong>新工具出现时先记录再补全。</strong> 客户提到我们不认识的工具，当天先在模块末尾登记名称和客户描述，一周内补全档案。<strong>答不上来不可怕，两次答不上同一个问题才可怕。</strong></p>\n<p><strong>每次技术支持解决一个新的接入问题，把解法补进对应项目的配置章节。</strong> 支持工单是这个库最好的素材来源。</p>", "plain": " 模块 12 · 客户端技术知识库总纲\n\n 本模块解决的问题：客户拿到我们的 Key 之后，到底把它填进了什么东西里。\n 使用者：销售、技术支持、解决方案、业务智能体。\n 数据采集日：20260727。开源项目迭代极快，版本号与 Star 数请以最新官方仓库为准。\n\n\n\n 一、为什么要建这个库\n\n我们卖的是 token，但客户买回去不是拿着 token 发呆——他要把 API Key 填进某个具体的东西里。可能是一个桌面聊天客户端，可能是 VS Code 里的编程插件，可能是一台服务器上跑着的自托管 Agent，也可能是一整套企业内部的 AI 应用编排平台。\n\n这个\"填进去的东西\"，决定了三件对我们至关重要的事：\n\n第一，它决定了 token 怎么烧。 一个桌面聊天客户端一个月可能消耗几百万 token，一个多 Agent 循环调用的编程助手一天就能烧掉几千万。同样是一个客户，接入形态不同，收入量级差两三个数量级。不了解客户用什么，就无法预判他的用量，也就无法做容量规划和授信判断。\n\n第二，它决定了我们的技术支持成本。 客户接不上来的时候，问题九成不在我们的网关，而在他那个工具的配置方式——base_url 末尾要不要加 /v1、模型 ID 要不要带厂商前缀、用 OpenAI 协议还是 Anthropic 原生协议。技术支持人员如果不懂这些工具，每一个接入问题都要来回三五轮。 这些工时是实打实的成本，直接吃掉贡献毛利（见模块 04 的服务强度）。\n\n第三，它决定了销售能不能对上话。 一个客户说\"我们团队在用 Cline\"，销售如果能立刻接上\"那你们的 token 消耗应该主要在长上下文重传上，试过把系统提示词做缓存吗\"，这场对话的性质就完全不同了。懂客户的工具，是从\"卖 token 的\"变成\"懂行的人\"最快的路径。\n\n一句话概括本模块的定位：这不是技术文档的搬运，是把技术信息翻译成业务信号。 每个项目都要回答\"它是什么\"和\"它对我们意味着什么\"两个问题，后者比前者重要。\n\n\n\n 二、技术地图：五个层次\n\n客户侧的 AI 技术栈可以分成五层。理解这个分层，就能在客户报出任何一个工具名时，立刻定位它在哪一层、大概什么量级、该问什么问题。\n\n第一层 · 桌面客户端：Cherry Studio、ChatBox、LobeChat、Open WebUI。个人或小团队直接和模型对话的入口，最接近\"消费级\"。用量小、笔数多、几乎不需要人工服务，是长尾客户的主要形态。\n\n第二层 · 编程 Agent：Claude Code、Cursor、Cline、Roo Code。跑在 IDE 或终端里，为写代码服务。这一层是当下 token 消耗最猛、最不可预测、也最容易失控的地方，Uber 四个月烧光全年预算的案例就出自这一层。\n\n第三层 · 自托管 Agent 与助手：Hermes Agent、OpenClaw、OpenManus。跑在服务器上、有持久记忆、能自主执行任务的通用助手。这一层的特点是长期在线 + 定时任务 + 多轮自我循环，消耗曲线是持续的而非脉冲的。\n\n第四层 · 应用编排平台：Dify、Coze、FastGPT、n8n、RAGFlow。企业搭建自己的 AI 应用时的底座，一个平台后面可能挂着几十个业务流程。这一层是企业客户的主要形态，单客户量大、决策链长、粘性高。\n\n第五层 · API 网关与中转：New API、One API、LiteLLM。这一层比较特殊——它既是客户可能用的东西，也是我们自己的业务本体。客户如果自建了 New API，说明他已经在做多模型管理，我们要么成为他的上游渠道之一，要么说服他用我们的托管服务替代自建。\n\n从第一层到第四层，客单价、决策复杂度、服务成本、粘性全部递增。销售资源应该优先投向第三、四层，第一层靠自助，第二层靠内容和口碑。\n\n\n\n 三、三种接入协议\n\n几乎所有客户端工具，接我们的网关都是走这三种协议之一。技术支持必须能在 30 秒内判断客户用的是哪一种，因为 base_url 的写法完全不同。\n\nOpenAI 兼容协议（最通用）：绝大多数工具的默认选项。base_url 通常填到 /v1 结尾，例如 https://api.你的域名/v1。调用非 OpenAI 的模型时，模型 ID 往往需要带厂商前缀，例如 anthropic/claude... 或 deepseek/deepseekv4——前缀写法各家网关不一致，这是接入失败的头号原因，我们的文档必须把自己的写法写死写清楚。\n\nAnthropic 原生协议：Claude Code、Cline 的 Anthropic 模式等使用。base_url 通常不带 /v1，而是指向一个专门的 Anthropic 端点，例如 https://api.你的域名/anthropic。认证头也不同（xapikey 而非 Authorization: Bearer）。原生支持这个协议是我们区别于低端中转站的关键能力之一——靠中间件转译会丢字段，导致 tool use 行为异常。\n\nGemini 原生协议：使用面较窄，但部分多模态场景需要。\n\n一条销售可以直接用的话术：\"我们三种协议都是原生支持的，不做中间件转译。很多中转站只支持 OpenAI 协议，你用 Claude Code 或者需要 function calling 的时候就会出各种莫名其妙的问题。\"\n\n\n\n 四、通用配置速查表\n\n技术支持的第一页纸。客户报出工具名，直接照这张表回答。\n\n 工具  配置位置  协议  base_url 写法 \n\n Claude Code  环境变量或 ~/.claude/settings.json  Anthropic 原生  https://api.域名/anthropic \n Cursor  Cmd+, → Models → Override Base URL  OpenAI 兼容  https://api.域名/v1 \n Cline  侧栏齿轮 → API Provider  两者皆可  视所选 Provider \n Roo Code  侧栏设置 → Provider  OpenAI 兼容  https://api.域名/v1 \n Cherry Studio  设置 → 模型服务 → 添加供应商  OpenAI 兼容  https://api.域名/v1 \n ChatBox  设置 → 模型 → 自定义 API  OpenAI 兼容  https://api.域名/v1 \n Open WebUI  管理面板 → 连接 → OpenAI API  OpenAI 兼容  https://api.域名/v1 \n Hermes Agent  ~/.hermes/ 配置，选自定义 Provider  OpenAI 兼容  https://api.域名/v1 \n OpenClaw  ~/.openclaw/openclaw.json + 环境变量  视模型而定  视协议而定 \n OpenManus  config/config.toml  OpenAI 兼容  https://api.域名/v1 \n Dify  设置 → 模型供应商 → OpenAIAPIcompatible  OpenAI 兼容  https://api.域名/v1 \n FastGPT  config.json 模型配置 + 环境变量  OpenAI 兼容  https://api.域名/v1 \n New API（客户自建）  渠道管理 → 新建渠道  OpenAI 兼容  https://api.域名/v1 \n\n三个高频报错的标准答复：\n\n401 Unauthorized — Key 错了，或者用错了协议对应的认证头。先确认协议选对没有。\n\n404 Not Found — 十有八九是 base_url 结尾的 /v1 多了或少了。OpenAI 协议要有，Anthropic 端点不要。\n\n模型不存在 — 模型 ID 写法不对，多半是厂商前缀问题。让客户从控制台的模型列表里直接复制。\n\n\n\n 五、按接入形态预判用量\n\n这张表是销售做容量规划和授信判断的依据。数量级是经验区间，不是承诺值，实际差异可以很大。\n\n 接入形态  单用户月消耗量级  波动特征  授信建议 \n\n 桌面客户端（个人）  十万～百万 token  平稳，随使用习惯  纯预付，不给账期 \n 桌面客户端（小团队）  百万～千万  平稳，随人数线性  纯预付 \n 编程 Agent（单人）  千万～亿级  剧烈波动，可能单日翻十倍  预付 + 强制预算熔断 \n 编程 Agent（团队）  亿级以上  同上，且叠加人数  必须配部门预算与告警 \n 自托管 Agent（常驻）  千万～亿级  持续型，定时任务叠加  预付 + 异常调用监控 \n 应用编排平台（企业）  千万～十亿级  随业务量，可预测性较好  可给账期，需授信额度 \n 客户自建网关（转售）  视其下游而定  不可控  按渠道政策管理，见模块 07 \n\n最重要的一条判断规则：凡是涉及 Agent 循环调用的形态（第二、三层），必须在开户时就把预算上限和熔断规则配好，不能等客户自己想起来。 这类客户的第一张账单如果超出预期三倍，流失概率极高——而这本来是可以避免的。\n\n\n\n 六、本知识库的模块划分\n\n 模块  覆盖项目 \n\n 13 · 自托管 Agent 与通用助手  Hermes Agent、OpenClaw、OpenManus、Manus \n 14 · API 网关与中转系统  New API、One API、LiteLLM \n 15 · 桌面客户端  Cherry Studio、ChatBox、LobeChat、Open WebUI \n 16 · 编程 Agent  Claude Code、Cursor、Cline、Roo Code \n 17 · 应用编排平台  Dify、Coze、FastGPT、n8n、RAGFlow \n\n每个项目按统一结构撰写：是什么 → 架构与关键机制 → 部署方式 → 接我们网关的具体配置 → token 消耗特征 → 客户画像与销售切入点 → 风险与注意事项。\n\n其中最后三节是本知识库区别于普通技术文档的地方，也是销售应该重点读的部分。\n\n\n\n 七、维护规则\n\n开源项目的迭代速度远超商业软件，本模块的三条维护纪律：\n\nStar 数、版本号、具体配置项按季度复核。 配置路径变更会直接导致技术支持给出错误指引，这类错误对专业形象的伤害极大。\n\n新工具出现时先记录再补全。 客户提到我们不认识的工具，当天先在模块末尾登记名称和客户描述，一周内补全档案。答不上来不可怕，两次答不上同一个问题才可怕。\n\n每次技术支持解决一个新的接入问题，把解法补进对应项目的配置章节。 支持工单是这个库最好的素材来源。\n"}, {"id": "13-自托管Agent与通用助手", "code": "13", "title": "模块 13 · 自托管 Agent 与通用助手", "short": "自托管 Agent 与通用助手", "subs": ["这一层为什么重要", "一、Hermes Agent", "二、OpenClaw", "三、OpenManus", "四、Manus", "五、本模块的横向对比", "数据来源"], "html": "<h1>模块 13 · 自托管 Agent 与通用助手</h1>\n<blockquote>\n<p>覆盖：Hermes Agent、OpenClaw、OpenManus、Manus\n这一层的共同特征：<strong>长期在线、有持久记忆、能自主循环执行任务</strong>。\n消耗曲线是持续型而非脉冲型，是我们最值得投入销售资源的形态之一。\n数据采集日：2026-07-27。</p>\n</blockquote>\n<hr />\n<h2>这一层为什么重要</h2>\n<p>传统的 AI 使用方式是\"人问一句、模型答一句\"，token 消耗与人的操作次数直接挂钩，天花板是人的打字速度。</p>\n<p>自托管 Agent 打破了这个天花板。它跑在服务器上，有自己的记忆、自己的定时任务、自己的子 Agent，可以在没有人看着的情况下连续工作几个小时。<strong>一次\"帮我调研一下这个市场\"的指令，背后可能是几十次搜索、上百次页面解析、几十轮自我反思，消耗几十万到几百万 token。</strong></p>\n<p>对我们的直接意义：<strong>这一层的客户，用量增长不靠他多招人，靠他多派任务。</strong> 这是最好的客户结构——收入随客户的业务复杂度增长，而不是随他的人头增长。</p>\n<p>同时也是风险最高的一层：<strong>循环失控是真实存在的</strong>。一个写坏的定时任务可以在一夜之间烧掉一个月的预算。所有这一层的客户，开户时必须强制配置预算熔断（见模块 12 第五节）。</p>\n<hr />\n<h2>一、Hermes Agent</h2>\n<h3>1.1 是什么</h3>\n<p>Nous Research 开发的开源自托管 AI Agent，MIT 协议。它的自我定位很明确：<strong>不是编程助手，也不是聊天机器人，而是一个\"住在你服务器上、会记住学过的东西、运行越久越强\"的个人代理。</strong></p>\n<p>GitHub 上有约 18 万 Star 的量级，2026 年发布了桌面版客户端（含 Windows 离线便携包），此前是纯服务端形态。中文社区活跃度较高。</p>\n<p>它和这一层其他项目最大的差异是<strong>记忆与技能的持久化</strong>。多数 Agent 的生命周期是\"一次对话\"，任务结束状态清零；Hermes 的生命周期是\"这台服务器的寿命\"。</p>\n<h3>1.2 架构与关键机制</h3>\n<p><strong>三层记忆架构</strong>是它的核心卖点。项目记忆保留用户偏好与项目上下文；技能自学在解决复杂问题后自动生成可复用的技能文档；所有数据落在本地 <code>~/.hermes/</code> 目录，不上传云端。</p>\n<p><strong>技能系统</strong>内置 40 多个技能，同时具备\"无限自生成\"能力——它解决过一次的问题会沉淀成新技能，下次直接调用。这意味着<strong>同一个客户随着使用时间增长，单任务的 token 消耗可能下降，但任务频次会上升</strong>，总量通常仍是净增长。</p>\n<p><strong>执行沙箱</strong>支持 Docker 隔离、SSH 远程、Modal / HPC 后端，可以真正跑代码、操作远程机器。</p>\n<p><strong>并行子代理框架</strong>允许一个主任务分裂出多个子 Agent 并行工作——<strong>这是 token 消耗放大的主要来源</strong>，也是我们做成本分析时首先要看的地方。</p>\n<p><strong>多平台网关</strong>统一接入 Telegram、Discord、Slack、WhatsApp、Signal 五个渠道，加上 Cron 定时调度器。</p>\n<h3>1.3 部署方式</h3>\n<p>自托管设计，支持 Linux、macOS、WSL2（Windows 原生支持为实验性）。单行 <code>curl</code> 命令安装，安装器自动部署 uv 与 Python 3.11，无前置依赖。可注册为 systemd 服务常驻运行。</p>\n<p>对客户的实际含义：<strong>部署门槛不算低，但也不需要专职运维</strong>。典型客户是有一台自己的云服务器、技术背景不错的个人或小团队。</p>\n<h3>1.4 接入我们的网关</h3>\n<p>Hermes 官方支持四类 Provider：Nous Portal（OAuth 原生集成）、OpenRouter（API 密钥，200+ 模型）、<strong>自定义 OpenAI 兼容端点</strong>、本地 vLLM。</p>\n<p><strong>我们走第三条</strong>——自定义 OpenAI 兼容端点。在 <code>~/.hermes/</code> 的配置中选择自定义 Provider，填入：</p>\n<pre><code>base_url: https://api.你的域名/v1\napi_key:  我们签发的 Key\nmodel:    从控制台复制的完整模型 ID\n</code></pre>\n<p><strong>销售可以直接用的一句话</strong>：\"Hermes 默认推 OpenRouter，那是海外通道，国内跑延迟和稳定性都不理想，而且它的账单没法拆到具体任务。换成我们的端点只要改配置里三行，模型全，还能看到每个任务烧了多少。\"</p>\n<h3>1.5 token 消耗特征</h3>\n<p><strong>持续型消耗，叠加定时任务的脉冲。</strong> 常驻服务本身有心跳与后台整理开销；Cron 任务按计划触发；并行子代理是最大的放大器。</p>\n<p>需要重点关注的三个消耗放大点：<strong>子代理并行度</strong>（一个任务分裂成几个）、<strong>记忆检索的上下文长度</strong>（记忆越多，每次注入的上下文越长）、<strong>技能自生成过程</strong>（生成新技能本身是一次高消耗的推理）。</p>\n<p><strong>这三点都是极好的优化服务切入口。</strong> 尤其是记忆检索——随着使用时间增长，注入的上下文会越来越长，如果没有做缓存，成本会悄悄地线性上涨。帮客户把这块做出来，通常能省下可观的比例。</p>\n<h3>1.6 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：有技术能力的独立开发者、小型技术团队、把 Agent 当生产力基础设施用的知识工作者。用量中等偏上，增长稳定，粘性极强（记忆和技能都沉淀在本地，迁移成本高）。</p>\n<p><strong>切入点一 —— 稳定性。</strong> 常驻 Agent 最怕的是半夜定时任务因为上游限流全部失败，早上起来发现什么都没干。这是我们多通道自动切换的最佳应用场景。</p>\n<p><strong>切入点二 —— 成本可见性。</strong> Hermes 自己不做成本归集，客户不知道哪个任务、哪个技能最烧钱。我们的分账单是刚需。</p>\n<p><strong>切入点三 —— 数据不出境。</strong> Hermes 的核心卖点是隐私（零追踪、本地数据），这类用户对\"模型调用走哪条通道\"天然敏感。我们的国内直连通道 + 日志留存说明，正好对上。</p>\n<h3>1.7 风险与注意事项</h3>\n<p><strong>并行子代理可能瞬间打满限流。</strong> 开户时要评估其并发需求，必要时单独配置速率策略，否则客户会以为是我们不稳定。</p>\n<p><strong>长期运行 + 记忆增长 = 上下文膨胀。</strong> 三到六个月后成本可能显著高于初期，要在首月复盘时就提前告知客户，别让他自己发现。</p>\n<hr />\n<h2>二、OpenClaw</h2>\n<h3>2.1 是什么</h3>\n<p>2026 年 1 月出现的开源个人 AI 助手，作者是 PSPDFKit 创始人 Peter Steinberger，最初是一个\"周末项目\"。</p>\n<p><strong>它的走红速度是开源史上罕见的</strong>：72 小时内 Star 从 1 万涨到 6 万，两天突破 10 万，单日峰值增长约 17,830 个 Star，到 2026 年 2 月已超过 18.6 万 Star、3.2 万 Fork。</p>\n<p><strong>改名历史需要销售知道</strong>，因为客户可能用任何一个名字提起它：最初叫 <strong>Clawdbot</strong>（2025 年 12 月–2026 年 1 月，取 Claude + claw 之意），因 Anthropic 的商标异议改为 <strong>Moltbot</strong>（2026 年 1 月 27 日），最终于 1 月 30 日定名 <strong>OpenClaw</strong>，强调开源属性。客户说\"Clawdbot\"或\"Moltbot\"时，指的是同一个东西。</p>\n<h3>2.2 设计哲学与架构</h3>\n<p>一句话概括它的理念：<strong>把 AI 从\"会说\"变成\"会做\"，给 AI 装上手脚。</strong></p>\n<p>它解决的是 AI 落地的\"最后一公里\"——模型很聪明但被困在浏览器里，而用户真正需要的是系统级的自动化操作：主动操作系统、访问网页、处理邮件、整理文件、发送提醒、自动写代码。</p>\n<p><strong>核心组件</strong>包括本地算力 + 大模型驱动的 Agent 自动化、网关服务（默认端口 18789）、带长期记忆的 Workspace 系统、Skills 插件生态、多渠道消息接入。</p>\n<p><strong>Skills 生态是它的护城河</strong>，插件数量已超过 1,700 个。有评论把这个转变类比为\"App Store 之后的 iPhone\"——从一个工具变成了一个平台。</p>\n<p><strong>消息渠道</strong>支持 WhatsApp、Telegram、Discord、iMessage、Slack，通过 OAuth 令牌或扫码接入。</p>\n<h3>2.3 部署方式</h3>\n<p>官方推荐单命令安装：<code>curl -fsSL https://openclaw.ai/install.sh | bash</code>。也支持 npm / pnpm 全局安装、Docker 容器化、云厂商一键部署（阿里云、腾讯云均有），以及源码安装。</p>\n<p><strong>已知短板：对非技术用户部署门槛偏高，权限管理机制不够完善，插件生态质量参差不齐。</strong> 这三点在多篇评测中被反复提到，销售应当如实告知而非回避——客户装不上来找我们，本来也不是我们能解决的。</p>\n<h3>2.4 接入我们的网关</h3>\n<p>OpenClaw 支持的模型面很宽：Claude、Gemini、OpenAI、Ollama（本地）、Pi、Qwen、MiniMax、GLM 等。</p>\n<p>配置方式是环境变量 + 配置文件 <code>~/.openclaw/openclaw.json</code> 组合。具体填法取决于所选模型走哪个协议——<strong>走 Claude 系模型时用 Anthropic 原生端点，走其他模型时用 OpenAI 兼容端点</strong>。</p>\n<p><strong>这是我们文档必须写清楚的地方</strong>。OpenClaw 用户量极大且以非重度技术用户为主，接入文档写得清不清楚，直接决定这批客户的转化率。建议单独出一篇带截图的 OpenClaw 接入指南。</p>\n<h3>2.5 token 消耗特征</h3>\n<p><strong>脉冲型 + 长尾型叠加。</strong> 用户通过消息渠道发一条指令，触发一轮任务分解与执行，可能涉及多次网页访问、文件操作、代码执行，单次任务消耗从几万到上百万 token 不等。</p>\n<p><strong>Skills 是消耗的主要变量。</strong> 装了哪些插件、插件里怎么写 prompt，直接决定成本结构。而由于插件生态质量参差不齐，<strong>存在大量写得很浪费的插件</strong>——这是我们做成本优化最容易出成绩的地方。</p>\n<h3>2.6 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：极其广泛。从技术爱好者到中小企业主，从个人效率工具到轻度商用自动化。<strong>这是当前用户基数最大的自托管 Agent，没有之一。</strong></p>\n<p><strong>这一层的商业逻辑与其他项目不同：单客户价值不高，但基数极大。</strong> 应该用极度自助化的方式服务——一篇好的接入文档 + 顺畅的自助注册 + 小额起充，胜过任何销售动作。</p>\n<p><strong>切入点一 —— 国内可用性。</strong> OpenClaw 默认接的多是海外模型通道，国内用户直接用体验很差。我们提供国内直连 + 国产模型，这是最直接的价值。</p>\n<p><strong>切入点二 —— 内容营销。</strong> 这是一个 18 万 Star、社区极度活跃的项目。<strong>围绕它做接入教程、Skills 成本优化指南、模型选型对比，是获取长尾客户成本最低的方式。</strong> 这类内容的自然流量很可观。</p>\n<p><strong>切入点三 —— 从个人用户中筛出企业线索。</strong> 大量企业内的技术人员是先在个人电脑上玩 OpenClaw，然后才把 AI 引入公司的。<strong>服务好一个个人用户，可能三个月后带来一个企业单。</strong></p>\n<h3>2.7 风险与注意事项</h3>\n<p><strong>权限管理机制不完善是公开承认的短板。</strong> 它能操作系统、读写文件、访问网络——如果客户把它接到生产环境又没做好隔离，出事的可能性是真实的。我们在文档里应当提示沙箱隔离，但<strong>必须明确这是客户侧的责任，不能因为通道是我们提供的就承担连带责任</strong>。</p>\n<p><strong>插件生态未经审核。</strong> 存在恶意或低质插件的可能。我们不背书任何具体插件。</p>\n<p><strong>用户以非重度技术人员为主，技术支持负荷会偏高。</strong> 必须靠文档和 FAQ 把支持成本压下去，不能靠人力（见模块 04 服务强度对贡献毛利的影响）。</p>\n<hr />\n<h2>三、OpenManus</h2>\n<h3>3.1 是什么</h3>\n<p>Manus 的开源复现项目，由 MetaGPT 团队相关开发者发起，以\"三小时复刻 Manus\"闻名，发布后迅速获得 2 万以上 Star。</p>\n<p>它的价值不在于功能完整度追平 Manus——<strong>它做不到</strong>——而在于<strong>它把通用 Agent 的架构讲透了</strong>。初始版本约 30 个核心文件，代码极其精简，是理解 Agent 框架设计的最佳教材。</p>\n<h3>3.2 架构：四层继承</h3>\n<p>这是 OpenManus 最值得学习的部分，也是销售理解\"Agent 为什么烧钱\"的最好切口。</p>\n<p><strong>BaseAgent</strong> 提供基础属性：名称、记忆、系统提示词。\n<strong>ReActAgent</strong> 实现 Reasoning + Acting 模式——先思考再行动，循环往复。\n<strong>ToolCallAgent</strong> 细化工具选择与执行逻辑。\n<strong>Manus</strong> 继承 ToolCallAgent，配上定制化的提示词与工具集。</p>\n<p><strong>关键机制是 ReAct 循环</strong>：模型思考 → 选工具 → 执行 → 观察结果 → 再思考。<strong>每一轮循环都是一次完整的模型调用，且上下文里累积着前面所有轮次的内容。</strong> 这就是 Agent 类应用 token 消耗呈非线性增长的根本原因——<strong>不是调用次数多，是每次调用的上下文都在变长。</strong></p>\n<p>销售可以把这段直接讲给客户听。多数客户从没意识到这一点，讲清楚之后，\"缓存优化\"和\"上下文压缩\"的价值就不言自明了。</p>\n<p><strong>执行流程</strong>是规划 → 分配 → 执行：用户输入触发 PlanningTool 分析，系统把请求拆成线性子任务，ReAct Agent 逐个执行，结果压缩后存入共享记忆，最终汇总输出。</p>\n<p><strong>核心工具集</strong>：PythonExecute（跑代码）、BrowserUseTool（操作浏览器）、GoogleSearch（检索）、FileSaver（文件管理）、PlanningTool（任务分解）。</p>\n<h3>3.3 部署与接入我们的网关</h3>\n<p>Python 项目，通过 conda 或 venv 建环境后 <code>pip install -r requirements.txt</code>。</p>\n<p>模型配置集中在 <code>config/config.toml</code>，从 <code>config.example.toml</code> 复制而来。核心字段：</p>\n<pre><code class=\"language-toml\">[llm]\nmodel = &quot;从控制台复制的模型 ID&quot;\nbase_url = &quot;https://api.你的域名/v1&quot;\napi_key = &quot;我们签发的 Key&quot;\nmax_tokens = 4096\ntemperature = 0.0\n</code></pre>\n<p><strong>配置极其简单，是所有项目里接入最顺的之一。</strong> 销售完全可以在电话里口述完成。</p>\n<h3>3.4 token 消耗特征</h3>\n<p><strong>典型的 Agent 循环消耗，且没有做多少优化。</strong> 作为一个以\"讲清楚架构\"为目标的教学型项目，它在上下文管理、缓存利用上都比较朴素。</p>\n<p>实际含义：<strong>同样的任务，OpenManus 的消耗通常高于成熟商业 Agent。</strong> 这对我们是好事（收入高），但要主动提示客户，否则第一张账单会吓到他。</p>\n<h3>3.5 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：AI 应用创业公司的技术团队、想自研 Agent 的企业研发部门、高校与研究机构。</p>\n<p><strong>这批客户的真正价值不在于他们跑 OpenManus 烧的那点 token，而在于他们大概率正在基于它做二次开发，做出来的东西才是真正的用量来源。</strong></p>\n<p><strong>切入点：把他们当作\"未来的大客户\"来服务。</strong> 在他们还在做 demo 的阶段就给足测试额度和技术支持，等他们的产品上线，我们就是默认通道。这类客户的获客成本极低（他们主动找便宜稳定的 API），生命周期价值极高。</p>\n<p><strong>特别提示</strong>：这类客户属于模块 08 定义的\"二次开发\"范畴——<strong>他们对模型输出做了封装和提示词工程改造，合规义务按自研模型标准执行</strong>。销售要主动提示这一点，这是极好的专业形象展示机会。</p>\n<h3>3.6 风险与注意事项</h3>\n<p><strong>项目定位是教学与复现，不是生产就绪。</strong> 不要向客户暗示它可以直接上生产，出了问题会归因到我们头上。</p>\n<p><strong>中文互联网上关于它的资料版本混杂</strong>，部分早期文章的配置方式已经过时。技术支持应以官方仓库 README 为准。</p>\n<hr />\n<h2>四、Manus</h2>\n<h3>4.1 是什么</h3>\n<p>蝴蝶效应公司（Butterfly Effect）推出的通用 AI Agent，对外宣称是\"全球首款自主通用 AI Agent\"。它是<strong>商业闭源产品</strong>，不是开源项目——这一点决定了它在我们业务里的位置与前三个完全不同。</p>\n<h3>4.2 架构与能力</h3>\n<p><strong>多智能体并行处理</strong>：通过分布式任务处理绕开单一上下文窗口的限制，这是它能处理大规模任务的关键。</p>\n<p><strong>虚拟机沙箱</strong>：运行在隔离环境中，具备浏览器自动化能力，可以像真人一样操作电脑——登录账号、抓取数据、执行多步自动化。</p>\n<p><strong>最新的 Manus 1.6 引入了 Max Agent</strong>，强化了规划与问题解决架构，在表格处理和网页开发类任务上成功率提升明显。</p>\n<p><strong>典型场景</strong>：设计创作、市场调研（如\"分析 100 款球鞋的价格、功能、人群与转售数据\"）、学术研究、批量内容生产、数据抓取与结构化。可与 Gmail、Notion、Zapier 等外部平台集成。</p>\n<h3>4.3 定价机制（关键）</h3>\n<p>Manus 采用<strong>订阅 + 积分双轨制</strong>，三档：</p>\n<table>\n<thead>\n<tr>\n<th>档位</th>\n<th>月费</th>\n<th>每日刷新积分</th>\n<th>每月积分</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Basic</td>\n<td>$20</td>\n<td>300</td>\n<td>4,000</td>\n</tr>\n<tr>\n<td>Standard</td>\n<td>$40</td>\n<td>300</td>\n<td>8,000</td>\n</tr>\n<tr>\n<td>Professional</td>\n<td>$200</td>\n<td>300</td>\n<td>40,000</td>\n</tr>\n</tbody>\n</table>\n<p>各档均含 20 个并发任务与 20 个定时自动化。</p>\n<h3>4.4 它对我们意味着什么</h3>\n<p><strong>这是本模块唯一一个我们卖不进去的项目——但它恰恰是最有销售价值的一个。</strong></p>\n<p>因为 Manus 是闭源 SaaS，客户用它就是买它的积分，我们无法成为它的上游。但是：</p>\n<p><strong>第一，它是最好的价值锚点。</strong> 客户如果在用 Manus Professional（$200/月，约 1400 元），说明他已经认可\"让 AI 自主干活\"这件事的价值，且愿意为此付钱。这是极强的购买意愿信号。<strong>销售应该把\"你们在用 Manus 吗\"作为常规问题问出来。</strong></p>\n<p><strong>第二，它是最好的成本对比素材。</strong> 积分制的最大问题是<strong>不透明</strong>——客户不知道一个任务消耗了多少积分、为什么消耗这么多、有没有优化空间。而 token 计费是完全透明的。销售话术：</p>\n<blockquote>\n<p>\"Manus 好用，但你有没有算过每完成一个调研任务折合多少钱？积分制的问题是你永远不知道钱花在哪。如果你们的场景比较固定，用 OpenManus 或者 Hermes 自己搭一套，模型走我们的通道，成本能看得清清楚楚，通常还更便宜。\"</p>\n</blockquote>\n<p><strong>第三，它定义了客户的期待。</strong> 用过 Manus 的客户，对 Agent 能力的预期是被拉高的。我们如果建议他自建，必须诚实说明自建方案在开箱即用程度上有差距——<strong>不能为了成单而夸大开源方案的成熟度</strong>，那会在交付阶段翻车。</p>\n<h3>4.5 风险与注意事项</h3>\n<p><strong>不要把 Manus 当作竞争对手来攻击。</strong> 它和我们不在同一层——它是应用，我们是基础设施。攻击它显得外行。正确的姿态是：认可它的产品力，讨论它的成本透明度。</p>\n<p><strong>积分与 token 之间没有公开的换算关系</strong>，任何\"用我们比 Manus 便宜多少倍\"的量化宣称都是不可验证的，<strong>不能写进任何对外材料</strong>。只能引导客户自己去算。</p>\n<hr />\n<h2>五、本模块的横向对比</h2>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>Hermes Agent</th>\n<th>OpenClaw</th>\n<th>OpenManus</th>\n<th>Manus</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>性质</td>\n<td>开源 MIT</td>\n<td>开源</td>\n<td>开源</td>\n<td>商业闭源</td>\n</tr>\n<tr>\n<td>部署</td>\n<td>自托管服务器</td>\n<td>自托管/本地</td>\n<td>本地 Python</td>\n<td>SaaS</td>\n</tr>\n<tr>\n<td>核心特色</td>\n<td>持久记忆 + 技能自学</td>\n<td>Skills 生态 + 多渠道</td>\n<td>架构清晰、教学价值</td>\n<td>开箱即用、沙箱</td>\n</tr>\n<tr>\n<td>用户量级</td>\n<td>大</td>\n<td><strong>极大</strong></td>\n<td>中</td>\n<td>中（付费）</td>\n</tr>\n<tr>\n<td>我们能否接入</td>\n<td>✅</td>\n<td>✅</td>\n<td>✅</td>\n<td>❌</td>\n</tr>\n<tr>\n<td>单客户价值</td>\n<td>中高</td>\n<td>低（但基数大）</td>\n<td>低（但转化潜力高）</td>\n<td>—</td>\n</tr>\n<tr>\n<td>服务方式</td>\n<td>半自助 + 轻支持</td>\n<td><strong>纯自助 + 文档</strong></td>\n<td>轻销售 + 培育</td>\n<td>作为线索来源</td>\n</tr>\n</tbody>\n</table>\n<p><strong>一句话的销售策略</strong>：OpenClaw 用内容和文档收长尾，Hermes 用稳定性和成本可见性做中坚，OpenManus 当作未来大客户来培育，Manus 用户当作高意愿线索来挖。</p>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://www.tencentcloud.com/techpedia/140976\">OpenClaw 是什么？如何部署？2026 详细介绍 - 腾讯云</a></li>\n<li><a href=\"https://www.cnblogs.com/informatics/p/19629836\">OpenClaw 为什么大火？GitHub 史上增长最快的开源项目 - 博客园</a></li>\n<li><a href=\"https://www.runoob.com/ai-agent/openclaw-clawdbot-tutorial.html\">OpenClaw (Clawdbot) 教程 - 菜鸟教程</a></li>\n<li><a href=\"https://hermes-agent.org/\">Hermes Agent 官方站点</a></li>\n<li><a href=\"https://www.53ai.com/news/OpenSourceLLM/2025031396827.html\">「三小时复刻 Manus」OpenManus 多智能体框架技术拆解 - 53AI</a></li>\n<li><a href=\"https://ai-bot.cn/sites/69322.html\">Manus 产品介绍 - AI 工具集</a></li>\n</ul>", "plain": " 模块 13 · 自托管 Agent 与通用助手\n\n 覆盖：Hermes Agent、OpenClaw、OpenManus、Manus\n 这一层的共同特征：长期在线、有持久记忆、能自主循环执行任务。\n 消耗曲线是持续型而非脉冲型，是我们最值得投入销售资源的形态之一。\n 数据采集日：20260727。\n\n\n\n 这一层为什么重要\n\n传统的 AI 使用方式是\"人问一句、模型答一句\"，token 消耗与人的操作次数直接挂钩，天花板是人的打字速度。\n\n自托管 Agent 打破了这个天花板。它跑在服务器上，有自己的记忆、自己的定时任务、自己的子 Agent，可以在没有人看着的情况下连续工作几个小时。一次\"帮我调研一下这个市场\"的指令，背后可能是几十次搜索、上百次页面解析、几十轮自我反思，消耗几十万到几百万 token。\n\n对我们的直接意义：这一层的客户，用量增长不靠他多招人，靠他多派任务。 这是最好的客户结构——收入随客户的业务复杂度增长，而不是随他的人头增长。\n\n同时也是风险最高的一层：循环失控是真实存在的。一个写坏的定时任务可以在一夜之间烧掉一个月的预算。所有这一层的客户，开户时必须强制配置预算熔断（见模块 12 第五节）。\n\n\n\n 一、Hermes Agent\n\n 1.1 是什么\n\nNous Research 开发的开源自托管 AI Agent，MIT 协议。它的自我定位很明确：不是编程助手，也不是聊天机器人，而是一个\"住在你服务器上、会记住学过的东西、运行越久越强\"的个人代理。\n\nGitHub 上有约 18 万 Star 的量级，2026 年发布了桌面版客户端（含 Windows 离线便携包），此前是纯服务端形态。中文社区活跃度较高。\n\n它和这一层其他项目最大的差异是记忆与技能的持久化。多数 Agent 的生命周期是\"一次对话\"，任务结束状态清零；Hermes 的生命周期是\"这台服务器的寿命\"。\n\n 1.2 架构与关键机制\n\n三层记忆架构是它的核心卖点。项目记忆保留用户偏好与项目上下文；技能自学在解决复杂问题后自动生成可复用的技能文档；所有数据落在本地 ~/.hermes/ 目录，不上传云端。\n\n技能系统内置 40 多个技能，同时具备\"无限自生成\"能力——它解决过一次的问题会沉淀成新技能，下次直接调用。这意味着同一个客户随着使用时间增长，单任务的 token 消耗可能下降，但任务频次会上升，总量通常仍是净增长。\n\n执行沙箱支持 Docker 隔离、SSH 远程、Modal / HPC 后端，可以真正跑代码、操作远程机器。\n\n并行子代理框架允许一个主任务分裂出多个子 Agent 并行工作——这是 token 消耗放大的主要来源，也是我们做成本分析时首先要看的地方。\n\n多平台网关统一接入 Telegram、Discord、Slack、WhatsApp、Signal 五个渠道，加上 Cron 定时调度器。\n\n 1.3 部署方式\n\n自托管设计，支持 Linux、macOS、WSL2（Windows 原生支持为实验性）。单行 curl 命令安装，安装器自动部署 uv 与 Python 3.11，无前置依赖。可注册为 systemd 服务常驻运行。\n\n对客户的实际含义：部署门槛不算低，但也不需要专职运维。典型客户是有一台自己的云服务器、技术背景不错的个人或小团队。\n\n 1.4 接入我们的网关\n\nHermes 官方支持四类 Provider：Nous Portal（OAuth 原生集成）、OpenRouter（API 密钥，200+ 模型）、自定义 OpenAI 兼容端点、本地 vLLM。\n\n我们走第三条——自定义 OpenAI 兼容端点。在 ~/.hermes/ 的配置中选择自定义 Provider，填入：\n\n\nbase_url: https://api.你的域名/v1\napi_key:  我们签发的 Key\nmodel:    从控制台复制的完整模型 ID\n\n\n销售可以直接用的一句话：\"Hermes 默认推 OpenRouter，那是海外通道，国内跑延迟和稳定性都不理想，而且它的账单没法拆到具体任务。换成我们的端点只要改配置里三行，模型全，还能看到每个任务烧了多少。\"\n\n 1.5 token 消耗特征\n\n持续型消耗，叠加定时任务的脉冲。 常驻服务本身有心跳与后台整理开销；Cron 任务按计划触发；并行子代理是最大的放大器。\n\n需要重点关注的三个消耗放大点：子代理并行度（一个任务分裂成几个）、记忆检索的上下文长度（记忆越多，每次注入的上下文越长）、技能自生成过程（生成新技能本身是一次高消耗的推理）。\n\n这三点都是极好的优化服务切入口。 尤其是记忆检索——随着使用时间增长，注入的上下文会越来越长，如果没有做缓存，成本会悄悄地线性上涨。帮客户把这块做出来，通常能省下可观的比例。\n\n 1.6 客户画像与切入点\n\n典型客户：有技术能力的独立开发者、小型技术团队、把 Agent 当生产力基础设施用的知识工作者。用量中等偏上，增长稳定，粘性极强（记忆和技能都沉淀在本地，迁移成本高）。\n\n切入点一 —— 稳定性。 常驻 Agent 最怕的是半夜定时任务因为上游限流全部失败，早上起来发现什么都没干。这是我们多通道自动切换的最佳应用场景。\n\n切入点二 —— 成本可见性。 Hermes 自己不做成本归集，客户不知道哪个任务、哪个技能最烧钱。我们的分账单是刚需。\n\n切入点三 —— 数据不出境。 Hermes 的核心卖点是隐私（零追踪、本地数据），这类用户对\"模型调用走哪条通道\"天然敏感。我们的国内直连通道 + 日志留存说明，正好对上。\n\n 1.7 风险与注意事项\n\n并行子代理可能瞬间打满限流。 开户时要评估其并发需求，必要时单独配置速率策略，否则客户会以为是我们不稳定。\n\n长期运行 + 记忆增长 = 上下文膨胀。 三到六个月后成本可能显著高于初期，要在首月复盘时就提前告知客户，别让他自己发现。\n\n\n\n 二、OpenClaw\n\n 2.1 是什么\n\n2026 年 1 月出现的开源个人 AI 助手，作者是 PSPDFKit 创始人 Peter Steinberger，最初是一个\"周末项目\"。\n\n它的走红速度是开源史上罕见的：72 小时内 Star 从 1 万涨到 6 万，两天突破 10 万，单日峰值增长约 17,830 个 Star，到 2026 年 2 月已超过 18.6 万 Star、3.2 万 Fork。\n\n改名历史需要销售知道，因为客户可能用任何一个名字提起它：最初叫 Clawdbot（2025 年 12 月–2026 年 1 月，取 Claude + claw 之意），因 Anthropic 的商标异议改为 Moltbot（2026 年 1 月 27 日），最终于 1 月 30 日定名 OpenClaw，强调开源属性。客户说\"Clawdbot\"或\"Moltbot\"时，指的是同一个东西。\n\n 2.2 设计哲学与架构\n\n一句话概括它的理念：把 AI 从\"会说\"变成\"会做\"，给 AI 装上手脚。\n\n它解决的是 AI 落地的\"最后一公里\"——模型很聪明但被困在浏览器里，而用户真正需要的是系统级的自动化操作：主动操作系统、访问网页、处理邮件、整理文件、发送提醒、自动写代码。\n\n核心组件包括本地算力 + 大模型驱动的 Agent 自动化、网关服务（默认端口 18789）、带长期记忆的 Workspace 系统、Skills 插件生态、多渠道消息接入。\n\nSkills 生态是它的护城河，插件数量已超过 1,700 个。有评论把这个转变类比为\"App Store 之后的 iPhone\"——从一个工具变成了一个平台。\n\n消息渠道支持 WhatsApp、Telegram、Discord、iMessage、Slack，通过 OAuth 令牌或扫码接入。\n\n 2.3 部署方式\n\n官方推荐单命令安装：curl fsSL https://openclaw.ai/install.sh  bash。也支持 npm / pnpm 全局安装、Docker 容器化、云厂商一键部署（阿里云、腾讯云均有），以及源码安装。\n\n已知短板：对非技术用户部署门槛偏高，权限管理机制不够完善，插件生态质量参差不齐。 这三点在多篇评测中被反复提到，销售应当如实告知而非回避——客户装不上来找我们，本来也不是我们能解决的。\n\n 2.4 接入我们的网关\n\nOpenClaw 支持的模型面很宽：Claude、Gemini、OpenAI、Ollama（本地）、Pi、Qwen、MiniMax、GLM 等。\n\n配置方式是环境变量 + 配置文件 ~/.openclaw/openclaw.json 组合。具体填法取决于所选模型走哪个协议——走 Claude 系模型时用 Anthropic 原生端点，走其他模型时用 OpenAI 兼容端点。\n\n这是我们文档必须写清楚的地方。OpenClaw 用户量极大且以非重度技术用户为主，接入文档写得清不清楚，直接决定这批客户的转化率。建议单独出一篇带截图的 OpenClaw 接入指南。\n\n 2.5 token 消耗特征\n\n脉冲型 + 长尾型叠加。 用户通过消息渠道发一条指令，触发一轮任务分解与执行，可能涉及多次网页访问、文件操作、代码执行，单次任务消耗从几万到上百万 token 不等。\n\nSkills 是消耗的主要变量。 装了哪些插件、插件里怎么写 prompt，直接决定成本结构。而由于插件生态质量参差不齐，存在大量写得很浪费的插件——这是我们做成本优化最容易出成绩的地方。\n\n 2.6 客户画像与切入点\n\n典型客户：极其广泛。从技术爱好者到中小企业主，从个人效率工具到轻度商用自动化。这是当前用户基数最大的自托管 Agent，没有之一。\n\n这一层的商业逻辑与其他项目不同：单客户价值不高，但基数极大。 应该用极度自助化的方式服务——一篇好的接入文档 + 顺畅的自助注册 + 小额起充，胜过任何销售动作。\n\n切入点一 —— 国内可用性。 OpenClaw 默认接的多是海外模型通道，国内用户直接用体验很差。我们提供国内直连 + 国产模型，这是最直接的价值。\n\n切入点二 —— 内容营销。 这是一个 18 万 Star、社区极度活跃的项目。围绕它做接入教程、Skills 成本优化指南、模型选型对比，是获取长尾客户成本最低的方式。 这类内容的自然流量很可观。\n\n切入点三 —— 从个人用户中筛出企业线索。 大量企业内的技术人员是先在个人电脑上玩 OpenClaw，然后才把 AI 引入公司的。服务好一个个人用户，可能三个月后带来一个企业单。\n\n 2.7 风险与注意事项\n\n权限管理机制不完善是公开承认的短板。 它能操作系统、读写文件、访问网络——如果客户把它接到生产环境又没做好隔离，出事的可能性是真实的。我们在文档里应当提示沙箱隔离，但必须明确这是客户侧的责任，不能因为通道是我们提供的就承担连带责任。\n\n插件生态未经审核。 存在恶意或低质插件的可能。我们不背书任何具体插件。\n\n用户以非重度技术人员为主，技术支持负荷会偏高。 必须靠文档和 FAQ 把支持成本压下去，不能靠人力（见模块 04 服务强度对贡献毛利的影响）。\n\n\n\n 三、OpenManus\n\n 3.1 是什么\n\nManus 的开源复现项目，由 MetaGPT 团队相关开发者发起，以\"三小时复刻 Manus\"闻名，发布后迅速获得 2 万以上 Star。\n\n它的价值不在于功能完整度追平 Manus——它做不到——而在于它把通用 Agent 的架构讲透了。初始版本约 30 个核心文件，代码极其精简，是理解 Agent 框架设计的最佳教材。\n\n 3.2 架构：四层继承\n\n这是 OpenManus 最值得学习的部分，也是销售理解\"Agent 为什么烧钱\"的最好切口。\n\nBaseAgent 提供基础属性：名称、记忆、系统提示词。\nReActAgent 实现 Reasoning + Acting 模式——先思考再行动，循环往复。\nToolCallAgent 细化工具选择与执行逻辑。\nManus 继承 ToolCallAgent，配上定制化的提示词与工具集。\n\n关键机制是 ReAct 循环：模型思考 → 选工具 → 执行 → 观察结果 → 再思考。每一轮循环都是一次完整的模型调用，且上下文里累积着前面所有轮次的内容。 这就是 Agent 类应用 token 消耗呈非线性增长的根本原因——不是调用次数多，是每次调用的上下文都在变长。\n\n销售可以把这段直接讲给客户听。多数客户从没意识到这一点，讲清楚之后，\"缓存优化\"和\"上下文压缩\"的价值就不言自明了。\n\n执行流程是规划 → 分配 → 执行：用户输入触发 PlanningTool 分析，系统把请求拆成线性子任务，ReAct Agent 逐个执行，结果压缩后存入共享记忆，最终汇总输出。\n\n核心工具集：PythonExecute（跑代码）、BrowserUseTool（操作浏览器）、GoogleSearch（检索）、FileSaver（文件管理）、PlanningTool（任务分解）。\n\n 3.3 部署与接入我们的网关\n\nPython 项目，通过 conda 或 venv 建环境后 pip install r requirements.txt。\n\n模型配置集中在 config/config.toml，从 config.example.toml 复制而来。核心字段：\n\ntoml\n[llm]\nmodel = \"从控制台复制的模型 ID\"\nbase_url = \"https://api.你的域名/v1\"\napi_key = \"我们签发的 Key\"\nmax_tokens = 4096\ntemperature = 0.0\n\n\n配置极其简单，是所有项目里接入最顺的之一。 销售完全可以在电话里口述完成。\n\n 3.4 token 消耗特征\n\n典型的 Agent 循环消耗，且没有做多少优化。 作为一个以\"讲清楚架构\"为目标的教学型项目，它在上下文管理、缓存利用上都比较朴素。\n\n实际含义：同样的任务，OpenManus 的消耗通常高于成熟商业 Agent。 这对我们是好事（收入高），但要主动提示客户，否则第一张账单会吓到他。\n\n 3.5 客户画像与切入点\n\n典型客户：AI 应用创业公司的技术团队、想自研 Agent 的企业研发部门、高校与研究机构。\n\n这批客户的真正价值不在于他们跑 OpenManus 烧的那点 token，而在于他们大概率正在基于它做二次开发，做出来的东西才是真正的用量来源。\n\n切入点：把他们当作\"未来的大客户\"来服务。 在他们还在做 demo 的阶段就给足测试额度和技术支持，等他们的产品上线，我们就是默认通道。这类客户的获客成本极低（他们主动找便宜稳定的 API），生命周期价值极高。\n\n特别提示：这类客户属于模块 08 定义的\"二次开发\"范畴——他们对模型输出做了封装和提示词工程改造，合规义务按自研模型标准执行。销售要主动提示这一点，这是极好的专业形象展示机会。\n\n 3.6 风险与注意事项\n\n项目定位是教学与复现，不是生产就绪。 不要向客户暗示它可以直接上生产，出了问题会归因到我们头上。\n\n中文互联网上关于它的资料版本混杂，部分早期文章的配置方式已经过时。技术支持应以官方仓库 README 为准。\n\n\n\n 四、Manus\n\n 4.1 是什么\n\n蝴蝶效应公司（Butterfly Effect）推出的通用 AI Agent，对外宣称是\"全球首款自主通用 AI Agent\"。它是商业闭源产品，不是开源项目——这一点决定了它在我们业务里的位置与前三个完全不同。\n\n 4.2 架构与能力\n\n多智能体并行处理：通过分布式任务处理绕开单一上下文窗口的限制，这是它能处理大规模任务的关键。\n\n虚拟机沙箱：运行在隔离环境中，具备浏览器自动化能力，可以像真人一样操作电脑——登录账号、抓取数据、执行多步自动化。\n\n最新的 Manus 1.6 引入了 Max Agent，强化了规划与问题解决架构，在表格处理和网页开发类任务上成功率提升明显。\n\n典型场景：设计创作、市场调研（如\"分析 100 款球鞋的价格、功能、人群与转售数据\"）、学术研究、批量内容生产、数据抓取与结构化。可与 Gmail、Notion、Zapier 等外部平台集成。\n\n 4.3 定价机制（关键）\n\nManus 采用订阅 + 积分双轨制，三档：\n\n 档位  月费  每日刷新积分  每月积分 \n\n Basic  $20  300  4,000 \n Standard  $40  300  8,000 \n Professional  $200  300  40,000 \n\n各档均含 20 个并发任务与 20 个定时自动化。\n\n 4.4 它对我们意味着什么\n\n这是本模块唯一一个我们卖不进去的项目——但它恰恰是最有销售价值的一个。\n\n因为 Manus 是闭源 SaaS，客户用它就是买它的积分，我们无法成为它的上游。但是：\n\n第一，它是最好的价值锚点。 客户如果在用 Manus Professional（$200/月，约 1400 元），说明他已经认可\"让 AI 自主干活\"这件事的价值，且愿意为此付钱。这是极强的购买意愿信号。销售应该把\"你们在用 Manus 吗\"作为常规问题问出来。\n\n第二，它是最好的成本对比素材。 积分制的最大问题是不透明——客户不知道一个任务消耗了多少积分、为什么消耗这么多、有没有优化空间。而 token 计费是完全透明的。销售话术：\n\n \"Manus 好用，但你有没有算过每完成一个调研任务折合多少钱？积分制的问题是你永远不知道钱花在哪。如果你们的场景比较固定，用 OpenManus 或者 Hermes 自己搭一套，模型走我们的通道，成本能看得清清楚楚，通常还更便宜。\"\n\n第三，它定义了客户的期待。 用过 Manus 的客户，对 Agent 能力的预期是被拉高的。我们如果建议他自建，必须诚实说明自建方案在开箱即用程度上有差距——不能为了成单而夸大开源方案的成熟度，那会在交付阶段翻车。\n\n 4.5 风险与注意事项\n\n不要把 Manus 当作竞争对手来攻击。 它和我们不在同一层——它是应用，我们是基础设施。攻击它显得外行。正确的姿态是：认可它的产品力，讨论它的成本透明度。\n\n积分与 token 之间没有公开的换算关系，任何\"用我们比 Manus 便宜多少倍\"的量化宣称都是不可验证的，不能写进任何对外材料。只能引导客户自己去算。\n\n\n\n 五、本模块的横向对比\n\n 维度  Hermes Agent  OpenClaw  OpenManus  Manus \n\n 性质  开源 MIT  开源  开源  商业闭源 \n 部署  自托管服务器  自托管/本地  本地 Python  SaaS \n 核心特色  持久记忆 + 技能自学  Skills 生态 + 多渠道  架构清晰、教学价值  开箱即用、沙箱 \n 用户量级  大  极大  中  中（付费） \n 我们能否接入  ✅  ✅  ✅  ❌ \n 单客户价值  中高  低（但基数大）  低（但转化潜力高）  — \n 服务方式  半自助 + 轻支持  纯自助 + 文档  轻销售 + 培育  作为线索来源 \n\n一句话的销售策略：OpenClaw 用内容和文档收长尾，Hermes 用稳定性和成本可见性做中坚，OpenManus 当作未来大客户来培育，Manus 用户当作高意愿线索来挖。\n\n\n\n 数据来源\n\n [OpenClaw 是什么？如何部署？2026 详细介绍  腾讯云](https://www.tencentcloud.com/techpedia/140976)\n [OpenClaw 为什么大火？GitHub 史上增长最快的开源项目  博客园](https://www.cnblogs.com/informatics/p/19629836)\n [OpenClaw (Clawdbot) 教程  菜鸟教程](https://www.runoob.com/aiagent/openclawclawdbottutorial.html)\n [Hermes Agent 官方站点](https://hermesagent.org/)\n [「三小时复刻 Manus」OpenManus 多智能体框架技术拆解  53AI](https://www.53ai.com/news/OpenSourceLLM/2025031396827.html)\n [Manus 产品介绍  AI 工具集](https://aibot.cn/sites/69322.html)\n"}, {"id": "14-API网关与中转系统", "code": "14", "title": "模块 14 · API 网关与中转系统", "short": "API 网关与中转系统", "subs": ["这一层的双重身份", "一、New API", "二、One API", "三、LiteLLM", "四、横向对比速查", "五、对我方自研网关的启示（内部，对外删除）", "数据来源"], "html": "<h1>模块 14 · API 网关与中转系统</h1>\n<blockquote>\n<p>覆盖：New API、One API、LiteLLM\n⚠️ <strong>这一层比较特殊：它既是客户可能在用的东西，也是我们自己业务的本体。</strong>\n本模块同时是竞品分析和自研选型参考，含部分内部判断，对外分发需删减第五节。\n数据采集日：2026-07-27。</p>\n</blockquote>\n<hr />\n<h2>这一层的双重身份</h2>\n<p>前面几个模块讲的都是\"客户拿 Key 去填的东西\"。这一模块不一样。</p>\n<p>当一个客户告诉你\"我们自己搭了 New API\"，这句话包含三层信息：<strong>他已经在管理多个模型渠道</strong>（说明用量到了一定规模）、<strong>他有技术能力自建基础设施</strong>（说明是技术型团队）、<strong>他此刻正在寻找上游渠道</strong>（说明我们可能是他的供应商之一）。</p>\n<p><strong>这是最优质的线索类型之一。</strong> 因为他不需要被教育\"为什么要多模型\"，他已经在做了；他需要的只是一条稳定、便宜、能开票的上游通道。销售周期极短。</p>\n<p>同时，这一层也是我们必须最了解的——<strong>因为我们自己的网关（模块 03）就是在和这些开源方案竞争</strong>。客户随时可以问：\"我为什么不自己搭一个 New API？\"这个问题答不好，单子就没了。</p>\n<hr />\n<h2>一、New API</h2>\n<h3>1.1 是什么</h3>\n<p>由 QuantumNous 开发的开源 AI 模型管理与分发系统，<strong>基于 One API 二次开发而来</strong>，把各家大模型的官方调用结构统一转换成标准化的调用格式。2025 年 10 月时约 11k+ GitHub Star，是目前中文社区最主流的自建网关方案。</p>\n<p>它的定位可以概括为：<strong>不只是协议转换器，而是一套完整的 AI 资产管理系统</strong>——有用户体系、渠道体系、令牌体系、计费体系和可视化控制台。</p>\n<h3>1.2 核心能力</h3>\n<p><strong>多模型聚合与格式互转</strong>：原生支持 OpenAI、Claude Messages、Gemini 三种格式，并可在它们之间灵活转换。<strong>注意\"原生支持\"这个措辞——这正是模块 01 里我们指出的行业痛点所在</strong>，New API 在这方面做得比多数简易中转站好。</p>\n<p><strong>缓存计费支持</strong>：可配置缓存计费倍率（0–1 区间），用于降低重复前缀的成本。这一点值得注意——<strong>它意味着自建 New API 的客户已经具备缓存意识</strong>，我们和他谈缓存优化时不能停留在扫盲层面。</p>\n<p><strong>企业级管理</strong>：令牌分组、模型限制、差异化用户配置。四级权限体系：公开访问、用户令牌、管理员令牌、Root 访问令牌（在系统设置中生成）。</p>\n<p><strong>可视化控制台</strong>：内置统计与性能监控面板。</p>\n<p><strong>关键配置项</strong>（技术支持需要知道）：流式超时默认 300 秒、Gemini 最大图片数默认 16、最大文件下载 20MB、邮件通知限额等。</p>\n<h3>1.3 部署方式</h3>\n<p>要求 Linux 环境（社区普遍推荐 Ubuntu 24.04）与 Docker，通过 docker-compose 部署，初始化后默认端口 3000。需要配套数据库（MySQL 或 PostgreSQL）与 Redis。</p>\n<p><strong>部署门槛的真实评估</strong>：对有运维能力的团队来说不难，半天能跑起来。但<strong>\"跑起来\"和\"跑得稳\"之间差距很大</strong>——高并发下的连接池调优、数据库性能、渠道健康检查、故障自动切换，这些都要自己趟。这是我们和自建方案竞争的主战场。</p>\n<h3>1.4 客户自建 New API 时，我们如何成为它的上游</h3>\n<p>这是本节最实用的部分。客户在 New API 后台的操作路径是：</p>\n<p><strong>渠道管理 → 新建渠道</strong>，类型选 OpenAI（或对应协议），代理地址填 <code>https://api.你的域名/v1</code>，密钥填我们签发的 Key，模型列表填我们支持的模型 ID。</p>\n<p><strong>技术支持要重点提醒客户三件事：</strong></p>\n<p><strong>第一，模型 ID 必须与我们控制台一致。</strong> New API 支持\"模型重定向\"功能，客户可以把内部名映射到我们的实际模型 ID。如果不用重定向，就必须一字不差。这是接入失败的头号原因。</p>\n<p><strong>第二，把我们配成\"高优先级渠道\"还是\"备用渠道\"。</strong> New API 支持渠道优先级和权重。<strong>销售应当主动争取成为主渠道</strong>，而不是默认被放在备用位——很多客户接进来
