之后就忘了调优先级，我们的量一直上不去，还以为是客户不认可。</p>\n<p><strong>第三，倍率配置要对齐。</strong> New API 的分组倍率、模型倍率如果配错，客户的成本核算会与我们的账单对不上，容易引发争议。首次接入时最好由我们的技术支持陪同配置一遍。</p>\n<h3>1.5 token 消耗特征与客户画像</h3>\n<p><strong>自建 New API 的客户，用量已经过了自助阶段。</strong> 通常是：AI 应用公司要给内部多个团队分发 Key、小型中转商在做二次分销、企业 IT 部门在做统一管控。</p>\n<p>月消耗量级通常在千万到十亿 token 之间，且<strong>波动可预测性较好</strong>（因为下游是相对固定的业务）。</p>\n<p><strong>这类客户的两个典型诉求</strong>：一是采购价要低（他们自己也在算差价），二是通道要稳（他们对下游有承诺）。<strong>价格敏感度高于平均水平</strong>，但一旦稳定下来粘性也很高——因为切换上游要重新配置和验证。</p>\n<h3>1.6 销售切入点</h3>\n<p><strong>切入点一 —— 做他的主力上游。</strong> 最直接的目标。谈判重点是价格和 SLA，不用讲太多产品价值，他都懂。</p>\n<p><strong>切入点二 —— 做他的冗余通道。</strong> 如果主渠道拿不下，先进备用位。New API 支持自动故障转移，<strong>只要我们够稳，主渠道波动时流量会自然流到我们这里</strong>，用量会慢慢涨上来。这是低阻力的进入方式。</p>\n<p><strong>切入点三 —— 说服他从自建转向托管。</strong> 这是最难但价值最高的一条。核心论点不是\"你搭得不好\"，而是：</p>\n<blockquote>\n<p>\"自建 New API 本身不难，难的是它出问题时候的三件事：上游波动了谁去切、账单和客户对不上了谁去查、要开发票和备案材料时找谁要。这三件事你现在是自己的人在做，那部分人力成本你算过吗？\"</p>\n</blockquote>\n<p><strong>诚实的边界</strong>：如果客户团队有专职运维、用量很大、且对成本极度敏感，<strong>自建对他确实是更优解</strong>。这种情况下硬推托管是徒劳的，应该老老实实做他的上游渠道。销售要能识别这个边界。</p>\n<hr />\n<h2>二、One API</h2>\n<h3>2.1 是什么</h3>\n<p>New API 的上游项目，也是整个中文 LLM 网关生态的源头。定位相近——统一管理与分发主流 AI 模型 API。</p>\n<p><strong>它与 New API 的关系需要销售理解清楚</strong>：New API 是在 One API 基础上二次开发的，功能更多、迭代更活跃；One API 更轻量、更稳定，但新特性跟进较慢。市面上还有 MIXAPI 等其他衍生分支，基本都源自这一脉。</p>\n<h3>2.2 与 New API 的选择差异</h3>\n<p>对客户而言的实际差别：</p>\n<p><strong>One API 更适合</strong>：需求简单、只要基础的多渠道分发与 Key 管理、追求稳定不折腾的团队。</p>\n<p><strong>New API 更适合</strong>：需要缓存计费、多协议原生转换、更细的分组倍率与用户体系的团队。</p>\n<p>对我们而言的实际差别：<strong>几乎没有差别</strong>。两者接入我们的方式完全一致（渠道管理 → 新建渠道 → 填 base_url 和 Key）。技术支持不需要为此准备两套文档。</p>\n<p><strong>唯一需要注意的是版本差异导致的界面路径不同</strong>，做接入指引时要问清楚客户用的是哪个、什么版本。</p>\n<hr />\n<h2>三、LiteLLM</h2>\n<h3>3.1 是什么</h3>\n<p>与前两者定位完全不同。LiteLLM 是一个 <strong>Python 库</strong>，让开发者用极少的代码改动在 100 多个模型之间切换。</p>\n<p>有一个流传很广的比喻精准概括了差异：<strong>\"LiteLLM 是开发者的瑞士军刀，New API 是企业的瑞士银行\"</strong>——前者在代码层面解决模型接入问题，后者在运维层面解决基础设施管理问题。</p>\n<p>它也提供 Proxy Server 模式（可以当网关跑），但其核心心智仍然是\"库\"，<strong>主要用户是写代码的人，不是管平台的人</strong>。</p>\n<h3>3.2 定位差异对我们的意义</h3>\n<p><strong>用 LiteLLM 的客户，通常处于更早的阶段。</strong> 他可能是一个独立开发者，或者一个还在写 MVP 的创业团队。用量小，但<strong>技术判断力强、迭代快、成长性好</strong>。</p>\n<p><strong>接入方式</strong>：在 LiteLLM 的配置中把我们注册为一个 OpenAI 兼容的 provider，填 <code>api_base</code> 和 <code>api_key</code> 即可。对开发者来说是几分钟的事。</p>\n<p><strong>销售策略与 New API 客户完全不同</strong>：不要用\"稳定性、SLA、发票\"那套企业话术，他现在不关心这些。他关心的是：模型全不全、有没有免费额度试、文档清不清楚、出问题能不能快速在社区/群里问到人。</p>\n<p><strong>这类客户应该用\"开发者关系\"的方式服务，而不是销售的方式。</strong> 给测试额度、写好文档、在技术社区里保持存在感。<strong>他今天月消费 200 元，一年后产品跑起来可能就是月消费 20 万。</strong></p>\n<hr />\n<h2>四、横向对比速查</h2>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>New API</th>\n<th>One API</th>\n<th>LiteLLM</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>形态</td>\n<td>完整管理平台</td>\n<td>完整管理平台</td>\n<td>Python 库 + 可选 Proxy</td>\n</tr>\n<tr>\n<td>主要用户</td>\n<td>团队 / 生产环境</td>\n<td>团队 / 轻量场景</td>\n<td>个人开发者 / 早期项目</td>\n</tr>\n<tr>\n<td>协议支持</td>\n<td>OpenAI / Claude / Gemini 原生</td>\n<td>以 OpenAI 为主</td>\n<td>100+ 模型抽象</td>\n</tr>\n<tr>\n<td>计费与多租户</td>\n<td>强（分组倍率、令牌体系）</td>\n<td>中</td>\n<td>弱（非核心能力）</td>\n</tr>\n<tr>\n<td>缓存计费</td>\n<td>支持（可配倍率）</td>\n<td>有限</td>\n<td>依赖上游</td>\n</tr>\n<tr>\n<td>部署复杂度</td>\n<td>中（Docker + DB + Redis）</td>\n<td>中</td>\n<td>低（pip 安装）</td>\n</tr>\n<tr>\n<td>我们的角色</td>\n<td>上游渠道</td>\n<td>上游渠道</td>\n<td>上游 provider</td>\n</tr>\n<tr>\n<td>客户价值</td>\n<td>高、粘性强</td>\n<td>高</td>\n<td>低但成长性好</td>\n</tr>\n<tr>\n<td>服务方式</td>\n<td>商务 + 技术陪同</td>\n<td>同左</td>\n<td>开发者关系</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>五、对我方自研网关的启示（内部，对外删除）</h2>\n<p>把这一层研究透，最大的收获不是竞品分析，而是<strong>明确我们自研网关必须在哪些地方超过开源方案</strong>。因为客户随时可以自建，我们必须回答\"凭什么用你的而不是自己搭\"。</p>\n<p><strong>开源方案已经做得很好、我们不必也不该在此纠缠的</strong>：多渠道分发、Key 管理、基础倍率计费、可视化控制台。这些是及格线，做到即可，不构成差异化。</p>\n<p><strong>开源方案的公认短板，也就是我们的机会点</strong>：</p>\n<p><strong>企业级保活与故障转移的成熟度。</strong> 开源网关普遍缺乏企业级保活机制，上游波动时的表现不稳定。这是我们 SLA 承诺的立足点。</p>\n<p><strong>账单颗粒度与成本归因。</strong> 开源方案能算钱，但算不清\"哪个业务、哪个功能、哪个时段最烧钱\"。<strong>这正是模块 03 分析层和模块 04 单位经济模型的用武之地</strong>，也是我们从工具走向服务的唯一路径。</p>\n<p><strong>合规配套。</strong> 开源网关不会帮客户准备模型备案文件、公示材料、6 个月日志留存的导出能力。<strong>这是自建方案永远补不上的一块</strong>（见模块 08），也是攻克企业客户的钥匙。</p>\n<p><strong>优化建议的能力。</strong> 开源方案给数据，我们给结论。\"你这个月有 62% 的输入是重复前缀，做缓存能省 1.8 万\"——这句话开源网关说不出来。</p>\n<p><strong>给决策层的判断</strong>：不要试图在功能数量上和开源方案竞争，那是一场必输的消耗战。<strong>我们的护城河只能建在\"运维确定性 + 成本管理能力 + 合规配套\"这三件开源社区没有动力去做的事情上。</strong> 这与模块 02 第四节的护城河判断完全一致。</p>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://blog.einverne.info/post/2025/10/new-api.html\">大语言模型 API 中转和聚合管理平台 New API 介绍及部署指南</a></li>\n<li><a href=\"https://www.ai-insight.org/reports/litellm-newapi\">LiteLLM vs NewAPI 深度对比：AI Gateway 选型指南</a></li>\n<li><a href=\"https://blog.csdn.net/ofoxcoding/article/details/158886435\">One-API vs New-API：2026 年开源 LLM 网关怎么选</a></li>\n<li><a href=\"https://segmentfault.com/a/1190000047675459\">模型 API 聚合平台深度盘点：2026 年主流选型指南 - SegmentFault</a></li>\n</ul>", "plain": " 模块 14 · API 网关与中转系统\n\n 覆盖：New API、One API、LiteLLM\n ⚠️ 这一层比较特殊：它既是客户可能在用的东西，也是我们自己业务的本体。\n 本模块同时是竞品分析和自研选型参考，含部分内部判断，对外分发需删减第五节。\n 数据采集日：20260727。\n\n\n\n 这一层的双重身份\n\n前面几个模块讲的都是\"客户拿 Key 去填的东西\"。这一模块不一样。\n\n当一个客户告诉你\"我们自己搭了 New API\"，这句话包含三层信息：他已经在管理多个模型渠道（说明用量到了一定规模）、他有技术能力自建基础设施（说明是技术型团队）、他此刻正在寻找上游渠道（说明我们可能是他的供应商之一）。\n\n这是最优质的线索类型之一。 因为他不需要被教育\"为什么要多模型\"，他已经在做了；他需要的只是一条稳定、便宜、能开票的上游通道。销售周期极短。\n\n同时，这一层也是我们必须最了解的——因为我们自己的网关（模块 03）就是在和这些开源方案竞争。客户随时可以问：\"我为什么不自己搭一个 New API？\"这个问题答不好，单子就没了。\n\n\n\n 一、New API\n\n 1.1 是什么\n\n由 QuantumNous 开发的开源 AI 模型管理与分发系统，基于 One API 二次开发而来，把各家大模型的官方调用结构统一转换成标准化的调用格式。2025 年 10 月时约 11k+ GitHub Star，是目前中文社区最主流的自建网关方案。\n\n它的定位可以概括为：不只是协议转换器，而是一套完整的 AI 资产管理系统——有用户体系、渠道体系、令牌体系、计费体系和可视化控制台。\n\n 1.2 核心能力\n\n多模型聚合与格式互转：原生支持 OpenAI、Claude Messages、Gemini 三种格式，并可在它们之间灵活转换。注意\"原生支持\"这个措辞——这正是模块 01 里我们指出的行业痛点所在，New API 在这方面做得比多数简易中转站好。\n\n缓存计费支持：可配置缓存计费倍率（0–1 区间），用于降低重复前缀的成本。这一点值得注意——它意味着自建 New API 的客户已经具备缓存意识，我们和他谈缓存优化时不能停留在扫盲层面。\n\n企业级管理：令牌分组、模型限制、差异化用户配置。四级权限体系：公开访问、用户令牌、管理员令牌、Root 访问令牌（在系统设置中生成）。\n\n可视化控制台：内置统计与性能监控面板。\n\n关键配置项（技术支持需要知道）：流式超时默认 300 秒、Gemini 最大图片数默认 16、最大文件下载 20MB、邮件通知限额等。\n\n 1.3 部署方式\n\n要求 Linux 环境（社区普遍推荐 Ubuntu 24.04）与 Docker，通过 dockercompose 部署，初始化后默认端口 3000。需要配套数据库（MySQL 或 PostgreSQL）与 Redis。\n\n部署门槛的真实评估：对有运维能力的团队来说不难，半天能跑起来。但\"跑起来\"和\"跑得稳\"之间差距很大——高并发下的连接池调优、数据库性能、渠道健康检查、故障自动切换，这些都要自己趟。这是我们和自建方案竞争的主战场。\n\n 1.4 客户自建 New API 时，我们如何成为它的上游\n\n这是本节最实用的部分。客户在 New API 后台的操作路径是：\n\n渠道管理 → 新建渠道，类型选 OpenAI（或对应协议），代理地址填 https://api.你的域名/v1，密钥填我们签发的 Key，模型列表填我们支持的模型 ID。\n\n技术支持要重点提醒客户三件事：\n\n第一，模型 ID 必须与我们控制台一致。 New API 支持\"模型重定向\"功能，客户可以把内部名映射到我们的实际模型 ID。如果不用重定向，就必须一字不差。这是接入失败的头号原因。\n\n第二，把我们配成\"高优先级渠道\"还是\"备用渠道\"。 New API 支持渠道优先级和权重。销售应当主动争取成为主渠道，而不是默认被放在备用位——很多客户接进来之后就忘了调优先级，我们的量一直上不去，还以为是客户不认可。\n\n第三，倍率配置要对齐。 New API 的分组倍率、模型倍率如果配错，客户的成本核算会与我们的账单对不上，容易引发争议。首次接入时最好由我们的技术支持陪同配置一遍。\n\n 1.5 token 消耗特征与客户画像\n\n自建 New API 的客户，用量已经过了自助阶段。 通常是：AI 应用公司要给内部多个团队分发 Key、小型中转商在做二次分销、企业 IT 部门在做统一管控。\n\n月消耗量级通常在千万到十亿 token 之间，且波动可预测性较好（因为下游是相对固定的业务）。\n\n这类客户的两个典型诉求：一是采购价要低（他们自己也在算差价），二是通道要稳（他们对下游有承诺）。价格敏感度高于平均水平，但一旦稳定下来粘性也很高——因为切换上游要重新配置和验证。\n\n 1.6 销售切入点\n\n切入点一 —— 做他的主力上游。 最直接的目标。谈判重点是价格和 SLA，不用讲太多产品价值，他都懂。\n\n切入点二 —— 做他的冗余通道。 如果主渠道拿不下，先进备用位。New API 支持自动故障转移，只要我们够稳，主渠道波动时流量会自然流到我们这里，用量会慢慢涨上来。这是低阻力的进入方式。\n\n切入点三 —— 说服他从自建转向托管。 这是最难但价值最高的一条。核心论点不是\"你搭得不好\"，而是：\n\n \"自建 New API 本身不难，难的是它出问题时候的三件事：上游波动了谁去切、账单和客户对不上了谁去查、要开发票和备案材料时找谁要。这三件事你现在是自己的人在做，那部分人力成本你算过吗？\"\n\n诚实的边界：如果客户团队有专职运维、用量很大、且对成本极度敏感，自建对他确实是更优解。这种情况下硬推托管是徒劳的，应该老老实实做他的上游渠道。销售要能识别这个边界。\n\n\n\n 二、One API\n\n 2.1 是什么\n\nNew API 的上游项目，也是整个中文 LLM 网关生态的源头。定位相近——统一管理与分发主流 AI 模型 API。\n\n它与 New API 的关系需要销售理解清楚：New API 是在 One API 基础上二次开发的，功能更多、迭代更活跃；One API 更轻量、更稳定，但新特性跟进较慢。市面上还有 MIXAPI 等其他衍生分支，基本都源自这一脉。\n\n 2.2 与 New API 的选择差异\n\n对客户而言的实际差别：\n\nOne API 更适合：需求简单、只要基础的多渠道分发与 Key 管理、追求稳定不折腾的团队。\n\nNew API 更适合：需要缓存计费、多协议原生转换、更细的分组倍率与用户体系的团队。\n\n对我们而言的实际差别：几乎没有差别。两者接入我们的方式完全一致（渠道管理 → 新建渠道 → 填 base_url 和 Key）。技术支持不需要为此准备两套文档。\n\n唯一需要注意的是版本差异导致的界面路径不同，做接入指引时要问清楚客户用的是哪个、什么版本。\n\n\n\n 三、LiteLLM\n\n 3.1 是什么\n\n与前两者定位完全不同。LiteLLM 是一个 Python 库，让开发者用极少的代码改动在 100 多个模型之间切换。\n\n有一个流传很广的比喻精准概括了差异：\"LiteLLM 是开发者的瑞士军刀，New API 是企业的瑞士银行\"——前者在代码层面解决模型接入问题，后者在运维层面解决基础设施管理问题。\n\n它也提供 Proxy Server 模式（可以当网关跑），但其核心心智仍然是\"库\"，主要用户是写代码的人，不是管平台的人。\n\n 3.2 定位差异对我们的意义\n\n用 LiteLLM 的客户，通常处于更早的阶段。 他可能是一个独立开发者，或者一个还在写 MVP 的创业团队。用量小，但技术判断力强、迭代快、成长性好。\n\n接入方式：在 LiteLLM 的配置中把我们注册为一个 OpenAI 兼容的 provider，填 api_base 和 api_key 即可。对开发者来说是几分钟的事。\n\n销售策略与 New API 客户完全不同：不要用\"稳定性、SLA、发票\"那套企业话术，他现在不关心这些。他关心的是：模型全不全、有没有免费额度试、文档清不清楚、出问题能不能快速在社区/群里问到人。\n\n这类客户应该用\"开发者关系\"的方式服务，而不是销售的方式。 给测试额度、写好文档、在技术社区里保持存在感。他今天月消费 200 元，一年后产品跑起来可能就是月消费 20 万。\n\n\n\n 四、横向对比速查\n\n 维度  New API  One API  LiteLLM \n\n 形态  完整管理平台  完整管理平台  Python 库 + 可选 Proxy \n 主要用户  团队 / 生产环境  团队 / 轻量场景  个人开发者 / 早期项目 \n 协议支持  OpenAI / Claude / Gemini 原生  以 OpenAI 为主  100+ 模型抽象 \n 计费与多租户  强（分组倍率、令牌体系）  中  弱（非核心能力） \n 缓存计费  支持（可配倍率）  有限  依赖上游 \n 部署复杂度  中（Docker + DB + Redis）  中  低（pip 安装） \n 我们的角色  上游渠道  上游渠道  上游 provider \n 客户价值  高、粘性强  高  低但成长性好 \n 服务方式  商务 + 技术陪同  同左  开发者关系 \n\n\n\n 五、对我方自研网关的启示（内部，对外删除）\n\n把这一层研究透，最大的收获不是竞品分析，而是明确我们自研网关必须在哪些地方超过开源方案。因为客户随时可以自建，我们必须回答\"凭什么用你的而不是自己搭\"。\n\n开源方案已经做得很好、我们不必也不该在此纠缠的：多渠道分发、Key 管理、基础倍率计费、可视化控制台。这些是及格线，做到即可，不构成差异化。\n\n开源方案的公认短板，也就是我们的机会点：\n\n企业级保活与故障转移的成熟度。 开源网关普遍缺乏企业级保活机制，上游波动时的表现不稳定。这是我们 SLA 承诺的立足点。\n\n账单颗粒度与成本归因。 开源方案能算钱，但算不清\"哪个业务、哪个功能、哪个时段最烧钱\"。这正是模块 03 分析层和模块 04 单位经济模型的用武之地，也是我们从工具走向服务的唯一路径。\n\n合规配套。 开源网关不会帮客户准备模型备案文件、公示材料、6 个月日志留存的导出能力。这是自建方案永远补不上的一块（见模块 08），也是攻克企业客户的钥匙。\n\n优化建议的能力。 开源方案给数据，我们给结论。\"你这个月有 62% 的输入是重复前缀，做缓存能省 1.8 万\"——这句话开源网关说不出来。\n\n给决策层的判断：不要试图在功能数量上和开源方案竞争，那是一场必输的消耗战。我们的护城河只能建在\"运维确定性 + 成本管理能力 + 合规配套\"这三件开源社区没有动力去做的事情上。 这与模块 02 第四节的护城河判断完全一致。\n\n\n\n 数据来源\n\n [大语言模型 API 中转和聚合管理平台 New API 介绍及部署指南](https://blog.einverne.info/post/2025/10/newapi.html)\n [LiteLLM vs NewAPI 深度对比：AI Gateway 选型指南](https://www.aiinsight.org/reports/litellmnewapi)\n [OneAPI vs NewAPI：2026 年开源 LLM 网关怎么选](https://blog.csdn.net/ofoxcoding/article/details/158886435)\n [模型 API 聚合平台深度盘点：2026 年主流选型指南  SegmentFault](https://segmentfault.com/a/1190000047675459)\n"}, {"id": "15-桌面客户端", "code": "15", "title": "模块 15 · 桌面客户端", "short": "桌面客户端", "subs": ["这一层的经济学", "一、Cherry Studio", "二、ChatBox", "三、LobeChat", "四、Open WebUI", "五、横向对比速查", "六、这一层的统一行动策略", "数据来源"], "html": "<h1>模块 15 · 桌面客户端</h1>\n<blockquote>\n<p>覆盖：Cherry Studio、ChatBox、LobeChat、Open WebUI\n这一层的共同特征：<strong>用量小、笔数多、口碑扩散快、服务必须零人力</strong>。\n数据采集日：2026-07-27。</p>\n</blockquote>\n<hr />\n<h2>这一层的经济学</h2>\n<p>先把最重要的一条说在前面：<strong>这一层的客户，用销售去服务是亏的。</strong></p>\n<p>一个用 Cherry Studio 的个人用户，月消费可能是几十到几百元。按模块 04 的测算，即便毛利率做到 15%，一个月的毛利也就几十块。<strong>销售花半小时打个电话，这笔单子就永久性地亏了。</strong></p>\n<p>所以这一层的正确打法只有一条：<strong>极致自助化 + 内容驱动获客 + 文档解决一切</strong>。注册要顺、充值门槛要低、文档要好到客户不用问人。</p>\n<p>那为什么还要认真研究它？三个理由：</p>\n<p><strong>第一，它是口碑的扩散源。</strong> 用桌面客户端的人大量是开发者和技术爱好者，他们会在社区发帖、写教程、推荐给同事。<strong>一篇好的接入教程带来的自然流量，成本远低于任何投放。</strong></p>\n<p><strong>第二，它是企业单的前哨。</strong> 很多企业客户的第一次接触，是某个员工先在自己电脑上装了 Cherry Studio 试用我们的 Key，觉得好用，半年后公司要上 AI 项目时想起了我们。<strong>这条链路真实存在且转化率不低。</strong></p>\n<p><strong>第三，它是产品的压力测试场。</strong> 这批用户会最快发现文档写错了、模型列表没同步、某个模型 ID 变了。他们是免费的 QA。</p>\n<hr />\n<h2>一、Cherry Studio</h2>\n<h3>1.1 是什么</h3>\n<p>定位为\"专业级多引擎 AI 桌面助手\"，社区里也常被称为\"AI 资源聚合工作站\"。开源协议为 <strong>AGPL-3.0</strong>（早期曾为 Apache 2.0）。</p>\n<p>它与其他桌面客户端最大的差异是<strong>深度</strong>：不满足于聊天，而是把知识库、图像生成、代码辅助、Agent 能力都集成进来，做成一个工作台。</p>\n<h3>1.2 核心能力</h3>\n<p><strong>原生内置向量数据库</strong>，支持构建个人知识库，文档切分与索引能力在同类产品中较强。这一点直接影响 token 消耗特征——知识库问答意味着<strong>每次提问都会注入大段检索到的文档内容，输入 token 占比极高</strong>。</p>\n<p><strong>模型调度面广</strong>：除常规对话模型外，还支持图像生成模型、语音合成等，是\"多模态入口\"。</p>\n<p><strong>Agent 与工作流能力</strong>、MCP 支持、视觉呈现精致，面向专业工作流。</p>\n<p>平台覆盖 Windows、macOS、Linux 桌面三端，不做移动端。</p>\n<h3>1.3 接入我们的网关</h3>\n<p>路径：<strong>设置 → 模型服务 → 添加供应商</strong>，选 OpenAI 兼容类型，填写：</p>\n<pre><code>API 地址：https://api.你的域名/v1\nAPI 密钥：我们签发的 Key\n模型：从控制台复制完整模型 ID（可添加多个）\n</code></pre>\n<p>配置完点\"检测\"验证连通性。<strong>Cherry Studio 的供应商配置界面做得比较友好，是所有客户端里接入最省心的之一。</strong></p>\n<h3>1.4 token 消耗特征</h3>\n<p><strong>知识库场景是消耗大头，且输入输出比极度失衡。</strong> 典型的知识库问答，输入可能是 20,000 token（检索到的文档片段 + 系统提示词），输出只有 500 token，输入输出比 40:1。</p>\n<p><strong>这个特征意味着两件事</strong>：一是按平均价估算成本会严重失真（见模块 04 第二节）；二是<strong>缓存优化的空间极大</strong>——系统提示词和常被检索到的文档片段高度重复，做好缓存通常能省下可观比例。</p>\n<p><strong>这是我们做\"首月成本优化报告\"最容易出成绩的客户类型之一。</strong>（见模块 09 阶段三）</p>\n<h3>1.5 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：知识工作者、研究人员、独立咨询顾问、小团队的技术骨干。愿意为效率付费，对模型选型有真实需求（知道不同模型擅长不同事）。</p>\n<p><strong>切入点一 —— 模型选型建议。</strong> 这类用户经常纠结\"知识库问答该用哪个模型\"。给一份基于真实场景的选型建议（长上下文场景推荐哪个、成本敏感推荐哪个），比讲价格有效得多。</p>\n<p><strong>切入点二 —— 缓存教育。</strong> 大部分用户不知道缓存的存在。一篇《Cherry Studio 知识库省钱指南》可以同时做内容营销和客户教育。</p>\n<p><strong>注意事项</strong>：AGPL-3.0 协议意味着商业修改或再分发需要开源。<strong>如果企业客户提到\"我们想基于 Cherry Studio 改一个内部版本\"，要提示这个协议约束</strong>——这是展示专业度的机会，但要明确建议其咨询法务，我们不提供法律意见。</p>\n<hr />\n<h2>二、ChatBox</h2>\n<h3>2.1 是什么</h3>\n<p>强调\"轻量、跨平台的 AI 对话\"，主打简洁、高效、多端同步。开源协议同为 AGPL-3.0。</p>\n<p><strong>它最大的优势是平台覆盖最广</strong>：Windows、macOS、Linux、Android、iOS、Web 全都有。这是其他几个客户端做不到的。</p>\n<h3>2.2 定位差异</h3>\n<p>如果说 Cherry Studio 是\"工作站\"，ChatBox 就是\"随身工具\"。它不追求功能深度，追求的是<strong>在哪都能用、打开就能用</strong>。</p>\n<p>文件读取能力是基础级的，没有 Cherry Studio 那样的原生向量库。模型支持覆盖主流厂商（OpenAI、Claude、Gemini、Ollama 等）。</p>\n<h3>2.3 接入我们的网关</h3>\n<p>路径：<strong>设置 → 模型 → 选择自定义/OpenAI API 模式</strong>，填入自定义 base_url 与 API Key。</p>\n<p>ChatBox 支持\"自建 API 代理\"设置，就是给我们这种场景准备的，填 <code>https://api.你的域名/v1</code> 即可。</p>\n<h3>2.4 token 消耗与客户画像</h3>\n<p><strong>消耗量在这一层里偏低</strong>，因为它主要是对话场景，没有知识库那样的大输入。典型用户月消耗在几十万到几百万 token。</p>\n<p><strong>但笔数多、覆盖广。</strong> 移动端的存在意味着用户可能全天候使用，使用频次高于纯桌面工具。</p>\n<p><strong>典型客户</strong>：需要随时随地用 AI 的个人用户、学生、非技术岗的职场人。<strong>技术门槛最低，也就意味着技术支持问题最\"基础\"</strong>——文档必须写到\"手把手\"级别，配图不能省。</p>\n<h3>2.5 切入点</h3>\n<p><strong>主要靠自助转化，销售不介入。</strong></p>\n<p>值得做的一件事：<strong>针对 ChatBox 的移动端做一篇接入教程</strong>。这是差异化内容——大部分中转服务的文档只写桌面端配置，移动端用户找不到指引就流失了。这类内容的搜索流量竞争小。</p>\n<hr />\n<h2>三、LobeChat</h2>\n<h3>3.1 是什么</h3>\n<p>开源的现代化 AI 对话框架，特点是<strong>既可以本地部署也可以一键部署到云端</strong>（Vercel 等），界面设计现代，插件生态与主题系统较丰富。</p>\n<p>它介于\"个人客户端\"和\"团队自部署平台\"之间——个人可以用，小团队也可以部署一个共享实例。</p>\n<h3>3.2 对我们的意义</h3>\n<p><strong>它的双重形态带来了两类不同的客户：</strong></p>\n<p><strong>个人用户</strong>：本地或个人云部署，用量特征接近 ChatBox，走自助路线。</p>\n<p><strong>小团队共享实例</strong>：一个部署实例后面挂着十几个到几十个同事。<strong>这类客户的用量会跳一个数量级</strong>，且具备\"企业客户雏形\"——他们开始需要用量统计、成本分摊、访问控制。</p>\n<p><strong>销售应当具备识别能力</strong>：客户提到\"我们部署了一个 LobeChat 给团队用\"，这句话意味着他很快就会遇到\"谁用了多少、这个月花了多少\"的问题——<strong>而这正是我们子账号与部门归集功能的切入口</strong>（见模块 03 管控层）。</p>\n<h3>3.3 接入我们的网关</h3>\n<p>在环境变量或界面设置中配置 OpenAI 兼容端点，核心是 <code>OPENAI_PROXY_URL</code>（或界面里的自定义 API 地址）与 <code>OPENAI_API_KEY</code>。</p>\n<p>自部署版本通过环境变量配置更常见，<strong>技术支持要能同时说清楚\"界面配置\"和\"环境变量配置\"两条路径</strong>。</p>\n<h3>3.4 切入点</h3>\n<p><strong>从\"团队共享实例\"切入企业。</strong> 具体话术：</p>\n<blockquote>\n<p>\"你们这个 LobeChat 实例现在几个人在用？月底你能说清楚是哪个部门花的最多吗？我们的子账号可以按人或按部门拆，每个月自动出一份用量报告，你直接转给财务就行。\"</p>\n</blockquote>\n<p>这个问题几乎所有共享实例的管理者都答不上来，而且是他真实的痛点。</p>\n<hr />\n<h2>四、Open WebUI</h2>\n<h3>4.1 是什么</h3>\n<p>最初围绕 Ollama 本地模型生态发展起来的 Web 界面，后来扩展为通用的 AI 对话前端，<strong>同时支持本地模型和远程 API</strong>。</p>\n<p>它在<strong>企业内网自部署</strong>场景里的存在感很强——因为它天然适配\"模型部署在内网\"的架构，很多做数据不出域方案的企业会用它做前端。</p>\n<h3>4.2 对我们的意义（重要）</h3>\n<p><strong>这是本模块里最具企业销售价值的一个。</strong></p>\n<p>因为用 Open WebUI 的企业，往往正处在一个特定的阶段：<strong>他们已经在内网部署了开源模型（通过 Ollama 或 vLLM），但发现开源模型能力不够，需要在某些场景调用商业模型。</strong></p>\n<p>这个阶段的客户诉求非常具体：<strong>混合架构</strong>——常规问答走内网本地模型（零边际成本、数据不出网），复杂任务走外部商业模型（能力强、按量付费）。</p>\n<p><strong>这正是我们的多模型路由能力的完美用例</strong>（见模块 03 路由层）。销售话术：</p>\n<blockquote>\n<p>\"你们本地模型跑常规问答没问题，但遇到复杂推理和长文档就吃力。不用改架构——Open WebUI 里再加一个 OpenAI 兼容的连接指向我们，让用户在界面上自己切，或者按场景做路由。本地的那部分一分钱不花，只有走出去的部分才计费，而且能看到具体是哪些请求走了外部模型。\"</p>\n</blockquote>\n<h3>4.3 接入我们的网关</h3>\n<p>路径：<strong>管理面板 → 设置 → 连接 → OpenAI API</strong>，添加一条连接：</p>\n<pre><code>API Base URL：https://api.你的域名/v1\nAPI Key：我们签发的 Key\n</code></pre>\n<p>Open WebUI 支持<strong>同时配置多个 OpenAI 兼容连接</strong>，这正是混合架构的基础——本地 Ollama 一条，我们一条，用户在模型下拉里能同时看到两边的模型。</p>\n<h3>4.4 token 消耗与客户画像</h3>\n<p><strong>消耗量取决于混合比例</strong>，波动较大。初期可能只有 10%–20% 的请求走外部模型，随着用户发现商业模型好用，这个比例通常会持续上升。</p>\n<p><strong>典型客户</strong>：有数据合规要求的中大型企业、政务与国企的信息化部门、做私有化交付的系统集成商。</p>\n<p><strong>这类客户的决策链是模块 05 描述的完整企业链路</strong>：业务部门提需求、IT 评估、采购比价、法务审合同。销售周期 4–12 周，但单客户价值高、粘性强。</p>\n<h3>4.5 切入点与注意事项</h3>\n<p><strong>切入点：从\"补能力短板\"切入，不要从\"替换本地模型\"切入。</strong> 客户在本地模型上已经投入了硬件和人力，任何\"你们那套不行\"的暗示都会引发抵触。正确的姿态是\"帮你把短板补上，本地那部分继续用\"。</p>\n<p><strong>必须配套的材料</strong>：这类客户会要资质、合同、SLA、模型备案文件、日志留存说明（见模块 08）。建议直接发标准合规材料包，不要客户问一样给一样。</p>\n<p><strong>风险提示</strong>：客户如果要求\"数据完全不出内网\"，我们的标准方案满足不了，需要走私有化部署网关组件的方案（见模块 03 第三节）。<strong>销售要先问清楚\"不能出去\"具体指什么</strong>——多数时候客户的表述比实际要求严格（见模块 06 异议 5）。</p>\n<hr />\n<h2>五、横向对比速查</h2>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>Cherry Studio</th>\n<th>ChatBox</th>\n<th>LobeChat</th>\n<th>Open WebUI</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>定位</td>\n<td>专业工作站</td>\n<td>轻量随身工具</td>\n<td>现代化对话框架</td>\n<td>企业内网前端</td>\n</tr>\n<tr>\n<td>平台</td>\n<td>桌面三端</td>\n<td><strong>全平台含移动</strong></td>\n<td>本地 + 云部署</td>\n<td>Web 自部署</td>\n</tr>\n<tr>\n<td>知识库</td>\n<td><strong>原生向量库，强</strong></td>\n<td>基础文件读取</td>\n<td>中等</td>\n<td>中等</td>\n</tr>\n<tr>\n<td>典型部署</td>\n<td>个人电脑</td>\n<td>个人多端</td>\n<td>个人 / 团队共享</td>\n<td><strong>企业内网</strong></td>\n</tr>\n<tr>\n<td>月消耗量级</td>\n<td>百万级</td>\n<td>几十万～百万</td>\n<td>百万～千万（团队）</td>\n<td>千万级以上</td>\n</tr>\n<tr>\n<td>输入输出比</td>\n<td><strong>高（知识库）</strong></td>\n<td>均衡</td>\n<td>均衡</td>\n<td>视场景</td>\n</tr>\n<tr>\n<td>商业价值</td>\n<td>中，优化空间大</td>\n<td>低，走自助</td>\n<td>中，可培育为企业</td>\n<td><strong>高，企业入口</strong></td>\n</tr>\n<tr>\n<td>服务方式</td>\n<td>自助 + 优化内容</td>\n<td>纯自助</td>\n<td>自助 + 识别升级</td>\n<td><strong>销售介入</strong></td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>六、这一层的统一行动策略</h2>\n<p><strong>资源分配原则</strong>：Open WebUI 值得销售介入，LobeChat 团队实例值得识别和跟进，Cherry Studio 和 ChatBox 一律自助。</p>\n<p><strong>必须做的三件事：</strong></p>\n<p><strong>第一，把接入文档做到最好。</strong> 每个客户端一篇，带截图，覆盖桌面端和移动端，把三个高频报错（401 / 404 / 模型不存在，见模块 12）的排查写进去。<strong>这是这一层唯一值得投入的\"服务\"。</strong></p>\n<p><strong>第二，做面向搜索的内容。</strong> 《Cherry Studio 知识库省钱指南》《ChatBox 移动端接入教程》《Open WebUI 混合本地模型与云端模型的配置方法》这类标题，搜索竞争小、意图精准、转化率高。</p>\n<p><strong>第三，建立\"用量跃迁\"的自动识别。</strong> 当一个自助客户的月消耗连续两个月翻倍，或者从个人量级跳到团队量级，系统应该自动提醒——<strong>这往往意味着他从个人使用变成了团队使用，是从长尾客户升级为企业客户的信号，值得销售介入一次。</strong></p>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://www.cnblogs.com/know-data/p/19803951\">ChatBox / Cherry Studio 开源 AI 客户端调研 - 博客园</a></li>\n<li><a href=\"https://help.apiyi.com/cherry-studio-vs-chatbox-comparison.html\">Cherry Studio 与 Chatbox 全面对比</a></li>\n<li><a href=\"https://blog.csdn.net/tgb3456789/article/details/155440816\">Cherry Studio vs ChatBox vs AnythingLLM 实测对比</a></li>\n</ul>", "plain": " 模块 15 · 桌面客户端\n\n 覆盖：Cherry Studio、ChatBox、LobeChat、Open WebUI\n 这一层的共同特征：用量小、笔数多、口碑扩散快、服务必须零人力。\n 数据采集日：20260727。\n\n\n\n 这一层的经济学\n\n先把最重要的一条说在前面：这一层的客户，用销售去服务是亏的。\n\n一个用 Cherry Studio 的个人用户，月消费可能是几十到几百元。按模块 04 的测算，即便毛利率做到 15%，一个月的毛利也就几十块。销售花半小时打个电话，这笔单子就永久性地亏了。\n\n所以这一层的正确打法只有一条：极致自助化 + 内容驱动获客 + 文档解决一切。注册要顺、充值门槛要低、文档要好到客户不用问人。\n\n那为什么还要认真研究它？三个理由：\n\n第一，它是口碑的扩散源。 用桌面客户端的人大量是开发者和技术爱好者，他们会在社区发帖、写教程、推荐给同事。一篇好的接入教程带来的自然流量，成本远低于任何投放。\n\n第二，它是企业单的前哨。 很多企业客户的第一次接触，是某个员工先在自己电脑上装了 Cherry Studio 试用我们的 Key，觉得好用，半年后公司要上 AI 项目时想起了我们。这条链路真实存在且转化率不低。\n\n第三，它是产品的压力测试场。 这批用户会最快发现文档写错了、模型列表没同步、某个模型 ID 变了。他们是免费的 QA。\n\n\n\n 一、Cherry Studio\n\n 1.1 是什么\n\n定位为\"专业级多引擎 AI 桌面助手\"，社区里也常被称为\"AI 资源聚合工作站\"。开源协议为 AGPL3.0（早期曾为 Apache 2.0）。\n\n它与其他桌面客户端最大的差异是深度：不满足于聊天，而是把知识库、图像生成、代码辅助、Agent 能力都集成进来，做成一个工作台。\n\n 1.2 核心能力\n\n原生内置向量数据库，支持构建个人知识库，文档切分与索引能力在同类产品中较强。这一点直接影响 token 消耗特征——知识库问答意味着每次提问都会注入大段检索到的文档内容，输入 token 占比极高。\n\n模型调度面广：除常规对话模型外，还支持图像生成模型、语音合成等，是\"多模态入口\"。\n\nAgent 与工作流能力、MCP 支持、视觉呈现精致，面向专业工作流。\n\n平台覆盖 Windows、macOS、Linux 桌面三端，不做移动端。\n\n 1.3 接入我们的网关\n\n路径：设置 → 模型服务 → 添加供应商，选 OpenAI 兼容类型，填写：\n\n\nAPI 地址：https://api.你的域名/v1\nAPI 密钥：我们签发的 Key\n模型：从控制台复制完整模型 ID（可添加多个）\n\n\n配置完点\"检测\"验证连通性。Cherry Studio 的供应商配置界面做得比较友好，是所有客户端里接入最省心的之一。\n\n 1.4 token 消耗特征\n\n知识库场景是消耗大头，且输入输出比极度失衡。 典型的知识库问答，输入可能是 20,000 token（检索到的文档片段 + 系统提示词），输出只有 500 token，输入输出比 40:1。\n\n这个特征意味着两件事：一是按平均价估算成本会严重失真（见模块 04 第二节）；二是缓存优化的空间极大——系统提示词和常被检索到的文档片段高度重复，做好缓存通常能省下可观比例。\n\n这是我们做\"首月成本优化报告\"最容易出成绩的客户类型之一。（见模块 09 阶段三）\n\n 1.5 客户画像与切入点\n\n典型客户：知识工作者、研究人员、独立咨询顾问、小团队的技术骨干。愿意为效率付费，对模型选型有真实需求（知道不同模型擅长不同事）。\n\n切入点一 —— 模型选型建议。 这类用户经常纠结\"知识库问答该用哪个模型\"。给一份基于真实场景的选型建议（长上下文场景推荐哪个、成本敏感推荐哪个），比讲价格有效得多。\n\n切入点二 —— 缓存教育。 大部分用户不知道缓存的存在。一篇《Cherry Studio 知识库省钱指南》可以同时做内容营销和客户教育。\n\n注意事项：AGPL3.0 协议意味着商业修改或再分发需要开源。如果企业客户提到\"我们想基于 Cherry Studio 改一个内部版本\"，要提示这个协议约束——这是展示专业度的机会，但要明确建议其咨询法务，我们不提供法律意见。\n\n\n\n 二、ChatBox\n\n 2.1 是什么\n\n强调\"轻量、跨平台的 AI 对话\"，主打简洁、高效、多端同步。开源协议同为 AGPL3.0。\n\n它最大的优势是平台覆盖最广：Windows、macOS、Linux、Android、iOS、Web 全都有。这是其他几个客户端做不到的。\n\n 2.2 定位差异\n\n如果说 Cherry Studio 是\"工作站\"，ChatBox 就是\"随身工具\"。它不追求功能深度，追求的是在哪都能用、打开就能用。\n\n文件读取能力是基础级的，没有 Cherry Studio 那样的原生向量库。模型支持覆盖主流厂商（OpenAI、Claude、Gemini、Ollama 等）。\n\n 2.3 接入我们的网关\n\n路径：设置 → 模型 → 选择自定义/OpenAI API 模式，填入自定义 base_url 与 API Key。\n\nChatBox 支持\"自建 API 代理\"设置，就是给我们这种场景准备的，填 https://api.你的域名/v1 即可。\n\n 2.4 token 消耗与客户画像\n\n消耗量在这一层里偏低，因为它主要是对话场景，没有知识库那样的大输入。典型用户月消耗在几十万到几百万 token。\n\n但笔数多、覆盖广。 移动端的存在意味着用户可能全天候使用，使用频次高于纯桌面工具。\n\n典型客户：需要随时随地用 AI 的个人用户、学生、非技术岗的职场人。技术门槛最低，也就意味着技术支持问题最\"基础\"——文档必须写到\"手把手\"级别，配图不能省。\n\n 2.5 切入点\n\n主要靠自助转化，销售不介入。\n\n值得做的一件事：针对 ChatBox 的移动端做一篇接入教程。这是差异化内容——大部分中转服务的文档只写桌面端配置，移动端用户找不到指引就流失了。这类内容的搜索流量竞争小。\n\n\n\n 三、LobeChat\n\n 3.1 是什么\n\n开源的现代化 AI 对话框架，特点是既可以本地部署也可以一键部署到云端（Vercel 等），界面设计现代，插件生态与主题系统较丰富。\n\n它介于\"个人客户端\"和\"团队自部署平台\"之间——个人可以用，小团队也可以部署一个共享实例。\n\n 3.2 对我们的意义\n\n它的双重形态带来了两类不同的客户：\n\n个人用户：本地或个人云部署，用量特征接近 ChatBox，走自助路线。\n\n小团队共享实例：一个部署实例后面挂着十几个到几十个同事。这类客户的用量会跳一个数量级，且具备\"企业客户雏形\"——他们开始需要用量统计、成本分摊、访问控制。\n\n销售应当具备识别能力：客户提到\"我们部署了一个 LobeChat 给团队用\"，这句话意味着他很快就会遇到\"谁用了多少、这个月花了多少\"的问题——而这正是我们子账号与部门归集功能的切入口（见模块 03 管控层）。\n\n 3.3 接入我们的网关\n\n在环境变量或界面设置中配置 OpenAI 兼容端点，核心是 OPENAI_PROXY_URL（或界面里的自定义 API 地址）与 OPENAI_API_KEY。\n\n自部署版本通过环境变量配置更常见，技术支持要能同时说清楚\"界面配置\"和\"环境变量配置\"两条路径。\n\n 3.4 切入点\n\n从\"团队共享实例\"切入企业。 具体话术：\n\n \"你们这个 LobeChat 实例现在几个人在用？月底你能说清楚是哪个部门花的最多吗？我们的子账号可以按人或按部门拆，每个月自动出一份用量报告，你直接转给财务就行。\"\n\n这个问题几乎所有共享实例的管理者都答不上来，而且是他真实的痛点。\n\n\n\n 四、Open WebUI\n\n 4.1 是什么\n\n最初围绕 Ollama 本地模型生态发展起来的 Web 界面，后来扩展为通用的 AI 对话前端，同时支持本地模型和远程 API。\n\n它在企业内网自部署场景里的存在感很强——因为它天然适配\"模型部署在内网\"的架构，很多做数据不出域方案的企业会用它做前端。\n\n 4.2 对我们的意义（重要）\n\n这是本模块里最具企业销售价值的一个。\n\n因为用 Open WebUI 的企业，往往正处在一个特定的阶段：他们已经在内网部署了开源模型（通过 Ollama 或 vLLM），但发现开源模型能力不够，需要在某些场景调用商业模型。\n\n这个阶段的客户诉求非常具体：混合架构——常规问答走内网本地模型（零边际成本、数据不出网），复杂任务走外部商业模型（能力强、按量付费）。\n\n这正是我们的多模型路由能力的完美用例（见模块 03 路由层）。销售话术：\n\n \"你们本地模型跑常规问答没问题，但遇到复杂推理和长文档就吃力。不用改架构——Open WebUI 里再加一个 OpenAI 兼容的连接指向我们，让用户在界面上自己切，或者按场景做路由。本地的那部分一分钱不花，只有走出去的部分才计费，而且能看到具体是哪些请求走了外部模型。\"\n\n 4.3 接入我们的网关\n\n路径：管理面板 → 设置 → 连接 → OpenAI API，添加一条连接：\n\n\nAPI Base URL：https://api.你的域名/v1\nAPI Key：我们签发的 Key\n\n\nOpen WebUI 支持同时配置多个 OpenAI 兼容连接，这正是混合架构的基础——本地 Ollama 一条，我们一条，用户在模型下拉里能同时看到两边的模型。\n\n 4.4 token 消耗与客户画像\n\n消耗量取决于混合比例，波动较大。初期可能只有 10%–20% 的请求走外部模型，随着用户发现商业模型好用，这个比例通常会持续上升。\n\n典型客户：有数据合规要求的中大型企业、政务与国企的信息化部门、做私有化交付的系统集成商。\n\n这类客户的决策链是模块 05 描述的完整企业链路：业务部门提需求、IT 评估、采购比价、法务审合同。销售周期 4–12 周，但单客户价值高、粘性强。\n\n 4.5 切入点与注意事项\n\n切入点：从\"补能力短板\"切入，不要从\"替换本地模型\"切入。 客户在本地模型上已经投入了硬件和人力，任何\"你们那套不行\"的暗示都会引发抵触。正确的姿态是\"帮你把短板补上，本地那部分继续用\"。\n\n必须配套的材料：这类客户会要资质、合同、SLA、模型备案文件、日志留存说明（见模块 08）。建议直接发标准合规材料包，不要客户问一样给一样。\n\n风险提示：客户如果要求\"数据完全不出内网\"，我们的标准方案满足不了，需要走私有化部署网关组件的方案（见模块 03 第三节）。销售要先问清楚\"不能出去\"具体指什么——多数时候客户的表述比实际要求严格（见模块 06 异议 5）。\n\n\n\n 五、横向对比速查\n\n 维度  Cherry Studio  ChatBox  LobeChat  Open WebUI \n\n 定位  专业工作站  轻量随身工具  现代化对话框架  企业内网前端 \n 平台  桌面三端  全平台含移动  本地 + 云部署  Web 自部署 \n 知识库  原生向量库，强  基础文件读取  中等  中等 \n 典型部署  个人电脑  个人多端  个人 / 团队共享  企业内网 \n 月消耗量级  百万级  几十万～百万  百万～千万（团队）  千万级以上 \n 输入输出比  高（知识库）  均衡  均衡  视场景 \n 商业价值  中，优化空间大  低，走自助  中，可培育为企业  高，企业入口 \n 服务方式  自助 + 优化内容  纯自助  自助 + 识别升级  销售介入 \n\n\n\n 六、这一层的统一行动策略\n\n资源分配原则：Open WebUI 值得销售介入，LobeChat 团队实例值得识别和跟进，Cherry Studio 和 ChatBox 一律自助。\n\n必须做的三件事：\n\n第一，把接入文档做到最好。 每个客户端一篇，带截图，覆盖桌面端和移动端，把三个高频报错（401 / 404 / 模型不存在，见模块 12）的排查写进去。这是这一层唯一值得投入的\"服务\"。\n\n第二，做面向搜索的内容。 《Cherry Studio 知识库省钱指南》《ChatBox 移动端接入教程》《Open WebUI 混合本地模型与云端模型的配置方法》这类标题，搜索竞争小、意图精准、转化率高。\n\n第三，建立\"用量跃迁\"的自动识别。 当一个自助客户的月消耗连续两个月翻倍，或者从个人量级跳到团队量级，系统应该自动提醒——这往往意味着他从个人使用变成了团队使用，是从长尾客户升级为企业客户的信号，值得销售介入一次。\n\n\n\n 数据来源\n\n [ChatBox / Cherry Studio 开源 AI 客户端调研  博客园](https://www.cnblogs.com/knowdata/p/19803951)\n [Cherry Studio 与 Chatbox 全面对比](https://help.apiyi.com/cherrystudiovschatboxcomparison.html)\n [Cherry Studio vs ChatBox vs AnythingLLM 实测对比](https://blog.csdn.net/tgb3456789/article/details/155440816)\n"}, {"id": "16-编程Agent", "code": "16", "title": "模块 16 · 编程 Agent", "short": "编程 Agent", "subs": ["为什么这一层最重要", "这一层为什么这么烧钱：机制解释", "一、Claude Code", "二、Cursor", "三、Cline", "四、Roo Code", "五、横向对比速查", "六、这一层的统一行动策略", "数据来源"], "html": "<h1>模块 16 · 编程 Agent</h1>\n<blockquote>\n<p>覆盖：Claude Code、Cursor、Cline、Roo Code\n⚠️ <strong>这是当下 token 消耗最猛、增长最快、也最容易失控的一层。</strong>\nUber 四个月烧光全年预算、米哈游 13 小时 200 万账单，都出自这一层。\n数据采集日：2026-07-27。</p>\n</blockquote>\n<hr />\n<h2>为什么这一层最重要</h2>\n<p>如果只能选一层深入，选这一层。三个理由。</p>\n<p><strong>第一，量最大。</strong> 一个工程师用编程 Agent 认真写一天代码，消耗几百万到上千万 token 是常态。一个 50 人的研发团队，月消耗轻松过十亿。<strong>没有任何其他形态能在这么少的人头上产生这么大的量。</strong></p>\n<p><strong>第二，最不可预测，因此最需要管理。</strong> 模块 01 引用的两个案例——Uber 向 5000 名工程师开放 AI 编程工具后四个月烧光全年预算，米哈游一位工程师做多 Agent 协作测试 13 小时产生 200 万元账单——<strong>说明的不是\"AI 太贵\"，而是\"没人能预判它会烧多少\"。</strong> 而不可预测的成本，正是我们提供管理价值的空间（见模块 02 第一条基本认知）。</p>\n<p><strong>第三，客户最痛。</strong> 研发负责人被 CFO 问\"这个月 AI 花了多少、值不值\"的时候，他答不上来。他需要的不是更便宜的 token，是<strong>能让他向上交代的东西</strong>：按人、按项目拆分的用量，预算上限，超额熔断，异常告警。这些正是我们管控层和分析层的能力（见模块 03）。</p>\n<p><strong>一条核心销售认知：面对这一层的客户，不要卖 token，卖\"预算可控\"。</strong> 价格在他的决策权重里排不进前三。</p>\n<hr />\n<h2>这一层为什么这么烧钱：机制解释</h2>\n<p>销售必须能把这件事讲清楚，因为<strong>大部分客户自己也不明白钱去哪了</strong>。讲明白了，我们就从供应商变成了顾问。</p>\n<p><strong>根本原因是 Agent 循环，不是调用次数。</strong></p>\n<p>传统的代码补全是\"一次输入、一次输出\"。编程 Agent 不是——它的工作方式是：读取项目文件 → 思考 → 修改代码 → 运行测试 → 看到报错 → 再思考 → 再修改 → 再测试……每一轮都是一次完整的模型调用，<strong>而且每一轮的输入里都累积着前面所有轮次的上下文</strong>（见模块 13 OpenManus 的 ReAct 机制说明）。</p>\n<p>于是消耗呈现三个特征：</p>\n<p><strong>上下文单调增长。</strong> 一个任务做到第 20 轮时，单次输入可能已经是第 1 轮的十几倍。这是非线性增长的根源。</p>\n<p><strong>代码库读取是巨量输入。</strong> Agent 为了理解项目会读大量文件，动辄几十万 token 的输入。<strong>这部分内容在同一个会话里高度重复，是缓存优化的黄金地带。</strong></p>\n<p><strong>失败重试是纯浪费。</strong> 测试不通过就重来一轮，一个卡住的任务可能循环十几次都没进展。这是最典型的\"烧钱不产出\"。</p>\n<p><strong>把这三条讲给客户听，然后问一句：\"你们现在能看到这三块各占多少吗？\"</strong> —— 这是模块 05 开场问题库里最有杀伤力的一个问题。</p>\n<hr />\n<h2>一、Claude Code</h2>\n<h3>1.1 是什么</h3>\n<p>Anthropic 官方的终端编程 Agent，跑在命令行里，能读写文件、执行命令、跑测试、提交 git。是当前专业开发者群体中口碑最强的编程 Agent 之一。</p>\n<p>它的形态是终端而非 IDE 插件，这一点带来一个重要差异：<strong>它更容易被写进自动化脚本和 CI 流程</strong>，也就意味着它的消耗可以脱离\"人在敲键盘\"的节奏，出现无人值守的大量消耗。</p>\n<h3>1.2 接入我们的网关（重点）</h3>\n<p>Claude Code 走 <strong>Anthropic 原生协议</strong>，不是 OpenAI 兼容协议。这是接入配置里最容易搞错的地方。</p>\n<p><strong>方式一 · 环境变量（推荐）：</strong></p>\n<pre><code class=\"language-bash\">export ANTHROPIC_BASE_URL=&quot;https://api.你的域名/anthropic&quot;\nexport ANTHROPIC_AUTH_TOKEN=&quot;我们签发的 Key&quot;\n</code></pre>\n<p><strong>方式二 · 全局配置文件</strong> <code>~/.claude/settings.json</code>：</p>\n<pre><code class=\"language-json\">{\n  &quot;env&quot;: {\n    &quot;ANTHROPIC_BASE_URL&quot;: &quot;https://api.你的域名/anthropic&quot;,\n    &quot;ANTHROPIC_AUTH_TOKEN&quot;: &quot;我们签发的 Key&quot;\n  }\n}\n</code></pre>\n<p>模型切换在终端内用 <code>/model 模型名</code> 命令。</p>\n<p><strong>技术支持必须记住的三个要点：</strong></p>\n<p><strong>base_url 指向 Anthropic 专用端点，不带 <code>/v1</code>。</strong> 填成 <code>/v1</code> 会直接 404，这是最高频的报错。</p>\n<p><strong>用的是 <code>ANTHROPIC_AUTH_TOKEN</code> 而非 <code>ANTHROPIC_API_KEY</code>。</strong> 两个变量名都存在，含义不同，填错会 401。</p>\n<p><strong>必须是原生 Anthropic 协议支持，不能靠中间件转译。</strong> 转译方案在 tool use、思考过程透传、流式输出上都会出问题，表现是\"能聊天但不能干活\"。<strong>这正是模块 01 里指出的行业通病，也是我们最硬的差异化卖点之一。</strong></p>\n<h3>1.3 token 消耗特征</h3>\n<p><strong>这一层里消耗最猛的。</strong> 因为它默认读取项目上下文、默认多轮自主执行、且被广泛用于大型重构这类高消耗任务。</p>\n<p><strong>销售必须主动提示的一件事</strong>：Claude Code 用户如果没有配预算熔断，第一个月账单超预期三五倍是常见情况。<strong>开户时就帮他配好，是留住这类客户的关键动作。</strong></p>\n<h3>1.4 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：专业开发者、技术驱动的创业公司、大厂内部的效率工具团队。技术判断力强，对稳定性和协议完整度极度敏感，对价格相对不敏感。</p>\n<p><strong>切入点一 —— 协议原生支持。</strong> 直接问：\"你们现在用的通道，Claude Code 里的 tool use 和思考过程正常吗？\"很多用便宜中转的客户在这里踩过坑，一问就能勾起共鸣。</p>\n<p><strong>切入点二 —— 无人值守场景的熔断。</strong> 把 Claude Code 接进 CI 或定时脚本的客户，最怕的就是半夜跑飞。熔断和告警对他们是刚需不是加分项。</p>\n<p><strong>切入点三 —— 缓存。</strong> 项目上下文重复读取是这个场景的最大成本项，也是最容易做出效果的优化点。</p>\n<hr />\n<h2>二、Cursor</h2>\n<h3>2.1 是什么</h3>\n<p>以 AI 为核心重构的代码编辑器（VS Code 分支），是编程 Agent 里商业化最成功、用户基数最大的产品之一。它自带订阅制服务，同时<strong>允许用户配置自定义 API</strong>。</p>\n<h3>2.2 接入我们的网关</h3>\n<p>路径：<strong><code>Cmd + ,</code>（Windows 为 <code>Ctrl + ,</code>）→ Models 选项卡</strong></p>\n<p>配置步骤：在 API Key 输入框填入我们的 Key → 打开 <strong>Override Base URL</strong> 开关 → Base URL 填 <code>https://api.你的域名/v1</code> → 点击 <strong>Verify</strong> 验证 → 通过 <strong>+ Add Model</strong> 添加模型 ID。</p>\n<p><strong>注意事项：</strong></p>\n<p><strong>走 OpenAI 兼容协议，base_url 必须带 <code>/v1</code>。</strong> 与 Claude Code 正好相反，技术支持要能立刻区分。</p>\n<p><strong>模型 ID 可能需要带厂商前缀</strong>，例如 <code>anthropic/claude-...</code>。前缀写法各家网关不一致，<strong>我们的文档必须把自己的写法写死</strong>，并让客户从控制台直接复制。</p>\n<p><strong>Tab 补全功能独立于自定义 API 配置。</strong> 也就是说，即使配了我们的 API，Cursor 的 Tab 自动补全可能仍走它自己的服务。<strong>销售不要承诺\"接了我们之后 Cursor 所有功能都走我们通道\"</strong>，这是不准确的，客户发现后会认为我们不专业。</p>\n<h3>2.3 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：Cursor 订阅额度不够用的重度开发者、需要用特定模型的团队、以及<strong>因为订阅费用增长而寻找替代方案的团队</strong>。</p>\n<p><strong>切入点 —— 订阅额度焦虑。</strong> Cursor 的订阅模式在重度使用时会遇到额度限制。销售话术：</p>\n<blockquote>\n<p>\"你们几个人在用 Cursor？有没有遇到过额度用完要等或者要加钱的情况？配一条自定义 API 上去，超出订阅的部分按量走，用多少算多少，而且能看到具体是谁用得多。\"</p>\n</blockquote>\n<p><strong>诚实的边界</strong>：对轻度用户而言，Cursor 的订阅制通常比按量付费更划算。<strong>不要对所有 Cursor 用户推销</strong>，只对明确遇到额度瓶颈的重度用户和团队推。硬推会显得不专业。</p>\n<hr />\n<h2>三、Cline</h2>\n<h3>3.1 是什么</h3>\n<p>VS Code 里的开源终端 Agent 插件，以\"免费实现 Cursor 级体验\"著称。它不做订阅，纯粹按用户自己配的 API 计费——<strong>这意味着它的用户天然是我们的目标客户</strong>，因为他们必须自带 Key。</p>\n<h3>3.2 接入我们的网关</h3>\n<p>Cline 的特殊之处是<strong>两种协议都支持</strong>，配置路径：<strong>Cline 侧边栏 → 齿轮图标 → 设置</strong></p>\n<p><strong>OpenAI 兼容模式：</strong></p>\n<pre><code>API Provider：OpenAI Compatible\nBase URL：https://api.你的域名/v1\nAPI Key：我们签发的 Key\nModel ID：从控制台复制的模型 ID\n</code></pre>\n<p><strong>Anthropic 原生模式：</strong></p>\n<pre><code>API Provider：Anthropic\nBase URL：https://api.你的域名/anthropic\nAPI Key：我们签发的 Key\n</code></pre>\n<p><strong>技术支持建议</strong>：如果客户主要用 Claude 系模型，<strong>推荐走 Anthropic 原生模式</strong>，行为更完整。如果客户要在多家模型间切换，走 OpenAI 兼容模式更方便。</p>\n<h3>3.3 token 消耗特征</h3>\n<p><strong>Cline 的消耗在同类工具里偏高</strong>，这是公开讨论较多的一个点——有对比文章指出其单次请求费用与 Cursor 存在数倍差距。原因是它默认把较多的项目上下文塞进请求，且循环轮次多。</p>\n<p><strong>这对我们是双刃剑</strong>：收入高，但客户容易被账单吓到。<strong>必须在首月主动做成本复盘，把优化建议给出去</strong>（见模块 09 阶段六）。否则客户会把\"贵\"归因到我们的价格，而不是工具的消耗方式。</p>\n<p><strong>这是一个绝佳的顾问式销售场景</strong>：我们能告诉客户\"你的成本高不是因为我们贵，是因为 Cline 的上下文策略，这几个设置调一下能省下来\"——<strong>帮客户省钱反而能留住客户</strong>（见模块 10 论点 6）。</p>\n<h3>3.4 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：不愿付订阅费的独立开发者、需要用国产模型的团队、对工具可控性有要求的技术团队。</p>\n<p><strong>切入点 —— 他必须自带 Key，所以决策只有一个问题：用谁的 Key。</strong> 这是这一层里销售阻力最低的客户。核心比拼是价格、模型齐全度、稳定性和文档质量。</p>\n<p><strong>必做的一件事</strong>：写一篇《Cline 成本优化指南》。这类内容对 Cline 用户是刚需，搜索流量精准，且天然把我们的 Key 作为示例配置嵌入其中。</p>\n<hr />\n<h2>四、Roo Code</h2>\n<h3>4.1 是什么</h3>\n<p>从 Cline 分叉出来的开源项目（早期名为 Roo Cline），在 Cline 的基础上强化了<strong>模式/角色系统</strong>——可以为不同任务配置不同的角色（架构师、编码者、调试者等），每个角色有自己的提示词和可用工具。</p>\n<h3>4.2 对我们的意义</h3>\n<p><strong>模式系统直接影响 token 消耗结构。</strong> 不同模式的提示词长度和工具集不同，消耗差异明显。一个配置得当的团队，通过给简单任务分配轻量模式，可以显著降低成本。</p>\n<p><strong>这是一个高价值的优化咨询场景</strong>：帮客户设计模式配置策略（哪些任务用便宜模型的轻量模式、哪些必须上旗舰模型），是典型的\"用专业知识换毛利\"的增值服务（见模块 04 第五节）。</p>\n<h3>4.3 接入我们的网关</h3>\n<p>与 Cline 基本一致：侧边栏设置 → 选择 Provider（OpenAI Compatible 或对应厂商）→ 填 base_url 与 Key → 指定模型 ID。</p>\n<p><strong>Roo Code 的一个额外能力是可以为不同模式指定不同模型。</strong> 例如架构规划用旗舰模型、代码编写用性价比模型。<strong>这正好对上我们的多模型聚合价值</strong>——一个 Key 就能在所有模式里切换不同厂商的模型，这是单一厂商官方 API 做不到的。</p>\n<p><strong>这是对 Roo Code 用户最有力的销售论点</strong>：</p>\n<blockquote>\n<p>\"你的架构模式想用最强的模型，编码模式想用便宜的，调试模式可能又要换一个——直连官方你得配三个账号三个 Key。我们这里一个 Key 全覆盖，账单还能按模式拆开看。\"</p>\n</blockquote>\n<h3>4.4 客户画像</h3>\n<p><strong>典型客户</strong>：Cline 的进阶用户、对工作流有定制需求的团队。技术能力更强，愿意折腾配置，<strong>因此也更能理解和欣赏多模型路由的价值</strong>。</p>\n<hr />\n<h2>五、横向对比速查</h2>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>Claude Code</th>\n<th>Cursor</th>\n<th>Cline</th>\n<th>Roo Code</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>形态</td>\n<td>终端</td>\n<td>独立编辑器</td>\n<td>VS Code 插件</td>\n<td>VS Code 插件</td>\n</tr>\n<tr>\n<td>商业模式</td>\n<td>官方订阅 / 自带 Key</td>\n<td>订阅为主</td>\n<td><strong>纯自带 Key</strong></td>\n<td><strong>纯自带 Key</strong></td>\n</tr>\n<tr>\n<td>协议</td>\n<td><strong>Anthropic 原生</strong></td>\n<td>OpenAI 兼容</td>\n<td>两者皆可</td>\n<td>OpenAI 兼容为主</td>\n</tr>\n<tr>\n<td>base_url 带 /v1</td>\n<td>❌</td>\n<td>✅</td>\n<td>视模式</td>\n<td>✅</td>\n</tr>\n<tr>\n<td>消耗量级</td>\n<td><strong>极高</strong></td>\n<td>高</td>\n<td><strong>高（偏高）</strong></td>\n<td>高，可优化</td>\n</tr>\n<tr>\n<td>多模型需求</td>\n<td>中</td>\n<td>中</td>\n<td>高</td>\n<td><strong>极高（分模式）</strong></td>\n</tr>\n<tr>\n<td>销售阻力</td>\n<td>中</td>\n<td><strong>中高（订阅替代）</strong></td>\n<td><strong>低</strong></td>\n<td><strong>低</strong></td>\n</tr>\n<tr>\n<td>优化服务空间</td>\n<td>大（缓存）</td>\n<td>中</td>\n<td><strong>极大（上下文）</strong></td>\n<td><strong>极大（模式策略）</strong></td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>六、这一层的统一行动策略</h2>\n<p><strong>第一，把\"预算失控\"作为统一切入点，而不是价格。</strong> 这一层所有客户的共同痛点是成本不可预测。开场问题固定用模块 05 那句：\"给工程师开放 AI 编程工具之后，你们怎么控制预算？有没有人能在功能上线前告诉你它一个月会烧多少钱？\"</p>\n<p><strong>第二，开户即配熔断，不等客户要求。</strong> 这一层的客户流失，最主要的原因不是价格，是第一张账单的震惊。<strong>主动配好预算上限、超额熔断和用量告警，是留存率最高的单一动作。</strong></p>\n<p><strong>第三，首月成本复盘必做，且必须给出可验证的优化建议。</strong> 三个标准检查项：缓存利用率（项目上下文是否重复计费）、失败重试占比（多少 token 花在没进展的循环上）、模型分配合理性（简单任务是否在用旗舰模型）。这三项通常能找出 20%–40% 的优化空间。</p>\n<p><strong>第四，做内容。</strong> 这一层的用户高度集中在技术社区，对搜索和技术博客的依赖极高。《Cline 成本优化指南》《Claude Code 接第三方 API 完整配置》《Roo Code 分模式模型配置策略》这类内容，是获取这批客户成本最低的方式。</p>\n<p><strong>第五，识别\"从个人到团队\"的跃迁。</strong> 一个 Cline 个人用户的用量突然翻十倍，通常意味着他把工具推荐给了整个团队。<strong>这是从长尾客户升级为企业客户的最强信号，必须自动告警并触发销售跟进。</strong></p>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://ofox.ai/zh/blog/cursor-claude-code-cline-api-setup-guide-2026/\">Cursor、Claude Code、Cline 自定义 API 配置教程（2026）</a></li>\n<li><a href=\"https://zhuanlan.zhihu.com/p/32747273977\">Cursor vs Cline：单次请求费用差异分析 - 知乎</a></li>\n<li><a href=\"https://cloud.tencent.com/developer/article/2647087\">2026 年 AI 编程工具费用横评 - 腾讯云开发者社区</a></li>\n<li><a href=\"https://aiho.net/review/cline-deep-review.html\">Cline 深度评测：VS Code 里的终端 Agent</a></li>\n</ul>", "plain": " 模块 16 · 编程 Agent\n\n 覆盖：Claude Code、Cursor、Cline、Roo Code\n ⚠️ 这是当下 token 消耗最猛、增长最快、也最容易失控的一层。\n Uber 四个月烧光全年预算、米哈游 13 小时 200 万账单，都出自这一层。\n 数据采集日：20260727。\n\n\n\n 为什么这一层最重要\n\n如果只能选一层深入，选这一层。三个理由。\n\n第一，量最大。 一个工程师用编程 Agent 认真写一天代码，消耗几百万到上千万 token 是常态。一个 50 人的研发团队，月消耗轻松过十亿。没有任何其他形态能在这么少的人头上产生这么大的量。\n\n第二，最不可预测，因此最需要管理。 模块 01 引用的两个案例——Uber 向 5000 名工程师开放 AI 编程工具后四个月烧光全年预算，米哈游一位工程师做多 Agent 协作测试 13 小时产生 200 万元账单——说明的不是\"AI 太贵\"，而是\"没人能预判它会烧多少\"。 而不可预测的成本，正是我们提供管理价值的空间（见模块 02 第一条基本认知）。\n\n第三，客户最痛。 研发负责人被 CFO 问\"这个月 AI 花了多少、值不值\"的时候，他答不上来。他需要的不是更便宜的 token，是能让他向上交代的东西：按人、按项目拆分的用量，预算上限，超额熔断，异常告警。这些正是我们管控层和分析层的能力（见模块 03）。\n\n一条核心销售认知：面对这一层的客户，不要卖 token，卖\"预算可控\"。 价格在他的决策权重里排不进前三。\n\n\n\n 这一层为什么这么烧钱：机制解释\n\n销售必须能把这件事讲清楚，因为大部分客户自己也不明白钱去哪了。讲明白了，我们就从供应商变成了顾问。\n\n根本原因是 Agent 循环，不是调用次数。\n\n传统的代码补全是\"一次输入、一次输出\"。编程 Agent 不是——它的工作方式是：读取项目文件 → 思考 → 修改代码 → 运行测试 → 看到报错 → 再思考 → 再修改 → 再测试……每一轮都是一次完整的模型调用，而且每一轮的输入里都累积着前面所有轮次的上下文（见模块 13 OpenManus 的 ReAct 机制说明）。\n\n于是消耗呈现三个特征：\n\n上下文单调增长。 一个任务做到第 20 轮时，单次输入可能已经是第 1 轮的十几倍。这是非线性增长的根源。\n\n代码库读取是巨量输入。 Agent 为了理解项目会读大量文件，动辄几十万 token 的输入。这部分内容在同一个会话里高度重复，是缓存优化的黄金地带。\n\n失败重试是纯浪费。 测试不通过就重来一轮，一个卡住的任务可能循环十几次都没进展。这是最典型的\"烧钱不产出\"。\n\n把这三条讲给客户听，然后问一句：\"你们现在能看到这三块各占多少吗？\" —— 这是模块 05 开场问题库里最有杀伤力的一个问题。\n\n\n\n 一、Claude Code\n\n 1.1 是什么\n\nAnthropic 官方的终端编程 Agent，跑在命令行里，能读写文件、执行命令、跑测试、提交 git。是当前专业开发者群体中口碑最强的编程 Agent 之一。\n\n它的形态是终端而非 IDE 插件，这一点带来一个重要差异：它更容易被写进自动化脚本和 CI 流程，也就意味着它的消耗可以脱离\"人在敲键盘\"的节奏，出现无人值守的大量消耗。\n\n 1.2 接入我们的网关（重点）\n\nClaude Code 走 Anthropic 原生协议，不是 OpenAI 兼容协议。这是接入配置里最容易搞错的地方。\n\n方式一 · 环境变量（推荐）：\n\nbash\nexport ANTHROPIC_BASE_URL=\"https://api.你的域名/anthropic\"\nexport ANTHROPIC_AUTH_TOKEN=\"我们签发的 Key\"\n\n\n方式二 · 全局配置文件 ~/.claude/settings.json：\n\njson\n{\n  \"env\": {\n    \"ANTHROPIC_BASE_URL\": \"https://api.你的域名/anthropic\",\n    \"ANTHROPIC_AUTH_TOKEN\": \"我们签发的 Key\"\n  }\n}\n\n\n模型切换在终端内用 /model 模型名 命令。\n\n技术支持必须记住的三个要点：\n\nbase_url 指向 Anthropic 专用端点，不带 /v1。 填成 /v1 会直接 404，这是最高频的报错。\n\n用的是 ANTHROPIC_AUTH_TOKEN 而非 ANTHROPIC_API_KEY。 两个变量名都存在，含义不同，填错会 401。\n\n必须是原生 Anthropic 协议支持，不能靠中间件转译。 转译方案在 tool use、思考过程透传、流式输出上都会出问题，表现是\"能聊天但不能干活\"。这正是模块 01 里指出的行业通病，也是我们最硬的差异化卖点之一。\n\n 1.3 token 消耗特征\n\n这一层里消耗最猛的。 因为它默认读取项目上下文、默认多轮自主执行、且被广泛用于大型重构这类高消耗任务。\n\n销售必须主动提示的一件事：Claude Code 用户如果没有配预算熔断，第一个月账单超预期三五倍是常见情况。开户时就帮他配好，是留住这类客户的关键动作。\n\n 1.4 客户画像与切入点\n\n典型客户：专业开发者、技术驱动的创业公司、大厂内部的效率工具团队。技术判断力强，对稳定性和协议完整度极度敏感，对价格相对不敏感。\n\n切入点一 —— 协议原生支持。 直接问：\"你们现在用的通道，Claude Code 里的 tool use 和思考过程正常吗？\"很多用便宜中转的客户在这里踩过坑，一问就能勾起共鸣。\n\n切入点二 —— 无人值守场景的熔断。 把 Claude Code 接进 CI 或定时脚本的客户，最怕的就是半夜跑飞。熔断和告警对他们是刚需不是加分项。\n\n切入点三 —— 缓存。 项目上下文重复读取是这个场景的最大成本项，也是最容易做出效果的优化点。\n\n\n\n 二、Cursor\n\n 2.1 是什么\n\n以 AI 为核心重构的代码编辑器（VS Code 分支），是编程 Agent 里商业化最成功、用户基数最大的产品之一。它自带订阅制服务，同时允许用户配置自定义 API。\n\n 2.2 接入我们的网关\n\n路径：Cmd + ,（Windows 为 Ctrl + ,）→ Models 选项卡\n\n配置步骤：在 API Key 输入框填入我们的 Key → 打开 Override Base URL 开关 → Base URL 填 https://api.你的域名/v1 → 点击 Verify 验证 → 通过 + Add Model 添加模型 ID。\n\n注意事项：\n\n走 OpenAI 兼容协议，base_url 必须带 /v1。 与 Claude Code 正好相反，技术支持要能立刻区分。\n\n模型 ID 可能需要带厂商前缀，例如 anthropic/claude...。前缀写法各家网关不一致，我们的文档必须把自己的写法写死，并让客户从控制台直接复制。\n\nTab 补全功能独立于自定义 API 配置。 也就是说，即使配了我们的 API，Cursor 的 Tab 自动补全可能仍走它自己的服务。销售不要承诺\"接了我们之后 Cursor 所有功能都走我们通道\"，这是不准确的，客户发现后会认为我们不专业。\n\n 2.3 客户画像与切入点\n\n典型客户：Cursor 订阅额度不够用的重度开发者、需要用特定模型的团队、以及因为订阅费用增长而寻找替代方案的团队。\n\n切入点 —— 订阅额度焦虑。 Cursor 的订阅模式在重度使用时会遇到额度限制。销售话术：\n\n \"你们几个人在用 Cursor？有没有遇到过额度用完要等或者要加钱的情况？配一条自定义 API 上去，超出订阅的部分按量走，用多少算多少，而且能看到具体是谁用得多。\"\n\n诚实的边界：对轻度用户而言，Cursor 的订阅制通常比按量付费更划算。不要对所有 Cursor 用户推销，只对明确遇到额度瓶颈的重度用户和团队推。硬推会显得不专业。\n\n\n\n 三、Cline\n\n 3.1 是什么\n\nVS Code 里的开源终端 Agent 插件，以\"免费实现 Cursor 级体验\"著称。它不做订阅，纯粹按用户自己配的 API 计费——这意味着它的用户天然是我们的目标客户，因为他们必须自带 Key。\n\n 3.2 接入我们的网关\n\nCline 的特殊之处是两种协议都支持，配置路径：Cline 侧边栏 → 齿轮图标 → 设置\n\nOpenAI 兼容模式：\n\nAPI Provider：OpenAI Compatible\nBase URL：https://api.你的域名/v1\nAPI Key：我们签发的 Key\nModel ID：从控制台复制的模型 ID\n\n\nAnthropic 原生模式：\n\nAPI Provider：Anthropic\nBase URL：https://api.你的域名/anthropic\nAPI Key：我们签发的 Key\n\n\n技术支持建议：如果客户主要用 Claude 系模型，推荐走 Anthropic 原生模式，行为更完整。如果客户要在多家模型间切换，走 OpenAI 兼容模式更方便。\n\n 3.3 token 消耗特征\n\nCline 的消耗在同类工具里偏高，这是公开讨论较多的一个点——有对比文章指出其单次请求费用与 Cursor 存在数倍差距。原因是它默认把较多的项目上下文塞进请求，且循环轮次多。\n\n这对我们是双刃剑：收入高，但客户容易被账单吓到。必须在首月主动做成本复盘，把优化建议给出去（见模块 09 阶段六）。否则客户会把\"贵\"归因到我们的价格，而不是工具的消耗方式。\n\n这是一个绝佳的顾问式销售场景：我们能告诉客户\"你的成本高不是因为我们贵，是因为 Cline 的上下文策略，这几个设置调一下能省下来\"——帮客户省钱反而能留住客户（见模块 10 论点 6）。\n\n 3.4 客户画像与切入点\n\n典型客户：不愿付订阅费的独立开发者、需要用国产模型的团队、对工具可控性有要求的技术团队。\n\n切入点 —— 他必须自带 Key，所以决策只有一个问题：用谁的 Key。 这是这一层里销售阻力最低的客户。核心比拼是价格、模型齐全度、稳定性和文档质量。\n\n必做的一件事：写一篇《Cline 成本优化指南》。这类内容对 Cline 用户是刚需，搜索流量精准，且天然把我们的 Key 作为示例配置嵌入其中。\n\n\n\n 四、Roo Code\n\n 4.1 是什么\n\n从 Cline 分叉出来的开源项目（早期名为 Roo Cline），在 Cline 的基础上强化了模式/角色系统——可以为不同任务配置不同的角色（架构师、编码者、调试者等），每个角色有自己的提示词和可用工具。\n\n 4.2 对我们的意义\n\n模式系统直接影响 token 消耗结构。 不同模式的提示词长度和工具集不同，消耗差异明显。一个配置得当的团队，通过给简单任务分配轻量模式，可以显著降低成本。\n\n这是一个高价值的优化咨询场景：帮客户设计模式配置策略（哪些任务用便宜模型的轻量模式、哪些必须上旗舰模型），是典型的\"用专业知识换毛利\"的增值服务（见模块 04 第五节）。\n\n 4.3 接入我们的网关\n\n与 Cline 基本一致：侧边栏设置 → 选择 Provider（OpenAI Compatible 或对应厂商）→ 填 base_url 与 Key → 指定模型 ID。\n\nRoo Code 的一个额外能力是可以为不同模式指定不同模型。 例如架构规划用旗舰模型、代码编写用性价比模型。这正好对上我们的多模型聚合价值——一个 Key 就能在所有模式里切换不同厂商的模型，这是单一厂商官方 API 做不到的。\n\n这是对 Roo Code 用户最有力的销售论点：\n\n \"你的架构模式想用最强的模型，编码模式想用便宜的，调试模式可能又要换一个——直连官方你得配三个账号三个 Key。我们这里一个 Key 全覆盖，账单还能按模式拆开看。\"\n\n 4.4 客户画像\n\n典型客户：Cline 的进阶用户、对工作流有定制需求的团队。技术能力更强，愿意折腾配置，因此也更能理解和欣赏多模型路由的价值。\n\n\n\n 五、横向对比速查\n\n 维度  Claude Code  Cursor  Cline  Roo Code \n\n 形态  终端  独立编辑器  VS Code 插件  VS Code 插件 \n 商业模式  官方订阅 / 自带 Key  订阅为主  纯自带 Key  纯自带 Key \n 协议  Anthropic 原生  OpenAI 兼容  两者皆可  OpenAI 兼容为主 \n base_url 带 /v1  ❌  ✅  视模式  ✅ \n 消耗量级  极高  高  高（偏高）  高，可优化 \n 多模型需求  中  中  高  极高（分模式） \n 销售阻力  中  中高（订阅替代）  低  低 \n 优化服务空间  大（缓存）  中  极大（上下文）  极大（模式策略） \n\n\n\n 六、这一层的统一行动策略\n\n第一，把\"预算失控\"作为统一切入点，而不是价格。 这一层所有客户的共同痛点是成本不可预测。开场问题固定用模块 05 那句：\"给工程师开放 AI 编程工具之后，你们怎么控制预算？有没有人能在功能上线前告诉你它一个月会烧多少钱？\"\n\n第二，开户即配熔断，不等客户要求。 这一层的客户流失，最主要的原因不是价格，是第一张账单的震惊。主动配好预算上限、超额熔断和用量告警，是留存率最高的单一动作。\n\n第三，首月成本复盘必做，且必须给出可验证的优化建议。 三个标准检查项：缓存利用率（项目上下文是否重复计费）、失败重试占比（多少 token 花在没进展的循环上）、模型分配合理性（简单任务是否在用旗舰模型）。这三项通常能找出 20%–40% 的优化空间。\n\n第四，做内容。 这一层的用户高度集中在技术社区，对搜索和技术博客的依赖极高。《Cline 成本优化指南》《Claude Code 接第三方 API 完整配置》《Roo Code 分模式模型配置策略》这类内容，是获取这批客户成本最低的方式。\n\n第五，识别\"从个人到团队\"的跃迁。 一个 Cline 个人用户的用量突然翻十倍，通常意味着他把工具推荐给了整个团队。这是从长尾客户升级为企业客户的最强信号，必须自动告警并触发销售跟进。\n\n\n\n 数据来源\n\n [Cursor、Claude Code、Cline 自定义 API 配置教程（2026）](https://ofox.ai/zh/blog/cursorclaudecodeclineapisetupguide2026/)\n [Cursor vs Cline：单次请求费用差异分析  知乎](https://zhuanlan.zhihu.com/p/32747273977)\n [2026 年 AI 编程工具费用横评  腾讯云开发者社区](https://cloud.tencent.com/developer/article/2647087)\n [Cline 深度评测：VS Code 里的终端 Agent](https://aiho.net/review/clinedeepreview.html)\n"}, {"id": "17-应用编排平台", "code": "17", "title": "模块 17 · 应用编排平台", "short": "应用编排平台", "subs": ["这一层为什么是企业销售的主战场", "一、Dify", "二、Coze（扣子）", "三、FastGPT", "四、n8n", "五、RAGFlow", "六、横向对比速查", "七、这一层的统一行动策略", "数据来源"], "html": "<h1>模块 17 · 应用编排平台</h1>\n<blockquote>\n<p>覆盖：Dify、Coze、FastGPT、n8n、RAGFlow\n这一层的共同特征：<strong>企业客户的主要形态，单客户量大、决策链长、粘性极高</strong>。\n一个平台后面可能挂着几十条业务流程，一旦接进去就很难被替换。\n数据采集日：2026-07-27。</p>\n</blockquote>\n<hr />\n<h2>这一层为什么是企业销售的主战场</h2>\n<p>前面四层，客户是\"人在用 AI\"。这一层不同——<strong>客户是\"业务在用 AI\"</strong>。</p>\n<p>一个企业把 Dify 部署起来，上面跑的是客服工单分类、合同条款提取、销售话术生成、内部知识问答……这些流程一旦上线，就成了业务的一部分，每天自动运行，不依赖某个人是否打开某个软件。</p>\n<p>这带来三个对我们极其有利的特性：</p>\n<p><strong>用量稳定且可预测。</strong> 消耗跟随业务量而非人的心情。做容量规划、给授信额度、谈年度框架协议都变得可行。</p>\n<p><strong>粘性极高。</strong> 换上游供应商意味着要在几十个应用里逐个改配置、重新测试、重新验证输出质量。<strong>迁移成本高到几乎不会有人主动做。</strong></p>\n<p><strong>天然需要企业级能力。</strong> 部门归集、成本分摊、审计日志、发票、合规材料——这一层的客户全都要，而这正是我们区别于野生中转站的地方（见模块 03 管控层、模块 08）。</p>\n<p><strong>代价是销售周期长。</strong> 4–12 周是常态，需要走完模块 05 描述的完整企业决策链。<strong>但这是模块 04 里唯一能稳定产生健康贡献毛利的客户类型。</strong></p>\n<hr />\n<h2>一、Dify</h2>\n<h3>1.1 是什么</h3>\n<p>企业级 LLM 应用开发平台，是这一层里综合能力最强、企业采用最广的开源项目之一。定位是\"可扩展的 AI 产品底座\"——既能做 RAG 知识库，也能做工作流编排、Agent 编排、提示词管理。</p>\n<p>支持本地 Docker 私有化部署，这是它能进入企业的前提。</p>\n<h3>1.2 核心能力与消耗特征</h3>\n<p><strong>四类应用形态</strong>：对话型、文本生成型、Agent 型、工作流型。<strong>不同形态的消耗特征差异极大</strong>，销售必须能区分：</p>\n<p><strong>对话型 + 知识库（RAG）</strong>：输入巨大、输出较小，输入输出比可达 20:1 到 50:1。<strong>每次提问都会注入检索到的文档片段和系统提示词，重复度极高——缓存优化的黄金地带。</strong></p>\n<p><strong>工作流型</strong>：一条工作流里可能串联多个 LLM 节点，一次触发 = 多次调用。消耗随节点数线性放大。</p>\n<p><strong>Agent 型</strong>：带循环，消耗最不可预测（原理见模块 16）。</p>\n<p><strong>这个区分是我们做成本分析的基础。</strong> 一个企业客户的 Dify 上跑着二十个应用，其中往往有两三个占了 80% 的消耗——<strong>找出这几个并优化，就是最直接的价值证明。</strong></p>\n<h3>1.3 接入我们的网关</h3>\n<p>路径：<strong>设置 → 模型供应商 → 添加 OpenAI-API-compatible 类型</strong></p>\n<pre><code>模型名称：从我们控制台复制的模型 ID\nAPI Key：我们签发的 Key\nAPI endpoint URL：https://api.你的域名/v1\n</code></pre>\n<p><strong>接入要点：</strong></p>\n<p><strong>Dify 需要分别配置不同类型的模型</strong>——对话模型（LLM）、Embedding 模型、Rerank 模型。<strong>如果客户在做 RAG，Embedding 模型的配置同样重要</strong>，而很多中转服务不支持 Embedding，这是一个可以主动展示的差异点。</p>\n<p><strong>支持配置多个供应商并在应用级别指定。</strong> 这意味着客户可以逐个应用地把我们切进去，<strong>不需要一次性全量迁移</strong>——这正是模块 06 异议 3 里\"先跑 5%\"话术的完美落地场景：</p>\n<blockquote>\n<p>\"不用整体切换。你先挑一个应用，在里面把模型供应商换成我们，跑一周看看稳定性和账单。别的应用一动不动，觉得不行随时切回去。\"</p>\n</blockquote>\n<h3>1.4 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：中大型企业的数字化部门、有自研能力的 AI 应用公司、给企业做交付的系统集成商。</p>\n<p><strong>切入点一 —— 成本归因。</strong> 客户的 Dify 上跑着一堆应用，他不知道哪个最烧钱。我们按应用维度拆分账单的能力是刚需。开场问题：\"你们 Dify 上现在有几个应用在跑？上个月的费用能拆到具体是哪个应用花的吗？\"</p>\n<p><strong>切入点二 —— Embedding 与 Rerank 的完整支持。</strong> RAG 场景需要三类模型齐备，很多通道只有对话模型。这是技术层面的硬差异。</p>\n<p><strong>切入点三 —— 模型选型咨询。</strong> 企业在 Dify 里做 RAG，最常见的困惑是\"知识库问答该用哪个模型、Embedding 用哪个\"。基于真实调用数据给出选型建议，是典型的增值服务（毛利率可达 50%–70%，见模块 04 第三节）。</p>\n<p><strong>切入点四 —— 私有化部署的合规配套。</strong> 用 Dify 私有化部署的企业，通常有数据合规诉求，会要资质、备案材料、日志留存说明。<strong>直接给标准合规材料包</strong>（见模块 09 阶段四）。</p>\n<hr />\n<h2>二、Coze（扣子）</h2>\n<h3>2.1 是什么</h3>\n<p>字节系的低代码 AI Agent 开发平台，主打\"拖拽式操作\"，学习曲线在这一层里最低，插件生态达万级。<strong>以 SaaS 形态为主</strong>，这一点决定了它和我们的关系。</p>\n<h3>2.2 对我们意味着什么</h3>\n<p><strong>和 Manus 类似，Coze 的 SaaS 版本我们卖不进去</strong>——用户在平台上用的是平台提供的模型额度。</p>\n<p>但它有两个价值：</p>\n<p><strong>第一，它是最好的\"AI 意识启蒙\"指标。</strong> 一个企业如果有人在用 Coze 搭东西，说明这家公司已经开始尝试 AI 应用了，只是还停留在轻量阶段。<strong>这是一条温度不高但真实存在的线索。</strong></p>\n<p><strong>第二，Coze 的开源版本（Coze Studio 一类）支持私有化部署和自定义模型接入。</strong> 当企业从\"试试看\"进入\"要正式上线、数据不能出去\"的阶段时，往往会转向私有化方案——<strong>这个转折点就是我们的介入时机。</strong></p>\n<p><strong>销售话术：</strong></p>\n<blockquote>\n<p>\"你们在 Coze 上搭的这几个东西，现在是跑在字节的服务器上吧？如果之后要正式上线、数据不能出公司，就得转私有化部署，那时候模型是要自己接的。到那一步可以找我们，我们能保证模型能力不降级，成本还能看得清。\"</p>\n</blockquote>\n<h3>2.3 注意事项</h3>\n<p><strong>不要贬低 Coze。</strong> 它在快速验证阶段确实好用，攻击它会显得我们不懂业务节奏。正确的姿态是：认可它适合验证阶段，讨论上线阶段的合规与成本需求。</p>\n<p><strong>Coze 的开源版本与 SaaS 版本能力差异较大</strong>，客户提到 Coze 时要先问清楚用的是哪个。</p>\n<hr />\n<h2>三、FastGPT</h2>\n<h3>3.1 是什么</h3>\n<p>企业知识库问答系统，定位比 Dify 更聚焦——<strong>专注 RAG，不做太多编排</strong>。轻量级部署，学习成本低于 Dify。</p>\n<p>支持本地 Docker 私有化部署，配置集中在 <code>config.json</code> 与环境变量中。</p>\n<h3>3.2 消耗特征与接入</h3>\n<p><strong>典型的 RAG 消耗结构：输入极大、输出较小。</strong> 且由于它专注知识库，<strong>这个特征比 Dify 更纯粹</strong>——几乎所有请求都是\"大段检索内容 + 短问题 → 短回答\"。</p>\n<p><strong>这意味着 FastGPT 客户的缓存优化空间是这一层里最大的。</strong> 系统提示词固定、常用文档片段重复率高，做好缓存的节省比例通常非常可观。</p>\n<p><strong>接入方式</strong>：在 <code>config.json</code> 的模型配置中添加我们的模型，配合环境变量设置 base_url 与 Key。同样需要配置对话模型与 Embedding 模型两类。</p>\n<p><strong>技术支持提示</strong>：FastGPT 的模型配置文件格式在不同版本间有变化，接入前要先确认客户的版本，不能照搬旧文档。</p>\n<h3>3.3 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：需要企业内部知识问答的中型企业、做知识库交付的服务商、政务与教育行业客户。</p>\n<p><strong>切入点 —— 缓存优化 + Embedding 支持。</strong> 这两点是 FastGPT 客户最直接的痛点。开场问题：\"你们知识库现在多大？每次问答大概注入多少上下文？有没有做过缓存？\"</p>\n<p><strong>这是模块 09 里\"最容易做出首月优化成绩\"的客户类型</strong>，适合作为标杆案例来打造。</p>\n<hr />\n<h2>四、n8n</h2>\n<h3>4.1 是什么</h3>\n<p><strong>自动化工作流平台，本质上不是 AI 产品</strong>——它是通用的流程自动化工具，有 400 多个应用集成能力，AI 只是它众多节点中的一类。</p>\n<p>支持本地 Docker 部署。</p>\n<h3>4.2 对我们的独特价值</h3>\n<p><strong>n8n 客户代表着一类特殊场景：AI 被嵌进了非 AI 的业务流程里。</strong></p>\n<p>比如：新订单进来 → 调用模型判断订单风险 → 写入 CRM → 发通知。整条流程里 AI 只是一个环节，但<strong>这个环节会随着业务量自动触发，一天可能跑几万次</strong>。</p>\n<p><strong>这类消耗的特点是：单次很小，但频次极高，且完全跟随业务量。</strong> 可预测性在这一层里最好，最适合做容量规划和年度框架协议。</p>\n<p><strong>风险也在这里</strong>：流程一旦配错（比如循环触发），可能在无人察觉的情况下疯狂调用。<strong>n8n 客户是最需要配异常调用告警的一类。</strong></p>\n<h3>4.3 接入我们的网关</h3>\n<p>n8n 有 OpenAI 节点和通用 HTTP Request 节点两种方式。走 OpenAI 节点时，在凭据配置里设置自定义 base_url 与 API Key；需要更灵活控制时用 HTTP Request 节点直接调我们的接口。</p>\n<p><strong>技术支持提示</strong>：n8n 的凭据是全局的，一个凭据可以被多条工作流复用。<strong>建议客户按业务线创建不同凭据、绑定不同子账号</strong>，这样账单才能拆得开——这也是我们子账号功能的自然应用场景。</p>\n<h3>4.4 客户画像与切入点</h3>\n<p><strong>典型客户</strong>：有自动化需求的运营团队、中小企业的技术负责人、做流程数字化的服务商。</p>\n<p><strong>切入点 —— 异常调用防护 + 按流程拆账。</strong> 话术：</p>\n<blockquote>\n<p>\"n8n 最怕的是某条流程配错了循环触发，等你发现的时候账单已经出来了。我们可以按凭据设预算上限，超了自动断，同时每条流程的消耗单独统计，月底一目了然。\"</p>\n</blockquote>\n<hr />\n<h2>五、RAGFlow</h2>\n<h3>5.1 是什么</h3>\n<p>企业级文档理解引擎，特长是<strong>处理复杂格式</strong>——图表、公式、扫描件、复杂排版的 PDF。定位比 FastGPT 更\"重\"，学习曲线也更陡。支持分布式部署。</p>\n<h3>5.2 对我们的意义</h3>\n<p><strong>它的客户往往是文档密集型的高价值行业</strong>：金融、法律、医疗、科研、制造业的技术文档管理。</p>\n<p><strong>这类客户的三个特征</strong>：一是文档量巨大，token 消耗高；二是对准确性要求极高，愿意用贵的模型；三是<strong>数据合规要求最严格</strong>——法律合同、病历、财务报表，都是不能随便出域的。</p>\n<p><strong>因此这是最需要私有化部署方案的客户群</strong>（见模块 03 第三节：网关组件部署在客户侧，仅出站调用经过我们的通道）。</p>\n<h3>5.3 切入点</h3>\n<p><strong>从合规切入，不从价格切入。</strong> 这类客户的第一道门槛是\"数据能不能保证不留存、有没有资质、能不能过审计\"，价格排在后面。</p>\n<p><strong>必备材料</strong>：资质证明、模型备案文件、数据安全说明、日志留存与导出能力说明、私有化部署方案（见模块 08、模块 09 阶段四）。</p>\n<hr />\n<h2>六、横向对比速查</h2>\n<table>\n<thead>\n<tr>\n<th>维度</th>\n<th>Dify</th>\n<th>Coze</th>\n<th>FastGPT</th>\n<th>n8n</th>\n<th>RAGFlow</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>定位</td>\n<td>综合 AI 应用平台</td>\n<td>低代码 Agent</td>\n<td>知识库问答</td>\n<td>通用自动化</td>\n<td>文档理解引擎</td>\n</tr>\n<tr>\n<td>私有化</td>\n<td>✅ Docker</td>\n<td>开源版可</td>\n<td>✅ Docker</td>\n<td>✅ Docker</td>\n<td>✅ 可分布式</td>\n</tr>\n<tr>\n<td>学习曲线</td>\n<td>中</td>\n<td><strong>最低</strong></td>\n<td>低</td>\n<td>中</td>\n<td><strong>较高</strong></td>\n</tr>\n<tr>\n<td>集成能力</td>\n<td>中</td>\n<td>万级插件</td>\n<td>弱</td>\n<td><strong>400+ 最强</strong></td>\n<td>弱</td>\n</tr>\n<tr>\n<td>消耗特征</td>\n<td>视应用形态</td>\n<td>—</td>\n<td>高输入低输出</td>\n<td>高频小额</td>\n<td><strong>高输入、高单价</strong></td>\n</tr>\n<tr>\n<td>可预测性</td>\n<td>中</td>\n<td>—</td>\n<td>高</td>\n<td><strong>最高</strong></td>\n<td>中</td>\n</tr>\n<tr>\n<td>我们能否接入</td>\n<td>✅</td>\n<td>仅开源版</td>\n<td>✅</td>\n<td>✅</td>\n<td>✅</td>\n</tr>\n<tr>\n<td>客户价值</td>\n<td><strong>最高</strong></td>\n<td>线索来源</td>\n<td>高</td>\n<td>中高</td>\n<td><strong>高（合规溢价）</strong></td>\n</tr>\n<tr>\n<td>主要切入点</td>\n<td>成本归因</td>\n<td>私有化转折点</td>\n<td>缓存优化</td>\n<td>异常防护</td>\n<td>合规与私有化</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>七、这一层的统一行动策略</h2>\n<p><strong>第一，用\"逐个应用切换\"降低决策风险。</strong> 这一层的客户最怕整体迁移出事。所有平台都支持配置多个模型供应商，<strong>先切一个应用、跑一周、看账单</strong>，是阻力最小的进入方式（对应模块 06 异议 3）。</p>\n<p><strong>第二，成本归因是通用的价值主张。</strong> 五个平台的客户都面临同一个问题：平台上跑着一堆东西，不知道哪个最烧钱。<strong>按应用/流程维度拆分账单，是这一层最普适的切入点。</strong></p>\n<p><strong>第三，Embedding 与 Rerank 的支持是硬门槛。</strong> 五个平台里有四个涉及 RAG。<strong>如果我们的通道只有对话模型，这一层就进不去。</strong> 这是产品优先级上必须保证的能力。</p>\n<p><strong>第四，合规材料包必须标准化。</strong> 这一层的客户 100% 会要资质、备案、日志留存说明。做成一个标准包一次性发出，比客户问一样给一样专业得多。</p>\n<p><strong>第五，把这一层作为销售资源的第一优先级。</strong> 按模块 04 的贡献毛利模型，这是唯一能稳定产生健康毛利的客户类型——<strong>因为量大、服务强度可控、且愿意为增值服务付费。</strong></p>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://cloud.tencent.com/developer/article/2555423\">Dify、n8n、Coze、FastGPT、RAGFlow 对比 - 腾讯云开发者社区</a></li>\n<li><a href=\"https://developer.volcengine.com/articles/7523624399816261641\">热门智能体平台怎么选？Coze、Dify、n8n、FastGPT、RagFlow 详细对比 - 火山引擎</a></li>\n<li><a href=\"https://xmsumi.com/detail/1736\">五款 AI 大模型应用工具横评与选型指南</a></li>\n</ul>", "plain": " 模块 17 · 应用编排平台\n\n 覆盖：Dify、Coze、FastGPT、n8n、RAGFlow\n 这一层的共同特征：企业客户的主要形态，单客户量大、决策链长、粘性极高。\n 一个平台后面可能挂着几十条业务流程，一旦接进去就很难被替换。\n 数据采集日：20260727。\n\n\n\n 这一层为什么是企业销售的主战场\n\n前面四层，客户是\"人在用 AI\"。这一层不同——客户是\"业务在用 AI\"。\n\n一个企业把 Dify 部署起来，上面跑的是客服工单分类、合同条款提取、销售话术生成、内部知识问答……这些流程一旦上线，就成了业务的一部分，每天自动运行，不依赖某个人是否打开某个软件。\n\n这带来三个对我们极其有利的特性：\n\n用量稳定且可预测。 消耗跟随业务量而非人的心情。做容量规划、给授信额度、谈年度框架协议都变得可行。\n\n粘性极高。 换上游供应商意味着要在几十个应用里逐个改配置、重新测试、重新验证输出质量。迁移成本高到几乎不会有人主动做。\n\n天然需要企业级能力。 部门归集、成本分摊、审计日志、发票、合规材料——这一层的客户全都要，而这正是我们区别于野生中转站的地方（见模块 03 管控层、模块 08）。\n\n代价是销售周期长。 4–12 周是常态，需要走完模块 05 描述的完整企业决策链。但这是模块 04 里唯一能稳定产生健康贡献毛利的客户类型。\n\n\n\n 一、Dify\n\n 1.1 是什么\n\n企业级 LLM 应用开发平台，是这一层里综合能力最强、企业采用最广的开源项目之一。定位是\"可扩展的 AI 产品底座\"——既能做 RAG 知识库，也能做工作流编排、Agent 编排、提示词管理。\n\n支持本地 Docker 私有化部署，这是它能进入企业的前提。\n\n 1.2 核心能力与消耗特征\n\n四类应用形态：对话型、文本生成型、Agent 型、工作流型。不同形态的消耗特征差异极大，销售必须能区分：\n\n对话型 + 知识库（RAG）：输入巨大、输出较小，输入输出比可达 20:1 到 50:1。每次提问都会注入检索到的文档片段和系统提示词，重复度极高——缓存优化的黄金地带。\n\n工作流型：一条工作流里可能串联多个 LLM 节点，一次触发 = 多次调用。消耗随节点数线性放大。\n\nAgent 型：带循环，消耗最不可预测（原理见模块 16）。\n\n这个区分是我们做成本分析的基础。 一个企业客户的 Dify 上跑着二十个应用，其中往往有两三个占了 80% 的消耗——找出这几个并优化，就是最直接的价值证明。\n\n 1.3 接入我们的网关\n\n路径：设置 → 模型供应商 → 添加 OpenAIAPIcompatible 类型\n\n\n模型名称：从我们控制台复制的模型 ID\nAPI Key：我们签发的 Key\nAPI endpoint URL：https://api.你的域名/v1\n\n\n接入要点：\n\nDify 需要分别配置不同类型的模型——对话模型（LLM）、Embedding 模型、Rerank 模型。如果客户在做 RAG，Embedding 模型的配置同样重要，而很多中转服务不支持 Embedding，这是一个可以主动展示的差异点。\n\n支持配置多个供应商并在应用级别指定。 这意味着客户可以逐个应用地把我们切进去，不需要一次性全量迁移——这正是模块 06 异议 3 里\"先跑 5%\"话术的完美落地场景：\n\n \"不用整体切换。你先挑一个应用，在里面把模型供应商换成我们，跑一周看看稳定性和账单。别的应用一动不动，觉得不行随时切回去。\"\n\n 1.4 客户画像与切入点\n\n典型客户：中大型企业的数字化部门、有自研能力的 AI 应用公司、给企业做交付的系统集成商。\n\n切入点一 —— 成本归因。 客户的 Dify 上跑着一堆应用，他不知道哪个最烧钱。我们按应用维度拆分账单的能力是刚需。开场问题：\"你们 Dify 上现在有几个应用在跑？上个月的费用能拆到具体是哪个应用花的吗？\"\n\n切入点二 —— Embedding 与 Rerank 的完整支持。 RAG 场景需要三类模型齐备，很多通道只有对话模型。这是技术层面的硬差异。\n\n切入点三 —— 模型选型咨询。 企业在 Dify 里做 RAG，最常见的困惑是\"知识库问答该用哪个模型、Embedding 用哪个\"。基于真实调用数据给出选型建议，是典型的增值服务（毛利率可达 50%–70%，见模块 04 第三节）。\n\n切入点四 —— 私有化部署的合规配套。 用 Dify 私有化部署的企业，通常有数据合规诉求，会要资质、备案材料、日志留存说明。直接给标准合规材料包（见模块 09 阶段四）。\n\n\n\n 二、Coze（扣子）\n\n 2.1 是什么\n\n字节系的低代码 AI Agent 开发平台，主打\"拖拽式操作\"，学习曲线在这一层里最低，插件生态达万级。以 SaaS 形态为主，这一点决定了它和我们的关系。\n\n 2.2 对我们意味着什么\n\n和 Manus 类似，Coze 的 SaaS 版本我们卖不进去——用户在平台上用的是平台提供的模型额度。\n\n但它有两个价值：\n\n第一，它是最好的\"AI 意识启蒙\"指标。 一个企业如果有人在用 Coze 搭东西，说明这家公司已经开始尝试 AI 应用了，只是还停留在轻量阶段。这是一条温度不高但真实存在的线索。\n\n第二，Coze 的开源版本（Coze Studio 一类）支持私有化部署和自定义模型接入。 当企业从\"试试看\"进入\"要正式上线、数据不能出去\"的阶段时，往往会转向私有化方案——这个转折点就是我们的介入时机。\n\n销售话术：\n\n \"你们在 Coze 上搭的这几个东西，现在是跑在字节的服务器上吧？如果之后要正式上线、数据不能出公司，就得转私有化部署，那时候模型是要自己接的。到那一步可以找我们，我们能保证模型能力不降级，成本还能看得清。\"\n\n 2.3 注意事项\n\n不要贬低 Coze。 它在快速验证阶段确实好用，攻击它会显得我们不懂业务节奏。正确的姿态是：认可它适合验证阶段，讨论上线阶段的合规与成本需求。\n\nCoze 的开源版本与 SaaS 版本能力差异较大，客户提到 Coze 时要先问清楚用的是哪个。\n\n\n\n 三、FastGPT\n\n 3.1 是什么\n\n企业知识库问答系统，定位比 Dify 更聚焦——专注 RAG，不做太多编排。轻量级部署，学习成本低于 Dify。\n\n支持本地 Docker 私有化部署，配置集中在 config.json 与环境变量中。\n\n 3.2 消耗特征与接入\n\n典型的 RAG 消耗结构：输入极大、输出较小。 且由于它专注知识库，这个特征比 Dify 更纯粹——几乎所有请求都是\"大段检索内容 + 短问题 → 短回答\"。\n\n这意味着 FastGPT 客户的缓存优化空间是这一层里最大的。 系统提示词固定、常用文档片段重复率高，做好缓存的节省比例通常非常可观。\n\n接入方式：在 config.json 的模型配置中添加我们的模型，配合环境变量设置 base_url 与 Key。同样需要配置对话模型与 Embedding 模型两类。\n\n技术支持提示：FastGPT 的模型配置文件格式在不同版本间有变化，接入前要先确认客户的版本，不能照搬旧文档。\n\n 3.3 客户画像与切入点\n\n典型客户：需要企业内部知识问答的中型企业、做知识库交付的服务商、政务与教育行业客户。\n\n切入点 —— 缓存优化 + Embedding 支持。 这两点是 FastGPT 客户最直接的痛点。开场问题：\"你们知识库现在多大？每次问答大概注入多少上下文？有没有做过缓存？\"\n\n这是模块 09 里\"最容易做出首月优化成绩\"的客户类型，适合作为标杆案例来打造。\n\n\n\n 四、n8n\n\n 4.1 是什么\n\n自动化工作流平台，本质上不是 AI 产品——它是通用的流程自动化工具，有 400 多个应用集成能力，AI 只是它众多节点中的一类。\n\n支持本地 Docker 部署。\n\n 4.2 对我们的独特价值\n\nn8n 客户代表着一类特殊场景：AI 被嵌进了非 AI 的业务流程里。\n\n比如：新订单进来 → 调用模型判断订单风险 → 写入 CRM → 发通知。整条流程里 AI 只是一个环节，但这个环节会随着业务量自动触发，一天可能跑几万次。\n\n这类消耗的特点是：单次很小，但频次极高，且完全跟随业务量。 可预测性在这一层里最好，最适合做容量规划和年度框架协议。\n\n风险也在这里：流程一旦配错（比如循环触发），可能在无人察觉的情况下疯狂调用。n8n 客户是最需要配异常调用告警的一类。\n\n 4.3 接入我们的网关\n\nn8n 有 OpenAI 节点和通用 HTTP Request 节点两种方式。走 OpenAI 节点时，在凭据配置里设置自定义 base_url 与 API Key；需要更灵活控制时用 HTTP Request 节点直接调我们的接口。\n\n技术支持提示：n8n 的凭据是全局的，一个凭据可以被多条工作流复用。建议客户按业务线创建不同凭据、绑定不同子账号，这样账单才能拆得开——这也是我们子账号功能的自然应用场景。\n\n 4.4 客户画像与切入点\n\n典型客户：有自动化需求的运营团队、中小企业的技术负责人、做流程数字化的服务商。\n\n切入点 —— 异常调用防护 + 按流程拆账。 话术：\n\n \"n8n 最怕的是某条流程配错了循环触发，等你发现的时候账单已经出来了。我们可以按凭据设预算上限，超了自动断，同时每条流程的消耗单独统计，月底一目了然。\"\n\n\n\n 五、RAGFlow\n\n 5.1 是什么\n\n企业级文档理解引擎，特长是处理复杂格式——图表、公式、扫描件、复杂排版的 PDF。定位比 FastGPT 更\"重\"，学习曲线也更陡。支持分布式部署。\n\n 5.2 对我们的意义\n\n它的客户往往是文档密集型的高价值行业：金融、法律、医疗、科研、制造业的技术文档管理。\n\n这类客户的三个特征：一是文档量巨大，token 消耗高；二是对准确性要求极高，愿意用贵的模型；三是数据合规要求最严格——法律合同、病历、财务报表，都是不能随便出域的。\n\n因此这是最需要私有化部署方案的客户群（见模块 03 第三节：网关组件部署在客户侧，仅出站调用经过我们的通道）。\n\n 5.3 切入点\n\n从合规切入，不从价格切入。 这类客户的第一道门槛是\"数据能不能保证不留存、有没有资质、能不能过审计\"，价格排在后面。\n\n必备材料：资质证明、模型备案文件、数据安全说明、日志留存与导出能力说明、私有化部署方案（见模块 08、模块 09 阶段四）。\n\n\n\n 六、横向对比速查\n\n 维度  Dify  Coze  FastGPT  n8n  RAGFlow \n\n 定位  综合 AI 应用平台  低代码 Agent  知识库问答  通用自动化  文档理解引擎 \n 私有化  ✅ Docker  开源版可  ✅ Docker  ✅ Docker  ✅ 可分布式 \n 学习曲线  中  最低  低  中  较高 \n 集成能力  中  万级插件  弱  400+ 最强  弱 \n 消耗特征  视应用形态  —  高输入低输出  高频小额  高输入、高单价 \n 可预测性  中  —  高  最高  中 \n 我们能否接入  ✅  仅开源版  ✅  ✅  ✅ \n 客户价值  最高  线索来源  高  中高  高（合规溢价） \n 主要切入点  成本归因  私有化转折点  缓存优化  异常防护  合规与私有化 \n\n\n\n 七、这一层的统一行动策略\n\n第一，用\"逐个应用切换\"降低决策风险。 这一层的客户最怕整体迁移出事。所有平台都支持配置多个模型供应商，先切一个应用、跑一周、看账单，是阻力最小的进入方式（对应模块 06 异议 3）。\n\n第二，成本归因是通用的价值主张。 五个平台的客户都面临同一个问题：平台上跑着一堆东西，不知道哪个最烧钱。按应用/流程维度拆分账单，是这一层最普适的切入点。\n\n第三，Embedding 与 Rerank 的支持是硬门槛。 五个平台里有四个涉及 RAG。如果我们的通道只有对话模型，这一层就进不去。 这是产品优先级上必须保证的能力。\n\n第四，合规材料包必须标准化。 这一层的客户 100% 会要资质、备案、日志留存说明。做成一个标准包一次性发出，比客户问一样给一样专业得多。\n\n第五，把这一层作为销售资源的第一优先级。 按模块 04 的贡献毛利模型，这是唯一能稳定产生健康毛利的客户类型——因为量大、服务强度可控、且愿意为增值服务付费。\n\n\n\n 数据来源\n\n [Dify、n8n、Coze、FastGPT、RAGFlow 对比  腾讯云开发者社区](https://cloud.tencent.com/developer/article/2555423)\n [热门智能体平台怎么选？Coze、Dify、n8n、FastGPT、RagFlow 详细对比  火山引擎](https://developer.volcengine.com/articles/7523624399816261641)\n [五款 AI 大模型应用工具横评与选型指南](https://xmsumi.com/detail/1736)\n"}, {"id": "18-战略推演与终局判断", "code": "18", "title": "模块 18 · 战略推演与终局判断", "short": "战略推演与终局判断", "subs": ["一、被讨论的核心论点", "二、站得住的部分", "三、站不住或被高估的部分", "四、最不舒服的推论：这套逻辑对我们的杀伤力更大", "五、它真正指向的风险不是价格战，是脱媒", "六、对四条业务线的重新评估", "七、无悔动作与情景下注", "八、观察指标：什么会证明谁对谁错", "九、一句话结论", "数据来源"], "html": "<h1>模块 18 · 战略推演与终局判断</h1>\n<blockquote>\n<p>本模块解决的问题：三年后这个行业长什么样，我们该往哪站。\n使用者：决策层必读，投资人沟通的深度素材，销售理解行业走向。\n⚠️ 本模块含对自身业务的负面推演，对外分发需谨慎删减第四、五节。\n数据采集日：2026-07-27。</p>\n</blockquote>\n<hr />\n<h2>一、被讨论的核心论点</h2>\n<p>先把待检验的论点完整复述一遍，不做删改。这个论点值得认真对待，因为它触及了我们business的根基。</p>\n<p><strong>论点全文的骨架是：</strong></p>\n<p>大模型不是一门好生意。它像当年的公链——无数条链争夺同一批应用和开发者。但对开发者而言，更换 AI 模型太容易了，甚至不需要重新部署，只要换一个 URL 和一个 Key。</p>\n<p>假设三年后所有模型能力趋同，价格就成为唯一的关键因素。谁便宜谁获客，这注定是一场无尽的烧钱游戏，直到对手倒下。这甚至不如以太坊——公链还能靠资金沉淀形成护城河，而 LLM 默认是 serverless 的，用完就走，什么都留不下。</p>\n<p>如果价格最终卷到像电力一样，那么<strong>谁控制了应用和入口，谁才是最终的老大</strong>。而且关键的不是 Chat UI 这类可以随意换模型的应用，而是<strong>把 Agent 嵌进 APP 里</strong>的形态——比如 Telegram 的长内容自动优化、Gmail 的 AI 搜索。这些入口的用户根本感知不到、也无法选择模型，完全由应用方控制。应用方选谁，谁就天然获得海量流量。</p>\n<p>所以模型厂商现在就该大力构建开发者生态和应用层，并想办法制造粘性、写死进系统，不能让人随意更换。Codex、Claude 官方 App 这类产品已经是这个方向。而国内厂商还主要停留在卷模型的层次，未来可能面临\"有模型没人用\"的困境。</p>\n<p>结论：最快明年就是 AI 应用开发者的好日子。</p>\n<hr />\n<h2>二、站得住的部分</h2>\n<p><strong>这个论点的方向判断，我认为基本正确，而且已经在发生。</strong></p>\n<h3>2.1 切换成本在 API 层面确实极低——我们自己的知识库就是证据</h3>\n<p>这不是理论推演。翻开模块 16 就能看到：Claude Code 换一个环境变量，Cursor 打开一个 Override Base URL 开关，Cline 改一个下拉框。模块 12 那张配置速查表，本质上就是一份\"零成本切换指南\"。</p>\n<p><strong>我们整个业务能够存在，前提恰恰就是这件事成立。</strong> 如果切换很难，客户就会被锁在官方通道里，我们连进场的机会都没有。所以对这一条，我们没有任何反驳的立场——<strong>我们是这个论点最直接的受益者，也将是最直接的受害者。</strong>（详见第四节）</p>\n<h3>2.2 价值向掌握需求的一端转移，是被反复验证的产业规律</h3>\n<p>当上游要素商品化时，利润会向控制客户关系的环节迁移。这不是 AI 特有的，PC 时代的 Intel/微软、移动时代的应用商店、云时代的 SaaS，都是同一个剧本。论点提出者用公链做类比，虽然细节不成立（见第三节），但直觉方向是对的。</p>\n<h3>2.3 「嵌入式 Agent」这个切分极其精准，是全文最有价值的一句</h3>\n<p>区分 <strong>Chat UI 类应用</strong>（用户能看见、能选模型）和 <strong>嵌入式 Agent</strong>（用户感知不到模型存在）——这个区分的商业含义非常大：</p>\n<p>在 Chat UI 里，模型选择权部分在终端用户手里，用户会因为\"想用某个模型\"而选择应用；在嵌入式场景里，<strong>终端用户完全没有选择权，采购决策 100% 归应用方</strong>。而应用方是理性的商业主体，它只关心成本、稳定性和合规。</p>\n<p>这意味着嵌入式场景的模型采购是<strong>纯粹的 B2B 理性采购</strong>，没有品牌溢价、没有用户偏好保护。<strong>这对模型厂商是坏消息，对我们是好消息</strong>——因为理性采购正是我们能赢的战场（见第五节）。</p>\n<h3>2.4 「国内厂商应该做应用层」的判断方向对，但时间点判断已经滞后</h3>\n<p>2026 年的公开信息显示，国内头部厂商早已在动：商业模式从单一模型供应转向\"模型 + 数据 + 服务 + 生态\"，MaaS 占 B 端收入超过 50%，私有化部署成为金融、医疗等行业的主流选择；C 端 AI 写作/绘画/视频/办公类应用形成用户入口；AI PC 与 AI 手机年出货预期达 3000 万台，被当作新的硬件入口来抢。</p>\n<p>所以\"国内还主要停留在卷模型\"这个判断，<strong>在 2026 年年中已经不太准确</strong>——他们不是没意识到，是已经在打了。<strong>这对我们反而是坏消息，第四节会讲为什么。</strong></p>\n<hr />\n<h2>三、站不住或被高估的部分</h2>\n<p>以下五条是我对这个论点的实质性异议。<strong>如果拿这套逻辑去跟投资人讲，这五条是会被追问的地方，必须先想清楚。</strong></p>\n<h3>3.1 最大的问题：价格并没有在往零走，但也不是单向在涨——市场在分化</h3>\n<blockquote>\n<p>⚠️ <strong>2026-07 修正（触发来源：模块 25）</strong>：本节原标题为「2026 年反而在涨」，原文断言\"2026 进入涨价周期\"。<strong>这个表述过于绝对，现已修正为「市场分化」。</strong> 修正的证据与含义见本节末尾的\"反向证据\"。原判断的核心（价格不会归零、有物理硬底、电力化前提不成立）依然成立，被修正的只是\"方向\"这一层。</p>\n</blockquote>\n<p>这是整个论证链条上最关键的一环，也是<strong>目前被现实证伪得最直接的一环</strong>。</p>\n<p>论点假设\"价格卷到像电力一样\"。但 2026 年的实际情况是：<strong>头部厂商中有相当一部分从价格战转向了价值战，开始涨价。</strong> 智谱的公开数据显示 <strong>API 调用定价提升了 83%，而同期 Token 消耗量增长了 400%</strong>——涨价没有抑制需求。</p>\n<p>涨价那一侧的原因有三层。<strong>需求侧</strong>，Agent 时代 token 消耗从线性跃升为指数级，供不应求。<strong>成本侧</strong>，存储芯片进入卖方市场、数据中心能源成本高企，行业形成了\"任何商品必须盈利，不能靠补贴降价\"的共识。<strong>竞争侧</strong>，不赚钱的产品直接被砍——Sora 因为生成一分钟高质量视频成本 30–50 美元而被放弃。</p>\n<p><strong>更关键的一个反直觉事实：低价模型往往更贵。</strong> 因为能力弱的模型需要更多轮次、更长的思考链、更多的重试才能完成同一个任务，总 token 消耗反而高于直接用贵模型一次做对。<strong>\"单价\"和\"单位任务成本\"是两回事</strong>，而客户真正付的是后者。</p>\n<p><strong>这一条对论点的杀伤是结构性的。</strong> \"电力化\"隐含的前提是边际成本趋近于零——这对公链成立（出块的边际成本极低），对推理不成立。每一次推理都在真实消耗 GPU 秒和电力，<strong>价格有一个由物理决定的硬底</strong>，而这个底目前还在上移。</p>\n<p>所以终局不会是\"人人免费\"，而是<strong>只有成本结构最优（自有芯片、自有电力、极致工程优化）的少数玩家能持续供给，其余出局</strong>。这个结论对小模型厂商的悲观程度，其实比原论点更甚——但它不是\"无尽烧钱\"，而是\"资本密集度筛选\"，是有终点的。</p>\n<h4>反向证据：为什么不能说\"2026 进入涨价周期\"</h4>\n<p>上面的涨价证据是真的，但它只覆盖了市场的一侧。同期同样扎实的反向数据是：<strong>自 2023 年起国内 API 累计降价十余次，部分模型累计降幅超 90%；DeepSeek V4-Pro 降价 75% 至 6 元/百万 Token，小米、腾讯随后跟进，降幅达 97.5%–99%。</strong></p>\n<p>两组数据都不假，它们描述的是<strong>同一个市场里两条分岔的路线</strong>：</p>\n<table>\n<thead>\n<tr>\n<th>路线</th>\n<th>代表</th>\n<th>打法</th>\n<th>赌的是什么</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>价值战</strong></td>\n<td>智谱等</td>\n<td>涨价，用能力溢价换毛利</td>\n<td>高价值任务愿意为能力付费，需求不敏感</td>\n</tr>\n<tr>\n<td><strong>规模战</strong></td>\n<td>DeepSeek 系及跟进者</td>\n<td>继续降价，用成本领先换体量</td>\n<td>自身成本结构能撑住，靠量把对手挤出去</td>\n</tr>\n</tbody>\n</table>\n<p><strong>所以正确的表述是「市场分化」，不是「涨价周期」。</strong></p>\n<p><strong>这对本模块其余部分的两处限定：</strong></p>\n<p>第一，<strong>第五节\"价格战不是主要威胁\"这一判断需要降级</strong>。价格战没有全面到来是对的，但它在规模战那一侧仍在真实发生。准确说法是：价格战不是<strong>全行业</strong>的威胁，但如果我们的客户结构集中在对单价敏感的长尾，它就是我们的直接威胁。</p>\n<p>第二，<strong>\"囤货批发在涨价周期里有机会\"这条推论不再成立</strong>（见本模块第 191 行附近）。方向既然不可单向预测，囤货就同时暴露在\"拿不到量\"和\"买贵了\"两个方向的风险上。<strong>模块 04 的资金上限与周转纪律必须严格执行，不得因为\"看好涨价\"而放宽。</strong></p>\n<p><strong>统一纪律：上游价格方向已不可单向预测。任何依赖价格方向的策略（囤货、锁价、长约、自建成本测算）都必须做双向压力测试——涨 50% 和跌 50% 两种情形下都不能致命，才可以做。</strong></p>\n<h3>3.2 「换个 URL 就能切换」在 API 层面成立，在系统层面不成立</h3>\n<p>这是第二个重要异议。改配置只需要三十秒，但改完之后你得到的是一个<strong>能跑</strong>的系统，不是一个<strong>等价</strong>的系统。</p>\n<p>真实的切换成本藏在这些地方：提示词是按特定模型调优的，换模型要重调；评测集要重跑；工具调用（function calling）的行为差异要重新验证；输出格式的稳定性要重新压测；缓存策略失效要重建；微调过的模型完全无法迁移；长任务的失败模式各不相同，要重新摸。</p>\n<p><strong>换句话说，成本不在配置里，在验证里。</strong> 一个跑在生产环境、有真实用户的应用，切换模型意味着一轮完整的回归测试和灰度发布。这就是模块 02 讲的\"复杂度税\"——<strong>而复杂度税是双向的：它既是我们的收入来源，也是我们客户流失的阻力。</strong></p>\n<p><strong>2026-07 实证补充</strong>：这个论证后来得到了一个更有力的支撑——<strong>Harness 工程</strong>。LangChain 创始人 Harrison Chase 的判断是：几乎所有做编程 Agent 的公司都自研 harness，而<strong>性能差异并非完全来自模型，而来自对模型在 harness 中工作方式的理解</strong>。提示词调优、评测集、trace 分析、上下文压缩策略、子 Agent 协调，全是围绕特定模型行为积累的资产。<strong>换模型意味着这套资产要重建一遍——这才是真实的切换成本。</strong> 详见模块 19 收录 001。</p>\n<p>经验上看，声称\"随时能切\"的团队，绝大多数并不真的切。<strong>能力≠意愿≠行动。</strong></p>\n<h3>3.3 公链类比在两个关键点上断裂</h3>\n<p>第一是<strong>边际成本</strong>（已在 3.1 展开）：出块近乎零边际成本，推理有沉重的边际成本。这决定了两者价格战的终局形态完全不同。</p>\n<p>第二是<strong>沉淀资产</strong>。论点说 LLM \"serverless，用完就走，什么都留不下\"。这话对<strong>单次调用</strong>成立，对<strong>关系</strong>不成立。实际在沉淀的东西有：调用数据与评测资产、缓存与上下文、微调权重、企业侧的采购审批与安全评审记录、以及在国内尤其重要的<strong>合规资产</strong>——备案关系、等保测评、审计留痕（见模块 08）。</p>\n<p><strong>在国内市场，合规审批本身就是一道换不动的墙。</strong> 一家银行花了三个月过完供应商准入，不会因为另一家便宜 5% 就重来一遍。这一点在纯技术视角的推演里经常被忽略。</p>\n<h3>3.4 「能力趋同」是假设，而且只在中段成立</h3>\n<p>2026 年的实际情况是<strong>部分趋同</strong>：头部五家（字节、阿里、DeepSeek、百度、智谱）在知识性、推理、长文本这些基础能力上确实已经拉平。</p>\n<p><strong>但差异化并没有消失，只是转移了位置</strong>——转向了多模态（视频、3D）和 Agent 能力。而这两块恰恰是高价值任务所在。行业评价标准本身也在迁移，从\"能跑多高\"转向\"能干多久\"——即长程任务的稳定性与耐久性，这正是最难趋同的维度。</p>\n<p>所以更可能的形态是<strong>哑铃结构</strong>：中低端彻底商品化，前沿持续分化。论点隐含地假设了完全趋同，那是最有利于其结论的假设，但不是最可能的现实。</p>\n<h3>3.5 结论自相矛盾：如果入口为王，独立应用开发者恰恰是最难受的</h3>\n<p>论点最后说\"最快明年将是 AI 应用开发者的好日子\"。但按它自己的逻辑推下去，结论应该是相反的。</p>\n<p>如果价值归于入口，而入口被已有分发能力的巨头把持（Telegram、Google、微信、钉钉、飞书、以及正在抢 AI PC / AI 手机的硬件厂商），那么<strong>独立应用开发者是被上下夹击的一层</strong>：上面是商品化的模型（没有议价空间也没有差异化来源），下面是掌握分发的平台（决定你能不能触达用户）。</p>\n<p><strong>好日子属于\"已经拥有入口的人\"，以及\"平台不屑于进入的垂直纵深领域\"，不属于通用型 AI 应用开发者。</strong> 后者做出来的东西，恰恰最容易被入口方原生集成掉。</p>\n<p>这不是吹毛求疵——<strong>这个矛盾直接影响我们判断该服务哪类客户</strong>（见第六节）。</p>\n<hr />\n<h2>四、最不舒服的推论：这套逻辑对我们的杀伤力更大</h2>\n<p><strong>这一节是本模块的核心，也是决策层必须直面的部分。</strong></p>\n<p>论点说：模型厂商的问题是切换成本太低，随时会被换掉。</p>\n<p>那么请问：<strong>我们是什么？</strong> 我们是模型和客户之间的一层。客户换掉模型厂商需要改一个 URL，客户换掉我们<strong>同样只需要改一个 URL</strong>。</p>\n<p><strong>论点用来论证\"模型厂商没有护城河\"的每一条理由，用在我们身上都成立，而且更严重：</strong></p>\n<p>模型厂商至少还有模型能力这个差异化维度，还有自研的沉没成本作为门槛，还有品牌。<strong>我们什么都没有</strong>——我们卖的东西和上游一模一样，只是价格和服务不同。我们比模型厂商更接近\"纯通道\"，也就更接近\"可被无痛替换\"。</p>\n<p>模块 02 第四节已经诚实写过\"0→1 阶段我们几乎没有护城河\"。这个论点把这句话的严重性放大了：<strong>在一个所有人都在丧失锁定能力的行业里，最没有锁定能力的那一层是最先被挤掉的。</strong></p>\n<p><strong>必须被记住的一条</strong>：模块 10 论点 8 说\"不做锁定反而留得住客户\"——这在起步期是对的策略，因为客户不敢进来。但它必须有下半句：<strong>不做技术锁定，就必须做能力锁定。</strong> 让客户走得动但不想走，靠的是产品深度和数据资产，不是合同条款。这件事有没有做成，是我们三年后还在不在的分水岭。</p>\n<hr />\n<h2>五、它真正指向的风险不是价格战，是脱媒</h2>\n<p>综合第三节的事实修正和第四节的自我推演，我认为<strong>这个论点指出了正确的风险，但指错了机制</strong>。</p>\n<p><strong>它说的风险机制是</strong>：价格卷到零 → 大家一起死 → 只有入口活下来。</p>\n<p><strong>真实的风险机制是</strong>：模型厂商意识到自己会被商品化 → 于是加速向上游走，自建应用层和开发者生态 → <strong>而它们要争取的开发者，正是我们的客户</strong>。</p>\n<p>这不是推测。2026 年的公开信息已经显示：厂商在做 MaaS（占 B 端收入超 50%）、做私有化部署、做行业专用模型、做 C 端应用入口、抢 AI PC 与 AI 手机的硬件入口。<strong>每一项都在缩短它们与最终客户的距离，也就是在压缩我们的存在空间。</strong></p>\n<p><strong>所以对我们真正的威胁排序应该是：</strong></p>\n<p><strong>第一，厂商直销下沉。</strong> 这是模块 02 第五节列的\"第一种失败方式：被上游抛弃\"，而这个论点让它的紧迫性上升了一个等级。厂商越是往应用层走，越有动力直接服务应用开发者，中间渠道的价值就越薄。</p>\n<p><strong>第二，入口方直接与厂商签战略协议。</strong> 大型入口（社交、办公、硬件）的采购量足以让它们直接拿到最优价和定制支持，中间层完全没有插入空间。<strong>我们注定服务不了最大的那批客户。</strong></p>\n<p><strong>第三，自建推理替代 API 采购。</strong>（2026-07 新增，见模块 19 收录 001）开源模型 + 受管运行时 + 自建 harness 跑在企业自有基础设施上，这条路径一旦在受监管行业成为主流，<strong>这些客户将不再向任何人采购 token</strong>——不是被绕过，是需求本身消失。风险敞口最大的恰恰是我们最看重的金融、法律、医疗类客户。缓冲在于自建有沉重隐性成本、混合架构才是现实形态、且本地开源模型与前沿模型在高价值任务上仍有差距。<strong>应对不是抵抗自建，是重新定位：从\"便宜的 token 供应商\"变成\"本地模型干不了的那部分的出口 + 横跨本地与云端的成本核算层\"。</strong></p>\n<p><strong>第四，才是价格战。</strong> 而且如 3.1 所述，价格战在 2026 年并未如期到来，反而出现了反向的涨价周期。<strong>把战略重心押在\"打价格战活下来\"上，是押错了战场。</strong>（这与模块 02 第三条基本认知\"0→1 阶段不要打价格战，要打确定性战\"完全一致，此处得到进一步验证。）</p>\n<hr />\n<h2>六、对四条业务线的重新评估</h2>\n<p>按这套推演，模块 02 的四条业务线价值排序需要调整。</p>\n<table>\n<thead>\n<tr>\n<th>业务线</th>\n<th>原判断</th>\n<th>推演后的判断</th>\n<th>变化</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>渠道代理</td>\n<td>信任资产</td>\n<td><strong>中长期贬值</strong>。厂商越往下沉，代理身份越不值钱；但短期仍是企业客户准入的敲门砖</td>\n<td>↓</td>\n</tr>\n<tr>\n<td>多模型聚合网关</td>\n<td>产品与数据资产</td>\n<td><strong>价值上升</strong>。能力若真趋同，按价格与场景自动路由就是纯增值；且趋同越彻底，路由价值越大</td>\n<td>↑</td>\n</tr>\n<tr>\n<td>算力/额度批发分销</td>\n<td>现金流引擎</td>\n<td><strong>风险显著上升</strong>。涨价周期里囤货的风险方向变了——不再只怕降价，还怕拿不到量；且这是最纯粹的通道生意，最先被脱媒</td>\n<td>↓↓</td>\n</tr>\n<tr>\n<td>场景化解决方案</td>\n<td>终局业务</td>\n<td><strong>确认为终局</strong>，且时间窗口比原判断更紧</td>\n<td>＝</td>\n</tr>\n</tbody>\n</table>\n<p><strong>其中一个反直觉但重要的结论：能力趋同对我们是好坏参半的。</strong></p>\n<p>它<strong>摧毁转售价差</strong>（模型可互换，客户只比价，毛利被压到底），但<strong>放大路由价值</strong>（模型可互换，意味着我们可以在客户无感的情况下把请求调度到当下最划算的模型，节省下来的钱可以和客户分成）。</p>\n<p><strong>这直接指向一个产品与商业模式的转向：收入应当从\"价差\"迁移到\"软件费 + 节省分成\"。</strong> 前者随商品化而消亡，后者随商品化而增强。这是模块 04 第三节\"价值层定价\"应当被提到战略高度的原因。</p>\n<hr />\n<h2>七、无悔动作与情景下注</h2>\n<p>三年期的行业预测，无论是这个论点还是我的反驳，历史命中率都很低。<strong>所以正确的姿态不是赌一个终局，而是分清哪些动作在所有情景下都对，哪些是情景依赖的下注。</strong></p>\n<h3>7.1 无悔动作（任何情景下都该做，立即执行）</h3>\n<p><strong>深度嵌入客户的技术栈。</strong> 这是本知识库模块 12–17 的真正战略意义所在——<strong>它不只是一份技术资料，它是一份\"我们该嵌进哪里\"的地图。</strong> 成为 Dify、FastGPT、OpenClaw、Cline 这类项目文档里的默认/推荐 provider，成为客户接入教程里的示例配置，是这个行业里少数还能积累的分发资产。<strong>这件事越早做越值钱，且不依赖任何终局假设。</strong></p>\n<p><strong>把成本管理做成客户离不开的工作流。</strong> 不是给数据，是给结论和自动化。当客户的预算规则、告警阈值、部门归集、优化策略都建在我们平台上时，切换成本才真正存在。（模块 03 管控层与分析层）</p>\n<p><strong>合规资产。</strong> 在国内市场，这是唯一一种确定会随时间增值、且开源方案永远补不上的资产。（模块 08、模块 14 第五节）</p>\n<p><strong>服务嵌入式 Agent 客户。</strong> 论点关于\"嵌入式场景是纯理性采购\"的洞察是对的，而理性采购正是我们的主场——我们提供的恰恰是成本、稳定性、合规这三样。<strong>这批客户应当被提到销售优先级的最前面。</strong></p>\n<h3>7.2 情景依赖的下注（需要决策层明确表态）</h3>\n<p><strong>大额囤货批发</strong>：只在\"供给紧张、价格上行\"情景下有利，在\"厂商直销下沉\"情景下是纯损失。鉴于 2026 年确实处于涨价周期，这条线短期有机会，<strong>但必须严格执行模块 04 第四节的资金上限与周转纪律</strong>，且不能作为战略重心。</p>\n<p><strong>押注单一厂商的深度绑定</strong>：能换取更好的价格与支持，但会在该厂商直销下沉时反噬。<strong>与模块 03 铁律一（单一上游不超过 40%）冲突时，以铁律为准。</strong></p>\n<p><strong>自建前端应用/入口</strong>：如果真的\"入口为王\"，我们理应也去做入口。但这与我们的能力结构相距甚远，且会与客户直接竞争。<strong>我的判断是不做——但如果决策层要做，必须清楚这是转型而不是延伸。</strong></p>\n<hr />\n<h2>八、观察指标：什么会证明谁对谁错</h2>\n<p><strong>把预测变成可检验的东西，是这个模块最实用的部分。</strong> 建议按季度检查以下五项，任何一项出现明确信号都应触发战略复盘。</p>\n<p><strong>指标一 · 主流模型 API 单价方向。</strong> 若持续上行（2026 年当前状态），说明\"电力化\"论证暂时失效，价格战不是主战场；若重新转入单边下行且跌破成本线，说明补贴战重启，批发业务立即收缩。</p>\n<p><strong>指标二 · 厂商直销团队的下沉深度。</strong> 观察上游是否开始直接争取月消费十万级以下的客户。<strong>一旦出现，我们的渠道代理业务进入倒计时</strong>，必须加速向解决方案迁移。</p>\n<p><strong>指标三 · 头部模型在 Agent 长程任务上的能力差距。</strong> 若持续拉大，说明\"完全趋同\"不成立，前沿溢价长期存在，聚合路由的价值下降、选型咨询的价值上升；若快速收敛，则相反。</p>\n<p><strong>指标四 · 客户流失原因构成。</strong> 若\"找到更便宜的\"占主导，说明我们没有建立起能力锁定，第四节的担忧正在成为现实；若\"业务萎缩\"占主导，说明我们的位置是稳的。<strong>这是我们唯一能完全自主观测、且最诚实的指标。</strong></p>\n<p><strong>指标五 · 增值服务渗透率。</strong> 模块 04 定的目标是 30%。<strong>这一项如果长期上不去，意味着我们始终没有跳出通道生意——那么无论行业终局如何，我们都会是被挤掉的那一层。</strong></p>\n<hr />\n<h2>九、一句话结论</h2>\n<p><strong>论点的方向对、机制错、结论自相矛盾，但它提出的问题是我们必须回答的。</strong></p>\n<p>方向对：价值确实在向掌握需求的一端转移，嵌入式 Agent 确实是理性采购的主场。</p>\n<p>机制错：价格不会因为无尽烧钱而归零，推理的边际成本有硬底，2026 年实际处于涨价周期；真正的威胁是厂商向上游走带来的<strong>脱媒</strong>，不是价格战。</p>\n<p>结论矛盾：如果入口为王，通用型应用开发者恰恰是被夹击的一层，\"好日子\"属于已握有入口的人和垂直纵深玩家。</p>\n<p><strong>而对我们最重要的是那条它没说出口的推论——这套用来否定模型厂商护城河的逻辑，用在我们这一层上更成立。</strong> 我们没有模型能力、没有品牌、没有沉没成本，是整条链上最容易被绕过的一环。</p>\n<p><strong>所以我们的战略只有一句话：在还能卖 token 的窗口期里，把自己变成客户离不开的东西。</strong> 窗口有多长不确定，但它一定在关闭。</p>\n<hr />\n<h2>数据来源</h2>\n<ul>\n<li><a href=\"https://www.thepaper.cn/newsDetail_forward_33027436\">告别价格战，大模型共迎通胀时代 - 澎湃新闻</a></li>\n<li><a href=\"https://www.chinaidr.com/tradenews/2026-05/256348.html\">2026 年中国 AI 竞争格局与商业化趋势分析：梯队重构、价值兑现、生态决胜</a></li>\n<li><a href=\"https://m.thepaper.cn/newsDetail_forward_33291314\">大模型之家 2026 年 5 月热力榜：当「能干多久」取代「能跑多高」 - 澎湃新闻</a></li>\n<li><a href=\"https://k.sina.com.cn/article_7857201856_1d45362c001904gpdi.html\">2026 大模型深度解析：泡沫退去，价值落地才是核心战场</a></li>\n<li>内部交叉引用：模块 02（商业模式与护城河）、模块 04（单位经济模型）、模块 08（合规资产）、模块 12–17（客户端技术地图）</li>\n</ul>", "plain": " 模块 18 · 战略推演与终局判断\n\n 本模块解决的问题：三年后这个行业长什么样，我们该往哪站。\n 使用者：决策层必读，投资人沟通的深度素材，销售理解行业走向。\n ⚠️ 本模块含对自身业务的负面推演，对外分发需谨慎删减第四、五节。\n 数据采集日：20260727。\n\n\n\n 一、被讨论的核心论点\n\n先把待检验的论点完整复述一遍，不做删改。这个论点值得认真对待，因为它触及了我们business的根基。\n\n论点全文的骨架是：\n\n大模型不是一门好生意。它像当年的公链——无数条链争夺同一批应用和开发者。但对开发者而言，更换 AI 模型太容易了，甚至不需要重新部署，只要换一个 URL 和一个 Key。\n\n假设三年后所有模型能力趋同，价格就成为唯一的关键因素。谁便宜谁获客，这注定是一场无尽的烧钱游戏，直到对手倒下。这甚至不如以太坊——公链还能靠资金沉淀形成护城河，而 LLM 默认是 serverless 的，用完就走，什么都留不下。\n\n如果价格最终卷到像电力一样，那么谁控制了应用和入口，谁才是最终的老大。而且关键的不是 Chat UI 这类可以随意换模型的应用，而是把 Agent 嵌进 APP 里的形态——比如 Telegram 的长内容自动优化、Gmail 的 AI 搜索。这些入口的用户根本感知不到、也无法选择模型，完全由应用方控制。应用方选谁，谁就天然获得海量流量。\n\n所以模型厂商现在就该大力构建开发者生态和应用层，并想办法制造粘性、写死进系统，不能让人随意更换。Codex、Claude 官方 App 这类产品已经是这个方向。而国内厂商还主要停留在卷模型的层次，未来可能面临\"有模型没人用\"的困境。\n\n结论：最快明年就是 AI 应用开发者的好日子。\n\n\n\n 二、站得住的部分\n\n这个论点的方向判断，我认为基本正确，而且已经在发生。\n\n 2.1 切换成本在 API 层面确实极低——我们自己的知识库就是证据\n\n这不是理论推演。翻开模块 16 就能看到：Claude Code 换一个环境变量，Cursor 打开一个 Override Base URL 开关，Cline 改一个下拉框。模块 12 那张配置速查表，本质上就是一份\"零成本切换指南\"。\n\n我们整个业务能够存在，前提恰恰就是这件事成立。 如果切换很难，客户就会被锁在官方通道里，我们连进场的机会都没有。所以对这一条，我们没有任何反驳的立场——我们是这个论点最直接的受益者，也将是最直接的受害者。（详见第四节）\n\n 2.2 价值向掌握需求的一端转移，是被反复验证的产业规律\n\n当上游要素商品化时，利润会向控制客户关系的环节迁移。这不是 AI 特有的，PC 时代的 Intel/微软、移动时代的应用商店、云时代的 SaaS，都是同一个剧本。论点提出者用公链做类比，虽然细节不成立（见第三节），但直觉方向是对的。\n\n 2.3 「嵌入式 Agent」这个切分极其精准，是全文最有价值的一句\n\n区分 Chat UI 类应用（用户能看见、能选模型）和 嵌入式 Agent（用户感知不到模型存在）——这个区分的商业含义非常大：\n\n在 Chat UI 里，模型选择权部分在终端用户手里，用户会因为\"想用某个模型\"而选择应用；在嵌入式场景里，终端用户完全没有选择权，采购决策 100% 归应用方。而应用方是理性的商业主体，它只关心成本、稳定性和合规。\n\n这意味着嵌入式场景的模型采购是纯粹的 B2B 理性采购，没有品牌溢价、没有用户偏好保护。这对模型厂商是坏消息，对我们是好消息——因为理性采购正是我们能赢的战场（见第五节）。\n\n 2.4 「国内厂商应该做应用层」的判断方向对，但时间点判断已经滞后\n\n2026 年的公开信息显示，国内头部厂商早已在动：商业模式从单一模型供应转向\"模型 + 数据 + 服务 + 生态\"，MaaS 占 B 端收入超过 50%，私有化部署成为金融、医疗等行业的主流选择；C 端 AI 写作/绘画/视频/办公类应用形成用户入口；AI PC 与 AI 手机年出货预期达 3000 万台，被当作新的硬件入口来抢。\n\n所以\"国内还主要停留在卷模型\"这个判断，在 2026 年年中已经不太准确——他们不是没意识到，是已经在打了。这对我们反而是坏消息，第四节会讲为什么。\n\n\n\n 三、站不住或被高估的部分\n\n以下五条是我对这个论点的实质性异议。如果拿这套逻辑去跟投资人讲，这五条是会被追问的地方，必须先想清楚。\n\n 3.1 最大的问题：价格并没有在往零走，但也不是单向在涨——市场在分化\n\n ⚠️ 202607 修正（触发来源：模块 25）：本节原标题为「2026 年反而在涨」，原文断言\"2026 进入涨价周期\"。这个表述过于绝对，现已修正为「市场分化」。 修正的证据与含义见本节末尾的\"反向证据\"。原判断的核心（价格不会归零、有物理硬底、电力化前提不成立）依然成立，被修正的只是\"方向\"这一层。\n\n这是整个论证链条上最关键的一环，也是目前被现实证伪得最直接的一环。\n\n论点假设\"价格卷到像电力一样\"。但 2026 年的实际情况是：头部厂商中有相当一部分从价格战转向了价值战，开始涨价。 智谱的公开数据显示 API 调用定价提升了 83%，而同期 Token 消耗量增长了 400%——涨价没有抑制需求。\n\n涨价那一侧的原因有三层。需求侧，Agent 时代 token 消耗从线性跃升为指数级，供不应求。成本侧，存储芯片进入卖方市场、数据中心能源成本高企，行业形成了\"任何商品必须盈利，不能靠补贴降价\"的共识。竞争侧，不赚钱的产品直接被砍——Sora 因为生成一分钟高质量视频成本 30–50 美元而被放弃。\n\n更关键的一个反直觉事实：低价模型往往更贵。 因为能力弱的模型需要更多轮次、更长的思考链、更多的重试才能完成同一个任务，总 token 消耗反而高于直接用贵模型一次做对。\"单价\"和\"单位任务成本\"是两回事，而客户真正付的是后者。\n\n这一条对论点的杀伤是结构性的。 \"电力化\"隐含的前提是边际成本趋近于零——这对公链成立（出块的边际成本极低），对推理不成立。每一次推理都在真实消耗 GPU 秒和电力，价格有一个由物理决定的硬底，而这个底目前还在上移。\n\n所以终局不会是\"人人免费\"，而是只有成本结构最优（自有芯片、自有电力、极致工程优化）的少数玩家能持续供给，其余出局。这个结论对小模型厂商的悲观程度，其实比原论点更甚——但它不是\"无尽烧钱\"，而是\"资本密集度筛选\"，是有终点的。\n\n 反向证据：为什么不能说\"2026 进入涨价周期\"\n\n上面的涨价证据是真的，但它只覆盖了市场的一侧。同期同样扎实的反向数据是：自 2023 年起国内 API 累计降价十余次，部分模型累计降幅超 90%；DeepSeek V4Pro 降价 75% 至 6 元/百万 Token，小米、腾讯随后跟进，降幅达 97.5%–99%。\n\n两组数据都不假，它们描述的是同一个市场里两条分岔的路线：\n\n 路线  代表  打法  赌的是什么 \n\n 价值战  智谱等  涨价，用能力溢价换毛利  高价值任务愿意为能力付费，需求不敏感 \n 规模战  DeepSeek 系及跟进者  继续降价，用成本领先换体量  自身成本结构能撑住，靠量把对手挤出去 \n\n所以正确的表述是「市场分化」，不是「涨价周期」。\n\n这对本模块其余部分的两处限定：\n\n第一，第五节\"价格战不是主要威胁\"这一判断需要降级。价格战没有全面到来是对的，但它在规模战那一侧仍在真实发生。准确说法是：价格战不是全行业的威胁，但如果我们的客户结构集中在对单价敏感的长尾，它就是我们的直接威胁。\n\n第二，\"囤货批发在涨价周期里有机会\"这条推论不再成立（见本模块第 191 行附近）。方向既然不可单向预测，囤货就同时暴露在\"拿不到量\"和\"买贵了\"两个方向的风险上。模块 04 的资金上限与周转纪律必须严格执行，不得因为\"看好涨价\"而放宽。\n\n统一纪律：上游价格方向已不可单向预测。任何依赖价格方向的策略（囤货、锁价、长约、自建成本测算）都必须做双向压力测试——涨 50% 和跌 50% 两种情形下都不能致命，才可以做。\n\n 3.2 「换个 URL 就能切换」在 API 层面成立，在系统层面不成立\n\n这是第二个重要异议。改配置只需要三十秒，但改完之后你得到的是一个能跑的系统，不是一个等价的系统。\n\n真实的切换成本藏在这些地方：提示词是按特定模型调优的，换模型要重调；评测集要重跑；工具调用（function calling）的行为差异要重新验证；输出格式的稳定性要重新压测；缓存策略失效要重建；微调过的模型完全无法迁移；长任务的失败模式各不相同，要重新摸。\n\n换句话说，成本不在配置里，在验证里。 一个跑在生产环境、有真实用户的应用，切换模型意味着一轮完整的回归测试和灰度发布。这就是模块 02 讲的\"复杂度税\"——而复杂度税是双向的：它既是我们的收入来源，也是我们客户流失的阻力。\n\n202607 实证补充：这个论证后来得到了一个更有力的支撑——Harness 工程。LangChain 创始人 Harrison Chase 的判断是：几乎所有做编程 Agent 的公司都自研 harness，而性能差异并非完全来自模型，而来自对模型在 harness 中工作方式的理解。提示词调优、评测集、trace 分析、上下文压缩策略、子 Agent 协调，全是围绕特定模型行为积累的资产。换模型意味着这套资产要重建一遍——这才是真实的切换成本。 详见模块 19 收录 001。\n\n经验上看，声称\"随时能切\"的团队，绝大多数并不真的切。能力≠意愿≠行动。\n\n 3.3 公链类比在两个关键点上断裂\n\n第一是边际成本（已在 3.1 展开）：出块近乎零边际成本，推理有沉重的边际成本。这决定了两者价格战的终局形态完全不同。\n\n第二是沉淀资产。论点说 LLM \"serverless，用完就走，什么都留不下\"。这话对单次调用成立，对关系不成立。实际在沉淀的东西有：调用数据与评测资产、缓存与上下文、微调权重、企业侧的采购审批与安全评审记录、以及在国内尤其重要的合规资产——备案关系、等保测评、审计留痕（见模块 08）。\n\n在国内市场，合规审批本身就是一道换不动的墙。 一家银行花了三个月过完供应商准入，不会因为另一家便宜 5% 就重来一遍。这一点在纯技术视角的推演里经常被忽略。\n\n 3.4 「能力趋同」是假设，而且只在中段成立\n\n2026 年的实际情况是部分趋同：头部五家（字节、阿里、DeepSeek、百度、智谱）在知识性、推理、长文本这些基础能力上确实已经拉平。\n\n但差异化并没有消失，只是转移了位置——转向了多模态（视频、3D）和 Agent 能力。而这两块恰恰是高价值任务所在。行业评价标准本身也在迁移，从\"能跑多高\"转向\"能干多久\"——即长程任务的稳定性与耐久性，这正是最难趋同的维度。\n\n所以更可能的形态是哑铃结构：中低端彻底商品化，前沿持续分化。论点隐含地假设了完全趋同，那是最有利于其结论的假设，但不是最可能的现实。\n\n 3.5 结论自相矛盾：如果入口为王，独立应用开发者恰恰是最难受的\n\n论点最后说\"最快明年将是 AI 应用开发者的好日子\"。但按它自己的逻辑推下去，结论应该是相反的。\n\n如果价值归于入口，而入口被已有分发能力的巨头把持（Telegram、Google、微信、钉钉、飞书、以及正在抢 AI PC / AI 手机的硬件厂商），那么独立应用开发者是被上下夹击的一层：上面是商品化的模型（没有议价空间也没有差异化来源），下面是掌握分发的平台（决定你能不能触达用户）。\n\n好日子属于\"已经拥有入口的人\"，以及\"平台不屑于进入的垂直纵深领域\"，不属于通用型 AI 应用开发者。 后者做出来的东西，恰恰最容易被入口方原生集成掉。\n\n这不是吹毛求疵——这个矛盾直接影响我们判断该服务哪类客户（见第六节）。\n\n\n\n 四、最不舒服的推论：这套逻辑对我们的杀伤力更大\n\n这一节是本模块的核心，也是决策层必须直面的部分。\n\n论点说：模型厂商的问题是切换成本太低，随时会被换掉。\n\n那么请问：我们是什么？ 我们是模型和客户之间的一层。客户换掉模型厂商需要改一个 URL，客户换掉我们同样只需要改一个 URL。\n\n论点用来论证\"模型厂商没有护城河\"的每一条理由，用在我们身上都成立，而且更严重：\n\n模型厂商至少还有模型能力这个差异化维度，还有自研的沉没成本作为门槛，还有品牌。我们什么都没有——我们卖的东西和上游一模一样，只是价格和服务不同。我们比模型厂商更接近\"纯通道\"，也就更接近\"可被无痛替换\"。\n\n模块 02 第四节已经诚实写过\"0→1 阶段我们几乎没有护城河\"。这个论点把这句话的严重性放大了：在一个所有人都在丧失锁定能力的行业里，最没有锁定能力的那一层是最先被挤掉的。\n\n必须被记住的一条：模块 10 论点 8 说\"不做锁定反而留得住客户\"——这在起步期是对的策略，因为客户不敢进来。但它必须有下半句：不做技术锁定，就必须做能力锁定。 让客户走得动但不想走，靠的是产品深度和数据资产，不是合同条款。这件事有没有做成，是我们三年后还在不在的分水岭。\n\n\n\n 五、它真正指向的风险不是价格战，是脱媒\n\n综合第三节的事实修正和第四节的自我推演，我认为这个论点指出了正确的风险，但指错了机制。\n\n它说的风险机制是：价格卷到零 → 大家一起死 → 只有入口活下来。\n\n真实的风险机制是：模型厂商意识到自己会被商品化 → 于是加速向上游走，自建应用层和开发者生态 → 而它们要争取的开发者，正是我们的客户。\n\n这不是推测。2026 年的公开信息已经显示：厂商在做 MaaS（占 B 端收入超 50%）、做私有化部署、做行业专用模型、做 C 端应用入口、抢 AI PC 与 AI 手机的硬件入口。每一项都在缩短它们与最终客户的距离，也就是在压缩我们的存在空间。\n\n所以对我们真正的威胁排序应该是：\n\n第一，厂商直销下沉。 这是模块 02 第五节列的\"第一种失败方式：被上游抛弃\"，而这个论点让它的紧迫性上升了一个等级。厂商越是往应用层走，越有动力直接服务应用开发者，中间渠道的价值就越薄。\n\n第二，入口方直接与厂商签战略协议。 大型入口（社交、办公、硬件）的采购量足以让它们直接拿到最优价和定制支持，中间层完全没有插入空间。我们注定服务不了最大的那批客户。\n\n第三，自建推理替代 API 采购。（202607 新增，见模块 19 收录 001）开源模型 + 受管运行时 + 自建 harness 跑在企业自有基础设施上，这条路径一旦在受监管行业成为主流，这些客户将不再向任何人采购 token——不是被绕过，是需求本身消失。风险敞口最大的恰恰是我们最看重的金融、法律、医疗类客户。缓冲在于自建有沉重隐性成本、混合架构才是现实形态、且本地开源模型与前沿模型在高价值任务上仍有差距。应对不是抵抗自建，是重新定位：从\"便宜的 token 供应商\"变成\"本地模型干不了的那部分的出口 + 横跨本地与云端的成本核算层\"。\n\n第四，才是价格战。 而且如 3.1 所述，价格战在 2026 年并未如期到来，反而出现了反向的涨价周期。把战略重心押在\"打价格战活下来\"上，是押错了战场。（这与模块 02 第三条基本认知\"0→1 阶段不要打价格战，要打确定性战\"完全一致，此处得到进一步验证。）\n\n\n\n 六、对四条业务线的重新评估\n\n按这套推演，模块 02 的四条业务线价值排序需要调整。\n\n 业务线  原判断  推演后的判断  变化 \n\n 渠道代理  信任资产  中长期贬值。厂商越往下沉，代理身份越不值钱；但短期仍是企业客户准入的敲门砖  ↓ \n 多模型聚合网关  产品与数据资产  价值上升。能力若真趋同，按价格与场景自动路由就是纯增值；且趋同越彻底，路由价值越大  ↑ \n 算力/额度批发分销  现金流引擎  风险显著上升。涨价周期里囤货的风险方向变了——不再只怕降价，还怕拿不到量；且这是最纯粹的通道生意，最先被脱媒  ↓↓ \n 场景化解决方案  终局业务  确认为终局，且时间窗口比原判断更紧  ＝ \n\n其中一个反直觉但重要的结论：能力趋同对我们是好坏参半的。\n\n它摧毁转售价差（模型可互换，客户只比价，毛利被压到底），但放大路由价值（模型可互换，意味着我们可以在客户无感的情况下把请求调度到当下最划算的模型，节省下来的钱可以和客户分成）。\n\n这直接指向一个产品与商业模式的转向：收入应当从\"价差\"迁移到\"软件费 + 节省分成\"。 前者随商品化而消亡，后者随商品化而增强。这是模块 04 第三节\"价值层定价\"应当被提到战略高度的原因。\n\n\n\n 七、无悔动作与情景下注\n\n三年期的行业预测，无论是这个论点还是我的反驳，历史命中率都很低。所以正确的姿态不是赌一个终局，而是分清哪些动作在所有情景下都对，哪些是情景依赖的下注。\n\n 7.1 无悔动作（任何情景下都该做，立即执行）\n\n深度嵌入客户的技术栈。 这是本知识库模块 12–17 的真正战略意义所在——它不只是一份技术资料，它是一份\"我们该嵌进哪里\"的地图。 成为 Dify、FastGPT、OpenClaw、Cline 这类项目文档里的默认/推荐 provider，成为客户接入教程里的示例配置，是这个行业里少数还能积累的分发资产。这件事越早做越值钱，且不依赖任何终局假设。\n\n把成本管理做成客户离不开的工作流。 不是给数据，是给结论和自动化。当客户的预算规则、告警阈值、部门归集、优化策略都建在我们平台上时，切换成本才真正存在。（模块 03 管控层与分析层）\n\n合规资产。 在国内市场，这是唯一一种确定会随时间增值、且开源方案永远补不上的资产。（模块 08、模块 14 第五节）\n\n服务嵌入式 Agent 客户。 论点关于\"嵌入式场景是纯理性采购\"的洞察是对的，而理性采购正是我们的主场——我们提供的恰恰是成本、稳定性、合规这三样。这批客户应当被提到销售优先级的最前面。\n\n 7.2 情景依赖的下注（需要决策层明确表态）\n\n大额囤货批发：只在\"供给紧张、价格上行\"情景下有利，在\"厂商直销下沉\"情景下是纯损失。鉴于 2026 年确实处于涨价周期，这条线短期有机会，但必须严格执行模块 04 第四节的资金上限与周转纪律，且不能作为战略重心。\n\n押注单一厂商的深度绑定：能换取更好的价格与支持，但会在该厂商直销下沉时反噬。与模块 03 铁律一（单一上游不超过 40%）冲突时，以铁律为准。\n\n自建前端应用/入口：如果真的\"入口为王\"，我们理应也去做入口。但这与我们的能力结构相距甚远，且会与客户直接竞争。我的判断是不做——但如果决策层要做，必须清楚这是转型而不是延伸。\n\n\n\n 八、观察指标：什么会证明谁对谁错\n\n把预测变成可检验的东西，是这个模块最实用的部分。 建议按季度检查以下五项，任何一项出现明确信号都应触发战略复盘。\n\n指标一 · 主流模型 API 单价方向。 若持续上行（2026 年当前状态），说明\"电力化\"论证暂时失效，价格战不是主战场；若重新转入单边下行且跌破成本线，说明补贴战重启，批发业务立即收缩。\n\n指标二 · 厂商直销团队的下沉深度。 观察上游是否开始直接争取月消费十万级以下的客户。一旦出现，我们的渠道代理业务进入倒计时，必须加速向解决方案迁移。\n\n指标三 · 头部模型在 Agent 长程任务上的能力差距。 若持续拉大，说明\"完全趋同\"不成立，前沿溢价长期存在，聚合路由的价值下降、选型咨询的价值上升；若快速收敛，则相反。\n\n指标四 · 客户流失原因构成。 若\"找到更便宜的\"占主导，说明我们没有建立起能力锁定，第四节的担忧正在成为现实；若\"业务萎缩\"占主导，说明我们的位置是稳的。这是我们唯一能完全自主观测、且最诚实的指标。\n\n指标五 · 增值服务渗透率。 模块 04 定的目标是 30%。这一项如果长期上不去，意味着我们始终没有跳出通道生意——那么无论行业终局如何，我们都会是被挤掉的那一层。\n\n\n\n 九、一句话结论\n\n论点的方向对、机制错、结论自相矛盾，但它提出的问题是我们必须回答的。\n\n方向对：价值确实在向掌握需求的一端转移，嵌入式 Agent 确实是理性采购的主场。\n\n机制错：价格不会因为无尽烧钱而归零，推理的边际成本有硬底，2026 年实际处于涨价周期；真正的威胁是厂商向上游走带来的脱媒，不是价格战。\n\n结论矛盾：如果入口为王，通用型应用开发者恰恰是被夹击的一层，\"好日子\"属于已握有入口的人和垂直纵深玩家。\n\n而对我们最重要的是那条它没说出口的推论——这套用来否定模型厂商护城河的逻辑，用在我们这一层上更成立。 我们没有模型能力、没有品牌、没有沉没成本，是整条链上最容易被绕过的一环。\n\n所以我们的战略只有一句话：在还能卖 token 的窗口期里，把自己变成客户离不开的东西。 窗口有多长不确定，但它一定在关闭。\n\n\n\n 数据来源\n\n [告别价格战，大模型共迎通胀时代  澎湃新闻](https://www.thepaper.cn/newsDetail_forward_33027436)\n [2026 年中国 AI 竞争格局与商业化趋势分析：梯队重构、价值兑现、生态决胜](https://www.chinaidr.com/tradenews/202605/256348.html)\n [大模型之家 2026 年 5 月热力榜：当「能干多久」取代「能跑多高」  澎湃新闻](https://m.thepaper.cn/newsDetail_forward_33291314)\n [2026 大模型深度解析：泡沫退去，价值落地才是核心战场](https://k.sina.com.cn/article_7857201856_1d45362c001904gpdi.html)\n 内部交叉引用：模块 02（商业模式与护城河）、模块 04（单位经济模型）、模块 08（合规资产）、模块 12–17（客户端技术地图）\n"}, {"id": "19-外部观点收录与研判", "code": "19", "title": "模块 19 · 外部观点收录与研判", "short": "外部观点收录与研判", "subs": ["本模块的方法与规则", "收录 001 · Harness 工程与「核心智能不能外包」", "收录模板（新增条目请复制此结构）", "收录 00X · 标题"], "html": "<h1>模块 19 · 外部观点收录与研判</h1>\n<blockquote>\n<p>本模块解决的问题：把外部看到的行业观点变成可用的判断，并留下修正痕迹。\n使用者：决策层、销售、业务智能体。\n维护方式：流水账式追加，每条一节，编号递增，不删旧条。</p>\n</blockquote>\n<hr />\n<h2>本模块的方法与规则</h2>\n<p>我们会持续从视频、播客、文章、访谈里接触到各种行业观点。<strong>大部分是噪音，少数会改变我们的判断。</strong> 这个模块的作用是把两者分开，并且<strong>留下\"为什么改\"的痕迹</strong>。</p>\n<p>三条硬规则：</p>\n<p><strong>第一，先核对事实，再评估观点。</strong> 转述过程中丢失和扭曲信息是常态。每条收录都必须标注原始出处，并明确列出转述与事实不符的地方。<strong>这不是挑刺，是防止错误信息进入知识库后被当成事实反复引用。</strong></p>\n<p><strong>第二，必须写出提出者的利益立场。</strong> 芯片厂商说\"企业该自建\"、框架公司说\"自建很难该采购\"——这些判断可能都对，但它们都不是中立的。<strong>不分析立场就照单全收，等于让别人的商业利益替我们做决策。</strong></p>\n<p><strong>第三，必须落到\"它改变了什么\"。</strong> 如果一条观点读完之后我们什么都不用改，就明确写\"无需修正\"。<strong>如果它触发了对现有模块的修改，必须在这里留痕</strong>——否则三个月后没人知道模块 01 的价格判断为什么被改过。</p>\n<p>只有战略级别的观点才升格为独立模块（如模块 18），其余留在本模块。</p>\n<hr />\n<h2>收录 001 · Harness 工程与「核心智能不能外包」</h2>\n<p><strong>来源</strong>：黄仁勋与 LangChain 创始人 Harrison Chase 的对话（2026 年 7 月），以及同日发布的 NemoClaw Deep Agents Blueprint。\n<strong>收录日期</strong>：2026-07-27\n<strong>评级</strong>：高。<strong>触发了对模块 02、18 的修正，并识别出一条此前未记录的风险。</strong></p>\n<h3>一、事实核对</h3>\n<p>原始转述中有一处归属需要更正，<strong>这个错误如果留在知识库里会导致销售在客户面前说错话</strong>：</p>\n<p><strong>Deep Agents 是 LangChain 的产品，不是英伟达的。</strong> 准确的关系是：2026 年 7 月 8 日，LangChain 与 NVIDIA <strong>联合发布</strong> NemoClaw Deep Agents Blueprint，它由三层组成——开源模型层 <strong>NVIDIA Nemotron 3 Ultra</strong>、智能体框架层 <strong>LangChain Deep Agents Code（dcode）</strong>、受管运行时 <strong>NVIDIA OpenShell</strong>。OpenShell 负责沙箱化的智能体执行、工具交互、以及系统与数据的访问策略。</p>\n<p>其余转述与公开信息一致：对话确实围绕 Harness 展开，确实提出了\"未来公司将建立在 Harness 之上\"的判断。</p>\n<h3>二、论点骨架</h3>\n<p><strong>Harness 是什么。</strong> 按 Harrison Chase 的定义，它是<strong>比框架更有主张的工程架构</strong>——不只是提供能力，而是对\"该怎么做\"有明确立场。核心构件包括：内置决策机制的规划工具、用于长任务防止信息溢出的上下文压缩、承担状态管理与中间结果存储的文件系统交互、以及主副 Agent 之间的子 Agent 协调。</p>\n<p><strong>为什么它突然重要。</strong> Chase 给出的理由是范式变了：过去几十年软件工程有个稳定前提——<strong>系统行为写在代码里</strong>。Agent 打破了这一点，决定行为的不再只是代码，还有模型这个非确定性黑箱。由此产生三个连锁变化：可验证性从\"读代码就能推断行为\"变成\"必须真的跑一遍才知道它会做什么\"；真相来源从代码变成<strong>代码 + 执行轨迹（trace）</strong>；迭代周期从改代码变成更频繁地调 prompt 和指令。</p>\n<p><strong>最关键的一句判断</strong>（对我们价值最大）：<strong>几乎所有做编程 Agent 的公司现在都自研 harness，性能差异并非完全来自模型，而来自对模型在 harness 中工
