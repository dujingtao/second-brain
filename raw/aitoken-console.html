<title>AI Token 业务管理台 · SpaceTiD</title>
<style>
:root{
  --plane:#060f12; --surface:#0b1417; --surface2:#121f24; --line:#1c2d33; --line2:#273c44;
  --tx:#ffffff; --tx2:#b9c6ca; --tx3:#7d9199;
  /* 图表分类色：固定槽位顺序，已通过 CVD 校验，不得调换或循环 */
  --s1:#189daf; --s2:#d95926; --s3:#8f84e8; --s4:#6aa636; --s5:#d55181; --s6:#c98500;
  --brand:#189daf; --brand-lt:#2bc4da;
  --good:#3fb950; --warn:#e0a33e; --serious:#ec835a; --crit:#e05252;
  --grid:#1c2d33; --axis:#273c44;
  --grad:linear-gradient(115deg,#060f12 0%,#0d3742 42%,#12707d 70%,#4a9c3a 100%);
  --r:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--tx);
  font-family:Inter,Helvetica,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit}
#app{display:flex;min-height:100vh}

/* ---------- sidebar ---------- */
#side{width:236px;flex:0 0 236px;background:var(--surface);border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column}
#logo{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
#logo b{font-size:14px;letter-spacing:.3px;display:block}
#logo span{font-size:11px;color:var(--tx3)}
#menu{padding:10px 10px;flex:1;overflow-y:auto}
.mi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);cursor:pointer;
  color:var(--tx2);font-size:13.5px;border-left:2px solid transparent}
.mi:hover{background:var(--surface2);color:var(--tx)}
.mi.on{background:var(--surface2);color:var(--tx);border-left-color:var(--brand)}
.mi i{font-style:normal;width:18px;text-align:center;opacity:.85}
#sfoot{padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--tx3)}

/* ---------- main ---------- */
#main{flex:1;min-width:0;max-width:1440px}
h2.page{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
p.sub{margin:0 0 22px;color:var(--tx3);font-size:13px}
.view{display:none}
.view.on{display:block}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card>h3{margin:0 0 2px;font-size:14px;font-weight:600}
.card>p.cap{margin:0 0 16px;font-size:12px;color:var(--tx3)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1200px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}

/* ---------- stat tiles ---------- */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.tile .lbl{font-size:12px;color:var(--tx3);margin-bottom:6px}
.tile .val{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.2}
.tile .val small{font-size:14px;color:var(--tx2);font-weight:400;margin-left:2px}
.tile .dl{font-size:12px;margin-top:5px;display:flex;align-items:center;gap:5px;color:var(--tx3)}
.up{color:var(--good)} .down{color:var(--crit)}
.tile svg{margin-top:8px;display:block}

/* ---------- table ---------- */
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;padding:9px 12px;color:var(--tx2);font-weight:600;
  border-bottom:1px solid var(--line2);white-space:nowrap;font-size:12px}
td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--tx2);
  font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--surface2)}
td.num,th.num{text-align:right}
td b{color:var(--tx);font-weight:600}
.tw{overflow-x:auto}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;
  font-size:11.5px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.chip.good{border-color:rgba(63,185,80,.45);color:#67d178}
.chip.warn{border-color:rgba(224,163,62,.5);color:#eec078}
.chip.serious{border-color:rgba(236,131,90,.45);color:#f0a183}
.chip.crit{border-color:rgba(224,82,82,.55);color:#ef8686}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}

/* ---------- forms ---------- */
label.f{display:block;font-size:12px;color:var(--tx3);margin:0 0 5px}
input.f,select.f{width:100%;padding:8px 11px;background:var(--surface2);border:1px solid var(--line2);
  border-radius:var(--r);color:var(--tx);outline:none;font-variant-numeric:tabular-nums}
input.f:focus,select.f:focus{border-color:var(--brand)}
.fr{margin-bottom:13px}
.btn{white-space:nowrap;padding:8px 16px;border-radius:var(--r);border:1px solid var(--line2);background:var(--surface2);
  color:var(--tx);cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:6px}
.btn.dg{color:#ef8686;border-color:rgba(224,82,82,.45)}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .sp{flex:1}

/* ---------- chart ---------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font-size:12px;color:var(--tx2)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}
.chartbox{position:relative}
#tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line2);
  border-radius:var(--r);padding:9px 12px;font-size:12px;color:var(--tx);z-index:99;display:none;
  box-shadow:0 8px 28px rgba(0,0,0,.6);font-variant-numeric:tabular-nums;max-width:260px}
#tip .th{color:var(--tx3);font-size:11px;margin-bottom:5px}
#tip .tr{display:flex;justify-content:space-between;gap:16px}
#tip .tr i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}
.tvw{display:none;margin-top:14px}
.tvw.on{display:block}
.tglt{background:none;border:none;color:var(--tx3);font-size:11.5px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;padding:0}
.tglt:hover{color:var(--brand-lt)}

/* ---------- misc ---------- */
.hero{font-size:44px;font-weight:600;letter-spacing:-1.2px;line-height:1.1}
.note{background:var(--surface2);border-left:2px solid var(--brand);border-radius:0 8px 8px 0;
  padding:11px 15px;font-size:12.5px;color:var(--tx2);margin:14px 0}
.note b{color:var(--tx)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--tx3)} .kv b{font-variant-numeric:tabular-nums}
.big{font-size:17px}
.mono{font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--tx3);font-size:13px}

/* ---------- 品牌页眉与 Hero ---------- */
#logo{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
#mark{display:block;width:max-content;margin:0 0 12px -5px;padding:3px 5px;
  text-decoration:none;transition:.15s;border-radius:var(--r)}
#mark img{width:138px;display:block;transition:.15s}
#mark[href]{cursor:pointer} #mark:not([href]){cursor:default}
#mark[href]:hover{background:var(--surface2)}
#mark[href]:hover img{opacity:.8}
#hero{background:var(--grad);padding:32px 34px 28px;position:relative}
#hero .kicker{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.7);
  text-transform:uppercase;margin-bottom:8px}
#hero h2{margin:0;font-size:27px;font-weight:700;color:#fff;letter-spacing:.5px;line-height:1.3}
#hero p{margin:9px 0 0;font-size:13px;color:rgba(255,255,255,.78);max-width:720px}
#hero .cls{position:absolute;top:20px;right:26px;font-size:11px;letter-spacing:1.5px;
  color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.28);
  border-radius:var(--r);padding:3px 11px}
#content{padding:24px 34px 60px}
#pfoot{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--tx3);line-height:1.9;display:flex;
  justify-content:space-between;gap:20px;flex-wrap:wrap}
#pfoot b{color:var(--tx2);font-weight:600}
@media(max-width:900px){#hero{padding:26px 20px 22px}#hero h2{font-size:22px}#content{padding:20px 20px 50px}}
</style>
</head>
<body>
<div id="tip"></div>
<div id="app">
  <aside id="side">

/* ==========================================================================
   2. 计算层
   ========================================================================== */
const fmtY = n => '¥' + Math.round(n).toLocaleString('zh-CN');
const fmtK = n => n>=10000 ? (n/10000).toFixed(1)+'万' : Math.round(n).toLocaleString('zh-CN');
const pct = n => (n*100).toFixed(1) + '%';

// 单客户贡献毛利
function contrib(c){
  const gross = c.rev - c.cost;
  const tech  = c.rev * DB.meta.techRate;
  const serv  = c.rev * SI[c.si].r;
  const risk  = c.rev * DB.meta.riskRate;
  const cm    = gross - tech - serv - risk;
  return {gross, gm: c.rev? gross/c.rev:0, tech, serv, risk, cm, cmr: c.rev? cm/c.rev:0};
}
// 健康度判定（对应知识库模块04）
function health(r){
  if(r>0.20) return {k:'优质', cls:'good',    act:'重点维护，争取扩量与增值服务'};
  if(r>0.10) return {k:'健康', cls:'good',    act:'正常服务，寻找优化空间'};
  if(r>0.03) return {k:'薄利', cls:'warn',    act:'降低服务强度，引导自助化'};
  if(r>0)    return {k:'临界', cls:'serious', act:'提价或缩减服务，限期改善'};
  return           {k:'失血', cls:'crit',     act:'三个月内改善或主动退出'};
}
function approval(gm){
  if(gm>=0.15) return '销售自主';
  if(gm>=0.10) return '销售主管审批';
  if(gm>=0.08) return '业务负责人审批';
  return '决策层审批（需战略理由）';
}
// 汇总
function totals(){
  const rev = DB.customers.reduce((s,c)=>s+c.rev,0);
  const cost= DB.customers.reduce((s,c)=>s+c.cost,0);
  let cm=0; DB.customers.forEach(c=>cm+=contrib(c).cm);
  const byType = {};
  Object.keys(CT).forEach(k=>byType[k]=0);
  DB.customers.forEach(c=>byType[c.type]+=c.rev);
  // 月度序列
  const last = DB.months.length-1;
  const series = DB.months.map((m,i)=>{
    const r = DB.customers.reduce((s,c)=>s+(c.m[i]||0),0)*1000;
    // 当期月份用真实成本口径；历史月份用记录的成本占比
    const ratio = i===last ? (rev? cost/rev : .87)
                           : (DB.meta.costRatio && DB.meta.costRatio[i]!=null ? DB.meta.costRatio[i] : .87);
    return {m, rev:r, cost:r*ratio, gross:r*(1-ratio)};
  });
  return {rev, cost, gross:rev-cost, gm: rev?(rev-cost)/rev:0, cm, cmr: rev?cm/rev:0, byType, series};
}
// 风险扫描（对应知识库模块04/05/08 的红线）
function risks(){
  const t = totals(); const out=[];
  DB.customers.forEach(c=>{
    const k = contrib(c);
    if(k.cmr<=0) out.push({lv:'crit',t:`${c.name} 贡献毛利为负`,d:`贡献毛利率 ${pct(k.cmr)}，服务强度「${SI[c.si].n}」。按模块04应限期改善或主动退出。`});
    else if(k.cmr<0.03) out.push({lv:'serious',t:`${c.name} 贡献毛利临界`,d:`贡献毛利率 ${pct(k.cmr)}，建议提价或降低服务强度。`});
    if(t.rev && c.rev/t.rev>0.15) out.push({lv:'warn',t:`${c.name} 收入集中度过高`,d:`占总收入 ${pct(c.rev/t.rev)}，超过 15% 红线，该客户已具备定价权。`});
    const n=c.m.length;
    if(n>=3 && c.m[n-1]<c.m[n-3]*0.7 && c.m[n-3]>0) out.push({lv:'serious',t:`${c.name} 用量持续下降`,d:`近两月降幅超 30%，属流失预警信号，需 48 小时内直接联系对接人。`});
  });
  Object.keys(CT).forEach(k=>{
    if(t.rev && t.byType[k]/t.rev>0.40)
      out.push({lv:'warn',t:`客户结构失衡：${CT[k]}`,d:`占总收入 ${pct(t.byType[k]/t.rev)}，超过 40% 上限，抗风险能力不足。`});
  });
  const ar = DB.agents.reduce((s,a)=>s+a.q,0);
  DB.agents.forEach(a=>{ if(ar && a.q/ar>0.20)
    out.push({lv:'warn',t:`渠道依赖：${a.name}`,d:`占渠道采购 ${pct(a.q/ar)}，超过 20% 上限，存在带客迁移风险。`}); });
  const order = {crit:0,serious:1,warn:2};
  return out.sort((a,b)=>order[a.lv]-order[b.lv]);
}

/* ==========================================================================
   3. 图表层（原生 SVG；遵循细笔触 / 2px 间隙 / 悬停提示 / 表格视图）
   ========================================================================== */
const CV = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const tip = document.getElementById('tip');
function showTip(e, html){
  tip.innerHTML = html; tip.style.display='block';
  const r = tip.getBoundingClientRect();
  let x = e.clientX+14, y = e.clientY-10;
  if(x+r.width>innerWidth-10) x = e.clientX-r.width-14;
  if(y+r.height>innerHeight-10) y = innerHeight-r.height-10;
  tip.style.left=x+'px'; tip.style.top=Math.max(10,y)+'px';
}
const hideTip = ()=> tip.style.display='none';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svgEl = (t,a)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',t);
  for(const k in a) e.setAttribute(k,a[k]); return e;};

/* 堆叠柱：成本 + 毛利 = 收入。段间 2px 表面间隙，数据端 4px 圆角。 */
function stackedColumn(host, data, ser){
  host.innerHTML='';
  const W = host.clientWidth||760, H = 250, PL=54, PR=14, PT=14, PB=30;
  const iw = W-PL-PR, ih = H-PT-PB;
  const max = Math.max(...data.map(d=>ser.reduce((s,k)=>s+d[k.key],0)))*1.12 || 1;
  const svg = svgEl('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
  // 网格：实线细发丝
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const y = PT+ih-ih*i/ticks;
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:CV('--grid'),'stroke-width':1}));
    const tl = svgEl('text',{x:PL-9,y:y+4,'text-anchor':'end',fill:CV('--tx3'),
      'font-size':10.5,'font-variant-numeric':'tabular-nums'});
    tl.textContent = fmtK(max*i/ticks); svg.appendChild(tl);
  }
  svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:PT+ih,y2:PT+ih,stroke:CV('--axis'),'stroke-width':1}));
  const step = iw/data.length, bw = Math.min(46, step*0.54);
  data.forEach((d,i)=>{
    const cx = PL+step*i+step/2, x = cx-bw/2;
    let acc = 0;
    ser.forEach((s,si)=>{
      const v = d[s.key]; if(v<=0) return;
      const h = ih*v/max;
      const y = PT+ih-h-acc;
      // 段间 2px 表面间隙（非上层段扣掉 2px）
      const gap = si<ser.length-1 ? 2 : 0;
      const isTop = si===ser.length-1;
      const r = isTop ? 4 : 0;
      const hh = Math.max(1,h-gap);
      const p = svgEl('path',{d:roundTop(x, y+gap, bw, hh, r), fill:CV(s.color)});
      p.style.cursor='pointer';
      p.addEventListener('mousemove',e=>{
        const tot = ser.reduce((t,k)=>t+d[k.key],0);
        showTip(e, `<div class="th">${esc(d.m)}</div>`+
          ser.map(k=>`<div class="tr"><span><i style="background:${CV(k.color)}"></i>${k.name}</span><b>${fmtY(d[k.key])}</b></div>`).join('')+
          `<div class="tr" style="margin-top:5px;padding-top:5px;border-top:1px solid #333"><span>收入合计</span><b>${fmtY(tot)}</b></div>`+
          `<div class="tr"><span>毛利率</span><b>${pct(tot?d.gross/tot:0)}</b></div>`);
      });
      p.addEventListener('mouseleave',hideTip);
      svg.appendChild(p);
      acc += h;
    });
    const xl = svgEl('text',{x:cx,y:H-9,'text-anchor':'middle',fill:CV('--tx3'),
      'font-size':10.5,'font-variant-numeric':'tabular-nums'});
    xl.textContent = d.m.slice(5); svg.appendChild(xl);
  });
  host.appendChild(svg);
}
function roundTop(x,y,w,h,r){
  r = Math.min(r,w/2,h);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}

/* 折线：单序列毛利率，端点直标 */
function lineChart(host, data, key, color, fmt){
  host.innerHTML='';
  const W = host.clientWidth||760, H=190, PL=48, PR=54, PT=16, PB=28;
  const iw=W-PL-PR, ih=H-PT-PB;
  const vs = data.map(d=>d[key]);
  const lo = Math.min(...vs)*0.9, hi = Math.max(...vs)*1.1 || 1;
  const X = i => PL+iw*i/Math.max(1,data.length-1);
  const Y = v => PT+ih-ih*(v-lo)/((hi-lo)||1);
  const svg = svgEl('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
  for(let i=0;i<=3;i++){
    const y=PT+ih-ih*i/3;
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:CV('--grid'),'stroke-width':1}));
    const t=svgEl('text',{x:PL-9,y:y+4,'text-anchor':'end',fill:CV('--tx3'),'font-size':10.5,
      'font-variant-numeric':'tabular-nums'});
    t.textContent=fmt(lo+(hi-lo)*i/3); svg.appendChild(t);
  }
  svg.appendChild(svgEl('polyline',{points:data.map((d,i)=>`${X(i)},${Y(d[key])}`).join(' '),
    fill:'none',stroke:CV(color),'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
  data.forEach((d,i)=>{
    const c = svgEl('circle',{cx:X(i),cy:Y(d[key]),r:4.5,fill:CV(color),
      stroke:CV('--surface'),'stroke-width':2});
    const hit = svgEl('circle',{cx:X(i),cy:Y(d[key]),r:14,fill:'transparent'});
    hit.style.cursor='pointer';
    hit.addEventListener('mousemove',e=>showTip(e,
      `<div class="th">${esc(d.m)}</div><div class="tr"><span><i style="background:${CV(color)}"></i>毛利率</span><b>${fmt(d[key])}</b></div>`));
    hit.addEventListener('mouseleave',hideTip);
    svg.appendChild(c); svg.appendChild(hit);
    const xl=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',fill:CV('--tx3'),'font-size':10.5,
      'font-variant-numeric':'tabular-nums'});
    xl.textContent=d.m.slice(5); svg.appendChild(xl);
  });
  // 端点直标（选择性直标，非每点标注）
  const last=data[data.length-1];
  const el=svgEl('text',{x:X(data.length-1)+11,y:Y(last[key])+4,fill:CV('--tx2'),'font-size':12,
    'font-weight':600,'font-variant-numeric':'tabular-nums'});
  el.textContent=fmt(last[key]); svg.appendChild(el);
  host.appendChild(svg);
}

/* 水平堆叠条：客户结构占比 */
function stackedBarH(host, items, total){
  host.innerHTML='';
  const W=host.clientWidth||760, H=54, R=8;
  const svg=svgEl('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
  let x=0;
  items.forEach((it,i)=>{
    const w = total? (W*it.v/total) : 0;
    const ww = Math.max(0, w - (i<items.length-1?2:0)); // 2px 表面间隙
    if(ww<=0) return;
    const first=i===0, last=i===items.length-1;
    const p=svgEl('path',{d:roundSide(x,10,ww,26,R,first,last),fill:CV(it.color)});
    p.style.cursor='pointer';
    p.addEventListener('mousemove',e=>showTip(e,
      `<div class="th">客户结构</div><div class="tr"><span><i style="background:${CV(it.color)}"></i>${it.name}</span><b>${fmtY(it.v)}</b></div>`+
      `<div class="tr"><span>占比</span><b>${pct(total?it.v/total:0)}</b>`+
      (total&&it.v/total>0.4?`</div><div class="tr" style="color:#f6c85a">⚠ 超过 40% 上限`:'')+`</div>`));
    p.addEventListener('mouseleave',hideTip);
    svg.appendChild(p);
    // 仅在放得下时做段内直标，否则交给图例与表格视图
    const share = total? it.v/total : 0;
    if(ww>52){
      const t=svgEl('text',{x:x+ww/2,y:27,'text-anchor':'middle',fill:'#fff','font-size':11,
        'font-weight':600});
      t.textContent=pct(share); svg.appendChild(t);
    }
    x += w;
  });
  host.appendChild(svg);
}
function roundSide(x,y,w,h,r,l,rt){
  r=Math.min(r,w/2,h/2);
  const rl=l?r:0, rr=rt?r:0;
  return `M${x+rl},${y} L${x+w-rr},${y} Q${x+w},${y} ${x+w},${y+rr} L${x+w},${y+h-rr} Q${x+w},${y+h} ${x+w-rr},${y+h} L${x+rl},${y+h} Q${x},${y+h} ${x},${y+h-rl} L${x},${y+rl} Q${x},${y} ${x+rl},${y} Z`;
}

/* 迷你走势线（统计磁贴内） */
function spark(vals, color, w=150, h=30){
  const lo=Math.min(...vals), hi=Math.max(...vals), rg=(hi-lo)||1;
  const pts=vals.map((v,i)=>`${(w*i/Math.max(1,vals.length-1)).toFixed(1)},${(h-2-(h-4)*(v-lo)/rg).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none"
    stroke="${CV(color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* 漏斗：有序刻度 → 单色阶梯（暗色下不深于 step600） */
const ORD = ['#cde2fb','#9ec5f4','#6da7ec','#3987e5','#256abf','#184f95'];
function funnel(host, rows){
  host.innerHTML='';
  const W=host.clientWidth||700, rowH=44, H=rows.length*rowH+10;
  const max=Math.max(...rows.map(r=>r.amt))||1;
  const LW=120, PR=110;
  const svg=svgEl('svg',{width:'100%',height:H,viewBox:`0 0 ${W} ${H}`});
  rows.forEach((r,i)=>{
    const y=i*rowH+8, w=Math.max(2,(W-LW-PR)*r.amt/max);
    const p=svgEl('path',{d:roundSide(LW,y,w,26,4,true,true),fill:ORD[i]});
    p.style.cursor='pointer';
    p.addEventListener('mousemove',e=>showTip(e,
      `<div class="th">${esc(r.name)}</div><div class="tr"><span>商机金额</span><b>${fmtY(r.amt)}</b></div>`+
      `<div class="tr"><span>商机数</span><b>${r.n} 个</b></div>`));
    p.addEventListener('mouseleave',hideTip);
    svg.appendChild(p);
    const t=svgEl('text',{x:LW-12,y:y+18,'text-anchor':'end',fill:CV('--tx2'),'font-size':12.5});
    t.textContent=r.name; svg.appendChild(t);
    const v=svgEl('text',{x:LW+w+10,y:y+18,fill:CV('--tx3'),'font-size':11.5,
      'font-variant-numeric':'tabular-nums'});
    v.textContent=`${fmtY(r.amt)} · ${r.n}个`; svg.appendChild(v);
  });
  host.appendChild(svg);
}

        <h3>测算结果</h3>
        <p class="cap">贡献毛利率决定客户健康度分级与报价审批层级。</p>
        <div id="out"></div>
      </div>
      <div class="card">
        <h3>增值服务叠加</h3>
        <p class="cap">按帮客户节省金额分成 —— 这是把薄毛利订单拉回健康区间的主要杠杆。</p>
        <div class="grid g2">
          <div class="fr"><label class="f">预计月节省（元）</label><input class="f" id="sv" value="0" oninput="calc()"></div>
          <div class="fr"><label class="f">分成比例</label><input class="f" id="sr" value="0.20" oninput="calc()"></div>
        </div>
        <div id="out2"></div>
      </div>
    </div>
  </div>
  <div class="note"><b>使用提醒：</b>官方价格变动频繁，采集日 ${DB.meta.updated}。超过 30 天未复核的价格默认视为过期，报价前请核对官网。</div>`;
}
function pickModel(){
  const m=DB.models.find(x=>x.id===document.getElementById('cm').value); if(!m) return;
  document.getElementById('pi').value=m.pin;
  document.getElementById('po').value=m.pout;
  document.getElementById('pc').value=m.pcache;
  document.getElementById('ds').value=m.sell;
  document.getElementById('db').value=m.buy;
  calc();
}
function calc(){
  const g=id=>+document.getElementById(id).value||0;
  const ti=g('ti'),to=g('to'),tc=g('tc'),pi=g('pi'),po=g('po'),pc=g('pc');
  const ds=g('ds'),db=g('db'),tr=g('tr'),rr=g('rr');
  const sir=SI[document.getElementById('si').value].r;
  const rev  = ti*pi*ds + to*po*ds + tc*pc*ds;
  const buy  = ti*pi*db + to*po*db + tc*pc*db;
  const gross= rev-buy;
  const tech = rev*tr, serv = rev*sir, risk = rev*rr;
  const cm   = gross-tech-serv-risk;
  const gmr  = rev? gross/rev : 0, cmr = rev? cm/rev : 0;
  const h    = health(cmr);
  const listPrice = ti*pi + to*po + tc*pc;
  document.getElementById('out').innerHTML = `
    <div style="margin-bottom:14px"><div style="font-size:12px;color:var(--tx3)">贡献毛利</div>
      <div class="hero" style="color:${cm>=0?'var(--tx)':'#e97676'}">${fmtY(cm)}</div>
      <div style="margin-top:6px"><span class="chip ${h.cls}"><span class="dot"></span>${h.k}</span>
      <span style="color:var(--tx3);font-size:12px;margin-left:8px">${h.act}</span></div></div>
    <div class="kv"><span>按官方原价计</span><b>${fmtY(listPrice)}</b></div>
    <div class="kv"><span>对客收入（${pct(ds)} 官方价）</span><b class="big">${fmtY(rev)}</b></div>
    <div class="kv"><span>采购成本（${pct(db)} 官方价）</span><b>−${fmtY(buy)}</b></div>
    <div class="kv"><span>订单毛利</span><b class="big">${fmtY(gross)} · ${pct(gmr)}</b></div>
    <div class="kv"><span>技术成本</span><b>−${fmtY(tech)}</b></div>
    <div class="kv"><span>服务成本</span><b>−${fmtY(serv)}</b></div>
    <div class="kv"><span>风险计提</span><b>−${fmtY(risk)}</b></div>
    <div class="kv"><span>贡献毛利率</span><b class="big" style="color:${cmr>0.03?'#5fd35f':'#e97676'}">${pct(cmr)}</b></div>
    <div class="kv"><span>报价审批层级</span><b>${approval(gmr)}</b></div>
    <div class="kv"><span>客户可省（相对官方价）</span><b>${fmtY(listPrice-rev)} · ${pct(listPrice?1-rev/listPrice:0)}</b></div>`;
  const sv=g('sv'), sr=g('sr'), extra=sv*sr;
  const cm2=cm+extra, rev2=rev+extra;
  const h2=health(rev2?cm2/rev2:0);
  document.getElementById('out2').innerHTML = extra>0 ? `
    <div class="kv"><span>增值服务收入</span><b>+${fmtY(extra)}</b></div>
    <div class="kv"><span>叠加后贡献毛利</span><b class="big">${fmtY(cm2)}</b></div>
    <div class="kv"><span>叠加后贡献毛利率</span><b class="big" style="color:#5fd35f">${pct(rev2?cm2/rev2:0)}</b></div>
    <div class="kv"><span>健康度变化</span><b><span class="chip ${h.cls}"><span class="dot"></span>${h.k}</span>
      → <span class="chip ${h2.cls}"><span class="dot"></span>${h2.k}</span></b></div>`
    : `<div class="empty">填入预计月节省金额，查看增值服务对贡献毛利的拉动效果</div>`;
}

    <div class="tile"><div class="lbl">应结分润</div>
      <div class="val">${fmtY(DB.agents.reduce((a,b)=>a+b.q*b.rate,0))}</div>

  </div>

    <thead><tr><th>代理商</th><th>层级</th><th class="num">季度采购</th><th class="num">占比</th>
      <th class="num">分润比例</th><th class="num">应结分润</th><th class="num">终端客户</th><th>上次结算</th><th>状态</th></tr></thead>
    <tbody>${DB.agents.slice().sort((a,b)=>b.q-a.q).map(a=>{
      const share = tot? a.q/tot : 0;
      return `<tr><td><b>${esc(a.name)}</b></td><td><span class="chip">${a.tier}</span></td>
      <td class="num">${fmtY(a.q)}</td>
      <td class="num">${share>0.2?`<span style="color:#f6c85a">${pct(share)} ⚠</span>`:pct(share)}</td>
      <td class="num">${pct(a.rate)}</td><td class="num"><b>${fmtY(a.q*a.rate)}</b></td>
      <td class="num">${a.cust}</td><td class="mono">${a.settled}</td>
      <td><span class="chip ${a.status==='正常'?'good':'warn'}"><span class="dot"></span>${a.status}</span></td></tr>`;
    }).join('')}</tbody></table></div></div>
  <div class="card"><h3>分级政策</h3>
    <table><thead><tr><th>层级</th><th>准入要求</th><th>权益</th><th>管理动作</th></tr></thead><tbody>
      <tr><td><b>注册代理</b></td><td>线上注册，无预付</td><td>推荐返佣，返佣期 12 个月</td><td>全自助，管理成本趋零</td></tr>
      <tr><td><b>授权代理</b></td><td>正式协议 + 预付或年度承诺量 + 资质审核</td><td>阶梯折扣拿货，自主定价</td><td>配备渠道经理，季度评估</td></tr>
      <tr><td><b>战略伙伴</b></td><td>高预付 + 完整资质与业务尽调</td><td>最深折扣、白标、独立结算、区域/行业保护</td><td>严格控制数量，宁少勿滥</td></tr>
    </tbody></table>
    <div class="note"><b>红线：</b>任何层级的折扣都必须给公司留出不低于 8% 的毛利空间（已扣渠道支持人力成本）；分级需按季度评估且降级必须真的执行，否则会积压只享折扣不产出的僵尸伙伴。</div>
  </div>`;
}

/* ---------- 上游价格表 ---------- */
function vPrice(){
  return `
  <h2 class="page">上游价格表</h2>
  <p class="sub">采集日 ${DB.meta.updated} · 单位：元 / 百万 token · 超过 30 天未复核视为过期</p>
  <div class="card" style="padding:6px 0 0"><div class="tw"><table>
    <thead><tr><th>模型</th><th>厂商</th><th class="num">官方输入价</th><th class="num">官方输出价</th>
      <th class="num">缓存价</th><th class="num">采购折扣</th><th class="num">对客折扣</th>
      <th class="num">理论毛利率</th><th></th></tr></thead>
    <tbody>${DB.models.map(m=>{
      const gm = m.sell? (m.sell-m.buy)/m.sell : 0;
      return `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.vendor)}</td>
      <td class="num">${m.pin}</td><td class="num">${m.pout}</td><td class="num">${m.pcache}</td>
      <td class="num">${pct(m.buy)}</td><td class="num">${pct(m.sell)}</td>
      <td class="num"><b style="color:${gm>=0.10?'#5fd35f':gm>0?'#f6c85a':'var(--tx3)'}">${pct(gm)}</b></td>
      <td><button class="btn sm" onclick="editPrice('${m.id}')">改价</button></td></tr>`;
    }).join('')}</tbody></table></div></div>
  <div class="note"><b>结构解读：</b>价格带已形成三层结构 —— 0.3–0.8 元的走量层、2–5 元的主力层、5–15 元的旗舰层。
  免费额度已是标配获客手段，意味着最底层通用问答场景基本没有转售利润，利润必须来自中高层。</div>`;
}
function editPrice(id){
  const m=DB.models.find(x=>x.id===id); if(!m) return;
  const pin=prompt(`${m.name} 官方输入价 元/M`, m.pin); if(pin===null) return;
  const pout=prompt(`${m.name} 官方输出价 元/M`, m.pout); if(pout===null) return;
  const buy=prompt(`${m.name} 我方采购折扣（0-1）`, m.buy);
  const sell=prompt(`${m.name} 对客折扣（0-1）`, m.sell);
  m.pin=+pin||0; m.pout=+pout||0;
  if(buy!==null) m.buy=+buy||m.buy;
  if(sell!==null) m.sell=+sell||m.sell;
  DB.meta.updated = new Date().toISOString().slice(0,10);
  render();
}

function vData(){
  return `
  <h2 class="page">数据管理</h2>
  <p class="sub">本工具为单文件原型，数据保存在内存中，刷新即重置。请用导出功能留档。</p>
  <div class="card">
    <h3>导出 / 导入</h3>
    <p class="cap">导出为 JSON 文件；下次打开工具后导入即可恢复。</p>
    <div class="bar">
      <button class="btn pri" onclick="expJSON()">导出全部数据（JSON）</button>
      <button class="btn" onclick="expCSV()">导出客户表（CSV）</button>
      <button class="btn" onclick="document.getElementById('imp').click()">导入 JSON</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="impJSON(event)">
      <button class="btn dg" onclick="if(confirm('确定清空所有业务数据？'))resetDB()">清空数据</button>
    </div>
  </div>
  <div class="card">
    <h3>全局参数</h3>
    <p class="cap">影响所有贡献毛利与健康度计算。</p>
    <div class="grid g3">
      <div class="fr"><label class="f">技术成本率</label>
        <input class="f" value="${DB.meta.techRate}" onchange="DB.meta.techRate=+this.value||0;render()"></div>
      <div class="fr"><label class="f">风险计提率</label>
        <input class="f" value="${DB.meta.riskRate}" onchange="DB.meta.riskRate=+this.value||0;render()"></div>
      <div class="fr"><label class="f">价格采集日</label>
        <input class="f" value="${DB.meta.updated}" onchange="DB.meta.updated=this.value;render()"></div>
    </div>
  </div>
  <div class="card">
    <h3>与知识库的对应关系</h3>
    <table><thead><tr><th>本工具功能</th><th>依据的知识库模块</th></tr></thead><tbody>
      <tr><td>贡献毛利与健康度分级</td><td>模块 04 · 定价体系与单位经济模型</td></tr>
      <tr><td>报价审批层级</td><td>模块 04 · 第三节报价审批权限</td></tr>
      <tr><td>客户结构与集中度预警</td><td>模块 05 · 客户结构健康标准</td></tr>
      <tr><td>商机阶段划分</td><td>模块 09 · 客户全生命周期六阶段</td></tr>
      <tr><td>流失预警信号</td><td>模块 09 · 客户流失预警与挽回</td></tr>
      <tr><td>代理分级与分润红线</td><td>模块 07 · 渠道与代理商体系</td></tr>
      <tr><td>预付款分账提示</td><td>模块 08 · 合规与风险控制</td></tr>
    </tbody></table>
  </div>`;
}
function dl(name, content, mime){
  const b=new Blob([content],{type:mime}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function expJSON(){ dl('aitoken-业务数据-'+new Date().toISOString().slice(0,10)+'.json',
  JSON.stringify(DB,null,2), 'application/json'); }
function expCSV(){
  const head=['客户','类型','场景','月收入','采购成本','毛利率','服务强度','贡献毛利','贡献毛利率','健康度','负责人'];
  const rows=DB.customers.map(c=>{const k=contrib(c);
    return [c.name,CT[c.type],c.scene,c.rev,c.cost,pct(k.gm),SI[c.si].n,Math.round(k.cm),pct(k.cmr),health(k.cmr).k,c.owner];});
  dl('客户明细-'+new Date().toISOString().slice(0,10)+'.csv',
    '﻿'+[head,...rows].map(r=>r.join(',')).join('\n'),'text/csv');
}
function impJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!d.customers) throw 0; DB=d; render(); alert('导入成功'); }
    catch(_){ alert('文件格式不正确'); } };
  r.readAsText(f);
}
function resetDB(){
  DB.customers=[]; DB.deals=[]; DB.orders=[]; DB.agents=[]; render();
}

/* ---------- 启动 ---------- */
if(location.protocol==='file:') document.getElementById('mark').removeAttribute('href');
render();
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
  if(VIEW==='dash')drawDash(); if(VIEW==='pipe')drawPipe();},180);});
</script>
